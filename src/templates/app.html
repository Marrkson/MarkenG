<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPelico – Lernnavigator Markenrecht</title>
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
<meta name="theme-color" content="#1482e3">
<style>
:root{
  --bg:#f7f6f2;--panel:#ffffff;--ink:#1e2124;--muted:#5f6670;--line:#e3e0d8;--accent:#8a2f1f;--accent-soft:#f6e6e1;
  --norm:#2b5b8a;--norm-soft:#e4edf7;--case:#6a4c93;--case-soft:#ece5f5;--concept:#8a2f1f;--concept-soft:#f6e6e1;
  --schema:#2f6b4f;--schema-soft:#e2f0e8;--dist:#a56b00;--dist-soft:#f8efd9;--source:#4b6b6b;--source-soft:#e3eeee;
  --ok:#2f6b4f;--bad:#a83b2a;--radius:10px;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a;--panel:#1e2126;--ink:#e8e6e1;--muted:#a3a8b0;--line:#30343a;--accent:#e0866f;--accent-soft:#3a2622;
    --norm:#8db7e6;--norm-soft:#20303f;--case:#b89ee0;--case-soft:#2c2540;--concept:#e0866f;--concept-soft:#3a2622;
    --schema:#7fc4a0;--schema-soft:#1f3329;--dist:#e2b45a;--dist-soft:#3a2f18;--source:#8fb8b8;--source-soft:#1f2e2e;
    --ok:#7fc4a0;--bad:#e08a7a;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a;--panel:#1e2126;--ink:#e8e6e1;--muted:#a3a8b0;--line:#30343a;--accent:#e0866f;--accent-soft:#3a2622;
  --norm:#8db7e6;--norm-soft:#20303f;--case:#b89ee0;--case-soft:#2c2540;--concept:#e0866f;--concept-soft:#3a2622;
  --schema:#7fc4a0;--schema-soft:#1f3329;--dist:#e2b45a;--dist-soft:#3a2f18;--source:#8fb8b8;--source-soft:#1f2e2e;
  --ok:#7fc4a0;--bad:#e08a7a;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Source Serif 4",Georgia,"Times New Roman",serif}
a{color:var(--norm)}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;padding:10px 18px}
header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.01em;white-space:nowrap}
header h1 small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
#q{flex:1;max-width:520px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
#layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 54px)}
nav{border-right:1px solid var(--line);padding:16px 12px;background:var(--panel)}
nav a{display:block;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink);margin-bottom:2px}
nav a.active,nav a:hover{background:var(--accent-soft);color:var(--accent)}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 10px 6px}
main{padding:22px 34px 80px;max-width:1080px}
h2{font-size:24px;margin:0 0 6px;font-weight:600}
h3{font-size:17px;margin:22px 0 8px;font-weight:600}
.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin:10px 0}
.card h4{margin:0 0 6px;font-size:16px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-right:4px;font-family:system-ui,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{display:inline-flex;align-items:center;gap:5px;font:13px/1.2 system-ui,sans-serif;padding:4px 10px;border-radius:20px;border:1px solid transparent;cursor:pointer;user-select:none}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.chip.concept{background:var(--concept-soft);color:var(--concept)}
.chip.norm,.chip.eunorm{background:var(--norm-soft);color:var(--norm)}
.chip.case{background:var(--case-soft);color:var(--case)}
.chip.schema,.chip.step{background:var(--schema-soft);color:var(--schema)}
.chip.distinction{background:var(--dist-soft);color:var(--dist)}
.chip.source{background:var(--source-soft);color:var(--source)}
.chip.open{border-color:currentColor}
.chip:hover{filter:brightness(.95)}
.slot:empty{display:none}
.inline{border-left:3px solid var(--line);margin:8px 0 8px 4px;padding:10px 14px;background:var(--panel);border-radius:0 var(--radius) var(--radius) 0;box-shadow:var(--shadow)}
.inline.concept{border-left-color:var(--concept)}.inline.norm,.inline.eunorm{border-left-color:var(--norm)}.inline.case{border-left-color:var(--case)}
.inline.schema,.inline.step{border-left-color:var(--schema)}.inline.distinction{border-left-color:var(--dist)}.inline.source{border-left-color:var(--source)}
.inline .kind{font:11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.inline .kind a{font-size:12px;text-transform:none;letter-spacing:0}
.inline h5{margin:3px 0 6px;font-size:15px}
.def{margin:0 0 6px}
.erl{color:var(--muted);font-size:14px;margin:0}
.tree{list-style:none;padding-left:0;margin:0}
.tree li{margin:4px 0}
.tree .node{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.tree .node:hover{background:var(--panel);border-color:var(--line)}
.tree .node.open{background:var(--panel);border-color:var(--line)}
.tree .tw{width:16px;flex:none;color:var(--muted);font-family:system-ui;margin-top:2px}
.tree .lbl{font-weight:600}
.tree .body{margin:2px 0 6px 34px;padding-bottom:6px}
.tree .body p{margin:4px 0 6px}
.tree ul{list-style:none;padding-left:26px;margin:0;border-left:1px dashed var(--line)}
.stepsum{font-size:13px;color:var(--muted)}
pre.law{white-space:pre-wrap;font:14px/1.5 "Source Serif 4",Georgia,serif;margin:6px 0;background:var(--bg);padding:10px 12px;border-radius:8px}
.abs{margin:6px 0}.abs b{color:var(--norm);margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--accent)}
.tile .t{font-weight:600}
.tile .s{color:var(--muted);font-size:13px;margin-top:4px}
.tile .n{font:11px system-ui;color:var(--muted);margin-top:8px}
table.cmp{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
table.cmp th{background:var(--bg);font-family:system-ui,sans-serif;font-size:13px}
table.cmp td:first-child{font-weight:600;background:var(--bg);width:150px}
table.cmp.plain td:first-child{font-weight:400;background:var(--panel);width:auto}
.ktabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}
.ktabs a{font:13px system-ui;padding:6px 12px;border:1px solid var(--line);border-radius:20px;text-decoration:none;color:var(--ink);background:var(--panel)}
.ktabs a:hover{border-color:var(--accent);color:var(--accent)}
.ktabs a.on{background:var(--accent);border-color:var(--accent);color:#fff}
ul.kls,ol.kls{margin:6px 0 0 18px;padding:0}
ul.kls li,ol.kls li{margin:3px 0}
dl.kdl{margin:6px 0;display:grid;grid-template-columns:170px 1fr;gap:6px 14px}
dl.kdl dt{font-weight:600;font-family:system-ui,sans-serif;font-size:13px;color:var(--muted)}
dl.kdl dd{margin:0}
@media (max-width:640px){dl.kdl{grid-template-columns:1fr}}
.merk{background:var(--dist-soft);border-radius:8px;padding:10px 12px;margin-top:8px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px}
.filters select,.filters input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.meta{font:13px system-ui,sans-serif;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toc{columns:2;column-gap:24px;font-size:14px}
.toc a{display:block;text-decoration:none;color:var(--ink);padding:2px 0}
.toc a:hover{color:var(--accent)}
.toc .h{font-weight:600;margin-top:10px;break-inside:avoid}
/* flashcards */
.fc{max-width:720px;margin:0 auto}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 28px;min-height:230px;box-shadow:var(--shadow);cursor:pointer;white-space:pre-wrap}
.fcard .side{font:11px system-ui;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.fcard .txt{font-size:17px}
.fcard.back .txt{font-size:15px}
.fcbar{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.prog{font:13px system-ui;color:var(--muted);text-align:center}
.ok{border-color:var(--ok);color:var(--ok)}.bad{border-color:var(--bad);color:var(--bad)}
/* graph */
#gcanvas{width:100%;height:560px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font:12px system-ui;color:var(--muted);margin:8px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;background:var(--c)}
.hit{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0;cursor:pointer}
.hit:hover{border-color:var(--accent)}
.hit .k{font:11px system-ui;text-transform:uppercase;letter-parsing:.08em;color:var(--muted)}
mark{background:var(--dist-soft);color:inherit;padding:0 2px}
.lawlink{color:var(--norm);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
.lawlink:hover{text-decoration-style:solid}
.chip .ext{margin-left:2px;text-decoration:none;font-weight:700;opacity:.75}
.chip .ext:hover{opacity:1}

.kbd{font:12px system-ui;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}
.backlink{font:13px system-ui;margin-bottom:10px}
@media (max-width:820px){#layout{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap;gap:4px;border-right:0;border-bottom:1px solid var(--line)}nav .grp{display:none}main{padding:16px}.two{grid-template-columns:1fr}.toc{columns:1}}
</style>
</head>
<body>
<header>
  <h1>IPelico Navigator <small>MarkenG · Prüfungsschemata · BGH-Rechtsprechung</small></h1>
  <input id="q" type="search" placeholder="Suchen: Begriff, §, Entscheidung … (Taste /)" autocomplete="off">
  <button id="themeBtn" title="Hell/Dunkel umschalten">Hell/Dunkel</button>
</header>
<div id="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script id="graph-data" type="application/json">__DATA__</script>
<script id="cards-data" type="application/json">__CARDS__</script>
<script id="klausur-data" type="application/json">__KLAUSUR__</script>
<script>
(function(){
'use strict';
const G = JSON.parse(document.getElementById('graph-data').textContent);
const CARDS = JSON.parse(document.getElementById('cards-data').textContent);
const KLAUSUR = JSON.parse(document.getElementById('klausur-data').textContent);
const byId = new Map(G.nodes.map(n=>[n.id,n]));
const out = new Map(), inc = new Map();
for(const e of G.edges){ (out.get(e.source)||out.set(e.source,[]).get(e.source)).push(e); (inc.get(e.target)||inc.set(e.target,[]).get(e.target)).push(e); }
const O = id => out.get(id)||[], I = id => inc.get(id)||[];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g,'<br>');
__LAWJS__

const txt = s => lawify(esc(s));
const mdt = s => lawify(nl(s));
const TYPE_LABEL = {norm:'Gesetz',eunorm:'Richtlinie',concept:'Begriff',schema:'Prüfungsschema',step:'Prüfungspunkt',case:'Entscheidung',distinction:'Abgrenzung',source:'IPWiki'};
const srcName = u => /eur-lex/.test(u||'') ? 'EUR-Lex' : /epo\.org/.test(u||'') ? 'epo.org' : /unifiedpatentcourt/.test(u||'') ? 'unifiedpatentcourt.org' : 'Quelle';
const euKind = n => n.type!=='eunorm' ? TYPE_LABEL[n.type] : n.rl==='upca' ? 'EPGÜ' : n.rl==='rop' ? 'VerfO' : 'Richtlinie';
const bridges = id => ({entspricht:O(id).filter(e=>e.relation==='entspricht').map(e=>byId.get(e.target)), umgesetzt:I(id).filter(e=>e.relation==='entspricht').map(e=>byId.get(e.source)), bezug:O(id).filter(e=>e.relation==='konkretisiert').map(e=>byId.get(e.target)), regeln:I(id).filter(e=>e.relation==='konkretisiert').map(e=>byId.get(e.source))});
const steps = id => O(id).filter(e=>e.relation==='has_step').sort((a,b)=>a.order-b.order).map(e=>byId.get(e.target));
const schemaOf = stepId => byId.get('schema:'+stepId.slice(5).split('.')[0]);
const norms = id => O(id).filter(e=>['defined_in','applies','interprets'].includes(e.relation)).map(e=>({node:byId.get(e.target),ref:e.ref}));
const implementsOf = id => O(id).filter(e=>e.relation==='implements').map(e=>byId.get(e.target));
const implementedBy = id => I(id).filter(e=>e.relation==='implements').map(e=>({node:byId.get(e.source),ref:e.ref}));
const cases = id => O(id).filter(e=>e.relation==='illustrated_by'||e.relation==='cites').map(e=>byId.get(e.target));
const concepts = id => O(id).filter(e=>e.relation==='uses_concept'||e.relation==='related_to'||e.relation==='contrasts').map(e=>byId.get(e.target));
const sources = id => O(id).filter(e=>e.relation==='documented_in').map(e=>byId.get(e.target));
const usedIn = id => { // Begriff/Entscheidung/Norm -> Schemata & Begriffe, die darauf verweisen
  const res={schema:new Map(),concept:new Map(),distinction:new Map(),case:new Map(),step:new Map()};
  for(const e of I(id)){ const s=byId.get(e.source); if(!s) continue;
    if(s.type==='step'){ const sc=schemaOf(s.id); if(sc) res.schema.set(sc.id,sc); res.step.set(s.id,s); }
    else if(res[s.type]) res[s.type].set(s.id,s); }
  return res;
};

// ---------- Chips & inline cards ----------
function chip(n, ref){ if(!n) return ''; const label = n.type==='norm' && ref ? ref+' MarkenG' : n.type==='eunorm' && ref ? ref : (n.type==='case'? n.court+' '+n.name : n.label);
  const ext = n.type==='norm' ? `<a class="ext" href="${esc(n.url)}" target="_blank" rel="noopener" title="Auf gesetze-im-internet.de nachlesen">↗</a>` : n.type==='eunorm' ? `<a class="ext" href="${esc(n.url)}" target="_blank" rel="noopener" title="Auf ${srcName(n.url)} nachlesen">↗</a>` : '';
  return `<span class="chip ${n.type}" data-node="${n.id}" title="${esc(euKind(n))}: ${esc(n.label)}">${esc(label)}${ext}</span>`; }
function chips(list, cls){ if(!list.length) return ''; return `<div class="chips">${list.map(x=>x.node?chip(x.node,x.ref):chip(x)).join('')}</div><div class="slot"></div>`; }
function section(title, html){ return html ? `<div class="sec"><div class="meta" style="margin-top:8px">${title}</div>${html}</div>` : ''; }

function inlineCard(n, ref){
  const link = `<a href="#/${n.type}/${encodeURIComponent(n.id)}">öffnen ↗</a>`;
  let body='';
  if(n.type==='concept'){
    body = `<h5>${esc(n.label)}</h5><p class="def">${txt(n.definition)}</p><p class="erl">${txt(n.erlaeuterung)}</p>`
      + section('Normen', chips(norms(n.id))) + section('Rechtsprechung', chips(cases(n.id))) + section('Verwandte Begriffe', chips(concepts(n.id)))
      + section('IPWiki', sources(n.id).map(s=>`<a class="chip source" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join(' '));
  } else if(n.type==='norm'){
    body = `<h5>${esc(n.label)} – ${esc(n.titel)}</h5>` + normText(n, ref) + section('Setzt um', chips(implementsOf(n.id))) + `<div class="meta"><a href="${esc(n.url)}" target="_blank" rel="noopener">gesetze-im-internet.de ↗</a></div>`;
  } else if(n.type==='eunorm'){
    const br=bridges(n.id); const upc=n.rl==='upca'||n.rl==='rop';
    body = `<h5>${esc(n.label)} – ${esc(n.titel)}</h5><div class="meta">${esc(n.gesetz)} · ${esc(n.kapitel)}${n.abschnitt?' · '+esc(n.abschnitt):''}${n.titel_en?' · <i>'+esc(n.titel_en)+'</i>':''}</div>` + eunormText(n) + (n.hinweis?`<div class="merk"><b>${upc?'Hinweis':'Umsetzung/Hinweis'}:</b> ${txt(n.hinweis)}</div>`:'') + section('Umgesetzt durch', chips(implementedBy(n.id))) + section('Entsprechung in der Durchsetzungsrichtlinie', chips(br.entspricht)) + section('Umsetzung im EPGÜ', chips(br.umgesetzt)) + section('Bezug zum Übereinkommen', chips(br.bezug)) + section('Konkretisiert in der Verfahrensordnung', chips(br.regeln)) + section('Begriffe', chips(I(n.id).filter(e=>e.relation==='defined_in').map(e=>byId.get(e.source)))) + section('Rechtsprechung', chips(I(n.id).filter(e=>e.relation==='interprets').map(e=>byId.get(e.source)))) + weitereTable(n) + (upc?`<div class="meta">${n.zitiert?`In ${n.zitiert} Entscheidungen des EPG zitiert · <a href="../#/epg/norm/${encodeURIComponent(n.id)}">alle in IPelico anzeigen →</a>`:'Bisher in keiner Entscheidung des EPG zitiert.'}${n.url_en?` · <a href="${esc(n.url_en)}" target="_blank" rel="noopener">English ↗</a>`:''}</div>`:'') + `<div class="meta">${n.paraphrase?'Inhalt als Paraphrase erfasst (amtlicher Wortlaut nicht abrufbar).':'Amtlicher Wortlaut.'} <a href="${esc(n.url)}" target="_blank" rel="noopener">${srcName(n.url)} ↗</a> · <a href="${esc(n.url_pdf)}" target="_blank" rel="noopener">PDF ↗</a></div>`;
  } else if(n.type==='case'){
    body = `<h5>${esc(n.court)} „${esc(n.name)}“</h5><div class="meta">${esc(n.court)}, ${fmtDate(n.date)} – ${esc(n.az)}${n.fundstelle?' – '+esc(n.fundstelle):''} · <a href="${esc(n.url)}" target="_blank" rel="noopener">${/unifiedpatentcourt/.test(n.url)?'unifiedpatentcourt.org':'dejure'} ↗</a></div><p class="def">${txt(n.kern)}</p>`
      + section('Normen', chips(norms(n.id))) + section('Begriffe', chips(I(n.id).filter(e=>e.relation==='illustrated_by').map(e=>byId.get(e.source))));
  } else if(n.type==='schema'){
    body = `<h5>${esc(n.label)}</h5><p class="def">${txt(n.beschreibung)}</p><ol>${steps(n.id).map(s=>`<li>${esc(s.label)}</li>`).join('')}</ol>`;
  } else if(n.type==='step'){
    body = `<h5>${esc(n.label)}</h5><p class="def">${txt(n.text)}</p>`+section('Begriffe',chips(concepts(n.id)))+section('Normen',chips(norms(n.id)))+section('Rechtsprechung',chips(cases(n.id)));
  } else if(n.type==='distinction'){
    body = `<h5>${esc(n.label)}</h5>`+cmpTable(n);
  } else if(n.type==='source'){
    body = `<h5>${esc(n.label)}</h5><p class="def">${txt(n.summary)}</p><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.url)}</a>`;
  }
  return `<div class="inline ${n.type}"><div class="kind"><span>${esc(euKind(n))}</span>${link}</div>${body}</div>`;
}
function normText(n, ref){
  const m = ref && ref.match(/Abs\. (\d+[a-z]?)/); const want = m?m[1]:null;
  const abs = n.absaetze.filter(a=>!want || a.nr===want || a.nr===null);
  const list = abs.length?abs:n.absaetze;
  let html = list.map(a=>`<div class="abs">${a.nr?`<b>(${esc(a.nr)})</b>`:''}${mdt(a.text)}</div>`).join('');
  if(want && abs.length && abs.length<n.absaetze.length) html += `<div class="meta"><span class="chip norm" data-node="${n.id}" data-full="1">ganzen § ${esc(n.nummer)} anzeigen</span></div>`;
  return html;
}

document.addEventListener('click', ev=>{
  if(ev.target.closest('a')) return;
  const c = ev.target.closest('.chip[data-node]'); if(!c) return;
  ev.preventDefault();
  const n = byId.get(c.dataset.node); if(!n) return;
  const row = c.closest('.chips') || c.parentElement; let slot = row.nextElementSibling;
  if(!slot || !slot.classList.contains('slot')){ slot=document.createElement('div'); slot.className='slot'; row.after(slot); }
  const wasOpen = c.classList.contains('open') && !c.dataset.full;
  row.querySelectorAll('.chip.open').forEach(x=>x.classList.remove('open'));
  if(wasOpen){ slot.innerHTML=''; return; }
  c.classList.add('open');
  const ref = c.dataset.full ? null : (n.type==='norm' ? c.textContent.replace(' MarkenG','') : null);
  slot.innerHTML = inlineCard(n, ref);
  slot.scrollIntoView({block:'nearest',behavior:'smooth'});
});

function stepLi(s){
  const kids = steps(s.id); const has = kids.length>0;
  const sum = [concepts(s.id).length&&`${concepts(s.id).length} Begriffe`, norms(s.id).length&&`${norms(s.id).length} Normen`, cases(s.id).length&&`${cases(s.id).length} Entscheidungen`].filter(Boolean).join(' · ');
  return `<li><div class="node" data-step="${s.id}"><span class="tw">${has?'▸':'·'}</span><div style="flex:1"><div class="lbl">${esc(s.label)}</div>${sum?`<div class="stepsum">${sum}</div>`:''}</div></div>

function vCards(sub){

  const filt=()=>{ const ty=document.getElementById('cType').value, tg=document.getElementById('cTag').value, un=document.getElementById('cUnknown').checked;
    let d=CARDS.filter(c=>(!ty||c.typ===ty)&&(!tg||c.tags.includes(tg))&&(!un||progress[c.id]!=='ok'));
    if(mode==='schema'&&arg){ const ids=new Set([arg]); const walk=id=>steps(id).forEach(s=>{ids.add(s.id); O(s.id).forEach(e=>ids.add(e.target)); walk(s.id);}); walk(arg); d=d.filter(c=>ids.has(c.node)); }
    return d; };
  const start=()=>{ deck=filt(); for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];} pos=0; flipped=false; show(); };

  const next=()=>{ if(!deck.length)return; pos=(pos+1)%deck.length; flipped=false; show(); };

  document.getElementById('fcard').onclick=()=>{flipped=!flipped;show();};
  document.getElementById('bFlip').onclick=()=>{flipped=!flipped;show();};

}

const COLORS={norm:'#2b5b8a',eunorm:'#1f5f8b',concept:'#8a2f1f',schema:'#2f6b4f',step:'#5f9a7b',case:'#6a4c93',distinction:'#a56b00',source:'#4b6b6b'};
function vGraph(id){
  const start = byId.get(id) || byId.get('concept:verwechslungsgefahr');
  main.innerHTML=`<h2>Graph-Explorer</h2><p class="lead">Nachbarschaft von <b id="gTitle"></b>. Klick auf einen Knoten wählt ihn als Zentrum; Doppelklick öffnet den Eintrag. Tiefe: <select id="gDepth"><option value="1">1</option><option value="2">2</option></select> <label><input type="checkbox" id="gNorms" checked> Normen</label> <label><input type="checkbox" id="gSteps"> Prüfungspunkte</label> <label><input type="checkbox" id="gSrc"> IPWiki</label></p>
  <div class="legend">${Object.entries(COLORS).map(([k,v])=>`<span style="--c:${v}">${TYPE_LABEL[k]}</span>`).join('')}</div><canvas id="gcanvas"></canvas><div id="gInfo" class="card"></div>`;
  const cv=document.getElementById('gcanvas'), ctx=cv.getContext('2d'); let center=start, nodes=[], links=[], anim, drag=null, hover=null;
  const opts=()=>({depth:+document.getElementById('gDepth').value, norms:document.getElementById('gNorms').checked, steps:document.getElementById('gSteps').checked, src:document.getElementById('gSrc').checked});
  function build(){
    const o=opts(); const keep=n=>n&&(o.norms||(n.type!=='norm'&&n.type!=='eunorm'))&&(o.steps||n.type!=='step')&&(o.src||n.type!=='source');
    const set=new Map([[center.id,0]]); let frontier=[center.id];
    for(let d=1; d<=o.depth; d++){ const nf=[]; for(const id of frontier){ for(const e of [...O(id),...I(id)]){ const other=e.source===id?e.target:e.source; const n=byId.get(other); if(!keep(n)||set.has(other)) continue; if(n.type==='step'&&!o.steps) continue; set.set(other,d); nf.push(other); if(set.size>70) break; } } frontier=nf; }
    const W=cv.width=cv.clientWidth*devicePixelRatio, H=cv.height=cv.clientHeight*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    const w=cv.clientWidth,h=cv.clientHeight;
    nodes=[...set.keys()].map((id,i)=>{ const n=byId.get(id); const d=set.get(id); const a=i/set.size*Math.PI*2; const r=d===0?0:d*Math.min(w,h)/2.6; return {id,n,d,x:w/2+Math.cos(a)*r+(Math.random()-.5)*20,y:h/2+Math.sin(a)*r+(Math.random()-.5)*20,vx:0,vy:0}; });
    const idx=new Map(nodes.map((x,i)=>[x.id,i]));
    links=G.edges.filter(e=>idx.has(e.source)&&idx.has(e.target)).map(e=>({a:nodes[idx.get(e.source)],b:nodes[idx.get(e.target)],rel:e.relation}));
    document.getElementById('gTitle').textContent=(center.type==='case'?center.court+' ':'')+(center.name||center.label);
    document.getElementById('gInfo').innerHTML=inlineCard(center).replace('class="inline','class="inline');
    cancelAnimationFrame(anim); let t=0; const tick=()=>{ sim(w,h,t++); draw(); if(t<400||drag) anim=requestAnimationFrame(tick); }; tick();
  }
  function sim(w,h,t){ const k=0.85;
    for(const a of nodes){ for(const b of nodes){ if(a===b) continue; let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+0.01,d=Math.sqrt(d2); const f=(nodes.length>40?5200:7800)/d2; a.vx+=dx/d*f; a.vy+=dy/d*f; } }
    for(const l of links){ let dx=l.b.x-l.a.x,dy=l.b.y-l.a.y,d=Math.sqrt(dx*dx+dy*dy)+0.01; const want=l.a.d===0||l.b.d===0?170:110; const f=(d-want)*0.025; l.a.vx+=dx/d*f; l.a.vy+=dy/d*f; l.b.vx-=dx/d*f; l.b.vy-=dy/d*f; }
    for(const n of nodes){ n.vx+=(w/2-n.x)*0.002; n.vy+=(h/2-n.y)*0.002; if(n.d===0&&!drag){n.x=w/2;n.y=h/2;n.vx=n.vy=0;continue;} if(drag===n) continue; n.x+=n.vx*k; n.y+=n.vy*k; n.vx*=0.6; n.vy*=0.6; n.x=Math.max(20,Math.min(w-20,n.x)); n.y=Math.max(20,Math.min(h-20,n.y)); } }
  function draw(){ const w=cv.clientWidth,h=cv.clientHeight; ctx.clearRect(0,0,w,h); const dark=matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.dataset.theme!=='light'||document.documentElement.dataset.theme==='dark';
    ctx.strokeStyle=dark?'rgba(255,255,255,.18)':'rgba(0,0,0,.14)'; ctx.lineWidth=1; for(const l of links){ ctx.beginPath(); ctx.moveTo(l.a.x,l.a.y); ctx.lineTo(l.b.x,l.b.y); ctx.stroke(); }
    ctx.font='12px system-ui'; for(const n of nodes){ const r=n.d===0?11:n.n.type==='concept'||n.n.type==='schema'?8:6; ctx.beginPath(); ctx.arc(n.x,n.y,r,0,Math.PI*2); ctx.fillStyle=COLORS[n.n.type]; ctx.fill(); if(n===hover||n.d===0){ctx.lineWidth=2;ctx.strokeStyle=dark?'#fff':'#000';ctx.stroke();}
      if(n.d<=1||n===hover||nodes.length<40){ const lab=(n.n.type==='case'?n.n.name:n.n.type==='norm'?n.n.label.replace(' MarkenG',''):n.n.label); const s=lab.length>28?lab.slice(0,27)+'…':lab; ctx.fillStyle=dark?'#e8e6e1':'#1e2124'; ctx.fillText(s,n.x+r+3,n.y+4); } } }
  const pick=ev=>{ const r=cv.getBoundingClientRect(); const x=ev.clientX-r.left,y=ev.clientY-r.top; return nodes.find(n=>Math.hypot(n.x-x,n.y-y)<12); };
  cv.addEventListener('mousemove',ev=>{ if(drag){const r=cv.getBoundingClientRect();drag.x=ev.clientX-r.left;drag.y=ev.clientY-r.top;draw();return;} const p=pick(ev); if(p!==hover){hover=p;cv.style.cursor=p?'pointer':'default';draw();} });
  cv.addEventListener('mousedown',ev=>{ drag=pick(ev)||null; if(drag){cancelAnimationFrame(anim); let t=0; const tick=()=>{sim(cv.clientWidth,cv.clientHeight,t++);draw(); if(drag) anim=requestAnimationFrame(tick);}; tick();} });
  window.addEventListener('mouseup',()=>{ drag=null; });
  cv.addEventListener('click',ev=>{ const p=pick(ev); if(p&&p.d!==0){ center=p.n; history.replaceState(null,'','#/graph/'+p.n.id); build(); } });
  cv.addEventListener('dblclick',ev=>{ const p=pick(ev); if(p) location.hash='#/'+p.n.type+'/'+p.n.id; });
  ['gDepth','gNorms','gSteps','gSrc'].forEach(i=>document.getElementById(i).addEventListener('change',build));
  build();
}

// ---------- Theme ----------
document.getElementById('themeBtn').onclick=()=>{ const r=document.documentElement; const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); r.dataset.theme=cur==='dark'?'light':'dark'; try{localStorage.setItem('markenrecht.theme',r.dataset.theme)}catch(e){} };
try{ const t=localStorage.getItem('markenrecht.theme'); if(t) document.documentElement.dataset.theme=t; }catch(e){}
route();
})();
</script>
