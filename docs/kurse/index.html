er das Siegel ohne Lizenz verwendet, nutzt die Wertschätzung der bekannten Marke aus, weil er sich das Vertrauen der Verbraucher in das Testinstitut zunutze macht, ohne dessen Bedingungen einzuhalten (BGH ÖKO-TEST II im Anschluss an EuGH C-690/17).","Die Unlauterkeit liegt darin, dass die Marke als Werbeinstrument für fremde Waren eingesetzt wird, ohne dass der Inhaber die Verwendungsbedingungen kontrollieren kann."],"merke":"Fremde Siegel und Gütezeichen sind Bekanntheitsschutz in Reinform.","level":2,"concepts":["ausnutzung_wertschaetzung","bekannte_marke"],"norms":["§ 14 Abs. 2 Nr. 3"],"cases":["bgh_oeko_test_ii"],"step":null},{"id":"k05b-4","typ":"fall","titel":"Interflora bei Google","sachverhalt":"Ein Kaufhaus bucht die bekannte Marke „Interflora“ als Keyword und bewirbt seinen eigenen Blumenlieferservice als Alternative, ohne Nachahmungen anzubieten oder die Marke zu verwässern.","frage":"Ist diese Keyword-Werbung eine unlautere Ausnutzung der Unterscheidungskraft?","antwort":false,"loesung":["**Nein!** Bietet der Werbende lediglich eine **Alternative** zu den Waren des Markeninhabers an, ohne Nachahmungen zu vertreiben, die Marke zu verwässern oder ihre Funktionen zu beeinträchtigen, fällt die Nutzung unter den gesunden und lauteren Wettbewerb. Ein rechtfertigender Grund liegt vor (EuGH Interflora).","Anders, wenn Nachahmungen angeboten werden (Trittbrettfahren) oder die Anzeige den Nutzer über eine Verbindung im Unklaren lässt (Beeinträchtigung der Herkunftsfunktion, Fleurop)."],"merke":"Alternative anbieten = erlaubt. Nachahmung anbieten oder Verbindung vortäuschen = verboten.","level":3,"concepts":["unlauterkeit","keyword_advertising"],"norms":["§ 14 Abs. 2 Nr. 3"],"cases":["eugh_interflora","bgh_fleurop"],"step":"step:schema_bekanntheitsschutz.6"}]},{"id":"k05c","titel":"Die bekannte Marke im Register (§ 9 Abs. 1 Nr. 3)","einheiten":[{"id":"k05c-0","typ":"schema","titel":"Prüfungsschema: Relative Schutzhindernisse im Register","schema":"schema_relative_schutzhindernisse","text":"§ 9 Abs. 1 Nr. 3 ist das Spiegelbild des § 14 Abs. 2 Nr. 3. Die Unterschiede liegen im Verfahren, im Zeitpunkt und im Prüfungsgegenstand.","concepts":[],"norms":[],"cases":[]},{"id":"k05c-1","typ":"fall","titel":"Zu spät bekannt","sachverhalt":"Die Marke „VELORA“ wurde 2015 angemeldet und ist heute bekannt. Ein Dritter hatte „VELORA“ bereits 2013 für andere Waren angemeldet und eingetragen. Der Inhaber der bekannten Marke beantragt 2024 die Löschung der Marke von 2013 nach § 9 Abs. 1 Nr. 3.","frage":"Hat der Antrag Erfolg?","antwort":false,"loesung":["**Nein, aus zwei Gründen!** Erstens ist die Marke von 2013 die **prioritätsältere**; § 9 setzt eine ältere bekannte Marke voraus. Zweitens muss die Bekanntheit am **Anmeldetag der angegriffenen Marke** bestanden haben (§ 51 Abs. 3). 2013 war „VELORA“ noch nicht einmal angemeldet.","Selbst wenn die bekannte Marke die ältere wäre, aber erst nach dem Anmeldetag der jüngeren Marke Bekanntheit erlangt hätte, scheitert die Löschung an § 51 Abs. 3, und § 22 Abs. 1 Nr. 1 sperrt zugleich Unterlassungsansprüche gegen die Benutzung der jüngeren Marke für ihre eingetragenen Waren: Koexistenz."],"merke":"Bekanntheit zum Prioritätstag der jüngeren Marke, sonst § 51 Abs. 3 und § 22 Abs. 1 Nr. 1.","level":3,"concepts":["relative_schutzhindernis_bekannt","koexistenz_22","prioritaet"],"norms":["§ 9 Abs. 1 Nr. 3","§ 51 Abs. 3","§ 22"],"cases":["bgh_springender_pudel"],"step":"step:schema_relative_schutzhindernisse.4.3.1"},{"id":"k05c-2","typ":"mc","titel":"Register oder Verletzungsprozess?","sachverhalt":"","frage":"Worin liegt der wichtigste Unterschied im Prüfungsgegenstand zwischen § 9 Abs. 1 Nr. 3 und § 14 Abs. 2 Nr. 3?","optionen":["§ 9 verlangt Verwechslungsgefahr, § 14 nicht","§ 9 prüft die hypothetische Benutzung der jüngeren Marke nach Registerlage („würde“), § 14 die konkrete Benutzungshandlung","§ 9 gilt nur für unähnliche Waren","§ 9 verlangt keine gedankliche Verknüpfung"],"richtig":1,"loesung":["Im Register wird die **hypothetische Benutzung** der jüngeren Marke für die eingetragenen Waren beurteilt („die Benutzung … würde … ausnutzen“). Im Verletzungsprozess geht es um die **konkrete Benutzungshandlung** in ihrem tatsächlichen Umfeld.","Alles andere ist gleich: Bekanntheit, Zeichenähnlichkeit, gedankliche Verknüpfung, die vier Eingriffe, Unlauterkeit ohne rechtfertigenden Grund; beide gelten seit dem MaMoG auch für ähnliche Waren. Verfahren: Widerspruch (§ 42) oder Nichtigkeit (§ 51) statt Klage nach § 140."],"merke":"","level":3,"concepts":["relative_schutzhindernis_bekannt"],"norms":["§ 9 Abs. 1 Nr. 3","§ 14 Abs. 2 Nr. 3"],"cases":[],"step":null},{"id":"k05c-3","typ":"fall","titel":"Glaubhaft machen im Widerspruch","sachverhalt":"Die Inhaberin einer bekannten Marke legt Widerspruch nach § 42 gegen eine jüngere Marke ein und stützt sich auf § 9 Abs. 1 Nr. 3. Sie kündigt an, die Bekanntheit durch Zeugen und ein noch einzuholendes Gutachten zu beweisen.","frage":"Ist das Widerspruchsverfahren der richtige Ort für eine solche Beweisaufnahme?","antwort":false,"loesung":["**Nein!** Das Widerspruchsverfahren ist ein **summarisches Registerverfahren**: Es gibt keine Beweisaufnahme, sondern nur Glaubhaftmachung mit präsenten Beweismitteln (vorhandene Umfragen, Unterlagen). Ist die Bekanntheit nicht amtsbekannt oder liquide belegt, scheitert der Widerspruch.","Deshalb wird der Bekanntheitsschutz gegen eingetragene Marken praktisch häufig im **Nichtigkeitsverfahren** verfolgt (§ 51, vor dem DPMA nach § 53 oder als Klage vor dem Landgericht nach § 55), wo volle Beweisführung möglich ist."],"merke":"Widerspruch = schnell und liquide. Bekanntheit ist selten liquide.","level":3,"concepts":["widerspruch","relative_schutzhindernis_bekannt","nichtigkeit"],"norms":["§ 42","§ 43","§ 51","§ 55"],"cases":[],"step":null}]}]},{"id":"k06","titel":"Schranken des Markenschutzes","untertitel":"§§ 20 bis 24 MarkenG: Wann der Markeninhaber nichts verbieten kann","farbe":"#A56B00","icon":"schranke","beschreibung":"Beschreibende Benutzung, Ersatzteilhinweise, das Recht der Gleichnamigen, Erschöpfung mit Parallelimport und Beweislast, Verwirkung und Verjährung.","kapitel":[{"id":"k06a","titel":"§ 23: Namen, beschreibende Angaben, Bestimmungshinweis","einheiten":[{"id":"k06a-0","typ":"schema","titel":"Prüfungsschema: § 23 MarkenG","schema":"schema_schranke_23","text":"§ 23 ist eine Einwendung: Er wird erst geprüft, wenn der Tatbestand des § 14 Abs. 2 erfüllt ist. Fehlt schon die markenmäßige Benutzung, brauchst du § 23 nicht.","concepts":[],"norms":[],"cases":[]},{"id":"k06a-1","typ":"fall","titel":"Filtertüten passend für Vorwerk","sachverhalt":"Ein Hersteller verkauft Staubsaugerbeutel unter seiner Eigenmarke „EURO PLUS“, deutlich hervorgehoben, mit dem Zusatz „Filtertüte passend für Vorwerk Kobold 130“. Vorwerk klagt.","frage":"Kann sich der Hersteller auf § 23 Abs. 1 Nr. 3 berufen?","antwort":true,"loesung":["**Ja, in der Tat!** Der Markeninhaber kann die Benutzung seiner Marke als **Hinweis auf die Bestimmung** einer Ware (insbesondere Zubehör oder Ersatzteil) nicht untersagen, soweit die Benutzung notwendig ist und den anständigen Gepflogenheiten entspricht (§ 23 Abs. 1 Nr. 3, Abs. 2).","Notwendig ist die Nennung, weil der Kunde sonst nicht erfährt, in welchen Staubsauger die Tüte passt (EuGH Gillette). Anständig ist sie, weil „passend für“ hervorgehoben ist und die Eigenmarke im Vordergrund steht, sodass keine Verbindung zu Vorwerk suggeriert wird (BGH Staubsaugerfiltertüten)."],"merke":"§ 23 Nr. 3: notwendig + anständig. Eigenmarke groß, „passend für“ deutlich.","level":1,"concepts":["ersatzteilhinweis","schranke_23"],"norms":["§ 23 Abs. 1 Nr. 3","§ 23 Abs. 2"],"cases":["bgh_staubsaugerfiltertueten","eugh_gillette"],"step":"step:schema_schranke_23.2.3"},{"id":"k06a-2","typ":"fall","titel":"Der Kühlergrill mit Ringen","sachverhalt":"Ein Ersatzteilhändler vertreibt Kühlergrills für Audi-Modelle. In den Grill ist eine Aufnahme eingearbeitet, die exakt die Form der vier Audi-Ringe hat, damit das Original-Emblem eingesetzt werden kann.","frage":"Ist die Nachbildung der Ringform als Bestimmungshinweis nach § 23 Abs. 1 Nr. 3 gerechtfertigt?","antwort":false,"loesung":["**Nein!** Die Aufnahme in Form des Emblems ist eine markenmäßige Benutzung der bekannten Bildmarke. Sie ist zur Angabe der Bestimmung als Ersatzteil **nicht notwendig**: Eine neutrale Halterung, in die das Original-Emblem eingesetzt werden kann, genügt (BGH Kühlergrill).","Nur die Nennung der Marke als Information über die Kompatibilität ist privilegiert, nicht die Übernahme des Zeichens selbst in das Produkt."],"merke":"§ 23 Nr. 3 erlaubt zu informieren, nicht zu imitieren.","level":2,"concepts":["ersatzteilhinweis"],"norms":["§ 23 Abs. 1 Nr. 3"],"cases":["bgh_kuehlergrill","bgh_grosse_inspektion"],"step":null},{"id":"k06a-3","typ":"fall","titel":"Große Inspektion für alle","sachverhalt":"Eine freie Werkstatt wirbt für Inspektionen an VW-Fahrzeugen und verwendet dazu blickfangmäßig das VW-Logo (Wort-Bild-Marke). Die Bestimmung ließe sich auch mit der Wortmarke „VW“ angeben.","frage":"Entspricht die Verwendung des Logos den anständigen Gepflogenheiten?","antwort":false,"loesung":["**Nein!** Zur Angabe, dass die Werkstatt VW-Fahrzeuge wartet, genügt die **Wortmarke**. Die zusätzliche Verwendung des Bildzeichens ist nicht notwendig und nutzt die Werbewirkung der bekannten Marke aus; sie beeinträchtigt die Werbefunktion (BGH GROSSE INSPEKTION FÜR ALLE).","Anständige Gepflogenheiten fehlen nach EuGH Gillette, wenn (1) eine Verbindung suggeriert, (2) die Wertschätzung ausgenutzt, (3) die Marke herabgesetzt oder (4) die eigene Ware als Imitat dargestellt wird."],"merke":"Wortmarke reicht, Logo ist zu viel.","level":2,"concepts":["schranke_23","ersatzteilhinweis"],"norms":["§ 23 Abs. 2"],"cases":["bgh_grosse_inspektion","eugh_gillette"],"step":"step:schema_schranke_23.3"},{"id":"k06a-4","typ":"fall","titel":"Zwei Mal Peek & Cloppenburg","sachverhalt":"Zwei wirtschaftlich unabhängige Unternehmen führen seit über hundert Jahren den Namen „Peek & Cloppenburg“, eines in Hamburg für den Norden, eines in Düsseldorf für den Rest. Das Düsseldorfer Unternehmen wirbt jetzt bundesweit in Zeitschriften.","frage":"Muss das Düsseldorfer Unternehmen die Werbung im Norden ganz unterlassen?","antwort":false,"loesung":["**Nein!** Zwischen den Gleichnamigen besteht eine seit langem gewachsene **Gleichgewichtslage**. Der Störer darf sie nicht einseitig verschieben, muss aber nur das Erforderliche und Zumutbare tun, um Verwechslungen zu vermeiden: einen **aufklärenden Zusatz** (Ortsangabe, Hinweis auf zwei Unternehmen). Der Zusatz muss deutlich sein, aber nicht in gleicher Größe wie die Werbebotschaft erscheinen (BGH Peek & Cloppenburg).","Grundlage ist § 23 Abs. 1 Nr. 1 in Verbindung mit einer Interessenabwägung, das sogenannte Recht der Gleichnamigen. Beachte: Seit Art. 14 Abs. 1 lit. a MarkenRL gilt die Namensschranke nur für natürliche Personen; für die Unternehmen selbst tragen hier das ältere Unternehmenskennzeichen (§ 5) und die Gleichgewichtslage."],"merke":"Gleichnamige: Zusatz statt Verbot.","level":3,"concepts":["gleichnamigkeit","unternehmenskennzeichen"],"norms":["§ 23 Abs. 1 Nr. 1","§ 15","Art. 14 MarkenRL"],"cases":["bgh_peek_cloppenburg"],"step":"step:schema_schranke_23.2.1"},{"id":"k06a-5","typ":"fall","titel":"Beschreibend trotz Eintragung","sachverhalt":"Die Marke „Kinder“ ist für Süßwaren eingetragen. Ein Bäcker bewirbt seine Muffins mit „Ideal für Kinder und Erwachsene“.","frage":"Kann der Markeninhaber diese Werbung verbieten?","antwort":false,"loesung":["**Nein!** Schon die markenmäßige Benutzung fehlt: „Kinder“ wird als Zielgruppenangabe im Fließtext verwendet. Selbst wenn man sie bejahte, greift § 23 Abs. 1 Nr. 2: Angaben über Merkmale der Ware (hier die Bestimmung für eine Zielgruppe) dürfen benutzt werden, auch wenn sie mit einer eingetragenen Marke identisch sind.","Die Verkehrsdurchsetzung verschafft dem Inhaber das Recht am Zeichen als Marke, nicht ein Monopol am beschreibenden Wort."],"merke":"Eine verkehrsdurchgesetzte Marke verliert nie ihre beschreibende Bedeutung für andere.","level":1,"concepts":["schranke_23","markenmaessige_benutzung"],"norms":["§ 23 Abs. 1 Nr. 2"],"cases":["bgh_kinder_ii","bgh_tuev_ii"],"step":"step:schema_schranke_23.2.2"}]},{"id":"k06b","titel":"§ 24: Erschöpfung","einheiten":[{"id":"k06b-0","typ":"schema","titel":"Prüfungsschema: Erschöpfung","schema":"schema_erschoepfung","text":"Erschöpfung betrifft nur Originalware, die im EWR mit Zustimmung des Inhabers in Verkehr gebracht wurde. Beweislast und berechtigte Gründe sind die Klausurschwerpunkte.","concepts":[],"norms":[],"cases":[]},{"id":"k06b-1","typ":"fall","titel":"Die Turnschuhe aus den USA","sachverhalt":"Ein deutscher Händler importiert Original-Turnschuhe der Marke „Converse“, die der Markeninhaber in den USA in Verkehr gebracht hat, und verkauft sie in Deutschland deutlich günstiger.","frage":"Ist das Markenrecht an den Schuhen erschöpft?","antwort":false,"loesung":["**Nein!** Erschöpfung tritt nur ein, wenn die Ware vom Inhaber oder mit seiner Zustimmung **im Inland, in der EU oder im EWR** in Verkehr gebracht wurde (§ 24 Abs. 1). Das MarkenG kennt keine internationale Erschöpfung.","Ware aus Drittstaaten darf der Inhaber also vom EWR-Markt fernhalten, auch wenn sie echt ist. Der Händler müsste nachweisen, dass gerade diese Schuhe im EWR in Verkehr gebracht wurden (BGH Converse I). Art. 15 Abs. 1 MarkenRL lässt den Mitgliedstaaten keinen Spielraum für eine weitergehende internationale Erschöpfung (EuGH Silhouette)."],"merke":"EWR-weite, keine weltweite Erschöpfung.","level":1,"concepts":["erschoepfung"],"norms":["§ 24 Abs. 1","Art. 15 MarkenRL"],"cases":["bgh_converse_i"],"step":"step:schema_erschoepfung.2"},{"id":"k06b-2","typ":"fall","titel":"Wer muss was beweisen?","sachverhalt":"Der Markeninhaber betreibt ein ausschließliches Vertriebssystem mit einem Alleinvertriebshändler pro EU-Land. Ein Parallelhändler kann Erschöpfung nur beweisen, wenn er seine Bezugsquelle innerhalb des Systems offenlegt, die dann vom Inhaber abgeschnitten würde.","frage":"Muss trotzdem der Parallelhändler die Erschöpfung beweisen?","antwort":false,"loesung":["**Nein!** Grundsätzlich trägt zwar der Dritte die Beweislast für die Erschöpfung. Betreibt der Inhaber aber ein **ausschließliches Vertriebssystem** und droht bei Offenlegung der Bezugsquelle eine **Abschottung der nationalen Märkte**, kehrt sich die Beweislast um: Der Inhaber muss beweisen, dass die Ware außerhalb des EWR in Verkehr gebracht wurde (EuGH Van Doren, BGH stüssy II).","Ohne Marktabschottungsgefahr bleibt es bei der Beweislast des Händlers, auch wenn die Ware von einem EWR-Lizenznehmer stammt (BGH Converse II)."],"merke":"Beweislast beim Händler, Umkehr bei Vertriebssystem plus Abschottungsgefahr.","level":3,"concepts":["beweislast_erschoepfung"],"norms":["§ 24 Abs. 1"],"cases":["eugh_van_doren","bgh_stuessy_ii","bgh_converse_ii"],"step":"step:schema_erschoepfung.3"},{"id":"k06b-3","typ":"fall","titel":"Der Lizenznehmer verkauft an Discounter","sachverhalt":"Ein Lizenznehmer darf Markenware laut Lizenzvertrag nur an Fachhändler verkaufen. Er verkauft dennoch an einen Discounter im EWR, der die Ware weitervertreibt.","frage":"Ist die Ware mit Zustimmung des Markeninhabers in Verkehr gebracht worden?","antwort":false,"loesung":["**Nein!** Verstößt der Lizenznehmer gegen eine der in § 30 Abs. 2 genannten Beschränkungen (etwa die Qualität der Waren oder das Vertriebsgebiet), kann der Inhaber die Marke gegen ihn geltend machen; das Inverkehrbringen erfolgt dann **ohne Zustimmung** und die Erschöpfung tritt nicht ein (BGH Converse II, EuGH Copad).","Achtung: Nicht jeder Vertragsverstoß hindert die Erschöpfung, sondern nur ein Verstoß gegen die in § 30 Abs. 2 abschließend genannten Punkte. Ein Verstoß gegen eine reine Preisabsprache wäre unerheblich."],"merke":"Lizenzverstoß nach § 30 Abs. 2 = keine Zustimmung = keine Erschöpfung.","level":3,"concepts":["erschoepfung","lizenz"],"norms":["§ 24 Abs. 1","§ 30 Abs. 2"],"cases":["bgh_converse_ii"],"step":null},{"id":"k06b-4","typ":"fall","titel":"Umgepackte Arzneimittel","sachverhalt":"Ein Parallelimporteur führt Arzneimittel aus Spanien ein, wo sie in 30er-Packungen verkauft werden. In Deutschland sind nur 50er-Packungen verkehrsüblich. Er packt um, gibt sich als Umpacker an, beeinträchtigt die Blister nicht und informiert den Hersteller vorab.","frage":"Kann sich der Markeninhaber dem Vertrieb der umgepackten Ware widersetzen?","antwort":false,"loesung":["**Nein!** Zwar ist das Umpacken eine Veränderung der Ware (§ 24 Abs. 2). Der Inhaber kann sich dem Vertrieb aber nicht widersetzen, wenn die **BMS-Kriterien** erfüllt sind: (1) Umpacken zur Vermarktung erforderlich, (2) Originalzustand unberührt, (3) Hersteller und Umpacker angegeben, (4) Aufmachung nicht rufschädigend, (5) Vorabinformation des Inhabers (EuGH Bristol-Myers Squibb).","Die Erforderlichkeit ist streng: Nur wenn der Marktzugang ohne Umpacken tatsächlich behindert wäre (andere Packungsgrößen), ist es erlaubt."],"merke":"Umpacken erlaubt, wenn nötig, schonend, transparent, nicht rufschädigend und angekündigt.","level":3,"concepts":["umverpackung","berechtigte_gruende"],"norms":["§ 24 Abs. 2"],"cases":["eugh_bms"],"step":"step:schema_erschoepfung.4"},{"id":"k06b-5","typ":"fall","titel":"Luxusparfum im Discounter-Prospekt","sachverhalt":"Ein Drogeriediscounter verkauft erschöpfte Original-Luxusparfums und bildet sie in seinem Wochenprospekt neben Waschmittel und Toilettenpapier ab.","frage":"Kann der Markeninhaber diese Werbung verbieten?","antwort":false,"loesung":["**Grundsätzlich nein!** Mit der Erschöpfung darf der Wiederverkäufer die Marke auch in seiner **Werbung** benutzen, und zwar in der in seiner Branche üblichen Weise (EuGH Dior/Evora). Ein berechtigter Grund nach § 24 Abs. 2 liegt nur vor, wenn die Werbung den **Ruf der Marke erheblich schädigt**.","Die bloße Abbildung in einem branchenüblichen Discounter-Prospekt reicht dafür nicht; anders könnte es bei einer gezielt herabwürdigenden Aufmachung liegen."],"merke":"Wer erschöpfte Ware verkaufen darf, darf sie auch bewerben, solange er den Ruf nicht erheblich schädigt.","level":2,"concepts":["berechtigte_gruende","erschoepfung"],"norms":["§ 24 Abs. 2"],"cases":["eugh_dior_evora"],"step":"step:schema_erschoepfung.5"}]},{"id":"k06c","titel":"Verwirkung, Verjährung und § 22","einheiten":[{"id":"k06c-1","typ":"fall","titel":"Zehn Jahre zugeschaut","sachverhalt":"Der Inhaber der bekannten Marke „Hard Rock Cafe“ weiß seit über zehn Jahren, dass ein Heidelberger Restaurant unter „Hard Rock Cafe Heidelberg“ Merchandising verkauft, und hat nichts unternommen. Jetzt klagt er auf Unterlassung des Merchandising-Verkaufs.","frage":"Ist der Unterlassungsanspruch verwirkt, weil der Inhaber so lange geduldet hat?","antwort":false,"loesung":["**Nein, jedenfalls nicht für den Verkauf!** Verwirkung nach § 21 Abs. 4 i.V.m. § 242 BGB verlangt Zeitmoment, Umstandsmoment (schutzwürdiger Besitzstand) und Zurechenbarkeit. Bei **wiederholten, gleichartigen Verletzungshandlungen** entsteht aber mit jeder Handlung ein neuer Unterlassungsanspruch, sodass eine Verwirkung nur für den Fortbestand eines konkret geduldeten Zustands in Betracht kommt (BGH Hard Rock Cafe).","Der Verkauf neuer Merchandisingartikel ist jeweils eine neue Verletzung. Verwirkt sein kann dagegen der Anspruch gegen die Weiterführung des Restaurantnamens selbst."],"merke":"Verwirkung schützt den geduldeten Zustand, nicht immer neue Handlungen.","level":3,"concepts":["verwirkung","verhaeltnis_uwg"],"norms":["§ 21 Abs. 4"],"cases":["bgh_hard_rock_cafe"],"step":null},{"id":"k06c-2","typ":"mc","titel":"Die Fünfjahresregel des § 21","sachverhalt":"","frage":"Der Inhaber einer älteren Marke hat die Benutzung einer eingetragenen jüngeren Marke fünf Jahre lang in Kenntnis geduldet. Die jüngere Marke wurde gutgläubig angemeldet. Was gilt?","optionen":["Der ältere Inhaber kann die jüngere Marke weiterhin löschen lassen und verbieten","Der ältere Inhaber kann die Benutzung nicht mehr untersagen; auch der jüngere Inhaber kann die ältere Marke nicht untersagen (Koexistenz)","Die jüngere Marke wird automatisch zur älteren","Der ältere Inhaber verliert seine Marke"],"richtig":1,"loesung":["Nach § 21 Abs. 1 kann der Inhaber des älteren Rechts die Benutzung der jüngeren eingetragenen Marke **nicht mehr untersagen**, wenn er sie fünf aufeinanderfolgende Jahre in Kenntnis geduldet hat, es sei denn, die Anmeldung war bösgläubig. Parallel ist auch die Nichtigkeit nach § 51 Abs. 2 ausgeschlossen.","§ 21 Abs. 3 ordnet Koexistenz an: Auch der Inhaber des jüngeren Rechts kann die Benutzung des älteren nicht untersagen."],"merke":"","level":2,"concepts":["verwirkung","koexistenz_22"],"norms":["§ 21","§ 51 Abs. 2"],"cases":[],"step":null},{"id":"k06c-3","typ":"fall","titel":"Die verspätete Bekanntheit","sachverhalt":"Die Marke „ARVO“ wurde 2010 angemeldet und ist seit 2018 bekannt. 2014 hatte ein Dritter „ARVO“ für völlig andere Waren angemeldet und eingetragen und benutzt sie seitdem. Der Inhaber der bekannten Marke klagt 2024 auf Unterlassung nach § 14 Abs. 2 Nr. 3.","frage":"Kann er die Benutzung der jüngeren Marke für deren eingetragene Waren verbieten?","antwort":false,"loesung":["**Nein!** Nach § 22 Abs. 1 Nr. 1 kann der Inhaber des älteren Zeichens die Benutzung einer eingetragenen jüngeren Marke nicht untersagen, wenn ein Nichtigkeitsantrag zurückzuweisen wäre, weil das ältere Zeichen **am Prioritätstag der jüngeren Marke noch nicht bekannt** war (§ 51 Abs. 3). 2014 war „ARVO“ nicht bekannt.","Umgekehrt kann auch der Inhaber der jüngeren Marke nichts gegen die ältere unternehmen (§ 22 Abs. 2). Beide koexistieren. Die Bekanntheit muss also zum richtigen Zeitpunkt vorliegen."],"merke":"§ 22 und § 51 Abs. 3 laufen parallel: Was nicht gelöscht werden kann, darf auch benutzt werden.","level":3,"concepts":["koexistenz_22","relative_schutzhindernis_bekannt"],"norms":["§ 22 Abs. 1 Nr. 1","§ 51 Abs. 3","Art. 18 MarkenRL","Art. 8 MarkenRL"],"cases":[],"step":"step:schema_markenverletzung.4.4"},{"id":"k06c-4","typ":"mc","titel":"Verjährung","sachverhalt":"","frage":"Wann verjähren Ansprüche aus dem MarkenG?","optionen":["Nach 6 Monaten ab Kenntnis (§ 11 UWG analog)","Nach den allgemeinen Vorschriften des BGB: regelmäßig 3 Jahre ab Ende des Jahres der Kenntnis (§§ 195, 199 BGB)","Nach 10 Jahren ab Verletzung","Nie, solange die Marke eingetragen ist"],"richtig":1,"loesung":["§ 20 verweist auf die **allgemeinen Verjährungsvorschriften des BGB**: drei Jahre ab dem Schluss des Jahres, in dem der Anspruch entstanden ist und der Inhaber Kenntnis erlangt hat (§§ 195, 199 BGB). Anders als im UWG (§ 11: sechs Monate) gilt keine kurze Frist.","Bei Dauerverletzungen beginnt die Verjährung des Unterlassungsanspruchs nicht, solange die Verletzung andauert. Der Bereicherungsanspruch bleibt nach § 852 BGB erhalten (§ 20 S. 2)."],"merke":"","level":1,"concepts":["verjaehrung"],"norms":["§ 20"],"cases":[],"step":null}]}]},{"id":"k07","titel":"Benutzungszwang, Widerspruch und Löschung","untertitel":"§§ 25, 26, 42, 43, 49 bis 55 MarkenG","farbe":"#4B6B6B","icon":"loeschung","beschreibung":"Rechtserhaltende Benutzung, Benutzungsschonfrist und Einreden; Verfall und Nichtigkeit mit ihren Verfahren; das Widerspruchsverfahren.","kapitel":[{"id":"k07a","titel":"Rechtserhaltende Benutzung (§ 26)","einheiten":[{"id":"k07a-0","typ":"schema","titel":"Prüfungsschema: Benutzungszwang und Verfall","schema":"schema_benutzungszwang","text":"Nach fünf Jahren muss die Marke benutzt werden, sonst drohen der Verlust der Ansprüche (§ 25) und die Löschung (§ 49).","concepts":[],"norms":[],"cases":[]},{"id":"k07a-1","typ":"fall","titel":"Die Vorratsmarke","sachverhalt":"Ein Unternehmen hat „VOODOO“ 2015 für Bekleidung eintragen lassen und seit 2016 jährlich etwa 200 T-Shirts mit einem „VOODOO“-Etikett über seinen Onlineshop verkauft. 2024 erhebt ein Verletzer die Einrede der Nichtbenutzung.","frage":"Ist der geringe Umfang eine ernsthafte Benutzung?","antwort":true,"loesung":["**Ja!** Ernsthaft ist eine Benutzung, die entsprechend der Hauptfunktion der Marke erfolgt, um für die Waren einen **Absatzmarkt zu erschließen oder zu sichern**; nur eine symbolische Benutzung zur Rechtserhaltung genügt nicht (EuGH Ansul). Einen Mindestumfang gibt es nicht; die Benutzung muss nach Art, Umfang und Dauer wirtschaftlich sinnvoll sein (BGH VOODOO).","Tatsächlicher Absatz von Etikettenware über mehrere Jahre reicht. Die Beweislast trägt im Verletzungsprozess der Markeninhaber, wenn die Einrede nach § 25 Abs. 2 erhoben wird."],"merke":"Ernsthaft = auf dem Markt, nicht nur im Register. Kein Mindestumsatz.","level":1,"concepts":["ernsthafte_benutzung","nichtbenutzungseinrede"],"norms":["§ 26 Abs. 1","§ 25"],"cases":["eugh_ansul","bgh_voodoo"],"step":"step:schema_benutzungszwang.3.1"},{"id":"k07a-2","typ":"fall","titel":"Dorzo-Vision","sachverhalt":"Die Marke „Dorzo“ ist für Augentropfen eingetragen. Benutzt wird ausschließlich „Dorzo-Vision“, wobei der Verkehr die Kombination als einheitliches Zeichen wahrnimmt.","frage":"Ist die Benutzung von „Dorzo-Vision“ rechtserhaltend für „Dorzo“?","antwort":false,"loesung":["**Nein!** Die Benutzung in abweichender Form ist nur rechtserhaltend, wenn die Abweichung den **kennzeichnenden Charakter** der Marke nicht verändert (§ 26 Abs. 3). Erkennt der Verkehr das Markenwort in der Kombination nicht mehr als eigenständigen Herkunftshinweis, ist der kennzeichnende Charakter verändert (BGH Dorzo).","Anders liegt es bei bloßen beschreibenden oder werblichen Zusätzen und bei graphischer Modernisierung; diese verändern den kennzeichnenden Charakter nicht (BGH Probiotik)."],"merke":"Zusatz unschädlich, Verschmelzung schädlich.","level":2,"concepts":["abweichende_form"],"norms":["§ 26 Abs. 3"],"cases":["bgh_dorzo","bgh_probiotik"],"step":"step:schema_benutzungszwang.3.6"},{"id":"k07a-3","typ":"fall","titel":"LOTTO auf der Lottocard","sachverhalt":"Die Marke „LOTTO“ ist für Lotteriedienstleistungen eingetragen. Der Inhaber benutzt sie als Bestandteil von „LOTTOCARD“ und auf Annahmestellenschildern. Der Gegner meint, „Lotto“ werde vom Verkehr nur beschreibend verstanden, daher liege keine markenmäßige und keine rechtserhaltende Benutzung vor.","frage":"Kann einer eingetragenen Marke die rechtserhaltende Benutzung abgesprochen werden, weil sie beschreibend sei?","antwort":false,"loesung":["**Nein!** Die rechtserhaltende Benutzung kann nicht mit der Begründung verneint werden, die Marke sei für die Dienstleistungen beschreibend; das wäre ein Angriff auf die Eintragung selbst, der nur im Löschungsverfahren möglich ist (BGH LOTTOCARD). Es genügt, dass der Verkehr die konkrete Verwendung als Marke auffasst.","Die Verwendung in Kombination („LOTTOCARD“) kann rechtserhaltend sein, wenn „LOTTO“ seine kennzeichnende Eigenständigkeit behält."],"merke":"Im Benutzungsstreit wird die Schutzfähigkeit nicht neu aufgerollt.","level":3,"concepts":["rechtserhaltende_benutzung"],"norms":["§ 26 Abs. 1","§ 26 Abs. 3"],"cases":["bgh_lottocard"],"step":null},{"id":"k07a-4","typ":"mc","titel":"Wann beginnt die Schonfrist?","sachverhalt":"","frage":"Eine Marke wurde am 1. Februar 2020 eingetragen. Ein Widerspruch wurde am 30. November 2021 rechtskräftig zurückgewiesen. Ab wann läuft die fünfjährige Benutzungsschonfrist?","optionen":["Ab dem Anmeldetag","Ab dem 1. Februar 2020 (Eintragung)","Ab dem 30. November 2021 (Abschluss des Widerspruchsverfahrens)","Ab der ersten Benutzung"],"richtig":2,"loesung":["Wird gegen die Eintragung Widerspruch erhoben, beginnt die Benutzungsschonfrist erst mit dem **Abschluss des Widerspruchsverfahrens** (§ 26 Abs. 5). Ohne Widerspruch läuft sie ab der Eintragung.","Innerhalb der fünf Jahre ist Nichtbenutzung unschädlich: Weder die Einrede nach § 25 noch der Verfall nach § 49 Abs. 1 greifen."],"merke":"","level":2,"concepts":["benutzungsschonfrist"],"norms":["§ 26 Abs. 5","§ 25 Abs. 1","§ 49 Abs. 1","Art. 16 MarkenRL"],"cases":[],"step":"step:schema_benutzungszwang.1"}]},{"id":"k07b","titel":"Verfall und Nichtigkeit (§§ 49 bis 52)","einheiten":[{"id":"k07b-0","typ":"schema","titel":"Prüfungsschema: Löschung eingetragener Marken","schema":"schema_loeschung","text":"Merke die Grundunterscheidung: Verfall = nachträglich entstandener Mangel, Wirkung ex nunc. Nichtigkeit = ursprünglicher Mangel, Wirkung ex tunc.","concepts":[],"norms":[],"cases":[]},{"id":"k07b-1","typ":"fall","titel":"Wiederaufnahme in letzter Minute","sachverhalt":"Die Marke „ZIRKON“ wurde seit sieben Jahren nicht benutzt. Am 1. März erfährt der Inhaber, dass ein Konkurrent einen Verfallsantrag vorbereitet. Am 15. März startet er hektisch den Vertrieb. Der Antrag geht am 1. Mai beim DPMA ein.","frage":"Rettet die Benutzungsaufnahme im März die Marke?","antwort":false,"loesung":["**Nein!** Zwar heilt eine Benutzungsaufnahme nach Ablauf der fünf Jahre, aber vor dem Antrag, den Verfall grundsätzlich (§ 49 Abs. 1 S. 2). Das gilt aber nicht, wenn die Benutzung erst **innerhalb von drei Monaten vor dem Antrag** aufgenommen wurde, nachdem der Inhaber vom drohenden Antrag Kenntnis erlangt hatte (§ 49 Abs. 1 S. 3).","Die Regelung verhindert, dass Inhaber nur auf den Antrag hin Scheinbenutzungen starten."],"merke":"Heilung ja, aber nicht in den letzten drei Monaten nach Kenntnis vom Antrag.","level":2,"concepts":["verfall","benutzungsschonfrist"],"norms":["§ 49 Abs. 1"],"cases":[],"step":"step:schema_benutzungszwang.2"},{"id":"k07b-2","typ":"fall","titel":"TÜV als Gattungsbegriff?","sachverhalt":"Ein Wettbewerber beantragt den Verfall der Marke „TÜV“: Der Verkehr verwende „TÜV“ längst als Gattungsbegriff für jede technische Prüfung („den TÜV machen“).","frage":"Ist die Marke wegen Entwicklung zur gebräuchlichen Bezeichnung verfallen?","antwort":false,"loesung":["**Nein!** Verfall nach § 49 Abs. 2 Nr. 1 setzt voraus, dass die Marke **infolge des Verhaltens oder der Untätigkeit des Inhabers** im geschäftlichen Verkehr zur gebräuchlichen Bezeichnung geworden ist. Der BGH hat für „TÜV“ trotz verbreiteter umgangssprachlicher Verwendung die Entwicklung zum Gattungsbegriff verneint, weil der Verkehr weiterhin die Prüforganisationen dahinter sieht und der Inhaber gegen Verletzungen vorgeht (BGH TÜV II).","Der Inhaber einer bekannten Marke muss also aktiv gegen generische Verwendung vorgehen, um diesen Verfallsgrund zu vermeiden."],"merke":"Gattungsbegriff nur bei Untätigkeit des Inhabers und Wandel im geschäftlichen Verkehr.","level":2,"concepts":["uebliche_bezeichnung","verfall"],"norms":["§ 49 Abs. 2 Nr. 1"],"cases":["bgh_tuev_ii"],"step":null},{"id":"k07b-3","typ":"mc","titel":"Ex tunc oder ex nunc?","sachverhalt":"","frage":"Eine Marke wird wegen Bösgläubigkeit der Anmeldung gelöscht. Ab wann gilt sie als nicht existent?","optionen":["Ab dem Löschungsantrag (ex nunc)","Ab der Eintragung, also rückwirkend (ex tunc)","Ab dem Tag der Entscheidung","Ab dem Ende der Benutzungsschonfrist"],"richtig":1,"loesung":["Bösgläubigkeit ist ein absolutes Schutzhindernis (§ 8 Abs. 2 Nr. 14), die Löschung erfolgt wegen **Nichtigkeit** (§ 50). Die Wirkungen der Eintragung gelten dann als **von Anfang an nicht eingetreten** (§ 52 Abs. 2, ex tunc).","Beim Verfall (§ 49) gilt die Marke dagegen erst ab dem Löschungsantrag als erloschen, auf Antrag ab dem früheren Zeitpunkt des Verfallseintritts (§ 52 Abs. 1, ex nunc)."],"merke":"","level":2,"concepts":["nichtigkeit","verfall"],"norms":["§ 52"],"cases":[],"step":null},{"id":"k07b-4","typ":"fall","titel":"Wer darf löschen lassen?","sachverhalt":"Ein Verbraucher, der keinerlei Geschäftsbeziehung zur Markenbranche hat, beantragt die Löschung der Marke „Black Friday“ wegen Freihaltebedürfnisses. Der Inhaber bestreitet die Antragsbefugnis.","frage":"Kann jedermann einen Nichtigkeitsantrag wegen absoluter Schutzhindernisse stellen?","antwort":true,"loesung":["**Ja!** Der Antrag auf Nichtigkeit wegen absoluter Schutzhindernisse (§ 50) und der Verfallsantrag (§ 49) sind **Popularanträge**: Jede Person kann sie stellen (§ 53 Abs. 1), ein eigenes Interesse ist nicht nötig, weil absolute Schutzhindernisse im Allgemeininteresse bestehen.","Anders die Nichtigkeit wegen älterer Rechte (§ 51): Hier ist nur der Inhaber des älteren Rechts antragsbefugt. Art. 45 Abs. 3 MarkenRL schreibt beides so vor."],"merke":"§§ 49, 50: jedermann. § 51: nur der Inhaber des älteren Rechts.","level":1,"concepts":["nichtigkeit","verfall"],"norms":["§ 53","§ 50","§ 51","Art. 45 MarkenRL"],"cases":["bgh_black_friday"],"step":null}]},{"id":"k07c","titel":"Das Widerspruchsverfahren (§§ 42, 43)","einheiten":[{"id":"k07c-0","typ":"schema","titel":"Prüfungsschema: Widerspruchsverfahren","schema":"schema_widerspruch","text":"Der Widerspruch ist das schnelle, günstige Registerverfahren gegen jüngere Marken. Er ist befristet und auf bestimmte ältere Rechte beschränkt.","concepts":[],"norms":[],"cases":[]},{"id":"k07c-1","typ":"mc","titel":"Die Widerspruchsfrist","sachverhalt":"","frage":"Die Eintragung der Marke „NORDLICHT“ wird am 10. Januar veröffentlicht. Bis wann kann der Inhaber einer älteren Marke Widerspruch einlegen?","optionen":["Bis 10. Februar","Bis 10. April","Bis 10. Juli","Unbefristet"],"richtig":1,"loesung":["Der Widerspruch ist innerhalb von **drei Monaten** nach dem Tag der Veröffentlichung der Eintragung einzulegen (§ 42 Abs. 1). Danach bleibt nur der Nichtigkeitsantrag nach § 51 (§ 53 oder § 55), der unbefristet ist, aber der Verwirkung (§ 51 Abs. 2) unterliegt.","Widerspruchsgründe sind nur die in § 42 Abs. 2 genannten älteren Rechte; sonstige Rechte (Name, Urheberrecht, Design) können nur im Nichtigkeitsverfahren geltend gemacht werden."],"merke":"","level":1,"concepts":["widerspruch"],"norms":["§ 42","§ 51"],"cases":[],"step":"step:schema_widerspruch.1"},{"id":"k07c-2","typ":"fall","titel":"Die Einrede im Widerspruch","sachverhalt":"Die Widersprechende stützt sich auf eine seit acht Jahren eingetragene Marke. Der Inhaber der jüngeren Marke bestreitet die Benutzung. Die Widersprechende legt eine eidesstattliche Versicherung und Rechnungen für nur einen Teil der eingetragenen Waren vor.","frage":"Kann der Widerspruch auf alle eingetragenen Waren der älteren Marke gestützt werden?","antwort":false,"loesung":["**Nein!** Bestreitet der Gegner die Benutzung, muss die Widersprechende die rechtserhaltende Benutzung **glaubhaft machen** (§ 43 Abs. 1). Bei der Entscheidung werden nur die Waren berücksichtigt, für die die Benutzung glaubhaft gemacht wurde (§ 43 Abs. 1 S. 3).","Glaubhaftmachung bedeutet überwiegende Wahrscheinlichkeit mit präsenten Beweismitteln (eidesstattliche Versicherung, Rechnungen, Kataloge). Ein Beweis wie im Zivilprozess ist nicht nötig."],"merke":"Einrede im Widerspruch: Nur die glaubhaft gemachten Waren zählen.","level":2,"concepts":["nichtbenutzungseinrede","widerspruch"],"norms":["§ 43 Abs. 1","Art. 44 MarkenRL"],"cases":[],"step":"step:schema_widerspruch.2"},{"id":"k07c-3","typ":"fall","titel":"Das Namensrecht als Widerspruchsgrund","sachverhalt":"Schauspielerin Nora Stern sieht ihren Namen in der jüngeren Marke „Nora Stern“ für Kosmetik. Sie legt Widerspruch nach § 42 ein und beruft sich auf ihr Namensrecht nach § 12 BGB.","frage":"Ist das Namensrecht ein zulässiger Widerspruchsgrund?","antwort":false,"loesung":["**Nein!** Der Widerspruch kann nur auf die in § 42 Abs. 2 abschließend genannten Rechte gestützt werden: ältere Marken, notorisch bekannte Marken, Benutzungsmarken und geschäftliche Bezeichnungen, geschützte Ursprungsbezeichnungen und geographische Angaben. Das **Namensrecht** (§ 13 Abs. 2 Nr. 1) gehört nicht dazu.","Nora kann aber ein Nichtigkeitsverfahren nach § 51 Abs. 1 i.V.m. § 13 Abs. 2 Nr. 1 einleiten, beim DPMA (§ 53) oder mit Klage vor dem Landgericht (§ 55)."],"merke":"Widerspruch = enger Katalog des § 42 Abs. 2. Alles andere über § 51.","level":2,"concepts":["widerspruch","relative_schutzhindernisse","nichtigkeit"],"norms":["§ 42 Abs. 2","§ 13","§ 51"],"cases":[],"step":null}]}]},{"id":"k08","titel":"Geschäftliche Bezeichnungen und Domains","untertitel":"§§ 5, 15 MarkenG: Unternehmenskennzeichen und Werktitel","farbe":"#2F6B4F","icon":"firma","beschreibung":"Wie Unternehmenskennzeichen und Werktitel entstehen, wie ihre Verletzung geprüft wird und was für Domainnamen gilt.","kapitel":[{"id":"k08a","titel":"Unternehmenskennzeichen","einheiten":[{"id":"k08a-0","typ":"schema","titel":"Prüfungsschema: Schutz geschäftlicher Bezeichnungen","schema":"schema_unternehmenskennzeichen","text":"§ 15 ist das Pendant zu § 14 für Unternehmenskennzeichen und Werktitel. Statt Warenähnlichkeit prüfst du die Branchennähe.","concepts":[],"norms":[],"cases":[]},{"id":"k08a-1","typ":"fall","titel":"Die Domain als Kennzeichen","sachverhalt":"Ein Softwarehaus betreibt seit Jahren unter „soco.de“ eine Website, über die es sich als Unternehmen präsentiert und Aufträge akquiriert. Einen Firmennamen „soco“ hat es nicht.","frage":"Kann der Domainname als Unternehmenskennzeichen nach § 5 Abs. 2 geschützt sein?","antwort":true,"loesung":["**Ja!** Ein Domainname kann Unternehmenskennzeichen sein, wenn der Verkehr in ihm einen **Hinweis auf das Unternehmen** und nicht nur eine Adresse sieht (BGH soco.de). Der Schutz entsteht mit der **Benutzungsaufnahme im geschäftlichen Verkehr**, nicht schon mit der Registrierung.","Voraussetzung ist Unterscheidungskraft: Bei beschreibenden Domains wie „wetter.de“ fehlt sie, dann bleibt nur die Verkehrsgeltung."],"merke":"Registrieren schafft kein Kennzeichenrecht, Benutzen schon.","level":1,"concepts":["domain","unternehmenskennzeichen"],"norms":["§ 5 Abs. 2"],"cases":["bgh_soco_de"],"step":"step:schema_unternehmenskennzeichen.1.1"},{"id":"k08a-2","typ":"fall","titel":"Das Firmenschlagwort","sachverhalt":"Die „defacto marketing GmbH“ tritt seit 1990 auf; Kunden nennen sie einfach „defacto“. Ein anderes Unternehmen registriert „defacto.de“ und bietet dort Marketingdienstleistungen an.","frage":"Genießt der Bestandteil „defacto“ selbständigen Schutz, obwohl die Firma länger lautet?","antwort":true,"loesung":["**Ja!** Ein Firmenbestandteil ist selbständig geschützt, wenn er **seiner Natur nach geeignet** ist, als schlagwortartiger Hinweis auf das Unternehmen zu wirken. Eine tatsächliche schlagwortartige Verwendung ist nicht erforderlich; „marketing GmbH“ ist beschreibend, „defacto“ kennzeichnend (BGH defacto).","Die Verwechslungsgefahr nach § 15 Abs. 2 richtet sich nach Branchennähe, Kennzeichnungskraft und Zeichenähnlichkeit. Bei identischer Branche und identischem Schlagwort ist sie gegeben."],"merke":"Der kennzeichnende Teil der Firma ist für sich geschützt.","level":2,"concepts":["firmenschlagwort","branchennaehe"],"norms":["§ 5 Abs. 2","§ 15 Abs. 2"],"cases":["bgh_defacto"],"step":"step:schema_unternehmenskennzeichen.3"},{"id":"k08a-3","typ":"fall","titel":"shell.de","sachverhalt":"Herr Andreas Shell registriert „shell.de“ für seine private Homepage und ein kleines Übersetzungsbüro. Der Mineralölkonzern verlangt die Freigabe der Domain.","frage":"Gilt bei Gleichnamigkeit auch hier das Prinzip „wer zuerst registriert“?","antwort":false,"loesung":["**Nein, ausnahmsweise nicht!** Grundsätzlich gilt bei Gleichnamigen für Domains das **Prioritätsprinzip der Registrierung**. Bei **überragender Bekanntheit** eines der Namensträger erwartet der Verkehr unter „shell.de“ aber den Konzern; der Privatmann muss einen unterscheidenden Zusatz wählen (BGH shell.de).","Rechtsgrundlage ist hier das Namensrecht (§ 12 BGB), weil die private Nutzung außerhalb des geschäftlichen Verkehrs liegt; im geschäftlichen Verkehr wären §§ 5, 15 vorrangig."],"merke":"Gleichnamige: Registrierungspriorität, außer einer ist überragend bekannt.","level":3,"concepts":["domain","gleichnamigkeit"],"norms":["§ 5","§ 15"],"cases":["bgh_shell_de","bgh_peek_cloppenburg"],"step":null},{"id":"k08a-4","typ":"mc","titel":"Was ersetzt die Warenähnlichkeit?","sachverhalt":"","frage":"Bei der Verwechslungsgefahr zwischen zwei Unternehmenskennzeichen (§ 15 Abs. 2) tritt an die Stelle der Waren-/Dienstleistungsähnlichkeit …","optionen":["die Unternehmensgröße","die Branchennähe","die geographische Nähe","die Rechtsform"],"richtig":1,"loesung":["Statt Waren werden Unternehmen verglichen: Maßgeblich ist die **Branchennähe**, also Berührungspunkte der Unternehmen auf dem Markt nach Art der Waren/Dienstleistungen, Vertriebswegen und Kundenkreisen. Sie steht in Wechselwirkung mit Kennzeichnungskraft und Zeichenähnlichkeit.","Bei absoluter Branchenverschiedenheit scheidet Verwechslungsgefahr aus; dann hilft nur § 15 Abs. 3 (bekannte geschäftliche Bezeichnung)."],"merke":"","level":1,"concepts":["branchennaehe"],"norms":["§ 15 Abs. 2","§ 15 Abs. 3"],"cases":["bgh_defacto"],"step":null}]},{"id":"k08b","titel":"Werktitel","einheiten":[{"id":"k08b-1","typ":"fall","titel":"Die Wetter-App","sachverhalt":"Ein Medienunternehmen bietet seit Jahren unter „wetter.de“ Wetterinformationen im Internet und als App an. Ein Konkurrent bringt die App „wetter DE“ heraus.","frage":"Genießt „wetter.de“ Werktitelschutz nach § 5 Abs. 3?","antwort":false,"loesung":["**Nein!** Apps und Internet-Informationsangebote sind zwar **titelschutzfähige Werke** (BGH wetter.de, erstmals entschieden). „wetter.de“ fehlt aber die **originäre Unterscheidungskraft**: Die Bezeichnung beschreibt nur den Inhalt.","Bei Zeitschriften gilt wegen der Verkehrsgewöhnung an beschreibende Titel ein abgesenkter Maßstab. Für Apps und Domains hat der BGH eine solche Gewöhnung nicht festgestellt. Ohne Verkehrsgeltung bleibt der Titel schutzlos."],"merke":"Apps sind Werke, aber beschreibende Titel bleiben ohne Verkehrsgeltung schutzlos.","level":2,"concepts":["werktitel","unterscheidungskraft"],"norms":["§ 5 Abs. 3"],"cases":["bgh_wetter_de"],"step":"step:schema_unternehmenskennzeichen.1.2"},{"id":"k08b-2","typ":"fall","titel":"Augsburger gegen Leipziger Puppenkiste","sachverhalt":"Die „Augsburger Puppenkiste“ ist als Werktitel und Marke geschützt. Ein Theater nennt sich „Leipziger Puppenkiste“.","frage":"Schützt der Werktitel auch gegen die Annahme, beide Theater seien wirtschaftlich verbunden?","antwort":false,"loesung":["**Grundsätzlich nein!** Werktitel schützen nur gegen die **unmittelbare Verwechslung der Werke**. Eine Verwechslungsgefahr im weiteren Sinne (Annahme geschäftlicher Verbindungen) kommt nur bei bekannten Titeln in Betracht, denen der Verkehr auch einen Hinweis auf die betriebliche Herkunft entnimmt (BGH Augsburger Puppenkiste).","Im konkreten Fall verneinte der BGH schon die Zeichenähnlichkeit: Die Ortsangaben prägen mit, „Puppenkiste“ ist kennzeichnungsschwach."],"merke":"Werktitel unterscheiden Werke, nicht Unternehmen.","level":3,"concepts":["werktitel","verwechslungsgefahr_weiterer_sinn"],"norms":["§ 5 Abs. 3","§ 15 Abs. 2"],"cases":["bgh_augsburger_puppenkiste"],"step":null},{"id":"k08b-3","typ":"fall","titel":"Wem gehört der Songtitel?","sachverhalt":"Komponist K und Textdichter T haben das Musikstück „Das Omen (Teil 1)“ geschaffen; der Verlag V hat es vermarktet. Ein Dritter veröffentlicht „Omen – Extended Mix“. V klagt aus dem Werktitel.","frage":"Steht das Werktitelrecht dem Verlag zu, weil er den Titel vermarktet hat?","antwort":false,"loesung":["**Nein!** Die Inhaberschaft am Werktitel folgt der **Zuordnung des Werks**: Inhaber ist, wem das Werk zuzuordnen ist, bei einem Musikstück also Komponist und Textdichter (BGH Das Omen). Der Verlag kann Rechte nur aus abgeleiteter Berechtigung oder Lizenz geltend machen.","Der BGH bejahte die Unterscheidungskraft von „Das Omen (Teil 1)“; die Verwechslungsgefahr ist unter Berücksichtigung der Werkähnlichkeit zu prüfen."],"merke":"Werktitelrecht hängt am Werk, nicht an der Vermarktung.","level":3,"concepts":["werktitel"],"norms":["§ 5 Abs. 3","§ 15"],"cases":["bgh_das_omen"],"step":null}]}]},{"id":"k09","titel":"Rechtsfolgen und Durchsetzung","untertitel":"§§ 14 Abs. 5 bis 7, 18, 19 MarkenG und Haftung Dritter","farbe":"#8A2F1F","icon":"hammer","beschreibung":"Unterlassung, Schadensersatz mit dreifacher Schadensberechnung, Auskunft und Vernichtung; Täter, Teilnehmer und Störer.","kapitel":[{"id":"k09a","titel":"Unterlassung und Schadensersatz","einheiten":[{"id":"k09a-1","typ":"fall","titel":"Die einmalige Verletzung","sachverhalt":"Händler H hat ein einziges Mal Plagiate verkauft, den Rest vernichtet und schriftlich versichert, es nie wieder zu tun, allerdings ohne Vertragsstrafeversprechen.","frage":"Besteht der Unterlassungsanspruch nach § 14 Abs. 5 weiter?","antwort":true,"loesung":["**Ja!** Die begangene Verletzung begründet eine **Vermutung der Wiederholungsgefahr**. Diese wird regelmäßig nur durch eine **strafbewehrte Unterlassungserklärung** ausgeräumt; eine bloße Zusicherung reicht nicht.","Ein Verschulden ist für den Unterlassungsanspruch nicht erforderlich. Der Anspruch besteht auch bei Erstbegehungsgefahr, wenn eine Verletzung ernsthaft droht (§ 14 Abs. 5 S. 2)."],"merke":"Wiederholungsgefahr wird vermutet und nur mit Vertragsstrafe beseitigt.","level":1,"concepts":["unterlassungsanspruch"],"norms":["§ 14 Abs. 5"],"cases":[],"step":"step:schema_markenverletzung.5"},{"id":"k09a-2","typ":"mc","titel":"Dreifache Schadensberechnung","sachverhalt":"","frage":"Der Verletzer hat mit Plagiaten 100.000 Euro Gewinn erzielt; ein üblicher Lizenzsatz wären 5 % vom Umsatz; der Inhaber kann keinen konkreten Umsatzrückgang nachweisen. Welche Berechnungsarten stehen ihm zur Wahl?","optionen":["Nur der konkrete Schaden","Konkreter Schaden, Herausgabe des Verletzergewinns oder angemessene Lizenzgebühr, nach seiner Wahl","Nur die Lizenzgebühr","Verletzergewinn plus Lizenzgebühr kumulativ"],"richtig":1,"loesung":["§ 14 Abs. 6 erlaubt die **dreifache Schadensberechnung**: (1) konkreter Schaden einschließlich entgangenem Gewinn, (2) Herausgabe des **Verletzergewinns** (S. 2), (3) **Lizenzanalogie** (S. 3). Die Arten sind alternativ; eine Kumulation ist ausgeschlossen.","Voraussetzung ist Verschulden; Fahrlässigkeit wird im geschäftlichen Verkehr wegen der Prüfpflicht regelmäßig bejaht. Bei der Lizenzanalogie ist zu fragen, was vernünftige Parteien vereinbart hätten (BGH BTK)."],"merke":"","level":2,"concepts":["schadensersatz","lizenzanalogie"],"norms":["§ 14 Abs. 6"],"cases":["bgh_btk"],"step":"step:schema_markenverletzung.6.1"},{"id":"k09a-3","typ":"fall","titel":"Der Chef haftet mit","sachverhalt":"Ein Angestellter des Handelsunternehmens H bestellt eigenmächtig Plagiate und verkauft sie über den Laden von H. Der Inhaber von H wusste nichts davon.","frage":"Kann der Markeninhaber Unterlassung und Schadensersatz auch gegen H verlangen?","antwort":true,"loesung":["**Ja!** Wird die Verletzungshandlung in einem geschäftlichen Betrieb von einem Angestellten oder Beauftragten begangen, kann der Unterlassungsanspruch **und der Schadensersatzanspruch** auch gegen den Inhaber des Betriebs geltend gemacht werden (§ 14 Abs. 7). Eine Exkulpation wie bei § 831 BGB ist nicht möglich.","Für den Schadensersatzanspruch gegen den Betriebsinhaber ist das Verschulden des Angestellten maßgeblich."],"merke":"§ 14 Abs. 7: Der Betriebsinhaber haftet ohne Entlastungsmöglichkeit.","level":2,"concepts":["schadensersatz","unterlassungsanspruch"],"norms":["§ 14 Abs. 7"],"cases":[],"step":null},{"id":"k09a-4","typ":"mc","titel":"Annexansprüche","sachverhalt":"","frage":"Welcher Anspruch dient dazu, den Schadensersatz überhaupt beziffern zu können, und richtet sich bei offensichtlicher Verletzung auch gegen Spediteure und Lagerhalter?","optionen":["Vernichtungsanspruch (§ 18 Abs. 1)","Auskunftsanspruch (§ 19)","Rückrufanspruch (§ 18 Abs. 2)","Urteilsbekanntmachung (§ 19c)"],"richtig":1,"loesung":["Der **Auskunftsanspruch** nach § 19 verpflichtet den Verletzer zur Auskunft über Herkunft und Vertriebsweg der Waren (Abs. 1, 3); bei offensichtlicher Verletzung auch Dritte wie Spediteure, Lagerhalter oder Plattformbetreiber (Abs. 2). Im Eilverfahren durchsetzbar (Abs. 7).","Daneben: Vernichtung und Rückruf (§ 18, mit Verhältnismäßigkeitsvorbehalt in Abs. 3), Vorlage und Besichtigung (§ 19a), Sicherung (§ 19b), Urteilsbekanntmachung (§ 19c). Alle setzen kein Verschulden voraus."],"merke":"","level":1,"concepts":["vernichtung_auskunft"],"norms":["§ 18","§ 19"],"cases":[],"step":"step:schema_markenverletzung.6.2"}]},{"id":"k09b","titel":"Täter, Teilnehmer, Störer","einheiten":[{"id":"k09b-1","typ":"fall","titel":"Die Auktionsplattform","sachverhalt":"Auf einer Internet-Auktionsplattform bieten Dritte gefälschte Uhren an. Der Markeninhaber weist den Betreiber auf ein konkretes, klar erkennbares Fälschungsangebot hin. Der Betreiber sperrt es, unternimmt aber nichts gegen gleichartige neue Angebote.","frage":"Haftet der Plattformbetreiber auf Unterlassung?","antwort":true,"loesung":["**Ja, als Störer!** Störer ist, wer willentlich und adäquat kausal zur Verletzung beiträgt und **zumutbare Prüfpflichten** verletzt. Nach dem Hinweis auf eine klare Rechtsverletzung muss der Betreiber nicht nur das Angebot sperren, sondern auch dafür sorgen, dass es nicht zu weiteren gleichartigen Verletzungen kommt (BGH Internet-Versteigerung II).","Der Störer haftet nur auf Unterlassung, nicht auf Schadensersatz. Eine allgemeine Pflicht, alle Angebote manuell zu prüfen, besteht nicht (BGH Kinderhochstühle im Internet)."],"merke":"Störer: Prüfpflicht erst ab Hinweis, nur Unterlassung.","level":2,"concepts":["stoererhaftung"],"norms":["§ 14 Abs. 5"],"cases":["bgh_internet_versteigerung_ii","bgh_kinderhochstuehle"],"step":null},{"id":"k09b-2","typ":"fall","titel":"Nachfüllware für Markenspender","sachverhalt":"Hersteller N verkauft Papierhandtücher als „passend auch für Tork-Spender“. Kunden befüllen damit ihre mit der Marke „Tork“ gekennzeichneten Spender in Waschräumen, wo Nutzer die Handtücher dem Markeninhaber zuordnen.","frage":"Ist N Täter einer Markenverletzung?","antwort":false,"loesung":["**Nein!** Täter ist, wer die Verletzungshandlung selbst begeht. Das Befüllen des markierten Spenders mit Fremdware nehmen die **Kunden** vor; N handelt insoweit nicht selbst (BGH Tork).","In Betracht kommt aber eine **Teilnahme** (Beihilfe), wenn N vorsätzlich an einer vorsätzlichen Haupttat der Kunden mitwirkt, oder eine Störerhaftung. Für den Hinweis „passend für“ gilt zudem § 23 Abs. 1 Nr. 3."],"merke":"Wer nur liefert, ist kein Täter; er kann aber Teilnehmer oder Störer sein.","level":3,"concepts":["stoererhaftung","ersatzteilhinweis"],"norms":["§ 14 Abs. 2 Nr. 1","§ 23 Abs. 1 Nr. 3"],"cases":["bgh_tork"],"step":null},{"id":"k09b-3","typ":"mc","titel":"Wer haftet auf Schadensersatz?","sachverhalt":"","frage":"Welche Aussage ist richtig?","optionen":["Täter, Teilnehmer und Störer haften alle auf Schadensersatz","Täter und Teilnehmer haften bei Verschulden auf Schadensersatz, der Störer nur auf Unterlassung","Nur der Täter haftet überhaupt","Der Störer haftet nur auf Schadensersatz, nicht auf Unterlassung"],"richtig":1,"loesung":["**Täter und Teilnehmer** haften bei Verschulden auf Schadensersatz (§ 14 Abs. 6) und auf die Annexansprüche. Der **Störer** haftet dagegen nur auf Unterlassung und Beseitigung, weil ihm kein eigenes Verschulden an der Haupttat vorgeworfen wird, sondern nur die Verletzung von Prüfpflichten.","Im Lauterkeitsrecht hat der BGH die Störerhaftung aufgegeben, im Markenrecht besteht sie fort (Kinderhochstühle im Internet)."],"merke":"","level":2,"concepts":["stoererhaftung","schadensersatz"],"norms":[],"cases":["bgh_kinderhochstuehle"],"step":null}]}]},{"id":"k10","titel":"Unionsmarke und IR-Marke","untertitel":"UMV, § 125b ff. und §§ 112 bis 125 MarkenG","farbe":"#2B5B8A","icon":"europa","beschreibung":"Vorgehen aus einer Unionsmarke oder einer international registrierten Marke in Deutschland: Normketten, Bekanntheit in der Union, Benutzung, Gerichte und Fristen.","kapitel":[{"id":"k10a","titel":"Die Unionsmarke","einheiten":[{"id":"k10a-0","typ":"schema","titel":"Prüfungsschema: Vorgehen aus einer Unionsmarke","schema":"schema_unionsmarke","text":"Die UMV gilt unmittelbar; das MarkenG kommt nur über die Brücke des § 125b ins Spiel.","concepts":[],"norms":[],"cases":[]},{"id":"k10a-1","typ":"fall","titel":"Bekannt in Österreich","sachverhalt":"Die Unionsmarke „PAGO“ für Fruchtsäfte ist in Österreich sehr bekannt, im Rest der EU kaum. Ein österreichischer Konkurrent verwendet ein ähnliches Zeichen.","frage":"Ist „PAGO“ eine in der Union bekannte Marke im Sinne des Art. 9 Abs. 2 lit. c UMV?","antwort":true,"loesung":["**Ja!** Eine Unionsmarke ist in der Union bekannt, wenn sie einem bedeutenden Teil des Publikums in einem **wesentlichen Teil des Unionsgebiets** bekannt ist. Das Gebiet eines einzigen Mitgliedstaats kann ein wesentlicher Teil sein (EuGH PAGO).","Der Bekanntheitsschutz der Unionsmarke gilt dann unionsweit, auch in Mitgliedstaaten, in denen die Marke unbekannt ist, sofern dort eine gedankliche Verknüpfung möglich ist."],"merke":"Ein Mitgliedstaat kann für die Bekanntheit in der Union reichen.","level":2,"concepts":["bekanntheit_union","bekannte_marke"],"norms":["§ 125b"],"cases":["eugh_pago"],"step":null},{"id":"k10a-2","typ":"fall","titel":"Bekannt in der Union, unbekannt in Deutschland","sachverhalt":"Der Inhaber einer Unionsmarke, die in Italien und Frankreich bekannt ist, in Deutschland aber niemand kennt, geht nach § 9 Abs. 1 Nr. 3 gegen eine jüngere deutsche Marke vor.","frage":"Genügt die Bekanntheit in Italien und Frankreich für den Erfolg des Antrags?","antwort":false,"loesung":["**Nur für die erste Stufe!** Nach § 125b Nr. 1 tritt an die Stelle der Bekanntheit im Inland die **Bekanntheit in der Union**; ein wesentlicher Teil der Union genügt, auch wenn Deutschland nicht dazugehört (EuGH Iron & Smith).","Für die Ausnutzung oder Beeinträchtigung **in Deutschland** muss die Unionsmarke aber einem wirtschaftlich nicht unbedeutenden Teil des deutschen Publikums bekannt sein, sonst fehlt die gedankliche Verknüpfung im Kollisionsgebiet. Kennt in Deutschland niemand die Marke, scheitert der Antrag."],"merke":"Zwei Stufen: Bekanntheit in der Union (Tatbestand) plus Bekanntheit beim deutschen Publikum (Verknüpfung).","level":3,"concepts":["bekanntheit_union","relative_schutzhindernis_bekannt","gedankliche_verknuepfung"],"norms":["§ 125b","§ 9 Abs. 1 Nr. 3"],"cases":["eugh_iron_smith"],"step":"step:schema_relative_schutzhindernisse.4.3.1"},{"id":"k10a-3","typ":"fall","titel":"Benutzung nur in den Niederlanden","sachverhalt":"Die Unionsmarke „ONEL“ wird seit Jahren nur in den Niederlanden ernsthaft benutzt. Der Inhaber legt aus ihr Widerspruch gegen eine deutsche Marke ein; der Gegner erhebt die Nichtbenutzungseinrede.","frage":"Genügt die Benutzung in einem einzigen Mitgliedstaat?","antwort":true,"loesung":["**Ja, grundsätzlich!** Bei der ernsthaften Benutzung einer Unionsmarke nach Art. 18 UMV sind die **Grenzen der Mitgliedstaaten außer Betracht** zu lassen. Die Benutzung in einem Mitgliedstaat kann ausreichen, wenn sie nach Markt, Waren und Umfang geeignet ist, Marktanteile in der Union zu halten oder zu gewinnen (EuGH Leno Merken).","Im deutschen Widerspruchsverfahren ordnet § 125b Nr. 4 an, dass Art. 18 UMV an die Stelle des § 26 tritt."],"merke":"Art. 18 UMV: Union ist ein Markt, Landesgrenzen zählen nicht.","level":2,"concepts":["benutzung_union"],"norms":["§ 125b","§ 43 Abs. 1"],"cases":["eugh_leno_merken"],"step":"step:schema_unionsmarke.3.2"},{"id":"k10a-4","typ":"fall","titel":"Das unionsweite Verbot","sachverhalt":"Ein Unionsmarkengericht in Frankreich stellt fest, dass DHL die Unionsmarke „WEBSHIPPING“ von Chronopost verletzt, und spricht ein Verbot aus. DHL meint, das Verbot gelte nur in Frankreich.","frage":"Wirkt das Verbot grundsätzlich für die gesamte Union?","antwort":true,"loesung":["**Ja!** Ein von einem Unionsmarkengericht ausgesprochenes Verbot erstreckt sich **grundsätzlich auf das gesamte Gebiet der Union**, ebenso die Zwangsmaßnahmen zu seiner Durchsetzung (EuGH DHL/Chronopost). Das folgt aus der Einheitlichkeit der Unionsmarke.","Grenzen: Das Gericht muss das Verbot beschränken, wenn die Verletzung nur in einem Teil der Union vorliegt, etwa weil Verwechslungsgefahr nur in bestimmten Sprachräumen besteht (EuGH combit), oder wenn der Kläger sein Begehren beschränkt. Zuständig nach Art. 125 Abs. 5 (Handlungsort) ist die Kognition ohnehin auf den Mitgliedstaat beschränkt (Art. 126 Abs. 2)."],"merke":"Unionsweit ist die Regel, territorial beschränkt die begründete Ausnahme.","level":3,"concepts":["unionsmarkengericht"],"norms":["§ 125e"],"cases":["eugh_dhl_chronopost","eugh_combit"],"step":"step:schema_unionsmarke.2.4"},{"id":"k10a-5","typ":"mc","titel":"Die Brücke § 125b","sachverhalt":"","frage":"Der Inhaber einer Unionsmarke verlangt vor dem Landgericht Vernichtung der Plagiate und Auskunft. Die UMV regelt diese Ansprüche nicht selbst. Woraus ergeben sie sich?","optionen":["Aus Art. 9 UMV direkt","Aus §§ 18, 19 MarkenG über § 125b Nr. 2","Aus dem UWG","Gar nicht, nur Unterlassung ist möglich"],"richtig":1,"loesung":["§ 125b Nr. 2 stellt dem Inhaber einer eingetragenen Unionsmarke neben den Ansprüchen aus Art. 9 bis 11 UMV die Ansprüche auf **Schadensersatz, Vernichtung und Rückruf (§ 18), Auskunft (§ 19), Vorlage (§ 19a), Sicherung (§ 19b) und Urteilsbekanntmachung (§ 19c)** zur Verfügung. Art. 129 UMV verweist für nicht geregelte Fragen auf nationales Recht.","Zuständig sind ausschließlich die Unionsmarkengerichte, in Deutschland bestimmte Landgerichte (§ 125e)."],"merke":"","level":2,"concepts":["unionsmarke","unionsmarkengericht","vernichtung_auskunft"],"norms":["§ 125b","§ 125e"],"cases":[],"step":"step:schema_unionsmarke.2.4"}]},{"id":"k10b","titel":"Die IR-Marke","einheiten":[{"id":"k10b-0","typ":"schema","titel":"Prüfungsschema: Vorgehen aus einer IR-Marke","schema":"schema_ir_marke","text":"Die IR-Marke mit Schutzerstreckung auf Deutschland wirkt wie eine deutsche Marke. Die Besonderheiten liegen bei Fristen und Schutzverweigerung.","concepts":[],"norms":[],"cases":[]},{"id":"k10b-1","typ":"fall","titel":"Wirkung wie eine deutsche Marke","sachverhalt":"Ein Schweizer Unternehmen hat seine Marke über die WIPO international registriert und auf Deutschland erstreckt. Das DPMA hat keine Schutzverweigerung ausgesprochen. Nun kopiert ein deutscher Händler das Zeichen.","frage":"Kann das Unternehmen direkt aus § 14 gegen den Händler vorgehen?","antwort":true,"loesung":["**Ja!** Die auf Deutschland erstreckte IR-Marke hat **dieselbe Wirkung**, wie wenn sie am Tag der internationalen Registrierung beim DPMA angemeldet und eingetragen worden wäre (§ 112 Abs. 1, für Protokollmarken über § 124). §§ 14 ff. gelten unmittelbar.","Zeitrang ist der Tag der internationalen Registrierung bzw. der nachträglichen Schutzerstreckung (Art. 3ter PMMA). Die Wirkung entfällt nur, wenn der Schutz nach §§ 113 bis 115 verweigert wird (§ 112 Abs. 2)."],"merke":"IR-Marke (DE) = deutsche Marke mit dem Zeitrang der internationalen Registrierung.","level":1,"concepts":["ir_marke"],"norms":["§ 112","§ 124"],"cases":[],"step":"step:schema_ir_marke.2"},{"id":"k10b-2","typ":"mc","titel":"Wann beginnt die Schonfrist der IR-Marke?","sachverhalt":"","frage":"Eine IR-Marke wurde am 1. Juni 2019 international registriert. Die Schutzverweigerungsfrist des DPMA lief am 1. Dezember 2020 ab, ohne dass Schutz verweigert wurde. Ab wann läuft die fünfjährige Benutzungsschonfrist?","optionen":["Ab 1. Juni 2019","Ab 1. Dezember 2020","Ab Eintragung der Basismarke","Ab der ersten Benutzung in Deutschland"],"richtig":1,"loesung":["Für IR-Marken tritt an die Stelle des Eintragungstags einer der in **§ 115 Abs. 2** genannten Tage: der Ablauf der Schutzverweigerungsfrist nach Art. 5 Abs. 2 PMMA oder, bei zunächst verweigertem Schutz, der Tag der rechtskräftigen Schutzgewährung. Darauf verweisen § 116 (Widerspruch, Nichtigkeit) und § 117 (Einrede nach § 25).","Die Schonfrist beginnt also nicht mit der internationalen Registrierung, sondern erst, wenn der Schutz in Deutschland feststeht."],"merke":"","level":2,"concepts":["ir_benutzungsschonfrist"],"norms":["§ 115","§ 116","§ 117"],"cases":[],"step":"step:schema_ir_marke.5"},{"id":"k10b-3","typ":"fall","titel":"Widerspruch gegen die IR-Marke","sachverhalt":"Die Inhaberin einer deutschen Marke will gegen eine auf Deutschland erstreckte IR-Marke vorgehen. Sie sucht im DPMA-Register nach der Veröffentlichung der Eintragung, um die Widerspruchsfrist zu berechnen.","frage":"Läuft die Widerspruchsfrist ab der Veröffentlichung im deutschen Markenblatt?","antwort":false,"loesung":["**Nein!** Bei IR-Marken tritt an die Stelle der Veröffentlichung der Eintragung die Veröffentlichung in der **WIPO-Gazette** (§ 114 Abs. 1). Die Widerspruchsfrist beginnt mit dem ersten Tag des Monats, der dem Ausgabemonat des Gazette-Hefts folgt (§ 114 Abs. 2).","Rechtsfolge eines erfolgreichen Widerspruchs ist nicht die Löschung, sondern die **Schutzverweigerung** für Deutschland (§ 114 Abs. 3); bei Verfall oder Nichtigkeit die nachträgliche Schutzentziehung (§ 115)."],"merke":"IR-Marke: Gazette statt Markenblatt, Schutzverweigerung statt Löschung.","level":2,"concepts":["ir_schutzverweigerung","widerspruch"],"norms":["§ 114","§ 115"],"cases":[],"step":"step:schema_ir_marke.3.2"},{"id":"k10b-4","typ":"fall","titel":"Der Angriff auf die Basismarke","sachverhalt":"Drei Jahre nach der internationalen Registrierung wird die Basismarke im Ursprungsland rechtskräftig gelöscht.","frage":"Bleibt die deutsche Schutzerstreckung der IR-Marke davon unberührt?","antwort":false,"loesung":["**Nein!** Während der ersten **fünf Jahre** ab der internationalen Registrierung ist die IR-Marke von der Basismarke abhängig: Wird diese gelöscht, entfällt auch die internationale Registrierung mit allen Erstreckungen (Art. 6 PMMA, sogenannter „central attack“).","Der Inhaber kann die IR-Marke dann innerhalb von drei Monaten in nationale Anmeldungen **umwandeln** und den Zeitrang der internationalen Registrierung behalten (Art. 9quinquies PMMA, § 125). Eine IR-Marke mit Benennung EU wird dabei wie eine Unionsmarke behandelt (Art. 189 ff. UMV)."],"merke":"Fünf Jahre Abhängigkeit, dann Selbständigkeit; Rettung durch Umwandlung.","level":3,"concepts":["ir_marke","senioritaet"],"norms":["§ 125"],"cases":[],"step":"step:schema_ir_marke.3.4"}]}]},{"id":"k11","titel":"Die Markenrechtsrichtlinie (EU) 2015/2436","untertitel":"Der unionsrechtliche Bauplan des MarkenG","farbe":"#1F5F8B","icon":"europa","beschreibung":"Aufbau und Inhalt der Richtlinie, ihre Umsetzung durch das MaMoG 2019, richtlinienkonforme Auslegung und die Neuerungen: Transit, Vorbereitungshandlungen, Namensschranke, Schonfrist, Amtsverfahren.","kapitel":[{"id":"k11a","titel":"Struktur, Harmonisierung, Auslegung","einheiten":[{"id":"k11a-0","typ":"intro","titel":"Warum du die Richtlinie kennen musst","text":"Fast jede Norm des MarkenG hat einen Zwilling in der **Markenrechtsrichtlinie (EU) 2015/2436**. Sie harmonisiert das materielle Markenrecht aller Mitgliedstaaten und seit 2019 auch zentrale Verfahren. Deutschland hat sie mit dem Markenrechtsmodernisierungsgesetz (MaMoG) umgesetzt. Praktische Folge: Begriffe wie Unterscheidungskraft, Verwechslungsgefahr oder ernsthafte Benutzung bedeuten in allen Mitgliedstaaten dasselbe, und das letzte Wort hat der EuGH. Dieser Kurs zeigt dir den Aufbau der Richtlinie und die Stellen, an denen sie das MarkenG geprägt oder verändert hat.","concepts":["markenrl","richtlinienkonforme_auslegung"],"norms":["Art. 1 MarkenRL","Art. 54 MarkenRL"],"cases":[]},{"id":"k11a-1","typ":"schema","titel":"Prüfungsschema: Markenrechtsrichtlinie anwenden","schema":"schema_markenrl","text":"Verschaffe dir zuerst den Überblick über die Kapitel der Richtlinie und die Umsetzungstabelle.","concepts":[],"norms":[],"cases":[]},{"id":"k11a-2","typ":"fall","titel":"Die Benutzungsmarke und Brüssel","sachverhalt":"Bäckerin Bea hat durch jahrelange Benutzung eine Benutzungsmarke „KRUSTIS“ nach § 4 Nr. 2 MarkenG erworben. Ein Konkurrent meint, Benutzungsmarken seien unionsrechtswidrig, weil die MarkenRL nur eingetragene Marken kenne.","frage":"Verstößt § 4 Nr. 2 MarkenG gegen die Markenrechtsrichtlinie?","antwort":false,"loesung":["**Nein!** Die Richtlinie gilt nach Art. 1 MarkenRL nur für **eingetragene oder angemeldete** Marken und IR-Marken mit Wirkung im Mitgliedstaat. Benutzungsmarken, geschäftliche Bezeichnungen (§ 5) und die Rechtsfolgen der Verletzung sind nicht harmonisiert.","In diesen Bereichen bleibt das nationale Recht frei; die Richtlinie erwähnt Benutzungsmarken nur als fakultatives relatives Eintragungshindernis (Art. 5 Abs. 4 lit. a MarkenRL, umgesetzt in § 12 MarkenG)."],"merke":"Harmonisiert ist die Registermarke, nicht das ganze Kennzeichenrecht.","level":1,"concepts":["markenrl","verkehrsgeltung"],"norms":["Art. 1 MarkenRL","Art. 5 MarkenRL","§ 4 Nr. 2","§ 12"],"cases":[],"step":null},{"id":"k11a-3","typ":"mc","titel":"Wer legt die Begriffe aus?","sachverhalt":"","frage":"Der BGH ist unsicher, ob bei der Prüfung der Unterscheidungskraft eines Zeichens auf T-Shirts nur die wahrscheinlichste Verwendungsform zählt. Was muss er tun?","optionen":["Er entscheidet nach deutscher Tradition, weil § 8 MarkenG deutsches Recht ist","Er muss die Frage dem EuGH vorlegen, weil die Unterscheidungskraft ein unionsrechtlicher Begriff aus Art. 4 MarkenRL ist und er letztinstanzlich entscheidet","Er fragt das DPMA","Er setzt das Verfahren aus, bis die Kommission eine Leitlinie erlässt"],"richtig":1,"loesung":["Die Unterscheidungskraft ist in Art. 4 Abs. 1 lit. b MarkenRL geregelt; § 8 Abs. 2 Nr. 1 MarkenG setzt sie um und ist **richtlinienkonform** auszulegen. Als letztinstanzliches Gericht ist der BGH nach Art. 267 Abs. 3 AEUV zur **Vorlage** verpflichtet, wenn die Auslegung nicht offenkundig oder bereits geklärt ist.","Genau das geschah in #darferdas?: EuGH C-541/18 entschied, dass alle praktisch bedeutsamen Verwendungsarten zu berücksichtigen sind; der BGH setzte das um (#darferdas? II)."],"merke":"","level":2,"concepts":["richtlinienkonforme_auslegung","verwendungsformen"],"norms":["Art. 4 MarkenRL","§ 8 Abs. 2 Nr. 1"],"cases":["eugh_darferdas","bgh_darferdas_ii"],"step":"step:schema_markenrl.5"},{"id":"k11a-4","typ":"fall","titel":"Ein Urteil zur Unionsmarke für das MarkenG","sachverhalt":"Der EuGH hat in einem Fall zur Unionsmarkenverordnung entschieden, wie die selbständig kennzeichnende Stellung zu prüfen ist. Ein Landgericht muss nun einen Fall nach § 14 Abs. 2 Nr. 2 MarkenG entscheiden.","frage":"Darf das Landgericht die EuGH-Rechtsprechung zur UMV auf das MarkenG übertragen?","antwort":true,"loesung":["**Ja!** Art. 10 Abs. 2 lit. b MarkenRL und Art. 9 Abs. 2 lit. b UMV sind wortgleich formuliert; der EuGH legt beide **einheitlich** aus. Rechtsprechung zur Unionsmarke ist deshalb regelmäßig auf das richtlinienkonform auszulegende MarkenG übertragbar und umgekehrt.","Beispiel: THOMSON LIFE erging zu Art. 5 Abs. 1 lit. b der alten Markenrichtlinie und prägt seither auch die Auslegung von Art. 9 UMV."],"merke":"MarkenRL und UMV laufen parallel: EuGH-Urteile gelten für beide Welten.","level":2,"concepts":["richtlinienkonforme_auslegung","unionsmarke","selbstaendig_kennzeichnende_stellung"],"norms":["Art. 10 MarkenRL"],"cases":["eugh_thomson_life"],"step":"step:schema_markenrl.4"},{"id":"k11a-5","typ":"mc","titel":"Umsetzungsfristen","sachverhalt":"","frage":"Bis wann mussten die Mitgliedstaaten die MarkenRL umsetzen, und welche Ausnahme gab es?","optionen":["Bis 15.1.2016 vollständig","Bis 14.1.2019; nur das Verwaltungsverfahren für Verfall und Nichtigkeit (Art. 45) erst bis 14.1.2023","Bis 1.5.2020 vollständig","Es gab keine Frist, Richtlinien gelten unmittelbar"],"richtig":1,"loesung":["Art. 54 MarkenRL setzt die allgemeine Umsetzungsfrist auf den **14. Januar 2019**; für das verwaltungsbehördliche Verfalls- und Nichtigkeitsverfahren nach Art. 45 galt eine verlängerte Frist bis zum **14. Januar 2023**.","Deutschland: MaMoG vom 11.12.2018, in Kraft seit 14.1.2019; das DPMA-Verfahren nach § 53 MarkenG gilt seit 1.5.2020. Richtlinien gelten nicht unmittelbar zwischen Privaten; sie wirken über die Umsetzung und die richtlinienkonforme Auslegung."],"merke":"","level":1,"concepts":["markenrl","verwaltungsverfahren_loeschung"],"norms":["Art. 54 MarkenRL","Art. 45 MarkenRL","§ 53"],"cases":[],"step":"step:schema_markenrl.6"}]},{"id":"k11b","titel":"Materielles Recht: Art. 3 bis 18","einheiten":[{"id":"k11b-1","typ":"fall","titel":"Die Klangmarke als Audiodatei","sachverhalt":"Ein Radiosender will seine Erkennungsmelodie als Marke anmelden und reicht statt einer Notenschrift eine MP3-Datei ein.","frage":"Muss die Anmeldung zurückgewiesen werden, weil eine Audiodatei keine graphische Darstellung ist?","antwort":false,"loesung":["**Nein!** Art. 3 lit. b MarkenRL verlangt nur noch, dass das Zeichen im Register so **dargestellt** werden kann, dass Behörden und Publikum den Schutzgegenstand klar und eindeutig bestimmen können. Das Erfordernis der graphischen Darstellbarkeit ist entfallen; § 8 Abs. 1 MarkenG wurde entsprechend gefasst.","Maßstab bleiben die Sieckmann-Kriterien (klar, eindeutig, in sich abgeschlossen, leicht zugänglich, verständlich, dauerhaft, objektiv). Eine Audiodatei erfüllt sie für Klangmarken; auch Bewegungs-, Multimedia- und Hologrammmarken sind so anmeldbar."],"merke":"Darstellbar, nicht mehr graphisch darstellbar: Die Technik darf helfen, die Bestimmtheit bleibt Pflicht.","level":1,"concepts":["darstellbarkeit","markenfaehigkeit"],"norms":["Art. 3 MarkenRL","§ 8 Abs. 1"],"cases":[],"step":null},{"id":"k11b-2","typ":"fall","titel":"Der technisch bedingte Farbverlauf","sachverhalt":"Ein Hersteller meldet für Reflektoren ein Zeichen an, das ausschließlich aus einem bestimmten Farbmuster besteht, das die Reflexionswirkung technisch bedingt.","frage":"Greift der Formausschluss, obwohl es sich nicht um eine Form handelt?","antwort":true,"loesung":["**Ja!** Art. 4 Abs. 1 lit. e MarkenRL erstreckt den Ausschluss ausdrücklich auf Zeichen, die ausschließlich aus der Form **oder einem anderen charakteristischen Merkmal** bestehen, das technisch erforderlich ist. § 3 Abs. 2 MarkenG wurde im MaMoG entsprechend erweitert.","Damit lässt sich der Ausschluss nicht mehr umgehen, indem man statt der Form ein anderes funktionales Merkmal (Farbe, Muster, Klang) anmeldet. Verkehrsdurchsetzung hilft hier nicht (Art. 4 Abs. 4 gilt nur für lit. b bis d)."],"merke":"Funktional ist funktional: Form oder anderes Merkmal, beides gesperrt.","level":2,"concepts":["formausschluss"],"norms":["Art. 4 MarkenRL","§ 3 Abs. 2"],"cases":["eugh_philips_remington","bgh_bodenduebel"],"step":null},{"id":"k11b-3","typ":"fall","titel":"Bösgläubigkeit als Pflichtgrund","sachverhalt":"Ein Mitgliedstaat hat in seinem Markengesetz keinen Nichtigkeitsgrund für bösgläubige Anmeldungen vorgesehen.","frage":"Ist das mit der Richtlinie vereinbar?","antwort":false,"loesung":["**Nein!** Nach Art. 4 Abs. 2 MarkenRL **ist** eine Marke für ungültig zu erklären, wenn der Anmelder bösgläubig war; nur die Ausgestaltung als Eintragungshindernis ist fakultativ. In Deutschland: § 8 Abs. 2 Nr. 14 MarkenG (Zurückweisung, wenn ersichtlich, § 37 Abs. 3) und § 50 (Nichtigkeit).","Fakultativ bleiben nach Art. 4 Abs. 3 nur der Verstoß gegen sonstiges Recht, religiöse Symbole und nationale Embleme."],"merke":"Bösgläubigkeit: zwingender Nichtigkeitsgrund, optionales Eintragungshindernis.","level":2,"concepts":["boesglaeubigkeit"],"norms":["Art. 4 MarkenRL","§ 8 Abs. 2 Nr. 14","§ 50"],"cases":["bgh_glueckspilz"],"step":null},{"id":"k11b-4","typ":"fall","titel":"Der Container im Hamburger Hafen","sachverhalt":"Im Hamburger Hafen wird ein Container mit gefälschten Markenturnschuhen aus China entdeckt, der für Brasilien bestimmt ist. Die Ware soll in Deutschland nicht verkauft werden.","frage":"Kann der Markeninhaber gegen die Durchfuhr vorgehen?","antwort":true,"loesung":["**Ja, grundsätzlich!** Nach Art. 10 Abs. 4 MarkenRL, umgesetzt in § 14a MarkenG, kann der Inhaber verhindern, dass Waren aus Drittstaaten mit identischer Marke unter zollamtlicher Überwachung ins Inland verbracht werden, auch **ohne Inverkehrbringen** im Inland (Transit). Das korrigiert die frühere EuGH-Linie (Philips/Nokia), nach der bloßer Transit nicht verletzte.","Das Recht erlischt, wenn der Anmelder oder Besitzer der Ware nachweist, dass der Inhaber die Vermarktung im **Bestimmungsland** (Brasilien) nicht verbieten könnte (§ 14a Abs. 2). Durchsetzung über die Grenzbeschlagnahme (§§ 146 ff.)."],"merke":"Transit ist Verletzung, es sei denn, im Zielland wäre der Vertrieb legal.","level":2,"concepts":["transit","doppelidentitaet"],"norms":["Art. 10 MarkenRL","§ 14a","§ 146"],"cases":[],"step":null},{"id":"k11b-5","typ":"fall","titel":"Der Etikettenhändler","sachverhalt":"Ein Händler verkauft gewebte Etiketten mit dem Logo eines Sportartikelherstellers an Textilfabriken, ohne selbst Kleidung zu produzieren. Die Etiketten sind erkennbar für Plagiate bestimmt.","frage":"Verletzt der Etikettenhändler die Marke, obwohl er sie auf keiner Ware anbringt?","antwort":true,"loesung":["**Ja!** Art. 11 MarkenRL, umgesetzt in § 14 Abs. 4 MarkenG, verbietet **Vorbereitungshandlungen**: das Anbringen der Marke auf Etiketten, Verpackungen, Anhängern oder Echtheitshinweisen sowie deren Anbieten, Inverkehrbringen, Besitz, Ein- und Ausfuhr, wenn die Gefahr besteht, dass sie für eine verletzende Kennzeichnung benutzt werden.","Der Markenschutz greift damit schon eine Stufe vor der eigentlichen Kennzeichnung der Ware."],"merke":"Wer die Etiketten liefert, verletzt schon, bevor jemand sie aufnäht.","level":2,"concepts":["vorbereitungshandlungen"],"norms":["Art. 11 MarkenRL","§ 14 Abs. 4"],"cases":[],"step":null},{"id":"k11b-6","typ":"fall","titel":"Die GmbH mit Familiennamen","sachverhalt":"Die „Müller Werkzeuge GmbH“ vertreibt Werkzeuge unter ihrem Firmennamen. Inhaberin der älteren Werkzeugmarke „MÜLLER“ ist eine andere Firma. Die GmbH beruft sich auf die Namensschranke.","frage":"Kann sich die GmbH auf § 23 Abs. 1 Nr. 1 MarkenG (Name) berufen?","antwort":false,"loesung":["**Nein!** Art. 14 Abs. 1 lit. a MarkenRL privilegiert nur den Namen oder die Anschrift des Dritten, **wenn dieser eine natürliche Person ist**. § 23 Abs. 1 Nr. 1 MarkenG wurde entsprechend eingeschränkt. Juristische Personen können ihren Firmennamen nicht über die Namensschranke gegen eine ältere Marke verteidigen.","Bleibt: die beschreibende Benutzung (Nr. 2), das Recht der Gleichnamigen bei redlichem Namensgebrauch natürlicher Personen und die Prioritätsfrage nach § 6, falls das Unternehmenskennzeichen älter ist."],"merke":"Die Namensschranke schützt Menschen, nicht Gesellschaften.","level":3,"concepts":["schranke_23","gleichnamigkeit"],"norms":["Art. 14 MarkenRL","§ 23 Abs. 1 Nr. 1"],"cases":[],"step":null},{"id":"k11b-7","typ":"fall","titel":"Die Schonfrist nach dem Widerspruch","sachverhalt":"Die Marke „ORBIS“ wurde am 1.3.2019 eingetragen. Gegen die Eintragung wurde Widerspruch erhoben, der erst am 1.9.2020 rechtskräftig zurückgewiesen wurde. Am 1.6.2024 erhebt ein Verletzer die Nichtbenutzungseinrede.","frage":"Ist die Einrede beachtlich?","antwort":false,"loesung":["**Nein!** Nach Art. 16 Abs. 2 MarkenRL beginnt die fünfjährige Benutzungsschonfrist bei einem Widerspruchsverfahren erst mit dem Tag, an dem das Verfahren **abgeschlossen** ist. § 26 Abs. 5 MarkenG setzt das um. Die Frist läuft hier also bis zum 1.9.2025.","Für IR-Marken gilt entsprechend der Ablauf der Schutzverweigerungsfrist oder die rechtskräftige Schutzgewährung (Art. 16 Abs. 3, § 115 Abs. 2 MarkenG). Der Fristbeginn wird im Register vermerkt (Art. 16 Abs. 4)."],"merke":"Erst wenn die Marke unangreifbar im Register steht, tickt die Benutzungsuhr.","level":2,"concepts":["benutzungsschonfrist","nichtbenutzungseinrede"],"norms":["Art. 16 MarkenRL","§ 26 Abs. 5","§ 25"],"cases":[],"step":null},{"id":"k11b-8","typ":"fall","titel":"Zwei Marken, beide eingetragen","sachverhalt":"Anna ist Inhaberin der Marke „VELA“ (2012). Ben hat „VELA“ 2016 für ähnliche Waren eingetragen; damals hatte Annas Marke nur geringe Kennzeichnungskraft und es bestand keine Verwechslungsgefahr. Inzwischen ist Annas Marke stark und verwechslungsfähig. Anna klagt auf Unterlassung.","frage":"Kann Anna Ben die Benutzung seiner eingetragenen Marke verbieten?","antwort":false,"loesung":["**Nein!** Art. 18 MarkenRL (Zwischenrecht) und Art. 8 MarkenRL ordnen an: Der Inhaber der älteren Marke kann die Benutzung einer später eingetragenen Marke nicht verbieten, wenn diese am **Prioritätstag** nicht für ungültig erklärt werden konnte, etwa weil damals noch keine Verwechslungsgefahr bestand. § 22 Abs. 1 Nr. 3 und § 51 Abs. 4 S. 2 MarkenG setzen das um.","Umgekehrt kann auch Ben Anna nichts verbieten (Art. 18 Abs. 3, § 22 Abs. 2): beide koexistieren. Die Kennzeichnungskraft der älteren Marke wird damit „eingefroren“ auf den Zeitpunkt der jüngeren Anmeldung."],"merke":"Was am Anmeldetag der jüngeren Marke nicht kollidierte, kollidiert auch später nicht.","level":3,"concepts":["koexistenz_22","kennzeichnungskraft"],"norms":["Art. 18 MarkenRL","Art. 8 MarkenRL","§ 22","§ 51 Abs. 4"],"cases":[],"step":null}]},{"id":"k11c","titel":"Verfahren und Umsetzung im MaMoG","einheiten":[{"id":"k11c-1","typ":"mc","titel":"Der Klassenkopf","sachverhalt":"","frage":"Eine Marke ist für „Klasse 25: Bekleidungsstücke, Schuhwaren, Kopfbedeckungen“ eingetragen. Welche Waren sind erfasst?","optionen":["Alle Waren der Klasse 25 nach der alphabetischen Liste","Nur die Waren, die von der wörtlichen Bedeutung der genannten Begriffe eindeutig erfasst sind","Alle Textilien in allen Klassen","Gar keine, weil Klassenüberschriften unzulässig sind"],"richtig":1,"loesung":["Nach Art. 39 Abs. 5 MarkenRL umfassen allgemeine Begriffe einschließlich der Klassenüberschriften **nur die Waren, die eindeutig von ihrer wörtlichen Bedeutung erfasst sind** (Kodifizierung von EuGH IP Translator, C-307/10). Eine Vermutung, dass alle Waren der Klasse gemeint sind, besteht nicht (Abs. 6).","Die Zugehörigkeit zur selben Klasse begründet keine Warenähnlichkeit, verschiedene Klassen keine Unähnlichkeit (Art. 39 Abs. 7, § 9 Abs. 3 MarkenG)."],"merke":"","level":2,"concepts":["klassifizierung","warenaehnlichkeit"],"norms":["Art. 39 MarkenRL","§ 32","§ 9 Abs. 3"],"cases":[],"step":null},{"id":"k11c-2","typ":"fall","titel":"Cooling-off im Widerspruch","sachverhalt":"Im Widerspruchsverfahren vor dem DPMA wollen beide Parteien in Ruhe über eine Abgrenzungsvereinbarung verhandeln und beantragen gemeinsam eine Verfahrensaussetzung.","frage":"Muss das DPMA den Parteien Zeit für eine gütliche Einigung einräumen?","antwort":true,"loesung":["**Ja!** Art. 43 Abs. 3 MarkenRL verpflichtet die Ämter, den Parteien auf gemeinsamen Antrag eine Frist von **mindestens zwei Monaten** für eine gütliche Einigung einzuräumen. § 42 Abs. 4 MarkenG setzt das um (Cooling-off).","Weitere Neuerungen des Art. 43: Der Widerspruch kann auf mehrere ältere Rechte desselben Inhabers gestützt werden (§ 42 Abs. 3) und muss auch dem Inhaber einer bekannten Marke und dem Berechtigten einer Ursprungsbezeichnung offenstehen."],"merke":"Zwei Monate Cooling-off sind Pflicht, wenn beide es wollen.","level":1,"concepts":["widerspruch"],"norms":["Art. 43 MarkenRL","§ 42 Abs. 4"],"cases":[],"step":null},{"id":"k11c-3","typ":"fall","titel":"Nichtigkeit ohne Gericht","sachverhalt":"Ein Wettbewerber will die Marke „AQUAFRESH“ wegen absoluter Schutzhindernisse löschen lassen und scheut die Kosten eines Gerichtsverfahrens.","frage":"Kann er die Nichtigkeit vollständig vor dem DPMA klären lassen?","antwort":true,"loesung":["**Ja!** Art. 45 MarkenRL verpflichtet die Mitgliedstaaten zu einem effizienten **Verwaltungsverfahren** vor dem Amt für Verfall und Nichtigkeit. Deutschland hat es zum 1.5.2020 in § 53 MarkenG umgesetzt: Antrag, Zustellung, bei Widerspruch des I
