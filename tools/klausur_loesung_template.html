<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>${title}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Prüfungsbogen: links Aufgabentext, rechts Prüfliste in Lösungssprache. */
:root {
  --bg: #f6f7f9; --paper: #ffffff; --ink: #17202b; --muted: #5b6676; --line: #d9dee6;
  --accent: #1f4f8f; --accent-soft: #e6eef8;
  --ok: #1d6b45; --no: #9b2c2c; --warn: #8a5a00;
  --f-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --paper: #161d27; --ink: #e5e9ef; --muted: #9aa5b4; --line: #2a3442;
    --accent: #8db4ea; --accent-soft: #1b2a3d; --ok: #7fcfa3; --no: #ec9a9a; --warn: #e3b55c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --paper: #161d27; --ink: #e5e9ef; --muted: #9aa5b4; --line: #2a3442;
  --accent: #8db4ea; --accent-soft: #1b2a3d; --ok: #7fcfa3; --no: #ec9a9a; --warn: #e3b55c; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14.5px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 56px;
}
img { max-width: 100%; }
a { color: var(--accent); }
.wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 22px; }
.back { font: 500 13px/1 var(--f-mono); text-decoration: none; }
header { display: grid; gap: 8px; }
.eyebrow { font: 500 12px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font: 600 clamp(22px, 3.4vw, 32px)/1.15 var(--f-display); margin: 0; text-wrap: balance; }
.lede { color: var(--muted); max-width: 85ch; margin: 0; }
.legend { font: 12.5px/1.5 var(--f-mono); color: var(--muted); }
.cols { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.colhead { display: contents; }
.colhead div { font: 500 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--bg); }
.task, .sol { padding: 16px 18px 18px; border-bottom: 1px solid var(--line); min-width: 0; }
.task { border-right: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 55%, var(--paper)); }
.qlabel { font: 600 13px/1.2 var(--f-mono); color: var(--accent); margin: 0 0 8px; }
.aufgabe { font-family: var(--f-display); font-size: 15px; line-height: 1.55; margin: 0; white-space: pre-line; }
.volltext { font: 13px/1.5 var(--f-mono); white-space: pre-wrap; max-height: 70vh; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: var(--paper); }
.bilder { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.bilder img { height: 96px; width: auto; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
.agl { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; padding: 8px 10px; border-radius: 6px; background: var(--accent-soft); margin: 10px 0 8px; }
.agl:first-child { margin-top: 0; }
.agl .k { font: 600 12px/1 var(--f-mono); color: var(--paper); background: var(--accent); padding: 4px 6px; border-radius: 3px; }
.agl b { font-family: var(--f-display); font-size: 16px; }
.lvl { font: 600 12px/1.2 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 12px 0 2px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.lvl .def { text-transform: none; letter-spacing: 0; font-family: var(--f-body); font-weight: 400; display: inline; }
.v { display: grid; grid-template-columns: 2.8em minmax(0, 1.15fr) minmax(0, 1fr) 3.2em; gap: 4px 12px; padding: 7px 0; border-bottom: 1px dotted var(--line); align-items: start; }
.v.sub { padding-left: 1.4em; }
.vk { font: 600 12.5px/1.5 var(--f-mono); color: var(--accent); }
.vb, .vs { min-width: 0; }
.vs:not(:empty)::before { content: "→ "; color: var(--muted); font-family: var(--f-mono); }
.vr { font: 600 13px/1.5 var(--f-mono); text-align: right; white-space: nowrap; }
.plus { color: var(--ok); } .minus { color: var(--no); } .open { color: var(--warn); }
.n { font: 500 12px/1.4 var(--f-mono); color: var(--accent); background: var(--accent-soft); padding: 0 4px; border-radius: 3px; }
.n a, .def a, .vs a, .note-line a, .erg a, td a { color: inherit; text-decoration: underline dotted; }
.def { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.v .def::before { content: "Def. "; font: 600 11.5px/1 var(--f-mono); }
.erg { display: grid; grid-template-columns: 2.8em minmax(0, 1fr); gap: 12px; margin-top: 10px; padding: 9px 10px; border-radius: 6px; background: var(--accent-soft); }
.erg.sm { background: transparent; border: 1px dashed var(--line); }
.note-line { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.table-wrap { overflow-x: auto; margin: 0 0 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; vertical-align: top; padding: 5px 8px; border-bottom: 1px solid var(--line); }
th { font: 500 11.5px/1.3 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
section.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.note { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; font-size: 13.5px; }
.note h2 { font: 600 17px/1.3 var(--f-display); margin: 0 0 8px; }
.note ul { margin: 0 0 8px; padding-left: 18px; display: grid; gap: 4px; }
@media (max-width: 980px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .colhead { display: none; }
  .task { border-right: 0; border-bottom: 1px dashed var(--line); }
}
@media (max-width: 640px) {
  .v { grid-template-columns: 2.6em minmax(0, 1fr) 3em; }
  .v .vs { grid-column: 2 / 4; grid-row: 2; }
  .v .vr { grid-column: 3; grid-row: 1; }
  .v.sub { padding-left: .6em; }
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← Alle Klausuren</a>
  <header>
    <div class="eyebrow">${eyebrow}</div>
    <h1>${h1}</h1>
    <p class="lede">${lede}</p>
    <div class="legend">AGL Anspruchsgrundlage · V Voraussetzung · Def. Definition (Quelle) · → Subsumtion · (+) erfüllt · (–) nicht erfüllt · (+)? voraussichtlich · (?) offen · ⇒ Ergebnis · Fristen: Frist · Berechnung · Verschiebung · Wochentag</div>
  </header>
  <div class="cols">
    <div class="colhead"><div>Aufgabe</div><div>Lösung</div></div>
${body}
  </div>
  <section class="notes">
${notes}
  </section>
</div>
</body>
</html>
