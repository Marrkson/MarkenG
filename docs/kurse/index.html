iderspruch erhoben werden kann."},{"nr":"2","text":"Widerspruch kann zumindest der Inhaber einer älteren Marke nach Art. 5 Abs. 2 und Abs. 3 lit. a sowie der Berechtigte einer Ursprungsbezeichnung erheben; ein Widerspruch kann auf mehrere ältere Rechte desselben Inhabers gestützt werden und sich gegen einen Teil der Waren richten."},{"nr":"3","text":"Den Parteien wird auf gemeinsamen Antrag eine Frist von mindestens zwei Monaten für eine gütliche Einigung eingeräumt (Cooling-off)."}],"hinweis":"Umsetzung: § 42 Abs. 2 (Widerspruchsberechtigte, jetzt auch bekannte Marken ausdrücklich), Abs. 3 (mehrere ältere Rechte), Abs. 4 (Cooling-off von mindestens zwei Monaten).","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:44","type":"eunorm","label":"Art. 44 MarkenRL","titel":"Nichtbenutzung als Einrede im Widerspruchsverfahren","nummer":"44","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 3 – Verfahren","abschnitt":"Abschnitt 2 – Verfahren für Widerspruch, Verfall und Nichtigkeit","absaetze":[{"nr":"1","text":"War die Schonfrist der älteren Marke am Anmelde- oder Prioritätstag der jüngeren Marke abgelaufen, muss der Widersprechende auf Verlangen des Anmelders nachweisen, dass die ältere Marke in den fünf Jahren vor diesem Tag ernsthaft benutzt wurde oder berechtigte Gründe vorlagen; sonst wird der Widerspruch zurückgewiesen."},{"nr":"2","text":"Bei nur teilweiser Benutzung gilt die ältere Marke für die Prüfung nur für die benutzten Waren als eingetragen."},{"nr":"3","text":"Bei älteren Unionsmarken bestimmt sich die ernsthafte Benutzung nach Art. 15 (jetzt Art. 18) UMV."}],"hinweis":"Maßgeblicher Fünfjahreszeitraum ist der vor dem Anmelde-/Prioritätstag der jüngeren Marke (§ 43 Abs. 1 S. 1 MarkenG neu).","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:45","type":"eunorm","label":"Art. 45 MarkenRL","titel":"Verfahren zur Erklärung des Verfalls oder der Nichtigkeit","nummer":"45","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 3 – Verfahren","abschnitt":"Abschnitt 2 – Verfahren für Widerspruch, Verfall und Nichtigkeit","absaetze":[{"nr":"1","text":"Unbeschadet gerichtlicher Verfahren sehen die Mitgliedstaaten ein effizientes und zügiges Verwaltungsverfahren vor den Ämtern für die Erklärung des Verfalls oder der Nichtigkeit vor."},{"nr":"2","text":"Das Verfahren muss Verfall nach Art. 19 und 20 sowie Nichtigkeit nach Art. 4 und 5 ermöglichen."},{"nr":"3","text":"Antragsbefugt sind mindestens: (a) bei Verfall und absoluten Ungültigkeitsgründen jede natürliche oder juristische Person sowie Verbände; (b) bei relativen Gründen die Inhaber der älteren Rechte."},{"nr":"4","text":"Der Antrag kann sich gegen einen Teil der Waren richten."},{"nr":"5","text":"Er kann auf mehrere ältere Rechte desselben Inhabers gestützt werden."},{"nr":"6","text":"Bei Nichtigkeit aufgrund einer Unionsmarke gilt für deren Benutzung Art. 15 (jetzt Art. 18) UMV."}],"hinweis":"Umsetzungsfrist bis 14. Januar 2023 (Art. 54 Abs. 1 UAbs. 2). Deutschland: seit 1.5.2020 vollständiges Verfalls- und Nichtigkeitsverfahren vor dem DPMA (§ 53 MarkenG), daneben Klage nach § 55 nur noch für Verfall und relative Nichtigkeit.","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:46","type":"eunorm","label":"Art. 46 MarkenRL","titel":"Nichtbenutzung als Einrede in Verfahren zur Erklärung der Nichtigkeit","nummer":"46","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 3 – Verfahren","abschnitt":"Abschnitt 2 – Verfahren für Widerspruch, Verfall und Nichtigkeit","absaetze":[{"nr":"1","text":"Der Inhaber der jüngeren Marke kann verlangen, dass der Antragsteller die ernsthafte Benutzung seiner älteren Marke in den fünf Jahren vor Antragstellung nachweist, wenn deren Schonfrist bei Antragstellung abgelaufen war."},{"nr":"2","text":"War die Schonfrist bereits am Anmelde- oder Prioritätstag der jüngeren Marke abgelaufen, muss zusätzlich die Benutzung in den fünf Jahren vor diesem Tag nachgewiesen werden."},{"nr":"3","text":"Ohne Nachweis wird der Antrag zurückgewiesen."},{"nr":"4","text":"Bei teilweiser Benutzung gilt die ältere Marke nur für die benutzten Waren als eingetragen."},{"nr":"5","text":"Bei älteren Unionsmarken gilt Art. 15 (jetzt Art. 18) UMV."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:47","type":"eunorm","label":"Art. 47 MarkenRL","titel":"Wirkungen des Verfalls und der Nichtigkeit","nummer":"47","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 3 – Verfahren","abschnitt":"Abschnitt 2 – Verfahren für Widerspruch, Verfall und Nichtigkeit","absaetze":[{"nr":"1","text":"Bei Verfall gelten die Wirkungen der Marke ab dem Tag der Antragstellung als nicht mehr eingetreten; auf Antrag kann ein früherer Zeitpunkt festgesetzt werden, zu dem der Verfallsgrund eintrat."},{"nr":"2","text":"Bei Nichtigkeit gelten die Wirkungen der Marke als von Anfang an nicht eingetreten."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:48","type":"eunorm","label":"Art. 48 MarkenRL","titel":"Schutzdauer","nummer":"48","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 3 – Verfahren","abschnitt":"Abschnitt 3 – Schutzdauer und Verlängerung","absaetze":[{"nr":"1","text":"Die Schutzdauer beträgt zehn Jahre ab dem Anmeldetag."},{"nr":"2","text":"Sie kann um jeweils zehn Jahre verlängert werden."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:49","type":"eunorm","label":"Art. 49 MarkenRL","titel":"Verlängerung","nummer":"49","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 3 – Verfahren","abschnitt":"Abschnitt 3 – Schutzdauer und Verlängerung","absaetze":[{"nr":"1","text":"Die Verlängerung erfolgt auf Antrag des Inhabers oder eines Bevollmächtigten gegen Gebühr; die Mitgliedstaaten können die Gebührenzahlung als Antrag gelten lassen."},{"nr":"2","text":"Das Amt unterrichtet den Inhaber mindestens sechs Monate vor Ablauf; eine unterbliebene Unterrichtung begründet keine Haftung."},{"nr":"3","text":"Antrag und Gebühr müssen innerhalb von mindestens sechs Monaten vor Ablauf eingehen; nachträglich innerhalb weiterer sechs Monate gegen Zuschlag."},{"nr":"4","text":"Die Verlängerung kann auf einen Teil der Waren beschränkt werden."},{"nr":"5","text":"Sie wird am Tag nach Ablauf der Schutzdauer wirksam und im Register vermerkt."}],"hinweis":"Schutzdauer und Verlängerungsfristen laufen jetzt ab dem Anmeldetag, nicht mehr ab dem Monatsende (§ 47 MarkenG neu).","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:50","type":"eunorm","label":"Art. 50 MarkenRL","titel":"Kommunikation mit dem Amt","nummer":"50","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 3 – Verfahren","abschnitt":"Abschnitt 4 – Kommunikation mit dem Amt","absaetze":[{"nr":"None","text":"Die Verfahrensbeteiligten oder ihre Vertreter geben eine amtliche Anschrift für die amtliche Kommunikation an; die Mitgliedstaaten können verlangen, dass sie im EWR liegt."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:51","type":"eunorm","label":"Art. 51 MarkenRL","titel":"Zusammenarbeit im Bereich der Eintragung und Verwaltung von Marken","nummer":"51","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 4 – Verwaltungszusammenarbeit","abschnitt":null,"absaetze":[{"nr":"None","text":"Die Ämter arbeiten untereinander und mit dem EUIPO zusammen, um Verfahren und Instrumente zu harmonisieren und Ergebnisse zu vereinheitlichen."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:52","type":"eunorm","label":"Art. 52 MarkenRL","titel":"Zusammenarbeit in anderen Bereichen","nummer":"52","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 4 – Verwaltungszusammenarbeit","abschnitt":null,"absaetze":[{"nr":"None","text":"Die Ämter können mit dem EUIPO auch in anderen Tätigkeitsbereichen zusammenarbeiten, etwa bei Sensibilisierung und Bekämpfung von Verletzungen."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:53","type":"eunorm","label":"Art. 53 MarkenRL","titel":"Datenschutz","nummer":"53","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 5 – Schlussbestimmungen","abschnitt":null,"absaetze":[{"nr":"None","text":"Für die Verarbeitung personenbezogener Daten gilt das nationale Datenschutzrecht in Umsetzung der RL 95/46/EG (heute DSGVO)."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:54","type":"eunorm","label":"Art. 54 MarkenRL","titel":"Umsetzung","nummer":"54","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 5 – Schlussbestimmungen","abschnitt":null,"absaetze":[{"nr":"1","text":"Die Mitgliedstaaten setzen die Art. 3 bis 6, 8 bis 14, 16, 17, 18, 22 bis 39, 41 und 43 bis 50 bis zum 14. Januar 2019 um; Art. 45 bis zum 14. Januar 2023."},{"nr":"2","text":"Sie teilen der Kommission den Wortlaut der Umsetzungsvorschriften mit."}],"hinweis":"Deutschland: Markenrechtsmodernisierungsgesetz (MaMoG) vom 11.12.2018, BGBl. I S. 2357, in Kraft seit 14.1.2019; Verfalls-/Nichtigkeitsverfahren vor dem DPMA seit 1.5.2020.","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:55","type":"eunorm","label":"Art. 55 MarkenRL","titel":"Aufhebung","nummer":"55","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 5 – Schlussbestimmungen","abschnitt":null,"absaetze":[{"nr":"None","text":"Die Richtlinie 2008/95/EG wird mit Wirkung vom 15. Januar 2019 aufgehoben; Verweise gelten als Verweise auf diese Richtlinie (Entsprechungstabelle in Anhang)."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:56","type":"eunorm","label":"Art. 56 MarkenRL","titel":"Inkrafttreten","nummer":"56","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 5 – Schlussbestimmungen","abschnitt":null,"absaetze":[{"nr":"None","text":"Die Richtlinie tritt am zwanzigsten Tag nach ihrer Veröffentlichung im Amtsblatt in Kraft; Art. 1, 7, 15, 19, 20, 21 und 54 bis 57 gelten ab dem 15. Januar 2019."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:57","type":"eunorm","label":"Art. 57 MarkenRL","titel":"Adressaten","nummer":"57","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 5 – Schlussbestimmungen","abschnitt":null,"absaetze":[{"nr":"None","text":"Die Richtlinie ist an die Mitgliedstaaten gerichtet."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:erwaegungsgruende","type":"eunorm","label":"Erwägungsgründe MarkenRL","titel":"Erwägungsgründe (Auswahl)","nummer":"0","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Präambel","abschnitt":null,"absaetze":[{"nr":"1-3","text":"Neufassung der RL 2008/95/EG; Ziel ist die weitere Angleichung des nationalen Markenrechts an das Unionsmarkensystem, weil verbleibende Unterschiede Hindernisse für den freien Warenverkehr und Wettbewerbsverzerrungen begründen."},{"nr":"5-9","text":"Koexistenz und Ausgleich der nationalen Marken und der Unionsmarke; nationale Marken bleiben für Unternehmen wichtig, die keinen unionsweiten Schutz wollen. Die Harmonisierung erfasst nun auch Verfahrensregeln, nicht nur das materielle Recht."},{"nr":"13","text":"Aufgabe der graphischen Darstellbarkeit: Die Darstellung muss klar, eindeutig, in sich abgeschlossen, leicht zugänglich, verständlich, dauerhaft und objektiv sein (Sieckmann-Kriterien), kann aber jede geeignete Technologie nutzen."},{"nr":"16","text":"Der Schutz der eingetragenen Marke dient insbesondere der Gewährleistung der Herkunftsfunktion; bei Doppelidentität ist er absolut, bei Ähnlichkeit ist die Verwechslungsgefahr die spezifische Schutzvoraussetzung."},{"nr":"17-18","text":"Die Beurteilung der Verwechslungsgefahr hängt von zahlreichen Faktoren ab: Bekanntheit der Marke, gedankliche Verbindung, Grad der Ähnlichkeit von Zeichen und Waren. Eine Verletzung setzt Benutzung zur Unterscheidung von Waren voraus; Benutzung als Handelsname ist erfasst, wenn sie Warenbezug hat."},{"nr":"19-20","text":"Rechtssicherheit: Die Rechte aus der jüngeren Marke sollen nicht gegenüber älteren Marken bestehen, die im Prioritätszeitpunkt der jüngeren Marke nicht durchsetzbar waren (Zwischenrecht)."},{"nr":"21-22","text":"Zollrechtliche Durchsetzung: Der Inhaber soll gegen rechtsverletzende Waren im Transit vorgehen können, ohne die legitime Durchfuhr von Generika oder Waren, die im Bestimmungsland nicht verletzen, zu behindern."},{"nr":"25-26","text":"Vorverlagerung des Schutzes auf Vorbereitungshandlungen (Etiketten, Verpackungen, Echtheitshinweise), um Produktpiraterie effektiver zu bekämpfen."},{"nr":"27","text":"Die ausschließlichen Rechte sollen redliche Benutzungen nicht verhindern: Nutzung des eigenen Namens natürlicher Personen, beschreibende Angaben, referierende Benutzung (Zubehör, Ersatzteile, vergleichende Werbung), Meinungs- und Kunstfreiheit; Maßstab sind die anständigen Gepflogenheiten."},{"nr":"28","text":"Unionsweite Erschöpfung: Der Inhaber darf den Weitervertrieb von Waren, die er selbst oder mit seiner Zustimmung in der Union in Verkehr gebracht hat, nicht verbieten, es sei denn, berechtigte Gründe liegen vor."},{"nr":"31-32","text":"Benutzungszwang: Eingetragene Marken müssen tatsächlich benutzt werden; nicht benutzte Marken sollen für verfallen erklärt werden können und in Widerspruchs- und Nichtigkeitsverfahren nicht durchgreifen. Die Nichtbenutzungseinrede soll auch im Verletzungsprozess möglich sein."},{"nr":"35-37","text":"Kollektiv- und Gewährleistungsmarken: Einführung eines gemeinsamen Rahmens; Gewährleistungsmarken bleiben fakultativ."},{"nr":"38-40","text":"Verfahrensrechtliche Angleichung: Klassifizierung nach IP Translator, Widerspruchsverfahren, verwaltungsbehördliche Verfalls- und Nichtigkeitsverfahren zur Entlastung der Gerichte."},{"nr":"41-44","text":"Verwaltungszusammenarbeit der Ämter mit dem EUIPO; Einhaltung der Grundrechte der Charta; Umsetzungspflichten."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"case:bgh_rocher_kugel","type":"case","label":"BGH – ROCHER-Kugel","name":"ROCHER-Kugel","court":"BGH","date":"2009-07-09","az":"I ZB 88/07","fundstelle":"GRUR 2010, 138","kern":"Eine dreidimensionale Warenformmarke (Ferrero-Rocher-Praline) besitzt nur dann originäre Unterscheidungskraft, wenn sie erheblich von der Norm oder Branchenüblichkeit abweicht. Für die Verkehrsdurchsetzung nach § 8 Abs. 3 MarkenG ist im Regelfall ein Zuordnungsgrad von mindestens 50 % erforderlich.","tags":["Formmarke","Verkehrsdurchsetzung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=09.07.2009&Aktenzeichen=I+ZB+88/07"},{"id":"case:bgh_ritter_sport","type":"case","label":"BGH – Quadratische Tafelschokoladenverpackung II","name":"Quadratische Tafelschokoladenverpackung II","court":"BGH","date":"2020-07-23","az":"I ZB 42/19","fundstelle":"GRUR 2020, 1089","kern":"Die quadratische Ritter-Sport-Verpackung bleibt als Formmarke geschützt. Das Schutzhindernis der wertverleihenden Form (§ 3 Abs. 2 Nr. 3 MarkenG) greift nicht, wenn die Kaufentscheidung nicht durch die ästhetische Qualität der Form, sondern durch andere Merkmale (hier: Herkunftshinweis, Praktikabilität) bestimmt wird. Die Form ist auch nicht durch die Art der Ware selbst bedingt (§ 3 Abs. 2 Nr. 1).","tags":["Formmarke","§ 3 Abs. 2"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=23.07.2020&Aktenzeichen=I+ZB+42/19"},{"id":"case:bgh_bodenduebel","type":"case","label":"BGH – Bodendübel","name":"Bodendübel","court":"BGH","date":"2017-10-18","az":"I ZB 105/16","fundstelle":"GRUR 2018, 404","kern":"Ein Zeichen ist von der Eintragung ausgeschlossen, wenn alle wesentlichen Merkmale der Form zur Erreichung einer technischen Wirkung erforderlich sind. Es genügt, dass die Merkmale eine technische Funktion erfüllen; sie müssen nicht die einzige Möglichkeit sein, diese Funktion zu erreichen (Anschluss an EuGH Philips/Remington und Lego).","tags":["Formmarke","technische Wirkung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=18.10.2017&Aktenzeichen=I+ZB+105/16"},{"id":"case:bgh_traubenzucker","type":"case","label":"BGH – Traubenzuckertäfelchen","name":"Traubenzuckertäfelchen","court":"BGH","date":"2017-10-18","az":"I ZB 3/17","fundstelle":"GRUR 2018, 411","kern":"Eine technische Wirkung i.S.d. § 3 Abs. 2 Nr. 2 MarkenG kann auch durch formgebende Merkmale eines Zeichens erreicht werden, das für nichttechnische Produkte wie Lebensmittel (Dextro-Energy-Täfelchen) beansprucht wird.","tags":["Formmarke"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=18.10.2017&Aktenzeichen=I+ZB+3/17"},{"id":"case:eugh_philips_remington","type":"case","label":"EuGH – Philips/Remington","name":"Philips/Remington","court":"EuGH","date":"2002-06-18","az":"C-299/99","fundstelle":"GRUR 2002, 804","kern":"Ein Zeichen, das ausschließlich aus der Form einer Ware besteht, ist nicht eintragungsfähig, wenn die wesentlichen funktionellen Merkmale nur der technischen Wirkung zuzuschreiben sind. Der Ausschluss kann nicht durch den Nachweis überwunden werden, dass es andere Formen gibt, mit denen dieselbe Wirkung erzielt werden kann; auch nicht durch Verkehrsdurchsetzung.","tags":["Formmarke","technische Wirkung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=18.06.2002&Aktenzeichen=C-299/99"},{"id":"case:eugh_libertel","type":"case","label":"EuGH – Libertel","name":"Libertel","court":"EuGH","date":"2003-05-06","az":"C-104/01","fundstelle":"GRUR 2003, 604","kern":"Eine abstrakte Farbe ohne räumliche Begrenzung kann markenfähig sein, wenn sie durch einen international anerkannten Farbcode eindeutig bestimmt ist. Originäre Unterscheidungskraft kommt einer Farbe nur unter außergewöhnlichen Umständen zu; regelmäßig ist Verkehrsdurchsetzung nötig. Das Allgemeininteresse an der Verfügbarkeit von Farben ist zu berücksichtigen.","tags":["Farbmarke"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=06.05.2003&Aktenzeichen=C-104/01"},{"id":"case:bgh_hot","type":"case","label":"BGH – HOT","name":"HOT","court":"BGH","date":"2014-02-19","az":"I ZB 3/13","fundstelle":"GRUR 2014, 569","kern":"Ein Zeichen mit mehreren Bedeutungen ('HOT' = heiß/scharf/angesagt) fehlt die Unterscheidungskraft, wenn es in einer seiner möglichen Bedeutungen ein Merkmal der Waren beschreibt. Die Mehrdeutigkeit begründet keine Unterscheidungskraft. Zugleich: Freihaltebedürfnis für Waren, bei denen 'hot' die Beschaffenheit beschreibt.","tags":["Unterscheidungskraft","Mehrdeutigkeit"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=19.02.2014&Aktenzeichen=I+ZB+3/13"},{"id":"case:bgh_link_economy","type":"case","label":"BGH – Link economy","name":"Link economy","court":"BGH","date":"2011-12-21","az":"I ZB 56/09","fundstelle":"GRUR 2012, 270","kern":"Unterscheidungskraft fehlt einer Wortfolge, die sich in einer beschreibenden Sachaussage erschöpft; der Verkehr darf aber nicht zu einer analysierenden Betrachtung angehalten werden. Eine Wortneubildung mit unklarem Begriffsinhalt kann unterscheidungskräftig sein. Großzügiger Maßstab: jede noch so geringe Unterscheidungskraft genügt.","tags":["Unterscheidungskraft","Wortfolgen"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=21.12.2011&Aktenzeichen=I+ZB+56/09"},{"id":"case:bgh_marlene_dietrich_ii","type":"case","label":"BGH – Marlene-Dietrich-Bildnis II","name":"Marlene-Dietrich-Bildnis II","court":"BGH","date":"2010-03-31","az":"I ZB 62/09","fundstelle":"GRUR 2010, 825","kern":"Für die Unterscheidungskraft genügt es, wenn es praktisch bedeutsame und naheliegende Möglichkeiten gibt, das Zeichen bei den beanspruchten Waren so zu verwenden, dass der Verkehr es ohne weiteres als Marke versteht (z.B. auf dem Etikett statt als Dekor). Zeichen, die sonst als Werbemittel eingesetzt werden, kann die Eintragung nicht allein deshalb versagt werden.","tags":["Unterscheidungskraft","Verwendungsformen"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=31.03.2010&Aktenzeichen=I+ZB+62/09"},{"id":"case:bgh_darferdas_ii","type":"case","label":"BGH – #darferdas? II","name":"#darferdas? II","court":"BGH","date":"2020-01-30","az":"I ZB 61/17","fundstelle":"GRUR 2020, 411","kern":"Im Anschluss an EuGH C-541/18: Bei der Prüfung der Unterscheidungskraft sind alle wahrscheinlichen, praktisch bedeutsamen Verwendungsarten in der Branche zu berücksichtigen (bei Bekleidung: Aufdruck UND Einnähetikett). Nur wenn eine einzige Verwendungsart praktisch bedeutsam ist, darf die Prüfung darauf beschränkt werden. Die BGH-Rechtsprechung 'Marlene-Dietrich-Bildnis II' wurde damit modifiziert.","tags":["Unterscheidungskraft","Verwendungsformen","Hashtag"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=30.01.2020&Aktenzeichen=I+ZB+61/17"},{"id":"case:eugh_darferdas","type":"case","label":"EuGH – AS/DPMA (#darferdas?)","name":"AS/DPMA (#darferdas?)","court":"EuGH","date":"2019-09-12","az":"C-541/18","fundstelle":"GRUR 2019, 1194","kern":"Die Unterscheidungskraft eines Zeichens ist unter Berücksichtigung aller relevanten Tatsachen und Umstände, einschließlich sämtlicher wahrscheinlicher Verwendungsarten der angemeldeten Marke, zu prüfen. Praktisch nicht bedeutsame Verwendungsarten bleiben außer Betracht.","tags":["Unterscheidungskraft"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=12.09.2019&Aktenzeichen=C-541/18"},{"id":"case:bgh_pippi_langstrumpf","type":"case","label":"BGH – Pippi-Langstrumpf-Marke","name":"Pippi-Langstrumpf-Marke","court":"BGH","date":"2017-10-05","az":"I ZB 97/16","fundstelle":"GRUR 2018, 301","kern":"Der Name einer fiktiven Romanfigur ('Pippi Langstrumpf') ist für Beherbergungsdienstleistungen unterscheidungskräftig. Eine 'sprechende' Marke, die neben der Herkunft auch Assoziationen zur Dienstleistung weckt, ist nur dann nicht unterscheidungskräftig, wenn ein enger beschreibender Bezug besteht.","tags":["Unterscheidungskraft","Personenname"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=05.10.2017&Aktenzeichen=I+ZB+97/16"},{"id":"case:bgh_for_you","type":"case","label":"BGH – for you","name":"for you","court":"BGH","date":"2014-07-10","az":"I ZB 18/13","fundstelle":"GRUR 2014, 872","kern":"Die Wortfolge 'for you' ist für Nahrungsergänzungsmittel und Kosmetik nicht unterscheidungskräftig: Der Verkehr versteht sie nur als werbliche Anpreisung ('für dich'), nicht als Herkunftshinweis. Maßgeblich ist die Sicht des Durchschnittsverbrauchers im Anmeldezeitpunkt.","tags":["Unterscheidungskraft","Werbeslogan"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=10.07.2014&Aktenzeichen=I+ZB+18/13"},{"id":"case:bgh_oui","type":"case","label":"BGH – OUI","name":"OUI","court":"BGH","date":"2016-05-31","az":"I ZB 39/15","fundstelle":"GRUR 2016, 934","kern":"'OUI' ist für Bekleidung eintragungsfähig. Ein fremdsprachiges Wort ohne beschreibenden Bezug zu den Waren ist unterscheidungskräftig; allgemeine Zustimmungsbekundungen ('ja') werden nicht ohne weiteres als bloße Werbeaussage verstanden.","tags":["Unterscheidungskraft"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=31.05.2016&Aktenzeichen=I+ZB+39/15"},{"id":"case:bgh_duesseldorfcongress","type":"case","label":"BGH – DüsseldorfCongress","name":"DüsseldorfCongress","court":"BGH","date":"2014-05-15","az":"I ZB 29/13","fundstelle":"GRUR 2014, 1204","kern":"Die Kombination einer Ortsangabe mit einer beschreibenden Gattungsbezeichnung ('DüsseldorfCongress') fehlt für Veranstaltungsdienstleistungen die Unterscheidungskraft; die Zusammenschreibung ändert den beschreibenden Charakter nicht.","tags":["Unterscheidungskraft","geographische Angabe"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=15.05.2014&Aktenzeichen=I+ZB+29/13"},{"id":"case:bgh_die_vision","type":"case","label":"BGH – Die Vision","name":"Die Vision","court":"BGH","date":"2010-07-01","az":"I ZB 35/09","fundstelle":"GRUR 2010, 935","kern":"Für Druckereierzeugnisse und Verlagsdienstleistungen fehlt 'Die Vision' die Unterscheidungskraft, weil der Verkehr die Angabe als Hinweis auf den thematischen Inhalt versteht. Der Umstand, dass der Verkehr an beschreibende Zeitschriftentitel gewöhnt ist, betrifft den Werktitelschutz (§ 5 Abs. 3), nicht die markenrechtliche Unterscheidungskraft.","tags":["Unterscheidungskraft","Zeitschriftentitel"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=01.07.2010&Aktenzeichen=I+ZB+35/09"},{"id":"case:bgh_marktfrisch","type":"case","label":"BGH – marktfrisch","name":"marktfrisch","court":"BGH","date":"2001-03-01","az":"I ZB 42/98","fundstelle":"GRUR 2001, 1151","kern":"'marktfrisch' ist für Lebensmittel eine beschreibende Angabe (Beschaffenheit) und daher weder unterscheidungskräftig noch vom Freihaltebedürfnis ausgenommen. Grundsatz: Unterscheidungskraft fehlt bei Wörtern mit für die Ware im Vordergrund stehendem beschreibenden Begriffsinhalt.","tags":["Unterscheidungskraft"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=01.03.2001&Aktenzeichen=I+ZB+42/98"},{"id":"case:bgh_black_friday","type":"case","label":"BGH – Black Friday","name":"Black Friday","court":"BGH","date":"2021-05-27","az":"I ZB 21/20","fundstelle":"GRUR 2021, 1195","kern":"Ein Freihaltebedürfnis nach § 8 Abs. 2 Nr. 2 MarkenG setzt nicht voraus, dass das Zeichen im Anmeldezeitpunkt bereits beschreibend verwendet wird; es genügt, dass eine beschreibende Verwendung vernünftigerweise für die Zukunft zu erwarten ist. 'Black Friday' wurde für Elektronikwaren und Werbedienstleistungen teilweise gelöscht.","tags":["Freihaltebedürfnis","Löschung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=27.05.2021&Aktenzeichen=I+ZB+21/20"},{"id":"case:eugh_chiemsee","type":"case","label":"EuGH – Windsurfing Chiemsee","name":"Windsurfing Chiemsee","court":"EuGH","date":"1999-05-04","az":"C-108/97","fundstelle":"GRUR 1999, 723","kern":"Geographische Herkunftsangaben sind freizuhalten, wenn sie gegenwärtig oder vernünftigerweise in Zukunft mit den Waren in Verbindung gebracht werden können. Für die Verkehrsdurchsetzung gibt es keine feste Prozentzahl; maßgeblich ist, ob ein erheblicher Teil der beteiligten Verkehrskreise die Ware aufgrund der Marke einem bestimmten Unternehmen zuordnet (Gesamtbetrachtung: Marktanteil, Intensität, Dauer, Werbeaufwand, Umfragen).","tags":["Freihaltebedürfnis","Verkehrsdurchsetzung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=04.05.1999&Aktenzeichen=C-108/97"},{"id":"case:bgh_test","type":"case","label":"BGH – test (Stiftung Warentest)","name":"test (Stiftung Warentest)","court":"BGH","date":"2013-10-17","az":"I ZB 65/12","fundstelle":"GRUR 2014, 483","kern":"Die Wort-Bild-Marke 'test' ist für Testzeitschriften beschreibend. Für die Verkehrsdurchsetzung reicht ein Zuordnungsgrad von 43 % regelmäßig nicht aus. Maßgeblicher Zeitpunkt der Verkehrsdurchsetzung ist der Anmeldetag; im Löschungsverfahren muss sie zusätzlich im Entscheidungszeitpunkt fortbestehen.","tags":["Verkehrsdurchsetzung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=17.10.2013&Aktenzeichen=I+ZB+65/12"},{"id":"case:bgh_langenscheidt_gelb","type":"case","label":"BGH – Langenscheidt-Gelb","name":"Langenscheidt-Gelb","court":"BGH","date":"2014-10-23","az":"I ZB 61/13","fundstelle":"GRUR 2015, 581","kern":"Eine abstrakte Farbmarke (Gelb für zweisprachige Wörterbücher) hat sich im Verkehr durchgesetzt, wenn über 50 % der Verkehrskreise die Farbe einem Unternehmen zuordnen. Die Verkehrsdurchsetzung setzt nicht voraus, dass die Farbe isoliert, ohne Wort- und Bildzeichen benutzt wurde.","tags":["Farbmarke","Verkehrsdurchsetzung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=23.10.2014&Aktenzeichen=I+ZB+61/13"},{"id":"case:bgh_nivea_blau","type":"case","label":"BGH – Nivea-Blau","name":"Nivea-Blau","court":"BGH","date":"2015-07-09","az":"I ZB 65/13","fundstelle":"GRUR 2015, 1012","kern":"Für die Verkehrsdurchsetzung einer abstrakten Farbmarke genügt regelmäßig ein Zuordnungsgrad von über 50 %; ein höherer Grad (75 %) ist nicht erforderlich. Verkehrsbefragungen müssen die konkrete Farbe für die konkreten Waren abfragen; eine Verwendung zusammen mit anderen Kennzeichen steht der Durchsetzung nicht entgegen.","tags":["Farbmarke","Verkehrsdurchsetzung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=09.07.2015&Aktenzeichen=I+ZB+65/13"},{"id":"case:bgh_gelbe_woerterbuecher","type":"case","label":"BGH – Gelbe Wörterbücher","name":"Gelbe Wörterbücher","court":"BGH","date":"2014-09-18","az":"I ZR 228/12","fundstelle":"GRUR 2015, 1101","kern":"Verletzung der abstrakten Farbmarke Gelb (Langenscheidt) durch gelbe Verpackungen von Sprachlernsoftware: Eine markenmäßige Benutzung der Farbe setzt keine gesteigerte Kennzeichnungskraft der Farbmarke voraus; nimmt der Verkehr die Farbe als eigenständiges Zeichen (Zweitmarke) wahr, ist sie isoliert in den Zeichenvergleich einzustellen. Hohe Ähnlichkeit zwischen Wörterbüchern und Sprachlernsoftware.","tags":["Farbmarke","Verletzung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=18.09.2014&Aktenzeichen=I+ZR+228/12"},{"id":"case:bgh_sparkassen_rot","type":"case","label":"BGH – Sparkassen-Rot","name":"Sparkassen-Rot","court":"BGH","date":"2016-07-21","az":"I ZB 52/15","fundstelle":"GRUR 2016, 1167","kern":"Im Löschungsverfahren trägt der Antragsteller die Feststellungslast für das Fehlen der Verkehrsdurchsetzung im Anmeldezeitpunkt; verbleibende Zweifel gehen zu seinen Lasten. Das Sparkassen-Rot blieb als Farbmarke eingetragen.","tags":["Farbmarke","Verkehrsdurchsetzung","Löschung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=21.07.2016&Aktenzeichen=I+ZB+52/15"},{"id":"case:bgh_glueckspilz","type":"case","label":"BGH – GLÜCKSPILZ","name":"GLÜCKSPILZ","court":"BGH","date":"2015-10-15","az":"I ZB 69/14","fundstelle":"GRUR 2016, 380","kern":"Bösgläubigkeit kann sich aus dem sonstigen Verhalten des Anmelders ergeben, etwa wenn die Marke in erster Linie als Mittel des Wettbewerbskampfes (Sperrmarke) und nicht zur Förderung des eigenen Absatzes angemeldet wird. Maßgeblicher Zeitpunkt ist die Anmeldung; späteres Verhalten kann Indiz sein.","tags":["Bösgläubigkeit"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=15.10.2015&Aktenzeichen=I+ZB+69/14"},{"id":"case:bgh_eros","type":"case","label":"BGH – EROS","name":"EROS","court":"BGH","date":"2008-06-26","az":"I ZR 190/05","fundstelle":"GRUR 2008, 917","kern":"Bösgläubig handelt, wer ein Zeichen in Kenntnis eines schutzwürdigen Besitzstands eines Vorbenutzers ohne hinreichenden sachlichen Grund für gleiche Waren anmeldet, um den Besitzstand zu stören oder die Benutzung zu sperren. Die Sperrabsicht muss nicht der einzige Beweggrund sein.","tags":["Bösgläubigkeit"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=26.06.2008&Aktenzeichen=I+ZR+190/05"},{"id":"case:bgh_ivadal","type":"case","label":"BGH – Ivadal","name":"Ivadal","court":"BGH","date":"2009-04-02","az":"I ZB 8/06","fundstelle":"GRUR 2009, 780","kern":"Die Anmeldung einer Marke, die ein Dritter (hier: ausländischer Vorbenutzer) benutzt, ist nicht schon deshalb bösgläubig, weil der Anmelder von der Vorbenutzung weiß; hinzukommen müssen besondere Umstände, etwa Behinderungsabsicht ohne eigenen Benutzungswillen.","tags":["Bösgläubigkeit"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=02.04.2009&Aktenzeichen=I+ZB+8/06"},{"id":"case:eugh_arsenal","type":"case","label":"EuGH – Arsenal Football Club","name":"Arsenal Football Club","court":"EuGH","date":"2002-11-12","az":"C-206/01","fundstelle":"GRUR 2003, 55","kern":"Der Markeninhaber kann eine Benutzung verbieten, die die Funktionen der Marke, insbesondere die Herkunftsfunktion, beeinträchtigt oder beeinträchtigen kann. Auch die Verwendung als 'Fanartikel' (Zeichen der Verbundenheit) kann rechtsverletzend sein, wenn der Eindruck einer Verbindung zum Markeninhaber entsteht.","tags":["Markenmäßige Benutzung","Funktionenlehre"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=12.11.2002&Aktenzeichen=C-206/01"},{"id":"case:eugh_loreal_bellure","type":"case","label":"EuGH – L'Oréal/Bellure","name":"L'Oréal/Bellure","court":"EuGH","date":"2009-06-18","az":"C-487/07","fundstelle":"GRUR 2009, 756","kern":"Geschützt sind neben der Herkunftsfunktion auch Qualitäts-, Kommunikations-, Investitions- und Werbefunktion. Bei Doppelidentität genügt die Beeinträchtigung einer dieser Funktionen. Unlautere Ausnutzung der Wertschätzung (Duftvergleichslisten) liegt vor, wenn sich der Dritte in den Bereich der Sogwirkung der bekannten Marke begibt, um von ihrer Anziehungskraft ohne eigene Anstrengung zu profitieren.","tags":["Funktionenlehre","Bekanntheitsschutz"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=18.06.2009&Aktenzeichen=C-487/07"},{"id":"case:bgh_opel_blitz_ii","type":"case","label":"BGH – Opel-Blitz II","name":"Opel-Blitz II","court":"BGH","date":"2010-01-14","az":"I ZR 88/08","fundstelle":"GRUR 2010, 726","kern":"Die Anbringung des Opel-Blitzes auf Spielzeugmodellautos verletzt die für Spielzeug eingetragene Marke nicht: Der Verkehr sieht darin nur die originalgetreue Nachbildung des Vorbilds, keinen Hinweis auf die Herkunft des Spielzeugs. Die Herkunftsfunktion wird nicht beeinträchtigt (Umsetzung von EuGH C-48/05 Adam Opel).","tags":["Markenmäßige Benutzung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=14.01.2010&Aktenzeichen=I+ZR+88/08"},{"id":"case:bgh_sam","type":"case","label":"BGH – SAM","name":"SAM","court":"BGH","date":"2019-03-07","az":"I ZR 195/17","fundstelle":"GRUR 2019, 522","kern":"Ob eine Modellbezeichnung (Vorname 'Sam' für Hosen) markenmäßig benutzt wird, hängt von den Kennzeichnungsgewohnheiten der Branche und der konkreten Präsentation ab. Bei Anbringung auf der Ware oder dem Etikett liegt regelmäßig ein Herkunftshinweis vor; bei einer unauffälligen Nennung nur im Bestelltext eines Online-Angebots dagegen nicht ohne weiteres.","tags":["Markenmäßige Benutzung","Modellbezeichnung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=07.03.2019&Aktenzeichen=I+ZR+195/17"},{"id":"case:bgh_damen_hose_mo","type":"case","label":"BGH – Damen Hose MO","name":"Damen Hose MO","court":"BGH","date":"2019-04-11","az":"I ZR 108/18","fundstelle":"GRUR 2019, 1289","kern":"Die Verwendung von 'MO' in der Angebotsüberschrift 'Bench Damen Hose MO' kann als Herkunftshinweis (Zweitmarke) verstanden werden. Die Beurteilung erfolgt anhand der Kennzeichnungsgewohnheiten der Branche und der Gestaltung des konkreten Angebots; ein bekannter Herstellername schließt eine markenmäßige Benutzung der Modellbezeichnung nicht aus.","tags":["Markenmäßige Benutzung","Modellbezeichnung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=11.04.2019&Aktenzeichen=I+ZR+108/18"},{"id":"case:bgh_fruehstuecks_drink_ii","type":"case","label":"BGH – FRÜHSTÜCKS-DRINK II","name":"FRÜHSTÜCKS-DRINK II","court":"BGH","date":"2001-12-20","az":"I ZR 135/99","fundstelle":"GRUR 2002, 812","kern":"Eine Markenverletzung setzt eine markenmäßige Benutzung voraus, d.h. das Zeichen muss im Rahmen des Produktabsatzes jedenfalls auch der Unterscheidung der Waren eines Unternehmens von denen anderer dienen. Rein beschreibende Verwendung ('Frühstücks-Drink' als Produktbeschreibung) genügt nicht.","tags":["Markenmäßige Benutzung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=20.12.2001&Aktenzeichen=I+ZR+135/99"},{"id":"case:eugh_celine","type":"case","label":"EuGH – Céline","name":"Céline","court":"EuGH","date":"2007-09-11","az":"C-17/06","fundstelle":"GRUR 2007, 971","kern":"Die bloße Benutzung einer Firma oder Geschäftsbezeichnung ist keine Benutzung 'für Waren oder Dienstleistungen'. Anders, wenn das Zeichen so benutzt wird, dass eine Verbindung zwischen der Firma und den vertriebenen Waren hergestellt wird und dadurch die Herkunftsfunktion beeinträchtigt werden kann.","tags":["Firmenmäßiger Gebrauch"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=11.09.2007&Aktenzeichen=C-17/06"},{"id":"case:eugh_google_france","type":"case","label":"EuGH – Google France und Google","name":"Google France und Google","court":"EuGH","date":"2010-03-23","az":"C-236/08 bis C-238/08","fundstelle":"GRUR 2010, 445","kern":"Die Buchung einer fremden Marke als AdWords-Keyword ist eine Benutzung im geschäftlichen Verkehr. Die Herkunftsfunktion wird beeinträchtigt, wenn aus der Anzeige für einen normal informierten Internetnutzer nicht oder nur schwer zu erkennen ist, ob die beworbenen Waren vom Markeninhaber, einem verbundenen Unternehmen oder einem Dritten stammen. Google selbst benutzt die Marke nicht.","tags":["Keyword-Advertising"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=23.03.2010&Aktenzeichen=C-236/08+bis+C-238/08"},{"id":"case:bgh_bananabay_ii","type":"case","label":"BGH – Bananabay II","name":"Bananabay II","court":"BGH","date":"2011-01-13","az":"I ZR 125/07","fundstelle":"GRUR 2011, 828","kern":"Keyword-Advertising mit einer fremden Marke verletzt die Herkunftsfunktion regelmäßig nicht, wenn die Anzeige in einem deutlich abgesetzten, als 'Anzeigen' gekennzeichneten Werbeblock erscheint, die Marke in der Anzeige selbst nicht enthalten ist und die Domain des Werbenden auf ein anderes Unternehmen hinweist.","tags":["Keyword-Advertising"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=13.01.2011&Aktenzeichen=I+ZR+125/07"},{"id":"case:bgh_most_pralinen","type":"case","label":"BGH – MOST-Pralinen","name":"MOST-Pralinen","court":"BGH","date":"2012-12-13","az":"I ZR 217/10","fundstelle":"GRUR 2013, 290","kern":"Bestätigung und Präzisierung von Bananabay II: Auch wenn die Anzeige nicht ausdrücklich darauf hinweist, dass keine Verbindung zum Markeninhaber besteht, fehlt die Beeinträchtigung der Herkunftsfunktion, sofern die Anzeige klar abgesetzt ist und keine Angaben zu einer wirtschaftlichen Verbindung enthält. Anders, wenn die Anzeige eine Verbindung nahelegt.","tags":["Keyword-Advertising"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=13.12.2012&Aktenzeichen=I+ZR+217/10"},{"id":"case:bgh_fleurop","type":"case","label":"BGH – Fleurop","name":"Fleurop","court":"BGH","date":"2013-06-27","az":"I ZR 53/12","fundstelle":"GRUR 2014, 182","kern":"Ausnahme zur Bananabay-Rechtsprechung: Weiß der Verkehr, dass der Markeninhaber (Fleurop) sein Geschäft über ein Netz von Partnerfloristen betreibt, liegt bei einer Anzeige auf das Keyword 'Fleurop' die Vermutung einer wirtschaftlichen Verbindung nahe; die Herkunftsfunktion ist beeinträchtigt, wenn die Anzeige nicht klarstellt, dass keine solche Verbindung besteht.","tags":["Keyword-Advertising"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=27.06.2013&Aktenzeichen=I+ZR+53/12"},{"id":"case:bgh_ortlieb_ii","type":"case","label":"BGH – ORTLIEB II","name":"ORTLIEB II","court":"BGH","date":"2019-07-25","az":"I ZR 29/18","fundstelle":"GRUR 2019, 1053","kern":"Amazon-Anzeigen mit der Marke 'ORTLIEB', die auf Angebotslisten verlinken, in denen auch Produkte anderer Hersteller erscheinen, sind irreführend und verletzen die Marke: Der Verkehr erwartet aufgrund der Anzeige ausschließlich Produkte des Markeninhabers. Die Werbewirkung der Marke wird zu Drittprodukten umgeleitet.","tags":["Keyword-Advertising","Online-Handel"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=25.07.2019&Aktenzeichen=I+ZR+29/18"},{"id":"case:bgh_ortlieb_i","type":"case","label":"BGH – ORTLIEB I","name":"ORTLIEB I","court":"BGH","date":"2018-02-15","az":"I ZR 138/16","fundstelle":"GRUR 2018, 924","kern":"Die Anzeige von Konkurrenzprodukten in der internen Suchergebnisliste von Amazon bei Eingabe der Marke 'Ortlieb' verletzt die Marke nicht ohne weiteres: Der Nutzer erkennt bei einer Plattform-Suche, dass ihm auch Alternativangebote gezeigt werden, sofern die Ergebnisse nicht als Produkte des Markeninhabers ausgegeben werden.","tags":["Keyword-Advertising","Online-Handel"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=15.02.2018&Aktenzeichen=I+ZR+138/16"},{"id":"case:bgh_tork","type":"case","label":"BGH – Tork","name":"Tork","court":"BGH","date":"2018-10-17","az":"I ZR 136/17","fundstelle":"GRUR 2019, 79","kern":"Wird ein mit der Marke des Originalherstellers gekennzeichneter Papierhandtuchspender mit Handtüchern eines Dritten befüllt, kann darin eine markenmäßige Benutzung (Doppelidentität) liegen, wenn der Verkehr die Nachfüllware dem Markeninhaber zuordnet. Der Lieferant der Nachfüllware, der die Spender nicht selbst befüllt, ist nicht Täter, kommt aber als Teilnehmer in Betracht; der Hinweis 'passend auch für Tork-Spender' ist an § 23 Nr. 3 zu messen.","tags":["Doppelidentität","Ersatzteil","§ 23"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=17.10.2018&Aktenzeichen=I+ZR+136/17"},{"id":"case:eugh_sabel_puma","type":"case","label":"EuGH – SABEL/Puma","name":"SABEL/Puma","court":"EuGH","date":"1997-11-11","az":"C-251/95","fundstelle":"GRUR 1998, 387","kern":"Die Verwechslungsgefahr ist umfassend unter Berücksichtigung aller Umstände des Einzelfalls zu beurteilen. Maßgeblich ist der Gesamteindruck der Zeichen beim Durchschnittsverbraucher; die bloße gedankliche Verbindung genügt nicht. Je höher die Kennzeichnungskraft der älteren Marke, desto größer die Verwechslungsgefahr.","tags":["Verwechslungsgefahr"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=11.11.1997&Aktenzeichen=C-251/95"},{"id":"case:eugh_canon","type":"case","label":"EuGH – Canon","name":"Canon","court":"EuGH","date":"1998-09-29","az":"C-39/97","fundstelle":"GRUR 1998, 922","kern":"Wechselwirkungslehre: Ein geringerer Grad der Warenähnlichkeit kann durch einen höheren Grad der Zeichenähnlichkeit oder eine erhöhte Kennzeichnungskraft ausgeglichen werden und umgekehrt. Bei der Warenähnlichkeit sind Art, Verwendungszweck, Nutzung, Eigenart als konkurrierende oder ergänzende Waren zu berücksichtigen. Verwechslungsgefahr umfasst auch die Annahme wirtschaftlicher Verbindungen.","tags":["Verwechslungsgefahr","Warenähnlichkeit"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=29.09.1998&Aktenzeichen=C-39/97"},{"id":"case:eugh_lloyd","type":"case","label":"EuGH – Lloyd Schuhfabrik Meyer","name":"Lloyd Schuhfabrik Meyer","court":"EuGH","date":"1999-06-22","az":"C-342/97","fundstelle":"GRUR Int. 1999, 734","kern":"Maßstab ist der durchschnittlich informierte, aufmerksame und verständige Durchschnittsverbraucher, der die Marken selten gleichzeitig wahrnimmt und sich auf sein unvollkommenes Erinnerungsbild verlässt. Die Kennzeichnungskraft ist anhand aller Umstände (Marktanteil, Intensität, Dauer, Werbeaufwand, Bekanntheitsgrad) zu bestimmen; feste Prozentsätze gibt es nicht.","tags":["Verwechslungsgefahr","Durchschnittsverbraucher"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=22.06.1999&Aktenzeichen=C-342/97"},{"id":"case:eugh_thomson_life","type":"case","label":"EuGH – THOMSON LIFE (Medion)","name":"THOMSON LIFE (Medion)","court":"EuGH","date":"2005-10-06","az":"C-120/04","fundstelle":"GRUR 2005, 1042","kern":"Verwechslungsgefahr kann auch dann bestehen, wenn eine ältere Marke ('LIFE') in ein zusammengesetztes jüngeres Zeichen ('THOMSON LIFE') übernommen wird und dort eine selbständig kennzeichnende Stellung behält, ohne den Gesamteindruck zu dominieren. Der Verkehr kann annehmen, die Waren stammten aus wirtschaftlich verbundenen Unternehmen.","tags":["Verwechslungsgefahr","Zusammengesetzte Zeichen"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=06.10.2005&Aktenzeichen=C-120/04"},{"id":"case:bgh_culinaria","type":"case","label":"BGH – Culinaria/Villa Culinaria","name":"Culinaria/Villa Culinaria","court":"BGH","date":"2012-12-05","az":"I ZR 85/11","fundstelle":"GRUR 2013, 833","kern":"Grundlegende Klärung: Bei der Verwechslungsgefahr ist zwischen der Prägung des Gesamteindrucks (Prägetheorie) und der selbständig kennzeichnenden Stellung eines Bestandteils zu unterscheiden. Eine selbständig kennzeichnende Stellung ist die Ausnahme und bedarf besonderer Umstände. Systematik der Kennzeichnungskraft: fünf Grade (sehr gering, gering, durchschnittlich, erhöht, sehr hoch).","tags":["Verwechslungsgefahr","Kennzeichnungskraft"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=05.12.2012&Aktenzeichen=I+ZR+85/11"},{"id":"case:bgh_interconnect","type":"case","label":"BGH – INTERCONNECT/T-InterConnect","name":"INTERCONNECT/T-InterConnect","court":"BGH","date":"2007-06-28","az":"I ZR 132/04","fundstelle":"GRUR 2008, 258","kern":"Ein Bestandteil, der in einem zusammengesetzten Zeichen neben einem bekannten Stammbestandteil ('T-') die konkrete Dienstleistung bezeichnet, kann auch bei geringer Kennzeichnungskraft eine selbständig kennzeichnende Stellung haben und Verwechslungsgefahr im weiteren Sinne begründen.","tags":["Verwechslungsgefahr","Zusammengesetzte Zeichen"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=28.06.2007&Aktenzeichen=I+ZR+132/04"},{"id":"case:bgh_metrobus","type":"case","label":"BGH – METROBUS","name":"METROBUS","court":"BGH","date":"2009-02-05","az":"I ZR 167/06","fundstelle":"GRUR 2009, 484","kern":"Keine Verwechslungsgefahr zwischen 'METRO' und 'METROBUS' für Verkehrsdienstleistungen: 'Metro' wird in 'Metrobus' als beschreibender Hinweis auf ein städtisches Verkehrsmittel verstanden und prägt das Zeichen nicht; auch keine selbständig kennzeichnende Stellung. Schutz der bekannten Marke scheitert an fehlender gedanklicher Verknüpfung.","tags":["Verwechslungsgefahr"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=05.02.2009&Aktenzeichen=I+ZR+167/06"},{"id":"case:bgh_kinder_ii","type":"case","label":"BGH – Kinder II","name":"Kinder II","court":"BGH","date":"2007-09-20","az":"I ZR 94/04","fundstelle":"GRUR 2007, 1066","kern":"Der Wortbestandteil 'Kinder' ist für Süßwaren glatt beschreibend; er hat seine Schutzfähigkeit erst durch Verkehrsdurchsetzung erlangt und besitzt daher nur durchschnittliche, nicht gesteigerte Kennzeichnungskraft. Die durch Verkehrsdurchsetzung erworbene Kennzeichnungskraft beschränkt sich auf die konkrete durchgesetzte Form.","tags":["Kennzeichnungskraft","Verkehrsdurchsetzung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=20.09.2007&Aktenzeichen=I+ZR+94/04"},{"id":"case:bgh_maalox","type":"case","label":"BGH – Maalox/Melox-GRY","name":"Maalox/Melox-GRY","court":"BGH","date":"2011-06-01","az":"I ZB 52/09","fundstelle":"GRUR 2012, 64","kern":"Setzen sich die angesprochenen Verkehrskreise aus mehreren Gruppen (Fachkreise und Endverbraucher) zusammen, genügt für die Verwechslungsgefahr, dass sie bei einer der Gruppen besteht. Die Zeichen 'Maalox' und 'Melox-GRY' sind klanglich und schriftbildlich hinreichend verschieden.","tags":["Verwechslungsgefahr","Verkehrskreise"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=01.06.2011&Aktenzeichen=I+ZB+52/09"},{"id":"case:bgh_goldbaeren","type":"case","label":"BGH – Goldbären","name":"Goldbären","court":"BGH","date":"2015-09-23","az":"I ZR 105/14","fundstelle":"GRUR 2016, 197","kern":"Beim Vergleich einer Wortmarke ('Goldbären') mit einer dreidimensionalen Produktgestaltung (Lindt-Teddy) kann Zeichenähnlichkeit nur in begrifflicher Hinsicht bestehen. Sie setzt voraus, dass die Wortmarke aus Sicht des Verkehrs die naheliegende, ungezwungene und erschöpfende Bezeichnung der Gestaltung ist – strenger Maßstab, hier verneint.","tags":["Zeichenähnlichkeit","Bekanntheitsschutz"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=23.09.2015&Aktenzeichen=I+ZR+105/14"},{"id":"case:bgh_lacoste_krokodil","type":"case","label":"BGH – coccodrillo (Lacoste-Krokodil)","name":"coccodrillo (Lacoste-Krokodil)","court":"BGH","date":"2005-09-22","az":"I ZB 40/03","fundstelle":"GRUR 2006, 60","kern":"Bei Bildmarken kann Verwechslungsgefahr auf einer Übereinstimmung im Bedeutungsgehalt beruhen (Krokodil), wenn die ältere Marke hohe Kennzeichnungskraft besitzt. Die gesteigerte Kennzeichnungskraft (Lacoste-Krokodil für Bekleidung) erweitert den Schutzbereich auch gegenüber unterschiedlich gestalteten Motiven.","tags":["Kennzeichnungskraft","Bildmarke"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=22.09.2005&Aktenzeichen=I+ZB+40/03"},{"id":"case:bgh_mustang","type":"case","label":"BGH – Mustang","name":"Mustang","court":"BGH","date":"2004-07-22","az":"I ZR 204/01","fundstelle":"GRUR 2004, 865","kern":"Wird eine ältere Marke ('MUSTANG') als Bestandteil in ein zusammengesetztes Zeichen ('Sixtyseven by Mustang') übernommen, kann sie dort eine selbständig kennzeichnende Stellung behalten, ohne den Gesamteindruck zu prägen. Eine Verwechslungsgefahr im weiteren Sinne (Annahme wirtschaftlicher Verbindungen) kommt in Betracht, wenn das ältere Zeichen zugleich Unternehmenskennzeichen ist; sie bleibt die Ausnahme.","tags":["Verwechslungsgefahr"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=22.07.2004&Aktenzeichen=I+ZR+204/01"},{"id":"case:bgh_springende_raubkatze","type":"case","label":"BGH – Springende Raubkatze","name":"Springende Raubkatze","court":"BGH","date":"1995-06-29","az":"I ZB 22/93","fundstelle":"GRUR 1996, 198","kern":"Grundentscheidung zur Prägetheorie: Bei mehrgliedrigen Zeichen ist auf den Gesamteindruck abzustellen; ein einzelner Bestandteil kann den Gesamteindruck aber prägen, wenn die übrigen Bestandteile für den Verkehr in den Hintergrund treten. Ein rein beschreibender Bestandteil prägt nicht.","tags":["Prägetheorie"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=29.06.1995&Aktenzeichen=I+ZB+22/93"},{"id":"case:bgh_desperados","type":"case","label":"BGH – DESPERADOS/DESPERADO","name":"DESPERADOS/DESPERADO","court":"BGH","date":"2013-11-06","az":"I ZB 63/12","fundstelle":"GRUR 2014, 488","kern":"Zur Warenähnlichkeit (Bier vs. Spirituosen/alkoholfreie Getränke): Maßgeblich sind Herstellungsstätten, Vertriebswege, stoffliche Beschaffenheit, Verwendungszweck sowie ob die Waren einander ergänzen oder miteinander konkurrieren; die Verkehrsauffassung über eine gemeinsame betriebliche Herkunft ist entscheidend.","tags":["Warenähnlichkeit"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=06.11.2013&Aktenzeichen=I+ZB+63/12"},{"id":"case:bgh_bogner_b","type":"case","label":"BGH – Bogner B/Barbie B","name":"Bogner B/Barbie B","court":"BGH","date":"2012-02-02","az":"I ZR 50/11","fundstelle":"GRUR 2012, 930","kern":"Einzelbuchstabenmarken haben originär durchschnittliche Kennzeichnungskraft, sofern kein beschreibender Bezug besteht. Bei der Zeichenähnlichkeit zweier Buchstabenmarken kommt es maßgeblich auf die graphische Gestaltung an.","tags":["Kennzeichnungskraft","Buchstabenmarke"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=02.02.2012&Aktenzeichen=I+ZR+50/11"},{"id":"case:bgh_ips_isp","type":"case","label":"BGH – IPS/ISP","name":"IPS/ISP","court":"BGH","date":"2015-03-05","az":"I ZR 161/13","fundstelle":"GRUR 2015, 1004","kern":"Die Ähnlichkeit von Buchstabenfolgen ist nach Klang, Schriftbild und Sinngehalt zu beurteilen; eine Übereinstimmung in nur einer Hinsicht kann Verwechslungsgefahr begründen. Kennzeichnungsschwäche einer Buchstabenfolge wegen beschreibender Anklänge ist zu berücksichtigen.","tags":["Zeichenähnlichkeit"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=05.03.2015&Aktenzeichen=I+ZR+161/13"},{"id":"case:eugh_general_motors","type":"case","label":"EuGH – General Motors/Yplon (Chevy)","name":"General Motors/Yplon (Chevy)","court":"EuGH","date":"1999-09-14","az":"C-375/97","fundstelle":"GRUR Int. 2000, 73","kern":"Eine Marke ist bekannt, wenn sie einem bedeutenden Teil des Publikums bekannt ist, das von den durch die Marke erfassten Waren oder Dienstleistungen betroffen ist. Feste Prozentsätze gibt es nicht; zu berücksichtigen sind Marktanteil, Intensität, geographische Ausdehnung, Dauer der Benutzung und Werbeaufwand. Bekanntheit in einem wesentlichen Teil des Gebiets genügt.","tags":["Bekanntheitsschutz"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=14.09.1999&Aktenzeichen=C-375/97"},{"id":"case:eugh_intel","type":"case","label":"EuGH – Intel/CPM (INTELMARK)","name":"Intel/CPM (INTELMARK)","court":"EuGH","date":"2008-11-27","az":"C-252/07","fundstelle":"GRUR 2009, 56","kern":"Die gedankliche Verknüpfung zwischen den Zeichen ist notwendige, aber nicht hinreichende Voraussetzung des Bekanntheitsschutzes. Eine Beeinträchtigung der Unterscheidungskraft (Verwässerung) erfordert den Nachweis einer Änderung des wirtschaftlichen Verhaltens des Durchschnittsverbrauchers oder die ernsthafte Gefahr einer solchen Änderung.","tags":["Bekanntheitsschutz","Verwässerung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=27.11.2008&Aktenzeichen=C-252/07"},{"id":"case:bgh_lila_postkarte","type":"case","label":"BGH – Lila-Postkarte","name":"Lila-Postkarte","court":"BGH","date":"2005-02-03","az":"I ZR 159/02","fundstelle":"GRUR 2005, 583","kern":"Die Verwendung der bekannten Milka-Marken (Farbe Lila, 'Milka') auf einer satirischen Postkarte ist markenmäßige Benutzung. Die Ausnutzung der Unterscheidungskraft/Wertschätzung ist aber nicht 'ohne rechtfertigenden Grund in unlauterer Weise' erfolgt, wenn die Kunstfreiheit (Art. 5 Abs. 3 GG) überwiegt und die Marke nicht herabgesetzt wird.","tags":["Bekanntheitsschutz","Kunstfreiheit"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=03.02.2005&Aktenzeichen=I+ZR+159/02"},{"id":"case:bgh_springender_pudel","type":"case","label":"BGH – Springender Pudel","name":"Springender Pudel","court":"BGH","date":"2015-04-02","az":"I ZR 59/13","fundstelle":"GRUR 2015, 1114","kern":"Die Parodie einer bekannten Marke (springender Pudel statt Puma-Raubkatze) nutzt deren Unterscheidungskraft in unlauterer Weise aus, wenn der Verkehr die Zeichen gedanklich verknüpft und der Parodist von der Aufmerksamkeit der bekannten Marke profitiert. Kunst- und Meinungsfreiheit rechtfertigen nicht die Eintragung als eigene Marke; der Inhaber der bekannten Marke kann die Löschung verlangen.","tags":["Bekanntheitsschutz","Markenparodie"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=02.04.2015&Aktenzeichen=I+ZR+59/13"},{"id":"case:bgh_otto_cap","type":"case","label":"BGH – OTTO Cap","name":"OTTO Cap","court":"BGH","date":"2013-10-31","az":"I ZR 49/12","fundstelle":"GRUR 2014, 378","kern":"Der Bekanntheitsschutz gilt auch bei Waren-/Dienstleistungsidentität oder -ähnlichkeit (richtlinienkonforme Auslegung). Unlautere Ausnutzung der Unterscheidungskraft ('OTTO' für Caps): Der Verkehr verknüpft die Zeichen gedanklich; der Versandhändler kann die Verwendung für Bekleidung verbieten, auch ohne Verwechslungsgefahr.","tags":["Bekanntheitsschutz"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=31.10.2013&Aktenzeichen=I+ZR+49/12"},{"id":"case:bgh_oeko_test_ii","type":"case","label":"BGH – ÖKO-TEST II","name":"ÖKO-TEST II","court":"BGH","date":"2019-12-12","az":"I ZR 117/17","fundstelle":"GRUR 2020, 405","kern":"Die Verwendung des bekannten ÖKO-TEST-Siegels in der Produktwerbung ohne Lizenz nutzt die Wertschätzung der bekannten Marke unlauter aus, auch wenn das Testsiegel für Dienstleistungen (Verbraucherinformation) und nicht für die beworbenen Waren eingetragen ist (im Anschluss an EuGH C-690/17).","tags":["Bekanntheitsschutz","Testsiegel"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=12.12.2019&Aktenzeichen=I+ZR+117/17"},{"id":"case:bgh_volkswagen_volksinspektion","type":"case","label":"BGH – VOLKSWAGEN/Volks.Inspektion","name":"VOLKSWAGEN/Volks.Inspektion","court":"BGH","date":"2013-04-11","az":"I ZR 214/11","fundstelle":"GRUR 2013, 1239","kern":"Zur Beeinträchtigung/Ausnutzung der bekannten Marke VOLKSWAGEN durch 'Volks.Inspektion' u.a. (ATU): Verwechslungsgefahr wurde verneint; für den Bekanntheitsschutz genügt die gedankliche Verknüpfung, die bei Übernahme des charakteristischen Bestandteils 'Volks' in Verbindung mit Kfz-Dienstleistungen naheliegt – Zurückverweisung.","tags":["Bekanntheitsschutz"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=11.04.2013&Aktenzeichen=I+ZR+214/11"},{"id":"case:bgh_tuev_ii","type":"case","label":"BGH – TÜV II","name":"TÜV II","court":"BGH","date":"2011-08-17","az":"I ZR 108/09","fundstelle":"GRUR 2011, 1043","kern":"Die Verwendung der bekannten Marke 'TÜV' durch einen Wettbewerber ('TÜV-Service' ohne Berechtigung) nutzt die Unterscheidungskraft und Wertschätzung in unlauterer Weise aus; eine Rechtfertigung als beschreibende Angabe (§ 23 Nr. 2) scheidet aus, wenn 'TÜV' nicht generisch für Prüfdienstleistungen geworden ist.","tags":["Bekanntheitsschutz"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=17.08.2011&Aktenzeichen=I+ZR+108/09"},{"id":"case:eugh_gillette","type":"case","label":"EuGH – Gillette/LA-Laboratories","name":"Gillette/LA-Laboratories","court":"EuGH","date":"2005-03-17","az":"C-228/03","fundstelle":"GRUR 2005, 509","kern":"Die Benutzung einer fremden Marke als Bestimmungshinweis (Rasierklingen 'passend für Gillette Sensor') ist notwendig, wenn sie praktisch das einzige Mittel ist, dem Publikum eine verständliche und vollständige Information über die Bestimmung zu geben. Sie muss den anständigen Gepflogenheiten entsprechen: keine Verbindung suggerieren, Wertschätzung nicht unlauter ausnutzen, Marke nicht herabsetzen, kein Imitat.","tags":["§ 23","Ersatzteil"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=17.03.2005&Aktenzeichen=C-228/03"},{"id":"case:bgh_staubsaugerfiltertueten","type":"case","label":"BGH – Staubsaugerfiltertüten","name":"Staubsaugerfiltertüten","court":"BGH","date":"2005-01-20","az":"I ZR 34/02","fundstelle":"GRUR 2005, 423","kern":"Die Angabe 'Filtertüte passend für Vorwerk Kobold 130' ist als notwendiger Bestimmungshinweis zulässig, wenn der Zusatz 'passend für' deutlich hervorgehoben ist und die eigene Marke des Anbieters im Vordergrund steht, so dass keine Verbindung zum Markeninhaber suggeriert wird.","tags":["§ 23","Ersatzteil"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=20.01.2005&Aktenzeichen=I+ZR+34/02"},{"id":"case:bgh_kuehlergrill","type":"case","label":"BGH – Kühlergrill","name":"Kühlergrill","court":"BGH","date":"2019-03-07","az":"I ZR 61/18","fundstelle":"GRUR 2019, 953","kern":"Ein Kühlergrill mit einer Aufnahme, die die Form des Audi-Emblems (Ringe) hat, benutzt die Marke markenmäßig. Die Schranke des § 23 Nr. 3 greift nicht, weil die Nachbildung des Emblems zur Angabe der Bestimmung als Ersatzteil nicht notwendig ist – eine neutrale Halterung genügt.","tags":["§ 23","Ersatzteil"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=07.03.2019&Aktenzeichen=I+ZR+61/18"},{"id":"case:bgh_grosse_inspektion","type":"case","label":"BGH – GROSSE INSPEKTION FÜR ALLE","name":"GROSSE INSPEKTION FÜR ALLE","court":"BGH","date":"2011-04-14","az":"I ZR 33/10","fundstelle":"GRUR 2011, 1135","kern":"Die Verwendung der Wort-Bild-Marke (VW-Logo) einer Kfz-Werkstatt in der Werbung für Inspektionen ist nicht nach § 23 Nr. 3 gerechtfertigt, wenn die Angabe der Bestimmung auch durch die Wortmarke 'VW' möglich wäre; die Verwendung des Bildzeichens ist nicht notwendig und verstößt gegen die anständigen Gepflogenheiten.","tags":["§ 23"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=14.04.2011&Aktenzeichen=I+ZR+33/10"},{"id":"case:eugh_bms","type":"case","label":"EuGH – Bristol-Myers Squibb/Paranova","name":"Bristol-Myers Squibb/Paranova","court":"EuGH","date":"1996-07-11","az":"C-427/93 u.a.","fundstelle":"GRUR Int. 1996, 1144","kern":"Der Markeninhaber kann sich dem Vertrieb umgepackter Arzneimittel (Parallelimport) nicht widersetzen, wenn (1) das Umpacken zur Vermarktung im Einfuhrstaat erforderlich ist, (2) der Originalzustand nicht beeinträchtigt wird, (3) Umpacker und Hersteller angegeben sind, (4) die Aufmachung den Ruf nicht schädigt und (5) der Inhaber vorab unterrichtet wird (BMS-Kriterien).","tags":["Erschöpfung","Parallelimport"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=11.07.1996&Aktenzeichen=C-427/93+u.a."},{"id":"case:eugh_van_doren","type":"case","label":"EuGH – Van Doren + Q. (stüssy)","name":"Van Doren + Q. (stüssy)","court":"EuGH","date":"2003-04-08","az":"C-244/00","fundstelle":"GRUR 2003, 512","kern":"Grundsätzlich trägt der Dritte, der sich auf Erschöpfung beruft, die Beweislast für das Inverkehrbringen im EWR mit Zustimmung des Inhabers. Bei einem ausschließlichen Vertriebssystem und tatsächlicher Gefahr der Marktabschottung muss jedoch der Markeninhaber beweisen, dass die Ware außerhalb des EWR in Verkehr gebracht wurde.","tags":["Erschöpfung","Beweislast"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=08.04.2003&Aktenzeichen=C-244/00"},{"id":"case:bgh_stuessy_ii","type":"case","label":"BGH – stüssy II","name":"stüssy II","court":"BGH","date":"2003-10-23","az":"I ZR 193/97","fundstelle":"GRUR 2004, 156","kern":"Umsetzung von Van Doren: Der Beklagte trägt grundsätzlich die Beweislast für die Erschöpfung; eine Beweislastumkehr zugunsten des Beklagten tritt ein, wenn der Markeninhaber ein ausschließliches Vertriebssystem betreibt und bei Offenlegung der Bezugsquelle Marktabschottung droht.","tags":["Erschöpfung","Beweislast"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=23.10.2003&Aktenzeichen=I+ZR+193/97"},{"id":"case:bgh_converse_i","type":"case","label":"BGH – Converse I","name":"Converse I","court":"BGH","date":"2012-03-15","az":"I ZR 52/10","fundstelle":"GRUR 2012, 626","kern":"Behauptet der Beklagte, es handle sich um Originalware, für die Erschöpfung eingetreten sei, und bestreitet der Markeninhaber die Echtheit, trägt der Beklagte die Beweislast für die Echtheit und das Inverkehrbringen im EWR, sofern keine Gefahr der Marktabschottung besteht.","tags":["Erschöpfung","Beweislast"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=15.03.2012&Aktenzeichen=I+ZR+52/10"},{"id":"case:bgh_converse_ii","type":"case","label":"BGH – Converse II","name":"Converse II","court":"BGH","date":"2012-03-15","az":"I ZR 137/10","fundstelle":"GRUR 2012, 630","kern":"Stammt die Ware von einem ehemaligen Lizenznehmer des Markeninhabers im EWR, gilt: Das Inverkehrbringen durch einen Lizenznehmer unter Verstoß gegen den Lizenzvertrag (§ 30 Abs. 2) erfolgt ohne Zustimmung; Erschöpfung tritt nicht ein. Keine Beweislastumkehr ohne Marktabschottungsgefahr.","tags":["Erschöpfung","Lizenz"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=15.03.2012&Aktenzeichen=I+ZR+137/10"},{"id":"case:eugh_dior_evora","type":"case","label":"EuGH – Parfums Christian Dior/Evora","name":"Parfums Christian Dior/Evora","court":"EuGH","date":"1997-11-04","az":"C-337/95","fundstelle":"GRUR Int. 1998, 140","kern":"Nach Erschöpfung darf der Wiederverkäufer die Marke auch in seiner Werbung benutzen. Ein berechtigter Grund i.S.d. § 24 Abs. 2 liegt nur vor, wenn die Werbung den Ruf der Marke (Luxusimage) erheblich schädigt – Abwägung zwischen dem berechtigten Interesse des Inhabers und dem Interesse des Händlers an branchenüblicher Werbung.","tags":["Erschöpfung","Werbung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=04.11.1997&Aktenzeichen=C-337/95"},{"id":"case:eugh_ansul","type":"case","label":"EuGH – Ansul/Ajax","name":"Ansul/Ajax","court":"EuGH","date":"2003-03-11","az":"C-40/01","fundstelle":"GRUR 2003, 425","kern":"Ernsthafte Benutzung liegt vor, wenn die Marke entsprechend ihrer Hauptfunktion benutzt wird, um für die Waren einen Absatzmarkt zu erschließen oder zu sichern; rein symbolische Benutzung zur Rechtserhaltung genügt nicht. Auch die Benutzung für Ersatzteile oder im Rahmen des Kundendienstes kann ausreichen.","tags":["Benutzungszwang"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=11.03.2003&Aktenzeichen=C-40/01"},{"id":"case:bgh_voodoo","type":"case","label":"BGH – VOODOO","name":"VOODOO","court":"BGH","date":"2013-02-06","az":"I ZR 106/11","fundstelle":"GRUR 2013, 925","kern":"Ernsthafte Benutzung setzt keinen Mindestumfang voraus; entscheidend ist, ob die Benutzung wirtschaftlich sinnvoll ist, um Marktanteile zu gewinnen oder zu halten. Bei einer Wortmarke reicht die Benutzung auf Etiketten und in Katalogen mit tatsächlichem Absatz; die Beweislast trägt im Verletzungsprozess der Markeninhaber, wenn die Einrede erhoben wird.","tags":["Benutzungszwang"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=06.02.2013&Aktenzeichen=I+ZR+106/11"},{"id":"case:bgh_lottocard","type":"case","label":"BGH – LOTTOCARD","name":"LOTTOCARD","court":"BGH","date":"2008-04-10","az":"I ZR 167/05","fundstelle":"GRUR 2009, 60","kern":"Einer Marke ('LOTTO' für Lotteriedienstleistungen) kann die rechtserhaltende Benutzung nicht mit der Begründung abgesprochen werden, sie werde nur beschreibend verstanden; es genügt, dass der Verkehr die konkrete Verwendung als Marke auffasst. Die Verwendung in Kombination mit anderen Zeichen ('LOTTOCARD') kann rechtserhaltend sein, wenn 'LOTTO' seine kennzeichnende Eigenständigkeit behält.","tags":["Benutzungszwang"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=10.04.2008&Aktenzeichen=I+ZR+167/05"},{"id":"case:bgh_probiotik","type":"case","label":"BGH – Probiotik","name":"Probiotik","court":"BGH","date":"2014-01-08","az":"I ZR 38/13","fundstelle":"GRUR 2014, 662","kern":"Wird eine Wortmarke graphisch gestaltet oder mit Bildelementen ergänzt, ist zu prüfen, ob die Zusätze einen Bezug zur Herkunftsfunktion haben oder nur allgemeine Sachhinweise/Werbemittel sind; letztere verändern den kennzeichnenden Charakter nicht (§ 26 Abs. 3).","tags":["Benutzungszwang","Abweichende Form"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=08.01.2014&Aktenzeichen=I+ZR+38/13"},{"id":"case:bgh_dorzo","type":"case","label":"BGH – Dorzo","name":"Dorzo","court":"BGH","date":"2017-05-11","az":"I ZB 6/16","fundstelle":"GRUR 2017, 1043","kern":"Die Benutzung 'Dorzo-Vision' für die Marke 'Dorzo' ist nicht rechtserhaltend, wenn der Verkehr die Kombination als einheitliches Zeichen wahrnimmt und 'Dorzo' nicht mehr als eigenständigen Herkunftshinweis erkennt: Der kennzeichnende Charakter ist dann verändert.","tags":["Benutzungszwang","Abweichende Form"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=11.05.2017&Aktenzeichen=I+ZB+6/16"},{"id":"case:bgh_castell","type":"case","label":"BGH – Castell/VIN CASTEL","name":"Castell/VIN CASTEL","court":"BGH","date":"2012-05-31","az":"I ZR 112/10","fundstelle":"GRUR 2013, 68","kern":"Zum Schutz eines Firmenbestandteils ('Castell') als Unternehmenskennzeichen nach § 5 Abs. 2: Erforderlich ist ein unterscheidungskräftiger Bestandteil, der sich seiner Natur nach als schlagwortartiger Hinweis auf das Unternehmen eignet. Zur rechtserhaltenden Benutzung einer Marke in Kombination mit weiteren Bestandteilen ('Castell' in 'Castell Castell'): unschädlich, wenn der Verkehr die Marke als eigenständigen Herkunftshinweis erkennt.","tags":["Benutzungszwang"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=31.05.2012&Aktenzeichen=I+ZR+112/10"},{"id":"case:bgh_wetter_de","type":"case","label":"BGH – wetter.de","name":"wetter.de","court":"BGH","date":"2016-01-28","az":"I ZR 202/14","fundstelle":"GRUR 2016, 939","kern":"Apps und Internet-Informationsangebote können titelschutzfähige Werke i.S.d. § 5 Abs. 3 sein. 'wetter.de' fehlt jedoch die originäre Unterscheidungskraft, weil die Bezeichnung nur den Inhalt (Wetterinformationen) beschreibt; eine Verkehrsgewöhnung an beschreibende Titel wie bei Zeitschriften ist für Apps/Domains nicht festgestellt.","tags":["Werktitel","Domain","App"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=28.01.2016&Aktenzeichen=I+ZR+202/14"},{"id":"case:bgh_das_omen","type":"case","label":"BGH – Das Omen","name":"Das Omen","court":"BGH","date":"2019-01-31","az":"I ZR 97/17","fundstelle":"GRUR 2019, 535","kern":"Der Titel eines Musikstücks ('Das Omen (Teil 1)') genießt Werktitelschutz; Inhaber ist, wem das Werk zuzuordnen ist (Komponist/Textdichter). Die Verwechslungsgefahr ist unter Berücksichtigung der Besonderheiten des Werks (Werkähnlichkeit) zu prüfen.","tags":["Werktitel"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=31.01.2019&Aktenzeichen=I+ZR+97/17"},{"id":"case:bgh_augsburger_puppenkiste","type":"case","label":"BGH – Augsburger Puppenkiste","name":"Augsburger Puppenkiste","court":"BGH","date":"2008-12-18","az":"I ZR 200/06","fundstelle":"GRUR 2009, 772","kern":"Keine Verwechslungsgefahr zwischen 'Augsburger Puppenkiste' und 'Leipziger Puppenkiste': Die Ortsangaben prägen die Gesamtbezeichnungen mit, der gemeinsame Bestandteil 'Puppenkiste' ist kennzeichnungsschwach. Werktitel schützen grundsätzlich nur gegen unmittelbare Werkverwechslung; eine Verwechslungsgefahr im weiteren Sinne kommt nur bei bekannten Titeln mit Herkunftshinweisfunktion in Betracht.","tags":["Werktitel"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=18.12.2008&Aktenzeichen=I+ZR+200/06"},{"id":"case:bgh_peek_cloppenburg","type":"case","label":"BGH – Peek & Cloppenburg","name":"Peek & Cloppenburg","court":"BGH","date":"2010-03-31","az":"I ZR 174/07","fundstelle":"GRUR 2010, 738","kern":"Recht der Gleichnamigen: Zwei seit langem koexistierende Unternehmen gleichen Namens müssen die Verwechslungsgefahr durch aufklärende Zusätze (Ortsangabe) reduzieren; bundesweite Werbung ist zulässig, wenn ein deutlicher, nicht notwendig gleich großer Hinweis auf die Unternehmensidentität erfolgt.","tags":["Unternehmenskennzeichen","Gleichnamigkeit"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=31.03.2010&Aktenzeichen=I+ZR+174/07"},{"id":"case:bgh_baumann_ii","type":"case","label":"BGH – Baumann II","name":"Baumann II","court":"BGH","date":"2016-06-23","az":"I ZR 241/14","fundstelle":"GRUR 2016, 965","kern":"Der Schutz eines Unternehmenskennzeichens entsteht mit Benutzungsaufnahme; die Priorität bestimmt sich nach § 6. Zur Verwirkung und zum Fortbestand des Kennzeichenrechts bei Änderungen der Firma; bei mehreren Bestandteilen kann der prägende Bestandteil ('Baumann') selbständig geschützt sein.","tags":["Unternehmenskennzeichen"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=23.06.2016&Aktenzeichen=I+ZR+241/14"},{"id":"case:bgh_soco_de","type":"case","label":"BGH – soco.de","name":"soco.de","court":"BGH","date":"2004-07-22","az":"I ZR 135/01","fundstelle":"GRUR 2005, 262","kern":"Ein Domainname kann als Unternehmenskennzeichen geschützt sein, wenn der Verkehr ihn als Hinweis auf ein Unternehmen versteht. Der Schutz einer Domain als Kennzeichen entsteht erst mit Benutzungsaufnahme im geschäftlichen Verkehr, nicht schon mit der Registrierung.","tags":["Unternehmenskennzeichen","Domain"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=22.07.2004&Aktenzeichen=I+ZR+135/01"},{"id":"case:bgh_shell_de","type":"case","label":"BGH – shell.de","name":"shell.de","court":"BGH","date":"2001-11-22","az":"I ZR 138/99","fundstelle":"GRUR 2002, 622","kern":"Bei Gleichnamigkeit (Privatperson Shell vs. Shell-Konzern) gilt für Domains grundsätzlich Priorität der Registrierung. Ausnahme bei überragender Bekanntheit eines Namensträgers: Der Verkehr erwartet unter 'shell.de' den bekannten Konzern; der Privatmann muss einen unterscheidenden Zusatz wählen.","tags":["Domain","Namensrecht"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=22.11.2001&Aktenzeichen=I+ZR+138/99"},{"id":"case:bgh_defacto","type":"case","label":"BGH – defacto","name":"defacto","court":"BGH","date":"2002-02-21","az":"I ZR 230/99","fundstelle":"GRUR 2002, 898","kern":"Für die Verwechslungsgefahr bei Unternehmenskennzeichen kommt es auf die Branchennähe, die Kennzeichnungskraft des älteren Zeichens und die Zeichenähnlichkeit an (Wechselwirkung). Firmenschlagworte ('defacto') sind selbständig schutzfähig, wenn sie ihrer Natur nach geeignet sind, als Schlagwort zu wirken.","tags":["Unternehmenskennzeichen"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=21.02.2002&Aktenzeichen=I+ZR+230/99"},{"id":"case:bgh_hard_rock_cafe","type":"case","label":"BGH – Hard Rock Cafe","name":"Hard Rock Cafe","court":"BGH","date":"2013-08-15","az":"I ZR 188/11","fundstelle":"GRUR 2013, 1161","kern":"Verwirkung nach § 21 Abs. 4 MarkenG i.V.m. § 242 BGB: Bei wiederholten, gleichartigen Verletzungshandlungen entsteht mit jeder Handlung ein neuer Unterlassungsanspruch, so dass Verwirkung nur bei Duldung des konkreten Zustands in Betracht kommt. Aufgabe der Vorrangthese: Lauterkeitsrechtliche Ansprüche (§ 5 Abs. 2 UWG) bestehen neben markenrechtlichen; Wertungswidersprüche sind zu vermeiden.","tags":["Verwirkung","UWG"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=15.08.2013&Aktenzeichen=I+ZR+188/11"},{"id":"case:bgh_internet_versteigerung_ii","type":"case","label":"BGH – Internet-Versteigerung II","name":"Internet-Versteigerung II","court":"BGH","date":"2007-04-19","az":"I ZR 35/04","fundstelle":"GRUR 2007, 708","kern":"Der Betreiber einer Internet-Handelsplattform (eBay) haftet als Störer auf Unterlassung, wenn er nach Hinweis auf eine klare Markenverletzung das Angebot nicht sperrt und keine zumutbaren Vorkehrungen gegen gleichartige Verletzungen trifft. Die Haftungsprivilegierung des TMG gilt nicht für Unterlassungsansprüche.","tags":["Störerhaftung","Plattform"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=19.04.2007&Aktenzeichen=I+ZR+35/04"},{"id":"case:bgh_kinderhochstuehle","type":"case","label":"BGH – Kinderhochstühle im Internet","name":"Kinderhochstühle im Internet","court":"BGH","date":"2010-07-22","az":"I ZR 139/08","fundstelle":"GRUR 2011, 152","kern":"Ein Plattformbetreiber muss nicht alle Angebote mit einer Marke manuell auf Fälschungen prüfen; Prüfpflichten bestehen erst nach konkretem Hinweis und im zumutbaren Umfang. Teilnehmerhaftung (Beihilfe) setzt Vorsatz bezüglich der Haupttat voraus; die Störerhaftung wurde für das Lauterkeitsrecht aufgegeben, im Markenrecht beibehalten.","tags":["Störerhaftung","Plattform"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=22.07.2010&Aktenzeichen=I+ZR+139/08"},{"id":"case:bgh_btk","type":"case","label":"BGH – BTK","name":"BTK","court":"BGH","date":"2009-07-29","az":"I ZR 169/07","fundstelle":"GRUR 2010, 239","kern":"Zur Schadensberechnung nach der Lizenzanalogie bei Kennzeichenverletzungen: Der Verletzer schuldet, was vernünftige Vertragsparteien als Lizenzgebühr vereinbart hätten; maßgeblich sind Bekanntheit und Ruf des Kennzeichens, Grad der Verwechslungsgefahr und Umfang der Benutzung.","tags":["Schadensersatz"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=29.07.2009&Aktenzeichen=I+ZR+169/07"},{"id":"case:bgh_smartbook","type":"case","label":"BGH – smartbook","name":"smartbook","court":"BGH","date":"2013-11-06","az":"I ZB 59/12","fundstelle":"GRUR 2014, 565","kern":"Im Löschungsverfahren wegen absoluter Schutzhindernisse ist auf den Anmeldezeitpunkt abzustellen; die Feststellungslast für das Vorliegen des Schutzhindernisses trägt der Löschungsantragsteller. Verbleibende Zweifel gehen zu Lasten des Antragstellers ('smartbook' für Computer: Schutzhindernis nicht sicher feststellbar).","tags":["Löschung","Nichtigkeit"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=06.11.2013&Aktenzeichen=I+ZB+59/12"},{"id":"case:eugh_interflora","type":"case","label":"EuGH – Interflora/Marks & Spencer","name":"Interflora/Marks & Spencer","court":"EuGH","date":"2011-09-22","az":"C-323/09","fundstelle":"GRUR 2011, 1124","kern":"Keyword-Werbung mit einer bekannten Marke beeinträchtigt die Investitionsfunktion, wenn sie die Nutzung der Marke zum Erwerb/zur Wahrung eines Rufs wesentlich stört. Sie ist als 'Trittbrettfahren' unlauter, wenn Nachahmungen angeboten werden; nicht aber, wenn lediglich eine Alternative zum Markenprodukt angeboten wird (gesunder Wettbewerb).","tags":["Keyword-Advertising","Bekanntheitsschutz"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=22.09.2011&Aktenzeichen=C-323/09"},{"id":"case:eugh_adam_opel","type":"case","label":"EuGH – Adam Opel/Autec","name":"Adam Opel/Autec","court":"EuGH","date":"2007-01-25","az":"C-48/0
