# Baut bei jedem Push auf main den Wissensgraphen, die Karteikarten und beide Web-Apps
# neu und veröffentlicht den Ordner docs/ auf GitHub Pages:
#   /            IPelico (Fallkurs)
#   /navigator/  Lernnavigator
# Voraussetzung (einmalig): Settings -> Pages -> Source "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Graph, Karteikarten und Apps bauen
        run: python3 build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
