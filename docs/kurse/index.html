hnheiten und Gebräuche bei der Verwendung der\ngeographischen Herkunftsangabe zu berücksichtigen."}],"url":"https://www.gesetze-im-internet.de/markeng/__137.html"},{"id":"norm:§138","type":"norm","label":"§ 138 MarkenG","titel":"Sonstige Vorschriften für das Verfahren bei Anträgen und Einsprüchen nach der Verordnung (EU) Nr. 1151/2012","nummer":"138","teil":"Teil 7 - Geographische Herkunftsangaben","abschnitt":"Abschnitt 3 - Ermächtigungen zum Erlaß von Rechtsverordnungen","absaetze":[{"nr":"1","text":"Das Bundesministerium der Justiz und für Verbraucherschutz wird\nermächtigt, durch Rechtsverordnung ohne Zustimmung des Bundesrates\nnähere Bestimmungen über das Antrags-, Einspruchs-, Änderungs- und\nLöschungsverfahren (§§ 130 bis 132) zu treffen."},{"nr":"2","text":"Das Bundesministerium der Justiz und für Verbraucherschutz kann\ndie Ermächtigung zum Erlass von Rechtsverordnungen nach Absatz 1 durch\nRechtsverordnung ohne Zustimmung des Bundesrates ganz oder teilweise\nauf das Deutsche Patent- und Markenamt übertragen."}],"url":"https://www.gesetze-im-internet.de/markeng/__138.html"},{"id":"norm:§139","type":"norm","label":"§ 139 MarkenG","titel":"Durchführungsbestimmungen zur Verordnung (EU) Nr. 1151/2012; Verordnungsermächtigung","nummer":"139","teil":"Teil 7 - Geographische Herkunftsangaben","abschnitt":"Abschnitt 3 - Ermächtigungen zum Erlaß von Rechtsverordnungen","absaetze":[{"nr":"1","text":"Das Bundesministerium der Justiz und für Verbraucherschutz wird\nermächtigt, im Einvernehmen mit dem Bundesministerium für Wirtschaft\nund Energie und dem Bundesministerium für Ernährung und Landwirtschaft\ndurch Rechtsverordnung mit Zustimmung des Bundesrates weitere\nEinzelheiten des Schutzes von Ursprungsbezeichnungen und\ngeographischen Angaben nach der Verordnung (EU) Nr. 1151/2012 zu\nregeln, soweit sich das Erfordernis hierfür aus der Verordnung (EU)\nNr. 1151/2012 oder den zu ihrer Durchführung erlassenen Vorschriften\ndes Rates oder der Europäischen Kommission ergibt. In\nRechtsverordnungen nach Satz 1 können insbesondere Vorschriften über\n\n1. die Kennzeichnung der Agrarerzeugnisse oder Lebensmittel,\n\n2. die Berechtigung zum Verwenden der geschützten Bezeichnungen oder\n\n3. die Voraussetzungen und das Verfahren bei der Überwachung oder\n Kontrolle beim innergemeinschaftlichen Verbringen oder bei der Einfuhr\n oder Ausfuhr\n\nerlassen werden. Rechtsverordnungen nach Satz 1 können auch erlassen\nwerden, wenn die Mitgliedstaaten nach den dort genannten\ngemeinschaftsrechtlichen Vorschriften befugt sind, ergänzende\nVorschriften zu erlassen."},{"nr":"2","text":"Die Landesregierungen werden ermächtigt, durch Rechtsverordnung\ndie Durchführung der nach Artikel 37 Absatz 1 der Verordnung (EU) Nr.\n1151/2012 erforderlichen Kontrollen zugelassenen privaten\nKontrollstellen zu übertragen oder solche an der Durchführung dieser\nKontrollen zu beteiligen. Die Landesregierungen können auch die\nVoraussetzungen und das Verfahren der Zulassung privater\nKontrollstellen durch Rechtsverordnung regeln. Sie sind befugt, die\nErmächtigung nach den Sätzen 1 und 2 durch Rechtsverordnung ganz oder\nteilweise auf andere Behörden zu übertragen."}],"url":"https://www.gesetze-im-internet.de/markeng/__139.html"},{"id":"norm:§140","type":"norm","label":"§ 140 MarkenG","titel":"Kennzeichenstreitsachen","nummer":"140","teil":"Teil 8 - Verfahren in Kennzeichenstreitsachen","abschnitt":null,"absaetze":[{"nr":"1","text":"Für alle Klagen, durch die ein Anspruch aus einem der in diesem\nGesetz geregelten Rechtsverhältnisse geltend gemacht wird\n(Kennzeichenstreitsachen), sind die Landgerichte ohne Rücksicht auf\nden Streitwert ausschließlich zuständig."},{"nr":"2","text":"Die Landesregierungen werden ermächtigt, durch Rechtsverordnung\ndie Kennzeichenstreitsachen insgesamt oder teilweise für die Bezirke\nmehrerer Landgerichte einem von ihnen zuzuweisen, sofern dies der\nsachlichen Förderung oder schnelleren Erledigung der Verfahren dient.\nDie Landesregierungen können diese Ermächtigung auf die\nLandesjustizverwaltungen übertragen. Die Länder können außerdem durch\nVereinbarung den Gerichten eines Landes obliegende Aufgaben insgesamt\noder teilweise dem zuständigen Gericht eines anderen Landes\nübertragen."},{"nr":"3","text":"Zur Sicherung der in diesem Gesetz bezeichneten Ansprüche auf\nUnterlassung können einstweilige Verfügungen auch ohne die Darlegung\nund Glaubhaftmachung der in den §§ 935 und 940 der Zivilprozessordnung\nbezeichneten Voraussetzungen erlassen werden."},{"nr":"4","text":"Von den Kosten, die durch die Mitwirkung eines Patentanwalts in\neiner Kennzeichenstreitsache entstehen, sind die Gebühren nach § 13\ndes Rechtsanwaltsvergütungsgesetzes und außerdem die notwendigen\nAuslagen des Patentanwalts zu erstatten."}],"url":"https://www.gesetze-im-internet.de/markeng/__140.html"},{"id":"norm:§141","type":"norm","label":"§ 141 MarkenG","titel":"Gerichtsstand bei Ansprüchen nach diesem Gesetz und dem Gesetz gegen den unlauteren Wettbewerb","nummer":"141","teil":"Teil 8 - Verfahren in Kennzeichenstreitsachen","abschnitt":null,"absaetze":[{"nr":null,"text":"Ansprüche, welche die in diesem Gesetz geregelten Rechtsverhältnisse\nbetreffen und auf Vorschriften des Gesetzes gegen den unlauteren\nWettbewerb gegründet werden, brauchen nicht im Gerichtsstand des § 14\ndes Gesetzes gegen den unlauteren Wettbewerb geltend gemacht zu\nwerden."}],"url":"https://www.gesetze-im-internet.de/markeng/__141.html"},{"id":"norm:§142","type":"norm","label":"§ 142 MarkenG","titel":"Streitwertbegünstigung","nummer":"142","teil":"Teil 8 - Verfahren in Kennzeichenstreitsachen","abschnitt":null,"absaetze":[{"nr":"1","text":"Macht in bürgerlichen Rechtsstreitigkeiten, in denen durch Klage\nein Anspruch aus einem der in diesem Gesetz geregelten\nRechtsverhältnisse geltend gemacht wird, eine Partei glaubhaft, daß\ndie Belastung mit den Prozeßkosten nach dem vollen Streitwert ihre\nwirtschaftliche Lage erheblich gefährden würde, so kann das Gericht\nauf ihren Antrag anordnen, daß die Verpflichtung dieser Partei zur\nZahlung von Gerichtskosten sich nach einem ihrer Wirtschaftslage\nangepaßten Teil des Streitwerts bemißt."},{"nr":"2","text":"Die Anordnung nach Absatz 1 hat zur Folge, daß die begünstigte\nPartei die Gebühren ihres Rechtsanwalts ebenfalls nur nach diesem Teil\ndes Streitwerts zu entrichten hat. Soweit ihr Kosten des Rechtsstreits\nauferlegt werden oder soweit sie diese übernimmt, hat sie die von dem\nGegner entrichteten Gerichtsgebühren und die Gebühren seines\nRechtsanwalts nur nach dem Teil des Streitwerts zu erstatten. Soweit\ndie außergerichtlichen Kosten dem Gegner auferlegt oder von ihm\nübernommen werden, kann der Rechtsanwalt der begünstigten Partei seine\nGebühren von dem Gegner nach dem für diesen geltenden Streitwert\nbeitreiben."},{"nr":"3","text":"Der Antrag nach Absatz 1 kann vor der Geschäftsstelle des Gerichts\nzur Niederschrift erklärt werden. Er ist vor der Verhandlung zur\nHauptsache zu stellen. Danach ist er nur zulässig, wenn der\nangenommene oder festgesetzte Streitwert später durch das Gericht\nheraufgesetzt wird. Vor der Entscheidung über den Antrag ist der\nGegner zu hören."}],"url":"https://www.gesetze-im-internet.de/markeng/__142.html"},{"id":"norm:§143","type":"norm","label":"§ 143 MarkenG","titel":"Strafbare Kennzeichenverletzung","nummer":"143","teil":"Teil 9 - Straf- und Bußgeldvorschriften, Beschlagnahme bei der Einfuhr und Ausfuhr","abschnitt":"Abschnitt 1 - Straf- und Bußgeldvorschriften","absaetze":[{"nr":"1","text":"Wer im geschäftlichen Verkehr widerrechtlich\n\n1. entgegen § 14 Abs. 2 Satz 1 Nr. 1 oder 2 ein Zeichen benutzt,\n\n2. entgegen § 14 Abs. 2 Satz 1 Nr. 3 ein Zeichen in der Absicht benutzt,\n die Unterscheidungskraft oder die Wertschätzung einer bekannten Marke\n auszunutzen oder zu beeinträchtigen,\n\n3. entgegen § 14 Abs. 4 Nr. 1 ein Zeichen anbringt oder entgegen § 14\n Abs. 4 Nr. 2 oder 3 eine Aufmachung oder Verpackung oder ein\n Kennzeichnungsmittel anbietet, in den Verkehr bringt, besitzt,\n einführt oder ausführt, soweit Dritten die Benutzung des Zeichens\n\n a) nach § 14 Abs. 2 Satz 1 Nr. 1 oder 2 untersagt wäre oder\n\n b) nach § 14 Abs. 2 Satz 1 Nr. 3 untersagt wäre und die Handlung in der\n Absicht vorgenommen wird, die Ausnutzung oder Beeinträchtigung der\n Unterscheidungskraft oder der Wertschätzung einer bekannten Marke zu\n ermöglichen,\n\n4. entgegen § 15 Abs. 2 eine Bezeichnung oder ein Zeichen benutzt oder\n\n5. entgegen § 15 Abs. 3 eine Bezeichnung oder ein Zeichen in der Absicht\n benutzt, die Unterscheidungskraft oder die Wertschätzung einer\n bekannten geschäftlichen Bezeichnung auszunutzen oder zu\n beeinträchtigen,\n\nwird mit Freiheitsstrafe bis zu drei Jahren oder mit Geldstrafe\nbestraft."},{"nr":"1a","text":"(weggefallen)"},{"nr":"2","text":"Handelt der Täter in den Fällen des Absatzes 1 gewerbsmäßig oder\nals Mitglied einer Bande, die sich zur fortgesetzten Begehung solcher\nTaten verbunden hat, so ist die Strafe Freiheitsstrafe von drei\nMonaten bis zu fünf Jahren."},{"nr":"3","text":"Der Versuch ist strafbar."},{"nr":"4","text":"In den Fällen des Absatzes 1 wird die Tat nur auf Antrag verfolgt,\nes sei denn, daß die Strafverfolgungsbehörde wegen des besonderen\nöffentlichen Interesses an der Strafverfolgung ein Einschreiten von\nAmts wegen für geboten hält."},{"nr":"5","text":"Gegenstände, auf die sich die Straftat bezieht, können eingezogen\nwerden. § 74a des Strafgesetzbuchs ist anzuwenden. Soweit den in § 18\nbezeichneten Ansprüchen auf Vernichtung im Verfahren nach den\nVorschriften der Strafprozeßordnung über die Entschädigung des\nVerletzten (§§ 403 bis 406c der Strafprozeßordnung) stattgegeben wird,\nsind die Vorschriften über die Einziehung (§§ 74 bis 74f des\nStrafgesetzbuches) nicht anzuwenden."},{"nr":"6","text":"Wird auf Strafe erkannt, so ist, wenn der Verletzte es beantragt\nund ein berechtigtes Interesse daran dartut, anzuordnen, daß die\nVerurteilung auf Verlangen öffentlich bekanntgemacht wird. Die Art der\nBekanntmachung ist im Urteil zu bestimmen."},{"nr":"7","text":"(weggefallen)"}],"url":"https://www.gesetze-im-internet.de/markeng/__143.html"},{"id":"norm:§143a","type":"norm","label":"§ 143a MarkenG","titel":"Strafbare Verletzung der Unionsmarke","nummer":"143a","teil":"Teil 9 - Straf- und Bußgeldvorschriften, Beschlagnahme bei der Einfuhr und Ausfuhr","abschnitt":"Abschnitt 1 - Straf- und Bußgeldvorschriften","absaetze":[{"nr":"1","text":"Wer die Rechte des Inhabers einer Unionsmarke nach Artikel 9\nAbsatz 1 der Unionsmarkenverordnung verletzt, indem er trotz eines\nVerbotes und ohne Zustimmung des Markeninhabers im geschäftlichen\nVerkehr\n\n1. ein mit der Unionsmarke identisches Zeichen für Waren oder\n Dienstleistungen benutzt, die mit denjenigen identisch sind, für die\n sie eingetragen ist,\n\n2. ein Zeichen benutzt, wenn wegen der Identität oder Ähnlichkeit des\n Zeichens mit der Unionsmarke und der Identität oder Ähnlichkeit der\n durch die Unionsmarke und das Zeichen erfassten Waren oder\n Dienstleistungen für das Publikum die Gefahr von Verwechslungen\n besteht, einschließlich der Gefahr, dass das Zeichen mit der Marke\n gedanklich in Verbindung gebracht wird, oder\n\n3. ein mit der Unionsmarke identisches Zeichen oder ein ähnliches Zeichen\n für Waren oder Dienstleistungen benutzt, die nicht denen ähnlich sind,\n für die die Unionsmarke eingetragen ist, wenn diese in der\n Gemeinschaft bekannt ist und das Zeichen in der Absicht benutzt wird,\n die Unterscheidungskraft oder die Wertschätzung der Unionsmarke ohne\n rechtfertigenden Grund in unlauterer Weise auszunutzen oder zu\n beeinträchtigen,\n\nwird mit Freiheitsstrafe bis zu drei Jahren oder mit Geldstrafe\nbestraft."},{"nr":"2","text":"§ 143 Abs. 2 bis 6 gilt entsprechend."}],"url":"https://www.gesetze-im-internet.de/markeng/__143a.html"},{"id":"norm:§144","type":"norm","label":"§ 144 MarkenG","titel":"Strafbare Benutzung geographischer Herkunftsangaben","nummer":"144","teil":"Teil 9 - Straf- und Bußgeldvorschriften, Beschlagnahme bei der Einfuhr und Ausfuhr","abschnitt":"Abschnitt 1 - Straf- und Bußgeldvorschriften","absaetze":[{"nr":"1","text":"Wer im geschäftlichen Verkehr widerrechtlich eine geographische\nHerkunftsangabe, einen Namen, eine Angabe oder ein Zeichen\n\n1. entgegen § 127 Abs. 1 oder 2, jeweils auch in Verbindung mit Abs. 4\n oder einer Rechtsverordnung nach § 137 Abs. 1, benutzt oder\n\n2. entgegen § 127 Abs. 3, auch in Verbindung mit Abs. 4, oder einer\n Rechtsverordnung nach § 137 Abs. 1, in der Absicht benutzt, den Ruf\n oder die Unterscheidungskraft einer geographischen Herkunftsangabe\n auszunutzen oder zu beeinträchtigen,\n\nwird mit Freiheitsstrafe bis zu zwei Jahren oder mit Geldstrafe\nbestraft."},{"nr":"2","text":"Ebenso wird bestraft, wer entgegen Artikel 13 Absatz 1 Buchstabe a\noder b der Verordnung (EU) Nr. 1151/2012 des Europäischen Parlaments\nund des Rates vom 21. November 2012 über Qualitätsregelungen für\nAgrarerzeugnisse und Lebensmittel (ABl. L 343 vom 14.12.2012, S. 1) im\ngeschäftlichen Verkehr\n\n1. einen eingetragenen Namen für ein dort genanntes Erzeugnis verwendet\n oder\n\n2. sich einen eingetragenen Namen aneignet oder ihn nachahmt."},{"nr":"3","text":"Der Versuch ist strafbar."},{"nr":"4","text":"Bei einer Verurteilung bestimmt das Gericht, daß die\nwiderrechtliche Kennzeichnung der im Besitz des Verurteilten\nbefindlichen Gegenstände beseitigt wird oder, wenn dies nicht möglich\nist, die Gegenstände vernichtet werden."},{"nr":"5","text":"Wird auf Strafe erkannt, so ist, wenn das öffentliche Interesse\ndies erfordert, anzuordnen, daß die Verurteilung öffentlich\nbekanntgemacht wird. Die Art der Bekanntmachung ist im Urteil zu\nbestimmen."},{"nr":"6","text":"(weggefallen)"}],"url":"https://www.gesetze-im-internet.de/markeng/__144.html"},{"id":"norm:§145","type":"norm","label":"§ 145 MarkenG","titel":"Bußgeldvorschriften","nummer":"145","teil":"Teil 9 - Straf- und Bußgeldvorschriften, Beschlagnahme bei der Einfuhr und Ausfuhr","abschnitt":"Abschnitt 1 - Straf- und Bußgeldvorschriften","absaetze":[{"nr":"1","text":"Ordnungswidrig handelt, wer im geschäftlichen Verkehr\nwiderrechtlich in identischer oder nachgeahmter Form\n\n1. ein Wappen, eine Flagge oder ein anderes staatliches Hoheitszeichen\n oder ein Wappen eines inländischen Ortes oder eines inländischen\n Gemeinde- oder weiteren Kommunalverbandes im Sinne des § 8 Abs. 2 Nr.\n 6,\n\n2. ein amtliches Prüf- oder Gewährzeichen im Sinne des § 8 Abs. 2 Nr. 7\n oder\n\n3. ein Kennzeichen, ein Siegel oder eine Bezeichnung im Sinne des § 8\n Abs. 2 Nr. 8\n\nzur Kennzeichnung von Waren oder Dienstleistungen benutzt."},{"nr":"2","text":"Ordnungswidrig handelt, wer vorsätzlich oder fahrlässig\n\n1. entgegen § 134 Abs. 3, auch in Verbindung mit Abs. 4,\n\n a) das Betreten von Geschäftsräumen, Grundstücken, Verkaufseinrichtungen\n oder Transportmitteln oder deren Besichtigung nicht gestattet,\n\n b) die zu besichtigenden Agrarerzeugnisse oder Lebensmittel nicht so\n darlegt, daß die Besichtigung ordnungsgemäß vorgenommen werden kann,\n\n c) die erforderliche Hilfe bei der Besichtigung nicht leistet,\n\n d) Proben nicht entnehmen läßt,\n\n e) geschäftliche Unterlagen nicht oder nicht vollständig vorlegt oder\n nicht prüfen läßt oder\n\n f) eine Auskunft nicht, nicht richtig oder nicht vollständig erteilt oder\n\n2. einer nach § 139 Abs. 1 erlassenen Rechtsverordnung zuwiderhandelt,\n soweit sie für einen bestimmten Tatbestand auf diese Bußgeldvorschrift\n verweist."},{"nr":"3","text":"Die Ordnungswidrigkeit kann in den Fällen des Absatzes 1 mit einer\nGeldbuße bis zu zweitausendfünfhundert Euro und in den Fällen des\nAbsatzes 2 mit einer Geldbuße bis zu zehntausend Euro geahndet werden."},{"nr":"4","text":"In den Fällen des Absatzes 1 ist § 144 Abs. 4 entsprechend\nanzuwenden."},{"nr":"5","text":"Verwaltungsbehörde im Sinn des § 36 Abs. 1 Nr. 1 des Gesetzes über\nOrdnungswidrigkeiten ist in den Fällen des Absatzes 1 das Bundesamt\nfür Justiz."}],"url":"https://www.gesetze-im-internet.de/markeng/__145.html"},{"id":"norm:§146","type":"norm","label":"§ 146 MarkenG","titel":"Beschlagnahme bei der Verletzung von Kennzeichenrechten","nummer":"146","teil":"Teil 9 - Straf- und Bußgeldvorschriften, Beschlagnahme bei der Einfuhr und Ausfuhr","abschnitt":"Abschnitt 2 - Beschlagnahme von Waren bei der Einfuhr und Ausfuhr","absaetze":[{"nr":"1","text":"Waren, die widerrechtlich mit einer nach diesem Gesetz geschützten\nMarke oder geschäftlichen Bezeichnung versehen sind, unterliegen,\nsoweit nicht die Verordnung (EU) Nr. 608/2013 des Europäischen\nParlaments und des Rates vom 12. Juni 2013 zur Durchsetzung der Rechte\ngeistigen Eigentums durch die Zollbehörden und zur Aufhebung der\nVerordnung (EG) Nr. 1383/2003 des Rates (ABl. L 181 vom 29.6.2013, S.\n15), in ihrer jeweils geltenden Fassung anzuwenden ist, auf Antrag und\ngegen Sicherheitsleistung des Rechtsinhabers bei ihrer Einfuhr oder\nAusfuhr der Beschlagnahme durch die Zollbehörde, sofern die\nRechtsverletzung offensichtlich ist. Dies gilt für den Verkehr mit\nanderen Mitgliedstaaten der Europäischen Union sowie mit den anderen\nVertragsstaaten des Abkommens über den Europäischen Wirtschaftsraum\nnur, soweit Kontrollen durch die Zollbehörden stattfinden."},{"nr":"2","text":"Ordnet die Zollbehörde die Beschlagnahme an, unterrichtet sie\nunverzüglich den Verfügungsberechtigten sowie den Antragsteller. Dem\nAntragsteller sind Herkunft, Menge und Lagerort der Waren sowie Name\nund Anschrift des Verfügungsberechtigten mitzuteilen. Das Brief- und\nPostgeheimnis (Artikel 10 des Grundgesetzes) wird insoweit\neingeschränkt. Dem Antragsteller wird Gelegenheit gegeben, die Waren\nzu besichtigen, soweit hierdurch nicht in Geschäfts- oder\nBetriebsgeheimnisse eingegriffen wird."}],"url":"https://www.gesetze-im-internet.de/markeng/__146.html"},{"id":"norm:§147","type":"norm","label":"§ 147 MarkenG","titel":"Einziehung, Widerspruch, Aufhebung der Beschlagnahme","nummer":"147","teil":"Teil 9 - Straf- und Bußgeldvorschriften, Beschlagnahme bei der Einfuhr und Ausfuhr","abschnitt":"Abschnitt 2 - Beschlagnahme von Waren bei der Einfuhr und Ausfuhr","absaetze":[{"nr":"1","text":"Wird der Beschlagnahme nicht spätestens nach Ablauf von zwei\nWochen nach Zustellung der Mitteilung nach § 146 Abs. 2 Satz 1\nwidersprochen, ordnet die Zollbehörde die Einziehung der\nbeschlagnahmten Waren an."},{"nr":"2","text":"Widerspricht der Verfügungsberechtigte der Beschlagnahme,\nunterrichtet die Zollbehörde hiervon unverzüglich den Antragsteller.\nDieser hat gegenüber der Zollbehörde unverzüglich zu erklären, ob er\nden Antrag nach § 146 Abs. 1 in bezug auf die beschlagnahmten Waren\naufrechterhält."},{"nr":"3","text":"Nimmt der Antragsteller den Antrag zurück, hebt die Zollbehörde\ndie Beschlagnahme unverzüglich auf. Hält der Antragsteller den Antrag\naufrecht und legt er eine vollziehbare gerichtliche Entscheidung vor,\ndie die Verwahrung der beschlagnahmten Waren oder eine\nVerfügungsbeschränkung anordnet, trifft die Zollbehörde die\nerforderlichen Maßnahmen."},{"nr":"4","text":"Liegen die Fälle des Absatzes 3 nicht vor, hebt die Zollbehörde\ndie Beschlagnahme nach Ablauf von zwei Wochen nach Zustellung der\nMitteilung an den Antragsteller nach Absatz 2 auf. Weist der\nAntragsteller nach, daß die gerichtliche Entscheidung nach Absatz 3\nSatz 2 beantragt, ihm aber noch nicht zugegangen ist, wird die\nBeschlagnahme für längstens zwei weitere Wochen aufrechterhalten."}],"url":"https://www.gesetze-im-internet.de/markeng/__147.html"},{"id":"norm:§148","type":"norm","label":"§ 148 MarkenG","titel":"Zuständigkeiten, Rechtsmittel","nummer":"148","teil":"Teil 9 - Straf- und Bußgeldvorschriften, Beschlagnahme bei der Einfuhr und Ausfuhr","abschnitt":"Abschnitt 2 - Beschlagnahme von Waren bei der Einfuhr und Ausfuhr","absaetze":[{"nr":"1","text":"Der Antrag nach § 146 Abs. 1 ist bei der Generalzolldirektion zu\nstellen und hat Wirkung für ein Jahr, sofern keine kürzere\nGeltungsdauer beantragt wird. Der Antrag kann wiederholt werden."},{"nr":"2","text":"Für die mit dem Antrag verbundenen Amtshandlungen werden vom\nAntragsteller Kosten nach Maßgabe des § 178 der Abgabenordnung\nerhoben."},{"nr":"3","text":"Die Beschlagnahme und die Einziehung können mit den Rechtsmitteln\nangefochten werden, die im Bußgeldverfahren nach dem Gesetz über\nOrdnungswidrigkeiten gegen die Beschlagnahme und Einziehung zulässig\nsind. Im Rechtsmittelverfahren ist der Antragsteller zu hören. Gegen\ndie Entscheidung des Amtsgerichts ist die sofortige Beschwerde\nzulässig. Über die sofortige Beschwerde entscheidet das\nOberlandesgericht."}],"url":"https://www.gesetze-im-internet.de/markeng/__148.html"},{"id":"norm:§149","type":"norm","label":"§ 149 MarkenG","titel":"Schadensersatz bei ungerechtfertigter Beschlagnahme","nummer":"149","teil":"Teil 9 - Straf- und Bußgeldvorschriften, Beschlagnahme bei der Einfuhr und Ausfuhr","abschnitt":"Abschnitt 2 - Beschlagnahme von Waren bei der Einfuhr und Ausfuhr","absaetze":[{"nr":null,"text":"Erweist sich die Beschlagnahme als von Anfang an ungerechtfertigt und\nhat der Antragsteller den Antrag nach § 146 Abs. 1 in bezug auf die\nbeschlagnahmten Waren aufrechterhalten oder sich nicht unverzüglich\nerklärt (§ 147 Abs. 2 Satz 2), so ist er verpflichtet, den dem\nVerfügungsberechtigten durch die Beschlagnahme entstandenen Schaden zu\nersetzen."}],"url":"https://www.gesetze-im-internet.de/markeng/__149.html"},{"id":"norm:§150","type":"norm","label":"§ 150 MarkenG","titel":"Verfahren nach der Verordnung (EU) Nr. 608/2013","nummer":"150","teil":"Teil 9 - Straf- und Bußgeldvorschriften, Beschlagnahme bei der Einfuhr und Ausfuhr","abschnitt":"Abschnitt 2 - Beschlagnahme von Waren bei der Einfuhr und Ausfuhr","absaetze":[{"nr":null,"text":"Für das Verfahren nach der Verordnung (EU) Nr. 608/2013 gelten § 148\nAbsatz 1 und 2 sowie § 149 entsprechend, soweit die Verordnung keine\nBestimmungen enthält, die dem entgegenstehen."}],"url":"https://www.gesetze-im-internet.de/markeng/__150.html"},{"id":"norm:§151","type":"norm","label":"§ 151 MarkenG","titel":"Verfahren nach deutschem Recht bei geographischen Herkunftsangaben","nummer":"151","teil":"Teil 9 - Straf- und Bußgeldvorschriften, Beschlagnahme bei der Einfuhr und Ausfuhr","abschnitt":"Abschnitt 2 - Beschlagnahme von Waren bei der Einfuhr und Ausfuhr","absaetze":[{"nr":"1","text":"Waren, die widerrechtlich mit einer nach diesem Gesetz oder nach\nRechtsvorschriften der Europäischen Union geschützten geographischen\nHerkunftsangabe versehen sind, unterliegen, soweit nicht die\nVerordnung (EU) Nr. 608/2013 anzuwenden ist, bei ihrer Einfuhr,\nAusfuhr oder Durchfuhr der Beschlagnahme zum Zwecke der Beseitigung\nder widerrechtlichen Kennzeichnung, sofern die Rechtsverletzung\noffensichtlich ist. Dies gilt für den Verkehr mit anderen\nMitgliedstaaten der Europäischen Union sowie mit den anderen\nVertragsstaaten des Abkommens über den Europäischen Wirtschaftsraum\nnur, soweit Kontrollen durch die Zollbehörden stattfinden."},{"nr":"2","text":"Die Beschlagnahme wird durch die Zollbehörde vorgenommen. Die\nZollbehörde ordnet auch die zur Beseitigung der widerrechtlichen\nKennzeichnung erforderlichen Maßnahmen an."},{"nr":"3","text":"Wird den Anordnungen der Zollbehörde nicht entsprochen oder ist\ndie Beseitigung untunlich, ordnet die Zollbehörde die Einziehung der\nWaren an."},{"nr":"4","text":"Die Beschlagnahme und die Einziehung können mit den Rechtsmitteln\nangefochten werden, die im Bußgeldverfahren nach dem Gesetz über\nOrdnungswidrigkeiten gegen die Beschlagnahme und Einziehung zulässig\nsind. Gegen die Entscheidung des Amtsgerichts ist die sofortige\nBeschwerde zulässig. Über die sofortige Beschwerde entscheidet das\nOberlandesgericht."}],"url":"https://www.gesetze-im-internet.de/markeng/__151.html"},{"id":"norm:§152","type":"norm","label":"§ 152 MarkenG","titel":"Anwendung dieses Gesetzes","nummer":"152","teil":"Teil 10 - Übergangsvorschriften","abschnitt":null,"absaetze":[{"nr":null,"text":"Die Vorschriften dieses Gesetzes finden, soweit nachfolgend nichts\nanderes bestimmt ist, auch auf Marken, die vor dem 1. Januar 1995\nangemeldet oder eingetragen oder durch Benutzung im geschäftlichen\nVerkehr oder durch notorische Bekanntheit erworben worden sind, und\nauf geschäftliche Bezeichnungen Anwendung, die vor dem 1. Januar 1995\nnach den bis dahin geltenden Vorschriften geschützt waren."}],"url":"https://www.gesetze-im-internet.de/markeng/__152.html"},{"id":"norm:§153","type":"norm","label":"§ 153 MarkenG","titel":"Schranken für die Geltendmachung von Verletzungsansprüchen","nummer":"153","teil":"Teil 10 - Übergangsvorschriften","abschnitt":null,"absaetze":[{"nr":"1","text":"Standen dem Inhaber einer vor dem 1. Januar 1995 eingetragenen\noder durch Benutzung oder notorische Bekanntheit erworbenen Marke oder\neiner geschäftlichen Bezeichnung nach den bis dahin geltenden\nVorschriften gegen die Benutzung der Marke, der geschäftlichen\nBezeichnung oder eines übereinstimmenden Zeichens keine Ansprüche\nwegen Verletzung zu, so können die Rechte aus der Marke oder aus der\ngeschäftlichen Bezeichnung nach diesem Gesetz nicht gegen die\nWeiterbenutzung dieser Marke, dieser geschäftlichen Bezeichnung oder\ndieses Zeichens geltend gemacht werden."},{"nr":"2","text":"Auf Ansprüche des Inhabers einer vor dem 1. Januar 1995\neingetragenen oder durch Benutzung oder notorische Bekanntheit\nerworbenen Marke oder einer geschäftlichen Bezeichnung ist § 21 mit\nder Maßgabe anzuwenden, daß die in § 21 Abs. 1 und 2 vorgesehene Frist\nvon fünf Jahren mit dem 1. Januar 1995 zu laufen beginnt."}],"url":"https://www.gesetze-im-internet.de/markeng/__153.html"},{"id":"norm:§154","type":"norm","label":"§ 154 MarkenG","titel":"Dingliche Rechte, Zwangsvollstreckung, Konkursverfahren","nummer":"154","teil":"Teil 10 - Übergangsvorschriften","abschnitt":null,"absaetze":[{"nr":"1","text":"Ist vor dem 1. Januar 1995 an dem durch die Anmeldung oder\nEintragung einer Marke begründeten Recht ein dingliches Recht\nbegründet worden oder war das durch die Anmeldung oder Eintragung\nbegründete Recht Gegenstand von Maßnahmen der Zwangsvollstreckung, so\nkönnen diese Rechte oder Maßnahmen nach § 29 Abs. 2 in das Register\neingetragen werden."},{"nr":"2","text":"Absatz 1 ist entsprechend anzuwenden, wenn das durch die Anmeldung\noder Eintragung einer Marke begründete Recht durch ein\nKonkursverfahren erfaßt worden ist."}],"url":"https://www.gesetze-im-internet.de/markeng/__154.html"},{"id":"norm:§155","type":"norm","label":"§ 155 MarkenG","titel":"Lizenzen","nummer":"155","teil":"Teil 10 - Übergangsvorschriften","abschnitt":null,"absaetze":[{"nr":null,"text":"Auf vor dem 1. Januar 1995 an dem durch die Anmeldung oder Eintragung,\ndurch die Benutzung oder durch die notorische Bekanntheit einer Marke\nbegründeten Recht erteilte Lizenzen ist § 30 mit der Maßgabe\nanzuwenden, daß diesen Lizenzen die Wirkung des § 30 Abs. 5 nur\ninsoweit zugute kommt, als es sich um nach dem 1. Januar 1995\neingetretene Rechtsübergänge oder an Dritte erteilte Lizenzen handelt."}],"url":"https://www.gesetze-im-internet.de/markeng/__155.html"},{"id":"norm:§156","type":"norm","label":"§ 156 MarkenG","titel":"Löschung einer eingetragenen Marke wegen absoluter Schutzhindernisse","nummer":"156","teil":"Teil 10 - Übergangsvorschriften","abschnitt":null,"absaetze":[{"nr":null,"text":"Ist vor dem 1. Januar 1995 ein Verfahren von Amts wegen zur Löschung\nder Eintragung einer Marke wegen des Bestehens absoluter\nSchutzhindernisse nach § 10 Absatz 2 Nummer 2 des Warenzeichengesetzes\neingeleitet worden oder ist vor diesem Zeitpunkt ein Antrag auf\nLöschung nach dieser Vorschrift gestellt worden, so wird die\nEintragung nur gelöscht, wenn die Marke sowohl nach den bis dahin\ngeltenden Vorschriften als auch nach den Vorschriften dieses Gesetzes\nnicht schutzfähig ist. Dies gilt auch dann, wenn nach dem 1. Januar\n1995 ein Verfahren nach § 54 zur Löschung der Eintragung einer Marke\neingeleitet wird, die vor dem 1. Januar 1995 eingetragen worden ist."}],"url":"https://www.gesetze-im-internet.de/markeng/__156.html"},{"id":"norm:§157","type":"norm","label":"§ 157 MarkenG","titel":"Löschung einer eingetragenen Marke wegen des Bestehens älterer Rechte","nummer":"157","teil":"Teil 10 - Übergangsvorschriften","abschnitt":null,"absaetze":[{"nr":"1","text":"Ist vor dem 1. Januar 1995 eine Klage auf Löschung der Eintragung\neiner Marke aufgrund einer früher angemeldeten Marke nach § 11 Abs. 1\nNr. 1 des Warenzeichengesetzes oder aufgrund eines sonstigen älteren\nRechts erhoben worden, so wird, soweit in Absatz 2 nichts anderes\nbestimmt ist, die Eintragung nur gelöscht, wenn der Klage sowohl nach\nden bis dahin geltenden Vorschriften als auch nach den Vorschriften\ndieses Gesetzes stattzugeben ist. Dies gilt auch dann, wenn nach dem\n1\\. Januar 1995 eine Klage nach § 55 auf Löschung der Eintragung einer\nMarke erhoben worden ist oder nach dem 1. Mai 2020 ein Antrag nach §\n53 auf Erklärung des Verfalls und der Nichtigkeit einer Marke gestellt\nwird, die vor dem 1. Januar 1995 eingetragen worden ist."},{"nr":"2","text":"In den Fällen des Absatzes 1 Satz 1 ist § 51 Abs. 2 Satz 1 und 2\nnicht anzuwenden. In den Fällen des Absatzes 1 Satz 2 ist § 51 Abs. 2\nSatz 1 und 2 mit der Maßgabe anzuwenden, daß die Frist von fünf Jahren\nmit dem 1. Januar 1995 zu laufen beginnt."}],"url":"https://www.gesetze-im-internet.de/markeng/__157.html"},{"id":"norm:§158","type":"norm","label":"§ 158 MarkenG","titel":"Übergangsvorschriften","nummer":"158","teil":"Teil 10 - Übergangsvorschriften","abschnitt":null,"absaetze":[{"nr":"1","text":"Artikel 229 § 6 des Einführungsgesetzes zum Bürgerlichen\nGesetzbuche findet mit der Maßgabe entsprechende Anwendung, dass § 20\nin der bis zum 1. Januar 2002 geltenden Fassung den Vorschriften des\nBürgerlichen Gesetzbuchs über die Verjährung in der bis zum 1. Januar\n2002 geltenden Fassung gleichgestellt ist."},{"nr":"2","text":"Ist die Anmeldung vor dem 1. Oktober 2009 eingereicht worden, ist\nfür den gegen die Eintragung erhobenen Widerspruch § 42 Absatz 1 und 2\nin der bis zum 1. Oktober 2009 geltenden Fassung anzuwenden."},{"nr":"3","text":"Ist die Anmeldung zwischen dem 1. Oktober 2009 und dem 14. Januar\n2019 eingereicht worden, ist für den gegen die Eintragung erhobenen\nWiderspruch § 42 Absatz 1 und 2 in der bis zum 14. Januar 2019\ngeltenden Fassung anzuwenden."},{"nr":"4","text":"Ist der Widerspruch vor dem 14. Januar 2019 erhoben worden, findet\n§ 42 Absatz 3 und 4 keine Anwendung."},{"nr":"5","text":"Ist in einem Verfahren über einen Widerspruch, der vor dem 14.\nJanuar 2019 erhoben worden ist, die Benutzung der Marke, wegen der\nWiderspruch erhoben worden ist, bestritten worden oder wird die\nBenutzung in einem solchen Widerspruchsverfahren bestritten, so sind\ndie §§ 26 und 43 Absatz 1 in ihrer bis dahin geltenden Fassung weiter\nanzuwenden."},{"nr":"6","text":"Ist der Antrag auf Löschung einer eingetragenen Marke wegen\nVerfalls gemäß § 49 vor dem 14. Januar 2019 gestellt oder die\nLöschungsklage wegen Verfalls oder aufgrund älterer Rechte gemäß § 51\nvor diesem Zeitpunkt erhoben worden, so sind § 49 Absatz 1, § 51\nAbsatz 4 Nummer 1, § 55 Absatz 3 und § 26 in ihrer bis dahin geltenden\nFassung weiter anzuwenden."},{"nr":"7","text":"§ 8 Absatz 2 Nummer 9 bis 12 gilt nicht für Marken, die vor dem\n14\\. Januar 2019 beim Deutschen Patent- und Markenamt angemeldet worden\nsind."},{"nr":"8","text":"§ 50 Absatz 2 Satz 1 gilt nur für Anträge gemäß § 50 Absatz 1, die\nnach dem 14. Januar 2019 erhoben worden sind. Ist der Antrag gemäß §\n50 Absatz 1 vor dem 14. Januar 2019 gestellt worden, so ist § 50\nAbsatz 2 in seiner bisher geltenden Fassung anzuwenden."},{"nr":"9","text":"Für Erinnerungen und Beschwerden, die vor dem 1. Oktober 2009\neingelegt worden sind, gelten die §§ 64 und 66 in der bis zum 1.\nOktober 2009 geltenden Fassung. Für mehrseitige Verfahren, bei denen\nvon einem Beteiligten Erinnerung und von einem anderen Beteiligten\nBeschwerde eingelegt worden ist, ist für die Anwendbarkeit der\ngenannten Vorschriften der Tag der Einlegung der Beschwerde maßgebend."},{"nr":"10","text":"§ 102 Absatz 4 gilt nicht für Kollektivmarken, die vor dem 14.\nJanuar 2019 eingetragen worden sind."}],"url":"https://www.gesetze-im-internet.de/markeng/__158.html"},{"id":"norm:§159","type":"norm","label":"§ 159 MarkenG","titel":"Schutzdauer und Verlängerung","nummer":"159","teil":"Teil 10 - Übergangsvorschriften","abschnitt":null,"absaetze":[{"nr":"1","text":"Die Vorschriften dieses Gesetzes über die Schutzdauer und ihre\nVerlängerung (§ 47) sind auf vor dem 14. Januar 2019 eingetragene\nMarken mit der Maßgabe anzuwenden, dass für die Berechnung der Frist,\nnach der die Schutzdauer endet, § 47 Absatz 1 in seiner bis dahin\ngeltenden Fassung weiter anzuwenden ist."},{"nr":"2","text":"Für eingetragene Marken, deren Schutzdauer gemäß § 47 Absatz 1\nspätestens zwölf Monate nach dem 31. Januar 2019 endet, sind die §§ 3,\n5 und 7 des Patentkostengesetzes vom 13. Dezember 2001 (BGBl. I S.\n3656), das zuletzt durch Artikel 13 des Gesetzes vom 4. April 2016\n(BGBl. I S. 558) geändert worden ist, in ihrer bis dahin geltenden\nFassung weiter anzuwenden.\n\n### (XXXX) §§ 160 bis 163 (weggefallen)"}],"url":"https://www.gesetze-im-internet.de/markeng/__159.html"},{"id":"norm:§164","type":"norm","label":"§ 164 MarkenG","titel":"(weggefallen)","nummer":"164","teil":"Teil 10 - Übergangsvorschriften","abschnitt":null,"absaetze":[{"nr":null,"text":"-"}],"url":"https://www.gesetze-im-internet.de/markeng/__164.html"},{"id":"eunorm:markenrl:1","type":"eunorm","label":"Art. 1 MarkenRL","titel":"Anwendungsbereich","nummer":"1","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 1 – Allgemeine Bestimmungen","abschnitt":null,"absaetze":[{"nr":"None","text":"Die Richtlinie gilt für alle Individual-, Garantie-, Gewährleistungs- und Kollektivmarken für Waren oder Dienstleistungen, die in einem Mitgliedstaat oder beim Benelux-Amt eingetragen oder angemeldet sind oder mit Wirkung für einen Mitgliedstaat international registriert wurden."}],"hinweis":"Nicht harmonisiert sind Benutzungsmarken (§ 4 Nr. 2 MarkenG) und geschäftliche Bezeichnungen (§ 5 MarkenG); insoweit bleibt das nationale Recht frei.","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:2","type":"eunorm","label":"Art. 2 MarkenRL","titel":"Begriffsbestimmungen","nummer":"2","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 1 – Allgemeine Bestimmungen","abschnitt":null,"absaetze":[{"nr":"a","text":"„Amt“ ist die für die Eintragung von Marken zuständige zentrale Behörde für den gewerblichen Rechtsschutz des Mitgliedstaats oder das Benelux-Amt für geistiges Eigentum."},{"nr":"b","text":"„Register“ ist das von einem Amt geführte Markenregister."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:3","type":"eunorm","label":"Art. 3 MarkenRL","titel":"Markenformen","nummer":"3","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 1 – Markenformen","absaetze":[{"nr":"None","text":"Marken können alle Zeichen sein, insbesondere Wörter einschließlich Personennamen, Abbildungen, Buchstaben, Zahlen, Farben, die Form der Ware oder ihrer Verpackung sowie Klänge, sofern sie (a) geeignet sind, Waren oder Dienstleistungen eines Unternehmens von denen anderer zu unterscheiden, und (b) im Register so dargestellt werden können, dass Behörden und Publikum den Schutzgegenstand klar und eindeutig bestimmen können."}],"hinweis":"Aufgabe des Erfordernisses der graphischen Darstellbarkeit (Sieckmann-Kriterien bleiben Maßstab). Umsetzung im MaMoG: § 8 Abs. 1 MarkenG neu gefasst; Klang-, Bewegungs-, Multimedia- und Hologrammmarken ausdrücklich zulässig.","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:4","type":"eunorm","label":"Art. 4 MarkenRL","titel":"Absolute Eintragungshindernisse oder Ungültigkeitsgründe","nummer":"4","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 2 – Eintragungshindernisse und Ungültigkeitsgründe","absaetze":[{"nr":"1","text":"Von der Eintragung ausgeschlossen bzw. für ungültig zu erklären sind: (a) nicht markenfähige Zeichen; (b) Marken ohne Unterscheidungskraft; (c) ausschließlich beschreibende Angaben (Art, Beschaffenheit, Menge, Bestimmung, Wert, geographische Herkunft, Zeit der Herstellung, sonstige Merkmale); (d) im allgemeinen Sprachgebrauch oder in redlichen Verkehrsgepflogenheiten üblich gewordene Zeichen; (e) Zeichen, die ausschließlich aus der Form oder einem anderen charakteristischen Merkmal bestehen, die durch die Art der Ware bedingt, zur Erreichung einer technischen Wirkung erforderlich sind oder der Ware einen wesentlichen Wert verleihen; (f) Verstoß gegen öffentliche Ordnung oder gute Sitten; (g) Täuschungseignung; (h) Hoheitszeichen nach Art. 6ter PVÜ ohne Genehmigung; (i) Ursprungsbezeichnungen und geographische Angaben; (j) traditionelle Weinbezeichnungen; (k) garantiert traditionelle Spezialitäten; (l) frühere Sortenbezeichnungen."},{"nr":"2","text":"Eine Marke ist für ungültig zu erklären, wenn der Anmelder bei der Anmeldung bösgläubig war; die Mitgliedstaaten können Bösgläubigkeit auch als Eintragungshindernis vorsehen."},{"nr":"3","text":"Fakultative Gründe der Mitgliedstaaten: Verbot der Benutzung nach anderem Recht; Zeichen von hoher symbolischer Bedeutung, insbesondere religiöse Symbole; Abzeichen, Embleme und Wappen jenseits von Art. 6ter PVÜ."},{"nr":"4","text":"Die Hindernisse nach Abs. 1 lit. b, c und d greifen nicht, wenn die Marke vor dem Anmeldetag infolge Benutzung Unterscheidungskraft erlangt hat; die Ungültigerklärung ist ausgeschlossen, wenn die Unterscheidungskraft vor dem Antrag erlangt wurde."},{"nr":"5","text":"Die Mitgliedstaaten können vorsehen, dass Abs. 4 auch gilt, wenn die Unterscheidungskraft erst nach dem Anmeldetag, aber vor der Eintragung erlangt wurde."}],"hinweis":"Neu gegenüber RL 2008/95: Formausschluss auch für „andere charakteristische Merkmale“ (§ 3 Abs. 2 MarkenG), Bösgläubigkeit als zwingender Ungültigkeitsgrund (§ 8 Abs. 2 Nr. 14 MarkenG), Schutz von Ursprungsbezeichnungen, Weinbezeichnungen, Spezialitäten und Sortenbezeichnungen (§ 8 Abs. 2 Nr. 9 bis 13 MarkenG).","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:5","type":"eunorm","label":"Art. 5 MarkenRL","titel":"Relative Eintragungshindernisse oder Ungültigkeitsgründe","nummer":"5","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 2 – Eintragungshindernisse und Ungültigkeitsgründe","absaetze":[{"nr":"1","text":"Ausgeschlossen oder ungültig ist eine Marke, (a) die mit einer älteren Marke identisch ist und für identische Waren angemeldet wurde, oder (b) wenn wegen Identität oder Ähnlichkeit mit der älteren Marke und der Waren für das Publikum Verwechslungsgefahr besteht, einschließlich der Gefahr gedanklicher Verbindung."},{"nr":"2","text":"„Ältere Marken“ sind: Unionsmarken, nationale und Benelux-Marken, international registrierte Marken mit Wirkung im Mitgliedstaat oder in der Union, jeweils mit früherem Anmeldetag (auch Priorität), Unionsmarken mit Seniorität, Anmeldungen solcher Marken vorbehaltlich ihrer Eintragung sowie notorisch bekannte Marken im Sinne des Art. 6bis PVÜ."},{"nr":"3","text":"Ferner ausgeschlossen oder ungültig: (a) Marken, die einer älteren, im Mitgliedstaat oder in der Union bekannten Marke identisch oder ähnlich sind, wenn die Benutzung deren Unterscheidungskraft oder Wertschätzung ohne rechtfertigenden Grund unlauter ausnutzen oder beeinträchtigen würde, und zwar unabhängig davon, ob die Waren identisch, ähnlich oder unähnlich sind; (b) Agentenmarken, die ein Agent oder Vertreter ohne Zustimmung des Inhabers auf eigenen Namen anmeldet; (c) Marken, die mit einer älteren Ursprungsbezeichnung oder geographischen Angabe kollidieren."},{"nr":"4","text":"Fakultative Gründe der Mitgliedstaaten: ältere Benutzungsmarken oder sonstige im Verkehr benutzte Kennzeichen, die ein Verbietungsrecht gewähren; sonstige ältere Rechte wie Name, Bildnis, Urheberrecht, gewerbliche Schutzrechte; Verwechslungsgefahr mit einer im Ausland benutzten Marke bei bösgläubiger Anmeldung."},{"nr":"5","text":"Keine Zurückweisung oder Ungültigerklärung, wenn der Inhaber des älteren Rechts der Eintragung zustimmt."},{"nr":"6","text":"Mitgliedstaaten können abweichend vorsehen, dass vor Inkrafttreten der Umsetzungsvorschriften der RL 89/104/EWG geltende Gründe weiter anwendbar sind."}],"hinweis":"Der Bekanntheitsschutz im Register ist jetzt zwingend und gilt ausdrücklich auch bei identischen und ähnlichen Waren; § 9 Abs. 1 Nr. 3 MarkenG wurde entsprechend geändert (Streichung von „nicht ähnlich“).","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:6","type":"eunorm","label":"Art. 6 MarkenRL","titel":"Nachträgliche Feststellung der Ungültigkeit oder des Verfalls einer Marke","nummer":"6","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 2 – Eintragungshindernisse und Ungültigkeitsgründe","absaetze":[{"nr":"None","text":"Wurde für eine Unionsmarke die Seniorität einer nationalen Marke in Anspruch genommen, auf die verzichtet wurde oder die erloschen ist, kann die Ungültigkeit oder der Verfall dieser nationalen Marke nachträglich festgestellt werden, sofern die Voraussetzungen schon im Zeitpunkt des Verzichts oder Erlöschens vorlagen; die Seniorität entfällt dann."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:7","type":"eunorm","label":"Art. 7 MarkenRL","titel":"Eintragungshindernisse und Ungültigkeitsgründe nur für einen Teil der Waren oder Dienstleistungen","nummer":"7","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 2 – Eintragungshindernisse und Ungültigkeitsgründe","absaetze":[{"nr":"None","text":"Liegt ein Hindernis nur für einen Teil der Waren oder Dienstleistungen vor, wird die Marke nur für diesen Teil zurückgewiesen oder für ungültig erklärt."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:8","type":"eunorm","label":"Art. 8 MarkenRL","titel":"Fehlende Unterscheidungskraft oder Bekanntheit einer älteren Marke als Hindernis für die Nichtigerklärung einer eingetragenen Marke","nummer":"8","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 2 – Eintragungshindernisse und Ungültigkeitsgründe","absaetze":[{"nr":"None","text":"Ein Antrag auf Nichtigerklärung aufgrund einer älteren Marke ist erfolglos, wenn er am Anmelde- oder Prioritätstag der jüngeren Marke erfolglos gewesen wäre, weil (a) die ältere Marke damals nach Art. 4 Abs. 1 lit. b, c oder d für ungültig erklärt werden konnte und noch keine Unterscheidungskraft erlangt hatte, (b) noch keine Verwechslungsgefahr bestand, weil die ältere Marke noch nicht hinreichend unterscheidungskräftig war, oder (c) die ältere Marke noch nicht bekannt war."}],"hinweis":"Maßgeblicher Zeitpunkt für Kennzeichnungskraft und Bekanntheit der älteren Marke ist der Prioritätstag der jüngeren Marke (§ 51 Abs. 3, Abs. 4 S. 2 MarkenG).","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:9","type":"eunorm","label":"Art. 9 MarkenRL","titel":"Verwirkung durch Duldung","nummer":"9","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 2 – Eintragungshindernisse und Ungültigkeitsgründe","absaetze":[{"nr":"1","text":"Hat der Inhaber einer älteren Marke die Benutzung einer jüngeren eingetragenen Marke fünf aufeinanderfolgende Jahre in Kenntnis geduldet, kann er weder die Nichtigkeit der jüngeren Marke geltend machen noch ihrer Benutzung widersprechen, es sei denn, die jüngere Marke wurde bösgläubig angemeldet."},{"nr":"2","text":"Die Mitgliedstaaten können dies auf sonstige ältere Rechte nach Art. 5 Abs. 4 lit. a und b erstrecken."},{"nr":"3","text":"Auch der Inhaber der jüngeren Marke kann sich der Benutzung des älteren Rechts nicht widersetzen, obwohl dieses nicht mehr gegen die jüngere Marke geltend gemacht werden kann."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:10","type":"eunorm","label":"Art. 10 MarkenRL","titel":"Rechte aus der Marke","nummer":"10","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 3 – Rechte aus der Marke und Beschränkungen","absaetze":[{"nr":"1","text":"Die Eintragung gewährt dem Inhaber ein ausschließliches Recht."},{"nr":"2","text":"Unbeschadet älterer Rechte kann der Inhaber Dritten verbieten, ohne seine Zustimmung im geschäftlichen Verkehr für Waren oder Dienstleistungen ein Zeichen zu benutzen, (a) das mit der Marke identisch ist und für identische Waren benutzt wird; (b) das mit der Marke identisch oder ähnlich ist und für identische oder ähnliche Waren benutzt wird, wenn Verwechslungsgefahr einschließlich der Gefahr gedanklicher Verbindung besteht; (c) das mit der Marke identisch oder ähnlich ist, wenn die Marke im Mitgliedstaat bekannt ist und die Benutzung ihre Unterscheidungskraft oder Wertschätzung ohne rechtfertigenden Grund unlauter ausnutzt oder beeinträchtigt, unabhängig von der Waren(un)ähnlichkeit."},{"nr":"3","text":"Verboten werden können insbesondere: (a) Anbringen auf Waren oder Verpackungen; (b) Anbieten, Inverkehrbringen, Besitz zu diesen Zwecken, Anbieten oder Erbringen von Dienstleistungen; (c) Einfuhr oder Ausfuhr; (d) Benutzung als Handelsname oder Unternehmensbezeichnung oder als Teil davon; (e) Benutzung in Geschäftspapieren und Werbung; (f) Benutzung in vergleichender Werbung entgegen der RL 2006/114/EG."},{"nr":"4","text":"Der Inhaber kann verhindern, dass Dritte Waren aus Drittstaaten, die ohne Zustimmung mit einer identischen (oder in wesentlichen Aspekten nicht unterscheidbaren) Marke versehen sind, in den Mitgliedstaat verbringen, ohne sie dort in den Verkehr zu bringen (Transit); das Recht erlischt, wenn der Anmelder oder Besitzer im Verletzungsverfahren nachweist, dass der Inhaber im Bestimmungsland die Vermarktung nicht verbieten könnte."},{"nr":"5","text":"Konnte nach dem Recht des Mitgliedstaats die Benutzung vor Inkrafttreten der Umsetzungsvorschriften der RL 89/104/EWG nicht verboten werden, kann sie auch jetzt nicht verboten werden."},{"nr":"6","text":"Die Absätze 1, 2, 3 und 5 lassen Vorschriften über den Schutz gegen Benutzung zu anderen Zwecken als der Unterscheidung von Waren unberührt, wenn die Benutzung die Unterscheidungskraft oder Wertschätzung unlauter ausnutzt oder beeinträchtigt."}],"hinweis":"Kern der Harmonisierung. Neu: Transitverbot (§ 14a MarkenG), Benutzung als Unternehmensbezeichnung ausdrücklich als Verletzungshandlung (§ 14 Abs. 3 Nr. 5), Bekanntheitsschutz zwingend und für alle Waren (§ 14 Abs. 2 Nr. 3). Die Funktionenlehre des EuGH (Herkunfts-, Werbe-, Investitionsfunktion) ist Auslegung dieses Artikels.","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:11","type":"eunorm","label":"Art. 11 MarkenRL","titel":"Recht, Vorbereitungshandlungen im Zusammenhang mit der Benutzung von Aufmachungen oder anderen Kennzeichnungsmitteln zu verbieten","nummer":"11","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 3 – Rechte aus der Marke und Beschränkungen","absaetze":[{"nr":"None","text":"Besteht die Gefahr, dass Aufmachungen, Verpackungen, Etiketten, Anhänger, Sicherheits- oder Echtheitshinweise, auf denen die Marke angebracht ist, für Waren benutzt werden und dies eine Verletzung wäre, kann der Inhaber verbieten: (a) das Anbringen der Marke auf solchen Kennzeichnungsmitteln, (b) das Anbieten, Inverkehrbringen, Besitzen, Ein- oder Ausführen solcher Kennzeichnungsmittel."}],"hinweis":"Vorverlagerung des Schutzes gegen Produktpiraterie; § 14 Abs. 4 MarkenG wurde um Sicherheits- und Echtheitshinweise erweitert.","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:12","type":"eunorm","label":"Art. 12 MarkenRL","titel":"Wiedergabe von Marken in Wörterbüchern","nummer":"12","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 3 – Rechte aus der Marke und Beschränkungen","absaetze":[{"nr":"None","text":"Erweckt die Wiedergabe einer Marke in einem Wörterbuch, Lexikon oder ähnlichen Nachschlagewerk den Eindruck, es handle sich um eine Gattungsbezeichnung, muss der Verleger auf Verlangen des Inhabers unverzüglich, bei Druckwerken spätestens in der nächsten Auflage, kenntlich machen, dass es sich um eine eingetragene Marke handelt."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:13","type":"eunorm","label":"Art. 13 MarkenRL","titel":"Untersagung der Benutzung einer Marke, die für einen Agenten oder Vertreter eingetragen ist","nummer":"13","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 3 – Rechte aus der Marke und Beschränkungen","absaetze":[{"nr":"1","text":"Wurde eine Marke ohne Zustimmung des Inhabers auf den Namen seines Agenten oder Vertreters eingetragen, kann der Inhaber der Benutzung widersprechen, es sei denn, der Agent rechtfertigt seine Handlung; außerdem kann er die Übertragung der Eintragung auf sich verlangen."},{"nr":"2","text":"Das Recht besteht nur, wenn der Agent oder Vertreter die Handlung nicht rechtfertigen kann."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:14","type":"eunorm","label":"Art. 14 MarkenRL","titel":"Beschränkung der Wirkungen der Marke","nummer":"14","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 3 – Rechte aus der Marke und Beschränkungen","absaetze":[{"nr":"1","text":"Die Marke gewährt nicht das Recht, Dritten zu verbieten, im geschäftlichen Verkehr zu benutzen: (a) den Namen oder die Anschrift des Dritten, wenn dieser eine natürliche Person ist; (b) Zeichen ohne Unterscheidungskraft oder Angaben über Art, Beschaffenheit, Menge, Bestimmung, Wert, geographische Herkunft, Zeit der Herstellung oder andere Merkmale; (c) die Marke zu Zwecken der Identifizierung oder zum Verweis auf Waren des Inhabers, insbesondere wenn dies als Hinweis auf die Bestimmung einer Ware als Zubehör oder Ersatzteil notwendig ist."},{"nr":"2","text":"Abs. 1 gilt nur, wenn die Benutzung den anständigen Gepflogenheiten in Gewerbe oder Handel entspricht."},{"nr":"3","text":"Die Marke gewährt nicht das Recht, einem Dritten die Benutzung eines älteren Rechts von örtlicher Bedeutung zu verbieten, wenn dieses Recht nach dem Recht des Mitgliedstaats anerkannt ist, in den Grenzen des Gebiets, in dem es anerkannt ist."}],"hinweis":"Neu: Die Namensschranke gilt nur noch für natürliche Personen (§ 23 Abs. 1 Nr. 1 MarkenG); die referierende Benutzung („zu Zwecken der Identifizierung oder des Verweises“) ist ausdrücklich privilegiert.","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:15","type":"eunorm","label":"Art. 15 MarkenRL","titel":"Erschöpfung des Rechts aus der Marke","nummer":"15","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 3 – Rechte aus der Marke und Beschränkungen","absaetze":[{"nr":"1","text":"Die Marke gewährt nicht das Recht, die Benutzung für Waren zu verbieten, die unter dieser Marke vom Inhaber oder mit seiner Zustimmung in der Union in den Verkehr gebracht worden sind."},{"nr":"2","text":"Abs. 1 gilt nicht, wenn berechtigte Gründe es rechtfertigen, dass der Inhaber sich dem weiteren Vertrieb widersetzt, insbesondere wenn der Zustand der Waren nach dem Inverkehrbringen verändert oder verschlechtert ist."}],"hinweis":"Unionsweite (EWR-weite) Erschöpfung; keine internationale Erschöpfung (EuGH Silhouette). Die Beweislastregeln (Van Doren) und die BMS-Kriterien konkretisieren Abs. 1 und 2.","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:16","type":"eunorm","label":"Art. 16 MarkenRL","titel":"Benutzung der Marke","nummer":"16","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 3 – Rechte aus der Marke und Beschränkungen","absaetze":[{"nr":"1","text":"Hat der Inhaber die Marke binnen fünf Jahren nach Abschluss des Eintragungsverfahrens nicht ernsthaft im Mitgliedstaat für die eingetragenen Waren benutzt oder die Benutzung fünf Jahre ausgesetzt, unterliegt die Marke den Beschränkungen und Sanktionen der Art. 17, 19 Abs. 1, 44 Abs. 1 und 2 sowie 46 Abs. 3 und 4, sofern keine berechtigten Gründe vorliegen."},{"nr":"2","text":"Sieht ein Mitgliedstaat ein Widerspruchsverfahren nach der Eintragung vor, beginnt die Fünfjahresfrist mit dem Tag, ab dem kein Widerspruch mehr möglich ist oder das Widerspruchsverfahren abgeschlossen ist."},{"nr":"3","text":"Bei international registrierten Marken mit Wirkung im Mitgliedstaat beginnt die Frist mit dem Tag, ab dem die Marke nicht mehr zurückgewiesen oder ihr nicht mehr widersprochen werden kann, bzw. mit Abschluss des Verfahrens."},{"nr":"4","text":"Der Tag des Fristbeginns wird im Register vermerkt."},{"nr":"5","text":"Als Benutzung gilt auch (a) die Benutzung in einer nur in unwesentlichen Bestandteilen abweichenden Form, die den kennzeichnenden Charakter nicht verändert, unabhängig davon, ob die abweichende Form ebenfalls eingetragen ist, und (b) das Anbringen der Marke auf Waren oder Verpackungen ausschließlich für den Export."},{"nr":"6","text":"Die Benutzung mit Zustimmung des Inhabers gilt als Benutzung durch den Inhaber."}],"hinweis":"Die Schonfrist beginnt jetzt mit dem Abschluss des Widerspruchsverfahrens (§ 26 Abs. 5 MarkenG neu); Benutzung in abweichender Form ist auch dann rechtserhaltend, wenn die abweichende Form selbst eingetragen ist (§ 26 Abs. 3 S. 2).","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:17","type":"eunorm","label":"Art. 17 MarkenRL","titel":"Einrede der Nichtbenutzung in Verletzungsverfahren","nummer":"17","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 3 – Rechte aus der Marke und Beschränkungen","absaetze":[{"nr":"None","text":"Der Inhaber kann die Benutzung eines Zeichens nur verbieten, soweit seine Rechte zum Zeitpunkt der Klageerhebung nicht nach Art. 19 für verfallen erklärt werden könnten; auf Verlangen des Beklagten muss der Inhaber nachweisen, dass die Marke in den fünf Jahren vor Klageerhebung ernsthaft benutzt wurde oder berechtigte Gründe vorliegen, sofern die Schonfrist bei Klageerhebung abgelaufen war."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:18","type":"eunorm","label":"Art. 18 MarkenRL","titel":"Zwischenrecht des Inhabers einer später eingetragenen Marke als Einwand in Verletzungsverfahren","nummer":"18","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 3 – Rechte aus der Marke und Beschränkungen","absaetze":[{"nr":"1","text":"Der Inhaber kann die Benutzung einer später eingetragenen Marke nicht verbieten, wenn diese jüngere Marke nach Art. 8, Art. 9 Abs. 1 oder 2 oder Art. 46 Abs. 3 nicht für ungültig erklärt werden könnte."},{"nr":"2","text":"Ebenso nicht, wenn die jüngere Unionsmarke nach Art. 53 Abs. 1, 3 oder 4, Art. 54 Abs. 1 oder 2 oder Art. 57 Abs. 2 UMV nicht für nichtig erklärt werden könnte."},{"nr":"3","text":"Kann der Inhaber der älteren Marke die Benutzung der jüngeren Marke danach nicht verbieten, kann auch deren Inhaber die Benutzung der älteren Marke nicht verbieten, obwohl diese nicht mehr gegen die jüngere geltend gemacht werden kann."}],"hinweis":"Übernahme des unionsmarkenrechtlichen Zwischenrechts (Art. 16 UMV) in das nationale Recht; § 22 MarkenG wurde neu gefasst.","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:19","type":"eunorm","label":"Art. 19 MarkenRL","titel":"Nichtbenutzung als Verfallsgrund","nummer":"19","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 4 – Verfall","absaetze":[{"nr":"1","text":"Eine Marke wird für verfallen erklärt, wenn sie innerhalb von fünf aufeinanderfolgenden Jahren nicht ernsthaft im Mitgliedstaat für die eingetragenen Waren benutzt wurde und keine berechtigten Gründe vorliegen."},{"nr":"2","text":"Der Verfall kann nicht geltend gemacht werden, wenn die Benutzung zwischen Ablauf der fünf Jahre und Antragstellung ernsthaft begonnen oder wieder aufgenommen wurde."},{"nr":"3","text":"Eine Aufnahme oder Wiederaufnahme innerhalb von drei Monaten vor Antragstellung, frühestens nach Ablauf der fünf Jahre, bleibt unberücksichtigt, wenn die Vorbereitungen erst begannen, nachdem der Inhaber vom möglichen Antrag Kenntnis erlangt hatte."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:20","type":"eunorm","label":"Art. 20 MarkenRL","titel":"Entwicklung zu einer gebräuchlichen Bezeichnung oder irreführende Angabe als Verfallsgrund","nummer":"20","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 4 – Verfall","absaetze":[{"nr":"None","text":"Eine Marke wird für verfallen erklärt, wenn sie nach der Eintragung (a) infolge des Verhaltens oder der Untätigkeit des Inhabers zur gebräuchlichen Bezeichnung einer Ware oder Dienstleistung geworden ist, für die sie eingetragen ist, oder (b) infolge ihrer Benutzung durch den Inhaber oder mit seiner Zustimmung geeignet ist, das Publikum insbesondere über Art, Beschaffenheit oder geographische Herkunft irrezuführen."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:21","type":"eunorm","label":"Art. 21 MarkenRL","titel":"Verfall nur für einen Teil der Waren oder Dienstleistungen","nummer":"21","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 4 – Verfall","absaetze":[{"nr":"None","text":"Liegt ein Verfallsgrund nur für einen Teil der Waren oder Dienstleistungen vor, wird die Marke nur für diesen Teil für verfallen erklärt."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:22","type":"eunorm","label":"Art. 22 MarkenRL","titel":"Rechtsübergang eingetragener Marken","nummer":"22","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 5 – Marken als Gegenstand des Vermögens","absaetze":[{"nr":"1","text":"Die Marke kann unabhängig vom Unternehmen für alle oder einen Teil der Waren übertragen werden."},{"nr":"2","text":"Der Übergang des gesamten Unternehmens erfasst die Marke, sofern nichts anderes vereinbart ist oder sich aus den Umständen ergibt."},{"nr":"3","text":"Die Mitgliedstaaten sehen Verfahren zur Eintragung des Rechtsübergangs im Register vor."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:23","type":"eunorm","label":"Art. 23 MarkenRL","titel":"Dingliche Rechte","nummer":"23","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 5 – Marken als Gegenstand des Vermögens","absaetze":[{"nr":"1","text":"Die Marke kann unabhängig vom Unternehmen verpfändet oder Gegenstand eines sonstigen dinglichen Rechts sein."},{"nr":"2","text":"Die Mitgliedstaaten sehen Verfahren zur Eintragung dinglicher Rechte im Register vor."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:24","type":"eunorm","label":"Art. 24 MarkenRL","titel":"Zwangsvollstreckung","nummer":"24","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 5 – Marken als Gegenstand des Vermögens","absaetze":[{"nr":"1","text":"Die Marke kann Gegenstand von Maßnahmen der Zwangsvollstreckung sein."},{"nr":"2","text":"Die Mitgliedstaaten sehen Verfahren zur Eintragung der Zwangsvollstreckung im Register vor."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:25","type":"eunorm","label":"Art. 25 MarkenRL","titel":"Lizenz","nummer":"25","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 5 – Marken als Gegenstand des Vermögens","absaetze":[{"nr":"1","text":"Die Marke kann für alle oder einen Teil der Waren und für das gesamte Gebiet oder einen Teil des Mitgliedstaats Gegenstand ausschließlicher oder nicht ausschließlicher Lizenzen sein."},{"nr":"2","text":"Der Inhaber kann die Marke gegen einen Lizenznehmer geltend machen, der gegen Bestimmungen des Lizenzvertrags über Dauer, Form der Benutzung, Art der Waren, Gebiet oder Qualität verstößt."},{"nr":"3","text":"Der Lizenznehmer kann Verletzungsklage nur mit Zustimmung des Inhabers erheben; der ausschließliche Lizenznehmer auch ohne Zustimmung, wenn der Inhaber nach förmlicher Aufforderung nicht innerhalb angemessener Frist selbst klagt."},{"nr":"4","text":"Jeder Lizenznehmer kann einer Verletzungsklage des Inhabers beitreten, um eigenen Schaden geltend zu machen."},{"nr":"5","text":"Die Mitgliedstaaten sehen Verfahren zur Eintragung von Lizenzen im Register vor."}],"hinweis":"Abs. 2 ist der unionsrechtliche Hintergrund des § 30 Abs. 2 MarkenG: Ein Lizenzverstoß in diesen Punkten schließt die Zustimmung und damit die Erschöpfung aus (EuGH Copad, BGH Converse II).","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:26","type":"eunorm","label":"Art. 26 MarkenRL","titel":"Anmeldung einer Marke als Gegenstand des Vermögens","nummer":"26","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 5 – Marken als Gegenstand des Vermögens","absaetze":[{"nr":"None","text":"Die Art. 22 bis 25 gelten auch für Markenanmeldungen."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:27","type":"eunorm","label":"Art. 27 MarkenRL","titel":"Begriffsbestimmungen","nummer":"27","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 6 – Garantie- oder Gewährleistungsmarken und Kollektivmarken","absaetze":[{"nr":"a","text":"„Garantie- oder Gewährleistungsmarke“: Marke, die geeignet ist, Waren oder Dienstleistungen, für die der Inhaber Material, Herstellungsart, Qualität, Genauigkeit oder andere Eigenschaften gewährleistet, von nicht gewährleisteten zu unterscheiden."},{"nr":"b","text":"„Kollektivmarke“: Marke, die geeignet ist, Waren oder Dienstleistungen der Mitglieder eines Verbands von denen anderer Unternehmen zu unterscheiden."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:28","type":"eunorm","label":"Art. 28 MarkenRL","titel":"Garantie- oder Gewährleistungsmarken","nummer":"28","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 6 – Garantie- oder Gewährleistungsmarken und Kollektivmarken","absaetze":[{"nr":"1","text":"Die Mitgliedstaaten können die Eintragung von Garantie- oder Gewährleistungsmarken vorsehen."},{"nr":"2","text":"Anmelden kann jede natürliche oder juristische Person einschließlich Einrichtungen des öffentlichen Rechts, sofern sie keine Waren der gewährleisteten Art selbst anbietet."},{"nr":"3","text":"Abweichend von Art. 4 Abs. 1 lit. c können beschreibende Herkunftsangaben Gewährleistungsmarken sein; der Inhaber kann Dritten die redliche Benutzung solcher Angaben nicht verbieten."},{"nr":"4","text":"Die Mitgliedstaaten können zusätzliche Verfalls- und Ungültigkeitsgründe vorsehen."},{"nr":"5","text":"Die Benutzung durch eine berechtigte Person gilt als rechtserhaltend."}],"hinweis":"Deutschland hat die Option genutzt: Gewährleistungsmarke seit dem MaMoG in §§ 106a ff. MarkenG (Prüf- und Gütesiegel).","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:29","type":"eunorm","label":"Art. 29 MarkenRL","titel":"Kollektivmarken","nummer":"29","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 6 – Garantie- oder Gewährleistungsmarken und Kollektivmarken","absaetze":[{"nr":"1","text":"Die Mitgliedstaaten sehen die Eintragung von Kollektivmarken vor."},{"nr":"2","text":"Anmelden können Verbände von Herstellern, Erzeugern, Dienstleistern oder Händlern mit Rechtsfähigkeit sowie juristische Personen des öffentlichen Rechts."},{"nr":"3","text":"Abweichend von Art. 4 Abs. 1 lit. c können geographische Herkunftsangaben Kollektivmarken sein; der Inhaber kann Dritten die redliche Benutzung, insbesondere durch ortsansässige Berechtigte, nicht verbieten."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:30","type":"eunorm","label":"Art. 30 MarkenRL","titel":"Satzung der Kollektivmarke","nummer":"30","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 6 – Garantie- oder Gewährleistungsmarken und Kollektivmarken","absaetze":[{"nr":"1","text":"Der Anmelder legt dem Amt die Markensatzung vor."},{"nr":"2","text":"Die Satzung nennt die zur Benutzung befugten Personen, die Voraussetzungen der Mitgliedschaft und der Benutzung sowie Sanktionen; bei geographischen Angaben muss jeder Ortsansässige, der die Voraussetzungen erfüllt, Mitglied werden können."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:31","type":"eunorm","label":"Art. 31 MarkenRL","titel":"Zurückweisung der Anmeldung","nummer":"31","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 6 – Garantie- oder Gewährleistungsmarken und Kollektivmarken","absaetze":[{"nr":"1","text":"Neben den Gründen der Art. 4 und 5 wird die Anmeldung zurückgewiesen, wenn Art. 27 lit. b, 29 oder 30 nicht erfüllt sind oder die Satzung gegen die öffentliche Ordnung oder die guten Sitten verstößt."},{"nr":"2","text":"Zurückweisung auch, wenn das Publikum über Charakter oder Bedeutung der Marke irregeführt werden kann, insbesondere wenn sie nicht als Kollektivmarke erscheint."},{"nr":"3","text":"Die Anmeldung wird nicht zurückgewiesen, wenn der Anmelder die Satzung so ändert, dass die Voraussetzungen erfüllt sind."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:32","type":"eunorm","label":"Art. 32 MarkenRL","titel":"Benutzung von Kollektivmarken","nummer":"32","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 6 – Garantie- oder Gewährleistungsmarken und Kollektivmarken","absaetze":[{"nr":"None","text":"Art. 16 ist erfüllt, wenn eine zur Benutzung befugte Person die Kollektivmarke ernsthaft benutzt."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:33","type":"eunorm","label":"Art. 33 MarkenRL","titel":"Änderung der Satzung der Kollektivmarke","nummer":"33","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 6 – Garantie- oder Gewährleistungsmarken und Kollektivmarken","absaetze":[{"nr":"1","text":"Der Inhaber legt jede geänderte Satzung dem Amt vor."},{"nr":"2","text":"Die Änderung wird im Register vermerkt, sofern sie den Anforderungen des Art. 30 entspricht und keinen Zurückweisungsgrund nach Art. 31 begründet."},{"nr":"3","text":"Die Änderung wird erst mit dem Registervermerk wirksam."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:34","type":"eunorm","label":"Art. 34 MarkenRL","titel":"Klagebefugnis","nummer":"34","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 6 – Garantie- oder Gewährleistungsmarken und Kollektivmarken","absaetze":[{"nr":"1","text":"Art. 25 Abs. 3 und 4 gelten für zur Benutzung Befugte entsprechend."},{"nr":"2","text":"Der Inhaber kann im Namen der Benutzungsberechtigten Ersatz des Schadens verlangen, der diesen durch unberechtigte Benutzung entstanden ist."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:35","type":"eunorm","label":"Art. 35 MarkenRL","titel":"Zusätzliche Verfallsgründe","nummer":"35","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 6 – Garantie- oder Gewährleistungsmarken und Kollektivmarken","absaetze":[{"nr":"None","text":"Zusätzlich zu Art. 19 und 20 wird die Kollektivmarke für verfallen erklärt, wenn (a) der Inhaber keine angemessenen Maßnahmen gegen satzungswidrige Benutzung trifft, (b) die Benutzung durch Befugte das Publikum nach Art. 31 Abs. 2 irreführen kann, oder (c) eine Satzungsänderung entgegen Art. 33 Abs. 2 im Register vermerkt wurde, es sei denn, der Inhaber erfüllt die Anforderungen durch erneute Änderung."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:36","type":"eunorm","label":"Art. 36 MarkenRL","titel":"Zusätzliche Ungültigkeitsgründe","nummer":"36","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 2 – Materielles Markenrecht","abschnitt":"Abschnitt 6 – Garantie- oder Gewährleistungsmarken und Kollektivmarken","absaetze":[{"nr":"None","text":"Zusätzlich zu Art. 4 und 5 wird eine entgegen Art. 31 eingetragene Kollektivmarke für ungültig erklärt, es sei denn, der Inhaber erfüllt die Anforderungen durch Satzungsänderung."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:37","type":"eunorm","label":"Art. 37 MarkenRL","titel":"Anmeldeerfordernisse","nummer":"37","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 3 – Verfahren","abschnitt":"Abschnitt 1 – Anmeldung und Eintragung","absaetze":[{"nr":"1","text":"Die Anmeldung enthält mindestens: (a) einen Antrag auf Eintragung, (b) Angaben zur Identität des Anmelders, (c) das Verzeichnis der Waren und Dienstleistungen, (d) eine Wiedergabe der Marke nach Art. 3 lit. b."},{"nr":"2","text":"Die Anmeldung unterliegt einer Gebühr."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:38","type":"eunorm","label":"Art. 38 MarkenRL","titel":"Anmeldetag","nummer":"38","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 3 – Verfahren","abschnitt":"Abschnitt 1 – Anmeldung und Eintragung","absaetze":[{"nr":"1","text":"Anmeldetag ist der Tag, an dem die Unterlagen nach Art. 37 Abs. 1 beim Amt eingereicht werden."},{"nr":"2","text":"Die Mitgliedstaaten können die Zuerkennung des Anmeldetags zusätzlich von der Zahlung der Gebühr abhängig machen."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:39","type":"eunorm","label":"Art. 39 MarkenRL","titel":"Bezeichnung und Klassifizierung von Waren und Dienstleistungen","nummer":"39","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 3 – Verfahren","abschnitt":"Abschnitt 1 – Anmeldung und Eintragung","absaetze":[{"nr":"1","text":"Die Waren und Dienstleistungen werden nach der Nizza-Klassifikation klassifiziert."},{"nr":"2","text":"Sie sind so klar und eindeutig anzugeben, dass Behörden und Wirtschaftsteilnehmer den Schutzumfang bestimmen können."},{"nr":"3","text":"Zulässig sind die allgemeinen Begriffe der Klassenüberschriften, sofern sie hinreichend klar sind."},{"nr":"4","text":"Zu unklare Angaben weist das Amt zurück, wenn der Anmelder nicht binnen Frist nachbessert."},{"nr":"5","text":"Allgemeine Begriffe, einschließlich der Klassenüberschriften, umfassen nur die Waren und Dienstleistungen, die eindeutig von ihrer wörtlichen Bedeutung erfasst sind (Klarstellung nach EuGH IP Translator)."},{"nr":"6","text":"Bei Klassenüberschriften wird nicht vermutet, dass alle Waren der Klasse beansprucht sind."},{"nr":"7","text":"Waren gelten nicht schon deshalb als ähnlich, weil sie derselben Klasse angehören, und nicht als unähnlich, weil sie verschiedenen Klassen angehören."}],"hinweis":"Abs. 7 entspricht § 9 Abs. 3 MarkenG; Abs. 5 kodifiziert die IP-Translator-Rechtsprechung (EuGH C-307/10).","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:40","type":"eunorm","label":"Art. 40 MarkenRL","titel":"Bemerkungen Dritter","nummer":"40","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 3 – Verfahren","abschnitt":"Abschnitt 1 – Anmeldung und Eintragung","absaetze":[{"nr":"1","text":"Die Mitgliedstaaten können vorsehen, dass Dritte vor der Eintragung schriftliche Bemerkungen zu absoluten Eintragungshindernissen einreichen, ohne am Verfahren beteiligt zu werden."},{"nr":"2","text":"Bei Kollektiv- und Gewährleistungsmarken können sich Bemerkungen auch auf Art. 31 beziehen."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:41","type":"eunorm","label":"Art. 41 MarkenRL","titel":"Teilung von Anmeldungen und Eintragungen","nummer":"41","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 3 – Verfahren","abschnitt":"Abschnitt 1 – Anmeldung und Eintragung","absaetze":[{"nr":"None","text":"Der Anmelder oder Inhaber kann die Anmeldung oder Eintragung in zwei oder mehr Teile teilen."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:42","type":"eunorm","label":"Art. 42 MarkenRL","titel":"Klassengebühren","nummer":"42","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 3 – Verfahren","abschnitt":"Abschnitt 1 – Anmeldung und Eintragung","absaetze":[{"nr":"None","text":"Die Mitgliedstaaten können für Anmeldung und Verlängerung eine zusätzliche Gebühr je Klasse jenseits der ersten Klasse vorsehen."}],"hinweis":"","url":"https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32015L2436","url_pdf":"https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX:32015L2436","paraphrase":true},{"id":"eunorm:markenrl:43","type":"eunorm","label":"Art. 43 MarkenRL","titel":"Widerspruchsverfahren","nummer":"43","gesetz":"Richtlinie (EU) 2015/2436","kapitel":"Kapitel 3 – Verfahren","abschnitt":"Abschnitt 2 – Verfahren für Widerspruch, Verfall und Nichtigkeit","absaetze":[{"nr":"1","text":"Die Mitgliedstaaten sehen ein effizientes und zügiges Verwaltungsverfahren vor, mit dem gegen die Anmeldung auf Grundlage der Gründe des Art. 5 W
