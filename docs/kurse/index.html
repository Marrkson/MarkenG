msetzung von Art. 6septies PVÜ und Art. 5 Abs. 3 lit. b, Art. 13 MarkenRL. Agent oder Vertreter ist weit zu verstehen: jede Person, die aufgrund einer Vereinbarung zur Wahrnehmung der Interessen des Inhabers verpflichtet ist (Vertriebshändler, Lizenznehmer). Rechtfertigung ist möglich, etwa bei Zustimmung oder Aufgabe der Marke durch den Inhaber."},{"id":"concept:nachschlagewerke","type":"concept","label":"Wiedergabe in Nachschlagewerken (§ 16 MarkenG, Art. 12 MarkenRL)","kategorie":"Rechtsfolgen","definition":"Erweckt die Wiedergabe einer eingetragenen Marke in einem Wörterbuch, Lexikon oder ähnlichen Nachschlagewerk den Eindruck einer Gattungsbezeichnung, kann der Inhaber vom Verleger verlangen, dass spätestens bei der nächsten Auflage ein Hinweis auf die Eintragung als Marke aufgenommen wird.","erlaeuterung":"Schutz vor der Degeneration zur Gattungsbezeichnung (§ 49 Abs. 2 Nr. 1); der Anspruch ist eine Obliegenheit des Inhabers, der aktiv gegen generische Verwendung vorgehen muss (vgl. BGH TÜV II)."},{"id":"concept:klassifizierung","type":"concept","label":"Waren-/Dienstleistungsverzeichnis und Nizza-Klassifikation (§ 32 MarkenG, Art. 39 MarkenRL)","kategorie":"Verfahren","definition":"Die Waren und Dienstleistungen sind nach der Nizza-Klassifikation so klar und eindeutig anzugeben, dass Behörden und Wirtschaftsteilnehmer den Schutzumfang bestimmen können. Allgemeine Begriffe und Klassenüberschriften umfassen nur, was von ihrer wörtlichen Bedeutung eindeutig erfasst ist (EuGH IP Translator, C-307/10; Art. 39 Abs. 5 MarkenRL).","erlaeuterung":"Die Klasse allein sagt nichts über Warenähnlichkeit (§ 9 Abs. 3 MarkenG, Art. 39 Abs. 7 MarkenRL). Das Verzeichnis bestimmt die Registerlage, die bei Verwechslungsgefahr, Benutzungszwang (Teilbenutzung) und Teillöschung maßgeblich ist."},{"id":"concept:verwaltungsverfahren_loeschung","type":"concept","label":"Verfalls- und Nichtigkeitsverfahren vor dem DPMA (§ 53 MarkenG, Art. 45 MarkenRL)","kategorie":"Verfahren","definition":"Art. 45 MarkenRL verpflichtet die Mitgliedstaaten, ein effizientes und zügiges Verwaltungsverfahren vor dem Markenamt für die Erklärung des Verfalls und der Nichtigkeit vorzusehen. Deutschland hat es seit 1.5.2020 in § 53 MarkenG als vollständiges Verfahren vor dem DPMA ausgestaltet; daneben bleibt die Klage vor dem Landgericht nach § 55 für Verfall und relative Nichtigkeit.","erlaeuterung":"Ablauf: Antrag mit Begründung und Gebühr; Zustellung an den Inhaber; widerspricht dieser nicht binnen zwei Monaten, wird gelöscht (§ 53 Abs. 5); sonst kontradiktorisches Verfahren mit Entscheidung durch Beschluss, Beschwerde zum BPatG (§ 66). Nichtbenutzungseinrede § 53 Abs. 6 (Art. 46 MarkenRL). Bei parallelen Verfahren Aussetzung möglich (§ 53 Abs. 7, § 148 ZPO)."},{"id":"concept:schutzdauer","type":"concept","label":"Schutzdauer und Verlängerung (§ 47 MarkenG, Art. 48, 49 MarkenRL)","kategorie":"Grundlagen","definition":"Die Schutzdauer beträgt zehn Jahre ab dem Anmeldetag und kann beliebig oft um zehn Jahre verlängert werden. Die Verlängerung erfolgt durch Zahlung der Verlängerungsgebühr innerhalb von sechs Monaten vor Ablauf, nachträglich innerhalb weiterer sechs Monate mit Zuschlag; das DPMA unterrichtet den Inhaber vorab.","erlaeuterung":"Seit dem MaMoG läuft die Frist tagesgenau ab dem Anmeldetag (früher: Ende des Monats). Die Verlängerung kann auf einen Teil der Waren beschränkt werden. Ohne Verlängerung erlischt die Marke (§ 47 Abs. 6)."},{"id":"distinction:d_kennzeichnungskraft_unterscheidungskraft","type":"distinction","label":"Kennzeichnungskraft vs. Unterscheidungskraft","frage":"Worin unterscheiden sich Unterscheidungskraft und Kennzeichnungskraft?","kriterien":["Rechtliche Ebene","Norm","Prüfungsfrage","Maßstab","Ergebnis","Zeitpunkt","Beispiel"],"spalten":["Unterscheidungskraft","Kennzeichnungskraft"],"rows":[["Schutzvoraussetzung (Eintragungsfähigkeit)","Schutzumfang (Kollisionsprüfung)"],["§ 8 Abs. 2 Nr. 1 MarkenG","§ 14 Abs. 2 Nr. 2, § 9 Abs. 1 Nr. 2 MarkenG (ungeschrieben, Faktor der Verwechslungsgefahr)"],["Ist das Zeichen überhaupt geeignet, als Herkunftshinweis für die beanspruchten Waren zu dienen?","Wie stark prägt sich das Zeichen dem Verkehr als Marke ein – wie weit reicht sein Schutzbereich?"],["Ja/Nein-Entscheidung; großzügig: jede noch so geringe Unterscheidungskraft genügt","Graduell: sehr gering – gering – durchschnittlich – erhöht – sehr hoch (Culinaria)"],["Fehlt sie: Zurückweisung / Nichtigkeit (§ 50)","Je höher, desto größer die Verwechslungsgefahr und der Schutzbereich (Wechselwirkung)"],["Anmeldetag (§ 37 Abs. 2, § 50 Abs. 2)","Kollisionszeitpunkt (Verletzung) bzw. Anmeldetag der jüngeren Marke; kann durch Benutzung steigen oder durch Drittzeichen sinken"],["'marktfrisch' für Lebensmittel: keine Unterscheidungskraft","'Kinder' für Süßwaren: durch Verkehrsdurchsetzung eingetragen, aber nur durchschnittliche Kennzeichnungskraft (Kinder II)"]],"merksatz":"Unterscheidungskraft = Eintrittskarte ins Register (ob). Kennzeichnungskraft = Reichweite des Schutzes im Streit (wie stark)."},{"id":"distinction:d_unterscheidungskraft_freihaltebeduerfnis","type":"distinction","label":"Fehlende Unterscheidungskraft (Nr. 1) vs. Freihaltebedürfnis (Nr. 2)","frage":"Wie unterscheiden sich § 8 Abs. 2 Nr. 1 und Nr. 2 MarkenG?","kriterien":["Schutzzweck","Perspektive","Erfasste Zeichen","Verhältnis","Überwindung"],"spalten":["§ 8 Abs. 2 Nr. 1 (Unterscheidungskraft)","§ 8 Abs. 2 Nr. 2 (Freihaltebedürfnis)"],"rows":[["Herkunftsfunktion: Verbraucher soll Zeichen als Marke erkennen können","Allgemeininteresse der Mitbewerber an freier Verwendbarkeit beschreibender Angaben"],["Sicht des Durchschnittsverbrauchers","Sicht der Mitbewerber / des Verkehrs (auch künftige Verwendung)"],["Beschreibende Angaben, gebräuchliche Wörter, reine Werbeaussagen, Dekor","Nur Angaben über Merkmale der Waren (Art, Beschaffenheit, Menge, Bestimmung, Herkunft, Zeit …)"],["Jede nach Nr. 2 beschreibende Angabe fehlt regelmäßig auch die Unterscheidungskraft; nicht umgekehrt (z.B. 'for you')","Engerer Anwendungsbereich; eigenständig zu prüfen, auch wenn Nr. 1 bejaht"],["Verkehrsdurchsetzung (§ 8 Abs. 3)","Verkehrsdurchsetzung (§ 8 Abs. 3), aber höhere Anforderungen bei glatt beschreibenden Angaben"]],"merksatz":"Nr. 1 fragt: Sieht der Verbraucher eine Marke? Nr. 2 fragt: Brauchen die Konkurrenten das Wort?"},{"id":"distinction:d_markenfaehigkeit_unterscheidungskraft","type":"distinction","label":"Markenfähigkeit (§ 3) vs. Unterscheidungskraft (§ 8 Abs. 2 Nr. 1)","frage":"Abstrakte vs. konkrete Unterscheidungseignung – was ist der Unterschied?","kriterien":["Bezugspunkt","Prüfung","Praktische Bedeutung","Sonderfall"],"spalten":["Markenfähigkeit (§ 3 Abs. 1)","Unterscheidungskraft (§ 8 Abs. 2 Nr. 1)"],"rows":[["Abstrakt: Zeichen als solches, unabhängig von Waren","Konkret: Zeichen in Bezug auf die beanspruchten Waren/Dienstleistungen"],["Kann ein Zeichen dieser Art überhaupt Marke sein?","Wird dieses Zeichen für diese Waren als Herkunftshinweis verstanden?"],["Nur selten verneint (variable Zeichen, bloße Idee/Konzept)","Häufigstes Eintragungshindernis"],["§ 3 Abs. 2 Formausschluss: nicht überwindbar","§ 8 Abs. 3: durch Verkehrsdurchsetzung überwindbar"]],"merksatz":"§ 3 = Türsteher für Zeichenarten, § 8 Abs. 2 Nr. 1 = Prüfung des konkreten Zeichens für konkrete Waren."},{"id":"distinction:d_verkehrsgeltung_verkehrsdurchsetzung_bekanntheit","type":"distinction","label":"Verkehrsgeltung vs. Verkehrsdurchsetzung vs. Bekanntheit vs. notorische Bekanntheit","frage":"Welche Bekanntheitsstufen kennt das MarkenG und wofür sind sie relevant?","kriterien":["Norm","Funktion","Bezugsgröße","Richtwert"],"spalten":["Verkehrsgeltung","Verkehrsdurchsetzung","Bekannte Marke","Notorische Bekanntheit"],"rows":[["§ 4 Nr. 2","§ 8 Abs. 3","§ 14 Abs. 2 Nr. 3, § 9 Abs. 1 Nr. 3","§ 4 Nr. 3, § 10 (Art. 6bis PVÜ)"],["Entstehung einer Benutzungsmarke ohne Eintragung","Überwindung der Schutzhindernisse § 8 Abs. 2 Nr. 1-3 bei Eintragung","Erweiterter Schutzbereich über Verwechslungsgefahr hinaus","Entstehung von Markenschutz ohne Eintragung und Inlandsbenutzung"],["Beteiligte Verkehrskreise (kann regional beschränkt sein)","Beteiligte Verkehrskreise, bundesweit","Bedeutender Teil des von den Waren angesprochenen Publikums, wesentlicher Teil des Inlands","Allgemeine Bekanntheit im Inland (auch außerhalb der Fachkreise)"],["Bei unterscheidungskräftigen Zeichen ca. 20-25 %; bei beschreibenden wie Verkehrsdurchsetzung","Regelmäßig über 50 % Zuordnung; bei glatt beschreibenden Angaben mehr","Keine feste Quote (General Motors); Faktoren Marktanteil, Intensität, Werbung","Sehr hoher Bekanntheitsgrad; praktisch selten"]],"merksatz":"Verkehrsgeltung schafft die Marke, Verkehrsdurchsetzung öffnet das Register, Bekanntheit erweitert den Schutz, Notorietät ersetzt Eintragung und Benutzung."},{"id":"distinction:d_kollisionstatbestaende","type":"distinction","label":"Doppelidentität vs. Verwechslungsgefahr vs. Bekanntheitsschutz (§ 14 Abs. 2 Nr. 1-3)","frage":"Welche Voraussetzungen haben die drei Kollisionstatbestände des § 14 Abs. 2 MarkenG?","kriterien":["Zeichen","Waren/Dienstleistungen","Zusätzliche Voraussetzung","Betroffene Markenfunktion","Typische Fälle"],"spalten":["Nr. 1 Doppelidentität","Nr. 2 Verwechslungsgefahr","Nr. 3 Bekanntheitsschutz"],"rows":[["Identisch","Identisch oder ähnlich","Identisch oder ähnlich"],["Identisch","Identisch oder ähnlich","Beliebig (auch unähnlich; auch identisch/ähnlich nach OTTO Cap)"],["Keine (absoluter Schutz); aber Beeinträchtigung irgendeiner Markenfunktion","Verwechslungsgefahr (Wechselwirkung)","Bekanntheit, gedankliche Verknüpfung, Ausnutzung/Beeinträchtigung, Unlauterkeit ohne rechtfertigenden Grund"],["Herkunfts-, Qualitäts-, Kommunikations-, Investitions- oder Werbefunktion (L'Oréal/Bellure)","Herkunftsfunktion","Werbe-/Investitionsfunktion, Ruf (keine Beeinträchtigung der Herkunftsfunktion erforderlich)"],["Produktpiraterie, Keyword-Advertising, Ersatzteilhinweise","Ähnliche Zeichen auf Konkurrenzprodukten","Markenparodie, Imagetransfer, Rufausbeutung, Verwässerung"]],"merksatz":"Nr. 1: identisch + identisch. Nr. 2: ähnlich + ähnlich + Verwechslung. Nr. 3: bekannt + Verknüpfung + unlauter."},{"id":"distinction:d_verwechslungsgefahr_arten","type":"distinction","label":"Unmittelbare vs. mittelbare Verwechslungsgefahr vs. Verwechslungsgefahr im weiteren Sinne","frage":"Welche Arten der Verwechslungsgefahr gibt es?","kriterien":["Fehlvorstellung des Verkehrs","Voraussetzung","Beispiel"],"spalten":["Unmittelbare Verwechslungsgefahr","Mittelbare Verwechslungsgefahr","Verwechslungsgefahr im weiteren Sinne"],"rows":[["Verkehr hält die Zeichen für dasselbe Zeichen","Verkehr erkennt die Unterschiede, ordnet beide Zeichen aber demselben Unternehmen zu (Serienzeichen)","Verkehr erkennt verschiedene Unternehmen, nimmt aber wirtschaftliche/organisatorische Verbindungen an"],["Zeichenähnlichkeit nach Klang, Bild, Sinn im Gesamteindruck","Gemeinsamer kennzeichnungskräftiger Stammbestandteil einer benutzten Zeichenserie","Ältere Marke als selbständig kennzeichnender Bestandteil oder zugleich Unternehmenskennzeichen; Ausnahmefall"],["'Maalox' / 'Melox' (verneint)","'Volkswagen' – 'Volks.Inspektion' (Stamm 'Volks')","'LIFE' – 'THOMSON LIFE'; 'Sixtyseven by Mustang'"]],"merksatz":"Unmittelbar: gleiches Zeichen. Mittelbar: gleiche Familie. Im weiteren Sinne: gleiche Firma dahinter."},{"id":"distinction:d_praegetheorie_selbstaendige_stellung","type":"distinction","label":"Prägetheorie vs. selbständig kennzeichnende Stellung","frage":"Wann prägt ein Bestandteil den Gesamteindruck, wann hat er nur eine selbständig kennzeichnende Stellung?","kriterien":["Frage","Voraussetzung","Folge für Zeichenvergleich","Art der Verwechslungsgefahr","Leitentscheidung"],"spalten":["Prägetheorie","Selbständig kennzeichnende Stellung"],"rows":[["Welcher Bestandteil bestimmt den Gesamteindruck des mehrgliedrigen Zeichens?","Behält die übernommene ältere Marke im jüngeren Kombinationszeichen ihre eigenständige Kennzeichnungsfunktion?"],["Übrige Bestandteile treten so zurück, dass sie den Gesamteindruck nicht mitbestimmen","Bestandteil dominiert nicht, wirkt aber neben den anderen Bestandteilen (z.B. neben einer Unternehmensbezeichnung) eigenständig; besondere Umstände"],["Vergleich der älteren Marke mit dem prägenden Bestandteil","Verkehr nimmt an, die Waren stammten aus verbundenen Unternehmen"],["Unmittelbare Verwechslungsgefahr","Verwechslungsgefahr im weiteren Sinne"],["BGH Springende Raubkatze; Culinaria","EuGH THOMSON LIFE; BGH INTERCONNECT, Culinaria"]],"merksatz":"Prägung = ein Teil ist das Ganze. Selbständig kennzeichnende Stellung = ein Teil bleibt erkennbar fremd."},{"id":"distinction:d_markenmaessig_rechtserhaltend","type":"distinction","label":"Markenmäßige Benutzung (§ 14) vs. rechtserhaltende Benutzung (§ 26)","frage":"Was unterscheidet die rechtsverletzende von der rechtserhaltenden Benutzung?","kriterien":["Kontext","Wer benutzt","Kernfrage","Zusätzliche Anforderungen","Gemeinsamkeit"],"spalten":["Markenmäßige (rechtsverletzende) Benutzung","Rechtserhaltende Benutzung"],"rows":[["Verletzungstatbestand § 14 Abs. 2","Benutzungszwang §§ 25, 26, 43, 49"],["Der Dritte (Verletzer)","Der Markeninhaber oder Lizenznehmer"],["Beeinträchtigt die Benutzung eine Markenfunktion (Herkunftshinweis)?","Wird die Marke ernsthaft, funktionsgemäß, im Inland, für die eingetragenen Waren und in unveränderter Form benutzt?"],["Geschäftlicher Verkehr, ohne Zustimmung, Kollisionstatbestand","Ernsthaftigkeit (Absatzmarkt), Fünfjahreszeitraum, § 26 Abs. 3 abweichende Form"],["Beide setzen eine Benutzung als Herkunftshinweis (funktionsgemäß) voraus – rein beschreibende oder firmenmäßige Verwendung genügt in beiden Fällen nicht",""]],"merksatz":"Gleiche Grundfrage (Herkunftshinweis?), verschiedene Richtung: Eingriff des Dritten vs. Pflicht des Inhabers."},{"id":"distinction:d_schranken_23_24","type":"distinction","label":"§ 23 vs. § 24 MarkenG","frage":"Wie unterscheiden sich die Schranken der §§ 23 und 24 MarkenG?","kriterien":["Gegenstand","Fallgruppen","Grenze","Beweislast","Typischer Fall"],"spalten":["§ 23 (beschreibende/referierende Benutzung)","§ 24 (Erschöpfung)"],"rows":[["Benutzung der Marke für eigene Waren des Dritten zur Information","Weitervertrieb von Originalware des Markeninhabers"],["Name/Anschrift, beschreibende Angaben, Bestimmungshinweis (Ersatzteile)","Inverkehrbringen im EWR durch Inhaber oder mit Zustimmung"],["Anständige Gepflogenheiten (Abs. 2)","Berechtigte Gründe (Abs. 2): Veränderung, Rufschädigung"],["Dritter für Voraussetzungen; Markeninhaber für Verstoß gegen anständige Gepflogenheiten","Dritter; Umkehr bei Marktabschottungsgefahr (Van Doren)"],["'passend für Vorwerk' (Staubsaugerfiltertüten)","Parallelimport (BMS), Gebrauchtwarenhandel, Converse"]],"merksatz":"§ 23 = fremde Marke für eigene Ware erwähnen. § 24 = fremde Marke auf fremder Originalware weiterverkaufen."},{"id":"distinction:d_verfall_nichtigkeit","type":"distinction","label":"Verfall (§ 49) vs. Nichtigkeit (§§ 50, 51)","frage":"Wie unterscheiden sich Verfall und Nichtigkeit einer Marke?","kriterien":["Grund","Zeitpunkt des Mangels","Wirkung","Antragsbefugnis","Zuständigkeit"],"spalten":["Verfall (§ 49)","Nichtigkeit absolut (§ 50)","Nichtigkeit relativ (§ 51)"],"rows":[["Nachträglich: Nichtbenutzung, Gattungsbezeichnung, Täuschung, § 7","Ursprünglich: Verstoß gegen §§ 3, 7, 8 bei Eintragung","Ursprünglich: entgegenstehendes älteres Recht (§§ 9-13)"],["Nach der Eintragung entstanden","Bereits am Anmeldetag (bei Nr. 1-3 fortbestehend)","Bereits am Anmeldetag"],["Ex nunc (§ 52 Abs. 1): ab Antrag oder früherem Verfallszeitpunkt","Ex tunc (§ 52 Abs. 2): Eintragung gilt als von Anfang an nicht erfolgt","Ex tunc (§ 52 Abs. 2)"],["Jedermann (Popularantrag)","Jedermann (Popularantrag); Zehnjahresfrist bei Nr. 1-3","Nur Inhaber des älteren Rechts"],["DPMA (§ 53) oder Landgericht (§ 55)","DPMA (§ 53)","DPMA (§ 53) oder Landgericht (§ 55)"]],"merksatz":"Verfall = später kaputt (ex nunc). Nichtigkeit = von Anfang an falsch (ex tunc)."},{"id":"distinction:d_marke_ukz_werktitel","type":"distinction","label":"Marke vs. Unternehmenskennzeichen vs. Werktitel","frage":"Was kennzeichnen Marke, Unternehmenskennzeichen und Werktitel jeweils und wie entstehen sie?","kriterien":["Kennzeichnungsgegenstand","Norm","Entstehung","Unterscheidungskraft","Verletzungstatbestand","Verwechslungsgefahr"],"spalten":["Marke","Unternehmenskennzeichen","Werktitel"],"rows":[["Waren/Dienstleistungen (betriebliche Herkunft)","Unternehmen/Geschäftsbetrieb","Werk (Individualisierung des geistigen Produkts)"],["§§ 3, 4, 14","§§ 5 Abs. 2, 15","§§ 5 Abs. 3, 15"],["Eintragung, Verkehrsgeltung, Notorietät (§ 4)","Benutzungsaufnahme (bei originärer Unterscheidungskraft), sonst Verkehrsgeltung","Benutzungsaufnahme/Erscheinen (Titelschutzanzeige)"],["Konkret für Waren; großzügig","Namensfunktion; beschreibende Angaben nur mit Verkehrsgeltung","Abgesenkter Maßstab bei Verkehrsgewöhnung (Zeitschriften), nicht bei Apps/Domains ohne Gewöhnung (wetter.de)"],["§ 14 Abs. 2 Nr. 1-3","§ 15 Abs. 2 (Verwechslungsgefahr), Abs. 3 (bekannt)","§ 15 Abs. 2, Abs. 3"],["Warenähnlichkeit × Kennzeichnungskraft × Zeichenähnlichkeit","Branchennähe × Kennzeichnungskraft × Zeichenähnlichkeit","Grundsätzlich nur unmittelbare Werkverwechslung; weiterer Sinn nur bei bekannten Titeln"]],"merksatz":"Marke → Produkt, Unternehmenskennzeichen → Firma, Werktitel → Werk."},{"id":"distinction:d_widerspruch_nichtigkeitsklage","type":"distinction","label":"Widerspruch (§ 42) vs. Nichtigkeitsantrag wegen älterer Rechte (§ 51)","frage":"Wann Widerspruch, wann Nichtigkeitsverfahren?","kriterien":["Frist","Geltend machbare Rechte","Verfahren","Beweismaß","Instanzenzug"],"spalten":["Widerspruch (§§ 42, 43)","Nichtigkeit (§ 51 i.V.m. §§ 53, 55)"],"rows":[["Drei Monate nach Veröffentlichung der Eintragung","Unbefristet (Grenze: Verwirkung § 51 Abs. 2, § 21)"],["Nur ältere Marken, notorisch bekannte Marken, Benutzungsmarken/geschäftliche Bezeichnungen, Ursprungsbezeichnungen (§ 42 Abs. 2)","Alle älteren Rechte der §§ 9-13 (auch Namensrecht, Urheberrecht, Design)"],["Summarisches Registerverfahren vor dem DPMA","Kontradiktorisches Verfahren vor DPMA (§ 53) oder Klage vor dem Landgericht (§ 55)"],["Glaubhaftmachung, präsente Beweismittel","Voller Beweis (Zivilprozess) bzw. Amtsermittlung mit Beibringung"],["DPMA → BPatG (§ 66) → BGH (§ 83)","DPMA → BPatG → BGH bzw. LG → OLG → BGH"]],"merksatz":"Widerspruch = schnell, billig, aber nur für Kennzeichenrechte und nur drei Monate. Nichtigkeit = unbefristet, alle Rechte, volles Verfahren."},{"id":"distinction:d_ausnutzung_beeintraechtigung","type":"distinction","label":"Die vier Eingriffstatbestände des Bekanntheitsschutzes","frage":"Welche vier Eingriffe erfasst § 14 Abs. 2 Nr. 3 MarkenG?","kriterien":["Was wird ausgenutzt/beeinträchtigt?","Mechanismus","Nachweis","Beispiel"],"spalten":["Ausnutzung der Unterscheidungskraft","Ausnutzung der Wertschätzung","Beeinträchtigung der Unterscheidungskraft","Beeinträchtigung der Wertschätzung"],"rows":[["Aufmerksamkeit/Bekanntheit","Ruf/Image (Qualität, Prestige)","Kennzeichnungskraft/Einzigartigkeit","Ruf/Image"],["Trittbrettfahren: Aufmerksamkeit auf eigenes Angebot lenken","Imagetransfer auf eigene Ware","Verwässerung: Marke verliert Eignung als eindeutiger Herkunftshinweis","Verunglimpfung: negative Assoziationen"],["Gedankliche Verknüpfung + Nutzen für den Dritten","Übertragung des Rufs; Sogwirkung (L'Oréal/Bellure)","Änderung des Verbraucherverhaltens oder ernsthafte Gefahr (Intel)","Unvereinbares Umfeld/minderwertige Ware"],["'OTTO' für Caps; Springender Pudel","Duftvergleichslisten; ÖKO-TEST-Siegel ohne Lizenz","Massenhafte Verwendung ähnlicher Zeichen für beliebige Waren","Luxusmarke auf Billig- oder anstößigem Produkt"]],"merksatz":"Ausnutzen = der Dritte gewinnt. Beeinträchtigen = der Inhaber verliert. Jeweils bezogen auf Unterscheidungskraft oder Wertschätzung."},{"id":"distinction:d_taeter_stoerer","type":"distinction","label":"Täter vs. Teilnehmer vs. Störer","frage":"Wer haftet wie für Markenverletzungen?","kriterien":["Voraussetzung","Verschulden","Rechtsfolgen","Beispiel"],"spalten":["Täter","Teilnehmer","Störer"],"rows":[["Eigene Verwirklichung des Tatbestands (auch Mittäter)","Vorsätzliche Anstiftung/Beihilfe zu vorsätzlicher Haupttat","Willentlicher, adäquat-kausaler Beitrag + Verletzung zumutbarer Prüfpflichten"],["Für Unterlassung nicht; für Schadensersatz Vorsatz/Fahrlässigkeit","Doppelter Vorsatz","Kein Verschulden, aber Prüfpflichtverletzung"],["Unterlassung, Schadensersatz, Auskunft, Vernichtung","Wie Täter","Nur Unterlassung (und Beseitigung), kein Schadensersatz"],["Hersteller/Händler von Plagiaten","Lieferant von Nachfüllware, der um Befüllung weiß (Tork)","eBay/Amazon nach Hinweis auf klare Verletzung (Internet-Versteigerung II)"]],"merksatz":"Störer haften nur auf Unterlassung und nur nach Hinweis."},{"id":"distinction:d_9_1_3_vs_14_2_3","type":"distinction","label":"§ 9 Abs. 1 Nr. 3 vs. § 14 Abs. 2 Nr. 3 MarkenG","frage":"Worin unterscheiden sich der Bekanntheitsschutz im Register (§ 9 Abs. 1 Nr. 3) und im Verletzungsprozess (§ 14 Abs. 2 Nr. 3)?","kriterien":["Funktion","Verfahren","Angreifer / Gegner","Prüfungsgegenstand","Zeitpunkt der Bekanntheit","Beweismaß","Rechtsfolge","Gemeinsam"],"spalten":["§ 9 Abs. 1 Nr. 3 (relatives Schutzhindernis)","§ 14 Abs. 2 Nr. 3 (Verletzungstatbestand)"],"rows":[["Angriff auf den Bestand der jüngeren Registermarke","Verbot der Benutzung eines Zeichens im Markt"],["Widerspruch (§ 42) vor DPMA oder Nichtigkeitsverfahren (§ 51; DPMA § 53 / Landgericht § 55)","Verletzungsklage vor dem Landgericht (§ 140), einstweilige Verfügung"],["Nur Inhaber der älteren bekannten Marke gegen eine eingetragene jüngere Marke","Markeninhaber (oder Lizenznehmer) gegen jeden Benutzer, auch ohne Registermarke"],["Hypothetische Benutzung der jüngeren Marke für die eingetragenen Waren nach Registerlage ('würde')","Konkrete, tatsächliche Benutzungshandlung in ihrem Marktumfeld"],["Anmelde-/Prioritätstag der jüngeren Marke (§ 51 Abs. 3) und Fortbestehen bei der Entscheidung","Zeitpunkt der Verletzungshandlung; gegen eingetragene jüngere Marke zusätzlich deren Prioritätstag (§ 22 Abs. 1 Nr. 1)"],["Widerspruch: Glaubhaftmachung mit präsenten Beweismitteln; Nichtigkeit: Beweis / Amtsermittlung","Voller Beweis nach ZPO (Umfragen, Marktdaten)"],["Löschung (ex tunc, § 52 Abs. 2) ganz oder teilweise","Unterlassung, Schadensersatz, Vernichtung, Auskunft (§§ 14 Abs. 5-7, 18, 19)"],["Gleiche Voraussetzungen: Bekanntheit, Zeichenähnlichkeit, gedankliche Verknüpfung, vier Eingriffsalternativen, Unlauterkeit ohne rechtfertigenden Grund; seit MaMoG beide auch bei identischen/ähnlichen Waren",""]],"merksatz":"§ 9 fragt: Darf die Marke im Register stehen? § 14 fragt: Darf das Zeichen benutzt werden? Gleicher Tatbestand, andere Perspektive und anderer Zeitpunkt."},{"id":"distinction:d_bekanntheit_inland_union","type":"distinction","label":"Bekanntheit im Inland vs. Bekanntheit in der Union","frage":"Welche Bekanntheit ist maßgeblich, wenn die ältere Marke eine deutsche Marke bzw. eine Unionsmarke ist?","kriterien":["Norm","Räumlicher Bezug","Wesentlicher Teil","Zusatzvoraussetzung im Kollisionsgebiet","Leitentscheidungen"],"spalten":["Deutsche Marke / IR-Marke (DE)","Unionsmarke / IR-Marke (EU)"],"rows":[["§ 9 Abs. 1 Nr. 3, § 14 Abs. 2 Nr. 3 MarkenG","§ 125b Nr. 1 MarkenG, Art. 9 Abs. 2 lit. c, Art. 8 Abs. 5 UMV"],["Bekanntheit im Inland (Bundesgebiet)","Bekanntheit in der Union"],["Ein wesentlicher Teil des Bundesgebiets genügt","Ein wesentlicher Teil der Union; das Gebiet eines einzigen Mitgliedstaats kann genügen (PAGO)"],["Keine","Für Ausnutzung/Beeinträchtigung in Deutschland muss ein wirtschaftlich nicht unbedeutender Teil des deutschen Publikums die Marke kennen (Iron & Smith)"],["EuGH General Motors; BGH TÜV II","EuGH PAGO; EuGH Iron & Smith"]],"merksatz":"Unionsmarke: bekannt in der Union reicht für den Tatbestand, aber ohne Bekanntheit beim deutschen Publikum keine Verknüpfung in Deutschland."},{"id":"distinction:d_marke_unionsmarke_irmarke","type":"distinction","label":"Deutsche Marke vs. Unionsmarke vs. IR-Marke","frage":"Welche Normen gelten, wenn aus einer deutschen Marke, einer Unionsmarke oder einer IR-Marke vorgegangen wird?","kriterien":["Rechtsgrundlage","Amt / Entstehung","Zeitrang","Verletzungstatbestand","Annexansprüche","Gericht","Bekanntheit","Rechtserhaltende Benutzung","Beginn der Benutzungsschonfrist","Angriff auf die Marke","Besonderheiten"],"spalten":["Deutsche Marke","Unionsmarke","IR-Marke (Benennung DE)"],"rows":[["MarkenG","UMV (VO (EU) 2017/1001) + § 125b ff. MarkenG","PMMA/MMA + §§ 107-125 MarkenG (v.a. §§ 112-117 über § 124)"],["DPMA, Eintragung (§ 4 Nr. 1)","EUIPO, Eintragung mit einheitlicher Wirkung in der EU","WIPO auf Basis einer Basismarke; Schutzerstreckung auf DE durch Benennung"],["Anmeldetag (§ 6 Abs. 2, § 33)","Anmeldetag beim EUIPO; Seniorität nationaler Marken (Art. 39, 40 UMV)","Tag der internationalen Registrierung bzw. nachträglichen Schutzerstreckung (§ 112)"],["§ 14 Abs. 2 Nr. 1-3","Art. 9 Abs. 2 lit. a-c UMV","§ 14 Abs. 2 Nr. 1-3 (Wirkung wie deutsche Marke, § 112)"],["§§ 14 Abs. 5-7, 18-19c","Art. 130 UMV + §§ 14 Abs. 6, 7, 18-19c über § 125b Nr. 2","§§ 14 Abs. 5-7, 18-19c; Einrede § 25 mit § 117"],["Landgericht, Kennzeichenstreitsache (§ 140)","Unionsmarkengericht (§ 125e, Art. 123 ff. UMV); Verbot grundsätzlich unionsweit","Landgericht (§ 140)"],["Im Inland","In der Union (§ 125b Nr. 1; PAGO, Iron & Smith)","Im Inland"],["§ 26: im Inland","Art. 18 UMV: in der Union, Grenzen der Mitgliedstaaten unbeachtlich (Leno Merken); § 125b Nr. 4, 5","§ 26: im Inland"],["Eintragung (§ 26 Abs. 5: ggf. Ende des Widerspruchsverfahrens)","Eintragung der Unionsmarke (Art. 18 Abs. 1 UMV)","Ablauf der Schutzverweigerungsfrist oder rechtskräftige Schutzgewährung (§ 115 Abs. 2, §§ 116, 117)"],["Widerspruch § 42, Verfall § 49, Nichtigkeit §§ 50, 51","Widerspruch Art. 46/Art. 8, Verfall Art. 58, Nichtigkeit Art. 59, 60 UMV (EUIPO) oder Widerklage Art. 128","Schutzverweigerung § 113, Widerspruch § 114, Schutzentziehung § 115; 'central attack' auf die Basismarke (Art. 6 PMMA)"],["–","Umwandlung in nationale Anmeldungen (Art. 139 ff. UMV, § 125d); Koexistenz mit nationalen Marken","Benennung EU = Unionsmarke (Art. 189 ff. UMV); Umwandlung § 125"]],"merksatz":"Deutsche Marke: MarkenG pur. Unionsmarke: UMV plus Brücke § 125b. IR-Marke: wie deutsche Marke (§ 112), aber eigene Fristen (§ 115 Abs. 2) und Schutzverweigerung statt Löschung."},{"id":"distinction:d_markenrl_umsetzung","type":"distinction","label":"Umsetzungstabelle: Markenrechtsrichtlinie (EU) 2015/2436 und MarkenG","frage":"Welche Vorschrift des MarkenG setzt welchen Artikel der MarkenRL um, und was hat das MaMoG 2019 geändert?","kriterien":["Markenformen","Absolute Schutzhindernisse","Relative Schutzhindernisse","Zeitpunkt / Zwischenrecht","Verwirkung durch Duldung","Rechte aus der Marke","Transit","Vorbereitungshandlungen","Nachschlagewerke","Agentenmarke","Schranken","Erschöpfung","Benutzung","Nichtbenutzungseinrede","Verfall","Lizenz","Kollektiv-/Gewährleistungsmarke","Anmeldung / Klassifizierung","Widerspruch","Verfall/Nichtigkeit vor dem Amt","Wirkungen","Schutzdauer"],"spalten":["MarkenRL","MarkenG","Änderung durch das MaMoG 2019"],"rows":[["Art. 3","§ 3 Abs. 1, § 8 Abs. 1","Graphische Darstellbarkeit entfällt; neue Markenformen (Klang, Bewegung, Multimedia, Hologramm)"],["Art. 4","§ 3 Abs. 2, § 8 Abs. 2, Abs. 3, § 50","Formausschluss auch für „andere charakteristische Merkmale“; Bösgläubigkeit Nr. 14; Nr. 9 bis 13 neu"],["Art. 5","§§ 9 bis 13, § 42, § 51, § 125b","Bekanntheitsschutz im Register zwingend und für alle Waren (§ 9 Abs. 1 Nr. 3)"],["Art. 8, 18","§ 22, § 51 Abs. 3, Abs. 4","Kennzeichnungskraft und Bekanntheit der älteren Marke werden zum Prioritätstag der jüngeren beurteilt"],["Art. 9","§ 21, § 51 Abs. 2","Unverändert (bereits RL 2008/95)"],["Art. 10","§ 14 Abs. 1 bis 3, § 15","Benutzung als Unternehmensbezeichnung ausdrücklich Verletzungshandlung (§ 14 Abs. 3 Nr. 5); vergleichende Werbung (Nr. 7)"],["Art. 10 Abs. 4","§ 14a","Neu: Verbot der Durchfuhr gefälschter Ware unter zollamtlicher Überwachung"],["Art. 11","§ 14 Abs. 4","Erweitert um Sicherheits- und Echtheitshinweise"],["Art. 12","§ 16","Unverändert"],["Art. 13","§ 11, § 17","Unverändert"],["Art. 14","§ 23","Namensschranke nur noch für natürliche Personen; referierende Benutzung ausdrücklich"],["Art. 15","§ 24","Unverändert (unionsweite Erschöpfung)"],["Art. 16","§ 26, §§ 115 bis 117","Schonfrist beginnt mit Abschluss des Widerspruchsverfahrens (§ 26 Abs. 5); abweichende Form auch bei eigener Eintragung (§ 26 Abs. 3 S. 2)"],["Art. 17, 44, 46","§ 25, § 43 Abs. 1, § 53 Abs. 6","Fünfjahreszeitraum im Widerspruch bezogen auf den Anmeldetag der jüngeren Marke"],["Art. 19 bis 21","§ 49","Unverändert"],["Art. 25","§ 30","Unverändert"],["Art. 27 bis 36","§§ 97 bis 106, §§ 106a bis 106h","Neu: Gewährleistungsmarke (§§ 106a ff.)"],["Art. 37 bis 42","§§ 32, 33, 40, 46","Klarheit des Verzeichnisses, Klassengebühren"],["Art. 43","§ 42","Widerspruch aus mehreren Rechten; Cooling-off (§ 42 Abs. 4)"],["Art. 45","§ 53, § 54","Neu seit 1.5.2020: vollständiges Verfalls- und Nichtigkeitsverfahren vor dem DPMA; § 55 nur noch für Verfall und relative Nichtigkeit"],["Art. 47","§ 52","Unverändert (Verfall ex nunc, Nichtigkeit ex tunc)"],["Art. 48, 49","§ 47","Fristen laufen tagesgenau ab dem Anmeldetag"]],"merksatz":"MarkenRL = Bauplan, MarkenG = Gebäude: Bei jeder Norm des MarkenG lohnt der Blick auf den zugehörigen Artikel, weil der EuGH das letzte Wort zur Auslegung hat."},{"id":"schema:schema_markenverletzung","type":"schema","label":"Unterlassungsanspruch wegen Markenverletzung (§ 14 Abs. 2, 5 MarkenG)","kategorie":"Verletzung","beschreibung":"Zentrales Klausurschema: Anspruch des Markeninhabers gegen den Verletzer auf Unterlassung. Schadensersatz (§ 14 Abs. 6) und Annexansprüche (§§ 18, 19) bauen auf dem gleichen Tatbestand auf."},{"id":"step:schema_markenverletzung.1","type":"step","label":"A. Anspruchsgrundlage","text":"§ 14 Abs. 5 S. 1 i.V.m. Abs. 2 Nr. 1, 2 oder 3 MarkenG.","hinweis":"","order":1},{"id":"step:schema_markenverletzung.2","type":"step","label":"B. Schutzfähige Marke des Anspruchstellers","text":"","hinweis":"","order":2},{"id":"step:schema_markenverletzung.2.1","type":"step","label":"1. Bestehen des Markenschutzes","text":"Eintragung (§ 4 Nr. 1), Verkehrsgeltung (§ 4 Nr. 2) oder notorische Bekanntheit (§ 4 Nr. 3). Bei der eingetragenen Marke ist das Verletzungsgericht an die Eintragung gebunden – absolute Schutzhindernisse werden nicht geprüft (Einwand nur über Löschungsverfahren/Widerklage, ggf. Aussetzung).","hinweis":"","order":1},{"id":"step:schema_markenverletzung.2.2","type":"step","label":"2. Aktivlegitimation","text":"Markeninhaber (§ 28 Abs. 1 Vermutung) oder Lizenznehmer mit Zustimmung (§ 30 Abs. 3).","hinweis":"","order":2},{"id":"step:schema_markenverletzung.2.3","type":"step","label":"3. Zeitrang / Priorität","text":"Die Klagemarke muss gegenüber dem angegriffenen Zeichen prioritätsälter sein (§ 6); der Beklagte kann ein eigenes älteres Recht einwenden.","hinweis":"","order":3},{"id":"step:schema_markenverletzung.3","type":"step","label":"C. Verletzungshandlung (§ 14 Abs. 2)","text":"","hinweis":"","order":3},{"id":"step:schema_markenverletzung.3.1","type":"step","label":"1. Benutzung im geschäftlichen Verkehr","text":"","hinweis":"","order":1},{"id":"step:schema_markenverletzung.3.2","type":"step","label":"2. Ohne Zustimmung des Markeninhabers","text":"Zustimmung z.B. durch Lizenz (§ 30); Grenzen des § 30 Abs. 2 beachten.","hinweis":"","order":2},{"id":"step:schema_markenverletzung.3.3","type":"step","label":"3. Benutzungshandlung","text":"Benutzung für Waren/Dienstleistungen, insbesondere die Handlungen des § 14 Abs. 3 (Anbringen, Anbieten, Inverkehrbringen, Ein-/Ausfuhr, Verwendung in Geschäftspapieren und Werbung, Verwendung als Handelsname) und Vorbereitungshandlungen nach § 14 Abs. 4.","hinweis":"","order":3},{"id":"step:schema_markenverletzung.3.4","type":"step","label":"4. Markenmäßige (rechtsverletzende) Benutzung","text":"Beeinträchtigung einer Markenfunktion, insbesondere der Herkunftsfunktion: Der Verkehr versteht das Zeichen als Herkunftshinweis. Abgrenzung zur rein beschreibenden, dekorativen oder firmenmäßigen Verwendung.","hinweis":"","order":4},{"id":"step:schema_markenverletzung.3.5","type":"step","label":"5. Kollisionstatbestand","text":"","hinweis":"","order":5},{"id":"step:schema_markenverletzung.3.5.1","type":"step","label":"a) § 14 Abs. 2 Nr. 1 – Doppelidentität","text":"Zeichenidentität + Waren-/Dienstleistungsidentität. Keine Verwechslungsgefahr erforderlich; Beeinträchtigung irgendeiner Markenfunktion genügt.","hinweis":"","order":1},{"id":"step:schema_markenverletzung.3.5.2","type":"step","label":"b) § 14 Abs. 2 Nr. 2 – Verwechslungsgefahr","text":"Zeichenidentität/-ähnlichkeit + Waren-/Dienstleistungsidentität/-ähnlichkeit + Verwechslungsgefahr (siehe eigenes Schema).","hinweis":"","order":2},{"id":"step:schema_markenverletzung.3.5.3","type":"step","label":"c) § 14 Abs. 2 Nr. 3 – Bekanntheitsschutz","text":"Bekannte Marke + Zeichenidentität/-ähnlichkeit + gedankliche Verknüpfung + Ausnutzung/Beeinträchtigung der Unterscheidungskraft oder Wertschätzung + ohne rechtfertigenden Grund in unlauterer Weise (siehe eigenes Schema).","hinweis":"","order":3},{"id":"step:schema_markenverletzung.4","type":"step","label":"D. Keine Schranken / Einwendungen","text":"","hinweis":"","order":4},{"id":"step:schema_markenverletzung.4.1","type":"step","label":"1. § 23 – Namen, beschreibende Angaben, Bestimmungshinweis","text":"","hinweis":"","order":1},{"id":"step:schema_markenverletzung.4.2","type":"step","label":"2. § 24 – Erschöpfung","text":"","hinweis":"","order":2},{"id":"step:schema_markenverletzung.4.3","type":"step","label":"3. § 25 – Einrede der Nichtbenutzung","text":"Nach Ablauf der Benutzungsschonfrist: Inhaber muss rechtserhaltende Benutzung nachweisen (§ 26).","hinweis":"","order":3},{"id":"step:schema_markenverletzung.4.4","type":"step","label":"4. § 21 – Verwirkung; § 22 – Bestandskraft jüngerer Marke","text":"§ 22: keine Untersagung einer eingetragenen jüngeren Marke, wenn die Klagemarke an deren Prioritätstag noch nicht bekannt war, löschungsreif war oder noch keine Verwechslungsgefahr bestand.","hinweis":"","order":4},{"id":"step:schema_markenverletzung.4.5","type":"step","label":"5. Älteres Recht des Beklagten (§ 6) / Löschungsreife der Klagemarke","text":"Einrede des besseren Zeitrangs; Löschungsreife der Klagemarke wegen Verfalls (§ 49) oder Nichtigkeit (§§ 50, 51) – im Verletzungsprozess über Widerklage bzw. § 52.","hinweis":"","order":5},{"id":"step:schema_markenverletzung.4.6","type":"step","label":"6. Verjährung (§ 20)","text":"","hinweis":"","order":6},{"id":"step:schema_markenverletzung.5","type":"step","label":"E. Rechtsfolge: Unterlassung (§ 14 Abs. 5)","text":"Wiederholungsgefahr (vermutet nach Verletzung; Wegfall nur durch strafbewehrte Unterlassungserklärung) oder Erstbegehungsgefahr (§ 14 Abs. 5 S. 2). Kein Verschulden erforderlich. Passivlegitimation: Täter, Teilnehmer, Störer.","hinweis":"","order":5},{"id":"step:schema_markenverletzung.6","type":"step","label":"F. Weitere Ansprüche","text":"","hinweis":"","order":6},{"id":"step:schema_markenverletzung.6.1","type":"step","label":"Schadensersatz (§ 14 Abs. 6)","text":"Zusätzlich: Verschulden (Vorsatz/Fahrlässigkeit). Dreifache Schadensberechnung: konkreter Schaden, Verletzergewinn, Lizenzanalogie. Haftung für Angestellte/Beauftragte (§ 14 Abs. 7).","hinweis":"","order":1},{"id":"step:schema_markenverletzung.6.2","type":"step","label":"Vernichtung/Rückruf (§ 18), Auskunft (§ 19), Vorlage (§ 19a), Urteilsbekanntmachung (§ 19c)","text":"","hinweis":"","order":2},{"id":"step:schema_markenverletzung.6.3","type":"step","label":"Bereicherung (§ 812 BGB), GoA; Ansprüche aus anderen Vorschriften (§ 19d): UWG, § 12 BGB","text":"","hinweis":"","order":3},{"id":"schema:schema_verwechslungsgefahr","type":"schema","label":"Verwechslungsgefahr (§ 14 Abs. 2 Nr. 2 / § 9 Abs. 1 Nr. 2 MarkenG)","kategorie":"Verletzung","beschreibung":"Umfassende Beurteilung aller Umstände des Einzelfalls unter Berücksichtigung der Wechselwirkung zwischen Waren-/Dienstleistungsähnlichkeit, Kennzeichnungskraft der älteren Marke und Zeichenähnlichkeit."},{"id":"step:schema_verwechslungsgefahr.1","type":"step","label":"1. Maßgebliche Verkehrskreise und Aufmerksamkeitsgrad","text":"Normal informierter, angemessen aufmerksamer und verständiger Durchschnittsverbraucher der konkreten Waren; bei gespaltener Verkehrsauffassung genügt Verwechslungsgefahr in einer Gruppe.","hinweis":"","order":1},{"id":"step:schema_verwechslungsgefahr.2","type":"step","label":"2. Waren-/Dienstleistungsidentität oder -ähnlichkeit","text":"Registerlage der Klagemarke vs. konkret benutzte Waren. Faktoren: Art, Verwendungszweck, Nutzung, Konkurrenz-/Ergänzungsverhältnis, Herstellungsstätten, Vertriebswege. Bei absoluter Unähnlichkeit: Ende der Prüfung (ggf. Nr. 3).","hinweis":"","order":2},{"id":"step:schema_verwechslungsgefahr.3","type":"step","label":"3. Kennzeichnungskraft der älteren Marke","text":"Originäre Kennzeichnungskraft (Eigenart des Zeichens; beschreibende Anklänge schwächen) → Steigerung durch Benutzung/Bekanntheit → Schwächung durch Drittzeichen. Ergebnis: sehr gering / gering / durchschnittlich / erhöht / sehr hoch. Bei verkehrsdurchgesetzten Marken: regelmäßig durchschnittlich.","hinweis":"","order":3},{"id":"step:schema_verwechslungsgefahr.4","type":"step","label":"4. Zeichenidentität oder -ähnlichkeit","text":"","hinweis":"","order":4},{"id":"step:schema_verwechslungsgefahr.4.1","type":"step","label":"a) Gesamteindruck","text":"Vergleich der Zeichen in ihrer Gesamtheit aus dem Erinnerungsbild; keine zergliedernde Betrachtung.","hinweis":"","order":1},{"id":"step:schema_verwechslungsgefahr.4.2","type":"step","label":"b) Prägung durch einzelne Bestandteile","text":"Prägetheorie: Ein Bestandteil prägt, wenn die anderen zurücktreten; beschreibende Bestandteile prägen nicht; bekannte Herstellerangaben treten regelmäßig zurück.","hinweis":"","order":2},{"id":"step:schema_verwechslungsgefahr.4.3","type":"step","label":"c) Ähnlichkeit nach Klang, Bild, Sinngehalt","text":"Ähnlichkeit in einer Richtung genügt; Neutralisierung klanglicher Ähnlichkeit durch abweichenden Sinngehalt möglich. Wortmarke vs. 3D-Gestaltung: nur begriffliche Ähnlichkeit.","hinweis":"","order":3},{"id":"step:schema_verwechslungsgefahr.4.4","type":"step","label":"d) Selbständig kennzeichnende Stellung","text":"Übernahme der älteren Marke in ein zusammengesetztes Zeichen (THOMSON LIFE) – Ausnahmefall, besondere Umstände erforderlich.","hinweis":"","order":4},{"id":"step:schema_verwechslungsgefahr.5","type":"step","label":"5. Gesamtabwägung (Wechselwirkung)","text":"Geringere Warenähnlichkeit kann durch höhere Zeichenähnlichkeit oder erhöhte Kennzeichnungskraft ausgeglichen werden und umgekehrt.","hinweis":"","order":5},{"id":"step:schema_verwechslungsgefahr.6","type":"step","label":"6. Art der Verwechslungsgefahr","text":"Unmittelbar (Zeichen werden verwechselt) – mittelbar (Serienzeichen, gemeinsamer Stammbestandteil) – im weiteren Sinne (Annahme wirtschaftlicher/organisatorischer Verbindungen; Ausnahme, besondere Umstände).","hinweis":"","order":6},{"id":"schema:schema_bekanntheitsschutz","type":"schema","label":"Bekanntheitsschutz (§ 14 Abs. 2 Nr. 3 MarkenG)","kategorie":"Verletzung","beschreibung":"Erweiterter Schutz bekannter Marken über die Herkunftsfunktion hinaus – auch außerhalb des Ähnlichkeitsbereichs der Waren und ohne Verwechslungsgefahr."},{"id":"step:schema_bekanntheitsschutz.1","type":"step","label":"1. Bekannte Marke im Inland","text":"Bekanntheit bei einem bedeutenden Teil des von den Waren/Dienstleistungen angesprochenen Publikums; keine festen Prozentsätze; Faktoren: Marktanteil, Intensität, Dauer, Werbeaufwand. Maßgeblicher Zeitpunkt: Kollisionszeitpunkt (Verletzung) bzw. Anmeldetag des jüngeren Zeichens (§ 22 Abs. 1 Nr. 1, § 51 Abs. 3). Bei Unionsmarken: Bekanntheit in der Union (Art. 9 Abs. 2 lit. c UMV, § 125b Nr. 1).","hinweis":"","order":1},{"id":"step:schema_bekanntheitsschutz.2","type":"step","label":"2. Zeichenidentität oder -ähnlichkeit","text":"Gleiche Maßstäbe wie bei Nr. 2, aber es genügt ein Grad der Ähnlichkeit, der zur gedanklichen Verknüpfung führt.","hinweis":"","order":2},{"id":"step:schema_bekanntheitsschutz.3","type":"step","label":"3. Benutzung für Waren/Dienstleistungen (auch bei Identität/Ähnlichkeit)","text":"Nach richtlinienkonformer Auslegung auch im Ähnlichkeitsbereich anwendbar (OTTO Cap). Markenmäßige Benutzung: gedankliche Verknüpfung genügt; Beeinträchtigung der Herkunftsfunktion nicht erforderlich.","hinweis":"","order":3},{"id":"step:schema_bekanntheitsschutz.4","type":"step","label":"4. Gedankliche Verknüpfung","text":"Der Verkehr bringt das Zeichen mit der bekannten Marke in Verbindung (Assoziation), ohne sie zu verwechseln. Notwendige, aber nicht hinreichende Voraussetzung.","hinweis":"","order":4},{"id":"step:schema_bekanntheitsschutz.5","type":"step","label":"5. Eingriffstatbestand (eine Alternative genügt)","text":"","hinweis":"","order":5},{"id":"step:schema_bekanntheitsschutz.5.1","type":"step","label":"a) Ausnutzung der Unterscheidungskraft (Aufmerksamkeitsausbeutung)","text":"","hinweis":"","order":1},{"id":"step:schema_bekanntheitsschutz.5.2","type":"step","label":"b) Ausnutzung der Wertschätzung (Rufausbeutung, Imagetransfer)","text":"","hinweis":"","order":2},{"id":"step:schema_bekanntheitsschutz.5.3","type":"step","label":"c) Beeinträchtigung der Unterscheidungskraft (Verwässerung)","text":"Nachweis der (Gefahr einer) Änderung des wirtschaftlichen Verhaltens der Verbraucher (Intel).","hinweis":"","order":3},{"id":"step:schema_bekanntheitsschutz.5.4","type":"step","label":"d) Beeinträchtigung der Wertschätzung (Rufschädigung/Verunglimpfung)","text":"","hinweis":"","order":4},{"id":"step:schema_bekanntheitsschutz.6","type":"step","label":"6. Ohne rechtfertigenden Grund in unlauterer Weise","text":"Umfassende Interessenabwägung; Grundrechte (Kunst-, Meinungsfreiheit), zulässige vergleichende Werbung, Alternativangebot bei Keyword-Werbung als rechtfertigende Gründe.","hinweis":"","order":6},{"id":"step:schema_bekanntheitsschutz.7","type":"step","label":"7. Keine Schranken (§§ 23, 24)","text":"","hinweis":"","order":7},{"id":"schema:schema_eintragungsfaehigkeit","type":"schema","label":"Schutzfähigkeit / Eintragungsfähigkeit einer Marke (§§ 3, 7, 8 MarkenG)","kategorie":"Schutzvoraussetzungen","beschreibung":"Prüfung im Eintragungsverfahren (§§ 36, 37) und im Nichtigkeitsverfahren (§ 50). Reihenfolge: Markenfähigkeit → Inhaberschaft → Darstellbarkeit → absolute Schutzhindernisse → Verkehrsdurchsetzung."},{"id":"step:schema_eintragungsfaehigkeit.1","type":"step","label":"1. Markenfähigkeit (§ 3 Abs. 1)","text":"Abstrakte Unterscheidungseignung des Zeichens (losgelöst von den konkreten Waren). Nur ausnahmsweise zu verneinen.","hinweis":"","order":1},{"id":"step:schema_eintragungsfaehigkeit.2","type":"step","label":"2. Kein Formausschluss (§ 3 Abs. 2)","text":"Form/charakteristisches Merkmal durch Art der Ware bedingt (Nr. 1), technisch erforderlich (Nr. 2) oder wertverleihend (Nr. 3)? Nicht durch Verkehrsdurchsetzung überwindbar.","hinweis":"","order":2},{"id":"step:schema_eintragungsfaehigkeit.3","type":"step","label":"3. Inhaberschaft (§ 7)","text":"Natürliche Personen, juristische Personen, rechtsfähige Personengesellschaften.","hinweis":"","order":3},{"id":"step:schema_eintragungsfaehigkeit.4","type":"step","label":"4. Darstellbarkeit im Register (§ 8 Abs. 1)","text":"Klare und eindeutige Bestimmbarkeit des Schutzgegenstands (Sieckmann-Kriterien); graphische Darstellbarkeit nicht mehr erforderlich.","hinweis":"","order":4},{"id":"step:schema_eintragungsfaehigkeit.5","type":"step","label":"5. Keine absoluten Schutzhindernisse (§ 8 Abs. 2)","text":"","hinweis":"","order":5},{"id":"step:schema_eintragungsfaehigkeit.5.1","type":"step","label":"Nr. 1 – Fehlende Unterscheidungskraft","text":"Konkrete Eignung als Herkunftshinweis für die beanspruchten Waren; großzügiger Maßstab; alle praktisch bedeutsamen Verwendungsformen; Sicht des Durchschnittsverbrauchers im Anmeldezeitpunkt.","hinweis":"","order":1},{"id":"step:schema_eintragungsfaehigkeit.5.2","type":"step","label":"Nr. 2 – Freihaltebedürfnis an beschreibenden Angaben","text":"Kann die Angabe zur Beschreibung von Merkmalen der Waren dienen (auch künftig)? Allgemeininteresse der Mitbewerber.","hinweis":"","order":2},{"id":"step:schema_eintragungsfaehigkeit.5.3","type":"step","label":"Nr. 3 – Üblich gewordene Bezeichnungen","text":"","hinweis":"","order":3},{"id":"step:schema_eintragungsfaehigkeit.5.4","type":"step","label":"Nr. 4 – Täuschungseignung (nur wenn ersichtlich, § 37 Abs. 3)","text":"","hinweis":"","order":4},{"id":"step:schema_eintragungsfaehigkeit.5.5","type":"step","label":"Nr. 5 – Verstoß gegen öffentliche Ordnung / gute Sitten","text":"","hinweis":"","order":5},{"id":"step:schema_eintragungsfaehigkeit.5.6","type":"step","label":"Nr. 6-8 – Hoheitszeichen, amtliche Prüfzeichen, Kennzeichen internationaler Organisationen","text":"","hinweis":"","order":6},{"id":"step:schema_eintragungsfaehigkeit.5.7","type":"step","label":"Nr. 9-13 – Sonstige gesetzliche Verbote, geschützte Ursprungsbezeichnungen, traditionelle Bezeichnungen, Sortenbezeichnungen","text":"","hinweis":"","order":7},{"id":"step:schema_eintragungsfaehigkeit.5.8","type":"step","label":"Nr. 14 – Bösgläubige Anmeldung (nur wenn ersichtlich, § 37 Abs. 3)","text":"","hinweis":"","order":8},{"id":"step:schema_eintragungsfaehigkeit.6","type":"step","label":"6. Überwindung von Nr. 1-3 durch Verkehrsdurchsetzung (§ 8 Abs. 3)","text":"Durchsetzung in den beteiligten Verkehrskreisen vor dem Anmeldetag; Richtwert mind. 50 % Zuordnung; Nachweis v.a. durch demoskopisches Gutachten.","hinweis":"","order":6},{"id":"step:schema_eintragungsfaehigkeit.7","type":"step","label":"7. Verfahren","text":"Prüfung von Amts wegen (§ 37); Zurückweisung; Beschwerde BPatG (§ 66); Rechtsbeschwerde BGH (§ 83). Nach Eintragung: Nichtigkeit § 50 (Feststellungslast beim Antragsteller; Zehnjahresfrist für Nr. 1-3).","hinweis":"","order":7},{"id":"schema:schema_schranke_23","type":"schema","label":"Schranke des § 23 MarkenG (Namen, beschreibende Angaben, Bestimmungshinweis)","kategorie":"Schranken","beschreibung":"Einwendung des Verletzers: Auch eine an sich tatbestandsmäßige Benutzung kann nicht untersagt werden, wenn sie einer der drei Fallgruppen unterfällt und den anständigen Gepflogenheiten entspricht."},{"id":"step:schema_schranke_23.1","type":"step","label":"1. Tatbestand des § 14 Abs. 2 erfüllt","text":"§ 23 ist erst zu prüfen, wenn eine rechtsverletzende Benutzung vorliegt (bei rein beschreibender Verwendung fehlt bereits die markenmäßige Benutzung).","hinweis":"","order":1},{"id":"step:schema_schranke_23.2","type":"step","label":"2. Fallgruppe","text":"","hinweis":"","order":2},{"id":"step:schema_schranke_23.2.1","type":"step","label":"Nr. 1 – Name oder Anschrift des Dritten","text":"Nur natürliche Personen (nach MaMoG). Recht der Gleichnamigen.","hinweis":"","order":1},{"id":"step:schema_schranke_23.2.2","type":"step","label":"Nr. 2 – Zeichen ohne Unterscheidungskraft / beschreibende Angaben","text":"Benutzung von Angaben über Art, Beschaffenheit, Bestimmung usw. – auch wenn sie mit einer (verkehrsdurchgesetzten) Marke identisch sind.","hinweis":"","order":2},{"id":"step:schema_schranke_23.2.3","type":"step","label":"Nr. 3 – Bestimmungshinweis (Zubehör, Ersatzteile, Kompatibilität)","text":"Benutzung muss notwendig sein: praktisch einziges Mittel, um über die Bestimmung zu informieren (Gillette). Wortmarke statt Logo; keine Emblem-Nachbildung.","hinweis":"","order":3},{"id":"step:schema_schranke_23.3","type":"step","label":"3. Anständige Gepflogenheiten in Gewerbe oder Handel (§ 23 Abs. 2)","text":"Verstoß, wenn (a) eine geschäftliche Verbindung zum Markeninhaber suggeriert wird, (b) die Unterscheidungskraft/Wertschätzung unlauter ausgenutzt wird, (c) die Marke herabgesetzt wird oder (d) die eigene Ware als Imitation dargestellt wird. Die Eigenmarke muss im Vordergrund stehen.","hinweis":"","order":3},{"id":"schema:schema_erschoepfung","type":"schema","label":"Erschöpfung (§ 24 MarkenG)","kategorie":"Schranken","beschreibung":"Einwendung gegen Ansprüche wegen des Weitervertriebs von Originalware."},{"id":"step:schema_erschoepfung.1","type":"step","label":"1. Originalware (Echtheit)","text":"Die konkrete Ware wurde vom Markeninhaber oder mit seiner Zustimmung mit der Marke versehen. Bei Bestreiten: Beweislast beim Beklagten (Converse I).","hinweis":"","order":1},{"id":"step:schema_erschoepfung.2","type":"step","label":"2. Inverkehrbringen im Inland, in der EU oder im EWR","text":"Übertragung der tatsächlichen Verfügungsgewalt mit Verwertungsmöglichkeit innerhalb des EWR. Keine internationale Erschöpfung: Ware aus Drittstaaten ist nicht erschöpft.","hinweis":"","order":2},{"id":"step:schema_erschoepfung.3","type":"step","label":"3. Durch den Inhaber oder mit seiner Zustimmung","text":"Zustimmung durch Lizenz; Verstoß des Lizenznehmers gegen § 30 Abs. 2 = ohne Zustimmung (Converse II). Beweislast grundsätzlich beim Beklagten; Umkehr bei ausschließlichem Vertriebssystem und Marktabschottungsgefahr.","hinweis":"","order":3},{"id":"step:schema_erschoepfung.4","type":"step","label":"4. Keine berechtigten Gründe (§ 24 Abs. 2)","text":"Veränderung/Verschlechterung der Ware; Umverpacken nur nach den BMS-Kriterien; erhebliche Rufschädigung durch Werbung (Dior/Evora); Suggestion einer Vertragshändlerbeziehung.","hinweis":"","order":4},{"id":"step:schema_erschoepfung.5","type":"step","label":"5. Reichweite","text":"Erschöpfung erfasst Weitervertrieb und Werbung für die konkreten Warenstücke; nicht die Verwendung der Marke für andere Waren oder als Unternehmenskennzeichen.","hinweis":"","order":5},{"id":"schema:schema_benutzungszwang","type":"schema","label":"Rechtserhaltende Benutzung und Verfall (§§ 25, 26, 49 MarkenG)","kategorie":"Benutzungszwang","beschreibung":"Prüfung der Nichtbenutzungseinrede (§ 25 im Verletzungsprozess, § 43 Abs. 1 im Widerspruchsverfahren) und des Verfallsantrags (§ 49 Abs. 1)."},{"id":"step:schema_benutzungszwang.1","type":"step","label":"1. Ablauf der Benutzungsschonfrist","text":"Fünf Jahre seit Eintragung bzw. seit Abschluss des Widerspruchsverfahrens (§ 26 Abs. 5). Vorher ist die Einrede unbeachtlich.","hinweis":"","order":1},{"id":"step:schema_benutzungszwang.2","type":"step","label":"2. Maßgeblicher Fünfjahreszeitraum","text":"§ 25 Abs. 2: fünf Jahre vor Klageerhebung (und ggf. vor Schluss der mündlichen Verhandlung); § 49 Abs. 1: ununterbrochene fünf Jahre vor dem Löschungsantrag; Heilung durch Benutzungsaufnahme (§ 49 Abs. 1 S. 2, 3).","hinweis":"","order":2},{"id":"step:schema_benutzungszwang.3","type":"step","label":"3. Voraussetzungen der rechtserhaltenden Benutzung (§ 26)","text":"","hinweis":"","order":3},{"id":"step:schema_benutzungszwang.3.1","type":"step","label":"a) Ernsthafte Benutzung","text":"Benutzung entsprechend der Hauptfunktion zur Erschließung/Sicherung eines Absatzmarkts; keine Scheinbenutzung; kein Mindestumfang.","hinweis":"","order":1},{"id":"step:schema_benutzungszwang.3.2","type":"step","label":"b) Benutzung als Marke (funktionsgemäß)","text":"Der Verkehr muss die Verwendung als Herkunftshinweis für die Waren verstehen; rein firmenmäßige oder beschreibende Verwendung genügt nicht (aber: LOTTOCARD).","hinweis":"","order":2},{"id":"step:schema_benutzungszwang.3.3","type":"step","label":"c) Für die eingetragenen Waren/Dienstleistungen","text":"Teilbenutzung: Bei Oberbegriffen bleibt der Schutz für die Untergruppe erhalten, der die benutzten Waren angehören (Integrationsfrage, § 49 Abs. 3).","hinweis":"","order":3},{"id":"step:schema_benutzungszwang.3.4","type":"step","label":"d) Im Inland","text":"Auch Anbringen auf Waren/Verpackungen allein für den Export genügt (§ 26 Abs. 4).","hinweis":"","order":4},{"id":"step:schema_benutzungszwang.3.5","type":"step","label":"e) Durch den Inhaber oder mit seiner Zustimmung (§ 26 Abs. 2)","text":"Lizenznehmer, Konzernunternehmen.","hinweis":"","order":5},{"id":"step:schema_benutzungszwang.3.6","type":"step","label":"f) In eingetragener oder nur unwesentlich abweichender Form (§ 26 Abs. 3)","text":"Kennzeichnender Charakter darf nicht verändert werden; unschädliche Zusätze vs. Verschmelzung zu neuem Gesamtzeichen.","hinweis":"","order":6},{"id":"step:schema_benutzungszwang.4","type":"step","label":"4. Berechtigte Gründe für die Nichtbenutzung","text":"Hindernisse außerhalb des Einflussbereichs des Inhabers (z.B. Zulassungsverfahren, Einfuhrverbote), nicht bloße wirtschaftliche Schwierigkeiten.","hinweis":"","order":4},{"id":"step:schema_benutzungszwang.5","type":"step","label":"5. Beweis-/Glaubhaftmachungslast","text":"Verletzungsprozess: voller Beweis durch den Markeninhaber; Widerspruchsverfahren: Glaubhaftmachung (§ 43 Abs. 1); Verfallsverfahren: Inhaber muss Benutzung darlegen (§ 53 Abs. 5, § 55 Abs. 3).","hinweis":"","order":5},{"id":"step:schema_benutzungszwang.6","type":"step","label":"6. Rechtsfolge","text":"Einrede: Ansprüche ausgeschlossen (§ 25). Verfall: Löschung mit Wirkung ab Antrag oder früherem Verfallszeitpunkt (§ 52 Abs. 1).","hinweis":"","order":6},{"id":"schema:schema_unternehmenskennzeichen","type":"schema","label":"Schutz geschäftlicher Bezeichnungen (§§ 5, 15 MarkenG)","kategorie":"Geschäftliche Bezeichnungen","beschreibung":"Unterlassungsanspruch aus § 15 Abs. 4 i.V.m. Abs. 2 (Verwechslungsgefahr) oder Abs. 3 (bekannte geschäftliche Bezeichnung)."},{"id":"step:schema_unternehmenskennzeichen.1","type":"step","label":"1. Schutzfähige geschäftliche Bezeichnung (§ 5)","text":"","hinweis":"","order":1},{"id":"step:schema_unternehmenskennzeichen.1.1","type":"step","label":"a) Unternehmenskennzeichen (§ 5 Abs. 2)","text":"Name, Firma, besondere Geschäftsbezeichnung; Firmenschlagwort/-bestandteil; Domain. Entstehung: Benutzungsaufnahme im Inland + originäre Unterscheidungskraft, sonst Verkehrsgeltung (§ 5 Abs. 2 S. 2 für Geschäftsabzeichen).","hinweis":"","order":1},{"id":"step:schema_unternehmenskennzeichen.1.2","type":"step","label":"b) Werktitel (§ 5 Abs. 3)","text":"Titelschutzfähiges Werk (Druckschrift, Film, Ton, Bühne, Software, App, Website); Unterscheidungskraft (abgesenkter Maßstab bei Verkehrsgewöhnung); Benutzungsaufnahme / Titelschutzanzeige.","hinweis":"","order":2},{"id":"step:schema_unternehmenskennzeichen.2","type":"step","label":"2. Priorität (§ 6)","text":"Zeitpunkt der Benutzungsaufnahme bzw. des Erwerbs der Verkehrsgeltung; Vergleich mit dem Zeitrang des angegriffenen Zeichens.","hinweis":"","order":2},{"id":"step:schema_unternehmenskennzeichen.3","type":"step","label":"3. Verletzungshandlung (§ 15 Abs. 2)","text":"Unbefugte Benutzung im geschäftlichen Verkehr in einer Weise, die geeignet ist, Verwechslungen hervorzurufen: Wechselwirkung von Branchennähe, Kennzeichnungskraft und Zeichenähnlichkeit. Kennzeichenmäßige Benutzung erforderlich.","hinweis":"","order":3},{"id":"step:schema_unternehmenskennzeichen.4","type":"step","label":"4. Alternativ: Bekannte geschäftliche Bezeichnung (§ 15 Abs. 3)","text":"Parallel zu § 14 Abs. 2 Nr. 3: Ausnutzung/Beeinträchtigung der Unterscheidungskraft oder Wertschätzung ohne rechtfertigenden Grund.","hinweis":"","order":4},{"id":"step:schema_unternehmenskennzeichen.5","type":"step","label":"5. Schranken","text":"§ 23 (insb. Gleichnamigkeit), § 21 Verwirkung, § 20 Verjährung; Recht der Gleichnamigen bei redlichem Namensgebrauch.","hinweis":"","order":5},{"id":"step:schema_unternehmenskennzeichen.6","type":"step","label":"6. Rechtsfolgen (§ 15 Abs. 4-6)","text":"Unterlassung, Schadensersatz bei Verschulden, Haftung für Angestellte; §§ 18, 19 entsprechend.","hinweis":"","order":6},{"id":"schema:schema_widerspruch","type":"schema","label":"Widerspruchsverfahren (§§ 42, 43 MarkenG) und relative Schutzhindernisse (§ 9)","kategorie":"Verfahren","beschreibung":"Registerrechtliche Kollisionsprüfung nach Eintragung der jüngeren Marke."},{"id":"step:schema_widerspruch.1","type":"step","label":"1. Zulässigkeit des Widerspruchs","text":"Frist: drei Monate ab Veröffentlichung der Eintragung (§ 42 Abs. 1); Widerspruchsberechtigung: Inhaber eines in § 42 Abs. 2 genannten älteren Rechts (Marke, notorisch bekannte Marke, Benutzungsmarke/geschäftliche Bezeichnung, Ursprungsbezeichnung); Gebühr. Ältere Unionsmarken (§ 125b Nr. 1) und IR-Marken (§ 112, § 116) sind gleichgestellt; gegen IR-Marken gilt § 114.","hinweis":"","order":1},{"id":"step:schema_widerspruch.2","type":"step","label":"2. Einrede der Nichtbenutzung (§ 43 Abs. 1)","text":"Wenn die Widerspruchsmarke seit mehr als fünf Jahren eingetragen ist: Glaubhaftmachung der rechtserhaltenden Benutzung; nur die glaubhaft gemachten Waren werden berücksichtigt (§ 43 Abs. 1 S. 3).","hinweis":"","order":2},{"id":"step:schema_widerspruch.3","type":"step","label":"3. Begründetheit: Kollisionstatbestand des § 9 Abs. 1","text":"","hinweis":"","order":3},{"id":"step:schema_widerspruch.3.1","type":"step","label":"Nr. 1 – Identität von Marke und Waren","text":"","hinweis":"","order":1},{"id":"step:schema_widerspruch.3.2","type":"step","label":"Nr. 2 – Verwechslungsgefahr (Registerlage)","text":"Vergleich nach den Verzeichnissen beider Marken; sonst wie § 14 Abs. 2 Nr. 2.","hinweis":"","order":2},{"id":"step:schema_widerspruch.3.3","type":"step","label":"Nr. 3 – Bekannte ältere Marke","text":"Bekanntheit am Anmeldetag der jüngeren Marke (§ 51 Abs. 3), Prognose der hypothetischen Benutzung nach Registerlage; Details im Schema „Relative Schutzhindernisse im Register“. Aus Unionsmarke: Bekanntheit in der Union (§ 125b Nr. 1).","hinweis":"","order":3},{"id":"step:schema_widerspruch.4","type":"step","label":"4. Entscheidung und Rechtsmittel","text":"Löschung der jüngeren Marke ganz oder teilweise (§ 43 Abs. 2); Beschwerde zum BPatG (§ 66), Rechtsbeschwerde zum BGH (§ 83); alternativ Nichtigkeitsverfahren nach § 51 (auch mit Rechten aus § 13) vor DPMA (§ 53) oder Gericht (§ 55).","hinweis":"","order":4},{"id":"schema:schema_loeschung","type":"schema","label":"Löschung eingetragener Marken: Verfall (§ 49) und Nichtigkeit (§§ 50, 51)","kategorie":"Verfahren","beschreibung":"Angriffe gegen den Bestand einer eingetragenen Marke."},{"id":"step:schema_loeschung.1","type":"step","label":"1. Verfall (§ 49) – ex nunc, Popularantrag","text":"","hinweis":"","order":1},{"id":"step:schema_loeschung.1.1","type":"step","label":"Abs. 1 – Nichtbenutzung über fünf Jahre","text":"","hinweis":"","order":1},{"id":"step:schema_loeschung.1.2","type":"step","label":"Abs. 2 Nr. 1 – Entwicklung zur gebräuchlichen Bezeichnung infolge Verhaltens/Untätigkeit des Inhabers","text":"","hinweis":"","order":2},{"id":"step:schema_loeschung.1.3","type":"step","label":"Abs. 2 Nr. 2 – Täuschungseignung infolge der Benutzung","text":"","hinweis":"","order":3},{"id":"step:schema_loeschung.1.4","type":"step","label":"Abs. 2 Nr. 3 – Wegfall der Inhabervoraussetzungen (§ 7)","text":"","hinweis":"","order":4},{"id":"step:schema_loeschung.2","type":"step","label":"2. Nichtigkeit wegen absoluter Schutzhindernisse (§ 50) – ex tunc, Popularantrag","text":"Verstoß gegen §§ 3, 7, 8 im Anmeldezeitpunkt; bei § 8 Abs. 2 Nr. 1-3 muss das Hindernis noch im Entscheidungszeitpunkt fortbestehen und der Antrag innerhalb von zehn Jahren gestellt werden (§ 50 Abs. 2). Feststellungslast: Antragsteller.","hinweis":"","order":2},{"id":"step:schema_loeschung.3","type":"step","label":"3. Nichtigkeit wegen älterer Rechte (§ 51) – ex tunc, nur Inhaber des älteren Rechts","text":"Kollision nach §§ 9-13; Ausschluss bei Verwirkung (§ 51 Abs. 2), Zustimmung (§ 51 Abs. 3) und Löschungsreife des älteren Rechts (§ 51 Abs. 4).","hinweis":"","order":3},{"id":"step:schema_loeschung.4","type":"step","label":"4. Verfahren","text":"Antrag beim DPMA (§ 53; bei Widerspruch des Inhabers Weiterführung als kontradiktorisches Verfahren) oder Klage vor dem Landgericht (§ 55; für § 50 seit MaMoG nur DPMA). Wirkung: § 52.","hinweis":"","order":4},{"id":"schema:schema_entstehung","type":"schema","label":"Entstehung und Erlöschen des Markenschutzes (§§ 4, 32 ff., 47 ff.)","kategorie":"Grundlagen","beschreibung":"Lebenszyklus einer Marke vom Erwerb bis zum Erlöschen."},{"id":"step:schema_entstehung.1","type":"step","label":"1. Entstehung (§ 4)","text":"","hinweis":"","order":1},{"id":"step:schema_entstehung.1.1","type":"step","label":"Nr. 1 – Eintragung","text":"Anmeldung (§ 32: Antrag, Wiedergabe, Waren-/Dienstleistungsverzeichnis) → Anmeldetag (§ 33) → Prüfung (§§ 36, 37) → Eintragung und Veröffentlichung (§ 41) → Widerspruchsfrist (§ 42).","hinweis":"","order":1},{"id":"step:schema_entstehung.1.2","type":"step","label":"Nr. 2 – Verkehrsgeltung durch Benutzung","text":"","hinweis":"","order":2},{"id":"step:schema_entstehung.1.3","type":"step","label":"Nr. 3 – Notorische Bekanntheit","text":"","hinweis":"","order":3},{"id":"step:schema_entstehung.2","type":"step","label":"2. Zeitrang (§ 6) und Priorität (§§ 34, 35)","text":"Anmeldetag; ausländische Priorität (PVÜ, 6 Monate); Ausstellungspriorität.","hinweis":"","order":2},{"id":"step:schema_entstehung.3","type":"step","label":"3. Schutzdauer und Verlängerung (§ 47)","text":"Zehn Jahre ab Anmeldetag, beliebig oft um zehn Jahre verlängerbar durch Gebührenzahlung.","hinweis":"","order":3},{"id":"step:schema_entstehung.4","type":"step","label":"4. Marke als Vermögensgegenstand (§§ 27-31)","text":"Rechtsübergang (§ 27), Vermutung der Inhaberschaft (§ 28), dingliche Rechte/Zwangsvollstreckung (§ 29), Lizenzen (§ 30).","hinweis":"","order":4},{"id":"step:schema_entstehung.5","type":"step","label":"5. Erlöschen","text":"Verzicht (§ 48), Nichtverlängerung (§ 47 Abs. 6), Verfall (§ 49), Nichtigkeit (§§ 50, 51), Löschung im Widerspruchsverfahren (§ 43 Abs. 2).","hinweis":"","order":5},{"id":"schema:schema_relative_schutzhindernisse","type":"schema","label":"Relative Schutzhindernisse im Register (§ 9 Abs. 1 Nr. 1-3 MarkenG)","kategorie":"Verfahren","beschreibung":"Kollisionsprüfung nach der Registerlage im Widerspruch (§ 42) und im Nichtigkeitsverfahren (§ 51). Schwerpunkt: die bekannte Marke als relatives Schutzhindernis (§ 9 Abs. 1 Nr. 3) mit ihren registerrechtlichen Besonderheiten."},{"id":"step:schema_relative_schutzhindernisse.1","type":"step","label":"1. Verfahrensrahmen","text":"Nur auf Antrag des Inhabers des älteren Rechts: Widerspruch (§ 42 Abs. 2 Nr. 1, drei Monate) oder Nichtigkeitsantrag/-klage (§ 51 Abs. 1 mit §§ 53, 55). Keine Prüfung von Amts wegen (§ 37 prüft nur absolute Hindernisse).","hinweis":"","order":1},{"id":"step:schema_relative_schutzhindernisse.2","type":"step","label":"2. Ältere Marke mit besserem Zeitrang","text":"Angemeldete oder eingetragene Marke (§ 9 Abs. 1); Anmeldung nur, wenn sie eingetragen wird (§ 9 Abs. 2). Zeitrang nach § 6 (Anmeldetag, Priorität). Aus Unionsmarke: § 125b Nr. 1; aus IR-Marke: § 112, § 116.","hinweis":"","order":2},{"id":"step:schema_relative_schutzhindernisse.3","type":"step","label":"3. Nichtbenutzungseinrede gegen die ältere Marke","text":"§ 43 Abs. 1 (Widerspruch: Glaubhaftmachung) bzw. § 53 Abs. 6 (Nichtigkeit). Unionsmarke: Art. 18 UMV (§ 125b Nr. 4, 5); IR-Marke: Fristbeginn nach § 115 Abs. 2 (§ 116).","hinweis":"","order":3},{"id":"step:schema_relative_schutzhindernisse.4","type":"step","label":"4. Kollisionstatbestand","text":"","hinweis":"","order":4},{"id":"step:schema_relative_schutzhindernisse.4.1","type":"step","label":"Nr. 1 – Doppelidentität","text":"Zeichen- und Warenidentität nach den Verzeichnissen.","hinweis":"","order":1},{"id":"step:schema_relative_schutzhindernisse.4.2","type":"step","label":"Nr. 2 – Verwechslungsgefahr","text":"Registerlage beider Marken; Kennzeichnungskraft der älteren Marke am Anmeldetag der jüngeren (§ 51 Abs. 4 S. 2). Im Übrigen wie § 14 Abs. 2 Nr. 2.","hinweis":"","order":2},{"id":"step:schema_relative_schutzhindernisse.4.3","type":"step","label":"Nr. 3 – Bekannte ältere Marke","text":"Spiegelbild des § 14 Abs. 2 Nr. 3 mit registerrechtlichen Besonderheiten.","hinweis":"","order":3},{"id":"step:schema_relative_schutzhindernisse.4.3.1","type":"step","label":"a) Bekanntheit im Inland zum maßgeblichen Zeitpunkt","text":"Bekannt bei einem bedeutenden Teil des angesprochenen Publikums (General Motors). Zeitpunkt: Anmelde-/Prioritätstag der jüngeren Marke (§ 51 Abs. 3); Fortbestehen bei der Entscheidung. Aus Unionsmarke: Bekanntheit in der Union (§ 125b Nr. 1; PAGO, Iron & Smith).","hinweis":"","order":1},{"id":"step:schema_relative_schutzhindernisse.4.3.2","type":"step","label":"b) Zeichenidentität oder -ähnlichkeit","text":"Vergleich der eingetragenen Zeichen; ein zur Verknüpfung ausreichender Ähnlichkeitsgrad genügt (Goldbären: Wortmarke vs. 3D nur begrifflich).","hinweis":"","order":2},{"id":"step:schema_relative_schutzhindernisse.4.3.3","type":"step","label":"c) Waren/Dienstleistungen der jüngeren Marke","text":"Seit dem MaMoG 2019 ohne Einschränkung: auch identische und ähnliche Waren (Linie OTTO Cap ist Gesetz geworden).","hinweis":"","order":3},{"id":"step:schema_relative_schutzhindernisse.4.3.4","type":"step","label":"d) Gedankliche Verknüpfung","text":"Ungeschriebene Voraussetzung: Der Verkehr bringt die jüngere Marke mit der bekannten in Verbindung (Intel). Aus Unionsmarke: Bekanntheit bei einem wirtschaftlich nicht unbedeutenden Teil des inländischen Publikums erforderlich (Iron & Smith).","hinweis":"","order":4},{"id":"step:schema_relative_schutzhindernisse.4.3.5","type":"step","label":"e) Prognose: Benutzung 'würde' ausnutzen oder beeinträchtigen","text":"Hypothetische Benutzung der jüngeren Marke für die eingetragenen Waren, nicht der tatsächliche Marktauftritt. Vier Alternativen: Ausnutzung/Beeinträchtigung der Unterscheidungskraft oder der Wertschätzung.","hinweis":"","order":5},{"id":"step:schema_relative_schutzhindernisse.4.3.6","type":"step","label":"f) Ohne rechtfertigenden Grund in unlauterer Weise","text":"Interessenabwägung; Kunst-/Meinungsfreiheit rechtfertigt keine Eintragung als eigene Marke (Springender Pudel).","hinweis":"","order":6},{"id":"step:schema_relative_schutzhindernisse.5","type":"step","label":"5. Ausschlussgründe (nur Nichtigkeitsverfahren)","text":"Duldung über fünf Jahre (§ 51 Abs. 2 S. 1), Zustimmung (§ 51 Abs. 2 S. 3), fehlende Bekanntheit am Prioritätstag der jüngeren Marke (§ 51 Abs. 3), Löschungsreife der älteren Marke am Prioritätstag der jüngeren wegen Verfalls oder absoluter Schutzhindernisse (§ 51 Abs. 4).","hinweis":"","order":5},{"id":"step:schema_relative_schutzhindernisse.6","type":"step","label":"6. Rechtsfolge und Wechselwirkung mit dem Verletzungsprozess","text":"Löschung ganz oder für Teile der Waren (§ 43 Abs. 2, § 51 Abs. 5), Wirkung ex tunc (§ 52 Abs. 2). Greift § 51 Abs. 3 oder 4, sperrt § 22 Abs. 1 zugleich Unterlassungsansprüche gegen die Benutzung der jüngeren Marke für ihre eingetragenen Waren; es entsteht Koexistenz (§ 22 Abs. 2).","hinweis":"","order":6},{"id":"schema:schema_unionsmarke","type":"schema","label":"Vorgehen aus einer Unionsmarke in Deutschland (UMV, § 125b ff. MarkenG)","kategorie":"EU- und IR-Marken","beschreibung":"Normketten für Verletzungsklage, Widerspruch und Nichtigkeitsantrag aus einer Unionsmarke sowie Angriffe gegen die Unionsmarke selbst."},{"id":"step:schema_unionsmarke.1","type":"step","label":"1. Rechtsgrundlagen","text":"Unionsmarkenverordnung (VO (EU) 2017/1001, UMV) unmittelbar; das MarkenG gilt nur, soweit § 125b es anordnet (Nr. 1, 2 unmittelbar; Nr. 3-6 entsprechend) oder Art. 129 UMV auf nationales Recht verweist. IR-Marken mit Benennung EU stehen der Unionsmarke gleich (Art. 189 ff. UMV).","hinweis":"","order":1},{"id":"step:schema_unionsmarke.2","type":"step","label":"2. Verletzungsklage aus der Unionsmarke","text":"","hinweis":"","order":2},{"id":"step:schema_unionsmarke.2.1","type":"step","label":"a) Anspruch","text":"Art. 9 Abs. 2 lit. a (Doppelidentität), lit. b (Verwechslungsgefahr), lit. c (bekannte Marke – Bekanntheit in der Union) UMV; Benutzungshandlungen Art. 9 Abs. 3, Transit Art. 9 Abs. 4. Auslegung wie § 14 Abs. 2 Nr. 1-3.","hinweis":"","order":1},{"id":"step:schema_unionsmarke.2.2","type":"step","label":"b) Schranken","text":"Art. 14 UMV (= § 23), Art. 15 UMV (Erschöpfung, = § 24), Art. 16 UMV (Zwischenrecht des Inhabers einer jüngeren Marke, ≈ § 22), Verwirkung Art. 61 UMV / § 21 Abs. 1 entsprechend (§ 125b Nr. 3).","hinweis":"","order":2},{"id":"step:schema_unionsmarke.2.3","type":"step","label":"c) Einwand der Nichtbenutzung und Widerklage","text":"Vermutung der Gültigkeit (Art. 127 Abs. 1); Einwand des Verfalls wegen Nichtbenutzung ohne Widerklage zulässig (Art. 127 Abs. 3); sonstige Verfalls-/Nichtigkeitsgründe nur per Widerklage (Art. 128); Aussetzung bei EUIPO-Verfahren (Art. 132).","hinweis":"","order":3},{"id":"step:schema_unionsmarke.2.4","type":"step","label":"d) Rechtsfolgen","text":"Unterlassung und Sanktionen nach Art. 130 UMV; Schadensersatz, Vernichtung/Rückruf, Auskunft, Vorlage, Sicherung, Urteilsbekanntmachung nach §§ 14 Abs. 6, 7, 18-19c MarkenG (§ 125b Nr. 2). Verbot grundsätzlich unionsweit (DHL/Chronopost), Beschränkung bei nur regionaler Verwechslungsgefahr (combit).","hinweis":"","order":4},{"id":"step:schema_unionsmarke.2.5","type":"step","label":"e) Zuständigkeit","text":"Unionsmarkengerichte (Art. 123, 124 UMV; § 125e); international: Beklagtensitz (Art. 125 Abs. 1-4, unionsweite Kognition) oder Handlungsort (Art. 125 Abs. 5, beschränkt nach Art. 126 Abs. 2); örtlich § 125g; Kennzeichenstreitsache § 140.","hinweis":"","order":5},{"id":"step:schema_unionsmarke.3","type":"step","label":"3. Angriff auf eine deutsche Marke aus der Unionsmarke","text":"","hinweis":"","order":3},{"id":"step:schema_unionsmarke.3.1","type":"step","label":"a) Widerspruch (§ 42) und Nichtigkeit (§ 51)","text":"Unionsmarke ist ältere Marke i.S.d. § 9 (§ 125b Nr. 1); Bekanntheit in der Union statt im Inland (§ 9 Abs. 1 Nr. 3).","hinweis":"","order":1},{"id":"step:schema_unionsmarke.3.2","type":"step","label":"b) Nichtbenutzungseinrede","text":"Benutzung der Unionsmarke nach Art. 18 UMV statt § 26 (§ 125b Nr. 4 für § 43 Abs. 1, Nr. 5 für § 53 Abs. 6); Verwirkung § 51 Abs. 2 S. 1 entsprechend.","hinweis":"","order":2},{"id":"step:schema_unionsmarke.4","type":"step","label":"4. Angriff auf die Unionsmarke aus einer deutschen Marke oder IR-Marke (DE)","text":"Vor dem EUIPO: Widerspruch nach Art. 46 i.V.m. Art. 8 Abs. 1 (Identität/Verwechslungsgefahr), Abs. 5 (bekannte Marke, hier genügt Bekanntheit im Mitgliedstaat) UMV; ältere Rechte nach Art. 8 Abs. 2 (nationale Marken, IR-Marken mit Wirkung im Mitgliedstaat, Anmeldungen); Nichtigkeit Art. 60 Abs. 1 lit. a, Abs. 2 (sonstige ältere Rechte); Benutzungsnachweis Art. 47 Abs. 2, 3. Sonst Widerklage vor dem Unionsmarkengericht (Art. 128).","hinweis":"","order":4},{"id":"step:schema_unionsmarke.5","type":"step","label":"5. Seniorität, Umwandlung, Koexistenz","text":"Seniorität Art. 39, 40 UMV (§ 125c: nachträgliche Feststellung der Löschungsreife); Umwandlung Art. 139 ff. UMV (§ 125d); Koexistenz von Unions- und nationaler Marke, Prioritätsprinzip nach Zeitrang.","hinweis":"","order":5},{"id":"schema:schema_ir_marke","type":"schema","label":"Vorgehen aus einer IR-Marke in Deutschland (PMMA, §§ 112-125 MarkenG)","kategorie":"EU- und IR-Marken","beschreibung":"Internationale Registrierung nach dem Madrider System mit Schutzerstreckung auf Deutschland: Wirkung, Zeitrang, Angriff und Verteidigung."},{"id":"step:schema_ir_marke.1","type":"step","label":"1. Rechtsgrundlagen","text":"Madrider Markenabkommen (MMA, §§ 107-118) und Protokoll (PMMA, §§ 119-125); § 124 erklärt §§ 112-117 auf Protokollmarken für entsprechend anwendbar. Basismarke oder -anmeldung im Ursprungsland erforderlich; internationale Registrierung durch die WIPO; Schutzerstreckung durch Benennung (Art. 3ter PMMA).","hinweis":"","order":1},{"id":"step:schema_ir_marke.2","type":"step","label":"2. Wirkung und Zeitrang (§ 112)","text":"Wie eine am Tag der internationalen Registrierung bzw. der nachträglichen Schutzerstreckung angemeldete und eingetragene deutsche Marke; PVÜ-Priorität (Art. 4 PVÜ) bleibt möglich. Wirkung entfällt bei Schutzverweigerung (§ 112 Abs. 2).","hinweis":"","order":2},{"id":"step:schema_ir_marke.3","type":"step","label":"3. Verteidigung der Erstreckung in Deutschland","text":"","hinweis":"","order":3},{"id":"step:schema_ir_marke.3.1","type":"step","label":"a) Prüfung absoluter Schutzhindernisse (§ 113)","text":"Wie bei Anmeldungen (§§ 37, 8); Schutzverweigerung muss innerhalb der Frist des Art. 5 Abs. 2 PMMA mitgeteilt werden.","hinweis":"","order":1},{"id":"step:schema_ir_marke.3.2","type":"step","label":"b) Widerspruch Dritter (§ 114)","text":"Veröffentlichung in der WIPO-Gazette ersetzt § 41; Frist ab dem ersten Tag des Folgemonats des Ausgabemonats; statt Löschung: Schutzverweigerung (§ 114 Abs. 3).","hinweis":"","order":2},{"id":"step:schema_ir_marke.3.3","type":"step","label":"c) Verfall und Nichtigkeit (§ 115)","text":"§§ 49-51 gelten; Rechtsfolge ist die nachträgliche Schutzentziehung. § 115 Abs. 2 legt den Ersatzzeitpunkt für den Eintragungstag fest.","hinweis":"","order":3},{"id":"step:schema_ir_marke.3.4","type":"step","label":"d) Abhängigkeit von der Basismarke und Umwandlung","text":"Fünf Jahre 'central attack' (Art. 6 PMMA); danach Umwandlung in nationale Anmeldung unter Wahrung des Zeitrangs (Art. 9quinquies PMMA, § 125).","hinweis":"","order":4},{"id":"step:schema_ir_marke.4","type":"step","label":"4. Angriff aus der IR-Marke","text":"","hinweis":"","order":4},{"id":"step:schema_ir_marke.4.1","type":"step","label":"a) Verletzungsklage","text":"§§ 14 ff. gelten unmittelbar (§ 112: Wirkung wie eingetragene Marke); Nichtbenutzungseinrede nach § 25 mit Fristbeginn nach § 115 Abs. 2 (§ 117).","hinweis":"","order":1},{"id":"step:schema_ir_marke.4.2","type":"step","label":"b) Widerspruch und Nichtigkeitsantrag gegen deutsche Marken (§ 116)","text":"§ 9 gilt unverändert (Bekanntheit im Inland); Nichtbenutzungseinrede nach § 43 Abs. 1 bzw. § 53 Abs. 6 mit Fristbeginn nach § 115 Abs. 2.","hinweis":"","order":2},{"id":"step:schema_ir_marke.4.3","type":"step","label":"c) IR-Marke mit Benennung EU","text":"Gilt als Unionsmarke (Art. 189 ff. UMV): dann § 125b, Unionsmarkengerichte, Bekanntheit und Benutzung in der Union.","hinweis":"","order":3},{"id":"step:schema_ir_marke.5","type":"step","label":"5. Benutzungsschonfrist (§§ 115 Abs. 2, 116, 117)","text":"Fünf Jahre ab Ablauf der Schutzverweigerungsfrist (Art. 5 Abs. 2 PMMA) oder ab rechtskräftiger Schutzgewährung – nicht ab dem Tag der internationalen Registrierung.","hinweis":"","order":5},{"id":"schema:schema_markenrl","type":"schema","label":"Unionsrechtlicher Rahmen: Markenrechtsrichtlinie anwenden","kategorie":"EU- und IR-Marken","beschreibung":"Wie die MarkenRL (EU) 2015/2436 in der Fallbearbeitung wirkt: Aufbau der Richtlinie, Zuordnung der MarkenG-Normen, richtlinienkonforme Auslegung und EuGH-Vorlage."},{"id":"step:schema_markenrl.1","type":"step","label":"1. Anwendungsbereich prüfen","text":"Erfasst sind eingetragene und angemeldete Marken sowie IR-Marken mit Wirkung im Mitgliedstaat (Art. 1). Nicht harmonisiert: Benutzungsmarken (§ 4 Nr. 2), geschäftliche Bezeichnungen (§ 5), Rechtsfolgen (§§ 14 Abs. 5 ff., 18, 19: Durchsetzungs-RL 2004/48/EG).","hinweis":"","order":1},{"id":"step:schema_markenrl.2","type":"step","label":"2. Aufbau der Richtlinie kennen","text":"","hinweis":"","order":2},{"id":"step:schema_markenrl.2.1","type":"step","label":"Kapitel 2 Abschnitt 1 und 2: Markenformen, Eintragungshindernisse","text":"Art. 3 (Markenformen), Art. 4 (absolute), Art. 5 (relative Gründe), Art. 6 (Seniorität), Art. 7 (Teilzurückweisung), Art. 8 (Zeitpunkt), Art. 9 (Duldung).","hinweis":"","order":1},{"id":"step:schema_markenrl.2.2","type":"step","label":"Kapitel 2 Abschnitt 3: Rechte und Schranken","text":"Art. 10 (Rechte, Transit), Art. 11 (Vorbereitungshandlungen), Art. 12 (Nachschlagewerke), Art. 13 (Agentenmarke), Art. 14 (Schranken), Art. 15 (Erschöpfung), Art. 16 (Benutzung), Art. 17 (Einrede), Art. 18 (Zwischenrecht).","hinweis":"","order":2},{"id":"step:schema_markenrl.2.3","type":"step","label":"Kapitel 2 Abschnitt 4 bis 6: Verfall, Vermögen, Kollektivmarken","text":"Art. 19 bis 21 (Verfall), Art. 22 bis 26 (Übertragung, Lizenz), Art. 27 bis 36 (Gewährleistungs- und Kollektivmarken).","hinweis":"","order":3},{"id":"step:schema_markenrl.2.4","type":"step","label":"Kapitel 3: Verfahren","text":"Art. 37 bis 42 (Anmeldung, Klassifizierung), Art. 43 bis 47 (Widerspruch, Verfall/Nichtigkeit vor dem Amt, Wirkungen), Art. 48, 49 (Schutzdauer).","hinweis":"","order":4},{"id":"step:schema_markenrl.3","type":"step","label":"3. Zugehörige MarkenG-Norm zuordnen","text":"Umsetzungstabelle: Art. 3 → §§ 3, 8 Abs. 1; Art. 4 → § 8 Abs. 2; Art. 5 → §§ 9 ff.; Art. 10 → § 14; Art. 14 → § 23; Art. 15 → § 24; Art. 16 → § 26; Art. 18 → § 22; Art. 19/20 → § 49; Art. 43 → § 42; Art. 45 → § 53; Art. 48/49 → § 47.","hinweis":"","order":3},{"id":"step:schema_markenrl.4","type":"step","label":"4. Richtlinienkonform auslegen","text":"Unionsrechtliche Begriffe (Unterscheidungskraft, Verwechslungsgefahr, Bekanntheit, ernsthafte Benutzung) haben die vom EuGH gegebene Bedeutung; EuGH-Urteile zur UMV sind wegen des Gleichlaufs übertragbar. Nationale Spielräume nur bei Optionen der Richtlinie (Art. 4 Abs. 3, Art. 5 Abs. 4, Art. 28 Abs. 1).","hinweis":"","order":4},{"id":"step:schema_markenrl.5","type":"step","label":"5. Bei Zweifeln: Vorlage an den EuGH","text":"Art. 267 AEUV: Vorlagerecht jedes Gerichts, Vorlagepflicht des BGH als letztinstanzliches Gericht, sofern die Frage nicht bereits geklärt (acte éclairé) oder offenkundig (acte clair) ist. Beispiele: #darferdas? (C-541/18), Thomson Life (C-120/04), Iron & Smith (C-125/14).","hinweis":"","order":5},{"id":"step:schema_markenrl.6","type":"step","label":"6. Übergangsrecht beachten","text":"Umsetzung bis 14.1.2019 (Art. 54), für Art. 45 bis 14.1.2023; MaMoG in Kraft seit 14.1.2019, DPMA-Nichtigkeitsverfahren seit 1.5.2020. Für Altfälle gilt § 158 MarkenG.","hinweis":"","order":6}],"edges":[{"source":"norm:§1","target":"eunorm:markenrl:1","relation":"implements","ref":"§ 1"},{"source":"concept:markenrl","target":"eunorm:markenrl:1","relation":"defined_in","ref":"Art. 1 MarkenRL"},{"source":"concept:marke","target":"eunorm:markenrl:1","relation":"defined_in","ref":"Art. 1 MarkenRL"},{"source":"norm:§56","target":"eunorm:markenrl:2","relation":"implements","ref":"§ 56"},{"source":"norm:§41","target":"eunorm:markenrl:2","relation":"implements","ref":"§ 41"},{"source":"concept:markenrl","target":"eunorm:markenrl:2","relation":"defined_in","ref":"Art. 2 MarkenRL"},{"source":"norm:§3","target":"eunorm:markenrl:3","relation":"implements","ref":"§ 3 Abs. 1"},{"source":"norm:§8","target":"eunorm:markenrl:3","relation":"implements","ref":"§ 8 Abs. 1"},{"source":"concept:markenfaehigkeit","target":"eunorm:markenrl:3","relation":"defined_in","ref":"Art. 3 MarkenRL"},{"source":"concept:darstellbarkeit","target":"eunorm:markenrl:3","relation":"defined_in","ref":"Art. 3 MarkenRL"},{"source":"concept:farbmarke","target":"eunorm:markenrl:3","relation":"defined_in","ref":"Art. 3 MarkenRL"},{"source":"concept:formmarke","target":"eunorm:markenrl:3","relation":"defined_in","ref":"Art. 3 MarkenRL"},{"source":"case:eugh_libertel","target":"eunorm:markenrl:3","relation":"interprets","ref":"Ar
