# Baut den Wissensgraphen, die Karteikarten und beide Web-Apps und veröffentlicht
# den Fallkurs (Jurafuchs-Format) als Startseite auf GitHub Pages.
# Lernnavigator liegt zusätzlich unter /navigator/.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Graph, Karteikarten und Apps bauen
        run: |
          python3 build.py
          python3 src/build_kurs.py
      - name: Seite zusammenstellen (Fallkurs als Startseite)
        run: |
          mkdir -p site/navigator
          cp docs/kurse/index.html site/index.html
          cp docs/index.html site/navigator/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
