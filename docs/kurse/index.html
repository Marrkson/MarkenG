<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markenrecht Fallkurs</title>
<style>
:root{
  --bg:#fbf7f2;--card:#ffffff;--ink:#1e2228;--muted:#6b7280;--line:#e9e2d8;--soft:#f6efe6;
  --accent:#e8730c;--accent-deep:#b9560a;--accent-soft:#fdeedd;--ok:#1f8a5b;--ok-soft:#e3f5ec;--bad:#c8402f;--bad-soft:#fbe6e2;
  --norm:#2b5b8a;--norm-soft:#e4edf7;--concept:#8a2f1f;--concept-soft:#f6e6e1;--case:#6a4c93;--case-soft:#ece5f5;--schema:#2f6b4f;--schema-soft:#e2f0e8;
  --radius:16px;--shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.06);color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17181b;--card:#202226;--ink:#ecebe7;--muted:#9aa0a8;--line:#32353b;--soft:#26282d;
  --accent:#f08a2e;--accent-deep:#f5a55f;--accent-soft:#3a2a1a;--ok:#5fc48f;--ok-soft:#1c3328;--bad:#ef8a7a;--bad-soft:#3b221e;
  --norm:#8db7e6;--norm-soft:#20303f;--concept:#e0866f;--concept-soft:#3a2622;--case:#b89ee0;--case-soft:#2c2540;--schema:#7fc4a0;--schema-soft:#1f3329;
  --shadow:0 1px 2px rgba(0,0,0,.5);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#17181b;--card:#202226;--ink:#ecebe7;--muted:#9aa0a8;--line:#32353b;--soft:#26282d;
  --accent:#f08a2e;--accent-deep:#f5a55f;--accent-soft:#3a2a1a;--ok:#5fc48f;--ok-soft:#1c3328;--bad:#ef8a7a;--bad-soft:#3b221e;
  --norm:#8db7e6;--norm-soft:#20303f;--concept:#e0866f;--concept-soft:#3a2622;--case:#b89ee0;--case-soft:#2c2540;--schema:#7fc4a0;--schema-soft:#1f3329;
  --shadow:0 1px 2px rgba(0,0,0,.5);color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif}
a{color:var(--norm)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.shell{max-width:720px;margin:0 auto;padding:0 16px 96px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.top .back{color:var(--ink);width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:20px}
.top .ttl{flex:1;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.pill svg{width:16px;height:16px}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.bar.ok > i{background:var(--ok)}
h1{font-size:26px;margin:14px 0 4px;line-height:1.2}
h2{font-size:20px;margin:22px 0 10px}
h3{font-size:16px;margin:14px 0 6px}
.lead{color:var(--muted);margin:0 0 14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.course{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;padding:16px;margin:10px 0;cursor:pointer;border-left:6px solid var(--c,var(--accent))}
.course:hover{transform:translateY(-1px)}
.course .ico{width:52px;height:52px;border-radius:14px;background:var(--c,var(--accent));display:flex;align-items:center;justify-content:center;color:#fff}
.course .ico svg{width:28px;height:28px}
.course .t{font-weight:700}
.course .s{color:var(--muted);font-size:14px}
.course .m{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--muted)}
.course .m .bar{flex:1}
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:20px;background:linear-gradient(135deg,var(--accent-soft),var(--card));}
.ring{width:84px;height:84px;position:relative}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.btn,.back,nav.bottom a{text-decoration:none}
.btn{color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:14px 20px;font-weight:700;font-size:16px;background:var(--card);box-shadow:var(--shadow);border:2px solid transparent}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-deep)}
.btn.block{width:100%}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line)}
.btn:focus-visible{outline:3px solid var(--norm);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.row .btn{flex:1}
/* chapter list */
.chap{margin:14px 0}
.chap .h{display:flex;align-items:center;gap:10px;padding:12px 0;font-weight:700}
.chap .h .n{width:30px;height:30px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.chap .h .bar{flex:1;height:6px}
.unit{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:6px 0;cursor:pointer;border-left:4px solid transparent}
.unit .ty{width:34px;height:34px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:.04em;flex:none;color:var(--muted)}
.unit .ty.fall{background:var(--accent-soft);color:var(--accent-deep)}.unit .ty.mc{background:var(--norm-soft);color:var(--norm)}.unit .ty.schema{background:var(--schema-soft);color:var(--schema)}
.unit .t{flex:1;font-weight:600;font-size:15px}
.unit .st{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:none}
.unit .st.ok{background:var(--ok-soft);color:var(--ok)}.unit .st.bad{background:var(--bad-soft);color:var(--bad)}.unit .st.none{background:var(--soft);color:var(--muted)}
.unit.ok{border-left-color:var(--ok)}.unit.bad{border-left-color:var(--bad)}
.lvl{font-size:11px;color:var(--muted);font-weight:600}
/* player */
.kind{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-deep)}
.sv{background:var(--soft);border-radius:14px;padding:16px;margin:12px 0;font-size:17px;line-height:1.6}
.sv::before{content:"Sachverhalt";display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.frage{font-weight:700;font-size:19px;margin:14px 0;line-height:1.4;text-wrap:balance}
.answers{display:grid;gap:10px;margin:14px 0}
.answers.yn{grid-template-columns:1fr 1fr}
.ans{border-radius:14px;padding:16px;font-weight:700;font-size:17px;background:var(--card);border:2px solid var(--line);text-align:left}
.answers.yn .ans{text-align:center}
.ans:hover{border-color:var(--accent)}
.ans.sel{border-color:var(--accent);background:var(--accent-soft)}
.ans.right{border-color:var(--ok);background:var(--ok-soft)}
.ans.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ans[disabled]{cursor:default}
.fb{border-radius:14px;padding:14px 16px;margin:14px 0;font-weight:700;display:flex;gap:10px;align-items:center}
.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb .big{font-size:22px}
.loes p{margin:0 0 10px;line-height:1.6}
.merke{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:12px 14px;margin:14px 0}
.merke b{color:var(--accent-deep)}
.intro p{font-size:17px;line-height:1.65}
.meta{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:5px 11px;border-radius:20px;cursor:pointer;user-select:none;border:1px solid transparent;font-weight:600}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.chip.concept{background:var(--concept-soft);color:var(--concept)}.chip.norm,.chip.eunorm{background:var(--norm-soft);color:var(--norm)}.chip.case{background:var(--case-soft);color:var(--case)}.chip.step,.chip.schema{background:var(--schema-soft);color:var(--schema)}.chip.distinction{background:var(--accent-soft);color:var(--accent-deep)}
.chip.open{border-color:currentColor}
.slot:empty{display:none}
.inline{border-left:3px solid var(--line);margin:8px 0;padding:10px 14px;background:var(--card);border-radius:0 12px 12px 0;box-shadow:var(--shadow);font-size:15px}
.inline.concept{border-left-color:var(--concept)}.inline.norm,.inline.eunorm{border-left-color:var(--norm)}.inline.case{border-left-color:var(--case)}.inline.step,.inline.schema{border-left-color:var(--schema)}
.inline h5{margin:2px 0 6px;font-size:15px}
.inline .k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inline p{margin:0 0 6px}
.abs{margin:6px 0}.abs b{color:var(--norm);margin-right:4px}
.tree{list-style:none;padding:0;margin:0}
.tree li{margin:4px 0}
.tree .node{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer}
.tree .node:hover{background:var(--soft)}
.tree .tw{width:16px;color:var(--muted);flex:none}
.tree .lbl{font-weight:600}
.tree .body{margin:2px 0 6px 30px}
.tree .body p{margin:4px 0 6px;font-size:15px}
.tree ul{list-style:none;padding-left:22px;margin:0;border-left:1px dashed var(--line)}
.done{text-align:center;padding:26px 18px}
.done .score{font-size:44px;font-weight:800;color:var(--accent)}
.list{margin:10px 0}
.notice{position:fixed;left:0;right:0;bottom:62px;z-index:30;background:var(--card);box-shadow:0 -4px 20px rgba(0,0,0,.12);padding:14px 16px;display:flex;gap:12px;align-items:center;font-size:14px}
.notice .btn{padding:10px 16px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
nav.bottom a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;padding:6px 0}
nav.bottom a svg{width:22px;height:22px;display:block;margin:0 auto 2px}
nav.bottom a.active{color:var(--accent)}
.kbd{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}
mark{background:var(--accent-soft);color:inherit}
.lawlink{color:var(--norm);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
.lawlink:hover{text-decoration-style:solid}
.chip .ext{margin-left:2px;text-decoration:none;font-weight:700;opacity:.75}
.chip .ext:hover{opacity:1}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<div class="shell">
  <div class="top" id="top"></div>
  <main id="main"></main>

<script id="kurse-data" type="application/json">[{"id":"k01","titel":"Grundlagen des Markenrechts","untertitel":"Was eine Marke ist, wie sie entsteht und was sie leistet","farbe":"#E8730C","icon":"marke","beschreibung":"Der Einstieg: Schutzgegenstände des MarkenG, Markenfunktionen, die drei Entstehungstatbestände des § 4 und das Prioritätsprinzip.","kapitel":[{"id":"k01a","titel":"Schutzgegenstände und Funktionen","einheiten":[{"id":"k01a-0","typ":"intro","titel":"Worum geht es im Markenrecht?","text":"Das MarkenG schützt drei Arten von Kennzeichen (§ 1): **Marken** (für Waren und Dienstleistungen), **geschäftliche Bezeichnungen** (Unternehmenskennzeichen und Werktitel) und **geographische Herkunftsangaben**. Alle drei sind Zeichen, die im geschäftlichen Verkehr etwas voneinander unterscheidbar machen. In diesem Kurs lernst du, was eine Marke ist, welche Funktionen sie hat und wie Markenschutz entsteht.","concepts":["marke","geschaeftliche_bezeichnung","geographische_herkunftsangabe"],"norms":["§ 1","§ 2"],"cases":[]},{"id":"k01a-1","typ":"fall","titel":"Das Logo auf der Limonade","sachverhalt":"Lena stellt Limonade her und druckt auf jede Flasche ein stilisiertes Zitronen-Logo mit dem Wort „ZITRA“. Kunden erkennen die Limonade im Regal daran wieder.","frage":"Ist „ZITRA“ mit dem Logo ein Zeichen, das grundsätzlich als Marke geschützt werden kann?","antwort":true,"loesung":["**Ja, in der Tat!** Als Marke können alle Zeichen geschützt werden, die geeignet sind, Waren eines Unternehmens von denen anderer Unternehmen zu unterscheiden (§ 3 Abs. 1). Wörter und Abbildungen nennt das Gesetz ausdrücklich.","Das Zeichen erfüllt hier genau die **Hauptfunktion der Marke**: Es garantiert dem Kunden, dass die Limonade aus einem bestimmten Unternehmen stammt (Herkunftsfunktion). Ob das Zeichen auch eingetragen wird, ist eine andere Frage (§ 8)."],"merke":"§ 3 Abs. 1 fragt nur abstrakt: Kann ein solches Zeichen überhaupt unterscheiden? Die konkrete Unterscheidungskraft für bestimmte Waren prüft erst § 8 Abs. 2 Nr. 1.","level":1,"concepts":["marke","markenfaehigkeit","herkunftsfunktion"],"norms":["§ 3 Abs. 1"],"cases":[],"step":null},{"id":"k01a-2","typ":"fall","titel":"Die Farbe des Lieferwagens","sachverhalt":"Ein Paketdienst lackiert alle Fahrzeuge in einem bestimmten Gelbton und möchte diesen Farbton ohne Form und Umriss als Marke anmelden.","frage":"Kann eine abstrakte Farbe überhaupt markenfähig sein?","antwort":true,"loesung":["**Ja!** § 3 Abs. 1 nennt „sonstige Aufmachungen einschließlich Farben und Farbzusammenstellungen“. Auch eine konturlose Farbe ist markenfähig, wenn sie eindeutig bestimmt ist, etwa durch einen Farbcode (EuGH Libertel).","Etwas anderes ist die Frage, ob die Farbe für Paketdienste **unterscheidungskräftig** ist. Das bejaht die Rechtsprechung bei Farben nur ausnahmsweise; meist braucht es Verkehrsdurchsetzung (§ 8 Abs. 3). Dazu später mehr."],"merke":"Markenfähigkeit (§ 3) und Unterscheidungskraft (§ 8 Abs. 2 Nr. 1) sind zwei Stufen. Farben nehmen die erste fast immer, die zweite selten.","level":2,"concepts":["farbmarke","markenfaehigkeit"],"norms":["§ 3 Abs. 1"],"cases":["eugh_libertel"],"step":null},{"id":"k01a-3","typ":"mc","titel":"Die Funktionen der Marke","sachverhalt":"","frage":"Welche Funktion der Marke ist nach EuGH und BGH die Hauptfunktion, an die auch der Verletzungstatbestand anknüpft?","optionen":["Die Werbefunktion","Die Herkunftsfunktion","Die Qualitätsfunktion","Die Investitionsfunktion"],"richtig":1,"loesung":["Die **Herkunftsfunktion** ist die Hauptfunktion: Die Marke garantiert dem Verbraucher die Ursprungsidentität der Ware. Sie ist der Maßstab für die Unterscheidungskraft (§ 8 Abs. 2 Nr. 1) und für die markenmäßige Benutzung (§ 14 Abs. 2).","Daneben schützt der EuGH auch die Qualitäts-, Kommunikations-, Investitions- und Werbefunktion (L'Oréal/Bellure). Diese spielen vor allem bei der Doppelidentität (§ 14 Abs. 2 Nr. 1) und beim Bekanntheitsschutz (Nr. 3) eine Rolle."],"merke":"","level":1,"concepts":["markenfunktionen","herkunftsfunktion"],"norms":[],"cases":["eugh_loreal_bellure","eugh_arsenal"],"step":null},{"id":"k01a-4","typ":"fall","titel":"Der Vereinsname","sachverhalt":"Der Fußballverein „FC Sonnenberg e.V.“ tritt unter diesem Namen im Geschäftsverkehr auf (Ticketverkauf, Fanartikel). Er hat keine Marke angemeldet.","frage":"Genießt der Vereinsname trotzdem Kennzeichenschutz nach dem MarkenG?","antwort":true,"loesung":["**Ja!** Neben Marken schützt das MarkenG **geschäftliche Bezeichnungen** (§ 1 Nr. 2, § 5). Der Name eines Vereins, der im geschäftlichen Verkehr benutzt wird, ist ein Unternehmenskennzeichen nach § 5 Abs. 2.","Der Schutz entsteht **ohne Eintragung** allein durch die Benutzungsaufnahme, wenn der Name unterscheidungskräftig ist. Verletzungen richten sich dann nach § 15, nicht nach § 14."],"merke":"Marke = kennzeichnet Produkte. Unternehmenskennzeichen = kennzeichnet das Unternehmen. Beide stehen im MarkenG, haben aber eigene Normen (§§ 4/14 vs. §§ 5/15).","level":1,"concepts":["geschaeftliche_bezeichnung","unternehmenskennzeichen"],"norms":["§ 1","§ 5 Abs. 2"],"cases":[],"step":null}]},{"id":"k01b","titel":"Entstehung des Markenschutzes und Priorität","einheiten":[{"id":"k01b-0","typ":"schema","titel":"Prüfungsschema: Entstehung und Erlöschen","schema":"schema_entstehung","text":"Verschaffe dir zuerst einen Überblick über den Lebenszyklus einer Marke. Die folgenden Fälle gehen die Entstehungstatbestände des § 4 durch.","concepts":[],"norms":[],"cases":[]},{"id":"k01b-1","typ":"fall","titel":"Die angemeldete, noch nicht eingetragene Marke","sachverhalt":"Tom meldet am 1. März die Wortmarke „KAFFEEKUSS“ für Kaffee beim DPMA an. Am 15. März bietet Konkurrent Karl Kaffee unter „Kaffeekuss“ an. Die Eintragung erfolgt erst am 20. Mai.","frage":"Hat Tom am 15. März bereits eine Marke im Sinne des § 4 Nr. 1, aus der er gegen Karl vorgehen kann?","antwort":false,"loesung":["**Nein!** Markenschutz durch Eintragung entsteht erst mit der **Eintragung** in das Register (§ 4 Nr. 1). Die bloße Anmeldung begründet noch kein Ausschließlichkeitsrecht nach § 14.","Aber: Der **Zeitrang** der Marke bestimmt sich nach dem Anmeldetag (§ 6 Abs. 2, § 33 Abs. 1). Nach der Eintragung kann Tom gegen Benutzungen vorgehen, die nach dem 1. März begonnen haben. Für die Zeit davor bleibt ihm nur das UWG."],"merke":"Anmeldung sichert den Zeitrang, Eintragung schafft das Recht.","level":1,"concepts":["entstehung_markenschutz","prioritaet"],"norms":["§ 4","§ 6 Abs. 2","§ 33"],"cases":[],"step":null},{"id":"k01b-2","typ":"fall","titel":"Die Benutzungsmarke","sachverhalt":"Bäckerin Bea verkauft seit zwölf Jahren in ganz Deutschland Brote unter der Bezeichnung „KRUSTIS“, ohne je eine Marke angemeldet zu haben. Umfragen zeigen, dass 45 % der Brotkäufer „KRUSTIS“ einem bestimmten Unternehmen zuordnen.","frage":"Kann Bea auch ohne Eintragung Inhaberin einer Marke sein?","antwort":true,"loesung":["**Ja, in der Tat!** Markenschutz entsteht auch durch Benutzung eines Zeichens im geschäftlichen Verkehr, soweit das Zeichen innerhalb der beteiligten Verkehrskreise als Marke **Verkehrsgeltung** erworben hat (§ 4 Nr. 2).","Bei einem von Haus aus unterscheidungskräftigen Phantasiewort wie „KRUSTIS“ genügt ein Zuordnungsgrad von etwa 20 bis 25 %. Bea hat also eine Benutzungsmarke mit dem Zeitrang des Zeitpunkts, zu dem die Verkehrsgeltung eingetreten ist (§ 6 Abs. 3)."],"merke":"Verkehrsgeltung (§ 4 Nr. 2) ist weniger als Verkehrsdurchsetzung (§ 8 Abs. 3): Sie schafft die Marke, statt ein Eintragungshindernis zu überwinden.","level":2,"concepts":["verkehrsgeltung","entstehung_markenschutz"],"norms":["§ 4 Nr. 2","§ 6 Abs. 3"],"cases":[],"step":null},{"id":"k01b-3","typ":"fall","titel":"Die Weltmarke ohne deutsche Eintragung","sachverhalt":"Ein amerikanischer Sportartikelhersteller ist mit seinem Logo weltberühmt, hat es in Deutschland aber weder eingetragen noch je Ware nach Deutschland geliefert. Praktisch jeder Deutsche kennt das Logo.","frage":"Besteht in Deutschland dennoch Markenschutz?","antwort":true,"loesung":["**Ja!** § 4 Nr. 3 gewährt Markenschutz für Zeichen, die im Inland **notorisch bekannt** im Sinne des Art. 6bis PVÜ sind. Weder Eintragung noch inländische Benutzung sind erforderlich.","Notorische Bekanntheit verlangt allerdings einen sehr hohen Bekanntheitsgrad, der über die „bekannte Marke“ des § 14 Abs. 2 Nr. 3 hinausgeht. Der Fall ist praktisch selten, in der Klausur aber beliebt."],"merke":"Drei Wege zur Marke: Eintragung, Verkehrsgeltung, Notorietät (§ 4 Nr. 1 bis 3).","level":2,"concepts":["notorische_bekanntheit"],"norms":["§ 4 Nr. 3","§ 10"],"cases":[],"step":null},{"id":"k01b-4","typ":"fall","titel":"Wer war zuerst?","sachverhalt":"Anna hat „SOLARO“ am 3. Januar für Sonnencreme angemeldet, die Eintragung erfolgte im Juni. Ben hat „SOLARO“ für Sonnencreme am 10. Januar angemeldet, die Eintragung erfolgte bereits im April.","frage":"Hat Ben das ältere Recht, weil seine Marke früher eingetragen wurde?","antwort":false,"loesung":["**Nein!** Für den Vorrang zwischen kollidierenden Rechten kommt es auf den **Zeitrang** an (§ 6 Abs. 1). Bei angemeldeten und eingetragenen Marken ist das der Anmeldetag (§ 6 Abs. 2), nicht der Tag der Eintragung.","Anna hat mit dem 3. Januar den besseren Zeitrang. Sie kann Bens Marke mit Widerspruch (§ 42) oder Nichtigkeitsantrag (§ 51) angreifen und ihm die Benutzung nach § 14 untersagen."],"merke":"Prioritätsprinzip: Es zählt der Anmeldetag, nicht die Eintragung.","level":1,"concepts":["prioritaet"],"norms":["§ 6"],"cases":[],"step":null},{"id":"k01b-5","typ":"mc","titel":"Schutzdauer","sachverhalt":"","frage":"Wie lange gilt der Schutz einer eingetragenen Marke und wie wird er verlängert?","optionen":["20 Jahre ab Anmeldung, nicht verlängerbar","10 Jahre ab Anmeldetag, beliebig oft um 10 Jahre verlängerbar","10 Jahre ab Eintragung, einmal verlängerbar","Unbegrenzt ohne Verlängerung"],"richtig":1,"loesung":["Die Schutzdauer beträgt **zehn Jahre ab dem Anmeldetag** und kann durch Zahlung der Verlängerungsgebühr beliebig oft um jeweils zehn Jahre verlängert werden (§ 47).","Anders als Patent und Design kann eine Marke also **ewig** leben, solange sie verlängert und rechtserhaltend benutzt wird (§ 26)."],"merke":"","level":1,"concepts":["entstehung_markenschutz","schutzdauer"],"norms":["§ 47","Art. 48 MarkenRL","Art. 49 MarkenRL"],"cases":[],"step":null}]}]},{"id":"k02","titel":"Schutzfähigkeit und absolute Schutzhindernisse","untertitel":"§§ 3, 7, 8 MarkenG: Was ins Register darf","farbe":"#2F6B4F","icon":"register","beschreibung":"Markenfähigkeit, Formausschluss, Unterscheidungskraft, Freihaltebedürfnis, Bösgläubigkeit und die Verkehrsdurchsetzung als Rettungsanker.","kapitel":[{"id":"k02a","titel":"Markenfähigkeit und Formausschluss (§ 3)","einheiten":[{"id":"k02a-0","typ":"schema","titel":"Prüfungsschema: Eintragungsfähigkeit","schema":"schema_eintragungsfaehigkeit","text":"Das DPMA prüft in dieser Reihenfolge. Merke dir vor allem: § 3 Abs. 2 ist nicht durch Verkehrsdurchsetzung überwindbar, § 8 Abs. 2 Nr. 1 bis 3 schon.","concepts":[],"norms":[],"cases":[]},{"id":"k02a-1","typ":"fall","titel":"Die quadratische Schokolade","sachverhalt":"Ein Schokoladenhersteller hat die quadratische Verpackungsform seiner Tafeln als dreidimensionale Marke eingetragen. Ein Konkurrent beantragt die Löschung: Die Form verleihe der Ware ihren wesentlichen Wert, außerdem sei sie durch die Art der Ware bedingt.","frage":"Greift der Formausschluss des § 3 Abs. 2 Nr. 3 (wesentlicher Wert), weil Verbraucher die praktische quadratische Form schätzen?","antwort":false,"loesung":["**Nein!** Der BGH hat die Ritter-Sport-Verpackung als Marke bestätigt (Quadratische Tafelschokoladenverpackung II). Eine Form verleiht der Ware nur dann einen wesentlichen Wert, wenn die **ästhetische Qualität der Form** die Kaufentscheidung maßgeblich bestimmt.","Dass Verbraucher die Form als Herkunftshinweis erkennen oder praktisch finden, ist kein „wesentlicher Wert“ im Sinne der Norm. Auch § 3 Abs. 2 Nr. 1 greift nicht: Schokolade muss nicht quadratisch sein.","Hintergrund des § 3 Abs. 2: Technische und ästhetische Lösungen gehören ins Patent- und Designrecht mit begrenzter Laufzeit, nicht in ein ewiges Markenmonopol."],"merke":"§ 3 Abs. 2 sperrt drei Formen: warenbedingt, technisch erforderlich, wertverleihend. Keine Heilung durch Verkehrsdurchsetzung.","level":2,"concepts":["formausschluss","formmarke"],"norms":["§ 3 Abs. 2","Art. 4 MarkenRL"],"cases":["bgh_ritter_sport"],"step":null},{"id":"k02a-2","typ":"fall","titel":"Der Dübel mit Rippen","sachverhalt":"Ein Hersteller meldet die Form eines Bodendübels mit charakteristischen Rippen als Marke an. Die Rippen sorgen für besseren Halt im Boden. Es gäbe auch andere Formen, die denselben Halt erreichen.","frage":"Steht § 3 Abs. 2 Nr. 2 der Eintragung entgegen, obwohl alternative Formen dieselbe Wirkung erzielen könnten?","antwort":true,"loesung":["**Ja, in der Tat!** Ein Zeichen ist ausgeschlossen, wenn alle wesentlichen Merkmale der Form zur Erreichung einer **technischen Wirkung** erforderlich sind. Es genügt, dass die Merkmale eine technische Funktion erfüllen; sie müssen nicht die einzige Möglichkeit sein (BGH Bodendübel, EuGH Philips/Remington).","Wäre es anders, könnte der Anmelder mit mehreren Formmarken sämtliche Alternativen sperren und so ein zeitlich unbegrenztes Technikmonopol erhalten."],"merke":"Beim technischen Formausschluss zählt nicht, ob es Alternativen gibt, sondern ob die Form technisch funktioniert.","level":2,"concepts":["formausschluss"],"norms":["§ 3 Abs. 2 Nr. 2"],"cases":["bgh_bodenduebel","eugh_philips_remington"],"step":null},{"id":"k02a-3","typ":"fall","titel":"Der variable Slogan","sachverhalt":"Ein Unternehmen möchte „ein Slogan, der jeweils den aktuellen Monat nennt“ als Marke schützen lassen, ohne die konkrete Wortfolge festzulegen.","frage":"Ist dieses „Zeichen“ markenfähig?","antwort":false,"loesung":["**Nein!** Markenfähig ist nur ein Zeichen, das als **einheitlicher Gegenstand** bestimmbar ist. Variable Marken, mit denen Schutz für eine unbestimmte Zahl unterschiedlicher Erscheinungsformen beansprucht wird, fehlt bereits die Markenfähigkeit nach § 3 Abs. 1.","Zusätzlich fehlt die Darstellbarkeit im Register (§ 8 Abs. 1): Behörden und Publikum müssen den Schutzgegenstand klar und eindeutig bestimmen können. Das Erfordernis stammt aus Art. 3 lit. b MarkenRL, der die graphische Darstellbarkeit durch dieses Bestimmtheitsgebot ersetzt hat."],"merke":"Ein Zeichen, kein Konzept: Das Register schützt nur konkret bestimmte Zeichen.","level":1,"concepts":["markenfaehigkeit","darstellbarkeit"],"norms":["§ 3 Abs. 1","§ 8 Abs. 1","Art. 3 MarkenRL"],"cases":[],"step":null}]},{"id":"k02b","titel":"Unterscheidungskraft (§ 8 Abs. 2 Nr. 1)","einheiten":[{"id":"k02b-0","typ":"intro","titel":"Was Unterscheidungskraft bedeutet","text":"Unterscheidungskraft ist die **konkrete** Eignung eines Zeichens, vom Verkehr als Herkunftshinweis für die beanspruchten Waren verstanden zu werden. Der Maßstab ist großzügig: **Jede noch so geringe** Unterscheidungskraft genügt. Sie fehlt bei beschreibenden Angaben, bei gebräuchlichen Wörtern, die immer nur als solche verstanden werden, und bei reinen Werbeaussagen. Maßgeblich ist der Durchschnittsverbraucher im Anmeldezeitpunkt, und zwar für jede Ware gesondert.","concepts":["unterscheidungskraft","durchschnittsverbraucher"],"norms":["§ 8 Abs. 2 Nr. 1"],"cases":[]},{"id":"k02b-1","typ":"fall","titel":"„marktfrisch“ für Lebensmittel","sachverhalt":"Ein Lebensmittelhändler meldet „marktfrisch“ für Obst, Gemüse und Fleisch an.","frage":"Fehlt dem Zeichen für diese Waren die Unterscheidungskraft?","antwort":true,"loesung":["**Ja!** Ein Wort mit einem für die Waren **im Vordergrund stehenden beschreibenden Begriffsinhalt** hat keine Unterscheidungskraft. „marktfrisch“ beschreibt die Beschaffenheit der Lebensmittel; der Verkehr sieht darin eine Qualitätsangabe, keinen Herkunftshinweis (BGH marktfrisch).","Zugleich besteht ein Freihaltebedürfnis nach § 8 Abs. 2 Nr. 2, weil Mitbewerber die Angabe ebenfalls brauchen. Beide Hindernisse sind gesondert zu prüfen, überschneiden sich aber häufig."],"merke":"Beschreibend für die konkrete Ware = keine Unterscheidungskraft. Immer wareweise prüfen!","level":1,"concepts":["unterscheidungskraft","freihaltebeduerfnis"],"norms":["§ 8 Abs. 2 Nr. 1"],"cases":["bgh_marktfrisch"],"step":null},{"id":"k02b-2","typ":"fall","titel":"„HOT“ für Ketchup und Massageöl","sachverhalt":"„HOT“ wird für Ketchup, Reinigungsmittel, Massageöle und Bekleidung angemeldet. Der Anmelder argumentiert: Das Wort sei mehrdeutig (heiß, scharf, angesagt) und deshalb unterscheidungskräftig.","frage":"Rettet die Mehrdeutigkeit die Unterscheidungskraft?","antwort":false,"loesung":["**Nein!** Es genügt, dass das Zeichen **in einer seiner möglichen Bedeutungen** ein Merkmal der Waren beschreibt (BGH HOT). Für Ketchup beschreibt „hot“ die Schärfe, für Massageöl die wärmende Wirkung, für Bekleidung liegt eine bloße Anpreisung („angesagt“) nahe.","Mehrdeutigkeit begründet nur dann Unterscheidungskraft, wenn keine der naheliegenden Bedeutungen beschreibend ist und der Verkehr zum Nachdenken angeregt wird."],"merke":"Eine beschreibende Bedeutung reicht. Mehrdeutigkeit hilft nur, wenn keine Deutung beschreibt.","level":2,"concepts":["unterscheidungskraft"],"norms":["§ 8 Abs. 2 Nr. 1","§ 8 Abs. 2 Nr. 2"],"cases":["bgh_hot"],"step":null},{"id":"k02b-3","typ":"fall","titel":"„for you“ für Nahrungsergänzung","sachverhalt":"Ein Hersteller meldet die Wortfolge „for you“ für Nahrungsergänzungsmittel und Kosmetik an.","frage":"Ist „for you“ unterscheidungskräftig, weil es die Waren nicht beschreibt?","antwort":false,"loesung":["**Nein!** Unterscheidungskraft fehlt auch Zeichen, die der Verkehr nur als **werbliche Anpreisung** versteht. „for you“ („für dich“) ist eine allgemeine Kundenansprache ohne Herkunftshinweis (BGH for you).","Anders liegt es bei Wortfolgen, die originell, mehrdeutig oder interpretationsbedürftig sind (EuGH Vorsprung durch Technik) oder bei denen kein Werbebezug erkennbar ist (BGH OUI für Bekleidung)."],"merke":"Nicht beschreibend heißt nicht automatisch unterscheidungskräftig: Reine Werbeslogans fallen auch durch.","level":2,"concepts":["unterscheidungskraft"],"norms":["§ 8 Abs. 2 Nr. 1"],"cases":["bgh_for_you","bgh_oui","bgh_link_economy"],"step":null},{"id":"k02b-4","typ":"fall","titel":"„#darferdas?“ auf T-Shirts","sachverhalt":"Das Zeichen „#darferdas?“ wird für Bekleidung angemeldet. Auf der Vorderseite eines T-Shirts würde es als Spruch wahrgenommen; im Einnähetikett dagegen als Marke. Beide Verwendungen sind in der Modebranche üblich.","frage":"Darf das DPMA die Unterscheidungskraft allein nach der wahrscheinlichsten Verwendung (Aufdruck vorn) beurteilen?","antwort":false,"loesung":["**Nein!** Bei der Prüfung sind **alle praktisch bedeutsamen Verwendungsarten** in der Branche zu berücksichtigen. Nur wenn eine einzige Verwendungsart praktisch bedeutsam ist, darf die Prüfung darauf beschränkt werden (EuGH #darferdas?, BGH #darferdas? II).","Da in der Bekleidungsbranche auch die Kennzeichnung im Etikett praktisch bedeutsam ist und der Verkehr das Zeichen dort als Herkunftshinweis versteht, kann die Eintragung nicht schlechthin versagt werden."],"merke":"Verwendungsformen: alle praktisch bedeutsamen, nicht nur die wahrscheinlichste.","level":3,"concepts":["verwendungsformen","unterscheidungskraft"],"norms":["§ 8 Abs. 2 Nr. 1"],"cases":["eugh_darferdas","bgh_darferdas_ii","bgh_marlene_dietrich_ii"],"step":null},{"id":"k02b-5","typ":"fall","titel":"„Pippi Langstrumpf“ für ein Hotel","sachverhalt":"Ein Hotelbetreiber meldet „Pippi Langstrumpf“ für Beherbergungsdienstleistungen an. Das DPMA meint, der Verkehr denke sofort an die Romanfigur und ein kindgerechtes Hotel; das Zeichen sei daher beschreibend.","frage":"Fehlt „Pippi Langstrumpf“ für Hotels die Unterscheidungskraft?","antwort":false,"loesung":["**Nein!** Der Name einer fiktiven Figur beschreibt Beherbergungsdienstleistungen nicht. Assoziationen, die der Verkehr von der Figur auf das Hotel überträgt, erzeugen allenfalls eine **beschreibende Konnotation**, nehmen dem Zeichen aber nicht die Eignung als Herkunftshinweis (BGH Pippi-Langstrumpf-Marke).","Anders wäre es nur bei einem engen beschreibenden Bezug, etwa „Pippi Langstrumpf“ für Kinderbücher über genau diese Figur."],"merke":"„Sprechende“ Marken sind erlaubt: Ein Anklang an die Ware schadet nicht, nur ein enger beschreibender Bezug.","level":2,"concepts":["unterscheidungskraft"],"norms":["§ 8 Abs. 2 Nr. 1"],"cases":["bgh_pippi_langstrumpf"],"step":null},{"id":"k02b-6","typ":"fall","titel":"Die Pralinenkugel","sachverhalt":"Ein Hersteller meldet die Form einer runden, mit Nusssplittern besetzten Praline in goldener Folie als 3D-Marke für Pralinen an.","frage":"Hat die Form originäre Unterscheidungskraft, weil sie hübsch und aufwendig ist?","antwort":false,"loesung":["**Nein!** Der Verkehr schließt aus der Form einer Ware gewöhnlich nicht auf ihre Herkunft, sondern sieht darin die Ware selbst. Originäre Unterscheidungskraft hat eine Warenform nur, wenn sie **erheblich von der Norm oder Branchenüblichkeit** abweicht (BGH ROCHER-Kugel).","Eine runde, nussbesetzte Praline in Folie bewegt sich im Rahmen des Üblichen. Der Weg ins Register führt hier nur über Verkehrsdurchsetzung (§ 8 Abs. 3), für die der BGH mindestens 50 % Zuordnung verlangt."],"merke":"Warenformen: Unterscheidungskraft nur bei erheblicher Abweichung vom Branchenüblichen.","level":2,"concepts":["formmarke","unterscheidungskraft","verkehrsdurchsetzung"],"norms":["§ 8 Abs. 2 Nr. 1","§ 8 Abs. 3"],"cases":["bgh_rocher_kugel"],"step":null}]},{"id":"k02c","titel":"Freihaltebedürfnis, Bösgläubigkeit, Verkehrsdurchsetzung","einheiten":[{"id":"k02c-1","typ":"fall","titel":"„Black Friday“ für Elektronik","sachverhalt":"„Black Friday“ wurde 2013 als Wortmarke für Elektronikwaren und Werbedienstleistungen eingetragen. Damals war der Begriff in Deutschland noch wenig verbreitet. Ein Händler beantragt die Löschung wegen Freihaltebedürfnisses.","frage":"Kann ein Freihaltebedürfnis nach § 8 Abs. 2 Nr. 2 bestehen, obwohl die Angabe im Anmeldezeitpunkt noch kaum beschreibend verwendet wurde?","antwort":true,"loesung":["**Ja!** § 8 Abs. 2 Nr. 2 erfasst Angaben, die zur Beschreibung von Merkmalen der Waren **dienen können**. Es genügt, dass im Anmeldezeitpunkt vernünftigerweise zu erwarten war, dass die Angabe künftig beschreibend verwendet wird (BGH Black Friday, EuGH Chiemsee).","„Black Friday“ bezeichnet den Zeitpunkt von Rabattaktionen und damit ein Merkmal von Werbedienstleistungen und Elektronikangeboten. Die Marke wurde insoweit gelöscht."],"merke":"Freihaltebedürfnis auch für die Zukunft: „dienen können“, nicht „schon dienen“.","level":2,"concepts":["freihaltebeduerfnis","nichtigkeit"],"norms":["§ 8 Abs. 2 Nr. 2","§ 50"],"cases":["bgh_black_friday","eugh_chiemsee"],"step":null},{"id":"k02c-2","typ":"mc","titel":"Nr. 1 oder Nr. 2?","sachverhalt":"","frage":"Was ist der eigentliche Schutzzweck des § 8 Abs. 2 Nr. 2 (Freihaltebedürfnis) im Unterschied zu Nr. 1?","optionen":["Verbraucherschutz vor Irreführung","Das Allgemeininteresse der Mitbewerber an der freien Verwendbarkeit beschreibender Angaben","Der Schutz der Herkunftsfunktion","Die Vermeidung von Doppeleintragungen"],"richtig":1,"loesung":["Nr. 2 schützt das **Allgemeininteresse der Mitbewerber**: Angaben über Art, Beschaffenheit, Menge, Bestimmung, Herkunft oder Zeit dürfen nicht monopolisiert werden. Nr. 1 schützt dagegen die Herkunftsfunktion aus Sicht des Verbrauchers.","Praktisch fehlt jeder nach Nr. 2 beschreibenden Angabe auch die Unterscheidungskraft nach Nr. 1; umgekehrt gilt das nicht (Beispiel „for you“: nicht beschreibend, aber trotzdem ohne Unterscheidungskraft)."],"merke":"","level":1,"concepts":["freihaltebeduerfnis","unterscheidungskraft"],"norms":["§ 8 Abs. 2 Nr. 2"],"cases":[],"step":null},{"id":"k02c-3","typ":"fall","titel":"Die Sperrmarke","sachverhalt":"Max erfährt, dass ein Start-up unter „NEBULA“ eine Software vertreibt, aber die Marke nicht angemeldet hat. Er meldet „NEBULA“ für Software an, ohne sie selbst benutzen zu wollen, und fordert vom Start-up 50.000 Euro für die Übertragung.","frage":"Kann die Marke wegen Bösgläubigkeit gelöscht werden?","antwort":true,"loesung":["**Ja, in der Tat!** Bösgläubig handelt, wer ein Zeichen in Kenntnis eines **schutzwürdigen Besitzstands** eines Vorbenutzers ohne sachlichen Grund für gleiche Waren anmeldet, um diesen Besitzstand zu stören oder die Benutzung zu sperren (BGH EROS, GLÜCKSPILZ).","Die Absicht, die Marke nur als Druckmittel einzusetzen (Hinterhalts- oder Sperrmarke), zeigt, dass Max sie nicht zur Förderung des eigenen Absatzes will. Rechtsfolge: Nichtigkeit nach § 50 i.V.m. § 8 Abs. 2 Nr. 14.","Die bloße Kenntnis von der Vorbenutzung genügt allerdings nicht; hinzukommen müssen besondere Umstände wie hier die Behinderungsabsicht (BGH Ivadal). Unionsrechtlich ist die Bösgläubigkeit seit Art. 4 Abs. 2 MarkenRL ein zwingender Nichtigkeitsgrund."],"merke":"Bösgläubigkeit = Anmeldung als Waffe statt als Kennzeichen. Maßgeblicher Zeitpunkt: die Anmeldung.","level":2,"concepts":["boesglaeubigkeit"],"norms":["§ 8 Abs. 2 Nr. 14","§ 50","Art. 4 MarkenRL"],"cases":["bgh_eros","bgh_glueckspilz","bgh_ivadal"],"step":null},{"id":"k02c-4","typ":"fall","titel":"Das Gelb der Wörterbücher","sachverhalt":"Ein Verlag benutzt seit Jahrzehnten einen bestimmten Gelbton für zweisprachige Wörterbücher, stets zusammen mit seinem Namen. Eine Umfrage ergibt, dass 66 % der Befragten die Farbe dem Verlag zuordnen.","frage":"Kann die abstrakte Farbmarke Gelb trotz fehlender originärer Unterscheidungskraft eingetragen werden?","antwort":true,"loesung":["**Ja!** Nach § 8 Abs. 3 stehen die Hindernisse der Nr. 1 bis 3 nicht entgegen, wenn sich die Marke infolge ihrer Benutzung **in den beteiligten Verkehrskreisen durchgesetzt** hat. Für Farbmarken verlangt der BGH regelmäßig einen Zuordnungsgrad von über 50 % (Langenscheidt-Gelb, Nivea-Blau).","Dass die Farbe immer zusammen mit dem Verlagsnamen benutzt wurde, schadet nicht, solange der Verkehr die Farbe selbst als Herkunftshinweis versteht."],"merke":"Verkehrsdurchsetzung heilt Nr. 1 bis 3, nicht aber § 3 Abs. 2 oder Nr. 4 ff. Richtwert: über 50 %.","level":2,"concepts":["verkehrsdurchsetzung","farbmarke"],"norms":["§ 8 Abs. 3"],"cases":["bgh_langenscheidt_gelb","bgh_nivea_blau"],"step":null},{"id":"k02c-5","typ":"fall","titel":"Die Marke „test“","sachverhalt":"Eine Verbraucherorganisation hat „test“ als Wort-Bild-Marke für Testzeitschriften eingetragen. Im Löschungsverfahren ergibt eine Umfrage einen Zuordnungsgrad von 43 %.","frage":"Reicht das für die Verkehrsdurchsetzung einer glatt beschreibenden Angabe aus?","antwort":false,"loesung":["**Nein!** „test“ beschreibt den Inhalt einer Testzeitschrift. Für die Verkehrsdurchsetzung ist ein Zuordnungsgrad von 43 % regelmäßig **nicht ausreichend** (BGH test). Bei glatt beschreibenden Angaben verlangt der BGH sogar eine deutlich über 50 % liegende Quote.","Maßgeblicher Zeitpunkt ist der Anmeldetag; im Löschungsverfahren muss die Durchsetzung zudem noch im Entscheidungszeitpunkt fortbestehen (§ 50 Abs. 2)."],"merke":"Je beschreibender das Zeichen, desto höher die nötige Durchsetzungsquote.","level":2,"concepts":["verkehrsdurchsetzung"],"norms":["§ 8 Abs. 3","§ 50 Abs. 2"],"cases":["bgh_test","bgh_kinder_ii"],"step":null},{"id":"k02c-6","typ":"mc","titel":"Wer trägt die Feststellungslast im Löschungsverfahren?","sachverhalt":"","frage":"Ein Dritter beantragt die Löschung der eingetragenen Marke „smartbook“ wegen fehlender Unterscheidungskraft. Ob das Zeichen im Anmeldezeitpunkt beschreibend war, lässt sich nicht sicher klären. Was gilt?","optionen":["Die Marke wird gelöscht, weil der Inhaber die Schutzfähigkeit beweisen muss","Die Marke bleibt bestehen, weil der Antragsteller die Feststellungslast für das Schutzhindernis trägt","Das DPMA entscheidet nach freiem Ermessen","Die Marke wird zur Hälfte gelöscht"],"richtig":1,"loesung":["Im Nichtigkeitsverfahren nach § 50 trägt der **Antragsteller die Feststellungslast** für das Vorliegen des Schutzhindernisses im Anmeldezeitpunkt. Verbleibende Zweifel gehen zu seinen Lasten (BGH smartbook, Sparkassen-Rot).","Die eingetragene Marke genießt also einen Bestandsschutz: Was einmal im Register steht, wird nur bei feststellbarem Mangel gelöscht."],"merke":"","level":2,"concepts":["nichtigkeit","absolute_schutzhindernisse"],"norms":["§ 50"],"cases":["bgh_smartbook","bgh_sparkassen_rot"],"step":null}]}]},{"id":"k03","titel":"Markenverletzung I: Aufbau und markenmäßige Benutzung","untertitel":"§ 14 Abs. 2 MarkenG: Der Verletzungstatbestand","farbe":"#8A2F1F","icon":"verletzung","beschreibung":"Das zentrale Klausurschema: Aktivlegitimation, geschäftlicher Verkehr, markenmäßige Benutzung, Doppelidentität und die Sonderfälle Keyword-Advertising und Modellbezeichnung.","kapitel":[{"id":"k03a","titel":"Der Aufbau des Verletzungstatbestands","einheiten":[{"id":"k03a-0","typ":"schema","titel":"Prüfungsschema: Unterlassungsanspruch aus § 14","schema":"schema_markenverletzung","text":"Dieses Schema begleitet dich durch die Kurse 3 bis 6. Präge dir die Reihenfolge ein: Marke, Verletzungshandlung, Schranken, Rechtsfolge.","concepts":[],"norms":[],"cases":[]},{"id":"k03a-1","typ":"fall","titel":"Der private Flohmarktverkauf","sachverhalt":"Studentin Sara verkauft auf einem Flohmarkt ihre alte, echte Designerjacke und drei selbstgenähte Taschen, auf die sie zum Spaß das Logo eines Luxuslabels gestickt hat.","frage":"Handelt Sara mit den Taschen im geschäftlichen Verkehr?","antwort":false,"loesung":["**Nein!** Eine Benutzung im geschäftlichen Verkehr liegt vor, wenn sie im Zusammenhang mit einer auf wirtschaftlichen Vorteil gerichteten Tätigkeit erfolgt und nicht rein privat ist. Ein gelegentlicher Verkauf privater Gegenstände auf dem Flohmarkt ist **Privatbereich**.","Anders wäre es, wenn Sara regelmäßig, in größerem Umfang oder mit Neuware handelt. An das Merkmal werden zwar keine hohen Anforderungen gestellt, der rein private Bereich bleibt aber frei. Auch die Strafbarkeit nach § 143 setzt geschäftlichen Verkehr voraus."],"merke":"Kein geschäftlicher Verkehr, keine Markenverletzung. Indizien für Geschäftlichkeit: Häufigkeit, Umfang, Neuware, Gewerbeanmeldung.","level":1,"concepts":["geschaeftlicher_verkehr"],"norms":["§ 14 Abs. 2"],"cases":[],"step":"step:schema_markenverletzung.3.1"},{"id":"k03a-2","typ":"fall","titel":"Der Lizenznehmer klagt","sachverhalt":"Die Firma Nova ist Inhaberin der Marke „NOVA“. Sie hat der Firma Lux eine einfache Lizenz erteilt. Lux entdeckt Plagiate und will sofort selbst klagen. Nova antwortet nicht auf Lux' Anfrage.","frage":"Kann Lux als einfache Lizenznehmerin ohne Zustimmung von Nova Klage erheben?","antwort":false,"loesung":["**Nein!** Der Lizenznehmer kann Klage wegen Verletzung der Marke **nur mit Zustimmung des Inhabers** erheben (§ 30 Abs. 3 S. 1). Eine Ausnahme gilt nur für den **ausschließlichen** Lizenznehmer: Er darf klagen, wenn der Inhaber nach förmlicher Aufforderung nicht innerhalb angemessener Frist selbst klagt (§ 30 Abs. 3 S. 2).","Lux kann aber einer Klage von Nova beitreten, um eigenen Schaden geltend zu machen (§ 30 Abs. 4)."],"merke":"Aktivlegitimation: Inhaber (§ 28 Vermutung), Lizenznehmer nur mit Zustimmung, ausschließlicher Lizenznehmer nach Aufforderung.","level":2,"concepts":["aktivlegitimation","lizenz"],"norms":["§ 30 Abs. 3","§ 28"],"cases":[],"step":"step:schema_markenverletzung.2.2"},{"id":"k03a-3","typ":"fall","titel":"Die Bindung an die Eintragung","sachverhalt":"Der Inhaber der eingetragenen Marke „SUPERSOFT“ für Toilettenpapier klagt gegen einen Konkurrenten. Dieser wendet ein, „supersoft“ sei glatt beschreibend und hätte nie eingetragen werden dürfen.","frage":"Darf das Verletzungsgericht die Klage abweisen, weil die Marke nicht schutzfähig ist?","antwort":false,"loesung":["**Nein!** Das Verletzungsgericht ist an die **Eintragung gebunden**. Absolute Schutzhindernisse prüft es nicht; dafür ist das Nichtigkeitsverfahren vor dem DPMA zuständig (§§ 50, 53).","Der Beklagte kann einen Löschungsantrag stellen und die Aussetzung des Verletzungsprozesses anregen (§ 148 ZPO). Außerdem kann er sich auf § 23 Abs. 1 Nr. 2 berufen, wenn er „supersoft“ nur beschreibend benutzt. Die geringe Kennzeichnungskraft fließt zudem in die Verwechslungsgefahr ein."],"merke":"Bindung an die Eintragung: Schutzfähigkeit wird im Register geklärt, nicht im Verletzungsprozess.","level":2,"concepts":["entstehung_markenschutz","nichtigkeit","schranke_23"],"norms":["§ 4 Nr. 1","§ 50"],"cases":["bgh_langenscheidt_gelb","bgh_sparkassen_rot"],"step":"step:schema_markenverletzung.2.1"}]},{"id":"k03b","titel":"Markenmäßige Benutzung","einheiten":[{"id":"k03b-0","typ":"intro","titel":"Das ungeschriebene Tatbestandsmerkmal","text":"§ 14 Abs. 2 verbietet nicht jede Verwendung eines fremden Zeichens. Erforderlich ist eine **markenmäßige Benutzung**: Das Zeichen muss so benutzt werden, dass es die Funktionen der Marke, vor allem die Herkunftsfunktion, beeinträchtigt oder beeinträchtigen kann. Der Verkehr muss das Zeichen also als Hinweis auf die betriebliche Herkunft der Ware verstehen. Rein beschreibende, dekorative oder firmenmäßige Verwendungen scheiden aus. Die folgenden Fälle zeigen die Grenzlinie.","concepts":["markenmaessige_benutzung","herkunftsfunktion"],"norms":["§ 14 Abs. 2"],"cases":[]},{"id":"k03b-1","typ":"fall","titel":"Der Modellbausatz","sachverhalt":"Ein Spielzeughersteller vertreibt originalgetreue Modellautos, auf deren Kühlergrill das eingetragene Logo des Autoherstellers (auch für Spielzeug eingetragen) abgebildet ist.","frage":"Verletzt die Abbildung des Logos die Spielzeugmarke des Autoherstellers?","antwort":false,"loesung":["**Nein!** Der Verkehr versteht das Logo auf dem Modellauto nur als **originalgetreue Nachbildung** des Vorbilds, nicht als Hinweis auf die Herkunft des Spielzeugs (BGH Opel-Blitz II, EuGH Adam Opel).","Die Herkunftsfunktion der für Spielzeug eingetragenen Marke wird also nicht beeinträchtigt; es fehlt an der markenmäßigen Benutzung."],"merke":"Abbildung als Teil der Wirklichkeit ist kein Herkunftshinweis.","level":2,"concepts":["markenmaessige_benutzung","herkunftsfunktion"],"norms":["§ 14 Abs. 2 Nr. 1"],"cases":["bgh_opel_blitz_ii","eugh_adam_opel"],"step":"step:schema_markenverletzung.3.4"},{"id":"k03b-2","typ":"fall","titel":"Der Frühstücks-Drink","sachverhalt":"Ein Molkereiunternehmen ist Inhaber der Marke „FRÜHSTÜCKS-DRINK“. Ein Konkurrent bewirbt sein Joghurtgetränk mit dem Text „der ideale Frühstücks-Drink für die ganze Familie“, unter seiner eigenen, deutlich hervorgehobenen Marke.","frage":"Benutzt der Konkurrent „Frühstücks-Drink“ markenmäßig?","antwort":false,"loesung":["**Nein!** Eine markenmäßige Benutzung setzt voraus, dass das Zeichen im Rahmen des Produktabsatzes jedenfalls auch der **Unterscheidung der Waren** eines Unternehmens von denen anderer dient. Hier wird der Begriff rein **beschreibend** als Produktbezeichnung im Fließtext verwendet (BGH FRÜHSTÜCKS-DRINK II).","Der Verkehr entnimmt der Wendung keine Herkunftsangabe; die eigene Marke des Konkurrenten steht im Vordergrund. Es fehlt bereits am Tatbestand, § 23 muss gar nicht mehr geprüft werden."],"merke":"Beschreibend im Fließtext = keine markenmäßige Benutzung.","level":1,"concepts":["markenmaessige_benutzung"],"norms":["§ 14 Abs. 2 Nr. 2"],"cases":["bgh_fruehstuecks_drink_ii"],"step":"step:schema_markenverletzung.3.4"},{"id":"k03b-3","typ":"fall","titel":"Die Hose „Sam“","sachverhalt":"Ein Online-Händler bietet Hosen an. Im Fließtext des Angebots steht klein „Modell: Sam“, während die Herstellermarke groß in der Überschrift erscheint. „SAM“ ist als Wortmarke für Bekleidung eingetragen, aber nicht bekannt.","frage":"Liegt in der Nennung „Modell: Sam“ eine markenmäßige Benutzung?","antwort":false,"loesung":["**Nein, jedenfalls nicht ohne weiteres!** Ob eine Modellbezeichnung als Herkunftshinweis verstanden wird, hängt von den **Kennzeichnungsgewohnheiten der Branche** und der konkreten Präsentation ab (BGH SAM).","Bei einer unauffälligen Nennung nur im Bestelltext eines Online-Angebots, ohne Bekanntheit der Marke und mit prominenter Herstellermarke, sieht der Verkehr im Vornamen nur eine Bestellhilfe. Anders bei Anbringung auf der Ware oder dem Etikett: Dort liegt regelmäßig ein Herkunftshinweis vor."],"merke":"Modellbezeichnungen: Etikett und Ware sprechen für Herkunftshinweis, versteckter Bestelltext dagegen.","level":3,"concepts":["markenmaessige_benutzung"],"norms":["§ 14 Abs. 2 Nr. 1"],"cases":["bgh_sam","bgh_damen_hose_mo"],"step":"step:schema_markenverletzung.3.4"},{"id":"k03b-4","typ":"fall","titel":"Die Damen-Hose „MO“","sachverhalt":"Ein Händler überschreibt sein Angebot mit „Bench Damen Hose MO“. „MO“ ist als Marke für Bekleidung eingetragen. Der Händler meint, wegen der bekannten Herstellermarke „Bench“ könne „MO“ kein Herkunftshinweis sein.","frage":"Schließt die bekannte Herstellermarke aus, dass „MO“ markenmäßig benutzt wird?","antwort":false,"loesung":["**Nein!** Der Verkehr ist in der Modebranche an **Zweitmarken** neben der Herstellermarke gewöhnt. Erscheint die Modellbezeichnung in der Angebotsüberschrift neben der Herstellermarke, kann sie als eigenständiger Herkunftshinweis verstanden werden (BGH Damen Hose MO).","Entscheidend ist die Gesamtgestaltung: Position, Größe und Nähe zur Herstellermarke. Das OLG bejahte im Anschluss die markenmäßige Benutzung."],"merke":"Eine bekannte Herstellermarke schließt eine markenmäßig benutzte Zweitmarke nicht aus.","level":3,"concepts":["markenmaessige_benutzung"],"norms":["§ 14 Abs. 2 Nr. 2"],"cases":["bgh_damen_hose_mo"],"step":null},{"id":"k03b-5","typ":"fall","titel":"Der Firmenname auf der Rechnung","sachverhalt":"Die „Céline GmbH“ verkauft Bekleidung und verwendet ihren Firmennamen nur auf Rechnungen, dem Ladenschild und im Impressum, nie auf der Ware. Inhaberin der Bekleidungsmarke „CÉLINE“ ist ein anderes Unternehmen.","frage":"Ist die bloße Verwendung als Firmenname eine Benutzung „für Waren“ im Sinne des § 14 Abs. 2?","antwort":false,"loesung":["**Nein!** Die Benutzung einer Firma dient der Bezeichnung des Unternehmens, nicht der Unterscheidung von Waren. Sie ist nur dann eine Benutzung „für Waren“, wenn das Zeichen so verwendet wird, dass der Verkehr eine **Verbindung zwischen Firma und Ware** herstellt, etwa durch Anbringung auf der Ware oder in der Produktwerbung (EuGH Céline).","Gegen rein firmenmäßigen Gebrauch schützt § 15, wenn der Kläger ein Unternehmenskennzeichen hat, sowie das UWG. Seit dem MaMoG stellt § 14 Abs. 3 Nr. 5 klar, dass die Verwendung als Handelsname eine Verletzungshandlung sein kann, sofern sie „für Waren“ erfolgt; Vorbild ist Art. 10 Abs. 3 lit. d MarkenRL."],"merke":"Firma ≠ Marke. Firmenmäßiger Gebrauch verletzt § 14 nur mit Warenbezug.","level":2,"concepts":["firmenmaessiger_gebrauch","markenmaessige_benutzung"],"norms":["§ 14 Abs. 3 Nr. 5","§ 15","Art. 10 MarkenRL"],"cases":["eugh_celine"],"step":null}]},{"id":"k03c","titel":"Doppelidentität und Keyword-Advertising","einheiten":[{"id":"k03c-1","typ":"fall","titel":"Die Fälschung","sachverhalt":"Ein Händler verkauft Sneaker mit dem identischen Logo eines Sportartikelherstellers. Die Schuhe sind Fälschungen, allerdings von so guter Qualität, dass Kunden keinen Unterschied bemerken.","frage":"Muss der Markeninhaber eine Verwechslungsgefahr nachweisen?","antwort":false,"loesung":["**Nein!** Bei Identität des Zeichens und Identität der Waren gilt der **absolute Schutz** des § 14 Abs. 2 Nr. 1 (Doppelidentität). Eine Verwechslungsgefahr muss nicht festgestellt werden.","Erforderlich bleibt eine Beeinträchtigung einer Markenfunktion; bei Fälschungen ist die Herkunftsfunktion offensichtlich betroffen. Nach dem EuGH genügt bei Nr. 1 die Beeinträchtigung jeder Funktion, auch der Werbe- oder Investitionsfunktion (L'Oréal/Bellure). § 14 Abs. 2 Nr. 1 setzt Art. 10 Abs. 2 lit. a MarkenRL um; Erwägungsgrund 16 nennt den Schutz bei Doppelidentität ausdrücklich „absolut“."],"merke":"Identisch + identisch = Nr. 1. Keine Verwechslungsprüfung, aber Funktionsbeeinträchtigung.","level":1,"concepts":["doppelidentitaet","markenfunktionen"],"norms":["§ 14 Abs. 2 Nr. 1","Art. 10 MarkenRL"],"cases":["eugh_loreal_bellure"],"step":"step:schema_markenverletzung.3.5.1"},{"id":"k03c-2","typ":"fall","titel":"Die AdWords-Anzeige","sachverhalt":"Ein Erotikversand bucht die fremde Marke „bananabay“ als Keyword. Bei Google erscheint seine Anzeige im deutlich abgesetzten Anzeigenblock; sie enthält weder das Wort „bananabay“ noch einen Hinweis auf den Markeninhaber, und die Domain lautet „eis.de“.","frage":"Verletzt die Keyword-Buchung die Marke „bananabay“?","antwort":false,"loesung":["**Nein!** Das Keyword wird zwar im geschäftlichen Verkehr für Waren benutzt (EuGH Google France). Die **Herkunftsfunktion** ist aber nur beeinträchtigt, wenn ein normal informierter Internetnutzer nicht oder nur schwer erkennen kann, ob die beworbenen Waren vom Markeninhaber oder einem Dritten stammen.","Erscheint die Anzeige in einem abgesetzten Werbeblock, enthält sie die Marke nicht und weist die Domain auf ein anderes Unternehmen hin, ist die Herkunftsfunktion regelmäßig nicht beeinträchtigt (BGH Bananabay II, MOST-Pralinen)."],"merke":"Keyword-Advertising ist erlaubt, wenn die Anzeige über die fremde Herkunft nicht im Unklaren lässt.","level":2,"concepts":["keyword_advertising","herkunftsfunktion"],"norms":["§ 14 Abs. 2 Nr. 1"],"cases":["eugh_google_france","bgh_bananabay_ii","bgh_most_pralinen"],"step":null},{"id":"k03c-3","typ":"fall","titel":"Die Blumen-Anzeige","sachverhalt":"Ein Blumenversand bucht „Fleurop“ als Keyword. Der Verkehr weiß, dass Fleurop über ein Netz von Partnerfloristen arbeitet. Die Anzeige ist abgesetzt und enthält die Marke nicht; sie stellt aber auch nicht klar, dass der Werbende kein Fleurop-Partner ist.","frage":"Liegt hier ausnahmsweise eine Beeinträchtigung der Herkunftsfunktion vor?","antwort":true,"loesung":["**Ja!** Weiß der Verkehr, dass der Markeninhaber sein Geschäft über ein Netz **wirtschaftlich verbundener Partner** betreibt, liegt die Vermutung nahe, auch der Werbende gehöre dazu. Dann ist die Herkunftsfunktion beeinträchtigt, wenn die Anzeige eine solche Verbindung nicht ausschließt (BGH Fleurop).","Die Bananabay-Grundsätze gelten also nicht ausnahmslos; maßgeblich sind die Verkehrsvorstellungen über das konkrete Vertriebssystem."],"merke":"Ausnahme Fleurop: Bei bekannten Partnernetzen muss die Anzeige die fehlende Verbindung klarstellen.","level":3,"concepts":["keyword_advertising"],"norms":["§ 14 Abs. 2 Nr. 1"],"cases":["bgh_fleurop"],"step":null},{"id":"k03c-4","typ":"fall","titel":"Amazon und die Fahrradtaschen","sachverhalt":"Amazon schaltet Google-Anzeigen mit dem Text „Ortlieb Fahrradtasche“, die auf eine Amazon-Angebotsliste verlinken. Dort erscheinen neben Ortlieb-Taschen auch Taschen anderer Hersteller. Ortlieb verkauft selbst nicht über Amazon.","frage":"Verletzt diese Werbung die Marke „ORTLIEB“?","antwort":true,"loesung":["**Ja, in der Tat!** Der Nutzer erwartet aufgrund der Anzeige „Ortlieb Fahrradtasche“ **ausschließlich Ortlieb-Produkte**. Führt die Anzeige zu einer Liste mit gemischten Angeboten, wird die Werbewirkung der Marke zu Drittprodukten umgeleitet; die Anzeige ist irreführend und verletzt die Marke (BGH ORTLIEB II).","Anders bei der plattforminternen Suche: Wer bei Amazon „Ortlieb“ eingibt, rechnet mit Alternativangeboten in der Trefferliste (BGH ORTLIEB I)."],"merke":"Externe Anzeige mit Markennamen = Erwartung nur dieser Marke. Interne Suche = Alternativen erwartet.","level":3,"concepts":["keyword_advertising"],"norms":["§ 14 Abs. 2 Nr. 1","§ 14 Abs. 5"],"cases":["bgh_ortlieb_ii","bgh_ortlieb_i"],"step":null},{"id":"k03c-5","typ":"fall","titel":"Die satirische Postkarte","sachverhalt":"Ein Verlag vertreibt eine lilafarbene Postkarte mit dem Text „Über allen Wipfeln ist Ruh, irgendwo blökt eine Kuh. Muh! Rainer Maria Milka“. Lila und „Milka“ sind bekannte Marken.","frage":"Benutzt der Verlag die Marken markenmäßig, obwohl es sich um Satire handelt?","antwort":true,"loesung":["**Ja!** Der Verkehr erkennt die Farbe Lila und das Wort „Milka“ auf der Postkarte als Anspielung auf die bekannten Marken; die Zeichen werden **gedanklich verknüpft**. Für den Bekanntheitsschutz nach § 14 Abs. 2 Nr. 3 genügt das, eine Beeinträchtigung der Herkunftsfunktion ist nicht nötig (BGH Lila-Postkarte).","Der Verlag gewinnt den Fall trotzdem: Die Ausnutzung erfolgt nicht „ohne rechtfertigenden Grund in unlauterer Weise“, weil die **Kunstfreiheit** (Art. 5 Abs. 3 GG) überwiegt und die Marke nicht herabgesetzt wird. Dazu mehr in Kurs 5."],"merke":"Beim Bekanntheitsschutz reicht die gedankliche Verknüpfung; die Kunstfreiheit greift erst bei der Unlauterkeit.","level":3,"concepts":["markenmaessige_benutzung","bekannte_marke","unlauterkeit"],"norms":["§ 14 Abs. 2 Nr. 3"],"cases":["bgh_lila_postkarte"],"step":null}]}]},{"id":"k04","titel":"Markenverletzung II: Verwechslungsgefahr","untertitel":"§ 14 Abs. 2 Nr. 2 MarkenG: Der Kern jeder Markenklausur","farbe":"#2B5B8A","icon":"waage","beschreibung":"Warenähnlichkeit, Kennzeichnungskraft, Zeichenähnlichkeit und ihre Wechselwirkung. Prägetheorie, selbständig kennzeichnende Stellung und die Arten der Verwechslungsgefahr.","kapitel":[{"id":"k04a","titel":"Die drei Faktoren und ihre Wechselwirkung","einheiten":[{"id":"k04a-0","typ":"schema","titel":"Prüfungsschema: Verwechslungsgefahr","schema":"schema_verwechslungsgefahr","text":"Die Reihenfolge Warenähnlichkeit, Kennzeichnungskraft, Zeichenähnlichkeit, Gesamtabwägung solltest du auswendig können.","concepts":[],"norms":[],"cases":[]},{"id":"k04a-1","typ":"fall","titel":"Bier und Snacks","sachverhalt":"Die Marke „DESPERADO“ ist für Bier eingetragen. Ein Konkurrent meldet „DESPERADOS“ für Knabbergebäck an. Der Inhaber argumentiert: Bier und Snacks würden zusammen konsumiert und ergänzten sich funktionell.","frage":"Genügt die funktionelle Ergänzung, um Warenähnlichkeit zu bejahen?","antwort":false,"loesung":["**Nein!** Waren sind ähnlich, wenn sie unter Berücksichtigung aller Faktoren (Art, Verwendungszweck, Nutzung, Herstellungsstätten, Vertriebswege, Konkurrenz- oder Ergänzungsverhältnis) so enge Berührungspunkte aufweisen, dass der Verkehr bei identischer Kennzeichnung eine **gemeinsame betriebliche Herkunft** annehmen könnte.","Der Gesichtspunkt der funktionellen Ergänzung darf die übrigen Faktoren nicht verdrängen (BGH DESPERADOS/DESPERADO). Bier und Snacks stammen aus verschiedenen Betrieben, haben verschiedene Beschaffenheit und werden nur zufällig zusammen konsumiert."],"merke":"Warenähnlichkeit fragt: Würde der Verkehr bei gleicher Marke denselben Hersteller vermuten?","level":2,"concepts":["warenaehnlichkeit"],"norms":["§ 9 Abs. 1 Nr. 2","§ 14 Abs. 2 Nr. 2"],"cases":["bgh_desperados","eugh_canon"],"step":"step:schema_verwechslungsgefahr.2"},{"id":"k04a-2","typ":"fall","titel":"„Kinder“ für Schokolade","sachverhalt":"Die Marke „Kinder“ ist für Süßwaren eingetragen. Sie wurde nur aufgrund von Verkehrsdurchsetzung eingetragen, da sie die Zielgruppe beschreibt. Der Inhaber macht gegen „Kinderzeit“ eine gesteigerte Kennzeichnungskraft geltend, weil die Marke sehr bekannt sei.","frage":"Hat „Kinder“ automatisch gesteigerte Kennzeichnungskraft, weil die Marke bekannt ist?","antwort":false,"loesung":["**Nein!** Eine glatt beschreibende Angabe, die erst durch Verkehrsdurchsetzung eingetragen wurde, hat regelmäßig nur **durchschnittliche** Kennzeichnungskraft (BGH Kinder II). Die Bekanntheit war nötig, um überhaupt ins Register zu kommen; sie führt nicht zusätzlich zu einem erweiterten Schutzbereich.","Gesteigerte Kennzeichnungskraft setzt voraus, dass die Bekanntheit über das für die Durchsetzung nötige Maß deutlich hinausgeht. Zudem bleibt der Schutz auf die konkrete durchgesetzte Form beschränkt."],"merke":"Verkehrsdurchsetzung hebt das Zeichen auf Normalniveau, nicht darüber.","level":2,"concepts":["kennzeichnungskraft","verkehrsdurchsetzung"],"norms":["§ 14 Abs. 2 Nr. 2"],"cases":["bgh_kinder_ii"],"step":"step:schema_verwechslungsgefahr.3"},{"id":"k04a-3","typ":"mc","titel":"Die Skala der Kennzeichnungskraft","sachverhalt":"","frage":"Welche Abstufungen der Kennzeichnungskraft unterscheidet der BGH seit „Culinaria/Villa Culinaria“?","optionen":["Schwach, normal, stark","Sehr gering, gering, durchschnittlich, erhöht, sehr hoch","Vorhanden oder nicht vorhanden","Beschreibend, suggestiv, willkürlich, fantasievoll"],"richtig":1,"loesung":["Der BGH unterscheidet **fünf Grade**: sehr geringe, geringe (unterdurchschnittliche), durchschnittliche (normale), erhöhte (überdurchschnittliche) und sehr hohe Kennzeichnungskraft.","Ausgangspunkt ist die originäre Kennzeichnungskraft (Phantasiewort: durchschnittlich; beschreibende Anklänge: geringer). Steigerung durch intensive Benutzung, Schwächung durch Drittzeichen im Ähnlichkeitsbereich."],"merke":"","level":1,"concepts":["kennzeichnungskraft"],"norms":[],"cases":["bgh_culinaria"],"step":null},{"id":"k04a-4","typ":"fall","titel":"Die Wechselwirkung","sachverhalt":"Die Marke „CANON“ (Kameras, hohe Kennzeichnungskraft) kollidiert mit „CANNON“ für Videokassetten. Die Zeichen sind klanglich identisch, die Waren nur entfernt ähnlich.","frage":"Kann eine hohe Kennzeichnungskraft und Zeichenähnlichkeit eine geringe Warenähnlichkeit ausgleichen?","antwort":true,"loesung":["**Ja, in der Tat!** Nach der **Wechselwirkungslehre** kann ein geringerer Grad eines Faktors durch einen höheren Grad eines anderen ausgeglichen werden (EuGH Canon). Bei klanglicher Identität und hoher Kennzeichnungskraft reicht schon eine entfernte Warenähnlichkeit.","Grenze: Absolute Unähnlichkeit der Waren oder der Zeichen lässt sich nicht kompensieren. Dann kommt nur der Bekanntheitsschutz (§ 14 Abs. 2 Nr. 3) in Betracht."],"merke":"Wechselwirkung: drei Schieberegler, aber keiner darf auf null stehen.","level":1,"concepts":["wechselwirkung","kennzeichnungskraft"],"norms":["§ 14 Abs. 2 Nr. 2"],"cases":["eugh_canon","eugh_lloyd"],"step":"step:schema_verwechslungsgefahr.5"},{"id":"k04a-5","typ":"fall","titel":"Ärzte und Patienten","sachverhalt":"Die Arzneimittelmarken „Maalox“ und „Melox-GRY“ stehen sich gegenüber. Fachkreise (Ärzte, Apotheker) unterscheiden die Zeichen sicher, Endverbraucher könnten sie verwechseln.","frage":"Genügt es für die Verwechslungsgefahr, dass sie bei einer der beiden Verkehrsgruppen besteht?","antwort":true,"loesung":["**Ja!** Setzen sich die angesprochenen Verkehrskreise aus mehreren Gruppen zusammen, genügt es, dass die Verwechslungsgefahr bei **einer** Gruppe besteht (BGH Maalox/Melox-GRY).","Im konkreten Fall verneinte der BGH die Verwechslungsgefahr allerdings, weil die Zeichen klanglich („Maa-lox“ gegen „Me-lox-GRY“) und schriftbildlich hinreichend verschieden sind und der Bestandteil „GRY“ den Gesamteindruck mitprägt."],"merke":"Gespaltene Verkehrsauffassung: Verwechslungsgefahr bei einer Gruppe reicht.","level":2,"concepts":["durchschnittsverbraucher","zeichenaehnlichkeit"],"norms":["§ 9 Abs. 1 Nr. 2"],"cases":["bgh_maalox","eugh_lloyd"],"step":"step:schema_verwechslungsgefahr.1"}]},{"id":"k04b","titel":"Zeichenähnlichkeit: Gesamteindruck, Prägung, selbständige Stellung","einheiten":[{"id":"k04b-1","typ":"fall","titel":"Die springende Raubkatze","sachverhalt":"Die Wort-Bild-Marke eines Sportartikelherstellers zeigt eine springende Raubkatze neben dem Firmennamen. Ein Konkurrent verwendet eine ähnliche springende Raubkatze ohne Wort.","frage":"Darf beim Zeichenvergleich allein auf den Bildbestandteil abgestellt werden?","antwort":true,"loesung":["**Ja, wenn er den Gesamteindruck prägt!** Maßgeblich ist zwar der Gesamteindruck des Zeichens. Ein einzelner Bestandteil kann den Gesamteindruck aber **prägen**, wenn die übrigen Bestandteile für den Verkehr zurücktreten und ihn nicht mitbestimmen (BGH Springende Raubkatze, Prägetheorie).","Ein rein beschreibender Bestandteil prägt nie. Bei Wort-Bild-Marken orientiert sich der Verkehr im Regelfall am Wort; ein einprägsames Bild kann aber ebenso prägen."],"merke":"Prägetheorie: Der Vergleich erfolgt mit dem Bestandteil, der im Erinnerungsbild des Verkehrs übrig bleibt.","level":2,"concepts":["praegetheorie","gesamteindruck"],"norms":["§ 9 Abs. 1 Nr. 2"],"cases":["bgh_springende_raubkatze","eugh_sabel_puma"],"step":"step:schema_verwechslungsgefahr.4.2"},{"id":"k04b-2","typ":"fall","titel":"THOMSON LIFE","sachverhalt":"Medion ist Inhaberin der Marke „LIFE“ für Unterhaltungselektronik. Thomson vertreibt Fernseher unter „THOMSON LIFE“. „THOMSON“ ist ein bekannter Herstellername und prägt das Gesamtzeichen.","frage":"Kann Verwechslungsgefahr bestehen, obwohl „LIFE“ das Gesamtzeichen „THOMSON LIFE“ nicht prägt?","antwort":true,"loesung":["**Ja!** Wird eine ältere Marke in ein zusammengesetztes jüngeres Zeichen übernommen und behält sie dort eine **selbständig kennzeichnende Stellung**, kann der Verkehr annehmen, die Waren stammten aus wirtschaftlich verbundenen Unternehmen (EuGH THOMSON LIFE).","Die Prägetheorie ist damit nicht der einzige Weg zur Verwechslungsgefahr. Der BGH betont aber: Die selbständig kennzeichnende Stellung ist die **Ausnahme** und bedarf besonderer Umstände, typischerweise die Kombination einer fremden Marke mit der eigenen Unternehmensbezeichnung (Culinaria/Villa Culinaria)."],"merke":"Prägung = ein Teil ist das Ganze. Selbständig kennzeichnende Stellung = ein Teil bleibt erkennbar fremd.","level":3,"concepts":["selbstaendig_kennzeichnende_stellung","praegetheorie"],"norms":["§ 14 Abs. 2 Nr. 2"],"cases":["eugh_thomson_life","bgh_culinaria","bgh_interconnect"],"step":"step:schema_verwechslungsgefahr.4.4"},{"id":"k04b-3","typ":"fall","titel":"METRO gegen METROBUS","sachverhalt":"Der Handelskonzern METRO klagt gegen Verkehrsbetriebe, die ihre Schnellbuslinien „MetroBus“ nennen. „METRO“ ist für zahlreiche Dienstleistungen eingetragen und bekannt.","frage":"Prägt „Metro“ das Zeichen „MetroBus“, sodass Verwechslungsgefahr besteht?","antwort":false,"loesung":["**Nein!** Im Zusammenhang mit Verkehrsdienstleistungen versteht der Verkehr „Metro“ in „MetroBus“ als **beschreibenden Hinweis** auf ein städtisches Verkehrsmittel (wie „Metro“ = U-Bahn). Ein beschreibend verstandener Bestandteil prägt nicht und hat auch keine selbständig kennzeichnende Stellung (BGH METROBUS).","Auch der Bekanntheitsschutz scheiterte: Wer „Metro“ als Sachangabe versteht, verknüpft das Zeichen nicht gedanklich mit dem Handelskonzern."],"merke":"Ein Bestandteil, der in der konkreten Kombination beschreibend wirkt, verliert seine Kennzeichnungskraft.","level":2,"concepts":["praegetheorie","gedankliche_verknuepfung"],"norms":["§ 14 Abs. 2 Nr. 2","§ 14 Abs. 2 Nr. 3"],"cases":["bgh_metrobus"],"step":null},{"id":"k04b-4","typ":"fall","titel":"Goldbären gegen Schokoteddy","sachverhalt":"Haribo ist Inhaberin der Wortmarke „Goldbären“ für Süßwaren. Lindt vertreibt einen in Goldfolie verpackten Schokoladenbären mit rotem Halsband. Bild- oder Klangähnlichkeit scheidet naturgemäß aus.","frage":"Kann zwischen einer Wortmarke und einer dreidimensionalen Produktgestaltung Zeichenähnlichkeit bestehen?","antwort":true,"loesung":["**Ja, aber nur begrifflich!** Beim Vergleich einer Wortmarke mit einer Produktform kommt nur die **Ähnlichkeit im Sinngehalt** in Betracht. Sie setzt voraus, dass die Wortmarke aus Sicht des Verkehrs die naheliegende, ungezwungene und erschöpfende Bezeichnung der Gestaltung ist (BGH Goldbären).","Diesen strengen Maßstab verfehlte Haribo: Der Lindt-Teddy lässt sich ebenso gut als „Teddy“ oder „Schokobär“ bezeichnen. Sonst könnte eine Wortmarke ganze Produktformen monopolisieren."],"merke":"Wort gegen Form: nur begriffliche Ähnlichkeit, und die muss zwingend sein.","level":3,"concepts":["zeichenaehnlichkeit"],"norms":["§ 14 Abs. 2 Nr. 2","§ 14 Abs. 2 Nr. 3"],"cases":["bgh_goldbaeren"],"step":"step:schema_verwechslungsgefahr.4.3"},{"id":"k04b-5","typ":"fall","titel":"Das Krokodil","sachverhalt":"Lacoste ist Inhaberin der Bildmarke eines Krokodils für Bekleidung (hohe Kennzeichnungskraft). Ein Konkurrent meldet ein anders gezeichnetes Krokodil („coccodrillo“) für Bekleidung an.","frage":"Kann Verwechslungsgefahr allein aus der Übereinstimmung im Bedeutungsgehalt (beide zeigen ein Krokodil) folgen?","antwort":true,"loesung":["**Ja!** Bei Bildmarken kann eine Verwechslungsgefahr auf der **Übereinstimmung im Bedeutungsgehalt** beruhen, wenn die ältere Marke hohe Kennzeichnungskraft besitzt (BGH coccodrillo). Der Verkehr merkt sich „das Krokodil“, nicht die Details der Zeichnung.","Die gesteigerte Kennzeichnungskraft erweitert den Schutzbereich auch auf abweichend gestaltete Motive desselben Sinngehalts."],"merke":"Hohe Kennzeichnungskraft macht das Motiv schutzfähig, nicht nur die konkrete Zeichnung.","level":2,"concepts":["zeichenaehnlichkeit","kennzeichnungskraft"],"norms":["§ 9 Abs. 1 Nr. 2"],"cases":["bgh_lacoste_krokodil"],"step":null}]},{"id":"k04c","titel":"Arten der Verwechslungsgefahr","einheiten":[{"id":"k04c-1","typ":"mc","titel":"Drei Arten","sachverhalt":"","frage":"Der Verkehr erkennt, dass „Volks-Inspektion“ nicht von Volkswagen stammt, glaubt aber, es handle sich um eine lizenzierte Partnerwerkstatt. Welche Art der Verwechslungsgefahr ist das?","optionen":["Unmittelbare Verwechslungsgefahr","Mittelbare Verwechslungsgefahr (Serienzeichen)","Verwechslungsgefahr im weiteren Sinne","Keine Verwechslungsgefahr, sondern nur Assoziation"],"richtig":2,"loesung":["Bei der **Verwechslungsgefahr im weiteren Sinne** erkennt der Verkehr die Unterschiede und die verschiedenen Unternehmen, nimmt aber irrig **wirtschaftliche oder organisatorische Verbindungen** (Lizenz, Konzern) an.","Unmittelbar: Zeichen werden verwechselt. Mittelbar: Zeichen werden unterschieden, aber wegen eines gemeinsamen Stammbestandteils demselben Unternehmen zugeordnet (Serienzeichen). Die bloße gedankliche Assoziation ohne Herkunftsvorstellung genügt nicht (EuGH SABEL/Puma)."],"merke":"","level":2,"concepts":["verwechslungsgefahr_weiterer_sinn","serienmarke"],"norms":[],"cases":["bgh_volkswagen_volksinspektion","eugh_sabel_puma"],"step":"step:schema_verwechslungsgefahr.6"},{"id":"k04c-2","typ":"fall","titel":"Sixtyseven by Mustang","sachverhalt":"Die Marke „MUSTANG“ ist für Bekleidung eingetragen und zugleich Unternehmenskennzeichen. Ein Konkurrent vertreibt Jeans unter „Sixtyseven by Mustang Bekleidung“.","frage":"Kann eine Verwechslungsgefahr im weiteren Sinne bestehen, obwohl „Sixtyseven“ das Zeichen prägt?","antwort":true,"loesung":["**Ja!** „Mustang“ behält in dem zusammengesetzten Zeichen eine **selbständig kennzeichnende Stellung**. Da „MUSTANG“ zugleich Unternehmenskennzeichen des Klägers ist, liegt für den Verkehr die Annahme nahe, „Sixtyseven“ sei eine Zweitmarke aus dem Hause Mustang (BGH Mustang).","Die Verwechslungsgefahr im weiteren Sinne bleibt Ausnahme: Sie setzt besondere Umstände voraus, etwa dass das ältere Zeichen als Unternehmenskennzeichen bekannt ist."],"merke":"„by“-Kombinationen sind der Klassiker der Verwechslungsgefahr im weiteren Sinne.","level":3,"concepts":["verwechslungsgefahr_weiterer_sinn","selbstaendig_kennzeichnende_stellung"],"norms":["§ 14 Abs. 2 Nr. 2","§ 15"],"cases":["bgh_mustang","bgh_interconnect"],"step":null},{"id":"k04c-3","typ":"fall","titel":"Ein einziges Zeichen ist keine Serie","sachverhalt":"Die Inhaberin der Marke „Sun-Flow“ behauptet, „Sun-Boost“ eines Konkurrenten füge sich in ihre Markenserie mit dem Stamm „Sun-“ ein. Tatsächlich benutzt sie nur „Sun-Flow“.","frage":"Liegt eine mittelbare Verwechslungsgefahr unter dem Gesichtspunkt des Serienzeichens vor?","antwort":false,"loesung":["**Nein!** Mittelbare Verwechslungsgefahr setzt voraus, dass der Verkehr den gemeinsamen Bestandteil als **Stamm einer benutzten Zeichenserie** kennt und ihm Hinweischarakter auf den Inhaber beimisst. Eine einzige Marke bildet keine Serie.","Außerdem muss der Stammbestandteil kennzeichnungskräftig sein; „Sun-“ hat für Sonnenprodukte beschreibende Anklänge."],"merke":"Serienzeichen: mehrere benutzte Marken mit kennzeichnungskräftigem Stamm.","level":2,"concepts":["serienmarke","verwechslungsgefahr_weiterer_sinn"],"norms":["§ 14 Abs. 2 Nr. 2"],"cases":["bgh_volkswagen_volksinspektion"],"step":null}]}]},{"id":"k05","titel":"Markenverletzung III: Bekanntheitsschutz","untertitel":"§ 14 Abs. 2 Nr. 3 und § 9 Abs. 1 Nr. 3 MarkenG","farbe":"#6A4C93","icon":"stern","beschreibung":"Wann ist eine Marke bekannt, was ist die gedankliche Verknüpfung, welche vier Eingriffe gibt es und wann fehlt der rechtfertigende Grund. Plus: die bekannte Marke im Register.","kapitel":[{"id":"k05a","titel":"Bekanntheit und gedankliche Verknüpfung","einheiten":[{"id":"k05a-0","typ":"schema","titel":"Prüfungsschema: Bekanntheitsschutz","schema":"schema_bekanntheitsschutz","text":"Der Bekanntheitsschutz funktioniert ohne Verwechslungsgefahr und ohne Beeinträchtigung der Herkunftsfunktion. Sein Herzstück ist die gedankliche Verknüpfung.","concepts":[],"norms":[],"cases":[]},{"id":"k05a-1","typ":"mc","titel":"Wann ist eine Marke bekannt?","sachverhalt":"","frage":"Welche Aussage zur Bekanntheit im Sinne des § 14 Abs. 2 Nr. 3 ist richtig?","optionen":["Bekannt ist eine Marke ab 50 % Bekanntheit in der Gesamtbevölkerung","Bekannt ist eine Marke, wenn sie einem bedeutenden Teil des von den Waren angesprochenen Publikums bekannt ist; feste Prozentsätze gibt es nicht","Bekannt ist nur eine notorisch bekannte Marke nach Art. 6bis PVÜ","Bekanntheit setzt Eintragung seit mindestens zehn Jahren voraus"],"richtig":1,"loesung":["Bekannt ist eine Marke, wenn sie einem **bedeutenden Teil des Publikums** bekannt ist, das von den durch die Marke erfassten Waren oder Dienstleistungen betroffen ist. Feste Prozentsätze gibt es nicht; maßgeblich sind Marktanteil, Intensität, geographische Ausdehnung, Dauer der Benutzung und Werbeaufwand (EuGH General Motors, BGH TÜV II).","Bekanntheit in einem wesentlichen Teil des Bundesgebiets genügt. Die Bekanntheit muss im Kollisionszeitpunkt bestehen."],"merke":"","level":1,"concepts":["bekannte_marke"],"norms":["§ 14 Abs. 2 Nr. 3"],"cases":["eugh_general_motors","bgh_tuev_ii"],"step":"step:schema_bekanntheitsschutz.1"},{"id":"k05a-2","typ":"fall","titel":"OTTO für Caps","sachverhalt":"Der Versandhändler OTTO ist Inhaber der bekannten Marke „OTTO“, unter anderem für Bekleidung. Ein Dritter verkauft Baseballcaps mit dem Aufdruck „OTTO“. Verwechslungsgefahr lässt sich nicht sicher feststellen.","frage":"Kann der Bekanntheitsschutz auch dann greifen, wenn die Waren identisch oder ähnlich sind?","antwort":true,"loesung":["**Ja!** Nach früherem Wortlaut galt § 14 Abs. 2 Nr. 3 nur für „nicht ähnliche“ Waren. Der BGH hat die Norm aber schon lange richtlinienkonform auch auf identische und ähnliche Waren angewandt (OTTO Cap); seit dem MaMoG 2019 steht das ausdrücklich im Gesetz, weil Art. 10 Abs. 2 lit. c MarkenRL den Bekanntheitsschutz „unabhängig davon, ob die Waren identisch, ähnlich oder nicht ähnlich sind“ zwingend vorschreibt.","Der Bekanntheitsschutz ist damit unabhängig von der Verwechslungsgefahr: Wer die Aufmerksamkeit einer bekannten Marke für eigene Bekleidung ausnutzt, verletzt sie, auch wenn niemand die Herkunft verwechselt."],"merke":"Bekanntheitsschutz gilt für alle Waren: unähnliche, ähnliche und identische.","level":2,"concepts":["bekannte_marke","ausnutzung_unterscheidungskraft"],"norms":["§ 14 Abs. 2 Nr. 3","Art. 10 MarkenRL"],"cases":["bgh_otto_cap"],"step":"step:schema_bekanntheitsschutz.3"},{"id":"k05a-3","typ":"fall","titel":"INTELMARK","sachverhalt":"Intel ist Inhaberin der bekannten Marke „INTEL“ für Prozessoren. CPM benutzt „INTELMARK“ für Marketingdienstleistungen. Verbraucher denken bei „INTELMARK“ zwar an Intel, ändern ihr Kaufverhalten bei Prozessoren aber nicht.","frage":"Genügt die bloße gedankliche Verknüpfung für eine Beeinträchtigung der Unterscheidungskraft (Verwässerung)?","antwort":false,"loesung":["**Nein!** Die gedankliche Verknüpfung ist **notwendige, aber nicht hinreichende** Voraussetzung. Für die Verwässerung ist zusätzlich der Nachweis erforderlich, dass sich das wirtschaftliche Verhalten des Durchschnittsverbrauchers geändert hat oder eine ernsthafte Gefahr einer solchen Änderung besteht (EuGH Intel).","Der Bekanntheitsschutz setzt also zwei Schritte voraus: erst die Verknüpfung, dann einen der vier Eingriffe."],"merke":"Verknüpfung + Eingriff: Die Assoziation allein verletzt nicht.","level":3,"concepts":["gedankliche_verknuepfung","verwaesserung"],"norms":["§ 14 Abs. 2 Nr. 3"],"cases":["eugh_intel"],"step":"step:schema_bekanntheitsschutz.4"}]},{"id":"k05b","titel":"Die vier Eingriffe und die Unlauterkeit","einheiten":[{"id":"k05b-1","typ":"mc","titel":"Welcher Eingriff?","sachverhalt":"","frage":"Ein Parfümhersteller vertreibt Imitate bekannter Luxusdüfte und legt Händlern Vergleichslisten bei („entspricht Chanel No. 5“). Welchen Eingriff bejaht der EuGH hier vorrangig?","optionen":["Beeinträchtigung der Unterscheidungskraft (Verwässerung)","Ausnutzung der Wertschätzung (Rufausbeutung)","Beeinträchtigung der Wertschätzung (Rufschädigung)","Keinen, weil vergleichende Werbung erlaubt ist"],"richtig":1,"loesung":["Der EuGH bejaht die **unlautere Ausnutzung der Wertschätzung**: Der Dritte begibt sich in den Bereich der Sogwirkung der bekannten Marke, um von ihrer Anziehungskraft, ihrem Ruf und ihrem Ansehen ohne eigene Anstrengung und ohne finanzielle Gegenleistung zu profitieren (L'Oréal/Bellure).","Die vier Eingriffe: Ausnutzung der Unterscheidungskraft (Aufmerksamkeit), Ausnutzung der Wertschätzung (Image), Beeinträchtigung der Unterscheidungskraft (Verwässerung), Beeinträchtigung der Wertschätzung (Rufschädigung)."],"merke":"","level":2,"concepts":["ausnutzung_wertschaetzung","ausnutzung_unterscheidungskraft","verwaesserung","rufschaedigung"],"norms":[],"cases":["eugh_loreal_bellure"],"step":"step:schema_bekanntheitsschutz.5"},{"id":"k05b-2","typ":"fall","titel":"Der springende Pudel","sachverhalt":"Ein Künstler lässt eine Wort-Bild-Marke mit einem springenden Pudel und dem Wort „PUDEL“ für Bekleidung eintragen, die Aufbau und Wortanfang der bekannten Puma-Marke parodiert. Puma verlangt Löschung nach § 9 Abs. 1 Nr. 3.","frage":"Rechtfertigt die Kunst- und Meinungsfreiheit die Eintragung der Parodie als eigene Marke?","antwort":false,"loesung":["**Nein!** Der Verkehr verknüpft den „springenden Pudel“ gedanklich mit Puma und der Anmelder profitiert von der **Aufmerksamkeit** der bekannten Marke (Ausnutzung der Unterscheidungskraft). Kunst- und Meinungsfreiheit können zwar eine einzelne Benutzung rechtfertigen, nicht aber die Erlangung eines eigenen Ausschließlichkeitsrechts im Register (BGH Springender Pudel).","Der Inhaber der bekannten Marke muss nicht hinnehmen, dass ein sein Recht verletzendes Zeichen selbst Registerschutz erhält."],"merke":"Parodie als Benutzung kann gerechtfertigt sein (Lila-Postkarte), Parodie als eigene Marke nicht (Springender Pudel).","level":3,"concepts":["ausnutzung_unterscheidungskraft","relative_schutzhindernis_bekannt","unlauterkeit"],"norms":["§ 9 Abs. 1 Nr. 3","§ 51"],"cases":["bgh_springender_pudel","bgh_lila_postkarte"],"step":"step:schema_bekanntheitsschutz.6"},{"id":"k05b-3","typ":"fall","titel":"Das Testsiegel ohne Lizenz","sachverhalt":"Ein Zahnpastahersteller wirbt auf der Verpackung mit dem bekannten ÖKO-TEST-Siegel („sehr gut“), obwohl er keinen Lizenzvertrag geschlossen hat. Das Siegel ist als Marke für Verbraucherinformationsdienstleistungen eingetragen, nicht für Zahnpasta.","frage":"Verletzt die Werbung die bekannte Marke, obwohl sie für ganz andere Dienstleistungen eingetragen ist?","antwort":true,"loesung":["**Ja!** Der Bekanntheitsschutz greift gerade bei **unähnlichen Waren**. W
