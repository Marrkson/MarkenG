<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<title>IPelico – Markenrecht und EPG in Fällen</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="__FAVICON__" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IPelico">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="IPelico">
<style>
__FONTS__
:root{
  --bg:#f3f5f9;--paper:#ffffff;--ink:#101828;--muted:#5b6474;--line:#dde3ec;
  --brand:#1482e3;--brand-deep:#0b5fb0;--brand-soft:#e6f1fc;--brand-grad:linear-gradient(135deg,#3b9cf0 0%,#1482e3 55%,#0b5fb0 100%);
  --ok:#157f4a;--ok-soft:#e3f4ea;--bad:#c43d2f;--bad-soft:#fce9e6;--tip:#b7791f;--tip-soft:#fdf3df;--def:#4b5563;--def-soft:#eef1f6;
  --concept:#9a3b25;--concept-soft:#f7e8e3;--norm:#0b5fb0;--norm-soft:#e6f1fc;--case:#6a4c93;--case-soft:#ece5f5;--schema:#2f6b4f;--schema-soft:#e2f0e8;--dist:#8a5a00;--dist-soft:#fbf1d6;
  --glass:rgba(255,255,255,.42);--g1:rgba(255,255,255,.58);--g2:rgba(255,255,255,.22);--g-top:rgba(255,255,255,.95);--g-bot:rgba(255,255,255,.35);--g-bot2:rgba(255,255,255,.7);--g-side:rgba(255,255,255,.5);--g-sheen:rgba(255,255,255,.6);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 10px 30px rgba(16,24,40,.08);--shadow-2:0 2px 6px rgba(16,24,40,.06),0 24px 60px rgba(16,24,40,.14);
  --blob1:rgba(20,130,227,.55);--blob2:rgba(90,200,255,.5);--blob3:rgba(11,95,176,.42);--blob4:rgba(255,255,255,.7);
  --r-xl:30px;--r-lg:22px;--r-md:14px;--r-sm:10px;--dur:160ms;--ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1420;--paper:#171d2b;--ink:#e9edf3;--muted:#98a2b3;--line:#2a3346;
  --brand:#5aa9f0;--brand-deep:#8ec5f7;--brand-soft:#16283f;--brand-grad:linear-gradient(135deg,#2a7fd0,#0f4f8f);
  --ok:#5fc48f;--ok-soft:#173226;--bad:#ef8a7a;--bad-soft:#3a221d;--tip:#e2b04a;--tip-soft:#3a3120;--def:#b8c0cc;--def-soft:#222a3a;
  --concept:#e0866f;--concept-soft:#3a2622;--norm:#8ec5f7;--norm-soft:#1b2b3d;--case:#b89ee0;--case-soft:#2c2540;--schema:#7fc4a0;--schema-soft:#1f3329;--dist:#e2b04a;--dist-soft:#3a3120;
  --glass:rgba(30,38,56,.45);--g1:rgba(40,50,72,.55);--g2:rgba(24,30,46,.30);--g-top:rgba(255,255,255,.28);--g-bot:rgba(255,255,255,.06);--g-bot2:rgba(255,255,255,.18);--g-side:rgba(255,255,255,.12);--g-sheen:rgba(255,255,255,.16);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);--shadow-2:0 2px 6px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.5);
  --blob1:rgba(20,130,227,.35);--blob2:rgba(90,200,255,.22);--blob3:rgba(11,95,176,.35);--blob4:rgba(255,255,255,.06);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-x:none}
a,button,.chip,.ans{touch-action:manipulation}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(50% 40% at 8% 0%,var(--blob1),transparent 62%),radial-gradient(38% 32% at 96% 22%,var(--blob2),transparent 60%),radial-gradient(42% 36% at 60% 100%,var(--blob3),transparent 60%),radial-gradient(30% 30% at 30% 55%,var(--blob4),transparent 70%);background-attachment:fixed}
a{color:var(--brand-deep)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--brand-deep);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.ic{width:24px;height:24px;display:inline-block;vertical-align:middle;flex:none;fill:currentColor}
.ic.s{width:16px;height:16px}.ic.m{width:20px;height:20px}
.mark{width:28px;height:28px;color:var(--brand)}
/* Glas */
.glass{position:relative;isolation:isolate;background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid transparent;background-clip:padding-box;border-radius:var(--r-lg);
  -webkit-backdrop-filter:blur(30px) saturate(190%) brightness(1.05);backdrop-filter:blur(30px) saturate(190%) brightness(1.05);
  box-shadow:inset 0 1px 0 var(--g-top),inset 0 -1px 0 var(--g-bot),inset 1px 0 0 var(--g-side),var(--shadow)}
.glass::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,var(--g-top) 0%,rgba(255,255,255,.15) 35%,rgba(255,255,255,.05) 60%,var(--g-bot2) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(112deg,var(--g-sheen) 0%,rgba(255,255,255,.10) 28%,transparent 42%,transparent 68%,rgba(255,255,255,.14) 100%)}
.glass.pill::after{background:linear-gradient(180deg,var(--g-sheen) 0%,transparent 55%)}
/* Layout */
.shell{max-width:720px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
/* Kopfzeile: runder Zurück-Knopf, großer Titel, rechts Pillen (nicht mehr als Pille, erst beim Scrollen mit Grund) */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;margin:0 -16px 10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;transition:background var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.topbar.scrolled{background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);box-shadow:0 1px 0 var(--line)}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.topbar .ttl{flex:1;min-width:0;font-weight:700;font-size:22px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.iconbtn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);background:var(--paper);box-shadow:var(--shadow);text-decoration:none;flex:none;transition:transform var(--dur) var(--ease)}
.iconbtn:active{transform:scale(.94)}
.iconbtn.lg{width:52px;height:52px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap;min-height:36px}
.topbar .pill .ic{color:var(--tip)}
.onbrand .pill{background:rgba(255,255,255,.2);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.onbrand .pill .ic{color:#fff}
/* Umschalter Liste/Raster */
.seg.ic-seg{padding:4px;background:var(--paper);box-shadow:var(--shadow)}
.seg.ic-seg button{width:40px;height:36px;padding:0;justify-content:center}
.seg.ic-seg button.on{background:var(--ink);color:var(--paper);box-shadow:none}
h1{font-size:28px;line-height:1.15;margin:12px 0 6px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:20px;margin:26px 0 12px;font-weight:600}
h3{font-size:16px;margin:14px 0 6px;font-weight:600}
.lead{color:var(--muted);margin:0 0 16px;max-width:62ch}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-deep);display:flex;align-items:center;gap:6px}
.meta{font-size:13px;color:var(--muted)}
.card{padding:18px;margin:12px 0}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--def-soft);color:var(--def);white-space:nowrap}
.tag.brand{background:var(--brand-soft);color:var(--brand-deep)}.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.tip{background:var(--tip-soft);color:var(--tip)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .4s var(--ease)}
.bar.ok>i{background:var(--ok)}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 22px;font-weight:600;font-size:16px;text-decoration:none;color:var(--ink);background:var(--paper);box-shadow:var(--shadow);border:1px solid transparent;min-height:46px;transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--paper);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(16,24,40,.18)}
.btn.light{background:#fff;color:#0b5fb0}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line)}
.btn.ghost.onbrand{color:#fff;border-color:rgba(255,255,255,.6)}
.btn.block{width:100%}
.btn:focus-visible,.iconbtn:focus-visible,.row:focus-visible,.ans:focus-visible,.chip:focus-visible{outline:3px solid var(--brand-deep);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.actions .btn{flex:1}
.xio{display:block;width:100%;box-sizing:border-box;margin:12px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);color:var(--ink);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;min-height:96px}
.xmsg:empty{display:none}.xmsg.ok{color:var(--ok)}.xmsg.bad{color:var(--bad)}
/* Startseite: Vollflächen-Hero (bis unter die Statusleiste), darunter überlappende Karte */
.hero{position:relative;isolation:isolate;overflow:hidden;margin:0 -16px;padding:calc(12px + env(safe-area-inset-top)) 16px 70px;border-radius:0 0 var(--r-xl) var(--r-xl);color:#fff;text-align:center;
  background:var(--brand-grad);box-shadow:0 14px 40px rgba(11,95,176,.28),inset 0 -1px 0 rgba(255,255,255,.25)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 50% at 85% 10%,rgba(255,255,255,.28),transparent 70%),radial-gradient(50% 45% at 10% 90%,rgba(255,255,255,.14),transparent 70%)}
.hero .bar{background:rgba(255,255,255,.3);margin:12px 0 14px}.hero .bar>i{background:#fff}
.hero .row0{display:flex;align-items:center;gap:8px;margin-bottom:26px}
.hero .row0 .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.01em;color:#fff;text-decoration:none;flex:1}
.hero .row0 .brand .mark{color:#fff}
.hero .hi{font-size:17px;opacity:.9;font-weight:400}
.hero .big{font-size:32px;font-weight:700;line-height:1.15;letter-spacing:-.01em;margin:2px auto 0;max-width:22ch;text-wrap:balance}
.status{display:flex;align-items:center;gap:12px;margin:22px 0 0;padding:6px 14px 6px 6px;min-height:56px;border-radius:999px;color:#fff;text-decoration:none;text-align:left;font-weight:600;font-size:15px;
  background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 18px rgba(11,95,176,.2)}
.status .badge{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--brand-deep);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
.status .b{flex:1;min-width:0}
.status .chev{color:#fff;opacity:.9}
.next{margin:-52px 0 0;border-radius:var(--r-lg);background:var(--paper);box-shadow:var(--shadow-2);overflow:hidden;position:relative;color:var(--ink)}
.next .body{padding:18px 18px 14px;position:relative}
.next .body .wm{position:absolute;right:-6px;top:-4px;width:120px;height:120px;color:var(--brand);opacity:.09;pointer-events:none}
.next .k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-deep)}
.next .t{font-size:21px;font-weight:700;line-height:1.2;margin:4px 0 6px;text-wrap:balance}
.next .s{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.next .s .ic{color:var(--muted)}
.next .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 18px;border-top:1px solid var(--line)}
.next .foot .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.next .foot .v small{display:block;font-size:12px;font-weight:400;color:var(--muted);font-family:"IBM Plex Sans",system-ui,sans-serif}
/* Abschnittskopf und horizontale Reihen */
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.sh h2{margin:0}
.sh a{font-size:14px;font-weight:600;text-decoration:none;color:var(--brand-deep);padding:6px 0}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:4px 16px 12px;scroll-snap-type:x mandatory;scroll-padding:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.hscroll::-webkit-scrollbar{display:none}
.quick{display:grid;grid-auto-flow:column;grid-template-rows:auto auto;gap:10px;overflow-x:auto;margin:0 -16px;padding:4px 16px 10px;scroll-snap-type:x proximity;scroll-padding:16px;scrollbar-width:none;overscroll-behavior-x:contain}
.quick::-webkit-scrollbar{display:none}
.qa{display:inline-flex;align-items:center;gap:10px;background:var(--paper);border-radius:999px;padding:8px 18px 8px 10px;min-height:48px;font-weight:600;font-size:14px;box-shadow:var(--shadow);white-space:nowrap;text-decoration:none;color:var(--ink);scroll-snap-align:start;transition:transform var(--dur) var(--ease)}
.qa:active{transform:scale(.97)}
.qa .ic{color:var(--brand);width:22px;height:22px}
.qa .n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;background:var(--brand-soft);color:var(--brand-deep);border-radius:999px;padding:2px 8px;margin-left:-4px}
/* Kurskarten (Karussell), Kurskacheln, Listenkarten */
.cthumb{position:relative;isolation:isolate;overflow:hidden;color:#fff;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c,var(--brand)) 62%,#fff) 0%,var(--c,var(--brand)) 48%,color-mix(in srgb,var(--c,var(--brand)) 62%,#000) 100%)}
.cthumb::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(112deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,.08) 30%,transparent 45%)}
.cthumb .ic{filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.kcard{flex:0 0 76%;max-width:300px;min-height:236px;scroll-snap-align:start;border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:#fff;box-shadow:var(--shadow-2);transition:transform var(--dur) var(--ease)}
.kcard:active{transform:scale(.98)}
.kcard .ic.wm{position:absolute;right:-18px;bottom:52px;width:150px;height:150px;opacity:.16;filter:none}
.kcard::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.42) 100%)}
.kcard .tag{align-self:flex-start;background:rgba(255,255,255,.92);color:#101828;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.kcard .tag.done{background:rgba(255,255,255,.92);color:#157f4a}
.kcard .t{font-size:19px;font-weight:700;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.2);text-wrap:balance}
.kcard .s{font-size:13px;opacity:.92;margin-top:4px;display:flex;align-items:center;gap:6px}
.kcard .bar{background:rgba(255,255,255,.3);margin-top:10px;height:5px}.kcard .bar>i{background:#fff}
.lcard{display:flex;gap:14px;padding:10px;border-radius:var(--r-lg);align-items:center;text-decoration:none;color:inherit;transition:transform var(--dur) var(--ease)}
.lcard:active{transform:scale(.985)}
.lcard .cthumb{width:96px;height:96px;border-radius:16px;flex:none}
.lcard .cthumb .ic{width:42px;height:42px}
.lcard .b{flex:1;min-width:0;padding-right:4px}
.lcard .t{font-size:17px;font-weight:600;line-height:1.3;margin:6px 0 4px}
.lcard .m{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.lcard .m .ic{color:var(--muted)}
.lcard .bar{margin-top:8px;height:5px}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lgrid .lcard{flex-direction:column;align-items:stretch;gap:10px}
.lgrid .lcard .cthumb{width:100%;height:118px}
.lgrid .lcard .t{font-size:15px}
.lstack{display:grid;gap:12px}
/* Detailkarte (Kurs) */
.detail{padding:12px 12px 16px}
.detail .cthumb.big{width:100%;height:210px;border-radius:18px}
.detail .cthumb.big .ic{width:84px;height:84px}
.detail .cthumb.big .no{position:absolute;left:14px;top:14px;font-size:13px;font-weight:600;background:rgba(255,255,255,.92);color:#101828;border-radius:999px;padding:4px 10px}
.detail .inner{padding:14px 6px 0}
.detail h1{margin:8px 0 8px;font-size:24px}
.mrow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin:6px 0}
.mrow .ic{color:var(--muted);width:20px;height:20px}
.actrow{display:flex;gap:10px;align-items:center;margin-top:16px}
.actrow .btn.primary{flex:1;min-height:52px}
/* Zuletzt gelernt */
.last .head{display:flex;gap:12px;align-items:center}
.last .av{width:56px;height:56px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand-deep);box-shadow:inset 0 0 0 3px var(--paper),0 0 0 1px var(--line)}
.last .av .ic{width:26px;height:26px}
.last .t{font-weight:700;font-size:17px;line-height:1.3}
.last .head .b{flex:1;min-width:0}
.last .tags{margin:6px 0 0}
.last .tags .tag{white-space:normal;text-align:left;line-height:1.3}
.chk{border-top:1px solid var(--line);margin-top:14px;padding-top:10px;display:grid;gap:8px}
.chk div{display:flex;align-items:center;gap:8px;font-size:14px}
.chk .ic{color:var(--ok);width:18px;height:18px}.chk .bad .ic{color:var(--bad)}
/* Stat-Kacheln */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{padding:14px 12px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:4px;margin-top:4px}
/* Listen */
.list{padding:6px 8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:var(--r-md);text-decoration:none;color:inherit;transition:background var(--dur) var(--ease)}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:var(--def-soft)}
.row .no{width:40px;height:40px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none;background:color-mix(in srgb,var(--c,var(--brand)) 16%,var(--paper));color:color-mix(in srgb,var(--c,var(--brand)) 80%,var(--ink))}
.row .ty{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--def-soft);color:var(--def)}

<script>
(function(){
'use strict';
// ---------- Theme: data-theme immer setzen (gespeichert oder System) ----------
const MQ = matchMedia('(prefers-color-scheme: dark)');
const themePref = () => { try{ return localStorage.getItem('mgk_theme'); }catch(e){ return null; } };

applyTheme(); MQ.addEventListener('change', ()=>{ if(!themePref()) applyTheme(); });

const KURSE = JSON.parse(document.getElementById('kurse-data').textContent);
const GEBIETE = JSON.parse(document.getElementById('gebiete-data').textContent); const GEB = new Map(GEBIETE.map(g=>[g.id,g]));
const gebOf = k => GEB.get(k.gebiet)||{kurz:'',titel:''};
const kurseIn = g => KURSE.filter(k=>k.gebiet===g.id);
const G = JSON.parse(document.getElementById('graph-data').textContent);

__LAWJS__

const md = s => lawify(md0(s));

const kIcon = k => KICON[k.id] && hasIc(KICON[k.id]) ? KICON[k.id] : (k.icon && hasIc(k.icon) ? k.icon : 'fall');
const UNITS = []; const UNIT = new Map(); const CHAP = new Map(); const KURS = new Map();
for(const k of KURSE){ KURS.set(k.id,k); k.nr=KURSE.indexOf(k)+1; for(const c of k.kapitel){ CHAP.set(c.id,c); c.kurs=k.id; for(const e of c.einheiten){ e.kap=c.id; e.kurs=k.id; UNITS.push(e); UNIT.set(e.id,e); } } }
const QUIZ = e => e.typ==='fall'||e.typ==='mc';
const TYPE = {fall:['fall','Fall'], mc:['quiz','Wissensfrage'], intro:['intro','Einführung'], schema:['schema','Prüfungsschema']};
const LEVEL = ['','Basics','Fortgeschritten','Examen'];
const nn = n => String(n).padStart(2,'0');
const normNode = r => { let m=r.match(/^Art\. (\d+[a-z]?)(?: .*)? (\S+)$/); if(m&&LAW.eukeys[m[2]]) return byId.get('eunorm:'+LAW.eukeys[m[2]]+':'+m[1]);
  m=r.match(/^(?:R\.|Regel|Rule) (\d+[A-Za-z]?)(?:\.\d+)*(?:\([a-z0-9]+\))*(?: .*)? (\S+)$/); if(m&&LAW.eukeys[m[2]]) return byId.get('eunorm:'+LAW.eukeys[m[2]]+':'+m[1].toUpperCase());
  m=r.match(/§ (\d+[a-z]?)/); return m?byId.get('norm:§'+m[1]):null; };
// Quelle eines EU-/Übereinkommensknotens und Sortenbezeichnung (Richtlinie, EPGÜ, VerfO)
const srcName = u => /eur-lex/.test(u||'') ? 'EUR-Lex' : /epo\.org/.test(u||'') ? 'epo.org' : /unifiedpatentcourt/.test(u||'') ? 'unifiedpatentcourt.org (PDF)' : 'Quelle';

const isUpc = n => n && n.type==='eunorm' && (n.rl==='upca'||n.rl==='rop');
// Eingehende Kanten und Einheiten je Knoten (für Lernkarten, Suche, Lernradar)
const inn = new Map(); for(const e of G.edges){ (inn.get(e.target)||inn.set(e.target,[]).get(e.target)).push(e); }
const I = id => inn.get(id)||[];
const UNITS_OF = new Map(); const addU=(id,e)=>{ if(!id) return; const l=UNITS_OF.get(id)||UNITS_OF.set(id,[]).get(id); if(!l.includes(e)) l.push(e); };
for(const e of UNITS){ (e.concepts||[]).forEach(c=>addU('concept:'+c,e)); (e.cases||[]).forEach(c=>addU('case:'+c,e)); (e.distinctions||[]).forEach(d=>addU('distinction:'+d,e)); if(e.step) addU(e.step,e); if(e.schema) addU('schema:'+e.schema,e); (e.norms||[]).forEach(r=>{ const n=normNode(r); if(n) addU(n.id,e); }); }

const schemaOf = id => { let cur=id, guard=0; while(cur && guard++<20){ const p=I(cur).find(e=>e.relation==='has_step'); if(!p) return null; if(p.source.startsWith('schema:')) return byId.get(p.source); cur=p.source; } return null; };

// ---------- Fortschritt: Cookie (Fallback localStorage) ----------

  const NAME='mgk_p', META='mgk_m';

    const f = o && (o.fortschritt || (o.u ? o : null));
    if(!f || typeof f.u!=='object' || Array.isArray(f.u)) throw new Error('Das JSON enthält keinen IPelico-Fortschritt.');
    const u={}; for(const [id,v] of Object.entries(f.u)) if(ID.test(id) && v && typeof v==='object') u[id]={r:v.r?1:0, d:int(v.d), n:int(v.n)};
    const s=f.s||{};

    return {p, prefs}; };

  const apply = ({p,prefs}, mode) => {
    if(mode==='over'){ P=p; for(const k of PREFS) if(k in prefs) setLS(k,prefs[k]); }
    else {
      for(const [id,v] of Object.entries(p.u)) if(newer(P.u[id],v)) P.u[id]=v;
      if(p.s.last>P.s.last){ P.s.last=p.s.last; P.s.cnt=p.s.cnt; P.last=p.last||P.last; } else if(p.s.last===P.s.last) P.s.cnt=Math.max(P.s.cnt,p.s.cnt);

      if(prefs.mgk_recent){ let a=[],b=[]; try{ a=JSON.parse(getLS('mgk_recent')||'[]'); b=JSON.parse(prefs.mgk_recent); }catch(e){}
        if(Array.isArray(a)&&Array.isArray(b)){ const seen=new Set(); setLS('mgk_recent', JSON.stringify([...a,...b].filter(q=>typeof q==='string'&&!seen.has(q.toLowerCase())&&seen.add(q.toLowerCase())).slice(0,8))); } }
    }

})();

const INDEX = G.nodes.filter(n=>KINDS[n.type]).map(n=>({id:n.id,type:n.type,t:nodeTitle(n)+(n.type==='case'?' '+n.az:''),s:nodeText(n),ft:fold(nodeTitle(n)+(n.type==='case'?' '+n.az:'')),fs:fold(nodeText(n))}));

function search(q){ const f=fold(q).trim(); if(f.length<2) return []; const words=f.split(/\s+/).filter(Boolean); const out=[];

  if(n.type==='concept'||n.type==='case') { const st2 = n.type==='concept' ? stepsUsing : []; sec('pruefung','schema','Im Prüfungsschema',list(st2.map(x=>[x,esc((schemaOf(x.id)||{}).label||'')]))); }
  if(n.type==='step'){ const kids=steps(id); sec('pruefung','schema','Unterpunkte',kids.length?`<ul class="tree">${kids.map(s=>`<li><div class="node${weak(s.id)?' weak':''}"><a class="lbl" href="#/karte/${encodeURIComponent(s.id)}" style="text-decoration:none;color:inherit">${esc(s.label)}</a></div></li>`).join('')}</ul>`:''); sec('begriffe','begriff','Begriffe',chips(related(id))); }
  if(n.type==='case'||n.type==='distinction'){ const c=uniq(I(id).filter(e=>e.relation==='illustrated_by'||e.relation==='contrasts').map(e=>byId.get(e.source))); sec('begriffe','begriff','Begriffe',chips(c)); }
  // 4 Rechtsprechung
  if(n.type!=='case') sec('rspr','entscheidung','Rechtsprechung',casesOf.length?list(casesOf.map(x=>[x,esc(x.date.split('-').reverse().join('.'))+' · '+esc(x.az)])):'');
  // 5 Abgrenzung, 6 Verwandt
  if(n.type==='concept'){ sec('abgr','tabelle','Abgrenzung',list(dists.map(x=>[x,esc(x.frage)]))); sec('verwandt','begriff','Verwandte Begriffe',chips(related(id))); }
  // 7 Fälle
  sec('faelle','fall',`Fälle dazu`,units.length?`<div class="glass list">${units.map(e=>unitRow(e, `Kurs ${nn(KURS.get(e.kurs).nr)} · ${CHAP.get(e.kap).titel}`)).join('')}</div>`:'');
  main.innerHTML = head + (S.length>2?`<nav class="toc" aria-label="Abschnitte">${S.map(s=>`<a class="glass pill" href="#sec-${s.key}">${ic(s.icn)}${s.title}</a>`).join('')}</nav>`:'') + S.map(s=>`<section class="sec" id="sec-${s.key}"><h2>${ic(s.icn)}${s.title}${s.key==='faelle'?`<span class="meta mono" style="margin-left:auto">${units.length}</span>`:''}</h2>${s.html}</section>`).join('') + `<p class="meta" style="margin-top:20px">Im <a href="navigator/#/${n.type}/${encodeURIComponent(id)}">Lernnavigator öffnen</a> (Graph, Karteikarten).</p>`;
  main.querySelectorAll('.toc a').forEach(a=>a.onclick=ev=>{ ev.preventDefault(); const t=document.querySelector(a.getAttribute('href')); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); });
  if(isUpc(n)&&n.zitiert){ const box=document.getElementById('epg-inline'); epgLoad().then(d=>{ if(!box||!box.isConnected) return; const l=epgFor(d,n).slice(0,6); box.innerHTML=l.map(epgRow).join(''); }).catch(()=>{ if(box) box.innerHTML=`<div class="row"><div class="b"><div class="s">Entscheidungsdatenbank nicht geladen (nur über http erreichbar).</div></div></div>`; }); }
}
// ---------- EPG-Rechtsprechung: Korpus aller Entscheidungen des Einheitlichen Patentgerichts (nachgeladen) ----------
let EPG=null;
function epgLoad(){ if(EPG) return Promise.resolve(EPG); return fetch('upc_entscheidungen.json').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(d=>{ EPG=d; return d; }); }
const epgNormKey = n => n.rl==='upca' ? ['upca', String(n.nummer)] : ['rop', String(n.nummer).toUpperCase()];
function epgFor(d, n){ const [k,v]=epgNormKey(n); return d.entscheidungen.filter(e=>e[k].includes(v)).sort((a,b)=>(b.datum||'').localeCompare(a.datum||'')); }
const epgDate = s => s ? s.split('-').reverse().join('.') : '–';
function epgRow(e){ const norms=[...e.upca.slice(0,3).map(x=>`Art. ${x} EPGÜ`),...e.rop.slice(0,3).map(x=>`R. ${x} VerfO`)]; const ns=norms.map(r=>normNode(r)).filter(Boolean);
  return `<details class="row epg" style="display:block"><summary class="b" style="cursor:pointer;list-style:none"><div class="t">${esc(e.az)} <span class="meta mono">${epgDate(e.datum)}</span></div><div class="s">${esc(e.kammer)} · ${esc(e.typ||'–')}${e.parteien?' · '+esc(e.parteien):''}</div></summary><div class="s" style="padding:6px 0 4px">${e.leitsatz?txt(e.leitsatz):'<i>Kein Leitsatz in der Entscheidung ausgewiesen.</i>'}${e.schlagworte?`<div class="meta" style="margin-top:4px">${esc(e.schlagworte)}</div>`:''}<div class="meta" style="margin-top:4px">${e.patent?esc(e.patent)+' · ':''}<a href="${esc(e.url)}" target="_blank" rel="noopener">unifiedpatentcourt.org ↗</a></div>${ns.length?`<div class="chips">${ns.map(x=>chip(x,x.label)).join('')}</div><div class="slot"></div>`:''}</div></details>`; }
function vEpg(a, b){
  chrome('EPG-Rechtsprechung', a==='norm' ? '#/epg' : '#/', streakPill());
  const nid = a==='norm' ? decodeURIComponent(b||'') : null; const nn0 = nid ? byId.get(nid) : null;
  main.innerHTML=`<p class="lead" style="margin-top:4px">${nn0?`Entscheidungen des Einheitlichen Patentgerichts, die <b>${esc(nn0.label)}</b> nennen.`:'Alle Entscheidungen und Anordnungen des Einheitlichen Patentgerichts seit dem 1. Juni 2023 mit Leitsätzen, Schlagworten und den zitierten Artikeln und Regeln.'}</p><div id="epg-box"><p class="meta">Lade Entscheidungen …</p></div>`;
  epgLoad().then(d=>{
    let list = nn0 ? epgFor(d, nn0) : d.entscheidungen.slice().sort((a2,b2)=>(b2.datum||'').localeCompare(a2.datum||''));
    const kammern=[...new Set(d.entscheidungen.map(e=>e.kammer))].sort((x,y)=>x.localeCompare(y,'de')); const typen=[...new Set(d.entscheidungen.map(e=>e.typ).filter(Boolean))].sort();
    const box=document.getElementById('epg-box'); let shown=40; const state={q:'',k:'',t:'',hn:false};
    const render=()=>{ const f=fold(state.q); const l=list.filter(e=>(!state.k||e.kammer===state.k)&&(!state.t||e.typ===state.t)&&(!state.hn||e.leitsatz)&&(!f||fold(e.az+' '+e.parteien+' '+e.leitsatz+' '+e.schlagworte+' '+e.patent).includes(f)));
      box.innerHTML=`<div class="sbox glass pill" role="search">${ic('suche')}<input id="eq" type="search" placeholder="Aktenzeichen, Partei, Leitsatz, Patent …" value="${esc(state.q)}" autocomplete="off"></div>
        <div class="tags" style="margin:8px 0;display:flex;flex-wrap:wrap;gap:6px"><select id="ek" class="glass pill" style="padding:6px 10px;max-width:100%;min-width:0"><option value="">Alle Kammern</option>${kammern.map(k=>`<option ${state.k===k?'selected':''}>${esc(k)}</option>`).join('')}</select> <select id="et" class="glass pill" style="padding:6px 10px;max-width:100%;min-width:0"><option value="">Alle Verfahrensarten</option>${typen.map(k=>`<option ${state.t===k?'selected':''}>${esc(k)}</option>`).join('')}</select> <label class="tag" style="cursor:pointer"><input type="checkbox" id="ehn" ${state.hn?'checked':''}> nur mit Leitsatz</label></div>
        <p class="meta">${l.length} von ${list.length} Entscheidungen · Quelle: ${esc(d.meta.quelle)} · Stand ${epgDate(d.meta.zeitraum&&d.meta.zeitraum[1])}</p>
        <div class="glass list">${l.slice(0,shown).map(epgRow).join('')}</div>${l.length>shown?`<p style="text-align:center"><button class="btn" id="emore">Weitere ${Math.min(40,l.length-shown)} anzeigen</button></p>`:''}`;
      const eq=document.getElementById('eq'); eq.oninput=()=>{ state.q=eq.value; shown=40; const pos=eq.selectionStart; render(); const e2=document.getElementById('eq'); e2.focus(); e2.setSelectionRange(pos,pos); };
      document.getElementById('ek').onchange=ev=>{ state.k=ev.target.value; shown=40; render(); }; document.getElementById('et').onchange=ev=>{ state.t=ev.target.value; shown=40; render(); }; document.getElementById('ehn').onchange=ev=>{ state.hn=ev.target.checked; shown=40; render(); };
      const m=document.getElementById('emore'); if(m) m.onclick=()=>{ shown+=40; render(); }; };
    render();
  }).catch(err=>{ document.getElementById('epg-box').innerHTML=`<div class="box bad"><div class="k">${ic('falsch','s')}Nicht geladen</div>Die Entscheidungsdatenbank (upc_entscheidungen.json) konnte nicht geladen werden. Sie ist nur über einen Webserver erreichbar (${esc(String(err))}).</div>`; });
}
function notice(){ const n=document.getElementById('notice'); if(P.ack||Store.mode()!=='cookie'){ n.hidden=true; return; } n.hidden=false; n.innerHTML=`${ic('datenschutz')}<span>Fortschritt wird nur in einem Cookie auf diesem Gerät gespeichert, kein Tracking.</span><button class="btn primary" id="ack">OK</button>`; document.getElementById('ack').onclick=()=>{ P.ack=1; Store.save(P); n.hidden=true; }; }
route();
})();
</script>
