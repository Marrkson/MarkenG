<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<title>IPelico – Markenrecht in Fällen</title>
<link rel="icon" href="__FAVICON__">
<style>
__FONTS__
:root{
  --bg:#f3f5f9;--paper:#ffffff;--ink:#101828;--muted:#5b6474;--line:#dde3ec;
  --brand:#1482e3;--brand-deep:#0b5fb0;--brand-soft:#e6f1fc;--brand-grad:linear-gradient(135deg,#3b9cf0 0%,#1482e3 55%,#0b5fb0 100%);
  --ok:#157f4a;--ok-soft:#e3f4ea;--bad:#c43d2f;--bad-soft:#fce9e6;--tip:#b7791f;--tip-soft:#fdf3df;--def:#4b5563;--def-soft:#eef1f6;
  --concept:#9a3b25;--concept-soft:#f7e8e3;--norm:#0b5fb0;--norm-soft:#e6f1fc;--case:#6a4c93;--case-soft:#ece5f5;--schema:#2f6b4f;--schema-soft:#e2f0e8;--dist:#8a5a00;--dist-soft:#fbf1d6;
  --glass:rgba(255,255,255,.42);--g1:rgba(255,255,255,.58);--g2:rgba(255,255,255,.22);--g-top:rgba(255,255,255,.95);--g-bot:rgba(255,255,255,.35);--g-bot2:rgba(255,255,255,.7);--g-side:rgba(255,255,255,.5);--g-sheen:rgba(255,255,255,.6);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 10px 30px rgba(16,24,40,.08);--shadow-2:0 2px 6px rgba(16,24,40,.06),0 24px 60px rgba(16,24,40,.14);
  --blob1:rgba(20,130,227,.55);--blob2:rgba(90,200,255,.5);--blob3:rgba(11,95,176,.42);--blob4:rgba(255,255,255,.7);
  --r-xl:30px;--r-lg:22px;--r-md:14px;--r-sm:10px;--dur:160ms;--ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1420;--paper:#171d2b;--ink:#e9edf3;--muted:#98a2b3;--line:#2a3346;
  --brand:#5aa9f0;--brand-deep:#8ec5f7;--brand-soft:#16283f;--brand-grad:linear-gradient(135deg,#2a7fd0,#0f4f8f);
  --ok:#5fc48f;--ok-soft:#173226;--bad:#ef8a7a;--bad-soft:#3a221d;--tip:#e2b04a;--tip-soft:#3a3120;--def:#b8c0cc;--def-soft:#222a3a;
  --concept:#e0866f;--concept-soft:#3a2622;--norm:#8ec5f7;--norm-soft:#1b2b3d;--case:#b89ee0;--case-soft:#2c2540;--schema:#7fc4a0;--schema-soft:#1f3329;--dist:#e2b04a;--dist-soft:#3a3120;
  --glass:rgba(30,38,56,.45);--g1:rgba(40,50,72,.55);--g2:rgba(24,30,46,.30);--g-top:rgba(255,255,255,.28);--g-bot:rgba(255,255,255,.06);--g-bot2:rgba(255,255,255,.18);--g-side:rgba(255,255,255,.12);--g-sheen:rgba(255,255,255,.16);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);--shadow-2:0 2px 6px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.5);
  --blob1:rgba(20,130,227,.35);--blob2:rgba(90,200,255,.22);--blob3:rgba(11,95,176,.35);--blob4:rgba(255,255,255,.06);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(50% 40% at 8% 0%,var(--blob1),transparent 62%),radial-gradient(38% 32% at 96% 22%,var(--blob2),transparent 60%),radial-gradient(42% 36% at 60% 100%,var(--blob3),transparent 60%),radial-gradient(30% 30% at 30% 55%,var(--blob4),transparent 70%);background-attachment:fixed}
a{color:var(--brand-deep)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.ic{width:24px;height:24px;display:inline-block;vertical-align:middle;flex:none;fill:currentColor}
.ic.s{width:16px;height:16px}.ic.m{width:20px;height:20px}
.mark{width:28px;height:28px;color:var(--brand)}
/* Glas */
.glass{position:relative;isolation:isolate;background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid transparent;background-clip:padding-box;border-radius:var(--r-lg);
  -webkit-backdrop-filter:blur(30px) saturate(190%) brightness(1.05);backdrop-filter:blur(30px) saturate(190%) brightness(1.05);
  box-shadow:inset 0 1px 0 var(--g-top),inset 0 -1px 0 var(--g-bot),inset 1px 0 0 var(--g-side),var(--shadow)}
.glass::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,var(--g-top) 0%,rgba(255,255,255,.15) 35%,rgba(255,255,255,.05) 60%,var(--g-bot2) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(112deg,var(--g-sheen) 0%,rgba(255,255,255,.10) 28%,transparent 42%,transparent 68%,rgba(255,255,255,.14) 100%)}
.glass.pill::after{background:linear-gradient(180deg,var(--g-sheen) 0%,transparent 55%)}
/* Layout */
.shell{max-width:720px;margin:0 auto;padding:0 16px 120px}
.topbar{position:sticky;top:10px;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;margin:10px 0 14px;border-radius:999px}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.topbar .ttl{flex:1;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);background:var(--paper);box-shadow:var(--shadow);text-decoration:none;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap}
.topbar .pill .ic{color:var(--tip)}
h1{font-size:28px;line-height:1.15;margin:12px 0 6px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:20px;margin:26px 0 12px;font-weight:600}
h3{font-size:16px;margin:14px 0 6px;font-weight:600}
.lead{color:var(--muted);margin:0 0 16px;max-width:62ch}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-deep);display:flex;align-items:center;gap:6px}
.meta{font-size:13px;color:var(--muted)}
.card{padding:18px;margin:12px 0}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--def-soft);color:var(--def);white-space:nowrap}
.tag.brand{background:var(--brand-soft);color:var(--brand-deep)}.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.tip{background:var(--tip-soft);color:var(--tip)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .4s var(--ease)}
.bar.ok>i{background:var(--ok)}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 22px;font-weight:600;font-size:16px;text-decoration:none;color:var(--ink);background:var(--paper);box-shadow:var(--shadow);border:1px solid transparent;min-height:46px;transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--paper);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(16,24,40,.18)}
.btn.light{background:#fff;color:#0b5fb0}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line)}
.btn.ghost.onbrand{color:#fff;border-color:rgba(255,255,255,.6)}
.btn.block{width:100%}
.btn:focus-visible,.iconbtn:focus-visible,.row:focus-visible,.ans:focus-visible,.chip:focus-visible{outline:3px solid var(--brand-deep);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.actions .btn{flex:1}
/* Hero */
.hero{background:var(--brand-grad);color:#fff;border-radius:var(--r-xl);padding:22px;margin:12px 0;box-shadow:0 14px 40px rgba(11,95,176,.28),inset 0 1px 0 rgba(255,255,255,.35);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero .k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero .t{font-size:22px;font-weight:700;line-height:1.2;margin:4px 0 2px;text-wrap:balance}
.hero .s{opacity:.88;font-size:14px}
.hero .bar{background:rgba(255,255,255,.3);margin:12px 0 14px}.hero .bar>i{background:#fff}
.hero .actions{margin:0}
.ring{width:88px;height:88px;position:relative}
.ring svg{width:88px;height:88px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
/* Stat-Kacheln */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{padding:14px 12px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:4px;margin-top:4px}
/* Listen */
.list{padding:6px 8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:var(--r-md);text-decoration:none;color:inherit;transition:background var(--dur) var(--ease)}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:var(--def-soft)}
.row .no{width:40px;height:40px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none;background:color-mix(in srgb,var(--c,var(--brand)) 16%,var(--paper));color:color-mix(in srgb,var(--c,var(--brand)) 80%,var(--ink))}
.row .ty{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--def-soft);color:var(--def)}
.row .ty.fall{background:var(--brand-soft);color:var(--brand-deep)}.row .ty.mc{background:var(--case-soft);color:var(--case)}.row .ty.schema{background:var(--schema-soft);color:var(--schema)}
.row .b{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px;line-height:1.3}
.row .s{font-size:13px;color:var(--muted);margin-top:2px}
.row .bar{margin-top:8px}
.row .st{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.row .st.ok{background:var(--ok-soft);color:var(--ok)}.row .st.bad{background:var(--bad-soft);color:var(--bad)}
.row .chev{color:var(--muted)}
.lvl{font-size:11px;color:var(--muted);font-weight:600;margin-left:6px}
.chap{margin:14px 0}
.chap .h{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}
.chap .h .n{width:36px;height:36px;border-radius:var(--r-sm);background:var(--brand-soft);color:var(--brand-deep);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.chap .h .b{flex:1;min-width:0}
.chap .h .t{font-weight:600;font-size:16px}
.chap .h .bar{margin-top:6px}
/* Wissensboxen */
.box{border-left:4px solid var(--x);background:var(--xs);border-radius:0 var(--r-md) var(--r-md) 0;padding:12px 14px;margin:12px 0;font-size:15px;line-height:1.55}
.box .k{color:var(--x);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.box p{margin:0 0 8px}.box p:last-child{margin-bottom:0}
.box.sv{--x:var(--brand);--xs:var(--def-soft);font-size:17px;line-height:1.6}
.box.merke{--x:var(--brand-deep);--xs:var(--brand-soft)}
.box.def{--x:var(--def);--xs:var(--def-soft)}
.box.tip{--x:var(--tip);--xs:var(--tip-soft)}
.box.ok{--x:var(--ok);--xs:var(--ok-soft)}
.box.bad{--x:var(--bad);--xs:var(--bad-soft)}
.fb{display:flex;align-items:center;gap:12px;font-weight:600;font-size:16px}
.fb .ic{width:28px;height:28px;color:var(--x)}
.fb .xp{margin-left:auto}
.frage{font-weight:700;font-size:19px;margin:16px 0 14px;line-height:1.4;text-wrap:balance}
.answers{display:grid;gap:10px;margin:14px 0}
.answers.yn{grid-template-columns:1fr 1fr}
.ans{border-radius:var(--r-md);padding:15px 16px;font-weight:600;font-size:16px;background:var(--paper);border:2px solid var(--line);text-align:left;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);transition:border-color var(--dur) var(--ease),transform var(--dur) var(--ease)}
.answers.yn .ans{justify-content:center;font-size:17px}
.ans:hover{border-color:var(--brand)}
.ans:active{transform:scale(.98)}
.ans.sel{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep)}
.ans.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.ans.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.ans[disabled]{cursor:default}
.ans .ic{margin-left:auto}
.loes p{margin:0 0 10px;line-height:1.6}
.intro p{font-size:17px;line-height:1.65}
#result{animation:rise .22s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* Chips und Inline-Karten */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:5px 11px 5px 8px;border-radius:999px;cursor:pointer;user-select:none;border:1px solid transparent;font-weight:600;background:var(--def-soft);color:var(--def)}
.chip.concept{background:var(--concept-soft);color:var(--concept)}.chip.norm,.chip.eunorm{background:var(--norm-soft);color:var(--norm)}.chip.case{background:var(--case-soft);color:var(--case)}.chip.step,.chip.schema{background:var(--schema-soft);color:var(--schema)}.chip.distinction{background:var(--dist-soft);color:var(--dist)}
.chip.open{border-color:currentColor}
.chip .ext{margin-left:2px;text-decoration:none;font-weight:700;opacity:.75;color:inherit}
.chip .ext:hover{opacity:1}
.slot:empty{display:none}
.inline{border-left:3px solid var(--line);margin:8px 0;padding:12px 14px;background:var(--paper);border-radius:0 var(--r-md) var(--r-md) 0;box-shadow:var(--shadow);font-size:15px}
.inline.concept{border-left-color:var(--concept)}.inline.norm,.inline.eunorm{border-left-color:var(--norm)}.inline.case{border-left-color:var(--case)}.inline.step,.inline.schema{border-left-color:var(--schema)}.inline.distinction{border-left-color:var(--dist)}
.inline h5{margin:2px 0 6px;font-size:15px}
.inline .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inline p{margin:0 0 6px}
.abs{margin:6px 0}.abs b{color:var(--norm);margin-right:4px}
.tree{list-style:none;padding:0;margin:0}
.tree li{margin:4px 0}
.tree .node{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer}
.tree .node:hover{background:var(--def-soft)}
.tree .tw{width:16px;color:var(--muted);flex:none;transition:transform var(--dur) var(--ease)}
.tree .tw.open{transform:rotate(90deg)}
.tree .lbl{font-weight:600}
.tree .body{margin:2px 0 6px 30px}
.tree .body p{margin:4px 0 6px;font-size:15px}
.tree ul{list-style:none;padding-left:22px;margin:0;border-left:1px dashed var(--line)}
.tblw{overflow-x:auto;margin:8px 0}
table.cmp{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
table.cmp th{background:var(--def-soft);font-weight:600}
table.cmp td:first-child{min-width:160px}
.lawlink{color:var(--brand-deep);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
.lawlink:hover{text-decoration-style:solid}
mark{background:var(--brand-soft);color:inherit}
.kbd{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
/* Feier, Leerzustand, Profil */
.done{text-align:center;padding:28px 18px}
.done .big{width:96px;height:96px;color:var(--brand);margin:0 auto 6px}
.done .score{font-size:44px;font-weight:700;color:var(--brand-deep);font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0}
.empty{text-align:center;padding:30px 18px;color:var(--muted)}
.empty .ic{width:56px;height:56px;color:var(--brand);margin-bottom:8px}
.ecard{background:var(--brand-grad);color:#fff;border-radius:var(--r-xl);padding:22px;margin:12px 0;box-shadow:0 14px 40px rgba(11,95,176,.28),inset 0 1px 0 rgba(255,255,255,.35)}
.ecard .top{display:flex;align-items:center;gap:12px}
.ecard .av{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.ecard .av .mark{color:#fff;width:32px;height:32px}
.ecard .name{font-weight:700;font-size:18px}.ecard .sub{opacity:.85;font-size:13px}
.ecard .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.ecard .nums b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.ecard .nums span{font-size:12px;opacity:.85}
.seg{display:inline-flex;background:var(--def-soft);border-radius:999px;padding:4px;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.principle{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.principle .tile{width:44px;height:44px;border-radius:var(--r-sm);background:var(--brand-soft);color:var(--brand-deep);display:flex;align-items:center;justify-content:center}
.principle h3{margin:2px 0 4px}
.principle p{margin:0;font-size:15px}
/* Tableiste und Hinweis */
nav.tabbar{position:fixed;left:16px;right:16px;bottom:max(14px,env(safe-area-inset-bottom));z-index:25;display:flex;justify-content:space-around;padding:6px;border-radius:999px;max-width:520px;margin:0 auto}
nav.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;padding:6px 0 4px;border-radius:999px}
nav.tabbar a .ic{width:26px;height:26px}
nav.tabbar a.active{color:var(--brand-deep)}
nav.tabbar a.active .ic{color:var(--brand)}
.notice{position:fixed;left:16px;right:16px;bottom:88px;z-index:30;padding:14px 16px;display:flex;gap:12px;align-items:center;font-size:14px;max-width:688px;margin:0 auto}
.notice .ic{color:var(--brand);width:28px;height:28px}
.notice .btn{padding:9px 16px;font-size:14px;min-height:40px}
@media (max-width:480px){.hero{grid-template-columns:1fr}.ring{display:none}.stats{gap:8px}.stat b{font-size:20px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
__SPRITE__
<div class="shell">
  <div class="topbar glass pill" id="top"></div>
  <main id="main"></main>
</div>
<nav class="tabbar glass pill" id="bnav"></nav>
<div id="notice" class="notice glass" hidden></div>
<script id="kurse-data" type="application/json">__KURSE__</script>
<script id="graph-data" type="application/json">__GRAPH__</script>
<script>
(function(){
'use strict';
// ---------- Theme: data-theme immer setzen (gespeichert oder System) ----------
const MQ = matchMedia('(prefers-color-scheme: dark)');
const themePref = () => { try{ return localStorage.getItem('mgk_theme'); }catch(e){ return null; } };
function applyTheme(){ const p=themePref(); document.documentElement.dataset.theme = p || (MQ.matches?'dark':'light'); }
applyTheme(); MQ.addEventListener('change', ()=>{ if(!themePref()) applyTheme(); });

const KURSE = JSON.parse(document.getElementById('kurse-data').textContent);
const G = JSON.parse(document.getElementById('graph-data').textContent);
const byId = new Map(G.nodes.map(n=>[n.id,n]));
const out = new Map(); for(const e of G.edges){ (out.get(e.source)||out.set(e.source,[]).get(e.source)).push(e); }
const O = id => out.get(id)||[];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md0 = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
__LAWJS__

const md = s => lawify(md0(s));
const txt = s => lawify(esc(s));
const ic = (n, cls) => `<svg class="ic${cls?' '+cls:''}" aria-hidden="true"><use href="#ic-${n}"/></svg>`;
const MARK = `<svg class="mark" aria-hidden="true"><use href="#ipelico-mark"/></svg>`;
const UNITS = []; const UNIT = new Map(); const CHAP = new Map(); const KURS = new Map();
for(const k of KURSE){ KURS.set(k.id,k); k.nr=KURSE.indexOf(k)+1; for(const c of k.kapitel){ CHAP.set(c.id,c); c.kurs=k.id; for(const e of c.einheiten){ e.kap=c.id; e.kurs=k.id; UNITS.push(e); UNIT.set(e.id,e); } } }
const QUIZ = e => e.typ==='fall'||e.typ==='mc';
const TYPE = {fall:['fall','Fall'], mc:['quiz','Wissensfrage'], intro:['intro','Einführung'], schema:['schema','Prüfungsschema']};
const LEVEL = ['','Basics','Fortgeschritten','Examen'];
const nn = n => String(n).padStart(2,'0');
const normNode = r => { let m=r.match(/^Art\. (\d+[a-z]?)(?: .*)? (MarkenRL|DurchsetzungsRL)$/); if(m) return byId.get('eunorm:'+m[2].toLowerCase()+':'+m[1]); m=r.match(/§ (\d+[a-z]?)/); return m?byId.get('norm:§'+m[1]):null; };

// ---------- Fortschritt: Cookie (Fallback localStorage) ----------
const DAY = () => Math.floor(Date.now()/86400000);
const Store = (()=>{
  const NAME='mgk_p', META='mgk_m';
  const getC = n => { const m=document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]*)')); return m?decodeURIComponent(m[1]):null; };
  const CPATH = location.pathname.replace(/[^/]*$/, '') || '/';
  const setC = (n,v) => { document.cookie = n+'='+encodeURIComponent(v)+'; max-age=31536000; path='+CPATH+'; SameSite=Lax'; };
  let mode = 'cookie';
  const probe = () => { try{ setC('mgk_t','1'); const ok = getC('mgk_t')==='1'; document.cookie='mgk_t=; max-age=0; path='+CPATH; if(!ok) mode='local'; }catch(e){ mode='local'; } };
  probe();
  const rd = n => { try{ return mode==='cookie' ? getC(n) : localStorage.getItem(n); }catch(e){ return null; } };
  const wr = (n,v) => { try{ if(mode==='cookie') setC(n,v); else localStorage.setItem(n,v); }catch(e){} };
  const load = () => {
    const p = {u:{}, s:{last:0,cnt:0,best:0}, xp:0, last:'', ack:0};
    const u = rd(NAME); if(u){ for(const part of u.split('_')){ const [id,r,d,n]=part.split('.'); if(id) p.u[id]={r:+r,d:+d,n:+n||0}; } }
    const m = rd(META); if(m){ const [last,cnt,best,xp,lastU,ack]=m.split(','); p.s={last:+last||0,cnt:+cnt||0,best:+best||0}; p.xp=+xp||0; p.last=lastU||''; p.ack=+ack||0; }
    return p; };
  const save = p => {
    wr(NAME, Object.entries(p.u).map(([id,v])=>`${id}.${v.r}.${v.d}.${v.n}`).join('_'));
    wr(META, [p.s.last,p.s.cnt,p.s.best,p.xp,p.last,p.ack].join(','));
  };
  const clear = () => { wr(NAME,''); wr(META,''); if(mode==='cookie'){ document.cookie='mgk_p=; max-age=0; path='+CPATH; document.cookie='mgk_m=; max-age=0; path='+CPATH; } };
  return {load, save, clear, mode:()=>mode};
})();
let P = Store.load();
function touchStreak(){ const t=DAY(); if(P.s.last===t) return; P.s.cnt = (P.s.last===t-1) ? P.s.cnt+1 : 1; P.s.last=t; P.s.best=Math.max(P.s.best,P.s.cnt); }
function record(id, ok){ const prev=P.u[id]; const n = ok ? ((prev&&prev.r===1?prev.n:0)+1) : 0; P.u[id]={r:ok?1:0,d:DAY(),n}; P.xp += ok?10:2; touchStreak(); P.last=id; Store.save(P); }
function markSeen(id){ if(!P.u[id]) { P.u[id]={r:1,d:DAY(),n:1}; P.xp+=3; } touchStreak(); P.last=id; Store.save(P); }
const INT=[1,3,7,14,30,60];
const due = e => { const v=P.u[e.id]; if(!v||!QUIZ(e)) return false; if(v.r===0) return true; return v.d + INT[Math.min(v.n,INT.length-1)] <= DAY(); };
const st = e => { const v=P.u[e.id]; return v ? (v.r===1?'ok':'bad') : 'none'; };
const progOf = units => { const q=units; const done=q.filter(e=>P.u[e.id]).length; const ok=q.filter(e=>P.u[e.id]&&P.u[e.id].r===1).length; return {total:q.length,done,ok,pct:q.length?Math.round(done/q.length*100):0}; };
const unitsOf = k => k.kapitel.flatMap(c=>c.einheiten);

// ---------- Inline-Karten (Begriffe, Normen, Entscheidungen, Schema) ----------
const norms = id => O(id).filter(e=>['defined_in','applies','interprets'].includes(e.relation)).map(e=>({node:byId.get(e.target),ref:e.ref}));
const cases = id => O(id).filter(e=>e.relation==='illustrated_by'||e.relation==='cites').map(e=>byId.get(e.target));
const related = id => O(id).filter(e=>e.relation==='related_to'||e.relation==='uses_concept').map(e=>byId.get(e.target));
const steps = id => O(id).filter(e=>e.relation==='has_step').sort((a,b)=>a.order-b.order).map(e=>byId.get(e.target));
const CHIP_ICON = {concept:'begriff',norm:'norm',eunorm:'richtlinie',case:'entscheidung',step:'pruefungspunkt',schema:'schema',distinction:'tabelle'};
function chip(n, ref){ if(!n) return ''; const label = n.type==='norm'&&ref ? ref+' MarkenG' : n.type==='eunorm'&&ref ? ref : n.type==='case' ? n.court+' '+n.name : n.label; const ext = n.type==='norm' ? `<a class="ext" href="${esc(n.url)}" target="_blank" rel="noopener" title="Auf gesetze-im-internet.de nachlesen">↗</a>` : n.type==='eunorm' ? `<a class="ext" href="${esc(n.url)}" target="_blank" rel="noopener" title="Auf EUR-Lex nachlesen">↗</a>` : '';
  return `<span class="chip ${n.type}" data-node="${n.id}" tabindex="0">${ic(CHIP_ICON[n.type]||'begriff','s')}${esc(label)}${ext}</span>`; }
function chips(list){ return list.length ? `<div class="chips">${list.map(x=>x&&x.node!==undefined?chip(x.node,x.ref):chip(x)).join('')}</div><div class="slot"></div>` : ''; }
function section(t,h){ return h?`<div class="meta" style="margin-top:10px">${t}</div>${h}`:''; }
function normText(n, ref){ const m=ref&&ref.match(/Abs\. (\d+[a-z]?)/); const want=m?m[1]:null; let list=n.absaetze.filter(a=>!want||a.nr===want||a.nr===null); if(!list.length) list=n.absaetze;
  let h=list.map(a=>`<div class="abs">${a.nr?`<b>(${esc(a.nr)})</b>`:''}${lawify(esc(a.text).replace(/\n/g,'<br>'))}</div>`).join('');
  if(want&&list.length<n.absaetze.length) h+=`<div class="chips"><span class="chip norm" data-node="${n.id}" data-full="1" tabindex="0">${ic('norm','s')}ganzen ${esc(n.label)} anzeigen</span></div><div class="slot"></div>`; return h; }
function inlineCard(n, ref){
  let b='';
  if(n.type==='concept') b=`<h5>${esc(n.label)}</h5><p>${txt(n.definition)}</p><p class="meta">${txt(n.erlaeuterung)}</p>${section('Normen',chips(norms(n.id)))}${section('Rechtsprechung',chips(cases(n.id).slice(0,6)))}${section('Verwandt',chips(related(n.id).slice(0,6)))}`;
  else if(n.type==='norm') b=`<h5>${esc(n.label)} – ${esc(n.titel)}</h5>${normText(n,ref)}<div class="meta"><a href="${esc(n.url)}" target="_blank" rel="noopener">gesetze-im-internet.de ↗</a></div>`;
  else if(n.type==='eunorm') b=`<h5>${esc(n.label)} – ${esc(n.titel)}</h5><div class="meta">${esc(n.gesetz)}${n.abschnitt?' · '+esc(n.abschnitt):''}</div>${n.absaetze.map(a=>`<div class="abs">${a.nr?`<b>(${esc(a.nr)})</b>`:''}${txt(a.text)}</div>`).join('')}${n.hinweis?`<div class="box merke"><div class="k">${ic('merke','s')}Umsetzung</div>${txt(n.hinweis)}</div>`:''}${weitereTable(n)}<div class="meta">${n.paraphrase?'Paraphrase; Wortlaut auf':'Amtlicher Wortlaut (berichtigte Fassung); Quelle:'} <a href="${esc(n.url)}" target="_blank" rel="noopener">EUR-Lex ↗</a></div>`;
  else if(n.type==='distinction') b=`<h5>${esc(n.label)}</h5>`+cmpTable(n);
  else if(n.type==='case') b=`<h5>${esc(n.court)} „${esc(n.name)}“</h5><div class="meta mono">${esc(n.date.split('-').reverse().join('.'))} – ${esc(n.az)}${n.fundstelle?' – '+esc(n.fundstelle):''} · <a href="${esc(n.url)}" target="_blank" rel="noopener">dejure ↗</a></div><p>${txt(n.kern)}</p>${section('Normen',chips(norms(n.id)))}`;
  else if(n.type==='step') b=`<h5>${esc(n.label)}</h5><p>${txt(n.text)}</p>${section('Begriffe',chips(related(n.id)))}${section('Normen',chips(norms(n.id)))}${section('Rechtsprechung',chips(cases(n.id)))}`;
  else if(n.type==='schema') b=`<h5>${esc(n.label)}</h5><p>${txt(n.beschreibung)}</p>`;
  const kinds={concept:'Definition',norm:'Gesetz',eunorm:'Richtlinie',case:'Entscheidung',step:'Prüfungspunkt',schema:'Prüfungsschema',distinction:'Abgrenzung / Tabelle'};
  return `<div class="inline ${n.type}"><div class="k">${kinds[n.type]||n.type}</div>${b}</div>`;
}
function cmpTable(n){ return `<p class="meta"><i>${txt(n.frage)}</i></p><div class="tblw"><table class="cmp"><tr><th></th>${n.spalten.map(s=>`<th>${esc(s)}</th>`).join('')}</tr>${n.kriterien.map((k,i)=>`<tr><td><b>${esc(k)}</b></td>${n.rows[i].map(v=>`<td>${txt(v)}</td>`).join('')}</tr>`).join('')}</table></div>${n.merksatz?`<div class="box merke"><div class="k">${ic('merke','s')}Merke</div>${txt(n.merksatz)}</div>`:''}`; }
function weitereTable(n){ const w=n.umsetzung_weitere||{}; const keys=Object.keys(w); if(!keys.length) return '';
  return `<div class="meta" style="margin-top:8px">Umsetzung in den anderen Gesetzen</div><div class="tblw"><table class="cmp">${keys.map(k=>`<tr><th style="white-space:nowrap">${esc(k)}</th><td>${txt(w[k])}</td></tr>`).join('')}</table></div>`; }
function openChip(c){ const n=byId.get(c.dataset.node); if(!n) return;
  const row=c.closest('.chips'); let slot=row.nextElementSibling; if(!slot||!slot.classList.contains('slot')){ slot=document.createElement('div'); slot.className='slot'; row.after(slot); }
  const wasOpen=c.classList.contains('open')&&!c.dataset.full; row.querySelectorAll('.chip.open').forEach(x=>x.classList.remove('open'));
  if(wasOpen){ slot.innerHTML=''; return; } c.classList.add('open');
  slot.innerHTML=inlineCard(n, c.dataset.full?null:(n.type==='norm'?c.textContent.replace(' MarkenG','').replace('↗','').trim():null)); }
document.addEventListener('click', ev=>{ if(ev.target.closest('a')) return; const c=ev.target.closest('.chip[data-node]'); if(c) openChip(c); });
document.addEventListener('keydown', ev=>{ if(ev.key!=='Enter'&&ev.key!==' ') return; const c=ev.target.closest&&ev.target.closest('.chip[data-node]'); if(c){ ev.preventDefault(); openChip(c); } });
function schemaTree(schemaId){
  const li = s => { const kids=steps(s.id); return `<li><div class="node" data-step><span class="tw">${kids.length?ic('weiter','s'):'·'}</span><div><div class="lbl">${esc(s.label)}</div></div></div><div class="body" hidden>${s.text?`<p>${txt(s.text)}</p>`:''}${section('Begriffe',chips(related(s.id)))}${section('Normen',chips(norms(s.id)))}${section('Rechtsprechung',chips(cases(s.id)))}${kids.length?`<ul>${kids.map(li).join('')}</ul>`:''}</div></li>`; };
  return `<ul class="tree">${steps(schemaId).map(li).join('')}</ul>`;
}
document.addEventListener('click', ev=>{ const n=ev.target.closest('.node[data-step]'); if(!n) return; const b=n.nextElementSibling; b.hidden=!b.hidden; n.querySelector('.tw').classList.toggle('open', !b.hidden); });

// ---------- Routing & Chrome ----------
const main=document.getElementById('main'), top=document.getElementById('top');
function chrome(title, back, extra){ top.innerHTML = back
  ? `<a class="iconbtn" href="${back}" aria-label="Zurück">${ic('zurueck')}</a><div class="ttl">${esc(title)}</div>${extra||''}`
  : `<a class="brand" href="#/">${MARK}<span>IPelico</span></a><div class="sp"></div>${extra||''}`; }
function streakPill(){ return `<span class="pill" title="Lern-Streak">${ic('streak','s')}<span class="mono">${P.s.cnt}</span></span><span class="pill" title="Punkte"><span class="mono">${P.xp}</span> XP</span>`; }
function bnav(){ const h=location.hash||'#/'; const item=(href,icn,l)=>`<a href="${href}" class="${(href==='#/'?h==='#/'||h===''||h.startsWith('#/kurs')||h.startsWith('#/lernen')||h.startsWith('#/ende'):h.startsWith(href))?'active':''}">${ic(icn)}${l}</a>`;
  document.getElementById('bnav').innerHTML=item('#/','tab-kurse','Kurse')+item('#/wdh','tab-wdh','Wiederholen')+item('#/profil','tab-profil','Profil')+item('#/didaktik','tab-konzept','Konzept'); }
function route(){ const h=decodeURIComponent(location.hash||'#/').replace(/^#\//,''); const [v,a,b]=h.split('/'); window.scrollTo(0,0); bnav();
  ({'':vHome,kurs:vKurs,lernen:vLernen,wdh:vWdh,profil:vProfil,didaktik:vDidaktik,ende:vEnde}[v]||vHome)(a,b); notice(); }
window.addEventListener('hashchange',route);

function ring(pct){ const r=38,c=2*Math.PI*r; return `<div class="ring"><svg viewBox="0 0 88 88"><circle cx="44" cy="44" r="${r}" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="8"/><circle cx="44" cy="44" r="${r}" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}"/></svg><div class="v mono">${pct}%</div></div>`; }
function nextUnit(){ if(P.last&&UNIT.has(P.last)){ const i=UNITS.findIndex(e=>e.id===P.last); for(let j=i+1;j<UNITS.length;j++) if(!P.u[UNITS[j].id]) return UNITS[j]; } return UNITS.find(e=>!P.u[e.id])||UNITS[0]; }
function courseRow(k){ const p=progOf(unitsOf(k).filter(QUIZ)); const all=unitsOf(k).length;
  return `<a class="row" href="#/kurs/${k.id}" style="--c:${esc(k.farbe)}"><span class="no mono">${nn(k.nr)}</span><div class="b"><div class="t">${esc(k.titel)}</div><div class="s">${all} Einheiten · ${p.ok} gelöst</div><div class="bar ${p.pct===100?'ok':''}"><i style="width:${p.pct}%"></i></div></div>${ic('weiter','m','')?'':''}<span class="chev">${ic('weiter','m')}</span></a>`; }
function unitRow(e, sub){ const s=st(e); const [icn,label]=TYPE[e.typ]||TYPE.fall;
  return `<a class="row" href="#/lernen/${e.id}"><span class="ty ${e.typ}" title="${label}">${ic(icn,'m')}</span><div class="b"><div class="t">${esc(e.titel)}${e.level?`<span class="lvl">${LEVEL[e.level]}</span>`:''}</div>${sub?`<div class="s">${esc(sub)}</div>`:''}</div><span class="st ${s}">${s==='ok'?ic('richtig','m'):s==='bad'?ic('falsch','m'):ic('offen','m')}</span></a>`; }

function vLernen(id){

  const tables = e.typ==='intro' ? dists.map(d=>`<div class="glass card"><h3 style="margin:0 0 6px">${esc(d.label)}</h3>${cmpTable(d)}</div>`).join('') : '';
  const nextBtn = next ? `<a class="btn primary block" href="#/lernen/${next.id}">Weiter${ic('weiter','m')}</a>` : `<a class="btn primary block" href="#/ende/${c.id}">Kapitel abschließen${ic('richtig','m')}</a>`;
  const [icn,label]=TYPE[e.typ]||TYPE.fall; const lvl=LEVEL[e.level]||'';
  let body='';
  if(e.typ==='intro'){ body=`<span class="tag brand">${ic('intro','s')}Einführung</span><h1>${esc(e.titel)}</h1><div class="glass card intro"><p style="margin:0">${md(e.text)}</p>${refs}</div>${tables}<div class="actions" style="margin-top:20px"><button class="btn primary block" id="ok">Verstanden, weiter${ic('weiter','m')}</button></div>`; }
  else if(e.typ==='schema'){ const s=byId.get('schema:'+e.schema); body=`<span class="tag brand">${ic('schema','s')}Prüfungsschema</span><h1>${esc(e.titel)}</h1>${e.text?`<p class="lead">${md(e.text)}</p>`:''}<div class="glass card"><div class="meta" style="margin-bottom:8px">${txt(s?s.beschreibung:'')}</div>${schemaTree('schema:'+e.schema)}</div><div class="actions" style="margin-top:20px"><button class="btn primary block" id="ok">Gelesen, weiter${ic('weiter','m')}</button></div>`; }
  else {
    const prev=P.u[e.id];
    body=`<div class="tags" style="margin:0"><span class="tag brand">${ic(icn,'s')}${label}</span>${lvl?`<span class="tag">${lvl}</span>`:''}${prev?`<span class="tag ${prev.r?'ok':'bad'}">${ic(prev.r?'richtig':'falsch','s')}zuletzt ${prev.r?'richtig':'falsch'}</span>`:''}</div><h1>${esc(e.titel)}</h1>${e.sachverhalt?`<div class="box sv"><div class="k">${ic('sachverhalt','s')}Sachverhalt</div>${txt(e.sachverhalt)}</div>`:''}<div class="frage">${txt(e.frage)}</div>
      <div class="answers ${e.typ==='fall'?'yn':''}" id="answers">${e.typ==='fall'?`<button class="ans" data-v="1">Ja</button><button class="ans" data-v="0">Nein</button>`:e.optionen.map((o,i)=>`<button class="ans" data-v="${i}"><span class="mono" style="color:var(--muted)">${i+1}</span>${txt(o)}</button>`).join('')}</div>
      <div id="result" hidden><div id="fb"></div><div class="glass card"><div class="eyebrow">${ic('loesung','s')}Lösung</div><div class="loes" style="margin-top:8px">${e.loesung.map(p=>`<p>${md(p)}</p>`).join('')}</div>${e.merke?`<div class="box merke"><div class="k">${ic('merke','s')}Merke</div>${md(e.merke)}</div>`:''}${refs}</div><div class="actions" style="margin-top:16px">${nextBtn}</div></div>`;
  }
  main.innerHTML=`<div class="bar" style="margin:2px 0 16px"><i style="width:${pct}%"></i></div>${body}`;
  const okBtn=document.getElementById('ok'); if(okBtn) okBtn.onclick=()=>{ markSeen(e.id); location.hash = next?`#/lernen/${next.id}`:`#/ende/${c.id}`; };
  const answers=document.getElementById('answers'); if(answers){
    const correct = e.typ==='fall' ? (e.antwort?1:0) : e.richtig;
    const choose = v => { const ok = v===correct; record(e.id, ok);
      answers.querySelectorAll('.ans').forEach(b=>{ b.disabled=true; const bv=+b.dataset.v; if(bv===correct){ b.classList.add('right'); b.insertAdjacentHTML('beforeend',ic('richtig','m')); } else if(bv===v){ b.classList.add('wrong'); b.insertAdjacentHTML('beforeend',ic('falsch','m')); } });
      document.getElementById('fb').innerHTML=`<div class="box ${ok?'ok':'bad'}"><div class="fb">${ic(ok?'richtig':'falsch')}<span>${ok?'Richtig!':'Leider nicht. '+(e.typ==='fall'?`Richtig wäre: ${correct?'Ja':'Nein'}.`:'Die richtige Antwort ist markiert.')}</span><span class="tag ${ok?'ok':'bad'} xp mono">+${ok?10:2} XP</span></div></div>`;
      document.getElementById('result').hidden=false; document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'}); top.querySelector('.pill').textContent=`${idx+1}/${c.einheiten.length}`; };
    answers.querySelectorAll('.ans').forEach(b=>b.onclick=()=>choose(+b.dataset.v));
    document.onkeydown = ev => { if(!location.hash.startsWith('#/lernen')) return; if(document.getElementById('result')&&!document.getElementById('result').hidden){ if(ev.key==='Enter'||ev.key==='ArrowRight'){ const a=document.querySelector('#result .btn'); if(a) a.click(); } return; }
      if(e.typ==='fall'){ if(ev.key==='j'||ev.key==='J'||ev.key==='ArrowLeft') choose(1); if(ev.key==='n'||ev.key==='N'||ev.key==='ArrowRight') choose(0); } else if(/^[1-4]$/.test(ev.key)) choose(+ev.key-1); };
  } else document.onkeydown=null;
}
function vEnde(cid){
  const c=CHAP.get(cid); if(!c) return vHome(); const k=KURS.get(c.kurs); const q=c.einheiten.filter(QUIZ); const p=progOf(q); const wrong=q.filter(e=>st(e)==='bad');
  const ki=k.kapitel.indexOf(c); const nextC=k.kapitel[ki+1]; const nk=KURSE[KURSE.indexOf(k)+1];
  chrome(`Kurs ${k.nr}`,`#/kurs/${k.id}`,streakPill());
  main.innerHTML=`<div class="glass card done">${ic(p.ok===p.total?'feier':'tab-wdh','big')}<div class="eyebrow" style="justify-content:center">Kapitel abgeschlossen</div><h1>${esc(c.titel)}</h1><div class="score">${p.ok}/${p.total}</div><p class="lead" style="margin:0 auto 14px">${p.ok===p.total?'Alles richtig. Stark!':wrong.length?`${wrong.length} Fall${wrong.length>1?'e':''} noch einmal ansehen.`:'Gut gemacht!'}</p>
    ${wrong.length?`<div class="list" style="text-align:left">${wrong.map(e=>unitRow(e)).join('')}</div>`:''}
    <div class="actions">${nextC?`<a class="btn primary" href="#/lernen/${nextC.einheiten[0].id}">Nächstes Kapitel${ic('weiter','m')}</a>`:nk?`<a class="btn primary" href="#/kurs/${nk.id}">Nächster Kurs${ic('weiter','m')}</a>`:`<a class="btn primary" href="#/">Zur Übersicht</a>`}<a class="btn" href="#/kurs/${k.id}">Kursübersicht</a></div></div>`;
}
function vWdh(){
  chrome('Wiederholen','#/',streakPill()); const d=UNITS.filter(due); const wrong=UNITS.filter(e=>st(e)==='bad');
  main.innerHTML=`<h1>Wiederholen</h1><p class="lead">Falsch beantwortete Fälle und solche, deren Wiederholungsintervall abgelaufen ist (1, 3, 7, 14, 30, 60 Tage nach jeder richtigen Antwort).</p>
  <div class="stats"><div class="stat glass"><b class="mono">${d.length}</b><span>${ic('faellig','s')}fällig</span></div><div class="stat glass"><b class="mono">${wrong.length}</b><span>${ic('falsch','s')}falsch</span></div><div class="stat glass"><b class="mono">${UNITS.filter(e=>st(e)==='ok').length}</b><span>${ic('richtig','s')}gelöst</span></div></div>
  ${d.length?`<a class="btn primary block" href="#/lernen/${d[0].id}">Wiederholung starten${ic('weiter','m')}</a><div class="glass list" style="margin-top:12px">${d.map(e=>unitRow(e, KURS.get(e.kurs).titel)).join('')}</div>`:`<div class="glass card empty">${ic('tab-wdh')}<div><b>Nichts fällig.</b> Wenn du heute weiterlernst, wächst dein Streak.</div></div>`}`;
}
function vProfil(){
  chrome('Profil','#/'); const all=progOf(UNITS.filter(QUIZ)); const pref=themePref()||'system';
  main.innerHTML=`<div class="ecard"><div class="top"><div class="av">${MARK}</div><div><div class="name">IPelico Lernkonto</div><div class="sub">Markenrecht in Fällen · nur auf diesem Gerät</div></div></div>
    <div class="nums"><div><b class="mono">${P.xp}</b><span>XP</span></div><div><b class="mono">${P.s.cnt}</b><span>Tage Streak</span></div><div><b class="mono">${P.s.best}</b><span>Bester Streak</span></div></div></div>
  <div class="glass card"><b>${all.ok} von ${all.total} Fällen gelöst</b> <span class="meta">(${all.pct}% bearbeitet)</span><div class="bar" style="margin-top:8px"><i style="width:${all.pct}%"></i></div></div>
  <h2>Kurse</h2><div class="glass list">${KURSE.map(k=>{ const p=progOf(unitsOf(k).filter(QUIZ)); return `<a class="row" href="#/kurs/${k.id}" style="--c:${esc(k.farbe)}"><span class="no mono">${nn(k.nr)}</span><div class="b"><div class="t">${esc(k.titel)}</div><div class="s">${p.ok}/${p.total} richtig · ${p.done-p.ok} falsch</div><div class="bar ${p.pct===100?'ok':''}"><i style="width:${p.pct}%"></i></div></div></a>`; }).join('')}</div>
  <h2>Darstellung und Speicherung</h2><div class="glass card"><div class="seg" id="theme"><button data-t="light" class="${pref==='light'?'on':''}">${ic('hell','s')}Hell</button><button data-t="dark" class="${pref==='dark'?'on':''}">${ic('dunkel','s')}Dunkel</button><button data-t="system" class="${pref==='system'?'on':''}">${ic('system','s')}System</button></div>
    <p style="margin:14px 0 10px">Dein Fortschritt liegt ${Store.mode()==='cookie'?'in zwei Cookies (<code>mgk_p</code>, <code>mgk_m</code>, 1 Jahr gültig)':'im lokalen Browserspeicher (Cookies sind hier nicht verfügbar, etwa beim Öffnen als Datei)'} auf diesem Gerät. Es werden keine Daten an einen Server gesendet.</p>
    <button class="btn ghost" id="reset" style="color:var(--bad)">${ic('loeschung','m')}Fortschritt löschen</button></div>`;
  document.getElementById('reset').onclick=()=>{ if(confirm('Gesamten Fortschritt löschen?')){ Store.clear(); P=Store.load(); route(); } };
  document.getElementById('theme').onclick=ev=>{ const b=ev.target.closest('button'); if(!b) return; const t=b.dataset.t; try{ if(t==='system') localStorage.removeItem('mgk_theme'); else localStorage.setItem('mgk_theme',t); }catch(e){} applyTheme(); document.querySelectorAll('#theme button').forEach(x=>x.classList.toggle('on',x===b)); };
}
function vDidaktik(){
  chrome('Konzept','#/');
  const pr=(icn,t,p)=>`<div class="glass card principle"><div class="tile">${ic(icn)}</div><div><h3>${t}</h3><p>${p}</p></div></div>`;
  main.innerHTML=`<h1>So ist IPelico gebaut</h1><p class="lead">IPelico folgt der Falldidaktik moderner Jura-Lernapps, übertragen auf das Markengesetz.</p>
  ${pr('fall','Kleinste Einheiten','Jeder Fall behandelt genau einen Prüfungspunkt. Der Sachverhalt ist wenige Sätze lang und bildet einen echten Lebenssachverhalt ab, oft angelehnt an eine BGH- oder EuGH-Entscheidung.')}
  ${pr('richtig','Frage, Antwort, sofortiges Feedback','Du entscheidest dich (Ja/Nein oder Auswahl), bekommst sofort Richtig oder Falsch und dann die Lösung im Gutachtenstil: Definition, Subsumtion, Ergebnis. Der Merksatz fasst die Regel in einem Satz zusammen.')}
  ${pr('schema','Aufeinander aufbauend','Jedes Kapitel beginnt mit einer Einführung oder dem Prüfungsschema, danach folgen die Fälle in der Reihenfolge der Prüfung. Die Kurse bauen aufeinander auf: Grundlagen, Schutzfähigkeit, Verletzung, Schranken, Verfahren, EU und IR.')}
  ${pr('suche','Vernetzt','Begriffe, Normen und Entscheidungen lassen sich in jeder Lösung inline aufklappen. Sie stammen aus dem Wissensgraphen, der auch den Lernnavigator und die Karteikarten speist.')}
  ${pr('faellig','Wiederholen und dranbleiben','Falsche Antworten landen in der Wiederholung; richtige kehren nach wachsenden Intervallen zurück. Streak und Punkte machen den Fortschritt sichtbar. Der Fortschritt bleibt per Cookie auf deinem Gerät.')}
  <div class="glass card"><h3 style="margin-top:0">Schwierigkeitsgrade</h3><div class="tags"><span class="tag">Basics · Grundregel und Definition</span><span class="tag">Fortgeschritten · Abgrenzung und Ausnahme</span><span class="tag">Examen · Rechtsprechungsdetail und Meinungsstand</span></div>
  <p><a class="btn ghost" href="navigator/">${ic('suche','m')}Zum Lernnavigator: Schemata, Begriffe, Rechtsprechung, Gesetz</a></p>
  <p class="meta" style="margin-bottom:0">Tastatur im Fall: <span class="kbd">J</span>/<span class="kbd">N</span> antworten, <span class="kbd">1</span>–<span class="kbd">4</span> bei Auswahlfragen, <span class="kbd">Enter</span> weiter.</p></div>`;
}
function notice(){ const n=document.getElementById('notice'); if(P.ack||Store.mode()!=='cookie'){ n.hidden=true; return; } n.hidden=false; n.innerHTML=`${ic('datenschutz')}<span>Dein Lernfortschritt wird in einem Cookie auf diesem Gerät gespeichert (kein Tracking, keine Übermittlung).</span><button class="btn primary" id="ack">Alles klar</button>`; document.getElementById('ack').onclick=()=>{ P.ack=1; Store.save(P); n.hidden=true; }; }
route();
})();
</script>
</body>
</html>
