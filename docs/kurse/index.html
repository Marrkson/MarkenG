reinsetzung auch ohne Antrag gewährt\nwerden."},{"nr":"5","text":"Ein Jahr nach Ablauf der versäumten Frist kann die\nWiedereinsetzung nicht mehr beantragt und die versäumte Handlung nicht\nmehr nachgeholt werden."},{"nr":"6","text":"Über den Antrag beschließt die Stelle, die über die nachgeholte\nHandlung zu beschließen hat."},{"nr":"7","text":"Die Wiedereinsetzung ist unanfechtbar."},{"nr":"8","text":"Wird dem Inhaber einer Marke Wiedereinsetzung gewährt, so kann er\nDritten gegenüber, die in dem Zeitraum zwischen dem Eintritt des\nRechtsverlusts an der Eintragung der Marke und der Wiedereinsetzung\nunter einem mit der Marke identischen oder ihr ähnlichen Zeichen\ngutgläubig Waren in den Verkehr gebracht oder Dienstleistungen\nerbracht haben, hinsichtlich dieser Handlungen keine Rechte geltend\nmachen."}],"url":"https://www.gesetze-im-internet.de/markeng/__91.html"},{"id":"norm:§91a","type":"norm","label":"§ 91a MarkenG","titel":"Weiterbehandlung der Anmeldung","nummer":"91a","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 7 - Gemeinsame Vorschriften","absaetze":[{"nr":"1","text":"Ist nach Versäumung einer vom Deutschen Patent- und Markenamt\nbestimmten Frist die Markenanmeldung zurückgewiesen worden, so wird\nder Beschluss wirkungslos, ohne dass es seiner ausdrücklichen\nAufhebung bedarf, wenn der Anmelder die Weiterbehandlung der Anmeldung\nbeantragt und die versäumte Handlung nachholt."},{"nr":"2","text":"Der Antrag ist innerhalb einer Frist von einem Monat nach\nZustellung der Entscheidung über die Zurückweisung der Markenanmeldung\neinzureichen. Die versäumte Handlung ist innerhalb dieser Frist\nnachzuholen."},{"nr":"3","text":"Gegen die Versäumung der Frist nach Absatz 2 und der Frist zur\nZahlung der Weiterbehandlungsgebühr nach § 6 Abs. 1 Satz 1 des\nPatentkostengesetzes ist eine Wiedereinsetzung nicht gegeben."},{"nr":"4","text":"Über den Antrag beschließt die Stelle, die über die nachgeholte\nHandlung zu beschließen hat."}],"url":"https://www.gesetze-im-internet.de/markeng/__91a.html"},{"id":"norm:§92","type":"norm","label":"§ 92 MarkenG","titel":"Wahrheitspflicht","nummer":"92","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 7 - Gemeinsame Vorschriften","absaetze":[{"nr":null,"text":"In den Verfahren vor dem Deutschen Patent- und Markenamt, dem\nBundespatentgericht und dem Bundesgerichtshof haben die Beteiligten\nihre Erklärungen über tatsächliche Umstände vollständig und der\nWahrheit gemäß abzugeben."}],"url":"https://www.gesetze-im-internet.de/markeng/__92.html"},{"id":"norm:§93","type":"norm","label":"§ 93 MarkenG","titel":"Amtssprache und Gerichtssprache","nummer":"93","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 7 - Gemeinsame Vorschriften","absaetze":[{"nr":null,"text":"Die Sprache vor dem Deutschen Patent- und Markenamt und vor dem\nBundespatentgericht ist deutsch. Im übrigen finden die Vorschriften\ndes Gerichtsverfassungsgesetzes über die Gerichtssprache Anwendung."}],"url":"https://www.gesetze-im-internet.de/markeng/__93.html"},{"id":"norm:§93a","type":"norm","label":"§ 93a MarkenG","titel":"Entschädigung von Zeugen, Vergütung von Sachverständigen","nummer":"93a","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 7 - Gemeinsame Vorschriften","absaetze":[{"nr":null,"text":"Zeugen erhalten eine Entschädigung und Sachverständige eine Vergütung\nnach dem Justizvergütungs- und -entschädigungsgesetz."}],"url":"https://www.gesetze-im-internet.de/markeng/__93a.html"},{"id":"norm:§94","type":"norm","label":"§ 94 MarkenG","titel":"Zustellungen; Verordnungsermächtigung","nummer":"94","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 7 - Gemeinsame Vorschriften","absaetze":[{"nr":"1","text":"Für Zustellungen im Verfahren vor dem Deutschen Patent- und\nMarkenamt gelten die Vorschriften des Verwaltungszustellungsgesetzes\nmit folgenden Maßgaben:\n\n1. An Empfänger, die sich im Ausland aufhalten und die entgegen dem\n Erfordernis des § 96 keinen Inlandsvertreter bestellt haben, kann mit\n eingeschriebenem Brief durch Aufgabe zur Post zugestellt werden.\n Gleiches gilt für Empfänger, die selbst Inlandsvertreter im Sinne des\n § 96 Abs. 2 sind. § 184 Abs. 2 Satz 1 und 4 der Zivilprozessordnung\n gilt entsprechend.\n\n2. Für Zustellungen an Erlaubnisscheininhaber (§ 177 der\n Patentanwaltsordnung) ist § 5 Abs. 4 des\n Verwaltungszustellungsgesetzes entsprechend anzuwenden.\n\n3. An Empfänger, denen beim Deutschen Patent- und Markenamt ein Abholfach\n eingerichtet worden ist, kann auch dadurch zugestellt werden, daß das\n Schriftstück im Abholfach des Empfängers niedergelegt wird. Über die\n Niederlegung ist eine Mitteilung zu den Akten zu geben. Auf dem\n Schriftstück ist zu vermerken, wann es niedergelegt worden ist. Die\n Zustellung gilt als am dritten Tag nach der Niederlegung im Abholfach\n bewirkt.\n\n4. Für die Zustellung von elektronischen Dokumenten ist ein\n Übermittlungsweg zu verwenden, bei dem die Authentizität und\n Integrität der Daten gewährleistet ist und der bei Nutzung allgemein\n zugänglicher Netze die Vertraulichkeit der zu übermittelnden Daten\n durch ein Verschlüsselungsverfahren sicherstellt. Das\n Bundesministerium der Justiz und für Verbraucherschutz erlässt durch\n Rechtsverordnung, die nicht der Zustimmung des Bundesrates bedarf,\n nähere Bestimmungen über die nach Satz 1 geeigneten Übermittlungswege\n sowie die Form und den Nachweis der elektronischen Zustellung."},{"nr":"2","text":"Für Zustellungen im Verfahren vor dem Bundespatentgericht gelten\ndie Vorschriften der Zivilprozessordnung."}],"url":"https://www.gesetze-im-internet.de/markeng/__94.html"},{"id":"norm:§95","type":"norm","label":"§ 95 MarkenG","titel":"Rechtshilfe","nummer":"95","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 7 - Gemeinsame Vorschriften","absaetze":[{"nr":"1","text":"Die Gerichte sind verpflichtet, dem Deutschen Patent- und\nMarkenamt Rechtshilfe zu leisten."},{"nr":"2","text":"Im Verfahren vor dem Deutschen Patent- und Markenamt setzt das\nBundespatentgericht auf Ersuchen des Deutschen Patent- und Markenamts\nOrdnungs- oder Zwangsmittel gegen Zeugen oder Sachverständige fest,\ndie nicht erscheinen oder ihre Aussage oder deren Beeidigung\nverweigern. Ebenso ist die Vorführung eines nicht erschienenen Zeugen\nanzuordnen."},{"nr":"3","text":"Über das Ersuchen nach Absatz 2 entscheidet ein Beschwerdesenat\ndes Bundespatentgerichts in der Besetzung mit drei rechtskundigen\nMitgliedern. Die Entscheidung ergeht durch Beschluß."}],"url":"https://www.gesetze-im-internet.de/markeng/__95.html"},{"id":"norm:§95a","type":"norm","label":"§ 95a MarkenG","titel":"Elektronische Verfahrensführung, Verordnungsermächtigung","nummer":"95a","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 7 - Gemeinsame Vorschriften","absaetze":[{"nr":"1","text":"Soweit in Verfahren vor dem Deutschen Patent- und Markenamt für\nAnmeldungen, Anträge oder sonstige Handlungen die Schriftform\nvorgesehen ist, gelten die Regelungen des § 130a Absatz 1, 2 Satz 1,\nAbsatz 5 und 6 der Zivilprozessordnung entsprechend."},{"nr":"2","text":"Die Prozessakten des Bundespatentgerichts und des\nBundesgerichtshofs können elektronisch geführt werden. Die\nVorschriften der Zivilprozessordnung über elektronische Dokumente, die\nelektronische Akte und die elektronische Verfahrensführung im Übrigen\ngelten entsprechend, soweit sich aus diesem Gesetz nichts anderes\nergibt."},{"nr":"3","text":"Das Bundesministerium der Justiz und für Verbraucherschutz\nbestimmt durch Rechtsverordnung ohne Zustimmung des Bundesrates\n\n1. den Zeitpunkt, von dem an elektronische Dokumente bei dem Deutschen\n Patent- und Markenamt und den Gerichten eingereicht werden können, die\n für die Bearbeitung der Dokumente geeignete Form, ob eine\n elektronische Signatur zu verwenden ist und wie diese Signatur\n beschaffen ist;\n\n2. den Zeitpunkt, von dem an die Prozessakten nach Absatz 2 elektronisch\n geführt werden können, sowie die hierfür geltenden organisatorisch-\n technischen Rahmenbedingungen für die Bildung, Führung und\n Aufbewahrung der elektronischen Prozessakten."}],"url":"https://www.gesetze-im-internet.de/markeng/__95a.html"},{"id":"norm:§96","type":"norm","label":"§ 96 MarkenG","titel":"Inlandsvertreter","nummer":"96","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 7 - Gemeinsame Vorschriften","absaetze":[{"nr":"1","text":"Wer im Inland weder einen Wohnsitz, Sitz noch Niederlassung hat,\nkann an einem in diesem Gesetz geregelten Verfahren vor dem Deutschen\nPatent- und Markenamt oder dem Bundespatentgericht nur teilnehmen und\ndie Rechte aus einer Marke nur geltend machen, wenn er einen\nRechtsanwalt oder Patentanwalt als Vertreter bestellt hat, der zur\nVertretung im Verfahren vor dem Deutschen Patent- und Markenamt, dem\nBundespatentgericht und in bürgerlichen Streitigkeiten, die diese\nMarke betreffen, sowie zur Stellung von Strafanträgen befugt und\nbevollmächtigt ist."},{"nr":"2","text":"Der Ort, an dem ein nach Absatz 1 bestellter Vertreter seinen\nGeschäftsraum hat, gilt im Sinne des § 23 der Zivilprozessordnung als\nder Ort, an dem sich der Vermögensgegenstand befindet. Fehlt ein\nsolcher Geschäftsraum, so ist der Ort maßgebend, an dem der Vertreter\nim Inland seinen Wohnsitz, und in Ermangelung eines solchen der Ort,\nan dem das Deutsche Patent- und Markenamt seinen Sitz hat."},{"nr":"3","text":"Die rechtsgeschäftliche Beendigung der Bestellung eines Vertreters\nnach Absatz 1 wird erst wirksam, wenn sowohl diese Beendigung als auch\ndie Bestellung eines anderen Vertreters gegenüber dem Deutsche Patent-\nund Markenamt oder dem Bundespatentgericht angezeigt wird."}],"url":"https://www.gesetze-im-internet.de/markeng/__96.html"},{"id":"norm:§96a","type":"norm","label":"§ 96a MarkenG","titel":"Rechtsschutz bei überlangen Gerichtsverfahren","nummer":"96a","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 7 - Gemeinsame Vorschriften","absaetze":[{"nr":null,"text":"Die Vorschriften des Siebzehnten Titels des\nGerichtsverfassungsgesetzes sind auf Verfahren vor dem\nBundespatentgericht und dem Bundesgerichtshof entsprechend anzuwenden."}],"url":"https://www.gesetze-im-internet.de/markeng/__96a.html"},{"id":"norm:§97","type":"norm","label":"§ 97 MarkenG","titel":"Kollektivmarken","nummer":"97","teil":"Teil 4 - Kollektivmarken","abschnitt":null,"absaetze":[{"nr":"1","text":"Als Kollektivmarken können alle als Marke schutzfähigen Zeichen im\nSinne des § 3 eingetragen werden, die geeignet sind, die Waren oder\nDienstleistungen der Mitglieder des Inhabers der Kollektivmarke von\ndenjenigen anderer Unternehmen nach ihrer betrieblichen oder\ngeographischen Herkunft, ihrer Art, ihrer Qualität oder ihren\nsonstigen Eigenschaften zu unterscheiden. Eine Kollektivmarke muss bei\nder Anmeldung als solche bezeichnet werden."},{"nr":"2","text":"Auf Kollektivmarken sind die Vorschriften dieses Gesetzes\nanzuwenden, soweit in diesem Teil nicht etwas anderes bestimmt ist."}],"url":"https://www.gesetze-im-internet.de/markeng/__97.html"},{"id":"norm:§98","type":"norm","label":"§ 98 MarkenG","titel":"Inhaberschaft","nummer":"98","teil":"Teil 4 - Kollektivmarken","abschnitt":null,"absaetze":[{"nr":null,"text":"Inhaber von angemeldeten oder eingetragenen Kollektivmarken können nur\nVerbände von Herstellern, Erzeugern, Dienstleistungsunternehmern oder\nHändlern sein, einschließlich der Dachverbände und Spitzenverbände,\nderen Mitglieder selbst Verbände sind, die die Fähigkeit haben, im\neigenen Namen Träger von Rechten und Pflichten zu sein, Verträge zu\nschließen oder andere Rechtshandlungen vorzunehmen und vor Gericht zu\nklagen und verklagt zu werden. Diesen Verbänden sind die juristischen\nPersonen des öffentlichen Rechts gleichgestellt."}],"url":"https://www.gesetze-im-internet.de/markeng/__98.html"},{"id":"norm:§99","type":"norm","label":"§ 99 MarkenG","titel":"Eintragbarkeit von geographischen Herkunftsangaben als Kollektivmarken","nummer":"99","teil":"Teil 4 - Kollektivmarken","abschnitt":null,"absaetze":[{"nr":null,"text":"Abweichend von § 8 Abs. 2 Nr. 2 können Kollektivmarken ausschließlich\naus Zeichen oder Angaben bestehen, die im Verkehr zur Bezeichnung der\ngeographischen Herkunft der Waren oder der Dienstleistungen dienen\nkönnen."}],"url":"https://www.gesetze-im-internet.de/markeng/__99.html"},{"id":"norm:§100","type":"norm","label":"§ 100 MarkenG","titel":"Schranken des Schutzes, Benutzung","nummer":"100","teil":"Teil 4 - Kollektivmarken","abschnitt":null,"absaetze":[{"nr":"1","text":"Zusätzlich zu den Schutzschranken, die sich aus § 23 ergeben,\ngewährt die Eintragung einer geographischen Herkunftsangabe als\nKollektivmarke ihrem Inhaber nicht das Recht, einem Dritten zu\nuntersagen, solche Angaben im geschäftlichen Verkehr zu benutzen,\nsofern die Benutzung den guten Sitten entspricht und nicht gegen § 127\nverstößt. Insbesondere kann eine solche Marke einem Dritten, der zur\nBenutzung einer geografischen Bezeichnung berechtigt ist, nicht\nentgegengehalten werden."},{"nr":"2","text":"Die ernsthafte Benutzung einer Kollektivmarke durch mindestens\neine hierzu befugte Person oder durch den Inhaber der Kollektivmarke\ngilt als Benutzung im Sinne des § 26."}],"url":"https://www.gesetze-im-internet.de/markeng/__100.html"},{"id":"norm:§101","type":"norm","label":"§ 101 MarkenG","titel":"Klagebefugnis, Schadensersatz","nummer":"101","teil":"Teil 4 - Kollektivmarken","abschnitt":null,"absaetze":[{"nr":"1","text":"Soweit in der Kollektivmarkensatzung nichts anderes bestimmt ist,\nkann eine zur Benutzung der Kollektivmarke berechtigte Person Klage\nwegen Verletzung einer Kollektivmarke nur mit Zustimmung ihres\nInhabers erheben."},{"nr":"2","text":"Der Inhaber der Kollektivmarke kann auch Ersatz des Schadens\nverlangen, der den zur Benutzung der Kollektivmarke berechtigten\nPersonen aus der unbefugten Benutzung der Kollektivmarke oder eines\nähnlichen Zeichens entstanden ist."}],"url":"https://www.gesetze-im-internet.de/markeng/__101.html"},{"id":"norm:§102","type":"norm","label":"§ 102 MarkenG","titel":"Kollektivmarkensatzung","nummer":"102","teil":"Teil 4 - Kollektivmarken","abschnitt":null,"absaetze":[{"nr":"1","text":"Der Anmeldung der Kollektivmarke muß eine Kollektivmarkensatzung\nbeigefügt sein."},{"nr":"2","text":"Die Kollektivmarkensatzung muß mindestens enthalten:\n\n1. Namen und Sitz des Verbandes,\n\n2. Zweck und Vertretung des Verbandes,\n\n3. Voraussetzungen für die Mitgliedschaft,\n\n4. Angaben über den Kreis der zur Benutzung der Kollektivmarke befugten\n Personen,\n\n5. die Bedingungen für die Benutzung der Kollektivmarke und\n\n6. Angaben über die Rechte und Pflichten der Beteiligten im Falle von\n Verletzungen der Kollektivmarke."},{"nr":"3","text":"Besteht die Kollektivmarke aus einer geographischen\nHerkunftsangabe, muß die Satzung vorsehen, daß jede Person, deren\nWaren oder Dienstleistungen aus dem entsprechenden geographischen\nGebiet stammen und den in der Kollektivmarkensatzung enthaltenen\nBedingungen für die Benutzung der Kollektivmarke entsprechen, Mitglied\ndes Verbandes werden kann und in den Kreis der zur Benutzung der\nKollektivmarke befugten Personen aufzunehmen ist."},{"nr":"4","text":"Die Kollektivmarkensatzung wird im Register eingetragen."},{"nr":"5","text":"Die Einsicht in die Kollektivmarkensatzung steht jeder Person\nfrei."}],"url":"https://www.gesetze-im-internet.de/markeng/__102.html"},{"id":"norm:§103","type":"norm","label":"§ 103 MarkenG","titel":"Prüfung der Anmeldung","nummer":"103","teil":"Teil 4 - Kollektivmarken","abschnitt":null,"absaetze":[{"nr":"1","text":"Die Anmeldung einer Kollektivmarke wird außer nach § 37 auch dann\nzurückgewiesen, wenn sie nicht den Voraussetzungen der §§ 97, 98 oder\n102 entspricht oder wenn die Kollektivmarkensatzung gegen die\nöffentliche Ordnung oder die guten Sitten verstößt."},{"nr":"2","text":"Die Anmeldung einer Kollektivmarke wird außerdem zurückgewiesen,\nwenn die Gefahr besteht, dass das Publikum über den Charakter oder die\nBedeutung der Marke irregeführt wird, insbesondere wenn diese Marke\nden Eindruck erwecken kann, als wäre sie etwas anderes als eine\nKollektivmarke."},{"nr":"3","text":"Die Anmeldung einer Kollektivmarke wird nicht zurückgewiesen, wenn\nder Anmelder die Kollektivmarkensatzung so ändert, dass die\nZurückweisungsgründe der Absätze 1 und 2 nicht mehr bestehen."}],"url":"https://www.gesetze-im-internet.de/markeng/__103.html"},{"id":"norm:§104","type":"norm","label":"§ 104 MarkenG","titel":"Änderung der Kollektivmarkensatzung","nummer":"104","teil":"Teil 4 - Kollektivmarken","abschnitt":null,"absaetze":[{"nr":"1","text":"Der Inhaber der Kollektivmarke hat dem Deutschen Patent- und\nMarkenamt jede Änderung der Kollektivmarkensatzung mitzuteilen."},{"nr":"2","text":"Im Falle einer Änderung der Kollektivmarkensatzung sind die §§ 102\nund 103 entsprechend anzuwenden."},{"nr":"3","text":"Für die Zwecke dieses Gesetzes wird die Änderung der\nKollektivmarkensatzung erst ab dem Zeitpunkt wirksam, zu dem die\nÄnderung im Register eingetragen ist."},{"nr":"4","text":"Schriftliche Bemerkungen Dritter gemäß § 37 Absatz 6 Satz 2 können\nauch in Bezug auf geänderte Kollektivmarkensatzungen eingereicht\nwerden."}],"url":"https://www.gesetze-im-internet.de/markeng/__104.html"},{"id":"norm:§105","type":"norm","label":"§ 105 MarkenG","titel":"Verfall","nummer":"105","teil":"Teil 4 - Kollektivmarken","abschnitt":null,"absaetze":[{"nr":"1","text":"Die Eintragung einer Kollektivmarke wird außer aus den in § 49\ngenannten Verfallsgründen auf Antrag für verfallen erklärt und\ngelöscht,\n\n1. wenn der Inhaber der Kollektivmarke nicht mehr besteht,\n\n2. wenn der Inhaber der Kollektivmarke keine geeigneten Maßnahmen trifft,\n um zu verhindern, daß die Kollektivmarke mißbräuchlich in einer den\n Verbandszwecken oder der Kollektivmarkensatzung widersprechenden Weise\n benutzt wird,\n\n3. wenn die Art, in der die Marke von berechtigten Personen benutzt\n worden ist, bewirkt hat, dass die Gefahr besteht, dass das Publikum im\n Sinne von § 103 Absatz 2 irregeführt wird, oder\n\n4. wenn eine Änderung der Kollektivmarkensatzung entgegen § 104 Abs. 2 in\n das Register eingetragen worden ist, es sei denn, daß der Inhaber der\n Kollektivmarke die Markensatzung erneut so ändert, daß der\n Löschungsgrund nicht mehr besteht."},{"nr":"2","text":"Als eine mißbräuchliche Benutzung im Sinne des Absatzes 1 Nr. 2\nist es insbesondere anzusehen, wenn die Benutzung der Kollektivmarke\ndurch andere als die zur Benutzung befugten Personen geeignet ist, das\nPublikum zu täuschen."},{"nr":"3","text":"Der Antrag auf Erklärung des Verfalls nach Absatz 1 ist beim\nDeutschen Patent- und Markenamt zu stellen. Das Verfahren richtet sich\nnach § 53."}],"url":"https://www.gesetze-im-internet.de/markeng/__105.html"},{"id":"norm:§106","type":"norm","label":"§ 106 MarkenG","titel":"Nichtigkeit wegen absoluter Schutzhindernisse","nummer":"106","teil":"Teil 4 - Kollektivmarken","abschnitt":null,"absaetze":[{"nr":"1","text":"Die Eintragung einer Kollektivmarke wird außer aus den in § 50\ngenannten Nichtigkeitsgründen auf Antrag für nichtig erklärt und\ngelöscht, wenn sie entgegen § 103 eingetragen worden ist. Betrifft der\nNichtigkeitsgrund die Kollektivmarkensatzung, so wird die Eintragung\nnicht für nichtig erklärt und gelöscht, wenn der Inhaber der\nKollektivmarke die Kollektivmarkensatzung so ändert, dass der\nNichtigkeitsgrund nicht mehr besteht."},{"nr":"2","text":"Der Antrag auf Erklärung der Nichtigkeit nach Absatz 1 ist beim\nDeutschen Patent- und Markenamt zu stellen. Das Verfahren richtet sich\nnach § 53."}],"url":"https://www.gesetze-im-internet.de/markeng/__106.html"},{"id":"norm:§106a","type":"norm","label":"§ 106a MarkenG","titel":"Gewährleistungsmarken","nummer":"106a","teil":"Teil 5 - Gewährleistungsmarken","abschnitt":null,"absaetze":[{"nr":"1","text":"Der Inhaber der Gewährleistungsmarke gewährleistet für die Waren\nund Dienstleistungen, für die sie angemeldet wird, das Vorliegen einer\noder mehrerer der folgenden Eigenschaften:\n\n1. das Material,\n\n2. die Art und Weise der Herstellung der Waren oder der Erbringung der\n Dienstleistungen,\n\n3. die Qualität, die Genauigkeit oder andere Eigenschaften mit Ausnahme\n der geografischen Herkunft.\n\nDie Marke muss geeignet sein, Waren und Dienstleistungen, für die die\nGewährleistung besteht, von solchen Waren und Dienstleistungen zu\nunterscheiden, für die keine derartige Gewährleistung besteht. Eine\nGewährleistungsmarke muss bei der Anmeldung als solche bezeichnet\nwerden."},{"nr":"2","text":"Auf Gewährleistungsmarken sind die Vorschriften dieses Gesetzes\nanzuwenden, soweit in diesem Teil nicht etwas anderes bestimmt ist."}],"url":"https://www.gesetze-im-internet.de/markeng/__106a.html"},{"id":"norm:§106b","type":"norm","label":"§ 106b MarkenG","titel":"Inhaberschaft und ernsthafte Benutzung","nummer":"106b","teil":"Teil 5 - Gewährleistungsmarken","abschnitt":null,"absaetze":[{"nr":"1","text":"Inhaber von angemeldeten oder eingetragenen Gewährleistungsmarken\nkann jede natürliche oder juristische Person einschließlich\nEinrichtungen, Behörden und juristischer Personen des öffentlichen\nRechts sein, sofern sie keine Tätigkeit ausübt, die die Lieferung von\nWaren oder Dienstleistungen, für die eine Gewährleistung besteht,\numfasst."},{"nr":"2","text":"Die ernsthafte Benutzung einer Gewährleistungsmarke durch\nmindestens eine hierzu befugte Person gilt als Benutzung im Sinne des\n§ 26."}],"url":"https://www.gesetze-im-internet.de/markeng/__106b.html"},{"id":"norm:§106c","type":"norm","label":"§ 106c MarkenG","titel":"Klagebefugnis; Schadensersatz","nummer":"106c","teil":"Teil 5 - Gewährleistungsmarken","abschnitt":null,"absaetze":[{"nr":"1","text":"Soweit in der Gewährleistungsmarkensatzung nichts anderes bestimmt\nist, kann eine zur Benutzung der Gewährleistungsmarke berechtigte\nPerson Klage wegen Verletzung der Gewährleistungsmarke nur erheben,\nwenn der Inhaber der Gewährleistungsmarke dem zustimmt."},{"nr":"2","text":"Der Inhaber der Gewährleistungsmarke kann auch Ersatz des Schadens\nverlangen, der den zur Benutzung der Gewährleistungsmarke berechtigten\nPersonen aus der unbefugten Benutzung der Gewährleistungsmarke oder\neines ähnlichen Zeichens entstanden ist."}],"url":"https://www.gesetze-im-internet.de/markeng/__106c.html"},{"id":"norm:§106d","type":"norm","label":"§ 106d MarkenG","titel":"Gewährleistungsmarkensatzung","nummer":"106d","teil":"Teil 5 - Gewährleistungsmarken","abschnitt":null,"absaetze":[{"nr":"1","text":"Der Anmeldung der Gewährleistungsmarke muss eine\nGewährleistungsmarkensatzung beigefügt sein."},{"nr":"2","text":"Die Gewährleistungsmarkensatzung muss mindestens enthalten:\n\n1. Name des Inhabers der Gewährleistungsmarke,\n\n2. eine Erklärung des Inhabers der Gewährleistungsmarke, selbst keine\n Tätigkeit auszuüben, die die Lieferung von Waren oder\n Dienstleistungen, für die eine Gewährleistung übernommen wird,\n umfasst,\n\n3. eine Darstellung der Gewährleistungsmarke,\n\n4. die Angabe der Waren und Dienstleistungen, für die eine Gewährleistung\n bestehen soll,\n\n5. Angaben darüber, welche Eigenschaften der Waren oder Dienstleistungen\n von der Gewährleistung umfasst werden,\n\n6. die Bedingungen für die Benutzung der Gewährleistungsmarke,\n insbesondere die Bedingungen für Sanktionen,\n\n7. Angaben über die zur Benutzung der Gewährleistungsmarke befugten\n Personen,\n\n8. Angaben über die Art und Weise, in der der Inhaber der\n Gewährleistungsmarke die von der Gewährleistung umfassten\n Eigenschaften zu prüfen und die Benutzung der Marke zu überwachen hat,\n\n9. Angaben über die Rechte und Pflichten der Beteiligten im Fall von\n Verletzungen der Gewährleistungsmarke."},{"nr":"3","text":"Die Gewährleistungsmarkensatzung wird im Register eingetragen."},{"nr":"4","text":"Die Einsichtnahme in die Gewährleistungsmarkensatzung steht jeder\nPerson frei."}],"url":"https://www.gesetze-im-internet.de/markeng/__106d.html"},{"id":"norm:§106e","type":"norm","label":"§ 106e MarkenG","titel":"Prüfung der Anmeldung","nummer":"106e","teil":"Teil 5 - Gewährleistungsmarken","abschnitt":null,"absaetze":[{"nr":"1","text":"Die Anmeldung einer Gewährleistungsmarke wird außer nach § 37 auch\nzurückgewiesen, wenn sie nicht den Voraussetzungen der §§ 106a, 106b\nAbsatz 1 oder § 106d entspricht oder wenn die\nGewährleistungsmarkensatzung gegen die öffentliche Ordnung oder die\nguten Sitten verstößt."},{"nr":"2","text":"Die Anmeldung einer Gewährleistungsmarke wird außerdem\nzurückgewiesen, wenn die Gefahr besteht, dass das Publikum über den\nCharakter oder die Bedeutung der Marke irregeführt wird, insbesondere\nwenn diese Marke den Eindruck erwecken kann, als wäre sie etwas\nanderes als eine Gewährleistungsmarke."},{"nr":"3","text":"Die Anmeldung wird nicht zurückgewiesen, wenn der Anmelder die\nGewährleistungsmarkensatzung so ändert, dass die Zurückweisungsgründe\nder Absätze 1 und 2 nicht mehr bestehen."}],"url":"https://www.gesetze-im-internet.de/markeng/__106e.html"},{"id":"norm:§106f","type":"norm","label":"§ 106f MarkenG","titel":"Änderung der Gewährleistungsmarkensatzung","nummer":"106f","teil":"Teil 5 - Gewährleistungsmarken","abschnitt":null,"absaetze":[{"nr":"1","text":"Der Inhaber der Gewährleistungsmarke hat dem Deutschen Patent- und\nMarkenamt jede Änderung der Gewährleistungsmarkensatzung mitzuteilen."},{"nr":"2","text":"Im Fall einer Änderung der Gewährleistungsmarkensatzung sind die\n§§ 106d und 106e entsprechend anzuwenden."},{"nr":"3","text":"Für die Zwecke dieses Gesetzes wird die Änderung der\nGewährleistungsmarkensatzung erst ab dem Zeitpunkt wirksam, zu dem die\nÄnderung ins Register eingetragen worden ist."},{"nr":"4","text":"Schriftliche Bemerkungen Dritter gemäß § 37 Absatz 6 Satz 2 können\nauch in Bezug auf geänderte Gewährleistungsmarkensatzungen eingereicht\nwerden."}],"url":"https://www.gesetze-im-internet.de/markeng/__106f.html"},{"id":"norm:§106g","type":"norm","label":"§ 106g MarkenG","titel":"Verfall","nummer":"106g","teil":"Teil 5 - Gewährleistungsmarken","abschnitt":null,"absaetze":[{"nr":"1","text":"Die Eintragung einer Gewährleistungsmarke wird außer aus den in §\n49 genannten Verfallsgründen auf Antrag auch in den folgenden Fällen\nfür verfallen erklärt und gelöscht:\n\n1. wenn der Inhaber der Gewährleistungsmarke die Erfordernisse des § 106b\n nicht mehr erfüllt,\n\n2. wenn der Inhaber der Gewährleistungsmarke keine geeigneten Maßnahmen\n trifft, um zu verhindern, dass die Gewährleistungsmarke missbräuchlich\n in einer der Gewährleistungsmarkensatzung widersprechenden Weise\n benutzt wird,\n\n3. wenn die Gewährleistungsmarke von berechtigten Personen so benutzt\n worden ist, dass die Gefahr besteht, dass das Publikum nach § 106e\n Absatz 2 irregeführt wird, oder\n\n4. wenn eine Änderung der Gewährleistungsmarkensatzung entgegen § 106f\n Absatz 2 gemäß § 106d Absatz 3 in das Register eingetragen worden ist,\n es sei denn, dass der Inhaber der Gewährleistungsmarke die\n Gewährleistungsmarkensatzung erneut so ändert, dass der Verfallsgrund\n nicht mehr besteht."},{"nr":"2","text":"Als eine missbräuchliche Benutzung im Sinne des Absatzes 1 Nummer\n2 ist es insbesondere anzusehen, wenn die Benutzung der\nGewährleistungsmarke durch andere als die zur Benutzung befugten\nPersonen geeignet ist, das Publikum zu täuschen."},{"nr":"3","text":"Der Antrag auf Erklärung des Verfalls nach Absatz 1 ist beim\nDeutschen Patent- und Markenamt zu stellen. Das Verfahren richtet sich\nnach § 53."}],"url":"https://www.gesetze-im-internet.de/markeng/__106g.html"},{"id":"norm:§106h","type":"norm","label":"§ 106h MarkenG","titel":"Nichtigkeit wegen absoluter Schutzhindernisse","nummer":"106h","teil":"Teil 5 - Gewährleistungsmarken","abschnitt":null,"absaetze":[{"nr":"1","text":"Die Eintragung einer Gewährleistungsmarke wird außer aus den in §\n50 genannten Nichtigkeitsgründen auf Antrag auch für nichtig erklärt\nund gelöscht, wenn sie entgegen § 106e nicht zurückgewiesen und\neingetragen worden ist. Betrifft der Nichtigkeitsgrund die\nGewährleistungsmarkensatzung, so wird die Eintragung nicht für nichtig\nerklärt und gelöscht, wenn der Inhaber der Gewährleistungsmarke die\nGewährleistungsmarkensatzung so ändert, dass der Nichtigkeitsgrund\nnicht mehr besteht."},{"nr":"2","text":"Der Antrag auf Erklärung der Nichtigkeit nach Absatz 1 ist beim\nDeutschen Patent- und Markenamt zu stellen. Das Verfahren richtet sich\nnach § 53."}],"url":"https://www.gesetze-im-internet.de/markeng/__106h.html"},{"id":"norm:§107","type":"norm","label":"§ 107 MarkenG","titel":"Entsprechende Anwendung der Vorschriften dieses Gesetzes; Sprache","nummer":"107","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 1 - Schutz von Marken nach dem Madrider Markenabkommen","absaetze":[{"nr":"1","text":"Die Vorschriften dieses Gesetzes sind auf internationale\nRegistrierungen von Marken nach der Stockholmer Fassung vom 14. Juli\n1967 des Madrider Abkommens vom 14. April 1891 über die internationale\nRegistrierung von Marken (BGBl. 1970 II S. 293, 418) (Madrider\nMarkenabkommen), die durch Vermittlung des Deutschen Patent- und\nMarkenamts vorgenommen werden oder deren Schutz sich auf das Gebiet\nder Bundesrepublik Deutschland erstreckt, entsprechend anzuwenden,\nsoweit in diesem Abschnitt oder im Madrider Markenabkommen nichts\nanderes bestimmt ist."},{"nr":"2","text":"Sämtliche Anträge sowie sonstige Mitteilungen im Verfahren der\ninternationalen Registrierung und das Verzeichnis der Waren und\nDienstleistungen sind nach Wahl des Antragstellers entweder in\nfranzösischer oder in englischer Sprache einzureichen."}],"url":"https://www.gesetze-im-internet.de/markeng/__107.html"},{"id":"norm:§108","type":"norm","label":"§ 108 MarkenG","titel":"Antrag auf internationale Registrierung","nummer":"108","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 1 - Schutz von Marken nach dem Madrider Markenabkommen","absaetze":[{"nr":"1","text":"Der Antrag auf internationale Registrierung einer in das Register\neingetragenen Marke nach Artikel 3 des Madrider Markenabkommens ist\nbeim Deutschen Patent- und Markenamt zu stellen."},{"nr":"2","text":"Wird der Antrag auf internationale Registrierung vor der\nEintragung der Marke in das Register gestellt, so gilt er als am Tag\nder Eintragung der Marke zugegangen."},{"nr":"3","text":"Mit dem Antrag ist das Verzeichnis der Waren und Dienstleistungen,\nnach Klassen geordnet in der Reihenfolge der internationalen\nKlassifikation von Waren und Dienstleistungen, einzureichen."}],"url":"https://www.gesetze-im-internet.de/markeng/__108.html"},{"id":"norm:§109","type":"norm","label":"§ 109 MarkenG","titel":"Gebühren","nummer":"109","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 1 - Schutz von Marken nach dem Madrider Markenabkommen","absaetze":[{"nr":"1","text":"Ist der Antrag auf internationale Registrierung vor der Eintragung\nder Marke in das Register gestellt worden, so wird die nationale\nGebühr für das Verfahren auf internationale Registrierung am Tage der\nEintragung fällig."},{"nr":"2","text":"Die nationale Gebühr nach dem Patentkostengesetz für die\ninternationale Registrierung ist innerhalb eines Monats nach\nFälligkeit, die sich nach § 3 Abs. 1 des Patentkostengesetzes oder\nnach Absatz 1 richtet, zu zahlen."}],"url":"https://www.gesetze-im-internet.de/markeng/__109.html"},{"id":"norm:§110","type":"norm","label":"§ 110 MarkenG","titel":"Eintragung im Register","nummer":"110","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 1 - Schutz von Marken nach dem Madrider Markenabkommen","absaetze":[{"nr":null,"text":"Der Tag und die Nummer der internationalen Registrierung einer im\nRegister eingetragenen Marke sind in das Register einzutragen."}],"url":"https://www.gesetze-im-internet.de/markeng/__110.html"},{"id":"norm:§111","type":"norm","label":"§ 111 MarkenG","titel":"Nachträgliche Schutzerstreckung","nummer":"111","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 1 - Schutz von Marken nach dem Madrider Markenabkommen","absaetze":[{"nr":"1","text":"Beim Deutschen Patent- und Markenamt kann ein Antrag auf\nnachträgliche Schutzerstreckung einer international registrierten\nMarke nach Artikel\n3(hoch)ter Abs. 2 des Madrider Markenabkommens gestellt werden."},{"nr":"2","text":"Die nationale Gebühr nach dem Patentkostengesetz für die\nnachträgliche Schutzerstreckung ist innerhalb eines Monats nach\nFälligkeit (§ 3 Abs. 1 des Patentkostengesetzes) zu zahlen."}],"url":"https://www.gesetze-im-internet.de/markeng/__111.html"},{"id":"norm:§112","type":"norm","label":"§ 112 MarkenG","titel":"Wirkung der internationalen Registrierung","nummer":"112","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 1 - Schutz von Marken nach dem Madrider Markenabkommen","absaetze":[{"nr":"1","text":"Die internationale Registrierung einer Marke, deren Schutz nach\nArtikel\n3ter des Madrider Markenabkommens auf das Gebiet der Bundesrepublik\nDeutschland erstreckt worden ist, hat dieselbe Wirkung, wie wenn die\nMarke am Tag der internationalen Registrierung nach Artikel 3 Abs. 4\ndes Madrider Markenabkommens oder am Tag der Eintragung der\nnachträglichen Schutzerstreckung nach Artikel\n3ter Abs. 2 des Madrider Markenabkommens zur Eintragung in das vom\nDeutschen Patent- und Markenamt geführte Register angemeldet und\neingetragen worden wäre."},{"nr":"2","text":"Die in Absatz 1 bezeichnete Wirkung gilt als nicht eingetreten,\nwenn der international registrierten Marke nach den §§ 113 bis 115 der\nSchutz verweigert wird."}],"url":"https://www.gesetze-im-internet.de/markeng/__112.html"},{"id":"norm:§113","type":"norm","label":"§ 113 MarkenG","titel":"Prüfung auf absolute Schutzhindernisse","nummer":"113","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 1 - Schutz von Marken nach dem Madrider Markenabkommen","absaetze":[{"nr":"1","text":"International registrierte Marken werden in gleicher Weise wie zur\nEintragung in das Register angemeldete Marken nach § 37 auf absolute\nSchutzhindernisse geprüft. § 37 Abs. 2 ist nicht anzuwenden."},{"nr":"2","text":"An die Stelle der Zurückweisung der Anmeldung (§ 37 Abs. 1) tritt\ndie Verweigerung des Schutzes."}],"url":"https://www.gesetze-im-internet.de/markeng/__113.html"},{"id":"norm:§114","type":"norm","label":"§ 114 MarkenG","titel":"Widerspruch gegen eine international registrierte Marke","nummer":"114","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 1 - Schutz von Marken nach dem Madrider Markenabkommen","absaetze":[{"nr":"1","text":"An die Stelle der Veröffentlichung der Eintragung (§ 41 Absatz 2)\ntritt für international registrierte Marken die Veröffentlichung in\ndem vom Internationalen Büro der Weltorganisation für geistiges\nEigentum herausgegebenen Veröffentlichungsblatt."},{"nr":"2","text":"Die Frist zur Erhebung des Widerspruchs (§ 42 Abs. 1) gegen die\nSchutzgewährung für international registrierte Marken beginnt mit dem\nersten Tag des Monats, der dem Monat folgt, der als Ausgabemonat des\nHeftes des Veröffentlichungsblattes angegeben ist, in dem die\nVeröffentlichung der international registrierten Marke enthalten ist."},{"nr":"3","text":"An die Stelle der Löschung der Eintragung (§ 43 Abs. 2) tritt die\nVerweigerung des Schutzes."}],"url":"https://www.gesetze-im-internet.de/markeng/__114.html"},{"id":"norm:§115","type":"norm","label":"§ 115 MarkenG","titel":"Schutzentziehung","nummer":"115","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 1 - Schutz von Marken nach dem Madrider Markenabkommen","absaetze":[{"nr":"1","text":"An die Stelle des Antrags auf Erklärung des Verfalls einer Marke\n(§ 49) oder der Nichtigkeit wegen absoluter Schutzhindernisse (§ 50)\noder älterer Rechte (§ 51) tritt für international registrierte Marken\nder Antrag auf Schutzentziehung."},{"nr":"2","text":"Wird ein Antrag auf Schutzentziehung nach § 49 Absatz 1 wegen\nmangelnder Benutzung gestellt, so tritt an die Stelle des Tages, ab\ndem kein Widerspruch mehr gegen die Marke möglich ist,\n\n1. der Tag, an dem das Schutzerstreckungsverfahren abgeschlossen wurde,\n oder\n\n2. der Tag, an dem die Frist des Artikels 5 Absatz 2 des Madrider\n Markenabkommens abgelaufen ist, sofern bis zu diesem Zeitpunkt dem\n Internationalen Büro der Weltorganisation für geistiges Eigentum weder\n eine Mitteilung über die Schutzbewilligung noch eine Mitteilung über\n die vorläufige Schutzverweigerung zugegangen ist."}],"url":"https://www.gesetze-im-internet.de/markeng/__115.html"},{"id":"norm:§116","type":"norm","label":"§ 116 MarkenG","titel":"Widerspruch aufgrund einer international registrierten Marke und Antrag auf Erklärung der Nichtigkeit aufgrund einer international registrierten Marke","nummer":"116","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 1 - Schutz von Marken nach dem Madrider Markenabkommen","absaetze":[{"nr":"1","text":"Wird aufgrund einer international registrierten Marke Widerspruch\ngegen die Eintragung einer Marke erhoben, so ist § 43 Absatz 1 mit der\nMaßgabe anzuwenden, dass an die Stelle des Zeitpunkts, ab dem kein\nWiderspruch mehr gegen die Marke möglich war, einer der in § 115\nAbsatz 2 bezeichneten Tage tritt."},{"nr":"2","text":"Wird aufgrund einer international registrierten Marke ein Antrag\nauf Erklärung der Nichtigkeit einer eingetragenen Marke nach § 51\ngestellt, so ist § 53 Absatz 5 mit der Maßgabe anzuwenden, dass an die\nStelle des Zeitpunkts, ab dem kein Widerspruch mehr gegen die Marke\nmöglich war, einer der in § 115 Absatz 2 bezeichneten Tage tritt."}],"url":"https://www.gesetze-im-internet.de/markeng/__116.html"},{"id":"norm:§117","type":"norm","label":"§ 117 MarkenG","titel":"Ausschluß von Ansprüchen wegen mangelnder Benutzung","nummer":"117","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 1 - Schutz von Marken nach dem Madrider Markenabkommen","absaetze":[{"nr":null,"text":"Werden Ansprüche im Sinne der §§ 14 und 18 bis 19c wegen der\nVerletzung einer international registrierten Marke geltend gemacht, so\nist § 25 mit der Maßgabe anzuwenden, daß an die Stelle des Zeitpunkts,\nab dem kein Widerspruch mehr gegen die Marke möglich war, einer der in\n§ 115 Absatz 2 bezeichneten Tage tritt."}],"url":"https://www.gesetze-im-internet.de/markeng/__117.html"},{"id":"norm:§118","type":"norm","label":"§ 118 MarkenG","titel":"Zustimmung bei Übertragungen international registrierter Marken","nummer":"118","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 1 - Schutz von Marken nach dem Madrider Markenabkommen","absaetze":[{"nr":null,"text":"Das Deutsche Patent- und Markenamt erteilt dem Internationalen Büro\nder Weltorganisation für geistiges Eigentum die nach Artikel\n9bis Abs. 1 des Madrider Markenabkommens erforderliche Zustimmung im\nFalle der Übertragung einer international registrierten Marke ohne\nRücksicht darauf, ob die Marke für den neuen Inhaber der international\nregistrierten Marke in das vom Deutschen Patent- und Markenamt\ngeführte Register eingetragen ist."}],"url":"https://www.gesetze-im-internet.de/markeng/__118.html"},{"id":"norm:§119","type":"norm","label":"§ 119 MarkenG","titel":"Anwendung der Vorschriften dieses Gesetzes; Sprachen","nummer":"119","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 2 - Schutz von Marken nach dem Protokoll zum Madrider Markenabkommen","absaetze":[{"nr":"1","text":"Die Vorschriften dieses Gesetzes sind auf internationale\nRegistrierungen von Marken nach dem Madrider Protokoll vom 27. Juni\n1989 zum Madrider Abkommen über die internationale Registrierung von\nMarken (Protokoll zum Madrider Markenabkommen), die durch Vermittlung\ndes Deutschen Patent- und Markenamts vorgenommen werden oder deren\nSchutz sich auf das Gebiet der Bundesrepublik Deutschland erstreckt,\nentsprechend anzuwenden, soweit in diesem Abschnitt oder im Protokoll\nzum Madrider Markenabkommen nichts anderes bestimmt ist."},{"nr":"2","text":"Sämtliche Anträge sowie sonstige Mitteilungen im Verfahren der\ninternationalen Registrierung und das Verzeichnis der Waren und\nDienstleistungen sind nach Wahl des Antragstellers in französischer\noder in englischer Sprache einzureichen."}],"url":"https://www.gesetze-im-internet.de/markeng/__119.html"},{"id":"norm:§120","type":"norm","label":"§ 120 MarkenG","titel":"Antrag auf internationale Registrierung","nummer":"120","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 2 - Schutz von Marken nach dem Protokoll zum Madrider Markenabkommen","absaetze":[{"nr":"1","text":"Der Antrag auf internationale Registrierung einer zur Eintragung\nin das Register angemeldeten Marke oder einer in das Register\neingetragenen Marke nach Artikel 3 des Protokolls zum Madrider\nMarkenabkommen ist beim Deutschen Patent- und Markenamt zu stellen.\nDer Antrag kann auch schon vor der Eintragung der Marke gestellt\nwerden, wenn die internationale Registrierung auf der Grundlage einer\nim Register eingetragenen Marke vorgenommen werden soll."},{"nr":"2","text":"Soll die internationale Registrierung auf der Grundlage einer im\nRegister eingetragenen Marke vorgenommen werden und wird der Antrag\nauf internationale Registrierung vor der Eintragung der Marke in das\nRegister gestellt, so gilt er als am Tag der Eintragung der Marke\nzugegangen."},{"nr":"3","text":"Mit dem Antrag ist das Verzeichnis der Waren und Dienstleistungen,\nnach Klassen geordnet in der Reihenfolge der internationalen\nKlassifikation von Waren und Dienstleistungen, einzureichen."}],"url":"https://www.gesetze-im-internet.de/markeng/__120.html"},{"id":"norm:§121","type":"norm","label":"§ 121 MarkenG","titel":"Gebühren","nummer":"121","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 2 - Schutz von Marken nach dem Protokoll zum Madrider Markenabkommen","absaetze":[{"nr":"1","text":"Soll die internationale Registrierung nach dem Madrider\nMarkenabkommen und nach dem Protokoll zum Madrider Markenabkommen auf\nder Grundlage einer im Register eingetragenen Marke vorgenommen werden\nund ist der Antrag auf internationale Registrierung vor der Eintragung\nder Marke in das Register gestellt worden, so wird die nationale\nGebühr nach dem Patentkostengesetz für die internationale\nRegistrierung am Tag der Eintragung fällig."},{"nr":"2","text":"Die nationale Gebühr nach dem Patentkostengesetz für die\ninternationale Registrierung ist innerhalb eines Monats nach\nFälligkeit, die sich nach § 3 Abs. 1 des Patentkostengesetzes oder\nnach Absatz 1 richtet, zu zahlen."}],"url":"https://www.gesetze-im-internet.de/markeng/__121.html"},{"id":"norm:§122","type":"norm","label":"§ 122 MarkenG","titel":"Vermerk in den Akten, Eintragung im Register","nummer":"122","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 2 - Schutz von Marken nach dem Protokoll zum Madrider Markenabkommen","absaetze":[{"nr":"1","text":"Ist die internationale Registrierung auf der Grundlage einer zur\nEintragung in das Register angemeldeten Marke vorgenommen worden, so\nsind der Tag und die Nummer der internationalen Registrierung in den\nAkten der angemeldeten Marke zu vermerken."},{"nr":"2","text":"Der Tag und die Nummer der internationalen Registrierung, die auf\nder Grundlage einer im Register eingetragenen Marke vorgenommen worden\nist, ist in das Register einzutragen. Satz 1 ist auch anzuwenden, wenn\ndie internationale Registrierung auf der Grundlage einer zur\nEintragung in das Register angemeldeten Marke vorgenommen worden ist\nund die Anmeldung zur Eintragung geführt hat."}],"url":"https://www.gesetze-im-internet.de/markeng/__122.html"},{"id":"norm:§123","type":"norm","label":"§ 123 MarkenG","titel":"Nachträgliche Schutzerstreckung","nummer":"123","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 2 - Schutz von Marken nach dem Protokoll zum Madrider Markenabkommen","absaetze":[{"nr":"1","text":"Der Antrag auf nachträgliche Schutzerstreckung einer international\nregistrierten Marke nach Artikel\n3(hoch)ter Abs. 2 des Protokolls zum Madrider Markenabkommen kann beim\nDeutschen Patent- und Markenamt gestellt werden. Soll die\nnachträgliche Schutzerstreckung auf der Grundlage einer im Register\neingetragenen Marke vorgenommen werden und wird der Antrag schon vor\nder Eintragung der Marke gestellt, so gilt er als am Tag der\nEintragung zugegangen."},{"nr":"2","text":"Die nachträgliche Schutzerstreckung auf der Grundlage einer im\nRegister eingetragenen Marke kann sowohl nach dem Madrider\nMarkenabkommen als auch nach dem Protokoll zum Madrider Markenabkommen\nvorgenommen werden."},{"nr":"3","text":"Die nationale Gebühr nach dem Patentkostengesetz für die\nnachträgliche Schutzerstreckung ist innerhalb eines Monats nach\nFälligkeit (§ 3 Abs. 1 des Patentkostengesetzes) zu zahlen."}],"url":"https://www.gesetze-im-internet.de/markeng/__123.html"},{"id":"norm:§124","type":"norm","label":"§ 124 MarkenG","titel":"Entsprechende Anwendung der Vorschriften über die Wirkung der nach dem Madrider Markenabkommen international registrierten Marken","nummer":"124","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 2 - Schutz von Marken nach dem Protokoll zum Madrider Markenabkommen","absaetze":[{"nr":null,"text":"Die §§ 112 bis 117 sind auf international registrierte Marken, deren\nSchutz nach Artikel\n3ter des Protokolls zum Madrider Markenabkommen auf das Gebiet der\nBundesrepublik Deutschland erstreckt worden ist, entsprechend\nanzuwenden mit der Maßgabe, daß an die Stelle der in den §§ 112 bis\n117 aufgeführten Vorschriften des Madrider Markenabkommens die\nentsprechenden Vorschriften des Protokolls zum Madrider Markenabkommen\ntreten."}],"url":"https://www.gesetze-im-internet.de/markeng/__124.html"},{"id":"norm:§125","type":"norm","label":"§ 125 MarkenG","titel":"Umwandlung einer internationalen Registrierung","nummer":"125","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 2 - Schutz von Marken nach dem Protokoll zum Madrider Markenabkommen","absaetze":[{"nr":"1","text":"Wird beim Deutschen Patent- und Markenamt ein Antrag nach Artikel\n9quinquies des Protokolls zum Madrider Markenabkommen auf Umwandlung\neiner im internationalen Register gemäß Artikel 6 Abs. 4 des\nProtokolls zum Madrider Markenabkommen gelöschten Marke gestellt und\ngeht der Antrag mit den erforderlichen Angaben dem Deutschen Patent-\nund Markenamt vor Ablauf einer Frist von drei Monaten nach dem Tag der\nLöschung der Marke im internationalen Register zu, so ist der Tag der\ninternationalen Registrierung dieser Marke nach Artikel 3 Abs. 4 des\nProtokolls zum Madrider Markenabkommen oder der Tag der Eintragung der\nSchutzerstreckung nach Artikel\n3ter Abs. 2 des Protokolls zum Madrider Markenabkommen, gegebenenfalls\nmit der für die internationale Registrierung in Anspruch genommenen\nPriorität, für die Bestimmung des Zeitrangs im Sinne des § 6 Abs. 2\nmaßgebend."},{"nr":"2","text":"Der Antragsteller hat eine Bescheinigung des Internationalen Büros\nder Weltorganisation für geistiges Eigentum einzureichen, aus der sich\ndie Marke und die Waren oder Dienstleistungen ergeben, für die sich\nder Schutz der internationalen Registrierung vor ihrer Löschung im\ninternationalen Register auf die Bundesrepublik Deutschland erstreckt\nhatte."},{"nr":"3","text":"Der Antragsteller hat außerdem eine deutsche Übersetzung des\nVerzeichnisses der Waren oder Dienstleistungen, für die die Eintragung\nbeantragt wird, einzureichen."},{"nr":"4","text":"Der Antrag auf Umwandlung wird im übrigen wie eine Anmeldung zur\nEintragung einer Marke behandelt. War jedoch am Tag der Löschung der\nMarke im internationalen Register die Frist nach Artikel 5 Abs. 2 des\nProtokolls zum Madrider Markenabkommen zur Verweigerung des Schutzes\nbereits abgelaufen und war an diesem Tag kein Verfahren zur\nSchutzverweigerung oder zur nachträglichen Schutzentziehung anhängig,\nso wird die Marke ohne vorherige Prüfung unmittelbar nach § 41 Absatz\n1 in das Register eingetragen. Gegen die Eintragung einer Marke nach\nSatz 2 kann Widerspruch nicht erhoben werden."}],"url":"https://www.gesetze-im-internet.de/markeng/__125.html"},{"id":"norm:§125a","type":"norm","label":"§ 125a MarkenG","titel":"(weggefallen)","nummer":"125a","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 3 - Unionsmarken","absaetze":[],"url":"https://www.gesetze-im-internet.de/markeng/__125a.html"},{"id":"norm:§125b","type":"norm","label":"§ 125b MarkenG","titel":"Anwendung der Vorschriften dieses Gesetzes","nummer":"125b","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 3 - Unionsmarken","absaetze":[{"nr":null,"text":"Die Vorschriften dieses Gesetzes sind auf Marken, die nach der\nVerordnung (EG) Nr. 207/2009 des Rates vom 26. Februar 2009 über die\nUnionsmarke (ABl. L 78 vom 24.3.2009, S. 1), die durch die Verordnung\n(EU) 2015/2424 (ABl. L 341 vom 24.12.2015, S. 21; L 71 vom 16.3.2016,\nS. 322; L 110 vom 26.4.2016, S. 4) geändert worden ist\n(Unionsmarkenverordnung), angemeldet oder eingetragen worden sind, in\nden Fällen der Nummern 1 und 2 unmittelbar und in den Fällen der\nNummern 3 bis 6 entsprechend wie folgt anzuwenden:\n\n1. für die Anwendung des § 9 (relative Schutzhindernisse) sind\n angemeldete oder eingetragene Unionsmarken mit älterem Zeitrang den\n nach diesem Gesetz angemeldeten oder eingetragenen Marken mit älterem\n Zeitrang gleichgestellt, jedoch mit der Maßgabe, dass an die Stelle\n der Bekanntheit im Inland gemäß § 9 Absatz 1 Nummer 3 die Bekanntheit\n in der Union gemäß Artikel 9 Absatz 2 Buchstabe c der\n Unionsmarkenverordnung tritt;\n\n2. dem Inhaber einer eingetragenen Unionsmarke stehen neben den\n Ansprüchen nach den Artikeln 9 bis 11 der Unionsmarkenverordnung die\n Ansprüche auf Schadensersatz (§ 14 Absatz 7 und 8), Vernichtung und\n Rückruf (§ 18), Auskunft (§ 19), Vorlage und Besichtigung (§ 19a),\n Sicherung von Schadensersatzansprüchen (§ 19b) und\n Urteilsbekanntmachung (§ 19c) zu;\n\n3. werden Ansprüche aus einer eingetragenen Unionsmarke gegen die\n Benutzung einer nach diesem Gesetz eingetragenen Marke mit jüngerem\n Zeitrang geltend gemacht, so ist § 21 Absatz 1 entsprechend\n anzuwenden;\n\n4. wird ein Widerspruch gegen die Eintragung einer Marke (§ 42) auf eine\n eingetragene Unionsmarke mit älterem Zeitrang gestützt, so ist § 43\n Absatz 1 mit der Maßgabe entsprechend anzuwenden, dass an die Stelle\n der Benutzung der Marke mit älterem Zeitrang gemäß § 26 die Benutzung\n der Unionsmarke mit älterem Zeitrang nach Artikel 18 der\n Unionsmarkenverordnung tritt;\n\n5. wird ein Antrag auf Erklärung des Verfalls oder der Nichtigkeit der\n Eintragung einer Marke (§ 53 Absatz 1) auf eine eingetragene\n Unionsmarke mit älterem Zeitrang gestützt, so ist\n\n a) § 51 Absatz 2 Satz 1 entsprechend anzuwenden;\n\n b) § 53 Absatz 6 mit der Maßgabe entsprechend anzuwenden, dass an die\n Stelle der Benutzung der Marke mit älterem Zeitrang gemäß § 26 die\n Benutzung der Unionsmarke nach Artikel 18 der Unionsmarkenverordnung\n tritt;\n\n6. Anträge auf Beschlagnahme bei der Einfuhr und Ausfuhr können von\n Inhabern eingetragener Unionsmarken in gleicher Weise gestellt werden\n wie von Inhabern von nach diesem Gesetz eingetragenen Marken; die §§\n 146 bis 149 sind entsprechend anzuwenden."}],"url":"https://www.gesetze-im-internet.de/markeng/__125b.html"},{"id":"norm:§125c","type":"norm","label":"§ 125c MarkenG","titel":"Nachträgliche Feststellung der Ungültigkeit einer Marke","nummer":"125c","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 3 - Unionsmarken","absaetze":[{"nr":"1","text":"Ist für eine angemeldete oder eingetragene Unionsmarke der\nZeitrang einer im Register des Deutschen Patent- und Markenamts\neingetragenen Marke nach Artikel 39 oder Artikel 40 der\nUnionsmarkenverordnung in Anspruch genommen worden und ist die im\nRegister des Deutschen Patent- und Markenamts eingetragene Marke wegen\nNichtverlängerung der Schutzdauer nach § 47 Absatz 6 oder wegen\nVerzichts nach § 48 Absatz 1 gelöscht worden, so kann auf Antrag\nnachträglich die Ungültigkeit dieser Marke wegen Verfalls oder wegen\nNichtigkeit festgestellt werden. In diesem Fall entfaltet der Zeitrang\nkeine Wirkung."},{"nr":"2","text":"Die Feststellung der Ungültigkeit erfolgt unter den gleichen\nVoraussetzungen wie eine Erklärung des Verfalls oder der Nichtigkeit.\nJedoch kann die Ungültigkeit einer Marke wegen Verfalls nach § 49 Abs.\n1 nur festgestellt werden, wenn die Voraussetzungen für die Erklärung\ndes Verfalls nach dieser Vorschrift auch schon in dem Zeitpunkt\ngegeben waren, in dem die Marke wegen Nichtverlängerung der\nSchutzdauer oder wegen Verzichts gelöscht worden ist."},{"nr":"3","text":"Das Verfahren zur Feststellung der Ungültigkeit richtet sich nach\nden Vorschriften, die für das Verfalls- und Nichtigkeitsverfahren\neiner eingetragenen Marke gelten, mit der Maßgabe, daß an die Stelle\nder Erklärung des Verfalls oder der Nichtigkeit der Marke die\nFeststellung ihrer Ungültigkeit tritt."}],"url":"https://www.gesetze-im-internet.de/markeng/__125c.html"},{"id":"norm:§125d","type":"norm","label":"§ 125d MarkenG","titel":"Umwandlung von Unionsmarken","nummer":"125d","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 3 - Unionsmarken","absaetze":[{"nr":"1","text":"Ist dem Deutschen Patent- und Markenamt ein Antrag auf Umwandlung\neiner angemeldeten oder eingetragenen Unionsmarke nach Artikel 139\nAbsatz 3 der Unionsmarkenverordnung übermittelt worden, so sind die\nGebühr und die Klassengebühren nach dem Patentkostengesetz für das\nUmwandlungsverfahren mit Zugang des Umwandlungsantrages beim Deutschen\nPatent- und Markenamt fällig."},{"nr":"2","text":"Betrifft der Umwandlungsantrag eine Marke, die noch nicht als\nUnionsmarke eingetragen war, so wird der Umwandlungsantrag wie die\nAnmeldung einer Marke zur Eintragung in das Register des Deutschen\nPatent- und Markenamts behandelt mit der Maßgabe, dass an die Stelle\ndes Anmeldetages nach § 33 Absatz 1 der Anmeldetag der Unionsmarke\nnach Artikel 32 der Unionsmarkenverordnung oder der Tag einer für die\nUnionsmarke in Anspruch genommenen Priorität tritt. War für die\nAnmeldung der Unionsmarke der Zeitrang einer im Register des Deutschen\nPatent- und Markenamts eingetragenen Marke nach Artikel 39 der\nUnionsmarkenverordnung in Anspruch genommen worden, so tritt dieser\nZeitrang an die Stelle des nach Satz 1 maßgeblichen Tages."},{"nr":"3","text":"Betrifft der Umwandlungsantrag einer Marke, die bereits als\nUnionsmarke eingetragen war, so trägt das Deutsche Patent- und\nMarkenamt die Marke ohne weitere Prüfung unmittelbar nach § 41 Absatz\n1 unter Wahrung ihres ursprünglichen Zeitrangs in das Register ein.\nGegen die Eintragung kann Widerspruch nicht erhoben werden."},{"nr":"4","text":"Im übrigen sind auf Umwandlungsanträge die Vorschriften dieses\nGesetzes für die Anmeldung von Marken anzuwenden."}],"url":"https://www.gesetze-im-internet.de/markeng/__125d.html"},{"id":"norm:§125e","type":"norm","label":"§ 125e MarkenG","titel":"Unionsmarkenstreitsachen; Unionsmarkengerichte","nummer":"125e","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 3 - Unionsmarken","absaetze":[{"nr":"1","text":"Für alle Klagen, für die nach der Unionsmarkenverordnung die\nUnionsmarkengerichte im Sinne des Artikels 123 Absatz 1 der\nUnionsmarkenverordnung zuständig sind (Unionsmarkenstreitsachen), sind\nals Unionsmarkengerichte im ersten Rechtszug die Landgerichte ohne\nRücksicht auf den Streitwert ausschließlich zuständig."},{"nr":"2","text":"Unionsmarkengericht zweiter Instanz ist das Oberlandesgericht, in\ndessen Bezirk das Unionsmarkengericht erster Instanz seinen Sitz hat."},{"nr":"3","text":"Die Landesregierungen werden ermächtigt, durch Rechtsverordnung\ndie Unionsmarkenstreitsachen für die Bezirke mehrerer\nUnionsmarkengerichte einem dieser Gerichte zuzuweisen. Die\nLandesregierungen können diese Ermächtigung durch Rechtsverordnung auf\ndie Landesjustizverwaltungen übertragen."},{"nr":"4","text":"Die Länder können durch Vereinbarung den Unionsmarkengerichten\neines Landes obliegende Aufgaben ganz oder teilweise dem zuständigen\nUnionsmarkengericht eines anderen Landes übertragen."},{"nr":"5","text":"Auf Verfahren vor den Unionsmarkengerichten ist § 140 Absatz 4 und\n§ 142 entsprechend anzuwenden."}],"url":"https://www.gesetze-im-internet.de/markeng/__125e.html"},{"id":"norm:§125f","type":"norm","label":"§ 125f MarkenG","titel":"Unterrichtung der Kommission","nummer":"125f","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 3 - Unionsmarken","absaetze":[{"nr":null,"text":"Das Bundesministerium der Justiz und für Verbraucherschutz teilt der\nKommission der Europäischen Gemeinschaften die Unionsmarkengerichte\nerster und zweiter Instanz sowie jede Änderung der Anzahl, der\nBezeichnung oder der örtlichen Zuständigkeit der Unionsmarkengerichte\nerster und zweiter Instanz mit."}],"url":"https://www.gesetze-im-internet.de/markeng/__125f.html"},{"id":"norm:§125g","type":"norm","label":"§ 125g MarkenG","titel":"Örtliche Zuständigkeit der Unionsmarkengerichte","nummer":"125g","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 3 - Unionsmarken","absaetze":[{"nr":null,"text":"Sind nach Artikel 125 der Unionsmarkenverordnung deutsche\nUnionsmarkengerichte international zuständig, so gelten für die\nörtliche Zuständigkeit dieser Gerichte die Vorschriften entsprechend,\ndie anzuwenden wären, wenn es sich um eine beim Deutschen Patent- und\nMarkenamt eingereichte Anmeldung einer Marke oder um eine im Register\ndes Deutschen Patent- und Markenamts eingetragene Marke handelte. Ist\neine Zuständigkeit danach nicht begründet, so ist das Gericht örtlich\nzuständig, bei dem der Kläger seinen allgemeinen Gerichtsstand hat."}],"url":"https://www.gesetze-im-internet.de/markeng/__125g.html"},{"id":"norm:§125h","type":"norm","label":"§ 125h MarkenG","titel":"Insolvenzverfahren","nummer":"125h","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 3 - Unionsmarken","absaetze":[{"nr":"1","text":"Ist dem Insolvenzgericht bekannt, daß zur Insolvenzmasse eine\nangemeldete oder eingetragene Unionsmarke gehört, so ersucht es das\nAmt der Europäischen Union für geistiges Eigentum im unmittelbaren\nVerkehr,\n\n1. die Eröffnung des Verfahrens und, soweit nicht bereits darin\n enthalten, die Anordnung einer Verfügungsbeschränkung,\n\n2. die Freigabe oder die Veräußerung der Unionsmarke oder der Anmeldung\n der Unionsmarke,\n\n3. die rechtskräftige Einstellung des Verfahrens und\n\n4. die rechtskräftige Aufhebung des Verfahrens, im Falle einer\n Überwachung des Schuldners jedoch erst nach Beendigung dieser\n Überwachung, und einer Verfügungsbeschränkung\n\nin das Register für Unionsmarken oder, wenn es sich um eine Anmeldung\nhandelt, in die Akten der Anmeldung einzutragen."},{"nr":"2","text":"Die Eintragung in das Register für Unionsmarken oder in die Akten\nder Anmeldung kann auch vom Insolvenzverwalter beantragt werden. Im\nFalle der Eigenverwaltung (§ 270 der Insolvenzordnung) tritt der\nSachwalter an die Stelle des Insolvenzverwalters."}],"url":"https://www.gesetze-im-internet.de/markeng/__125h.html"},{"id":"norm:§125i","type":"norm","label":"§ 125i MarkenG","titel":"Erteilung der Vollstreckungsklausel","nummer":"125i","teil":"Teil 6 - Schutz von Marken nach dem Madrider Markenabkommen und nach dem Protokoll zum Madrider Markenabkommen; Unionsmarken","abschnitt":"Abschnitt 3 - Unionsmarken","absaetze":[{"nr":null,"text":"Für die Erteilung der Vollstreckungsklausel nach Artikel 110 Absatz 2\nSatz 3 der Unionsmarkenverordnung ist das Bundespatentgericht\nzuständig. Die vollstreckbare Ausfertigung wird vom Urkundsbeamten der\nGeschäftsstelle des Bundespatentgerichts erteilt."}],"url":"https://www.gesetze-im-internet.de/markeng/__125i.html"},{"id":"norm:§126","type":"norm","label":"§ 126 MarkenG","titel":"Als geographische Herkunftsangaben geschützte Namen, Angaben oder Zeichen","nummer":"126","teil":"Teil 7 - Geographische Herkunftsangaben","abschnitt":"Abschnitt 1 - Schutz geographischer Herkunftsangaben","absaetze":[{"nr":"1","text":"Geographische Herkunftsangaben im Sinne dieses Gesetzes sind die\nNamen von Orten, Gegenden, Gebieten oder Ländern sowie sonstige\nAngaben oder Zeichen, die im geschäftlichen Verkehr zur Kennzeichnung\nder geographischen Herkunft von Waren oder Dienstleistungen benutzt\nwerden."},{"nr":"2","text":"Dem Schutz als geographische Herkunftsangaben sind solche Namen,\nAngaben oder Zeichen im Sinne des Absatzes 1 nicht zugänglich, bei\ndenen es sich um Gattungsbezeichnungen handelt. Als\nGattungsbezeichnungen sind solche Bezeichnungen anzusehen, die zwar\neine Angabe über die geographische Herkunft im Sinne des Absatzes 1\nenthalten oder von einer solchen Angabe abgeleitet sind, die jedoch\nihre ursprüngliche Bedeutung verloren haben und als Namen von Waren\noder Dienstleistungen oder als Bezeichnungen oder Angaben der Art, der\nBeschaffenheit, der Sorte oder sonstiger Eigenschaften oder Merkmale\nvon Waren oder Dienstleistungen dienen."}],"url":"https://www.gesetze-im-internet.de/markeng/__126.html"},{"id":"norm:§127","type":"norm","label":"§ 127 MarkenG","titel":"Schutzinhalt","nummer":"127","teil":"Teil 7 - Geographische Herkunftsangaben","abschnitt":"Abschnitt 1 - Schutz geographischer Herkunftsangaben","absaetze":[{"nr":"1","text":"Geographische Herkunftsangaben dürfen im geschäftlichen Verkehr\nnicht für Waren oder Dienstleistungen benutzt werden, die nicht aus\ndem Ort, der Gegend, dem Gebiet oder dem Land stammen, das durch die\ngeographische Herkunftsangabe bezeichnet wird, wenn bei der Benutzung\nsolcher Namen, Angaben oder Zeichen für Waren oder Dienstleistungen\nanderer Herkunft eine Gefahr der Irreführung über die geographische\nHerkunft besteht."},{"nr":"2","text":"Haben die durch eine geographische Herkunftsangabe\ngekennzeichneten Waren oder Dienstleistungen besondere Eigenschaften\noder eine besondere Qualität, so darf die geographische\nHerkunftsangabe im geschäftlichen Verkehr für die entsprechenden Waren\noder Dienstleistungen dieser Herkunft nur benutzt werden, wenn die\nWaren oder Dienstleistungen diese Eigenschaften oder diese Qualität\naufweisen."},{"nr":"3","text":"Genießt eine geographische Herkunftsangabe einen besonderen Ruf,\nso darf sie im geschäftlichen Verkehr für Waren oder Dienstleistungen\nanderer Herkunft auch dann nicht benutzt werden, wenn eine Gefahr der\nIrreführung über die geographische Herkunft nicht besteht, sofern die\nBenutzung für Waren oder Dienstleistungen anderer Herkunft geeignet\nist, den Ruf der geographischen Herkunftsangabe oder ihre\nUnterscheidungskraft ohne rechtfertigenden Grund in unlauterer Weise\nauszunutzen oder zu beeinträchtigen."},{"nr":"4","text":"Die vorstehenden Absätze finden auch dann Anwendung, wenn Namen,\nAngaben oder Zeichen benutzt werden, die der geschützten\ngeographischen Herkunftsangabe ähnlich sind oder wenn die\ngeographische Herkunftsangabe mit Zusätzen benutzt wird, sofern\n\n1. in den Fällen des Absatzes 1 trotz der Abweichung oder der Zusätze\n eine Gefahr der Irreführung über die geographische Herkunft besteht\n oder\n\n2. in den Fällen des Absatzes 3 trotz der Abweichung oder der Zusätze die\n Eignung zur unlauteren Ausnutzung oder Beeinträchtigung des Rufs oder\n der Unterscheidungskraft der geographischen Herkunftsangabe besteht."}],"url":"https://www.gesetze-im-internet.de/markeng/__127.html"},{"id":"norm:§128","type":"norm","label":"§ 128 MarkenG","titel":"Ansprüche wegen Verletzung","nummer":"128","teil":"Teil 7 - Geographische Herkunftsangaben","abschnitt":"Abschnitt 1 - Schutz geographischer Herkunftsangaben","absaetze":[{"nr":"1","text":"Wer im geschäftlichen Verkehr Namen, Angaben oder Zeichen entgegen\n§ 127 benutzt, kann von den nach § 8 Abs. 3 des Gesetzes gegen den\nunlauteren Wettbewerb zur Geltendmachung von Ansprüchen Berechtigten\nbei Wiederholungsgefahr auf Unterlassung in Anspruch genommen werden.\nDer Anspruch besteht auch dann, wenn eine Zuwiderhandlung droht. Die\n§§ 18, 19, 19a und 19c gelten entsprechend."},{"nr":"2","text":"Wer dem § 127 vorsätzlich oder fahrlässig zuwiderhandelt, ist dem\nberechtigten Nutzer der geographischen Herkunftsangabe zum Ersatz des\ndurch die Zuwiderhandlung entstandenen Schadens verpflichtet. Bei der\nBemessung des Schadensersatzes kann auch der Gewinn, den der Verletzer\ndurch die Verletzung des Rechts erzielt hat, berücksichtigt werden. §\n19b gilt entsprechend."},{"nr":"3","text":"§ 14 Abs. 7 und § 19d gelten entsprechend."}],"url":"https://www.gesetze-im-internet.de/markeng/__128.html"},{"id":"norm:§129","type":"norm","label":"§ 129 MarkenG","titel":"Verjährung","nummer":"129","teil":"Teil 7 - Geographische Herkunftsangaben","abschnitt":"Abschnitt 1 - Schutz geographischer Herkunftsangaben","absaetze":[{"nr":null,"text":"Ansprüche nach § 128 verjähren gemäß § 20."}],"url":"https://www.gesetze-im-internet.de/markeng/__129.html"},{"id":"norm:§130","type":"norm","label":"§ 130 MarkenG","titel":"Verfahren vor dem Deutschen Patent- und Markenamt; nationales Einspruchsverfahren","nummer":"130","teil":"Teil 7 - Geographische Herkunftsangaben","abschnitt":"Abschnitt 2 - Schutz von geographischen Angaben und Ursprungsbezeichnungen gemäß der Verordnung (EU) Nr. 1151/2012","absaetze":[{"nr":"1","text":"Anträge auf Eintragung einer geographischen Angabe oder einer\nUrsprungsbezeichnung in das Register der geschützten\nUrsprungsbezeichnungen und der geschützten geographischen Angaben, das\nvon der Europäischen Kommission nach Artikel 11 der Verordnung (EU)\nNr. 1151/2012 des Europäischen Parlaments und des Rates vom 21.\nNovember 2012 über Qualitätsregelungen für Agrarerzeugnisse und\nLebensmittel (ABl. L 343 vom 14.12.2012, S. 1) in ihrer jeweils\ngeltenden Fassung geführt wird, sind beim Deutschen Patent- und\nMarkenamt einzureichen."},{"nr":"2","text":"Für die in diesem Abschnitt geregelten Verfahren sind die im\nDeutschen Patent- und Markenamt errichteten Markenabteilungen\nzuständig."},{"nr":"3","text":"Bei der Prüfung des Antrags holt das Deutsche Patent- und\nMarkenamt die Stellungnahmen des Bundesministeriums für Ernährung und\nLandwirtschaft, der zuständigen Fachministerien der betroffenen\nLänder, der interessierten öffentlichen Körperschaften sowie der\ninteressierten Verbände und Organisationen der Wirtschaft ein."},{"nr":"4","text":"Das Deutsche Patent- und Markenamt veröffentlicht den Antrag.\nGegen den Antrag kann innerhalb von zwei Monaten seit Veröffentlichung\nvon jeder Person mit einem berechtigten Interesse, die im Gebiet der\nBundesrepublik Deutschland niedergelassen oder ansässig ist, beim\nDeutschen Patent- und Markenamt Einspruch eingelegt werden."},{"nr":"5","text":"Entspricht der Antrag den Anforderungen der Verordnung (EU) Nr.\n1151/2012 und den zu ihrer Durchführung erlassenen Vorschriften,\nstellt das Deutsche Patent- und Markenamt dies durch Beschluss fest.\nAndernfalls wird der Antrag durch Beschluss zurückgewiesen. Das\nDeutsche Patent- und Markenamt veröffentlicht den stattgebenden\nBeschluss. Kommt es zu wesentlichen Änderungen der nach Absatz 4\nveröffentlichten Angaben, so werden diese zusammen mit dem\nstattgebenden Beschluss veröffentlicht. Der Beschluss nach Satz 1 und\nnach Satz 2 ist dem Antragsteller und denjenigen zuzustellen, die\nfristgemäß Einspruch eingelegt haben."},{"nr":"6","text":"Steht rechtskräftig fest, dass der Antrag den Anforderungen der\nVerordnung (EU) Nr. 1151/2012 und den zu ihrer Durchführung erlassenen\nVorschriften entspricht, so unterrichtet das Deutsche Patent- und\nMarkenamt den Antragsteller hierüber und übermittelt den Antrag mit\nden erforderlichen Unterlagen dem Bundesministerium der Justiz und für\nVerbraucherschutz. Ferner veröffentlicht das Deutsche Patent- und\nMarkenamt die Fassung der Spezifikation, auf die sich die positive\nEntscheidung bezieht. Das Bundesministerium der Justiz und für\nVerbraucherschutz übermittelt den Antrag mit den erforderlichen\nUnterlagen an die Europäische Kommission."},{"nr":"7","text":"Sofern die Spezifikation im Eintragungsverfahren bei der\nEuropäischen Kommission geändert worden ist, veröffentlicht das\nDeutsche Patent- und Markenamt die der Eintragung zugrunde liegende\nFassung der Spezifikation."}],"url":"https://www.gesetze-im-internet.de/markeng/__130.html"},{"id":"norm:§131","type":"norm","label":"§ 131 MarkenG","titel":"Zwischenstaatliches Einspruchsverfahren","nummer":"131","teil":"Teil 7 - Geographische Herkunftsangaben","abschnitt":"Abschnitt 2 - Schutz von geographischen Angaben und Ursprungsbezeichnungen gemäß der Verordnung (EU) Nr. 1151/2012","absaetze":[{"nr":"1","text":"Einsprüche nach Artikel 51 Absatz 1 Unterabsatz 2 der Verordnung\n(EU) Nr. 1151/2012 gegen die beabsichtigte Eintragung von\ngeographischen Angaben oder Ursprungsbezeichnungen in das von der\nEuropäischen Kommission geführte Register der geschützten\nUrsprungsbezeichnungen und der geschützten geographischen Angaben sind\nbeim Deutschen Patent- und Markenamt innerhalb von zwei Monaten ab der\nVeröffentlichung einzulegen, die im Amtsblatt der Europäischen Union\nnach Artikel 50 Absatz 2 der Verordnung (EU) Nr. 1151/2012 vorgenommen\nwird."},{"nr":"2","text":"Die Zahlungsfrist für die Einspruchsgebühr richtet sich nach § 6\nAbs. 1 Satz 1 des Patentkostengesetzes. Eine Wiedereinsetzung in die\nEinspruchsfrist und in die Frist zur Zahlung der Einspruchsgebühr ist\nnicht gegeben."}],"url":"https://www.gesetze-im-internet.de/markeng/__131.html"},{"id":"norm:§132","type":"norm","label":"§ 132 MarkenG","titel":"Antrag auf Änderung der Spezifikation, Löschungsverfahren","nummer":"132","teil":"Teil 7 - Geographische Herkunftsangaben","abschnitt":"Abschnitt 2 - Schutz von geographischen Angaben und Ursprungsbezeichnungen gemäß der Verordnung (EU) Nr. 1151/2012","absaetze":[{"nr":"1","text":"Für Anträge auf Änderung der Spezifikation einer geschützten\ngeographischen Angabe oder einer geschützten Ursprungsbezeichnung nach\nArtikel 53 Absatz 2 Satz 1 der Verordnung (EU) Nr. 1151/2012 gelten\ndie §§ 130 und 131 entsprechend."},{"nr":"2","text":"Für Anträge auf Löschung einer geschützten geographischen Angabe\noder einer geschützten Ursprungsbezeichnung nach Artikel 54 Absatz 1\nder Verordnung (EU) Nr. 1151/2012 gelten die §§ 130 und 131\nentsprechend."}],"url":"https://www.gesetze-im-internet.de/markeng/__132.html"},{"id":"norm:§133","type":"norm","label":"§ 133 MarkenG","titel":"Rechtsmittel","nummer":"133","teil":"Teil 7 - Geographische Herkunftsangaben","abschnitt":"Abschnitt 2 - Schutz von geographischen Angaben und Ursprungsbezeichnungen gemäß der Verordnung (EU) Nr. 1151/2012","absaetze":[{"nr":null,"text":"Gegen Entscheidungen, die das Deutsche Patent- und Markenamt nach den\nVorschriften dieses Abschnitts trifft, findet die Beschwerde zum\nBundespatentgericht und die Rechtsbeschwerde zum Bundesgerichtshof\nstatt. Gegen eine Entscheidung nach § 130 Abs. 5 Satz 1 steht die\nBeschwerde denjenigen Personen zu, die gegen den Antrag fristgerecht\nEinspruch eingelegt haben oder die durch den stattgebenden Beschluss\nauf Grund der nach § 130 Abs. 5 Satz 4 veröffentlichten geänderten\nAngaben in ihrem berechtigten Interesse betroffen sind. Im Übrigen\nsind die Vorschriften dieses Gesetzes über das Beschwerdeverfahren vor\ndem Bundespatentgericht (§§ 66 bis 82) und über das\nRechtsbeschwerdeverfahren vor dem Bundesgerichtshof (§§ 83 bis 90)\nentsprechend anzuwenden."}],"url":"https://www.gesetze-im-internet.de/markeng/__133.html"},{"id":"norm:§134","type":"norm","label":"§ 134 MarkenG","titel":"Überwachung","nummer":"134","teil":"Teil 7 - Geographische Herkunftsangaben","abschnitt":"Abschnitt 2 - Schutz von geographischen Angaben und Ursprungsbezeichnungen gemäß der Verordnung (EU) Nr. 1151/2012","absaetze":[{"nr":"1","text":"Die nach der Verordnung (EU) Nr. 1151/2012 und den zu ihrer\nDurchführung erlassenen Vorschriften erforderliche Überwachung und\nKontrolle obliegt den nach Landesrecht zuständigen Stellen."},{"nr":"2","text":"Soweit es zur Überwachung und Kontrolle im Sinn des Absatzes 1\nerforderlich ist, können die Beauftragten der zuständigen Stellen bei\nBetrieben, die Agrarerzeugnisse oder Lebensmittel in Verkehr bringen\noder herstellen (§ 3 Absatz 1 Nummer 1 des Lebensmittel- und\nFuttermittelgesetzbuchs) oder innergemeinschaftlich verbringen,\neinführen oder ausführen, während der Geschäfts- oder Betriebszeit\n\n1. Geschäftsräume und Grundstücke, Verkaufseinrichtungen und\n Transportmittel betreten und dort Besichtigungen vornehmen,\n\n2. Proben gegen Empfangsbescheinigung entnehmen; auf Verlangen des\n Betroffenen ist ein Teil der Probe oder, falls diese unteilbar ist,\n eine zweite Probe amtlich verschlossen und versiegelt zurückzulassen,\n\n3. Geschäftsunterlagen einsehen und prüfen,\n\n4. Auskunft verlangen.\n\nDiese Befugnisse erstrecken sich auch auf Agrarerzeugnisse oder\nLebensmittel, die an öffentlichen Orten, insbesondere auf Märkten,\nPlätzen, Straßen oder im Umherziehen in den Verkehr gebracht werden."},{"nr":"3","text":"Inhaber oder Leiter der Betriebe sind verpflichtet, das Betreten\nder Geschäftsräume und Grundstücke, Verkaufseinrichtungen und\nTransportmittel sowie die dort vorzunehmenden Besichtigungen zu\ngestatten, die zu besichtigenden Agrarerzeugnisse oder Lebensmittel\nselbst oder durch andere so darzulegen, dass die Besichtigung\nordnungsgemäß vorgenommen werden kann, selbst oder durch andere die\nerforderliche Hilfe bei Besichtigungen zu leisten, die Proben\nentnehmen zu lassen, die geschäftlichen Unterlagen vorzulegen, prüfen\nzu lassen und Auskünfte zu erteilen."},{"nr":"4","text":"Erfolgt die Überwachung bei der Einfuhr oder bei der Ausfuhr, so\ngelten die Absätze 2 und 3 entsprechend auch für denjenigen, der die\nAgrarerzeugnisse oder Lebensmittel für den Betriebsinhaber\ninnergemeinschaftlich verbringt, einführt oder ausführt."},{"nr":"5","text":"Der zur Erteilung einer Auskunft Verpflichtete kann die Auskunft\nauf solche Fragen verweigern, deren Beantwortung ihn selbst oder einen\nder in § 383 Abs. 1 Nr. 1 bis 3 der Zivilprozessordnung bezeichneten\nAngehörigen der Gefahr strafrechtlicher Verfolgung oder eines\nVerfahrens nach dem Gesetz über Ordnungswidrigkeiten aussetzen würde."},{"nr":"6","text":"Für Amtshandlungen, die nach Artikel 37 Absatz 1 der Verordnung\n(EU) Nr. 1151/2012 zu Kontrollzwecken vorzunehmen sind, werden\nkostendeckende Gebühren und Auslagen erhoben. Die kostenpflichtigen\nTatbestände werden durch das Landesrecht bestimmt."}],"url":"https://www.gesetze-im-internet.de/markeng/__134.html"},{"id":"norm:§135","type":"norm","label":"§ 135 MarkenG","titel":"Ansprüche wegen Verletzung","nummer":"135","teil":"Teil 7 - Geographische Herkunftsangaben","abschnitt":"Abschnitt 2 - Schutz von geographischen Angaben und Ursprungsbezeichnungen gemäß der Verordnung (EU) Nr. 1151/2012","absaetze":[{"nr":"1","text":"Wer im geschäftlichen Verkehr Handlungen vornimmt, die gegen\nArtikel 13 der Verordnung (EU) Nr. 1151/2012 verstoßen, kann von den\nnach § 8 Abs. 3 des Gesetzes gegen den unlauteren Wettbewerb zur\nGeltendmachung von Ansprüchen Berechtigten bei Wiederholungsgefahr auf\nUnterlassung in Anspruch genommen werden. Der Anspruch besteht auch\ndann, wenn eine Zuwiderhandlung erstmalig droht. Die §§ 18, 19, 19a\nund 19c gelten entsprechend."},{"nr":"2","text":"§ 128 Abs. 2 und 3 gilt entsprechend."}],"url":"https://www.gesetze-im-internet.de/markeng/__135.html"},{"id":"norm:§136","type":"norm","label":"§ 136 MarkenG","titel":"Verjährung","nummer":"136","teil":"Teil 7 - Geographische Herkunftsangaben","abschnitt":"Abschnitt 2 - Schutz von geographischen Angaben und Ursprungsbezeichnungen gemäß der Verordnung (EU) Nr. 1151/2012","absaetze":[{"nr":null,"text":"Die Ansprüche nach § 135 verjähren nach § 20."}],"url":"https://www.gesetze-im-internet.de/markeng/__136.html"},{"id":"norm:§137","type":"norm","label":"§ 137 MarkenG","titel":"Nähere Bestimmungen zum Schutz einzelner geographischer Herkunftsangaben","nummer":"137","teil":"Teil 7 - Geographische Herkunftsangaben","abschnitt":"Abschnitt 3 - Ermächtigungen zum Erlaß von Rechtsverordnungen","absaetze":[{"nr":"1","text":"Das Bundesministerium der Justiz und für Verbraucherschutz wird\nermächtigt, im Einvernehmen mit den Bundesministerien für Wirtschaft\nund Energie und für Ernährung und Landwirtschaft durch\nRechtsverordnung mit Zustimmung des Bundesrates nähere Bestimmungen\nüber einzelne geographische Herkunftsangaben zu treffen."},{"nr":"2","text":"In der Rechtsverordnung können\n\n1. durch Bezugnahme auf politische oder geographische Grenzen das\n Herkunftsgebiet,\n\n2. die Qualität oder sonstige Eigenschaften im Sinne des § 127 Abs. 2\n sowie die dafür maßgeblichen Umstände, wie insbesondere Verfahren oder\n Art und Weise der Erzeugung oder Herstellung der Waren oder der\n Erbringung der Dienstleistungen oder Qualität oder sonstige\n Eigenschaften der verwendeten Ausgangsmaterialien wie deren Herkunft,\n und\n\n3. die Art und Weise der Verwendung der geographischen Herkunftsangabe\n\ngeregelt werden. Bei der Regelung sind die bisherigen lauteren\nPraktiken, Gewo
