bsatz 1 ist innerhalb von sechs Monaten nach\nUnanfechtbarkeit der Entscheidung, mit der die Eintragung gelöscht\nworden ist, zu erheben."},{"nr":"3","text":"Die Eintragung aufgrund einer Entscheidung zugunsten des Inhabers\nder Marke wird unter Wahrung des Zeitrangs der Eintragung vorgenommen."}],"url":"https://www.gesetze-im-internet.de/markeng/__44.html"},{"id":"norm:§45","type":"norm","label":"§ 45 MarkenG","titel":"Berichtigung des Registers und von Veröffentlichungen","nummer":"45","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 2 - Berichtigung, Teilung, Schutzdauer und Verlängerung","absaetze":[{"nr":"1","text":"Eintragungen im Register können auf Antrag oder von Amts wegen zur\nBerichtigung von sprachlichen Fehlern, Schreibfehlern oder sonstigen\noffensichtlichen Unrichtigkeiten geändert werden. War die von der\nBerichtigung betroffene Eintragung veröffentlicht worden, so ist die\nberichtigte Eintragung zu veröffentlichen."},{"nr":"2","text":"Absatz 1 ist entsprechend auf die Berichtigung von\nVeröffentlichungen anzuwenden."}],"url":"https://www.gesetze-im-internet.de/markeng/__45.html"},{"id":"norm:§46","type":"norm","label":"§ 46 MarkenG","titel":"Teilung der Eintragung","nummer":"46","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 2 - Berichtigung, Teilung, Schutzdauer und Verlängerung","absaetze":[{"nr":"1","text":"Der Inhaber einer eingetragenen Marke kann die Eintragung teilen,\nindem er erklärt, daß die Eintragung der Marke für die in der\nTeilungserklärung aufgeführten Waren oder Dienstleistungen als\nabgetrennte Eintragung fortbestehen soll. Für jede Teileintragung\nbleibt der Zeitrang der ursprünglichen Eintragung erhalten."},{"nr":"2","text":"Die Teilung kann erst nach Ablauf der Frist zur Erhebung des\nWiderspruchs erklärt werden. Die Erklärung ist nur zulässig, wenn ein\nim Zeitpunkt ihrer Abgabe anhängiger Widerspruch gegen die Eintragung\nder Marke oder eine in diesem Zeitpunkt anhängige Klage auf Erklärung\ndes Verfalls oder der Nichtigkeit oder ein in diesem Zeitpunkt\ngestellter Antrag auf Erklärung des Verfalls oder der Nichtigkeit der\nMarke sich nach der Teilung nur gegen einen der Teile der\nursprünglichen Eintragung richten würde."},{"nr":"3","text":"Wird die Gebühr nach dem Patentkostengesetz für das\nTeilungsverfahren nicht innerhalb von drei Monaten nach dem Zugang der\nTeilungserklärung gezahlt, so gilt dies als Verzicht auf die\nabgetrennte Eintragung. Die Teilungserklärung kann nicht widerrufen\nwerden."}],"url":"https://www.gesetze-im-internet.de/markeng/__46.html"},{"id":"norm:§47","type":"norm","label":"§ 47 MarkenG","titel":"Schutzdauer und Verlängerung","nummer":"47","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 2 - Berichtigung, Teilung, Schutzdauer und Verlängerung","absaetze":[{"nr":"1","text":"Die Schutzdauer einer eingetragenen Marke beträgt zehn Jahre,\ngerechnet vom Tag der Anmeldung an (§ 33 Absatz 1)."},{"nr":"2","text":"Die Eintragung der Marke wird auf Antrag des Markeninhabers oder\neiner durch Gesetz oder Vertrag hierzu ermächtigten Person um jeweils\nzehn Jahre verlängert, sofern die Verlängerungsgebühr entrichtet\nworden ist."},{"nr":"3","text":"Die Verlängerung der Schutzdauer kann auch dadurch bewirkt werden,\ndass die Verlängerungsgebühr und eine Klassengebühr für jede zu\nverlängernde Klasse ab der vierten Klasse der Klasseneinteilung der\nWaren und Dienstleistungen gezahlt wird. Der Erhalt der Zahlung gilt\nals Antrag des Markeninhabers oder einer ermächtigten Person nach\nAbsatz 2."},{"nr":"4","text":"Beziehen sich die Gebühren nur auf einen Teil der Waren oder\nDienstleistungen, für die die Marke eingetragen ist, so wird die\nSchutzdauer nur für diese Waren oder Dienstleistungen verlängert.\nWerden lediglich die erforderlichen Klassengebühren nicht gezahlt, so\nwird die Schutzdauer, soweit nicht Satz 1 Anwendung findet, nur für\ndie Klassen verlängert, für die die gezahlten Gebühren ausreichen.\nBesteht eine Leitklasse, so wird sie vorrangig berücksichtigt. Im\nÜbrigen werden die Klassen in der Reihenfolge der Klasseneinteilung\nberücksichtigt."},{"nr":"5","text":"Das Deutsche Patent- und Markenamt unterrichtet den Markeninhaber\nmindestens sechs Monate im Voraus über den Ablauf der Schutzdauer. Das\nDeutsche Patent- und Markenamt haftet nicht für eine unterbliebene\nUnterrichtung."},{"nr":"6","text":"Der Antrag auf Verlängerung soll innerhalb eines Zeitraums von\nsechs Monaten vor Ablauf der Schutzdauer eingereicht werden. Der\nAntrag kann noch innerhalb einer Nachfrist von sechs Monaten nach\nAblauf der Schutzdauer eingereicht werden."},{"nr":"7","text":"Die Verlängerung der Schutzdauer wird am Tag nach dem Ablauf der\nvorausgehenden Schutzdauer wirksam. Sie wird in das Register\neingetragen und veröffentlicht."},{"nr":"8","text":"Wird die Schutzdauer nicht verlängert, so wird die Eintragung der\nMarke mit Wirkung zum Ablauf der Schutzdauer gelöscht."}],"url":"https://www.gesetze-im-internet.de/markeng/__47.html"},{"id":"norm:§48","type":"norm","label":"§ 48 MarkenG","titel":"Verzicht","nummer":"48","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 3 - Verzicht; Verfalls- und Nichtigkeitsverfahren","absaetze":[{"nr":"1","text":"Auf Antrag des Inhabers der Marke wird die Eintragung jederzeit\nfür alle oder für einen Teil der Waren oder Dienstleistungen, für die\nsie eingetragen ist, im Register gelöscht."},{"nr":"2","text":"Ist im Register eine Person als Inhaber eines Rechts an der Marke\neingetragen, so wird die Eintragung nur mit Zustimmung dieser Person\ngelöscht."}],"url":"https://www.gesetze-im-internet.de/markeng/__48.html"},{"id":"norm:§49","type":"norm","label":"§ 49 MarkenG","titel":"Verfall","nummer":"49","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 3 - Verzicht; Verfalls- und Nichtigkeitsverfahren","absaetze":[{"nr":"1","text":"Die Eintragung einer Marke wird auf Antrag für verfallen erklärt\nund gelöscht, wenn die Marke nach dem Tag, ab dem kein Widerspruch\nmehr gegen sie möglich ist, innerhalb eines ununterbrochenen Zeitraums\nvon fünf Jahren nicht gemäß § 26 benutzt worden ist. Der Verfall einer\nMarke kann jedoch nicht geltend gemacht werden, wenn nach Ende dieses\nZeitraums und vor Stellung des Antrags auf Erklärung des Verfalls eine\nBenutzung der Marke gemäß § 26 begonnen oder wieder aufgenommen worden\nist. Wird die Benutzung jedoch im Anschluß an einen ununterbrochenen\nZeitraum von fünf Jahren der Nichtbenutzung innerhalb von drei Monaten\nvor der Stellung des Antrags auf Erklärung des Verfalls begonnen oder\nwieder aufgenommen, so bleibt sie unberücksichtigt, sofern die\nVorbereitungen für die erstmalige oder die erneute Benutzung erst\nstattgefunden haben, nachdem der Inhaber der Marke Kenntnis davon\nerhalten hat, daß der Antrag auf Erklärung des Verfalls gestellt\nwerden könnte. Wird der Antrag auf Erklärung des Verfalls nach § 53\nAbs. 1 beim Deutschen Patent- und Markenamt gestellt, so bleibt für\ndie Berechnung der Frist von drei Monaten nach Satz 3 der Antrag beim\nDeutschen Patent- und Markenamt maßgeblich, wenn die Klage auf\nErklärung des Verfalls nach § 55 Abs. 1 innerhalb von drei Monaten\nnach Zustellung der Mitteilung nach § 53 Abs. 4 erhoben wird."},{"nr":"2","text":"Die Eintragung einer Marke wird ferner auf Antrag für verfallen\nerklärt und gelöscht,\n\n1. wenn die Marke infolge des Verhaltens oder der Untätigkeit ihres\n Inhabers im geschäftlichen Verkehr zur gebräuchlichen Bezeichnung der\n Waren oder Dienstleistungen, für die sie eingetragen ist, geworden\n ist;\n\n2. wenn die Marke infolge ihrer Benutzung durch den Inhaber oder mit\n seiner Zustimmung für die Waren oder Dienstleistungen, für die sie\n eingetragen ist, geeignet ist, das Publikum insbesondere über die Art,\n die Beschaffenheit oder die geographische Herkunft dieser Waren oder\n Dienstleistungen zu täuschen oder\n\n3. wenn der Inhaber der Marke nicht mehr die in § 7 genannten\n Voraussetzungen erfüllt."},{"nr":"3","text":"Liegt ein Verfallsgrund nur für einen Teil der Waren oder\nDienstleistungen vor, für die die Marke eingetragen ist, so wird die\nEintragung nur für diese Waren oder Dienstleistungen für verfallen\nerklärt und gelöscht."}],"url":"https://www.gesetze-im-internet.de/markeng/__49.html"},{"id":"norm:§50","type":"norm","label":"§ 50 MarkenG","titel":"Nichtigkeit wegen absoluter Schutzhindernisse","nummer":"50","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 3 - Verzicht; Verfalls- und Nichtigkeitsverfahren","absaetze":[{"nr":"1","text":"Die Eintragung einer Marke wird auf Antrag für nichtig erklärt und\ngelöscht, wenn sie entgegen §§ 3, 7 oder 8 eingetragen worden ist."},{"nr":"2","text":"Ist die Marke entgegen § 3, 7 oder 8 Absatz 2 Nummer 1 bis 13\neingetragen worden, so kann die Eintragung nur für nichtig erklärt und\ngelöscht werden, wenn das Schutzhindernis noch im Zeitpunkt der\nEntscheidung über den Antrag auf Erklärung der Nichtigkeit besteht. §\n8 Absatz 2 Nummer 1, 2 oder 3 findet im Nichtigkeitsverfahren keine\nAnwendung, wenn die Marke sich bis zu dem Antrag auf Erklärung der\nNichtigkeit infolge ihrer Benutzung für die Waren und\nDienstleistungen, für die sie eingetragen worden ist, in den\nbeteiligten Verkehrskreisen durchgesetzt hat. Ist die Marke entgegen §\n8 Absatz 2 Nummer 1, 2 oder 3 eingetragen worden, so kann die\nEintragung nur dann gelöscht werden, wenn der Antrag auf Löschung\ninnerhalb von zehn Jahren seit dem Tag der Eintragung gestellt wird."},{"nr":"3","text":"Die Eintragung einer Marke kann von Amts wegen für nichtig erklärt\nund gelöscht werden, wenn sie entgegen § 8 Abs. 2 Nummer 4 bis 14\neingetragen worden ist und\n\n1. das Nichtigkeitsverfahren innerhalb eines Zeitraums von zwei Jahren\n seit dem Tag der Eintragung eingeleitet wird,\n\n2. das Schutzhindernis gemäß § 8 Abs. 2 Nummer 4 bis 13 auch noch im\n Zeitpunkt der Entscheidung über die Erklärung der Nichtigkeit besteht\n und\n\n3. die Eintragung ersichtlich entgegen den genannten Vorschriften\n vorgenommen worden ist."},{"nr":"4","text":"Liegt ein Nichtigkeitsgrund nur für einen Teil der Waren oder\nDienstleistungen vor, für die die Marke eingetragen ist, so wird die\nEintragung nur für diese Waren oder Dienstleistungen für nichtig\nerklärt und gelöscht."}],"url":"https://www.gesetze-im-internet.de/markeng/__50.html"},{"id":"norm:§51","type":"norm","label":"§ 51 MarkenG","titel":"Nichtigkeit wegen des Bestehens älterer Rechte","nummer":"51","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 3 - Verzicht; Verfalls- und Nichtigkeitsverfahren","absaetze":[{"nr":"1","text":"Die Eintragung einer Marke wird auf Klage gemäß § 55 oder Antrag\ngemäß § 53 für nichtig erklärt und gelöscht, wenn ihr ein Recht im\nSinne der §§ 9 bis 13 mit älterem Zeitrang entgegensteht. Der Antrag\nauf Erklärung der Nichtigkeit kann auch auf mehrere ältere Rechte\ndesselben Inhabers gestützt werden."},{"nr":"2","text":"Die Eintragung kann aufgrund der Eintragung einer Marke mit\nälterem Zeitrang nicht für nichtig erklärt und gelöscht werden, soweit\nder Inhaber der Marke mit älterem Zeitrang die Benutzung der Marke mit\njüngerem Zeitrang für die Waren oder Dienstleistungen, für die sie\neingetragen ist, während eines Zeitraums von fünf aufeinanderfolgenden\nJahren in Kenntnis dieser Benutzung geduldet hat, es sei denn, daß die\nAnmeldung der Marke mit jüngerem Zeitrang bösgläubig vorgenommen\nworden ist. Das gleiche gilt für den Inhaber eines Rechts mit älterem\nZeitrang an einer durch Benutzung erworbenen Marke im Sinne des § 4\nNr. 2, an einer notorisch bekannten Marke im Sinne des § 4 Nr. 3, an\neiner geschäftlichen Bezeichnung im Sinne des § 5 oder an einer\nSortenbezeichnung im Sinne des § 13 Abs. 2 Nr. 4. Die Eintragung einer\nMarke kann ferner nicht für nichtig erklärt und gelöscht werden, wenn\nder Inhaber eines der in den §§ 9 bis 13 genannten Rechte mit älterem\nZeitrang der Eintragung der Marke vor der Stellung des Antrags auf\nErklärung der Nichtigkeit zugestimmt hat."},{"nr":"3","text":"Die Eintragung kann aufgrund einer bekannten Marke oder einer\nbekannten geschäftlichen Bezeichnung mit älterem Zeitrang nicht für\nnichtig erklärt und gelöscht werden, wenn die Marke oder die\ngeschäftliche Bezeichnung an dem für den Zeitrang der Eintragung der\nMarke mit jüngerem Zeitrang maßgeblichen Tag noch nicht im Sinne des §\n9 Abs. 1 Nr. 3, des § 14 Absatz 2 Satz 1 Nummer 3 oder des § 15 Abs. 3\nbekannt war."},{"nr":"4","text":"Die Eintragung kann aufgrund der Eintragung einer Marke mit\nälterem Zeitrang nicht für nichtig erklärt und gelöscht werden, wenn\ndie Eintragung der Marke mit älterem Zeitrang am Anmelde- oder\nPrioritätstag der Marke mit jüngerem Zeitrang aus folgenden Gründen\nhätte für verfallen oder nichtig erklärt und gelöscht werden können:\n\n1. Verfall nach § 49 oder\n\n2. absolute Schutzhindernisse nach § 50.\n\nFür die Prüfung der Verwechslungsgefahr nach § 9 Absatz 1 Nummer 2 ist\nauf die Kennzeichnungskraft der älteren Marke am Anmelde- oder\nPrioritätstag der jüngeren Marke abzustellen."},{"nr":"5","text":"Liegt ein Nichtigkeitsgrund nur für einen Teil der Waren oder\nDienstleistungen vor, für die die Marke eingetragen ist, so wird die\nEintragung nur für diese Waren oder Dienstleistungen für nichtig\nerklärt und gelöscht."}],"url":"https://www.gesetze-im-internet.de/markeng/__51.html"},{"id":"norm:§52","type":"norm","label":"§ 52 MarkenG","titel":"Wirkungen des Verfalls und der Nichtigkeit","nummer":"52","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 3 - Verzicht; Verfalls- und Nichtigkeitsverfahren","absaetze":[{"nr":"1","text":"Die Wirkungen einer eingetragenen Marke gelten in dem Umfang, in\ndem die Marke für verfallen erklärt wird, von dem Zeitpunkt der\nStellung des Antrags (§ 53) oder der Erhebung der Klage (§ 55) auf\nErklärung des Verfalls an als nicht eingetreten. In der Entscheidung\nkann auf Antrag einer Partei ein früherer Zeitpunkt, zu dem einer der\nVerfallsgründe eingetreten ist, festgesetzt werden."},{"nr":"2","text":"Die Wirkungen einer eingetragenen Marke gelten in dem Umfang, in\ndem die Marke für nichtig erklärt worden ist, von Anfang an als nicht\neingetreten."},{"nr":"3","text":"Vorbehaltlich der Vorschriften über den Ersatz des Schadens, der\ndurch fahrlässiges oder vorsätzliches Verhalten des Inhabers einer\nMarke verursacht worden ist, sowie der Vorschriften über\nungerechtfertigte Bereicherung berührt die Löschung der Eintragung\naufgrund Verfalls oder Nichtigkeit der Marke nicht\n\n1. Entscheidungen in Verletzungsverfahren, die vor der Entscheidung über\n den Antrag auf Erklärung des Verfalls oder der Nichtigkeit\n rechtskräftig geworden und vollstreckt worden sind, und\n\n2. vor der Entscheidung über den Antrag auf Erklärung des Verfalls oder\n der Nichtigkeit geschlossene Verträge insoweit, als sie vor dieser\n Entscheidung erfüllt worden sind. Es kann jedoch verlangt werden, daß\n in Erfüllung des Vertrages gezahlte Beträge aus Billigkeitsgründen\n insoweit zurückerstattet werden, wie die Umstände dies rechtfertigen."}],"url":"https://www.gesetze-im-internet.de/markeng/__52.html"},{"id":"norm:§53","type":"norm","label":"§ 53 MarkenG","titel":"Verfalls- und Nichtigkeitsverfahren vor dem Deutschen Patent- und Markenamt","nummer":"53","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 3 - Verzicht; Verfalls- und Nichtigkeitsverfahren","absaetze":[{"nr":"1","text":"Der Antrag auf Erklärung des Verfalls (§ 49) und der Nichtigkeit\nwegen absoluter Schutzhindernisse (§ 50) und älterer Rechte (§ 51) ist\nschriftlich beim Deutschen Patent- und Markenamt zu stellen. Die zur\nBegründung dienenden Tatsachen und Beweismittel sind anzugeben. Für\ndie Sicherheitsleistung gilt § 81 Absatz 6 des Patentgesetzes\nentsprechend. Der Antrag ist unzulässig, soweit über denselben\nStreitgegenstand zwischen den Parteien durch unanfechtbaren Beschluss\noder rechtskräftiges Urteil entschieden wurde. Dies gilt auch, wenn\nüber denselben Streitgegenstand zwischen den Parteien eine Klage nach\n§ 55 rechtshängig ist. § 325 Absatz 1 der Zivilprozessordnung gilt\nentsprechend. Werden zwischen denselben Beteiligten mehrere Anträge\nnach Satz 1 gestellt, so können diese verbunden und kann über diese in\neinem Verfahren durch Beschluss entschieden werden."},{"nr":"2","text":"Der Antrag auf Erklärung des Verfalls und der Nichtigkeit wegen\nabsoluter Schutzhindernisse kann von jeder natürlichen oder\njuristischen Person gestellt werden sowie von jedem Interessenverband\nvon Herstellern, Erzeugern, Dienstleistungsunternehmern, Händlern oder\nVerbrauchern, der am Verfahren beteiligt sein kann."},{"nr":"3","text":"Der Antrag auf Erklärung der Nichtigkeit wegen des Bestehens\nälterer Rechte kann von dem Inhaber der in den §§ 9 bis 13 genannten\nRechte und Personen, die berechtigt sind, Rechte aus einer geschützten\ngeografischen Angabe oder geschützten Ursprungsbezeichnung geltend zu\nmachen, gestellt werden."},{"nr":"4","text":"Wird ein Antrag auf Erklärung des Verfalls oder der Nichtigkeit\ngestellt oder ein Nichtigkeitsverfahren von Amts wegen eingeleitet, so\nstellt das Deutsche Patent- und Markenamt dem Inhaber der\neingetragenen Marke eine Mitteilung hierüber zu und fordert ihn auf,\nsich innerhalb von zwei Monaten nach der Zustellung zu dem Antrag oder\ndem von Amts wegen eingeleiteten Verfahren zu erklären."},{"nr":"5","text":"Widerspricht der Inhaber der Löschung aufgrund Verfalls oder\nNichtigkeit nicht innerhalb der in Absatz 4 genannten Frist, so wird\ndie Nichtigkeit oder der Verfall erklärt und die Eintragung gelöscht.\nWird dem Antrag auf Nichtigkeit fristgemäß widersprochen, so teilt das\nDeutsche Patent- und Markenamt dem Antragsteller den Widerspruch mit.\nWird dem Antrag auf Verfall fristgemäß widersprochen, so stellt das\nDeutsche Patent- und Markenamt dem Antragsteller den Widerspruch zu.\nDas Verfallsverfahren wird nur fortgesetzt, wenn innerhalb eines\nMonats nach Zustellung des Widerspruchs die Gebühr zur\nWeiterverfolgung des Verfallsverfahrens nach dem Patentkostengesetz\ngezahlt wird. Anderenfalls gilt das Verfallsverfahren als\nabgeschlossen."},{"nr":"6","text":"Ist der Antrag auf Erklärung der Nichtigkeit wegen älterer Rechte\nvom Inhaber einer eingetragenen Marke mit älterem Zeitrang erhoben\nworden, so hat er auf Einrede des Antragsgegners nachzuweisen, dass\ndie Marke innerhalb der letzten fünf Jahre vor Antragstellung gemäß §\n26 benutzt worden ist, sofern zu diesem Zeitpunkt seit mindestens fünf\nJahren kein Widerspruch mehr gegen sie möglich war. Wurde Widerspruch\nerhoben, werden die fünf Jahre ab dem Zeitpunkt gerechnet, ab dem die\ndas Widerspruchsverfahren beendende Entscheidung Rechtskraft erlangt\nhat oder der Widerspruch zurückgenommen wurde. Endet der Zeitraum von\nfünf Jahren der Nichtbenutzung nach Stellung des Antrags, so hat der\nAntragsteller auf Einrede des Antragsgegners nachzuweisen, dass die\nMarke innerhalb der letzten fünf Jahre vor der Entscheidung gemäß § 26\nbenutzt worden ist. War die Marke mit älterem Zeitrang am Anmelde-\noder Prioritätstag der Marke mit jüngerem Zeitrang bereits seit\nmindestens fünf Jahren eingetragen, so hat der Antragsteller auf\nEinrede des Antragsgegners ferner nachzuweisen, dass die Eintragung\nder Marke mit älterem Zeitrang an diesem Tag nicht nach § 49 Absatz 1\nfür verfallen hätte erklärt werden können. Bei der Entscheidung werden\nnur die Waren oder Dienstleistungen berücksichtigt, für die die\nBenutzung nachgewiesen worden ist. Der Nachweis kann auch durch eine\neidesstattliche Versicherung erbracht werden."},{"nr":"7","text":"Ist das durch die Eintragung der Marke begründete Recht auf einen\nanderen übertragen worden oder übergegangen, so ist die Entscheidung\nin der Sache auch gegen den Rechtsnachfolger wirksam und\nvollstreckbar. Für die Befugnis des Rechtsnachfolgers, in das\nVerfahren einzutreten, gelten die §§ 66 bis 74 und 76 der\nZivilprozessordnung entsprechend."}],"url":"https://www.gesetze-im-internet.de/markeng/__53.html"},{"id":"norm:§54","type":"norm","label":"§ 54 MarkenG","titel":"Beitritt zum Verfalls- und Nichtigkeitsverfahren","nummer":"54","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 3 - Verzicht; Verfalls- und Nichtigkeitsverfahren","absaetze":[{"nr":"1","text":"Ein Dritter kann einem Verfalls- oder Nichtigkeitsverfahren\nbeitreten, wenn über den Antrag auf Erklärung des Verfalls oder der\nNichtigkeit noch keine unanfechtbare Entscheidung getroffen wurde und\ner glaubhaft machen kann, dass\n\n1. gegen ihn ein Verfahren wegen Verletzung derselben eingetragenen Marke\n anhängig ist oder\n\n2. er aufgefordert wurde, eine behauptete Verletzung derselben\n eingetragenen Marke zu unterlassen.\n\nDer Beitritt kann innerhalb von drei Monaten ab Einleitung des\nVerfahrens nach Satz 1 Nummer 1 oder ab Zugang der\nUnterlassungsaufforderung nach Satz 1 Nummer 2 beantragt werden."},{"nr":"2","text":"Für die Antragstellung gilt § 53 Absatz 1 bis 3 entsprechend.\nErfolgt der Beitritt im Beschwerdeverfahren vor dem\nBundespatentgericht, erhält der Beitretende die Stellung eines\nBeschwerdebeteiligten."}],"url":"https://www.gesetze-im-internet.de/markeng/__54.html"},{"id":"norm:§55","type":"norm","label":"§ 55 MarkenG","titel":"Verfalls- und Nichtigkeitsverfahren vor den ordentlichen Gerichten","nummer":"55","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 3 - Verzicht; Verfalls- und Nichtigkeitsverfahren","absaetze":[{"nr":"1","text":"Die Klage auf Erklärung des Verfalls (§ 49) oder der Nichtigkeit\nwegen Bestehens älterer Rechte (§ 51) ist gegen den als Inhaber der\nMarke Eingetragenen oder seinen Rechtsnachfolger zu richten. Die Klage\nist unzulässig, wenn über denselben Streitgegenstand zwischen den\nParteien\n\n1. bereits gemäß § 53 entschieden wurde,\n\n2. ein Antrag gemäß § 53 beim Deutschen Patent- und Markenamt gestellt\n wurde.\n\n§ 325 Absatz 1 der Zivilprozessordnung gilt entsprechend."},{"nr":"2","text":"Zur Erhebung der Klage sind befugt:\n\n1. in den Fällen des Antrags auf Erklärung des Verfalls jede Person,\n\n2. in den Fällen des Antrags auf Erklärung der Nichtigkeit wegen des\n Bestehens von Rechten mit älterem Zeitrang die Inhaber der in den §§ 9\n bis 13 aufgeführten Rechte,\n\n3. in den Fällen des Antrags auf Erklärung der Nichtigkeit wegen des\n Bestehens einer geographischen Herkunftsangabe mit älterem Zeitrang (§\n 13 Abs. 2 Nr. 5) die nach § 8 Abs. 3 des Gesetzes gegen den unlauteren\n Wettbewerb zur Geltendmachung von Ansprüchen Berechtigten."},{"nr":"3","text":"Ist die Klage auf Erklärung der Nichtigkeit vom Inhaber einer\neingetragenen Marke mit älterem Zeitrang erhoben worden, so hat er auf\nEinrede des Beklagten nachzuweisen, dass die Marke innerhalb der\nletzten fünf Jahre vor Erhebung der Klage gemäß § 26 benutzt worden\nist, sofern zu diesem Zeitpunkt seit mindestens fünf Jahren kein\nWiderspruch mehr gegen sie möglich war. Endet der Zeitraum von fünf\nJahren der Nichtbenutzung nach Erhebung der Klage, so hat der Kläger\nauf Einrede des Beklagten nachzuweisen, daß die Marke innerhalb der\nletzten fünf Jahre vor dem Schluß der mündlichen Verhandlung gemäß §\n26 benutzt worden ist. War die Marke mit älterem Zeitrang am Anmelde-\noder Prioritätstag der jüngeren Marke bereits seit mindestens fünf\nJahren eingetragen, so hat der Kläger auf Einrede des Beklagten ferner\nnachzuweisen, dass die Eintragung der Marke mit älterem Zeitrang an\ndiesem Tag nicht nach § 49 Absatz 1 hätte für verfallen erklärt und\ngelöscht werden können. Bei der Entscheidung werden nur die Waren oder\nDienstleistungen berücksichtigt, für die die Benutzung nachgewiesen\nworden ist."},{"nr":"4","text":"Ist vor oder nach Erhebung der Klage das durch die Eintragung der\nMarke begründete Recht auf einen anderen übertragen worden oder\nübergegangen, so ist die Entscheidung in der Sache selbst auch gegen\nden Rechtsnachfolger wirksam und vollstreckbar. Für die Befugnis des\nRechtsnachfolgers, in den Rechtsstreit einzutreten, gelten die §§ 66\nbis 74 und 76 der Zivilprozeßordnung entsprechend."},{"nr":"5","text":"Das Gericht teilt dem Deutschen Patent- und Markenamt den Tag der\nErhebung der Klage mit. Das Deutsche Patent- und Markenamt vermerkt\nden Tag der Erhebung der Klage im Register. Das Gericht übermittelt\ndem Deutschen Patent- und Markenamt eine Ausfertigung des\nrechtskräftigen Urteils. Das Deutsche Patent- und Markenamt trägt das\nErgebnis des Verfahrens mit dem Datum der Rechtskraft in das Register\nein."}],"url":"https://www.gesetze-im-internet.de/markeng/__55.html"},{"id":"norm:§56","type":"norm","label":"§ 56 MarkenG","titel":"Zuständigkeiten im Deutschen Patent- und Markenamt","nummer":"56","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 4 - Allgemeine Vorschriften für das Verfahren vor dem Deutschen Patent- und Markenamt","absaetze":[{"nr":"1","text":"Im Deutschen Patent- und Markenamt werden zur Durchführung der\nVerfahren in Markenangelegenheiten Markenstellen und Markenabteilungen\ngebildet."},{"nr":"2","text":"Die Markenstellen sind für die Prüfung von angemeldeten Marken und\nfür die Beschlußfassung im Eintragungsverfahren zuständig. Die\nAufgaben einer Markenstelle nimmt ein Mitglied des Deutschen Patent-\nund Markenamts (Prüfer) wahr. Die Aufgaben können auch von einem\nBeamten des gehobenen Dienstes oder von einem vergleichbaren\nAngestellten wahrgenommen werden. Beamte des gehobenen Dienstes und\nvergleichbare Angestellte sind jedoch nicht befugt, eine Beeidigung\nanzuordnen, einen Eid abzunehmen oder ein Ersuchen nach § 95 Abs. 2 an\ndas Bundespatentgericht zu richten."},{"nr":"3","text":"Die Markenabteilungen sind für die Angelegenheiten zuständig, die\nnicht in die Zuständigkeit der Markenstellen fallen. Die Aufgaben\neiner Markenabteilung werden in der Besetzung mit mindestens drei\nMitgliedern des Deutschen Patent- und Markenamts wahrgenommen. Der\nVorsitzende einer Markenabteilung kann alle in die Zuständigkeit der\nMarkenabteilung fallenden Angelegenheiten mit Ausnahme der\nEntscheidung über die Erklärung des Verfalls oder der Nichtigkeit\neiner Marke nach § 53 allein bearbeiten oder diese Angelegenheiten\neinem Angehörigen der Markenabteilung zur Bearbeitung übertragen."}],"url":"https://www.gesetze-im-internet.de/markeng/__56.html"},{"id":"norm:§57","type":"norm","label":"§ 57 MarkenG","titel":"Ausschließung und Ablehnung","nummer":"57","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 4 - Allgemeine Vorschriften für das Verfahren vor dem Deutschen Patent- und Markenamt","absaetze":[{"nr":"1","text":"Für die Ausschließung und Ablehnung der Prüfer und der Mitglieder\nder Markenabteilungen sowie der mit der Wahrnehmung von\nAngelegenheiten, die den Markenstellen oder den Markenabteilungen\nobliegen, betrauten Beamten und Beamtinnen des gehobenen und mittleren\nDienstes oder Angestellten gelten die §§ 41 bis 44, 45 Abs. 2 Satz 2,\n§§ 47 bis 49 der Zivilprozeßordnung über die Ausschließung und\nAblehnung der Gerichtspersonen entsprechend."},{"nr":"2","text":"Über das Ablehnungsgesuch entscheidet, soweit es einer\nEntscheidung bedarf, eine Markenabteilung."}],"url":"https://www.gesetze-im-internet.de/markeng/__57.html"},{"id":"norm:§58","type":"norm","label":"§ 58 MarkenG","titel":"Gutachten","nummer":"58","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 4 - Allgemeine Vorschriften für das Verfahren vor dem Deutschen Patent- und Markenamt","absaetze":[{"nr":"1","text":"Das Deutsche Patent- und Markenamt ist verpflichtet, auf Ersuchen\nder Gerichte oder der Staatsanwaltschaften über Fragen, die\nangemeldete oder eingetragene Marken betreffen, Gutachten abzugeben,\nwenn in dem Verfahren voneinander abweichende Gutachten mehrerer\nSachverständiger vorliegen."},{"nr":"2","text":"Im übrigen ist das Deutsche Patent- und Markenamt nicht befugt,\nohne Genehmigung des Bundesministeriums der Justiz und für\nVerbraucherschutz außerhalb seines gesetzlichen Aufgabenbereichs\nBeschlüsse zu fassen oder Gutachten abzugeben."}],"url":"https://www.gesetze-im-internet.de/markeng/__58.html"},{"id":"norm:§59","type":"norm","label":"§ 59 MarkenG","titel":"Ermittlung des Sachverhalts, rechtliches Gehör","nummer":"59","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 4 - Allgemeine Vorschriften für das Verfahren vor dem Deutschen Patent- und Markenamt","absaetze":[{"nr":"1","text":"Das Deutsche Patent- und Markenamt ermittelt den Sachverhalt von\nAmts wegen. Es ist an das Vorbringen und die Beweisanträge der\nBeteiligten nicht gebunden."},{"nr":"2","text":"Soll die Entscheidung des Deutschen Patent- und Markenamts auf\nUmstände gestützt werden, die dem Anmelder oder Inhaber der Marke oder\neinem anderen am Verfahren Beteiligten noch nicht mitgeteilt waren, so\nist ihm vorher Gelegenheit zu geben, sich dazu innerhalb einer\nbestimmten Frist zu äußern."}],"url":"https://www.gesetze-im-internet.de/markeng/__59.html"},{"id":"norm:§60","type":"norm","label":"§ 60 MarkenG","titel":"Ermittlungen, Anhörungen, Niederschrift","nummer":"60","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 4 - Allgemeine Vorschriften für das Verfahren vor dem Deutschen Patent- und Markenamt","absaetze":[{"nr":"1","text":"Das Deutsche Patent- und Markenamt kann jederzeit die Beteiligten\nladen und anhören, Zeugen, Sachverständige und Beteiligte eidlich oder\nuneidlich vernehmen, Augenschein nehmen, die Beweiskraft einer\nvorgelegten Urkunde würdigen sowie andere zur Aufklärung der Sache\nerforderlichen Ermittlungen anstellen. Die Vorschriften des Buches 2\nder Zivilprozessordnung zu diesen Beweismitteln sind entsprechend\nanzuwenden."},{"nr":"2","text":"Bis zum Beschluß, mit dem das Verfahren abgeschlossen wird, ist\nder Anmelder oder Inhaber der Marke oder ein anderer an dem Verfahren\nBeteiligter auf Antrag anzuhören, wenn dies sachdienlich ist. Hält das\nDeutsche Patent- und Markenamt die Anhörung nicht für sachdienlich, so\nweist es den Antrag zurück. Der Beschluß, durch den der Antrag\nzurückgewiesen wird, ist selbständig nicht anfechtbar. Im Verfalls-\noder Nichtigkeitsverfahren findet eine Anhörung statt, wenn ein\nBeteiligter dies beantragt oder das Deutsche Patent- und Markenamt\ndies für sachdienlich erachtet."},{"nr":"3","text":"Über die Anhörungen und Vernehmungen ist eine Niederschrift zu\nfertigen, die den wesentlichen Gang der Verhandlung wiedergeben und\ndie rechtserheblichen Erklärungen der Beteiligten enthalten soll. Die\n§§ 160a, 162 und 163 der Zivilprozeßordnung sind entsprechend\nanzuwenden. Die Beteiligten erhalten eine Abschrift der Niederschrift."}],"url":"https://www.gesetze-im-internet.de/markeng/__60.html"},{"id":"norm:§61","type":"norm","label":"§ 61 MarkenG","titel":"Beschlüsse, Rechtsmittelbelehrung","nummer":"61","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 4 - Allgemeine Vorschriften für das Verfahren vor dem Deutschen Patent- und Markenamt","absaetze":[{"nr":"1","text":"Die Beschlüsse des Deutschen Patent- und Markenamts sind, auch\nwenn sie nach Satz 3 verkündet worden sind, zu begründen und den\nBeteiligten von Amts wegen in Abschrift zuzustellen; eine Beglaubigung\nder Abschrift ist nicht erforderlich. Ausfertigungen werden nur auf\nAntrag eines Beteiligten und nur in Papierform erteilt. Falls eine\nAnhörung stattgefunden hat, können sie auch am Ende der Anhörung\nverkündet werden. Einer Begründung bedarf es nicht, wenn am Verfahren\nnur der Anmelder oder Inhaber der Marke beteiligt ist und seinem\nAntrag stattgegeben wird."},{"nr":"2","text":"Mit Zustellung des Beschlusses sind die Beteiligten über das\nRechtsmittel, das gegen den Beschluss gegeben ist, über die Stelle,\nbei der das Rechtsmittel einzulegen ist, über die Rechtsmittelfrist\nund, sofern für das Rechtsmittel eine Gebühr nach dem\nPatentkostengesetz zu zahlen ist, über die Gebühr zu belehren. Die\nFrist für das Rechtsmittel beginnt nur zu laufen, wenn die Beteiligten\nnach Satz 1 belehrt worden sind. Ist die Belehrung unterblieben oder\nunrichtig erteilt, so ist die Einlegung des Rechtsmittels nur\ninnerhalb eines Jahres seit Zustellung des Beschlusses zulässig, außer\nwenn der Beteiligte schriftlich dahingehend belehrt worden ist, daß\nein Rechtsmittel nicht gegeben sei. § 91 ist entsprechend anzuwenden.\nDie Sätze 1 bis 4 gelten entsprechend für den Rechtsbehelf der\nErinnerung nach § 64."}],"url":"https://www.gesetze-im-internet.de/markeng/__61.html"},{"id":"norm:§62","type":"norm","label":"§ 62 MarkenG","titel":"Akteneinsicht, Registereinsicht","nummer":"62","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 4 - Allgemeine Vorschriften für das Verfahren vor dem Deutschen Patent- und Markenamt","absaetze":[{"nr":"1","text":"Das Deutsche Patent- und Markenamt gewährt auf Antrag Einsicht in\ndie Akten von Anmeldungen von Marken, wenn ein berechtigtes Interesse\nglaubhaft gemacht wird."},{"nr":"2","text":"Nach der Eintragung der Marke wird Einsicht in die Akten der\neingetragenen Marke gewährt."},{"nr":"3","text":"Die Einsicht in die Akten nach Absatz 2 kann bei elektronisch\ngeführten Akten auch über das Internet gewährt werden."},{"nr":"4","text":"Die Akteneinsicht nach den Absätzen 1 bis 3 ist ausgeschlossen,\nsoweit\n\n1. ihr eine Rechtsvorschrift entgegensteht,\n\n2. das schutzwürdige Interesse der betroffenen Person im Sinne des\n Artikels 4 Nummer 1 der Verordnung (EU) 679/2016 des Europäischen\n Parlaments und des Rates vom 27. April 2016 zum Schutz natürlicher\n Personen bei der Verarbeitung personenbezogener Daten, zum freien\n Datenverkehr und zur Aufhebung der Richtlinie 95/46/EG (Datenschutz-\n Grundverordnung) (ABl. L 119 vom 4.5.2016, S. 1; L 314 vom 22.11.2016,\n S. 72; L 127 vom 23.5.2018, S. 2) in der jeweils geltenden Fassung\n offensichtlich überwiegt oder\n\n3. sie auf Akteninhalte bezogen ist, die offensichtlich gegen die\n öffentliche Ordnung oder die guten Sitten verstoßen."},{"nr":"5","text":"Die Einsicht in das Register steht jeder Person frei."}],"url":"https://www.gesetze-im-internet.de/markeng/__62.html"},{"id":"norm:§62a","type":"norm","label":"§ 62a MarkenG","titel":"Datenschutz","nummer":"62a","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 4 - Allgemeine Vorschriften für das Verfahren vor dem Deutschen Patent- und Markenamt","absaetze":[{"nr":null,"text":"Soweit personenbezogene Daten im Register oder in öffentlich\nzugänglichen elektronischen Informationsdiensten des Deutschen Patent-\nund Markenamtes enthalten sind, bestehen nicht\n\n1. das Recht auf Auskunft gemäß Artikel 15 Absatz 1 Buchstabe c der\n Verordnung (EU) 2016/679,\n\n2. die Mitteilungspflicht gemäß Artikel 19 Satz 2 der Verordnung (EU)\n 2016/679 und\n\n3. das Recht auf Widerspruch gemäß Artikel 21 Absatz 1 der Verordnung\n (EU) 2016/679.\n\nDas Recht auf Erhalt einer Kopie nach Artikel 15 Absatz 3 der\nVerordnung (EU) 2016/679 wird dadurch erfüllt, dass die betroffene\nPerson Einsicht in das Register oder in öffentlich zugängliche\nelektronische Informationsdienste des Deutschen Patent- und\nMarkenamtes nehmen kann."}],"url":"https://www.gesetze-im-internet.de/markeng/__62a.html"},{"id":"norm:§63","type":"norm","label":"§ 63 MarkenG","titel":"Kosten der Verfahren","nummer":"63","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 4 - Allgemeine Vorschriften für das Verfahren vor dem Deutschen Patent- und Markenamt","absaetze":[{"nr":"1","text":"Sind an dem Verfahren mehrere Personen beteiligt, so kann das\nDeutsche Patent- und Markenamt in der Entscheidung bestimmen, daß die\nKosten des Verfahrens einschließlich der Auslagen des Deutschen\nPatent- und Markenamts und der den Beteiligten erwachsenen Kosten,\nsoweit sie zur zweckentsprechenden Wahrung der Ansprüche und Rechte\nnotwendig waren, einem Beteiligten ganz oder teilweise zur Last\nfallen, wenn dies der Billigkeit entspricht. Die Bestimmung kann auch\ngetroffen werden, wenn der Beteiligte die Erinnerung, die Anmeldung\nder Marke, den Widerspruch oder den Antrag auf Erklärung des Verfalls\noder der Nichtigkeit ganz oder teilweise zurücknimmt oder wenn die\nEintragung der Marke wegen Verzichts oder wegen Nichtverlängerung der\nSchutzdauer ganz oder teilweise im Register gelöscht wird. Soweit eine\nBestimmung über die Kosten nicht getroffen wird, trägt jeder\nBeteiligte die ihm erwachsenen Kosten selbst."},{"nr":"2","text":"Wenn eine Entscheidung nach Absatz 1 ergeht, setzt das Deutsche\nPatent- und Markenamt den Gegenstandswert fest; § 23 Absatz 3 Satz 2\nund § 33 Absatz 1 des Rechtsanwaltsvergütungsgesetzes gelten\nentsprechend. Der Beschluss über den Gegenstandswert kann mit der\nEntscheidung nach Absatz 1 verbunden werden."},{"nr":"3","text":"Das Deutsche Patent- und Markenamt kann anordnen, dass die Gebühr\nnach dem Patentkostengesetz für die beschleunigte Prüfung, für das\nWiderspruchs-, Verfalls- oder Nichtigkeitsverfahren ganz oder\nteilweise zurückgezahlt wird, wenn dies der Billigkeit entspricht."},{"nr":"4","text":"Der Betrag der zu erstattenden Kosten wird auf Antrag durch das\nDeutsche Patent- und Markenamt festgesetzt. Die Vorschriften der\nZivilprozessordnung über das Kostenfestsetzungsverfahren (§§ 103 bis\n107) und die Zwangsvollstreckung aus Kostenfestsetzungsbeschlüssen (§§\n724 bis 802) sind entsprechend anzuwenden. An die Stelle der\nErinnerung tritt die Beschwerde gegen den Kostenfestsetzungsbeschluß.\n§ 66 ist mit der Maßgabe anzuwenden, daß die Beschwerde innerhalb von\nzwei Wochen einzulegen ist. Die vollstreckbare Ausfertigung wird vom\nUrkundsbeamten der Geschäftsstelle des Bundespatentgerichts erteilt."}],"url":"https://www.gesetze-im-internet.de/markeng/__63.html"},{"id":"norm:§64","type":"norm","label":"§ 64 MarkenG","titel":"Erinnerung","nummer":"64","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 4 - Allgemeine Vorschriften für das Verfahren vor dem Deutschen Patent- und Markenamt","absaetze":[{"nr":"1","text":"Gegen die Beschlüsse der Markenstellen und der Markenabteilungen,\ndie von einem Beamten des gehobenen Dienstes oder einem vergleichbaren\nAngestellten erlassen worden sind, findet die Erinnerung statt. Die\nErinnerung hat aufschiebende Wirkung."},{"nr":"2","text":"Die Erinnerung ist innerhalb eines Monats nach Zustellung beim\nDeutschen Patent- und Markenamt einzulegen."},{"nr":"3","text":"Erachtet der Beamte oder Angestellte, dessen Beschluß angefochten\nwird, die Erinnerung für begründet, so hat er ihr abzuhelfen. Dies\ngilt nicht, wenn dem Erinnerungsführer ein anderer an dem Verfahren\nBeteiligter gegenübersteht."},{"nr":"4","text":"Über die Erinnerung entscheidet ein Mitglied des Deutschen Patent-\nund Markenamts durch Beschluss."},{"nr":"5","text":"Die Markenstelle oder die Markenabteilung kann anordnen, dass die\nGebühr nach dem Patentkostengesetz für die Erinnerung ganz oder\nteilweise zurückgezahlt wird."},{"nr":"6","text":"Anstelle der Erinnerung kann die Beschwerde nach § 66 eingelegt\nwerden. Ist in einem Verfahren, an dem mehrere Personen beteiligt\nsind, gegen einen Beschluss von einem Beteiligten Erinnerung und von\neinem anderen Beteiligten Beschwerde eingelegt worden, so kann der\nErinnerungsführer ebenfalls Beschwerde einlegen. Wird die Beschwerde\ndes Erinnerungsführers nicht innerhalb eines Monats nach Zustellung\nder Beschwerde des anderen Beteiligten gemäß § 66 Abs. 4 Satz 2\neingelegt, so gilt seine Erinnerung als zurückgenommen."},{"nr":"7","text":"Nach Einlegung einer Beschwerde nach Absatz 6 Satz 2 oder nach §\n66 Abs. 3 kann über eine Erinnerung nicht mehr entschieden werden.\nEine gleichwohl danach erlassene Erinnerungsentscheidung ist\ngegenstandslos."}],"url":"https://www.gesetze-im-internet.de/markeng/__64.html"},{"id":"norm:§64a","type":"norm","label":"§ 64a MarkenG","titel":"Kostenregelungen im Verfahren vor dem Deutschen Patent- und Markenamt","nummer":"64a","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 4 - Allgemeine Vorschriften für das Verfahren vor dem Deutschen Patent- und Markenamt","absaetze":[{"nr":null,"text":"Im Verfahren vor dem Deutschen Patent- und Markenamt gilt für die\nKosten das Patentkostengesetz."}],"url":"https://www.gesetze-im-internet.de/markeng/__64a.html"},{"id":"norm:§65","type":"norm","label":"§ 65 MarkenG","titel":"Rechtsverordnungsermächtigung","nummer":"65","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 4 - Allgemeine Vorschriften für das Verfahren vor dem Deutschen Patent- und Markenamt","absaetze":[{"nr":"1","text":"Das Bundesministerium der Justiz und für Verbraucherschutz wird\nermächtigt, durch Rechtsverordnung ohne Zustimmung des Bundesrates\n\n1. die Einrichtung und den Geschäftsgang sowie die Form des Verfahrens in\n Markenangelegenheiten zu regeln, soweit nicht durch Gesetz\n Bestimmungen darüber getroffen sind,\n\n2. weitere Erfordernisse für die Anmeldung von Marken zu bestimmen,\n\n3. die Klasseneinteilung von Waren und Dienstleistungen festzulegen,\n\n4. nähere Bestimmungen für die Durchführung der Prüfungs-, Widerspruchs-,\n Verfalls- und Nichtigkeitsverfahren zu treffen,\n\n5. Bestimmungen über das Register der eingetragenen Marken und\n gegebenenfalls gesonderte Bestimmungen über das Register für\n Kollektivmarken und Gewährleistungsmarken zu treffen,\n\n6. die in das Register aufzunehmenden Angaben über eingetragene Marken\n sowie über Widerspruchs- und Nichtigkeitsverfahren zu regeln und\n Umfang sowie Art und Weise der Veröffentlichung dieser Angaben\n festzulegen,\n\n7. Bestimmungen über die sonstigen in diesem Gesetz vorgesehenen\n Verfahren vor dem Deutschen Patent- und Markenamt zu treffen, wie\n insbesondere das Verfahren bei der Teilung von Anmeldungen und von\n Eintragungen, das Verfahren zur Erteilung von Auskünften oder\n Bescheinigungen, das Verfahren der Wiedereinsetzung, das Verfahren der\n Akteneinsicht, das Verfahren über den Schutz international\n registrierter Marken und das Verfahren über die Umwandlung von\n Unionsmarken,\n\n8. Bestimmungen über die in das Register aufzunehmenden Angaben über\n Lizenzen zu treffen,\n\n9. Bestimmungen über die Form zu treffen, in der Anträge und Eingaben in\n Markenangelegenheiten einzureichen sind, einschließlich der\n Übermittlung von Anträgen und Eingaben durch elektronische\n Datenübertragung,\n\n10. Bestimmungen darüber zu treffen, in welcher Form Beschlüsse, Bescheide\n oder sonstige Mitteilungen des Deutschen Patent- und Markenamts in\n Markenangelegenheiten den Beteiligten zu übermitteln sind,\n einschließlich der Übermittlung durch elektronische Datenübertragung,\n soweit nicht eine bestimmte Form der Übermittlung gesetzlich\n vorgeschrieben ist,\n\n11. Bestimmungen darüber zu treffen, in welchen Fällen und unter welchen\n Voraussetzungen Eingaben und Schriftstücke in Markenangelegenheiten in\n anderen Sprachen als der deutschen Sprache berücksichtigt werden,\n\n12. Beamte und Beamtinnen des gehobenen Dienstes oder vergleichbare\n Angestellte mit der Wahrnehmung von Angelegenheiten zu betrauen, die\n den Markenabteilungen obliegen und die ihrer Art nach keine besonderen\n rechtlichen Schwierigkeiten bieten, mit Ausnahme der Beschlußfassung\n über die Löschung von Marken aufgrund Verzichts, Verfalls oder\n Nichtigkeit (§ 48 Abs. 1, § 53), der Abgabe von Gutachten (§ 58 Abs.\n 1) und der Entscheidungen, mit denen die Abgabe eines Gutachtens\n abgelehnt wird,\n\n13. Beamte und Beamtinnen des mittleren Dienstes oder vergleichbare\n Angestellte mit der Wahrnehmung von Angelegenheiten zu betrauen, die\n den Markenstellen oder Markenabteilungen obliegen und die ihrer Art\n nach keine besonderen rechtlichen Schwierigkeiten bieten, mit Ausnahme\n von Entscheidungen über Anmeldungen und Widersprüche,\n\n14. die in die Veröffentlichung nach § 33 Abs. 3 aufzunehmenden Angaben zu\n regeln und Umfang sowie Art und Weise der Veröffentlichung dieser\n Angaben festzulegen,\n\n15. für Fristen in Markenangelegenheiten eine für alle Dienststellen des\n Deutschen Patent- und Markenamts geltende Regelung über die zu\n berücksichtigenden gesetzlichen Feiertage zu treffen."},{"nr":"2","text":"Das Bundesministerium der Justiz und für Verbraucherschutz kann\ndie Ermächtigung zum Erlaß von Rechtsverordnungen nach Absatz 1 durch\nRechtsverordnung ohne Zustimmung des Bundesrates ganz oder teilweise\ndem Deutschen Patent- und Markenamt übertragen."}],"url":"https://www.gesetze-im-internet.de/markeng/__65.html"},{"id":"norm:§65a","type":"norm","label":"§ 65a MarkenG","titel":"Verwaltungszusammenarbeit","nummer":"65a","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 4 - Allgemeine Vorschriften für das Verfahren vor dem Deutschen Patent- und Markenamt","absaetze":[{"nr":null,"text":"Das Deutsche Patent- und Markenamt arbeitet in den\nTätigkeitsbereichen, die für den nationalen, internationalen und den\nMarkenschutz in der Europäischen Union von Belang sind, effektiv mit\nanderen nationalen Markenämtern, der Weltorganisation für geistiges\nEigentum und dem Amt der Europäischen Union für geistiges Eigentum\nzusammen und fördert die Angleichung von Vorgehensweisen und\nInstrumenten im Zusammenhang mit der Prüfung, Eintragung, Verwaltung\nund Löschung von Marken."}],"url":"https://www.gesetze-im-internet.de/markeng/__65a.html"},{"id":"norm:§66","type":"norm","label":"§ 66 MarkenG","titel":"Beschwerde","nummer":"66","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":"1","text":"Gegen die Beschlüsse der Markenstellen und der Markenabteilungen\nfindet unbeschadet der Vorschrift des § 64 die Beschwerde an das\nBundespatentgericht statt. Die Beschwerde steht den am Verfahren vor\ndem Deutschen Patent- und Markenamt Beteiligten zu. Die Beschwerde hat\naufschiebende Wirkung."},{"nr":"2","text":"Die Beschwerde ist innerhalb eines Monats nach Zustellung des\nBeschlusses beim Deutschen Patent- und Markenamt schriftlich\neinzulegen."},{"nr":"3","text":"Ist über eine Erinnerung nach § 64 innerhalb von sechs Monaten\nnach ihrer Einlegung nicht entschieden worden und hat der\nErinnerungsführer nach Ablauf dieser Frist Antrag auf Entscheidung\ngestellt, so ist die Beschwerde abweichend von Absatz 1 Satz 1\nunmittelbar gegen den Beschluß der Markenstelle oder der\nMarkenabteilung zulässig, wenn über die Erinnerung nicht innerhalb von\nzwei Monaten nach Zugang des Antrags entschieden worden ist. Steht dem\nErinnerungsführer in dem Erinnerungsverfahren ein anderer Beteiligter\ngegenüber, so ist Satz 1 mit der Maßgabe anzuwenden, daß an die Stelle\nder Frist von sechs Monaten nach Einlegung der Erinnerung eine Frist\nvon zehn Monaten tritt. Hat der andere Beteiligte ebenfalls Erinnerung\neingelegt, so bedarf die Beschwerde nach Satz 2 der Einwilligung des\nanderen Beteiligten. Die schriftliche Erklärung der Einwilligung ist\nder Beschwerde beizufügen. Legt der andere Beteiligte nicht innerhalb\neiner Frist von einem Monat nach Zustellung der Beschwerde gemäß\nAbsatz 4 Satz 2 ebenfalls Beschwerde ein, so gilt seine Erinnerung als\nzurückgenommen. Der Lauf der Fristen nach den Sätzen 1 und 2 wird\ngehemmt, wenn das Verfahren ausgesetzt oder wenn einem Beteiligten auf\nsein Gesuch oder auf Grund zwingender Vorschriften eine Frist gewährt\nwird. Der noch übrige Teil der Fristen nach den Sätzen 1 und 2 beginnt\nnach Beendigung der Aussetzung oder nach Ablauf der gewährten Frist zu\nlaufen. Nach Erlaß der Erinnerungsentscheidung findet die Beschwerde\nnach den Sätzen 1 und 2 nicht mehr statt."},{"nr":"4","text":"Der Beschwerde und allen Schriftsätzen sollen Abschriften für die\nübrigen Beteiligten beigefügt werden. Die Beschwerde und alle\nSchriftsätze, die Sachanträge oder die Erklärung der Zurücknahme der\nBeschwerde oder eines Antrags enthalten, sind den übrigen Beteiligten\nvon Amts wegen zuzustellen. Andere Schriftsätze sind ihnen formlos\nmitzuteilen, sofern nicht die Zustellung angeordnet wird."},{"nr":"5","text":"Erachtet die Stelle, deren Beschluß angefochten wird, die\nBeschwerde für begründet, so hat sie ihr abzuhelfen. Dies gilt nicht,\nwenn dem Beschwerdeführer ein anderer an dem Verfahren Beteiligter\ngegenübersteht. Die Stelle kann anordnen, daß die Beschwerdegebühr\nnach dem Patentkostengesetz zurückgezahlt wird. Wird der Beschwerde\nnicht nach Satz 1 abgeholfen, so ist sie vor Ablauf von einem Monat\nohne sachliche Stellungnahme dem Bundespatentgericht vorzulegen. In\nden Fällen des Satzes 2 ist die Beschwerde unverzüglich dem\nBundespatentgericht vorzulegen. In den Verfahren ohne die Beteiligung\nDritter im Sinne des Satzes 2 ist ein Antrag auf Bewilligung von\nVerfahrenskostenhilfe für das Beschwerdeverfahren dem\nBundespatentgericht unverzüglich zur Vorabentscheidung vorzulegen."}],"url":"https://www.gesetze-im-internet.de/markeng/__66.html"},{"id":"norm:§67","type":"norm","label":"§ 67 MarkenG","titel":"Beschwerdesenate, Öffentlichkeit der Verhandlung","nummer":"67","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":"1","text":"Über Beschwerden im Sinne des § 66 entscheidet ein Beschwerdesenat\ndes Bundespatentgerichts in der Besetzung mit drei rechtskundigen\nMitgliedern."},{"nr":"2","text":"Die Verhandlung über Beschwerden gegen Beschlüsse der\nMarkenstellen und der Markenabteilungen einschließlich der Verkündung\nder Entscheidungen ist öffentlich, sofern die Eintragung\nveröffentlicht worden ist."},{"nr":"3","text":"Die §§ 172 bis 175 des Gerichtsverfassungsgesetzes gelten\nentsprechend mit der Maßgabe, daß\n\n1. die Öffentlichkeit für die Verhandlung auf Antrag eines Beteiligten\n auch dann ausgeschlossen werden kann, wenn sie eine Gefährdung\n schutzwürdiger Interessen des Antragstellers besorgen läßt,\n\n2. die Öffentlichkeit für die Verkündung der Entscheidungen bis zur\n Veröffentlichung der Eintragung ausgeschlossen ist."}],"url":"https://www.gesetze-im-internet.de/markeng/__67.html"},{"id":"norm:§68","type":"norm","label":"§ 68 MarkenG","titel":"Beteiligung des Präsidenten oder der Präsidentin des Deutschen Patent- und Markenamts","nummer":"68","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":"1","text":"Der Präsident oder die Präsidentin des Deutschen Patent- und\nMarkenamts kann, wenn er oder sie dies zur Wahrung des öffentlichen\nInteresses als angemessen erachtet, im Beschwerdeverfahren dem\nBundespatentgericht gegenüber schriftliche Erklärungen abgeben, an den\nTerminen teilnehmen und in ihnen Ausführungen machen. Schriftliche\nErklärungen des Präsidenten oder der Präsidentin des Deutschen Patent-\nund Markenamts sind den Beteiligten von dem Bundespatentgericht\nmitzuteilen."},{"nr":"2","text":"Das Bundespatentgericht kann, wenn es dies wegen einer Rechtsfrage\nvon grundsätzlicher Bedeutung als angemessen erachtet, dem Präsidenten\noder der Präsidentin des Deutschen Patent- und Markenamts anheimgeben,\ndem Beschwerdeverfahren beizutreten. Mit dem Eingang der\nBeitrittserklärung erlangt der Präsident oder die Präsidentin des\nDeutschen Patent- und Markenamts die Stellung eines oder einer\nBeteiligten."}],"url":"https://www.gesetze-im-internet.de/markeng/__68.html"},{"id":"norm:§69","type":"norm","label":"§ 69 MarkenG","titel":"Mündliche Verhandlung","nummer":"69","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":null,"text":"Eine mündliche Verhandlung findet statt, wenn\n\n1. einer der Beteiligten sie beantragt,\n\n2. vor dem Bundespatentgericht Beweis erhoben wird (§ 74 Abs. 1) oder\n\n3. das Bundespatentgericht sie für sachdienlich erachtet."}],"url":"https://www.gesetze-im-internet.de/markeng/__69.html"},{"id":"norm:§70","type":"norm","label":"§ 70 MarkenG","titel":"Entscheidung über die Beschwerde","nummer":"70","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":"1","text":"Über die Beschwerde wird durch Beschluß entschieden."},{"nr":"2","text":"Der Beschluß, durch den eine Beschwerde als unzulässig verworfen\nwird, kann ohne mündliche Verhandlung ergehen."},{"nr":"3","text":"Das Bundespatentgericht kann die angefochtene Entscheidung\naufheben, ohne in der Sache selbst zu entscheiden, wenn\n\n1. das Deutsche Patent- und Markenamt noch nicht in der Sache selbst\n entschieden hat,\n\n2. das Verfahren vor dem Deutschen Patent- und Markenamt an einem\n wesentlichen Mangel leidet oder\n\n3. neue Tatsachen oder Beweismittel bekannt werden, die für die\n Entscheidung wesentlich sind."},{"nr":"4","text":"Das Deutsche Patent- und Markenamt hat die rechtliche Beurteilung,\ndie der Aufhebung nach Absatz 3 zugrunde liegt, auch seiner\nEntscheidung zugrunde zu legen."}],"url":"https://www.gesetze-im-internet.de/markeng/__70.html"},{"id":"norm:§71","type":"norm","label":"§ 71 MarkenG","titel":"Kosten des Beschwerdeverfahrens","nummer":"71","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":"1","text":"Sind an dem Verfahren mehrere Personen beteiligt, so kann das\nBundespatentgericht bestimmen, daß die Kosten des Verfahrens\neinschließlich der den Beteiligten erwachsenen Kosten, soweit sie zur\nzweckentsprechenden Wahrung der Ansprüche und Rechte notwendig waren,\neinem Beteiligten ganz oder teilweise zur Last fallen, wenn dies der\nBilligkeit entspricht. Soweit eine Bestimmung über die Kosten nicht\ngetroffen wird, trägt jeder Beteiligte die ihm erwachsenen Kosten\nselbst."},{"nr":"2","text":"Dem Präsidenten oder der Präsidentin des Deutschen Patent- und\nMarkenamts können Kosten nur auferlegt werden, wenn er oder sie nach\nseinem oder ihrem Beitritt in dem Verfahren Anträge gestellt hat."},{"nr":"3","text":"Das Bundespatentgericht kann anordnen, daß die Beschwerdegebühr\nnach dem Patentkostengesetz zurückgezahlt wird."},{"nr":"4","text":"Die Absätze 1 bis 3 sind auch anzuwenden, wenn der Beteiligte die\nBeschwerde, die Anmeldung der Marke, den Widerspruch oder den Antrag\nauf Erklärung des Verfalls oder der Nichtigkeit ganz oder teilweise\nzurücknimmt oder wenn die Eintragung der Marke wegen Verzichts oder\nwegen Nichtverlängerung der Schutzdauer ganz oder teilweise im\nRegister gelöscht wird."},{"nr":"5","text":"Im Übrigen gelten die Vorschriften der Zivilprozessordnung über\ndas Kostenfestsetzungsverfahren (§§ 103 bis 107) und die\nZwangsvollstreckung aus Kostenfestsetzungsbeschlüssen (§§ 724 bis 802)\nentsprechend."}],"url":"https://www.gesetze-im-internet.de/markeng/__71.html"},{"id":"norm:§72","type":"norm","label":"§ 72 MarkenG","titel":"Ausschließung und Ablehnung","nummer":"72","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":"1","text":"Für die Ausschließung und Ablehnung der Gerichtspersonen gelten\ndie §§ 41 bis 44 und 47 bis 49 der Zivilprozeßordnung entsprechend."},{"nr":"2","text":"Von der Ausübung des Amtes als Richter ist auch ausgeschlossen,\nwer bei dem vorausgegangenen Verfahren vor dem Deutschen Patent- und\nMarkenamt mitgewirkt hat."},{"nr":"3","text":"Über die Ablehnung eines Richters entscheidet der Senat, dem der\nAbgelehnte angehört. Wird der Senat durch das Ausscheiden des\nabgelehnten Mitglieds beschlußunfähig, so entscheidet ein anderer\nBeschwerdesenat."},{"nr":"4","text":"Über die Ablehnung eines Urkundsbeamten entscheidet der Senat, in\ndessen Geschäftsbereich die Sache fällt."}],"url":"https://www.gesetze-im-internet.de/markeng/__72.html"},{"id":"norm:§73","type":"norm","label":"§ 73 MarkenG","titel":"Ermittlung des Sachverhalts, Vorbereitung der mündlichen Verhandlung","nummer":"73","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":"1","text":"Das Bundespatentgericht ermittelt den Sachverhalt von Amts wegen.\nEs ist an das Vorbringen und die Beweisanträge der Beteiligten nicht\ngebunden."},{"nr":"2","text":"Der oder die Vorsitzende oder ein von ihm oder ihr zu bestimmendes\nMitglied des Senats hat schon vor der mündlichen Verhandlung oder,\nwenn eine solche nicht stattfindet, vor der Entscheidung des\nBundespatentgerichts alle Anordnungen zu treffen, die notwendig sind,\num die Sache möglichst in einer mündlichen Verhandlung oder in einer\nSitzung zu erledigen. Im übrigen gilt § 273 Abs. 2, Abs. 3 Satz 1 und\nAbs. 4 Satz 1 der Zivilprozeßordnung entsprechend."}],"url":"https://www.gesetze-im-internet.de/markeng/__73.html"},{"id":"norm:§74","type":"norm","label":"§ 74 MarkenG","titel":"Beweiserhebung","nummer":"74","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":"1","text":"Das Bundespatentgericht erhebt Beweis in der mündlichen\nVerhandlung. Es kann insbesondere Augenschein einnehmen, Zeugen,\nSachverständige und Beteiligte vernehmen und Urkunden heranziehen."},{"nr":"2","text":"Das Bundespatentgericht kann in geeigneten Fällen schon vor der\nmündlichen Verhandlung durch eines seiner Mitglieder als beauftragten\nRichter Beweis erheben lassen oder unter Bezeichnung der einzelnen\nBeweisfragen ein anderes Gericht um die Beweisaufnahme ersuchen."},{"nr":"3","text":"Die Beteiligten werden von allen Beweisterminen benachrichtigt und\nkönnen der Beweisaufnahme beiwohnen. Sie können an Zeugen und\nSachverständige sachdienliche Fragen richten. Wird eine Frage\nbeanstandet, so entscheidet das Bundespatentgericht."}],"url":"https://www.gesetze-im-internet.de/markeng/__74.html"},{"id":"norm:§75","type":"norm","label":"§ 75 MarkenG","titel":"Ladungen","nummer":"75","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":"1","text":"Sobald der Termin zur mündlichen Verhandlung bestimmt ist, sind\ndie Beteiligten mit einer Ladungsfrist von mindestens zwei Wochen zu\nladen. In dringenden Fällen kann der Vorsitzende die Frist abkürzen."},{"nr":"2","text":"Bei der Ladung ist darauf hinzuweisen, daß beim Ausbleiben eines\nBeteiligten auch ohne ihn verhandelt und entschieden werden kann."}],"url":"https://www.gesetze-im-internet.de/markeng/__75.html"},{"id":"norm:§76","type":"norm","label":"§ 76 MarkenG","titel":"Gang der Verhandlung","nummer":"76","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":"1","text":"Der oder die Vorsitzende eröffnet und leitet die mündliche\nVerhandlung."},{"nr":"2","text":"Nach Aufruf der Sache trägt der oder die Vorsitzende oder der\nBerichterstatter oder die Berichterstatterin den wesentlichen Inhalt\nder Akten vor."},{"nr":"3","text":"Hierauf erhalten die Beteiligten das Wort, um ihre Anträge zu\nstellen und zu begründen."},{"nr":"4","text":"Der oder die Vorsitzende hat die Sache mit den Beteiligten in\ntatsächlicher und rechtlicher Hinsicht zu erörtern."},{"nr":"5","text":"Der oder die Vorsitzende hat jedem Mitglied des Senats auf\nVerlangen zu gestatten, Fragen zu stellen. Wird eine Frage\nbeanstandet, so entscheidet der Senat."},{"nr":"6","text":"Nach Erörterung der Sache erklärt der oder die Vorsitzende die\nmündliche Verhandlung für geschlossen. Der Senat kann die\nWiedereröffnung beschließen."}],"url":"https://www.gesetze-im-internet.de/markeng/__76.html"},{"id":"norm:§77","type":"norm","label":"§ 77 MarkenG","titel":"Niederschrift","nummer":"77","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":"1","text":"Zur mündlichen Verhandlung und zu jeder Beweisaufnahme wird ein\nUrkundsbeamter der Geschäftsstelle als Schriftführer zugezogen. Wird\nauf Anordnung des Vorsitzenden von der Zuziehung des Schriftführers\nabgesehen, besorgt ein Richter die Niederschrift."},{"nr":"2","text":"Über die mündliche Verhandlung und jede Beweisaufnahme ist eine\nNiederschrift aufzunehmen. Die §§ 160 bis 165 der Zivilprozeßordnung\nsind entsprechend anzuwenden."}],"url":"https://www.gesetze-im-internet.de/markeng/__77.html"},{"id":"norm:§78","type":"norm","label":"§ 78 MarkenG","titel":"Beweiswürdigung, rechtliches Gehör","nummer":"78","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":"1","text":"Das Bundespatentgericht entscheidet nach seiner freien, aus dem\nGesamtergebnis des Verfahrens gewonnenen Überzeugung. In der\nEntscheidung sind die Gründe anzugeben, die für die richterliche\nÜberzeugung leitend gewesen sind."},{"nr":"2","text":"Die Entscheidung darf nur auf Tatsachen und Beweisergebnisse\ngestützt werden, zu denen die Beteiligten sich äußern konnten."},{"nr":"3","text":"Ist eine mündliche Verhandlung vorhergegangen, so kann ein\nRichter, der bei der letzten mündlichen Verhandlung nicht zugegen war,\nbei der Beschlußfassung nur mitwirken, wenn die Beteiligten zustimmen."}],"url":"https://www.gesetze-im-internet.de/markeng/__78.html"},{"id":"norm:§79","type":"norm","label":"§ 79 MarkenG","titel":"Verkündung, Zustellung, Begründung","nummer":"79","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":"1","text":"Die Endentscheidungen des Bundespatentgerichts werden, wenn eine\nmündliche Verhandlung stattgefunden hat, in dem Termin, in dem die\nmündliche Verhandlung geschlossen wird, oder in einem sofort\nanzuberaumenden Termin verkündet. Dieser soll nur dann über drei\nWochen hinaus angesetzt werden, wenn wichtige Gründe, insbesondere der\nUmfang oder die Schwierigkeit der Sache, dies erfordern. Statt der\nVerkündung ist die Zustellung der Endentscheidung zulässig.\nEntscheidet das Bundespatentgericht ohne mündliche Verhandlung, so\nwird die Verkündung durch Zustellung an die Beteiligten ersetzt. Die\nEndentscheidungen sind den Beteiligten von Amts wegen zuzustellen."},{"nr":"2","text":"Die Entscheidungen des Bundespatentgerichts, durch die ein Antrag\nzurückgewiesen oder über ein Rechtsmittel entschieden wird, sind zu\nbegründen."}],"url":"https://www.gesetze-im-internet.de/markeng/__79.html"},{"id":"norm:§80","type":"norm","label":"§ 80 MarkenG","titel":"Berichtigungen","nummer":"80","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":"1","text":"Schreibfehler, Rechenfehler und ähnliche offenbare Unrichtigkeiten\nin der Entscheidung sind jederzeit vom Bundespatentgericht zu\nberichtigen."},{"nr":"2","text":"Enthält der Tatbestand der Entscheidung andere Unrichtigkeiten\noder Unklarheiten, so kann die Berichtigung innerhalb von zwei Wochen\nnach Zustellung der Entscheidung beantragt werden."},{"nr":"3","text":"Über die Berichtigung nach Absatz 1 kann ohne vorherige mündliche\nVerhandlung entschieden werden."},{"nr":"4","text":"Über den Antrag auf Berichtigung nach Absatz 2 entscheidet das\nBundespatentgericht ohne Beweisaufnahme durch Beschluß. Hierbei wirken\nnur die Richter mit, die bei der Entscheidung, deren Berichtigung\nbeantragt ist, mitgewirkt haben."},{"nr":"5","text":"Der Berichtigungsbeschluß wird auf der Entscheidung und den\nAusfertigungen vermerkt."}],"url":"https://www.gesetze-im-internet.de/markeng/__80.html"},{"id":"norm:§81","type":"norm","label":"§ 81 MarkenG","titel":"Vertretung, Vollmacht","nummer":"81","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":"1","text":"Die Beteiligten können vor dem Bundespatentgericht den\nRechtsstreit selbst führen. § 96 bleibt unberührt."},{"nr":"2","text":"Die Beteiligten können sich durch einen Rechtsanwalt oder\nPatentanwalt als Bevollmächtigten vertreten lassen. Darüber hinaus\nsind als Bevollmächtigte vor dem Bundespatentgericht vertretungsbefugt\nnur\n\n1. Beschäftigte des Beteiligten oder eines mit ihm verbundenen\n Unternehmens (§ 15 des Aktiengesetzes); Behörden und juristische\n Personen des öffentlichen Rechts einschließlich der von ihnen zur\n Erfüllung ihrer öffentlichen Aufgaben gebildeten Zusammenschlüsse\n können sich auch durch Beschäftigte anderer Behörden oder juristischer\n Personen des öffentlichen Rechts einschließlich der von ihnen zur\n Erfüllung ihrer öffentlichen Aufgaben gebildeten Zusammenschlüsse\n vertreten lassen,\n\n2. volljährige Familienangehörige (§ 15 der Abgabenordnung, § 11 des\n Lebenspartnerschaftsgesetzes), Personen mit Befähigung zum Richteramt\n und Streitgenossen, wenn die Vertretung nicht im Zusammenhang mit\n einer entgeltlichen Tätigkeit steht.\n\nBevollmächtigte, die keine natürlichen Personen sind, handeln durch\nihre Organe und mit der Prozessvertretung beauftragten Vertreter."},{"nr":"3","text":"Das Gericht weist Bevollmächtigte, die nicht nach Maßgabe des\nAbsatzes 2 vertretungsbefugt sind, durch unanfechtbaren Beschluss\nzurück. Prozesshandlungen eines nicht vertretungsbefugten\nBevollmächtigten und Zustellungen oder Mitteilungen an diesen\nBevollmächtigten sind bis zu seiner Zurückweisung wirksam. Das Gericht\nkann den in Absatz 2 Satz 2 bezeichneten Bevollmächtigten durch\nunanfechtbaren Beschluss die weitere Vertretung untersagen, wenn sie\nnicht in der Lage sind, das Sach- und Streitverhältnis sachgerecht\ndarzustellen."},{"nr":"4","text":"Richter dürfen nicht als Bevollmächtigte vor dem Gericht\nauftreten, dem sie angehören."},{"nr":"5","text":"Die Vollmacht ist schriftlich zu den Gerichtsakten einzureichen.\nSie kann nachgereicht werden. Das Bundespatentgericht kann hierfür\neine Frist bestimmen."},{"nr":"6","text":"Der Mangel der Vollmacht kann in jeder Lage des Verfahrens geltend\ngemacht werden. Das Bundespatentgericht hat den Mangel der Vollmacht\nvon Amts wegen zu berücksichtigen, wenn nicht als Bevollmächtigter ein\nRechtsanwalt oder ein Patentanwalt auftritt."}],"url":"https://www.gesetze-im-internet.de/markeng/__81.html"},{"id":"norm:§81a","type":"norm","label":"§ 81a MarkenG","titel":"Verfahrenskostenhilfe","nummer":"81a","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":"1","text":"Im Verfahren vor dem Bundespatentgericht erhält ein Beteiligter\nauf Antrag unter entsprechender Anwendung der §§ 114 bis 116 der\nZivilprozessordnung Verfahrenskostenhilfe."},{"nr":"2","text":"Im Übrigen sind § 130 Absatz 2 und 3 sowie die §§ 133 bis 137 des\nPatentgesetzes entsprechend anzuwenden."}],"url":"https://www.gesetze-im-internet.de/markeng/__81a.html"},{"id":"norm:§82","type":"norm","label":"§ 82 MarkenG","titel":"Anwendung weiterer Vorschriften, Anfechtbarkeit, Akteneinsicht","nummer":"82","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 5 - Verfahren vor dem Bundespatentgericht","absaetze":[{"nr":"1","text":"Soweit dieses Gesetz keine Bestimmungen über das Verfahren vor dem\nBundespatentgericht enthält, sind das Gerichtsverfassungsgesetz und\ndie Zivilprozeßordnung entsprechend anzuwenden, wenn die\nBesonderheiten des Verfahrens vor dem Patentgericht dies nicht\nausschließen. § 227 Abs. 3 Satz 1 der Zivilprozeßordnung ist nicht\nanzuwenden. Im Verfahren vor dem Bundespatentgericht gilt für die\nGebühren das Patentkostengesetz, für die Auslagen gilt das\nGerichtskostengesetz entsprechend."},{"nr":"2","text":"Eine Anfechtung der Entscheidungen des Bundespatentgerichts findet\nnur statt, soweit dieses Gesetz sie zuläßt."},{"nr":"3","text":"Für die Gewährung der Akteneinsicht an dritte Personen ist § 62\nAbsatz 1 bis 4 entsprechend anzuwenden. Über den Antrag entscheidet\ndas Bundespatentgericht."}],"url":"https://www.gesetze-im-internet.de/markeng/__82.html"},{"id":"norm:§83","type":"norm","label":"§ 83 MarkenG","titel":"Zugelassene und zulassungsfreie Rechtsbeschwerde","nummer":"83","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 6 - Verfahren vor dem Bundesgerichtshof","absaetze":[{"nr":"1","text":"Gegen die Beschlüsse der Beschwerdesenate des\nBundespatentgerichts, durch die über eine Beschwerde nach § 66\nentschieden wird, findet die Rechtsbeschwerde an den Bundesgerichtshof\nstatt, wenn der Beschwerdesenat die Rechtsbeschwerde in dem Beschluß\nzugelassen hat. Die Rechtsbeschwerde hat aufschiebende Wirkung."},{"nr":"2","text":"Die Rechtsbeschwerde ist zuzulassen, wenn\n\n1. eine Rechtsfrage von grundsätzlicher Bedeutung zu entscheiden ist oder\n\n2. die Fortbildung des Rechts oder die Sicherung einer einheitlichen\n Rechtsprechung eine Entscheidung des Bundesgerichtshofs erfordert."},{"nr":"3","text":"Einer Zulassung zur Einlegung der Rechtsbeschwerde bedarf es\nnicht, wenn gerügt wird,\n\n1. daß das beschließende Gericht nicht vorschriftsmäßig besetzt war,\n\n2. daß bei dem Beschluß ein Richter mitgewirkt hat, der von der Ausübung\n des Richteramtes kraft Gesetzes ausgeschlossen oder wegen Besorgnis\n der Befangenheit mit Erfolg abgelehnt war,\n\n3. daß einem Beteiligten das rechtliche Gehör versagt war,\n\n4. daß ein Beteiligter im Verfahren nicht nach Vorschrift des Gesetzes\n vertreten war, sofern er nicht der Führung des Verfahrens ausdrücklich\n oder stillschweigend zugestimmt hat,\n\n5. daß der Beschluß aufgrund einer mündlichen Verhandlung ergangen ist,\n bei der die Vorschriften über die Öffentlichkeit des Verfahrens\n verletzt worden sind, oder\n\n6. daß der Beschluß nicht mit Gründen versehen ist."}],"url":"https://www.gesetze-im-internet.de/markeng/__83.html"},{"id":"norm:§84","type":"norm","label":"§ 84 MarkenG","titel":"Beschwerdeberechtigung, Beschwerdegründe","nummer":"84","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 6 - Verfahren vor dem Bundesgerichtshof","absaetze":[{"nr":"1","text":"Die Rechtsbeschwerde steht den am Beschwerdeverfahren Beteiligten\nzu."},{"nr":"2","text":"Die Rechtsbeschwerde kann nur darauf gestützt werden, daß der\nBeschluß auf einer Verletzung des Rechts beruht. Die §§ 546 und 547\nder Zivilprozeßordnung gelten entsprechend."}],"url":"https://www.gesetze-im-internet.de/markeng/__84.html"},{"id":"norm:§85","type":"norm","label":"§ 85 MarkenG","titel":"Förmliche Voraussetzungen","nummer":"85","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 6 - Verfahren vor dem Bundesgerichtshof","absaetze":[{"nr":"1","text":"Die Rechtsbeschwerde ist innerhalb eines Monats nach Zustellung\ndes Beschlusses beim Bundesgerichtshof schriftlich einzulegen."},{"nr":"2","text":"In dem Rechtsbeschwerdeverfahren vor dem Bundesgerichtshof gelten\ndie Bestimmungen des § 142 über die Streitwertbegünstigung\nentsprechend."},{"nr":"3","text":"Die Rechtsbeschwerde ist zu begründen. Die Frist für die\nBegründung beträgt einen Monat. Sie beginnt mit der Einlegung der\nRechtsbeschwerde und kann auf Antrag vom Vorsitzenden verlängert\nwerden."},{"nr":"4","text":"Die Begründung der Rechtsbeschwerde muß enthalten\n\n1. die Erklärung, inwieweit der Beschluß angefochten und seine Abänderung\n oder Aufhebung beantragt wird,\n\n2. die Bezeichnung der verletzten Rechtsnorm und\n\n3. wenn die Rechtsbeschwerde auf die Verletzung von\n Verfahrensvorschriften gestützt wird, die Bezeichnung der Tatsachen,\n die den Mangel ergeben."},{"nr":"5","text":"Vor dem Bundesgerichtshof müssen sich die Beteiligten durch einen\nbeim Bundesgerichtshof zugelassenen Rechtsanwalt als Bevollmächtigten\nvertreten lassen. Auf Antrag eines Beteiligten ist seinem Patentanwalt\ndas Wort zu gestatten. Von den Kosten, die durch die Mitwirkung eines\nPatentanwalts entstehen, sind die Gebühren nach § 13 des\nRechtsanwaltsvergütungsgesetzes und außerdem die notwendigen Auslagen\ndes Patentanwalts zu erstatten."}],"url":"https://www.gesetze-im-internet.de/markeng/__85.html"},{"id":"norm:§86","type":"norm","label":"§ 86 MarkenG","titel":"Prüfung der Zulässigkeit","nummer":"86","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 6 - Verfahren vor dem Bundesgerichtshof","absaetze":[{"nr":null,"text":"Der Bundesgerichtshof hat von Amts wegen zu prüfen, ob die\nRechtsbeschwerde an sich statthaft und ob sie in der gesetzlichen Form\nund Frist eingelegt und begründet ist. Liegen die Voraussetzungen\nnicht vor, so ist die Rechtsbeschwerde als unzulässig zu verwerfen."}],"url":"https://www.gesetze-im-internet.de/markeng/__86.html"},{"id":"norm:§87","type":"norm","label":"§ 87 MarkenG","titel":"Mehrere Beteiligte","nummer":"87","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 6 - Verfahren vor dem Bundesgerichtshof","absaetze":[{"nr":"1","text":"Sind an dem Verfahren über die Rechtsbeschwerde mehrere Personen\nbeteiligt, so sind die Beschwerdeschrift und die Beschwerdebegründung\nden anderen Beteiligten mit der Aufforderung zuzustellen, etwaige\nErklärungen innerhalb einer bestimmten Frist nach Zustellung beim\nBundesgerichtshof schriftlich einzureichen. Mit der Zustellung der\nBeschwerdeschrift ist der Zeitpunkt mitzuteilen, in dem die\nRechtsbeschwerde eingelegt ist. Die erforderliche Zahl von\nbeglaubigten Abschriften soll der Beschwerdeführer mit der\nBeschwerdeschrift oder der Beschwerdebegründung einreichen."},{"nr":"2","text":"Ist der Präsident oder die Präsidentin des Deutschen Patent- und\nMarkenamts nicht am Verfahren über die Rechtsbeschwerde beteiligt, so\nist § 68 Abs. 1 entsprechend anzuwenden."}],"url":"https://www.gesetze-im-internet.de/markeng/__87.html"},{"id":"norm:§88","type":"norm","label":"§ 88 MarkenG","titel":"Anwendung weiterer Vorschriften","nummer":"88","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 6 - Verfahren vor dem Bundesgerichtshof","absaetze":[{"nr":"1","text":"Im Verfahren über die Rechtsbeschwerde gelten die Vorschriften der\nZivilprozessordnung über Ausschließung und Ablehnung der\nGerichtspersonen (§§ 41 bis 49), über Prozessbevollmächtigte und\nBeistände (§§ 78 bis 90), über Zustellungen von Amts wegen (§§ 166 bis\n190), über Ladungen, Termine und Fristen (§§ 214 bis 229) und über\nWiedereinsetzung in den vorigen Stand (§§ 233 bis 238) entsprechend.\nIm Falle der Wiedereinsetzung in den vorigen Stand gilt § 91 Abs. 8\nentsprechend. Auf Antrag ist einem Beteiligten unter entsprechender\nAnwendung des § 138 des Patentgesetzes Verfahrenskostenhilfe zu\nbewilligen."},{"nr":"2","text":"Für die Öffentlichkeit des Verfahrens gilt § 67 Abs. 2 und 3\nentsprechend."}],"url":"https://www.gesetze-im-internet.de/markeng/__88.html"},{"id":"norm:§89","type":"norm","label":"§ 89 MarkenG","titel":"Entscheidung über die Rechtsbeschwerde","nummer":"89","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 6 - Verfahren vor dem Bundesgerichtshof","absaetze":[{"nr":"1","text":"Die Entscheidung über die Rechtsbeschwerde ergeht durch Beschluß.\nDie Entscheidung kann ohne mündliche Verhandlung getroffen werden."},{"nr":"2","text":"Der Bundesgerichtshof ist bei seiner Entscheidung an die in dem\nangefochtenen Beschluß getroffenen tatsächlichen Feststellungen\ngebunden, außer wenn in bezug auf diese Feststellungen zulässige und\nbegründete Rechtsbeschwerdegründe vorgebracht sind."},{"nr":"3","text":"Die Entscheidung ist zu begründen und den Beteiligten von Amts\nwegen zuzustellen."},{"nr":"4","text":"Im Falle der Aufhebung des angefochtenen Beschlusses ist die Sache\nzur anderweitigen Verhandlung und Entscheidung an das\nBundespatentgericht zurückzuverweisen. Das Bundespatentgericht hat die\nrechtliche Beurteilung, die der Aufhebung zugrunde gelegt ist, auch\nseiner Entscheidung zugrunde zu legen."}],"url":"https://www.gesetze-im-internet.de/markeng/__89.html"},{"id":"norm:§89a","type":"norm","label":"§ 89a MarkenG","titel":"Abhilfe bei Verletzung des Anspruchs auf rechtliches Gehör","nummer":"89a","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 6 - Verfahren vor dem Bundesgerichtshof","absaetze":[{"nr":null,"text":"Auf die Rüge der durch die Entscheidung beschwerten Partei ist das\nVerfahren fortzuführen, wenn das Gericht den Anspruch dieser Partei\nauf rechtliches Gehör in entscheidungserheblicher Weise verletzt hat.\nGegen eine der Endentscheidung vorausgehende Entscheidung findet die\nRüge nicht statt. § 321a Abs. 2 bis 5 der Zivilprozessordnung ist\nentsprechend anzuwenden."}],"url":"https://www.gesetze-im-internet.de/markeng/__89a.html"},{"id":"norm:§90","type":"norm","label":"§ 90 MarkenG","titel":"Kostenentscheidung","nummer":"90","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 6 - Verfahren vor dem Bundesgerichtshof","absaetze":[{"nr":"1","text":"Sind an dem Verfahren mehrere Personen beteiligt, so kann der\nBundesgerichtshof bestimmen, daß die Kosten des Verfahrens\neinschließlich der den Beteiligten erwachsenen Kosten, soweit sie zur\nzweckentsprechenden Wahrung der Ansprüche und Rechte notwendig waren,\neinem Beteiligten ganz oder teilweise zur Last fallen, wenn dies der\nBilligkeit entspricht. Die Bestimmung kann auch getroffen werden, wenn\nder Beteiligte die Rechtsbeschwerde, die Anmeldung der Marke, den\nWiderspruch oder den Antrag auf Erklärung des Verfalls oder der\nNichtigkeit ganz oder teilweise zurücknimmt oder wenn die Eintragung\nder Marke wegen Verzichts oder wegen Nichtverlängerung der Schutzdauer\nganz oder teilweise im Register gelöscht wird. Soweit eine Bestimmung\nüber die Kosten nicht getroffen wird, trägt jeder Beteiligte die ihm\nerwachsenen Kosten selbst."},{"nr":"2","text":"Wird die Rechtsbeschwerde zurückgewiesen oder als unzulässig\nverworfen, so sind die durch die Rechtsbeschwerde veranlaßten Kosten\ndem Beschwerdeführer aufzuerlegen. Hat ein Beteiligter durch grobes\nVerschulden Kosten veranlaßt, so sind ihm diese aufzuerlegen."},{"nr":"3","text":"Dem Präsidenten oder der Präsidentin des Deutschen Patent- und\nMarkenamts können Kosten nur auferlegt werden, wenn er oder sie die\nRechtsbeschwerde eingelegt oder in dem Verfahren Anträge gestellt hat."},{"nr":"4","text":"Im Übrigen gelten die Vorschriften der Zivilprozessordnung über\ndas Kostenfestsetzungsverfahren (§§ 103 bis 107) und die\nZwangsvollstreckung aus Kostenfestsetzungsbeschlüssen (§§ 724 bis 802)\nentsprechend."}],"url":"https://www.gesetze-im-internet.de/markeng/__90.html"},{"id":"norm:§91","type":"norm","label":"§ 91 MarkenG","titel":"Wiedereinsetzung","nummer":"91","teil":"Teil 3 - Verfahren in Markenangelegenheiten","abschnitt":"Abschnitt 7 - Gemeinsame Vorschriften","absaetze":[{"nr":"1","text":"Wer ohne Verschulden verhindert war, dem Deutschen Patent- und\nMarkenamt oder dem Bundespatentgericht gegenüber eine Frist\neinzuhalten, deren Versäumung nach gesetzlicher Vorschrift einen\nRechtsnachteil zur Folge hat, ist auf Antrag wieder in den vorigen\nStand einzusetzen. Dies gilt nicht für die Frist zur Erhebung des\nWiderspruchs und zur Zahlung der Widerspruchsgebühr (§ 6 Abs. 1 Satz 1\ndes Patentkostengesetzes)."},{"nr":"2","text":"Die Wiedereinsetzung muß innerhalb von zwei Monaten nach Wegfall\ndes Hindernisses beantragt werden."},{"nr":"3","text":"Der Antrag muß die Angabe der die Wiedereinsetzung begründenden\nTatsachen enthalten. Diese Tatsachen sind bei der Antragstellung oder\nim Verfahren über den Antrag glaubhaft zu machen."},{"nr":"4","text":"Die versäumte Handlung ist innerhalb der Antragsfrist nachzuholen.\nIst dies geschehen, so kann Wiede
