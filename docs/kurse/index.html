5","fundstelle":"GRUR 2007, 318","kern":"Die Anbringung eines für Kraftfahrzeuge und Spielzeug eingetragenen Zeichens auf Modellautos ist nur dann untersagbar, wenn sie die Funktionen der Marke als für Spielzeug eingetragene Marke beeinträchtigt. Für Kraftfahrzeuge liegt keine Benutzung 'für Waren' vor, die identisch oder ähnlich sind.","tags":["Markenmäßige Benutzung"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=25.01.2007&Aktenzeichen=C-48/05"},{"id":"case:eugh_pago","type":"case","label":"EuGH – PAGO/Tirolmilch","name":"PAGO/Tirolmilch","court":"EuGH","date":"2009-10-06","az":"C-301/07","fundstelle":"GRUR 2009, 1158","kern":"Eine Unionsmarke (damals Gemeinschaftsmarke) ist 'in der Union bekannt', wenn sie einem bedeutenden Teil des Publikums in einem wesentlichen Teil des Unionsgebiets bekannt ist. Das Gebiet eines einzigen Mitgliedstaats (hier: Österreich) kann ein wesentlicher Teil der Union sein.","tags":["Unionsmarke","Bekanntheitsschutz"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=06.10.2009&Aktenzeichen=C-301/07"},{"id":"case:eugh_iron_smith","type":"case","label":"EuGH – Iron & Smith/Unilever","name":"Iron & Smith/Unilever","court":"EuGH","date":"2015-09-03","az":"C-125/14","fundstelle":"GRUR 2015, 1002","kern":"Wird aus einer bekannten Unionsmarke gegen eine jüngere nationale Marke vorgegangen, genügt für die Bekanntheit 'in der Union' die Bekanntheit in einem wesentlichen Teil der Union, der ein einziger Mitgliedstaat sein kann – auch wenn dies nicht der Mitgliedstaat der jüngeren Marke ist. Die Beeinträchtigung/Ausnutzung im Inland setzt aber voraus, dass ein wirtschaftlich nicht unbedeutender Teil des inländischen Publikums die Unionsmarke kennt und die Zeichen gedanklich verknüpft.","tags":["Unionsmarke","Bekanntheitsschutz"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=03.09.2015&Aktenzeichen=C-125/14"},{"id":"case:eugh_leno_merken","type":"case","label":"EuGH – Leno Merken/Hagelkruis (ONEL/OMEL)","name":"Leno Merken/Hagelkruis (ONEL/OMEL)","court":"EuGH","date":"2012-12-19","az":"C-149/11","fundstelle":"GRUR 2013, 182","kern":"Für die ernsthafte Benutzung einer Unionsmarke (Art. 18 UMV) sind die Grenzen der Mitgliedstaaten außer Betracht zu lassen. Die Benutzung in nur einem Mitgliedstaat kann ausreichen; maßgeblich ist, ob die Benutzung nach Markt, Waren und Umfang geeignet ist, Marktanteile in der Union zu gewinnen oder zu halten.","tags":["Unionsmarke","Benutzungszwang"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=19.12.2012&Aktenzeichen=C-149/11"},{"id":"case:eugh_dhl_chronopost","type":"case","label":"EuGH – DHL Express France/Chronopost (WEBSHIPPING)","name":"DHL Express France/Chronopost (WEBSHIPPING)","court":"EuGH","date":"2011-04-12","az":"C-235/09","fundstelle":"GRUR 2011, 518","kern":"Ein von einem Unionsmarkengericht ausgesprochenes Verbot erstreckt sich grundsätzlich auf das gesamte Gebiet der Union; Zwangsmaßnahmen zur Durchsetzung wirken ebenfalls unionsweit. Das Gericht muss die Reichweite beschränken, wenn die Verletzung nur in einem Teil der Union vorliegt oder der Kläger sein Begehren beschränkt.","tags":["Unionsmarke","Verfahren"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=12.04.2011&Aktenzeichen=C-235/09"},{"id":"case:eugh_combit","type":"case","label":"EuGH – combit Software/Commit Business Solutions","name":"combit Software/Commit Business Solutions","court":"EuGH","date":"2016-09-22","az":"C-223/15","fundstelle":"GRUR 2016, 1166","kern":"Stellt das Unionsmarkengericht fest, dass Verwechslungsgefahr in einem Teil der Union (etwa in den deutschsprachigen Mitgliedstaaten) besteht, in einem anderen Teil aber wegen sprachlicher Unterschiede nicht, muss es das Verbot auf die Gebiete beschränken, in denen Verwechslungsgefahr besteht; für die übrigen Gebiete darf der rechtmäßige Handel nicht untersagt werden.","tags":["Unionsmarke","Verfahren","Verwechslungsgefahr"],"url":"https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=22.09.2016&Aktenzeichen=C-223/15"},{"id":"concept:marke","type":"concept","label":"Marke","kategorie":"Grundlagen","definition":"Ein Zeichen, das geeignet ist, Waren oder Dienstleistungen eines Unternehmens von denjenigen anderer Unternehmen zu unterscheiden (§ 3 Abs. 1 MarkenG). Schutz entsteht durch Eintragung, Verkehrsgeltung oder notorische Bekanntheit (§ 4 MarkenG).","erlaeuterung":"Die Marke ist ein Kennzeichen für Produkte (Waren/Dienstleistungen), im Unterschied zum Unternehmenskennzeichen (kennzeichnet das Unternehmen) und zum Werktitel (kennzeichnet ein Werk). Markenformen: Wort-, Bild-, Wort-Bild-, dreidimensionale (Form-), Farb-, Klang-, Positions-, Bewegungs-, Hologramm- und Multimediamarken."},{"id":"concept:markenfunktionen","type":"concept","label":"Funktionen der Marke","kategorie":"Grundlagen","definition":"Hauptfunktion ist die Herkunftsfunktion (Garantie der Ursprungsidentität). Daneben schützt der EuGH die Qualitäts- (Garantie-), Kommunikations-, Investitions- und Werbefunktion.","erlaeuterung":"Praktische Bedeutung: Eine rechtsverletzende Benutzung i.S.d. § 14 Abs. 2 setzt voraus, dass eine Markenfunktion beeinträchtigt wird oder werden kann. Bei Doppelidentität (Nr. 1) genügt die Beeinträchtigung irgendeiner Funktion (L'Oréal/Bellure); bei Verwechslungsgefahr (Nr. 2) geht es um die Herkunftsfunktion; beim Bekanntheitsschutz (Nr. 3) ist keine Beeinträchtigung der Herkunftsfunktion erforderlich."},{"id":"concept:herkunftsfunktion","type":"concept","label":"Herkunftsfunktion","kategorie":"Grundlagen","definition":"Die Hauptfunktion der Marke: Sie garantiert dem Verbraucher die Ursprungsidentität der gekennzeichneten Ware oder Dienstleistung, indem sie ihm ermöglicht, diese ohne Verwechslungsgefahr von Waren anderer Herkunft zu unterscheiden.","erlaeuterung":"Sowohl die Unterscheidungskraft (§ 8 Abs. 2 Nr. 1) als auch die markenmäßige Benutzung im Verletzungstatbestand (§ 14 Abs. 2) knüpfen an die Herkunftsfunktion an. Beeinträchtigt ist sie, wenn der Verkehr das Zeichen als Hinweis auf die betriebliche Herkunft versteht und dadurch über die Herkunft irregeführt werden kann."},{"id":"concept:entstehung_markenschutz","type":"concept","label":"Entstehung des Markenschutzes (§ 4)","kategorie":"Grundlagen","definition":"Markenschutz entsteht (1) durch Eintragung in das Register des DPMA (§ 4 Nr. 1), (2) durch Benutzung im geschäftlichen Verkehr mit Verkehrsgeltung innerhalb der beteiligten Verkehrskreise (§ 4 Nr. 2, Benutzungsmarke) oder (3) durch notorische Bekanntheit i.S.d. Art. 6bis PVÜ (§ 4 Nr. 3).","erlaeuterung":"Alle drei Entstehungstatbestände führen zu einer 'Marke' mit den Rechten aus § 14. Die Registermarke ist die praktisch wichtigste; ihr Zeitrang bestimmt sich nach dem Anmeldetag (§ 6 Abs. 2), bei Benutzungs- und Notorietätsmarken nach dem Zeitpunkt des Rechtserwerbs (§ 6 Abs. 3)."},{"id":"concept:prioritaet","type":"concept","label":"Vorrang und Zeitrang (Prioritätsprinzip)","kategorie":"Grundlagen","definition":"Bei der Kollision von Kennzeichenrechten hat das Recht mit dem älteren Zeitrang Vorrang (§ 6 Abs. 1). Zeitrang der Registermarke ist der Anmeldetag (§ 6 Abs. 2 i.V.m. § 33 Abs. 1), ggf. der Prioritätstag (§§ 34, 35); bei sonstigen Rechten der Zeitpunkt des Rechtserwerbs (§ 6 Abs. 3). Bei gleichem Zeitrang: Koexistenz (§ 6 Abs. 4).","erlaeuterung":"Das Prioritätsprinzip ist Ausgangspunkt jeder Kollisionsprüfung (Widerspruch § 42, Nichtigkeit § 51, Verletzung § 14). Prüfungshinweis: Im Verletzungsprozess kann sich der Beklagte auf ein eigenes älteres Recht berufen (Einrede des besseren Rechts)."},{"id":"concept:markenfaehigkeit","type":"concept","label":"Markenfähigkeit (§ 3 Abs. 1)","kategorie":"Schutzvoraussetzungen","definition":"Abstrakte Eignung eines Zeichens, Waren oder Dienstleistungen eines Unternehmens von denen anderer Unternehmen zu unterscheiden (abstrakte Unterscheidungseignung). Alle Zeichenarten kommen in Betracht, insbes. Wörter, Abbildungen, Buchstaben, Zahlen, Klänge, dreidimensionale Gestaltungen, Farben.","erlaeuterung":"Die Markenfähigkeit wird abstrakt, d.h. losgelöst von den konkret beanspruchten Waren/Dienstleistungen geprüft. Sie fehlt nur ausnahmsweise, z.B. bei Zeichen, die nicht einheitlich bestimmbar sind (variable Marken), oder bei den Formausschlussgründen des § 3 Abs. 2. Die konkrete Unterscheidungskraft ist dagegen Frage des § 8 Abs. 2 Nr. 1."},{"id":"concept:formausschluss","type":"concept","label":"Formausschluss (§ 3 Abs. 2)","kategorie":"Schutzvoraussetzungen","definition":"Nicht markenfähig sind Zeichen, die ausschließlich aus Formen oder anderen charakteristischen Merkmalen bestehen, die (1) durch die Art der Ware selbst bedingt sind, (2) zur Erreichung einer technischen Wirkung erforderlich sind oder (3) der Ware einen wesentlichen Wert verleihen.","erlaeuterung":"Zweck: Verhinderung eines zeitlich unbegrenzten Monopols an technischen oder ästhetischen Lösungen, die dem Patent- bzw. Designrecht vorbehalten sind. Der Ausschluss kann NICHT durch Verkehrsdurchsetzung überwunden werden (anders als § 8 Abs. 2 Nr. 1-3). Prüfung: Ermittlung der wesentlichen Merkmale, dann Frage, ob alle wesentlichen Merkmale technisch bedingt sind (Bodendübel, Philips/Remington). Wesentlicher Wert: nur wenn die ästhetische Form die Kaufentscheidung maßgeblich bestimmt (Ritter Sport)."},{"id":"concept:formmarke","type":"concept","label":"Formmarke / dreidimensionale Marke","kategorie":"Markenformen","definition":"Marke, die aus der dreidimensionalen Gestaltung der Ware selbst oder ihrer Verpackung besteht (§ 3 Abs. 1). Sie unterliegt dem Formausschluss des § 3 Abs. 2 und strengen Anforderungen an die Unterscheidungskraft.","erlaeuterung":"Der Verkehr schließt aus der Form einer Ware gewöhnlich nicht auf die Herkunft. Originäre Unterscheidungskraft nur, wenn die Form erheblich von der Norm oder Branchenüblichkeit abweicht (ROCHER-Kugel). Der Schutz bezieht sich auf die konkrete Ausgestaltung, nicht auf eine abstrakte Grundform."},{"id":"concept:farbmarke","type":"concept","label":"Abstrakte Farbmarke","kategorie":"Markenformen","definition":"Marke, die aus einer Farbe oder Farbkombination ohne räumliche Begrenzung besteht. Markenfähig, wenn die Farbe eindeutig bestimmt ist (Farbcode). Originäre Unterscheidungskraft nur ausnahmsweise; regelmäßig Eintragung nur über Verkehrsdurchsetzung.","erlaeuterung":"Wegen des Allgemeininteresses an der freien Verfügbarkeit von Farben (Libertel) setzt der BGH für die Verkehrsdurchsetzung einer Farbmarke einen Zuordnungsgrad von über 50 % voraus (Langenscheidt-Gelb, Nivea-Blau). Im Verletzungsprozess ist zu prüfen, ob der Verkehr die Farbe als eigenständiges Kennzeichen (Zweitmarke) wahrnimmt (Gelbe Wörterbücher)."},{"id":"concept:darstellbarkeit","type":"concept","label":"Darstellbarkeit im Register (§ 8 Abs. 1)","kategorie":"Schutzvoraussetzungen","definition":"Von der Eintragung ausgeschlossen sind Zeichen, die nicht geeignet sind, in dem Register so dargestellt zu werden, dass die zuständigen Behörden und das Publikum den Gegenstand des Schutzes klar und eindeutig bestimmen können.","erlaeuterung":"Seit dem MaMoG 2019 ist die graphische Darstellbarkeit nicht mehr erforderlich (z.B. Klangmarke als Audiodatei). Maßstab bleiben die Sieckmann-Kriterien des EuGH: klar, eindeutig, in sich abgeschlossen, leicht zugänglich, verständlich, dauerhaft und objektiv."},{"id":"concept:absolute_schutzhindernisse","type":"concept","label":"Absolute Schutzhindernisse (§ 8 Abs. 2)","kategorie":"Schutzvoraussetzungen","definition":"Eintragungshindernisse, die im Allgemeininteresse (nicht im Interesse einzelner Rechtsinhaber) bestehen und vom DPMA von Amts wegen geprüft werden (§ 37): u.a. fehlende Unterscheidungskraft (Nr. 1), Freihaltebedürfnis (Nr. 2), üblich gewordene Bezeichnungen (Nr. 3), Täuschungseignung (Nr. 4), Verstoß gegen öffentliche Ordnung/gute Sitten (Nr. 5), Hoheitszeichen (Nr. 6-8), geschützte Herkunftsangaben u.a. (Nr. 9-13), Bösgläubigkeit (Nr. 14).","erlaeuterung":"Nr. 1-3 können durch Verkehrsdurchsetzung überwunden werden (§ 8 Abs. 3). Bei nachträglicher Eintragung trotz Schutzhindernis: Nichtigkeit nach § 50. Jedes Schutzhindernis ist gesondert und für jede beanspruchte Ware/Dienstleistung zu prüfen. Maßgeblicher Zeitpunkt: Anmeldetag (§ 37 Abs. 2, § 50 Abs. 2)."},{"id":"concept:unterscheidungskraft","type":"concept","label":"Unterscheidungskraft (§ 8 Abs. 2 Nr. 1)","kategorie":"Schutzvoraussetzungen","definition":"Die einer Marke innewohnende (konkrete) Eignung, vom Verkehr als Unterscheidungsmittel aufgefasst zu werden, das die beanspruchten Waren oder Dienstleistungen als von einem bestimmten Unternehmen stammend kennzeichnet und von denen anderer Unternehmen unterscheidet.","erlaeuterung":"Großzügiger Maßstab: Jede noch so geringe Unterscheidungskraft genügt. Sie fehlt (1) bei Zeichen mit einem für die Waren/Dienstleistungen im Vordergrund stehenden beschreibenden Begriffsinhalt, (2) bei gebräuchlichen Wörtern der deutschen oder einer bekannten Fremdsprache, die stets nur als solche verstanden werden, und (3) bei Zeichen, die nur als Werbeaussage/Anpreisung verstanden werden. Maßgeblich: Sicht des normal informierten, angemessen aufmerksamen Durchschnittsverbrauchers im Anmeldezeitpunkt, unter Berücksichtigung aller praktisch bedeutsamen Verwendungsformen (#darferdas?)."},{"id":"concept:verwendungsformen","type":"concept","label":"Berücksichtigung der Verwendungsformen","kategorie":"Schutzvoraussetzungen","definition":"Bei der Prüfung der Unterscheidungskraft sind alle wahrscheinlichen und praktisch bedeutsamen Verwendungsarten des Zeichens in der betreffenden Branche zu berücksichtigen; nur wenn eine einzige Verwendungsart praktisch bedeutsam ist, darf die Prüfung auf diese beschränkt werden.","erlaeuterung":"Beispiel Bekleidung: Ein Spruch auf der Vorderseite eines T-Shirts wird als Dekor, im Einnähetikett als Herkunftshinweis verstanden. Nach EuGH #darferdas? sind beide Verwendungsarten zu betrachten, wenn sie praktisch bedeutsam sind. Frühere BGH-Linie (Marlene-Dietrich-Bildnis II): Es genügte, dass es praktisch bedeutsame und naheliegende Möglichkeiten markenmäßiger Verwendung gibt."},{"id":"concept:freihaltebeduerfnis","type":"concept","label":"Freihaltebedürfnis / beschreibende Angaben (§ 8 Abs. 2 Nr. 2)","kategorie":"Schutzvoraussetzungen","definition":"Von der Eintragung ausgeschlossen sind Zeichen, die ausschließlich aus Angaben bestehen, die im Verkehr zur Bezeichnung der Art, Beschaffenheit, Menge, Bestimmung, des Wertes, der geographischen Herkunft, der Zeit der Herstellung oder sonstiger Merkmale der Waren/Dienstleistungen dienen können.","erlaeuterung":"Schutzzweck: Allgemeininteresse der Mitbewerber an der freien Verwendbarkeit beschreibender Angaben. Es genügt, dass die Angabe zur Beschreibung dienen KANN – eine aktuelle beschreibende Verwendung ist nicht erforderlich; auch ein zukünftiges Freihaltebedürfnis reicht (Black Friday, Chiemsee). Auch fremdsprachige Angaben, wenn die beteiligten Verkehrskreise sie verstehen. Abgrenzung zu Nr. 1: Nr. 2 betrifft das Interesse der Mitbewerber, Nr. 1 die Herkunftshinweisfunktion; beide überschneiden sich häufig, sind aber gesondert zu prüfen."},{"id":"concept:uebliche_bezeichnung","type":"concept","label":"Üblich gewordene Bezeichnungen (§ 8 Abs. 2 Nr. 3)","kategorie":"Schutzvoraussetzungen","definition":"Ausgeschlossen sind Zeichen, die im allgemeinen Sprachgebrauch oder in den redlichen und ständigen Verkehrsgepflogenheiten zur Bezeichnung der Waren oder Dienstleistungen üblich geworden sind (Gattungsbezeichnungen, Freizeichen).","erlaeuterung":"Erfasst sind ursprünglich unterscheidungskräftige Zeichen, die zur Gattungsbezeichnung geworden sind (z.B. 'Walkman' in Österreich), und Freizeichen, die von mehreren Unternehmen üblich benutzt werden. Nachträglicher Verfall einer eingetragenen Marke aus diesem Grund: § 49 Abs. 2 Nr. 1."},{"id":"concept:taeuschung","type":"concept","label":"Täuschungseignung (§ 8 Abs. 2 Nr. 4)","kategorie":"Schutzvoraussetzungen","definition":"Ausgeschlossen sind Zeichen, die geeignet sind, das Publikum insbesondere über die Art, die Beschaffenheit oder die geographische Herkunft der Waren oder Dienstleistungen zu täuschen.","erlaeuterung":"Im Eintragungsverfahren nur zu berücksichtigen, wenn die Täuschungseignung ersichtlich ist (§ 37 Abs. 3). Nachträgliche Täuschungseignung durch die Art der Benutzung: Verfall nach § 49 Abs. 2 Nr. 2."},{"id":"concept:boesglaeubigkeit","type":"concept","label":"Bösgläubige Markenanmeldung (§ 8 Abs. 2 Nr. 14)","kategorie":"Schutzvoraussetzungen","definition":"Eine Anmeldung ist bösgläubig, wenn der Anmelder das Zeichen nicht zur Förderung des eigenen Absatzes, sondern rechtsmissbräuchlich oder sittenwidrig anmeldet, insbesondere um einen schutzwürdigen Besitzstand eines Vorbenutzers zu stören, Dritte zu behindern (Sperrmarke) oder Lizenzgebühren zu erpressen (Hinterhaltsmarke).","erlaeuterung":"Fallgruppen: (1) Störung eines fremden schutzwürdigen Besitzstands in Kenntnis und ohne sachlichen Grund; (2) Behinderungsabsicht als wesentlicher Beweggrund; (3) Anmeldung von Spekulationsmarken ohne generellen Benutzungswillen. Die Kenntnis von der Vorbenutzung allein genügt nicht (Ivadal). Maßgeblicher Zeitpunkt: Anmeldung; späteres Verhalten ist Indiz (GLÜCKSPILZ). Rechtsfolge: Zurückweisung (nur bei ersichtlicher Bösgläubigkeit, § 37 Abs. 3) bzw. Nichtigkeit (§ 50)."},{"id":"concept:verkehrsdurchsetzung","type":"concept","label":"Verkehrsdurchsetzung (§ 8 Abs. 3)","kategorie":"Schutzvoraussetzungen","definition":"Die Schutzhindernisse des § 8 Abs. 2 Nr. 1, 2 und 3 finden keine Anwendung, wenn die Marke sich vor dem Anmeldetag infolge ihrer Benutzung für die Waren oder Dienstleistungen in den beteiligten Verkehrskreisen durchgesetzt hat.","erlaeuterung":"Erforderlich ist, dass ein erheblicher Teil der beteiligten Verkehrskreise das Zeichen einem bestimmten Unternehmen zuordnet. Keine feste Prozentgrenze (Chiemsee), aber Richtwert: regelmäßig mindestens 50 % Zuordnungsgrad; bei glatt beschreibenden Angaben höher (Kinder II). Nachweis durch Umfragegutachten, Marktanteil, Werbeaufwand etc. Die Verkehrsdurchsetzung führt zu durchschnittlicher, nicht automatisch gesteigerter Kennzeichnungskraft. Nicht anwendbar auf § 3 Abs. 2 und § 8 Abs. 2 Nr. 4 ff."},{"id":"concept:verkehrsgeltung","type":"concept","label":"Verkehrsgeltung (§ 4 Nr. 2)","kategorie":"Grundlagen","definition":"Markenschutz durch Benutzung entsteht, wenn ein Zeichen im geschäftlichen Verkehr benutzt wird und innerhalb der beteiligten Verkehrskreise als Marke Verkehrsgeltung erworben hat, d.h. ein nicht unerheblicher Teil der Verkehrskreise das Zeichen als Herkunftshinweis auf ein bestimmtes Unternehmen versteht.","erlaeuterung":"Der erforderliche Bekanntheitsgrad ist niedriger als bei der Verkehrsdurchsetzung (bei unterscheidungskräftigen Zeichen genügen ca. 20-25 %); bei beschreibenden/freihaltebedürftigen Zeichen sind die Anforderungen der Verkehrsdurchsetzung (über 50 %) maßgeblich. Die Verkehrsgeltung kann regional beschränkt sein; dann ist auch der Schutz regional beschränkt."},{"id":"concept:notorische_bekanntheit","type":"concept","label":"Notorische Bekanntheit (§ 4 Nr. 3)","kategorie":"Grundlagen","definition":"Markenschutz entsteht auch ohne Eintragung oder Inlandsbenutzung, wenn die Marke im Inland i.S.d. Art. 6bis PVÜ notorisch, d.h. allgemein (auch außerhalb der Fachkreise) bekannt ist.","erlaeuterung":"Praktisch selten; erfasst v.a. ausländische Weltmarken, die im Inland noch nicht benutzt werden. Von der 'bekannten Marke' (§ 14 Abs. 2 Nr. 3) zu unterscheiden, die bereits eine Marke i.S.d. § 4 sein muss und deren Bekanntheit den Schutzbereich erweitert."},{"id":"concept:relative_schutzhindernisse","type":"concept","label":"Relative Schutzhindernisse (§§ 9-13)","kategorie":"Schutzvoraussetzungen","definition":"Ältere Rechte Dritter, die der Eintragung entgegenstehen und nur auf Widerspruch (§ 42) oder Nichtigkeitsantrag/-klage (§ 51, § 55) geltend gemacht werden: ältere Marken (§ 9: Identität, Verwechslungsgefahr, Bekanntheitsschutz), notorisch bekannte Marken (§ 10), Agentenmarken (§ 11), Benutzungsmarken und geschäftliche Bezeichnungen (§ 12), sonstige ältere Rechte (§ 13: Name, Bildnis, Urheberrecht, Design usw.).","erlaeuterung":"§ 9 Abs. 1 Nr. 1-3 spiegelt die Verletzungstatbestände des § 14 Abs. 2 Nr. 1-3; die Auslegung ist einheitlich. Im Widerspruchsverfahren können nur die in § 42 Abs. 2 genannten Rechte geltend gemacht werden; der Widersprechende muss auf Einrede die rechtserhaltende Benutzung glaubhaft machen (§ 43 Abs. 1)."},{"id":"concept:geschaeftlicher_verkehr","type":"concept","label":"Benutzung im geschäftlichen Verkehr","kategorie":"Verletzung","definition":"Jede wirtschaftliche Tätigkeit, die auf die Erzielung eines wirtschaftlichen Vorteils gerichtet ist und nicht rein privat, wissenschaftlich, politisch oder hoheitlich ist. An das Merkmal sind keine hohen Anforderungen zu stellen.","erlaeuterung":"Auch der Verkauf über Online-Plattformen kann geschäftlicher Verkehr sein, wenn er über gelegentliche private Verkäufe hinausgeht (Indizien: Anzahl, Neuware, Gewerbeanmeldung). Rein privater Gebrauch (z.B. Fanartikel tragen) ist kein geschäftlicher Verkehr."},{"id":"concept:markenmaessige_benutzung","type":"concept","label":"Markenmäßige (rechtsverletzende) Benutzung","kategorie":"Verletzung","definition":"Ungeschriebenes Tatbestandsmerkmal des § 14 Abs. 2: Das Zeichen muss so benutzt werden, dass es die Funktionen der Marke, insbesondere die Herkunftsfunktion, beeinträchtigt oder beeinträchtigen kann, d.h. der Verkehr es als Hinweis auf die betriebliche Herkunft der Waren/Dienstleistungen versteht.","erlaeuterung":"Prüfung aus Sicht des Durchschnittsverbrauchers unter Berücksichtigung der Kennzeichnungsgewohnheiten der Branche und der konkreten Präsentation (SAM, Damen Hose MO). Keine markenmäßige Benutzung: rein beschreibende Verwendung (FRÜHSTÜCKS-DRINK II), Verwendung als Dekor/Verzierung, originalgetreue Nachbildung (Opel-Blitz II), bloße Firmennutzung ohne Warenbezug (Céline). Bei § 14 Abs. 2 Nr. 3 ist keine Beeinträchtigung der Herkunftsfunktion nötig; es genügt eine gedankliche Verknüpfung."},{"id":"concept:firmenmaessiger_gebrauch","type":"concept","label":"Firmenmäßiger Gebrauch","kategorie":"Verletzung","definition":"Die Benutzung eines Zeichens ausschließlich als Unternehmensbezeichnung (Firma, Geschäftsbezeichnung) ist keine Benutzung 'für Waren oder Dienstleistungen' i.S.d. § 14 Abs. 2; sie wird zur markenmäßigen Benutzung, wenn der Verkehr eine Verbindung zwischen der Bezeichnung und den vertriebenen Waren herstellt.","erlaeuterung":"Gegen rein firmenmäßigen Gebrauch schützt § 15 (bei Kollision mit einem Unternehmenskennzeichen) bzw. § 5 Abs. 2 UWG. Seit dem MaMoG stellt § 14 Abs. 3 Nr. 5 klar, dass die Benutzung als Handelsname oder Unternehmensbezeichnung eine Verletzungshandlung sein kann, wenn sie 'für Waren oder Dienstleistungen' erfolgt."},{"id":"concept:doppelidentitaet","type":"concept","label":"Doppelidentität / Identitätsschutz (§ 14 Abs. 2 Nr. 1)","kategorie":"Verletzung","definition":"Verletzung durch Benutzung eines mit der Marke identischen Zeichens für Waren oder Dienstleistungen, die mit denen identisch sind, für die die Marke Schutz genießt. Eine Verwechslungsgefahr muss nicht festgestellt werden.","erlaeuterung":"Zeichenidentität liegt vor, wenn das Zeichen ohne Änderung oder Hinzufügung alle Elemente der Marke wiedergibt oder Unterschiede so geringfügig sind, dass sie dem Durchschnittsverbraucher entgehen (EuGH LTJ Diffusion/Arthur et Félicie). Auch hier ist eine Beeinträchtigung einer Markenfunktion erforderlich – bei Nr. 1 genügt jede Funktion, nicht nur die Herkunftsfunktion (L'Oréal/Bellure). Typische Fälle: Produktpiraterie, Keyword-Advertising, Ersatzteilhinweise."},{"id":"concept:verwechslungsgefahr","type":"concept","label":"Verwechslungsgefahr (§ 14 Abs. 2 Nr. 2)","kategorie":"Verletzung","definition":"Die Gefahr, dass das Publikum glauben könnte, die betreffenden Waren oder Dienstleistungen stammten aus demselben Unternehmen oder aus wirtschaftlich miteinander verbundenen Unternehmen. Sie ist umfassend unter Berücksichtigung aller Umstände des Einzelfalls zu beurteilen, insbesondere der Wechselwirkung zwischen Waren-/Dienstleistungsähnlichkeit, Zeichenähnlichkeit und Kennzeichnungskraft der älteren Marke.","erlaeuterung":"Rechtsfrage, nicht Tatsachenfrage: Es kommt nicht auf tatsächliche Verwechslungen an, sondern auf die normative Gefahr aus Sicht des Durchschnittsverbrauchers. Arten: unmittelbare Verwechslungsgefahr (Zeichen werden verwechselt), mittelbare (Zeichen werden unterschieden, aber demselben Unternehmen zugeordnet, z.B. Serienzeichen), Verwechslungsgefahr im weiteren Sinne (Annahme wirtschaftlicher/organisatorischer Verbindungen). Die bloße gedankliche Verbindung genügt nicht (SABEL/Puma)."},{"id":"concept:verwechslungsgefahr_weiterer_sinn","type":"concept","label":"Verwechslungsgefahr im weiteren Sinne / mittelbare Verwechslungsgefahr","kategorie":"Verletzung","definition":"Mittelbare Verwechslungsgefahr: Der Verkehr erkennt die Unterschiede der Zeichen, ordnet sie aber wegen eines gemeinsamen Stammbestandteils (Serienzeichen) demselben Unternehmen zu. Verwechslungsgefahr im weiteren Sinne: Der Verkehr erkennt, dass die Zeichen verschiedenen Unternehmen gehören, nimmt aber irrig wirtschaftliche oder organisatorische Verbindungen (Lizenz, Konzern) an.","erlaeuterung":"Beide Formen sind Unterfälle des § 14 Abs. 2 Nr. 2 ('gedanklich in Verbindung bringen'). Die Verwechslungsgefahr im weiteren Sinne ist die Ausnahme: Sie setzt besondere Umstände voraus, etwa dass das ältere Zeichen zugleich Unternehmenskennzeichen ist oder als selbständig kennzeichnender Bestandteil in das jüngere Zeichen übernommen wird (THOMSON LIFE, Mustang, INTERCONNECT)."},{"id":"concept:serienmarke","type":"concept","label":"Serienzeichen / Zeichenserie","kategorie":"Verletzung","definition":"Mehrere Marken eines Unternehmens mit einem gemeinsamen, kennzeichnungskräftigen Stammbestandteil (z.B. 'Volks-'). Übernimmt ein Dritter den Stammbestandteil, kann der Verkehr das jüngere Zeichen irrig der Serie zuordnen (mittelbare Verwechslungsgefahr).","erlaeuterung":"Voraussetzung: Die Serie muss im Verkehr tatsächlich benutzt und bekannt sein; ein einziges Zeichen bildet keine Serie. Der Stammbestandteil muss Hinweischarakter auf den Inhaber haben."},{"id":"concept:wechselwirkung","type":"concept","label":"Wechselwirkungslehre","kategorie":"Verletzung","definition":"Die Faktoren der Verwechslungsgefahr – Ähnlichkeit der Waren/Dienstleistungen, Ähnlichkeit der Zeichen und Kennzeichnungskraft der älteren Marke – stehen in einer Wechselbeziehung: Ein geringerer Grad eines Faktors kann durch einen höheren Grad eines anderen ausgeglichen werden und umgekehrt.","erlaeuterung":"Prüfungsreihenfolge (BGH-Standard): (1) Waren-/Dienstleistungsähnlichkeit, (2) Kennzeichnungskraft der Klagemarke, (3) Zeichenähnlichkeit, (4) Gesamtabwägung. Absolute Unähnlichkeit der Waren oder der Zeichen kann nicht durch andere Faktoren kompensiert werden (dann ggf. § 14 Abs. 2 Nr. 3)."},{"id":"concept:warenaehnlichkeit","type":"concept","label":"Waren-/Dienstleistungsähnlichkeit","kategorie":"Verletzung","definition":"Waren oder Dienstleistungen sind ähnlich, wenn sie unter Berücksichtigung aller erheblichen Faktoren – Art, Verwendungszweck, Nutzung, Eigenart als konkurrierende oder einander ergänzende Produkte, regelmäßige Herstellungsstätten und Vertriebswege – so enge Berührungspunkte aufweisen, dass der Verkehr bei identischer Kennzeichnung annehmen könnte, sie stammten aus demselben oder wirtschaftlich verbundenen Unternehmen.","erlaeuterung":"Maßgeblich ist bei der Registermarke das Waren-/Dienstleistungsverzeichnis, nicht die tatsächliche Benutzung (Registerlage). Die Zugehörigkeit zu derselben Klasse der Nizza-Klassifikation ist nur Indiz. Absolute Unähnlichkeit schließt Verwechslungsgefahr aus (Bier vs. Snacks: DESPERADOS)."},{"id":"concept:kennzeichnungskraft","type":"concept","label":"Kennzeichnungskraft","kategorie":"Verletzung","definition":"Die Eignung eines Zeichens, sich dem Publikum aufgrund seiner Eigenart und seines Bekanntheitsgrades als Marke einzuprägen und die gekennzeichneten Waren/Dienstleistungen als von einem bestimmten Unternehmen stammend zu identifizieren. Sie bestimmt den Schutzumfang der Marke im Kollisionsfall.","erlaeuterung":"Grade (Culinaria): sehr geringe, geringe (unterdurchschnittliche), durchschnittliche (normale), erhöhte (überdurchschnittliche) und sehr hohe Kennzeichnungskraft. Originäre Kennzeichnungskraft folgt aus der Eigenart des Zeichens (Phantasiewort: normal; beschreibende Anklänge: schwach). Nachträgliche Steigerung durch intensive Benutzung (Marktanteil, Werbung, Bekanntheit); Schwächung durch Drittzeichen im Ähnlichkeitsbereich. Durch Verkehrsdurchsetzung eingetragene Marken haben regelmäßig nur durchschnittliche Kennzeichnungskraft (Kinder II). Abgrenzung zur Unterscheidungskraft: Diese ist Eintragungsvoraussetzung (ja/nein), die Kennzeichnungskraft ein graduelles Kriterium des Schutzumfangs."},{"id":"concept:zeichenaehnlichkeit","type":"concept","label":"Zeichenähnlichkeit","kategorie":"Verletzung","definition":"Ähnlichkeit der einander gegenüberstehenden Zeichen nach Klang, (Schrift-)Bild und Sinngehalt (Bedeutung), beurteilt nach dem Gesamteindruck aus Sicht des Durchschnittsverbrauchers. Ähnlichkeit in einer der drei Wahrnehmungsrichtungen kann genügen.","erlaeuterung":"Grundsätze: Maßgeblich ist der Gesamteindruck, nicht die zergliedernde Betrachtung; Übereinstimmungen wiegen schwerer als Abweichungen; Wortanfänge werden stärker beachtet; eine klangliche Ähnlichkeit kann durch einen abweichenden Sinngehalt neutralisiert werden. Bei mehrgliedrigen Zeichen: Prägetheorie und selbständig kennzeichnende Stellung. Vergleich Wortmarke – dreidimensionale Gestaltung: nur begriffliche Ähnlichkeit möglich (Goldbären)."},{"id":"concept:gesamteindruck","type":"concept","label":"Gesamteindruck","kategorie":"Verletzung","definition":"Die Zeichen sind so zu vergleichen, wie sie dem Verkehr in ihrer Gesamtheit begegnen. Der Durchschnittsverbraucher nimmt eine Marke regelmäßig als Ganzes wahr und achtet nicht auf Einzelheiten; er verlässt sich auf sein unvollkommenes Erinnerungsbild.","erlaeuterung":"Der Gesamteindruck kann durch einen einzelnen Bestandteil geprägt werden (Prägetheorie); beschreibende oder kennzeichnungsschwache Bestandteile treten zurück, werden aber nicht völlig ausgeblendet. Bei Wort-Bild-Marken orientiert sich der Verkehr im Regelfall am Wortbestandteil als einfachster Bezeichnungsform."},{"id":"concept:praegetheorie","type":"concept","label":"Prägetheorie","kategorie":"Verletzung","definition":"Bei mehrgliedrigen Zeichen kann ein einzelner Bestandteil den Gesamteindruck prägen, wenn die übrigen Bestandteile für den Verkehr in einer Weise zurücktreten, dass sie den Gesamteindruck nicht mitbestimmen. Dann ist die Zeichenähnlichkeit anhand des prägenden Bestandteils zu beurteilen.","erlaeuterung":"Rein beschreibende Bestandteile prägen nicht. Bekannte Herstellerangaben treten im Regelfall gegenüber der Produktmarke zurück (Ausnahme: branchenübliche Kennzeichnungspraxis, z.B. Mode). Die Prägetheorie beantwortet die Frage, welchen Bestandteilen der Verkehr die Kennzeichnungsfunktion beimisst; sie ist von der selbständig kennzeichnenden Stellung zu unterscheiden."},{"id":"concept:selbstaendig_kennzeichnende_stellung","type":"concept","label":"Selbständig kennzeichnende Stellung","kategorie":"Verletzung","definition":"Verwechslungsgefahr kann auch bestehen, wenn eine ältere Marke in ein zusammengesetztes jüngeres Zeichen übernommen wird und dort – ohne den Gesamteindruck zu prägen – eine selbständig kennzeichnende Stellung behält, so dass der Verkehr annimmt, die Waren stammten aus wirtschaftlich verbundenen Unternehmen (EuGH THOMSON LIFE).","erlaeuterung":"Typischer Fall: Kombination einer fremden Marke mit der eigenen Unternehmensbezeichnung ('THOMSON LIFE', 'T-InterConnect'). Ausnahmecharakter: Besondere Umstände sind erforderlich (Culinaria). Auch ein kennzeichnungsschwacher Bestandteil kann eine selbständig kennzeichnende Stellung haben (INTERCONNECT). Eine selbständig kennzeichnende Stellung kommt nicht in Betracht für Bestandteile, die zu einem einheitlichen Gesamtbegriff verschmelzen."},{"id":"concept:durchschnittsverbraucher","type":"concept","label":"Durchschnittsverbraucher / beteiligte Verkehrskreise","kategorie":"Verletzung","definition":"Maßstab für Unterscheidungskraft und Verwechslungsgefahr ist der normal informierte, angemessen aufmerksame und verständige Durchschnittsverbraucher der betreffenden Waren/Dienstleistungen; bei Fachwaren die Fachkreise. Der Aufmerksamkeitsgrad variiert je nach Produktart (höher bei teuren/gesundheitsbezogenen Waren).","erlaeuterung":"Setzen sich die Verkehrskreise aus mehreren Gruppen zusammen (Ärzte und Patienten), genügt Verwechslungsgefahr bei einer Gruppe (Maalox/Melox-GRY). Der Richter kann die Verkehrsauffassung regelmäßig aus eigener Sachkunde beurteilen, wenn er zu den angesprochenen Kreisen gehört."},{"id":"concept:bekannte_marke","type":"concept","label":"Bekannte Marke (§ 14 Abs. 2 Nr. 3)","kategorie":"Bekanntheitsschutz","definition":"Eine Marke ist bekannt, wenn sie einem bedeutenden Teil des Publikums bekannt ist, das von den durch die Marke erfassten Waren oder Dienstleistungen betroffen ist. Feste Prozentsätze gibt es nicht; zu berücksichtigen sind Marktanteil, Intensität, geographische Ausdehnung und Dauer der Benutzung sowie Werbeaufwand (General Motors).","erlaeuterung":"Bekanntheit im Inland ist erforderlich, ein wesentlicher Teil des Bundesgebiets genügt. Der Bekanntheitsschutz greift nach richtlinienkonformer Auslegung auch bei identischen/ähnlichen Waren (OTTO Cap) und ist unabhängig von einer Verwechslungsgefahr; erforderlich ist nur eine gedankliche Verknüpfung. Er schützt über die Herkunftsfunktion hinaus Werbewert und Ruf der Marke."},{"id":"concept:gedankliche_verknuepfung","type":"concept","label":"Gedankliche Verknüpfung","kategorie":"Bekanntheitsschutz","definition":"Voraussetzung des Bekanntheitsschutzes: Der Verkehr muss das angegriffene Zeichen mit der bekannten Marke gedanklich in Verbindung bringen (Assoziation), ohne dass eine Verwechslungsgefahr erforderlich ist. Notwendige, aber nicht hinreichende Bedingung (Intel).","erlaeuterung":"Zu berücksichtigen sind Grad der Zeichenähnlichkeit, Art und Nähe der Waren, Grad der Bekanntheit und Kennzeichnungskraft. Fehlt jede Ähnlichkeit oder wird das Zeichen rein beschreibend verstanden (METROBUS), scheidet die Verknüpfung aus."},{"id":"concept:ausnutzung_unterscheidungskraft","type":"concept","label":"Ausnutzung der Unterscheidungskraft (Aufmerksamkeitsausbeutung)","kategorie":"Bekanntheitsschutz","definition":"Der Dritte nutzt die Aufmerksamkeit und den Werbewert der bekannten Marke aus, um die Aufmerksamkeit des Verkehrs auf sein eigenes Angebot zu lenken (Trittbrettfahren, Imagetransfer).","erlaeuterung":"Beispiele: 'OTTO' für Caps; Markenparodie 'Springender Pudel'. Unlauterkeit indiziert, wenn ohne eigene Anstrengung von der Sogwirkung der Marke profitiert wird; Rechtfertigung möglich durch Kunst-/Meinungsfreiheit (Lila-Postkarte) oder anständige vergleichende Werbung."},{"id":"concept:ausnutzung_wertschaetzung","type":"concept","label":"Ausnutzung der Wertschätzung (Rufausbeutung)","kategorie":"Bekanntheitsschutz","definition":"Der Dritte überträgt den guten Ruf (Qualitäts-, Prestige-, Luxusimage) der bekannten Marke auf sein eigenes Produkt und profitiert von deren Anziehungskraft ohne eigene finanzielle Gegenleistung (L'Oréal/Bellure).","erlaeuterung":"Beispiele: Duftvergleichslisten für Imitate; Werbung mit fremdem Testsiegel (ÖKO-TEST II). Abgrenzung zur Ausnutzung der Unterscheidungskraft: dort geht es um Aufmerksamkeit/Bekanntheit, hier um den Imagetransfer."},{"id":"concept:verwaesserung","type":"concept","label":"Beeinträchtigung der Unterscheidungskraft (Verwässerung)","kategorie":"Bekanntheitsschutz","definition":"Die Eignung der bekannten Marke, die Waren als von ihrem Inhaber stammend zu identifizieren, wird geschwächt, weil die Benutzung des ähnlichen Zeichens die Identität der Marke und ihre Bekanntheit beim Publikum auflöst (Verwässerung, 'dilution by blurring').","erlaeuterung":"Nach EuGH Intel ist der Nachweis einer Änderung des wirtschaftlichen Verhaltens des Durchschnittsverbrauchers oder der ernsthaften Gefahr einer solchen Änderung erforderlich."},{"id":"concept:rufschaedigung","type":"concept","label":"Beeinträchtigung der Wertschätzung (Rufschädigung)","kategorie":"Bekanntheitsschutz","definition":"Die Anziehungskraft der bekannten Marke wird gemindert, weil das Zeichen für Waren benutzt wird, die negative Eigenschaften oder ein Image haben, das mit der bekannten Marke unvereinbar ist (Verunglimpfung, 'dilution by tarnishment').","erlaeuterung":"Beispiele: Verwendung eines Luxuszeichens für minderwertige Ware oder in anstößigem Kontext. Bei Satire/Kunst ist Art. 5 Abs. 3 GG in die Abwägung der Unlauterkeit einzustellen (Lila-Postkarte)."},{"id":"concept:unlauterkeit","type":"concept","label":"Ohne rechtfertigenden Grund in unlauterer Weise","kategorie":"Bekanntheitsschutz","definition":"Der Bekanntheitsschutz setzt voraus, dass die Ausnutzung oder Beeinträchtigung ohne rechtfertigenden Grund in unlauterer Weise erfolgt. Erforderlich ist eine umfassende Interessenabwägung, in die Grundrechte (Kunst-, Meinungs-, Pressefreiheit) und das Interesse an lauterem Wettbewerb (vergleichende Werbung, Alternativangebote) einzustellen sind.","erlaeuterung":"Unlauterkeit ist regelmäßig indiziert, wenn der Dritte sich in die Sogwirkung der Marke begibt, um ohne eigene Leistung zu profitieren (L'Oréal/Bellure). Rechtfertigender Grund: Kunstfreiheit (Lila-Postkarte); Keyword-Werbung, die lediglich eine Alternative anbietet (Interflora); notwendige Bestimmungsangabe."},{"id":"concept:schranke_23","type":"concept","label":"Schranken des § 23 (Namen, beschreibende Angaben, Bestimmungshinweis)","kategorie":"Schranken","definition":"Der Markeninhaber kann einem Dritten nicht untersagen, im geschäftlichen Verkehr (1) dessen Namen oder Anschrift (nur natürliche Personen), (2) Zeichen ohne Unterscheidungskraft oder beschreibende Angaben oder (3) die Marke als Hinweis auf die Bestimmung einer Ware (insbesondere Zubehör/Ersatzteile) oder Dienstleistung zu benutzen, sofern die Benutzung den anständigen Gepflogenheiten in Gewerbe oder Handel entspricht (§ 23 Abs. 2).","erlaeuterung":"§ 23 greift erst, wenn der Verletzungstatbestand des § 14 Abs. 2 erfüllt ist (Einwendung). Nr. 2 erlaubt auch die beschreibende Verwendung einer eingetragenen (verkehrsdurchgesetzten) Marke, z.B. 'Kinder' in beschreibendem Sinn. Anständige Gepflogenheiten fehlen, wenn eine wirtschaftliche Verbindung suggeriert, die Wertschätzung unlauter ausgenutzt, die Marke herabgesetzt oder das Produkt als Imitat dargestellt wird (Gillette)."},{"id":"concept:ersatzteilhinweis","type":"concept","label":"Bestimmungshinweis / Ersatzteil- und Zubehörgeschäft (§ 23 Abs. 1 Nr. 3)","kategorie":"Schranken","definition":"Die Benutzung einer fremden Marke ist zulässig, wenn sie als Hinweis auf die Bestimmung der eigenen Ware (Zubehör, Ersatzteil, Kompatibilität: 'passend für ...') notwendig ist und den anständigen Gepflogenheiten entspricht.","erlaeuterung":"Notwendig ist die Benutzung, wenn sie praktisch das einzige Mittel ist, dem Publikum eine verständliche und vollständige Information über die Bestimmung zu geben (Gillette). Nicht notwendig: Übernahme des Bildlogos, wenn die Wortmarke genügt (GROSSE INSPEKTION FÜR ALLE), oder Nachbildung des Emblems (Kühlergrill). Zulässig: 'Filtertüte passend für Vorwerk Kobold' mit hervorgehobener Eigenmarke (Staubsaugerfiltertüten)."},{"id":"concept:gleichnamigkeit","type":"concept","label":"Recht der Gleichnamigen","kategorie":"Schranken","definition":"Tragen zwei Unternehmen redlich denselben Namen, muss der Prioritätsjüngere grundsätzlich alles Erforderliche und Zumutbare tun, um Verwechslungen zu vermeiden (unterscheidende Zusätze); bei langjähriger Koexistenz kann eine Gleichgewichtslage entstehen, die keine Seite einseitig stören darf.","erlaeuterung":"Grundlage: § 23 Abs. 1 Nr. 1 (Namensgebrauch) i.V.m. der Interessenabwägung; für Domains gilt bei Gleichnamigkeit das Prioritätsprinzip der Registrierung, außer bei überragender Bekanntheit (shell.de)."},{"id":"concept:erschoepfung","type":"concept","label":"Erschöpfung (§ 24 Abs. 1)","kategorie":"Schranken","definition":"Der Markeninhaber kann die Benutzung der Marke für Waren nicht untersagen, die unter dieser Marke von ihm oder mit seiner Zustimmung im Inland, in einem EU-Mitgliedstaat oder EWR-Vertragsstaat in den Verkehr gebracht worden sind (EWR-weite, keine internationale Erschöpfung).","erlaeuterung":"Inverkehrbringen = Übertragung der tatsächlichen Verfügungsgewalt mit Verwertungsmöglichkeit; bloßer Import oder Angebot genügen nicht. Erschöpfung wirkt konkret für jedes einzelne Warenstück. Der Wiederverkäufer darf die Marke auch in seiner Werbung benutzen (Dior/Evora). Lizenzverstöße nach § 30 Abs. 2 schließen die Zustimmung aus (Converse II). Beweislast: grundsätzlich der Beklagte; Umkehr bei Marktabschottungsgefahr (Van Doren, stüssy II)."},{"id":"concept:berechtigte_gruende","type":"concept","label":"Berechtigte Gründe gegen Erschöpfung (§ 24 Abs. 2)","kategorie":"Schranken","definition":"Die Erschöpfung greift nicht, wenn sich der Inhaber der Benutzung im Zusammenhang mit dem weiteren Vertrieb aus berechtigten Gründen widersetzt, insbesondere wenn der Zustand der Waren nach dem Inverkehrbringen verändert oder verschlechtert ist.","erlaeuterung":"Fallgruppen: Veränderung/Verschlechterung der Ware (Umverpacken, Umetikettieren, Aufarbeitung), erhebliche Rufschädigung durch die Art der Werbung (Dior/Evora), Entfernung von Kontrollnummern, Suggestion einer Vertragshändlerbeziehung. Beim Parallelimport von Arzneimitteln gelten die BMS-Kriterien."},{"id":"concept:umverpackung","type":"concept","label":"Umverpackung / Parallelimport (BMS-Kriterien)","kategorie":"Schranken","definition":"Der Parallelimporteur darf umgepackte Markenware vertreiben, wenn (1) das Umpacken zur Vermarktung im Einfuhrstaat erforderlich ist, (2) der Originalzustand des Produkts nicht beeinträchtigt wird, (3) Hersteller und Umpacker auf der Packung angegeben sind, (4) die Aufmachung den Ruf der Marke nicht schädigt und (5) der Markeninhaber vorab unterrichtet wird.","erlaeuterung":"Entwickelt vom EuGH für Arzneimittel (Bristol-Myers Squibb/Paranova); Zurückweisung der Erschöpfung nur, soweit die Kriterien nicht eingehalten sind. Das Erforderlichkeitskriterium wird streng gehandhabt (Marktzugang muss ohne Umpacken behindert sein)."},{"id":"concept:beweislast_erschoepfung","type":"concept","label":"Beweislast bei der Erschöpfung","kategorie":"Schranken","definition":"Grundsätzlich trägt der in Anspruch genommene Dritte die Beweislast für die Voraussetzungen der Erschöpfung (Inverkehrbringen im EWR mit Zustimmung). Betreibt der Markeninhaber ein ausschließliches Vertriebssystem und droht bei Offenlegung der Bezugsquelle eine Abschottung der nationalen Märkte, muss der Markeninhaber beweisen, dass die Ware außerhalb des EWR in Verkehr gebracht wurde.","erlaeuterung":"Bei Bestreiten der Echtheit trägt der Beklagte auch die Beweislast für die Echtheit (Converse I). Keine Beweislastumkehr bei Ware eines EWR-Lizenznehmers ohne Marktabschottungsgefahr (Converse II)."},{"id":"concept:verwirkung","type":"concept","label":"Verwirkung (§ 21)","kategorie":"Schranken","definition":"Der Inhaber eines älteren Kennzeichenrechts kann die Benutzung eines jüngeren eingetragenen Rechts nicht untersagen, wenn er sie fünf aufeinanderfolgende Jahre in Kenntnis geduldet hat, es sei denn, die jüngere Anmeldung war bösgläubig (§ 21 Abs. 1, 2). Daneben bleibt die allgemeine Verwirkung nach § 242 BGB (§ 21 Abs. 4).","erlaeuterung":"Verwirkung nach § 242 BGB setzt Zeitmoment (längere Untätigkeit), Umstandsmoment (schutzwürdiger Besitzstand des Verletzers) und Zurechenbarkeit voraus. Bei wiederholten gleichartigen Verletzungen entsteht jeweils ein neuer Unterlassungsanspruch (Hard Rock Cafe). Rechtsfolge des § 21: Koexistenz – auch der Inhaber des jüngeren Rechts kann die Benutzung des älteren nicht untersagen (§ 21 Abs. 3)."},{"id":"concept:verjaehrung","type":"concept","label":"Verjährung (§ 20)","kategorie":"Schranken","definition":"Ansprüche aus dem MarkenG verjähren nach den allgemeinen Vorschriften des BGB (regelmäßige Verjährung: drei Jahre ab Kenntnis, §§ 195, 199 BGB). Der Bereicherungsanspruch bleibt nach § 852 BGB erhalten (§ 20 S. 2).","erlaeuterung":"Bei Dauerhandlungen beginnt die Verjährung des Unterlassungsanspruchs nicht, solange die Verletzung andauert; bei wiederholten Handlungen läuft für jede Handlung eine eigene Frist."},{"id":"concept:rechtserhaltende_benutzung","type":"concept","label":"Rechtserhaltende Benutzung (§ 26)","kategorie":"Benutzungszwang","definition":"Die Marke muss von ihrem Inhaber oder mit seiner Zustimmung (§ 26 Abs. 2) im Inland (§ 26 Abs. 1) für die eingetragenen Waren/Dienstleistungen ernsthaft benutzt worden sein, es sei denn, es liegen berechtigte Gründe für die Nichtbenutzung vor. Die Benutzung in abweichender Form genügt, wenn die Abweichungen den kennzeichnenden Charakter nicht verändern (§ 26 Abs. 3); Anbringen auf Waren zum Export genügt (§ 26 Abs. 4).","erlaeuterung":"Bedeutung: Nach Ablauf der fünfjährigen Benutzungsschonfrist (§ 25 Abs. 1, § 49 Abs. 1) drohen der Verlust der Ansprüche (Einrede §§ 25, 43 Abs. 1) und die Löschung wegen Verfalls (§ 49). Benutzung als Marke: Der Verkehr muss die Verwendung als Herkunftshinweis verstehen (Funktionsbezug); rein firmenmäßige Benutzung genügt nicht."},{"id":"concept:ernsthafte_benutzung","type":"concept","label":"Ernsthafte Benutzung","kategorie":"Benutzungszwang","definition":"Eine Benutzung ist ernsthaft, wenn sie entsprechend der Hauptfunktion der Marke erfolgt, um für die Waren/Dienstleistungen einen Absatzmarkt zu erschließen oder zu sichern; symbolische Benutzung allein zum Zweck der Rechtserhaltung genügt nicht (Ansul).","erlaeuterung":"Kein Mindestumfang, aber die Benutzung muss nach Art, Umfang und Dauer wirtschaftlich sinnvoll sein (VOODOO). Zu berücksichtigen: Branche, Marktgröße, Art der Waren. Die Benutzung durch Lizenznehmer wird zugerechnet (§ 26 Abs. 2)."},{"id":"concept:abweichende_form","type":"concept","label":"Benutzung in abweichender Form (§ 26 Abs. 3)","kategorie":"Benutzungszwang","definition":"Als Benutzung gilt auch die Benutzung in einer Form, die von der Eintragung abweicht, soweit die Abweichungen den kennzeichnenden Charakter der Marke nicht verändern – auch wenn die abweichende Form selbst eingetragen ist (§ 26 Abs. 3 S. 2).","erlaeuterung":"Maßgeblich ist, ob der Verkehr die eingetragene und die benutzte Form als dasselbe Zeichen ansieht. Unschädlich: Weglassen/Hinzufügen beschreibender oder werblicher Zusätze, geringfügige graphische Modernisierung (Probiotik). Schädlich: Verschmelzung mit weiteren Bestandteilen zu einem neuen Gesamtzeichen, in dem die Marke ihre Eigenständigkeit verliert (Dorzo)."},{"id":"concept:benutzungsschonfrist","type":"concept","label":"Benutzungsschonfrist","kategorie":"Benutzungszwang","definition":"Innerhalb von fünf Jahren nach der Eintragung (bzw. nach Abschluss eines Widerspruchsverfahrens, § 26 Abs. 5) ist die Nichtbenutzung unschädlich. Erst danach können Ansprüche wegen Nichtbenutzung ausgeschlossen (§ 25) und die Marke für verfallen erklärt werden (§ 49 Abs. 1).","erlaeuterung":"Heilung: Wird die Benutzung nach Ablauf der Frist, aber vor dem Löschungsantrag aufgenommen oder wieder aufgenommen, bleibt die Marke bestehen; nicht aber, wenn die Benutzung erst innerhalb von drei Monaten vor dem Antrag in Kenntnis des drohenden Antrags aufgenommen wurde (§ 49 Abs. 1 S. 2, 3)."},{"id":"concept:nichtbenutzungseinrede","type":"concept","label":"Nichtbenutzungseinrede (§ 25, § 43 Abs. 1)","kategorie":"Benutzungszwang","definition":"Im Verletzungsprozess (§ 25 Abs. 2) und im Widerspruchsverfahren (§ 43 Abs. 1) kann der Gegner die Einrede erheben, die Marke sei innerhalb der letzten fünf Jahre nicht rechtserhaltend benutzt worden; dann muss der Inhaber die Benutzung nachweisen (im Verletzungsprozess) bzw. glaubhaft machen (im Widerspruchsverfahren).","erlaeuterung":"Die Einrede ist nur beachtlich, wenn die Benutzungsschonfrist abgelaufen ist. Maßgeblicher Zeitraum: fünf Jahre vor Klageerhebung bzw. – bei späterem Fristablauf – vor Schluss der mündlichen Verhandlung (§ 25 Abs. 2 S. 2). Beweislast liegt beim Markeninhaber (VOODOO)."},{"id":"concept:verfall","type":"concept","label":"Verfall (§ 49)","kategorie":"Verfahren","definition":"Die Marke wird auf Antrag für verfallen erklärt und gelöscht, wenn (1) sie nach der Eintragung fünf Jahre ununterbrochen nicht rechtserhaltend benutzt wurde (Abs. 1), (2) sie infolge des Verhaltens des Inhabers zur gebräuchlichen Bezeichnung geworden ist (Abs. 2 Nr. 1), (3) sie infolge ihrer Benutzung täuschend geworden ist (Abs. 2 Nr. 2) oder (4) der Inhaber die Voraussetzungen des § 7 nicht mehr erfüllt (Abs. 2 Nr. 3).","erlaeuterung":"Verfahren: Antrag beim DPMA (§ 53) oder Klage vor den ordentlichen Gerichten (§ 55). Jedermann ist antragsberechtigt (Popularantrag). Wirkung: Die Marke gilt ab Antragstellung (bzw. ab dem früheren Zeitpunkt des Verfallseintritts) als erloschen (§ 52 Abs. 1) – ex nunc."},{"id":"concept:nichtigkeit","type":"concept","label":"Nichtigkeit (§§ 50, 51)","kategorie":"Verfahren","definition":"Die Eintragung wird auf Antrag für nichtig erklärt und gelöscht, wenn die Marke entgegen §§ 3, 7 oder 8 eingetragen wurde (§ 50 – absolute Schutzhindernisse) oder ihr ein Recht mit älterem Zeitrang i.S.d. §§ 9-13 entgegensteht (§ 51 – relative Nichtigkeitsgründe).","erlaeuterung":"§ 50: Für Nr. 1-3 des § 8 Abs. 2 muss das Schutzhindernis noch im Entscheidungszeitpunkt bestehen (§ 50 Abs. 2 S. 1); Antrag nur innerhalb von zehn Jahren nach Eintragung bei Nr. 1-3 (§ 50 Abs. 2 S. 2). Feststellungslast beim Antragsteller (smartbook, Sparkassen-Rot). § 51: Nur der Inhaber des älteren Rechts ist antragsbefugt; Ausschluss bei Verwirkung (§ 51 Abs. 2) und wenn das ältere Recht selbst löschungsreif ist (§ 51 Abs. 4). Wirkung: ex tunc (§ 52 Abs. 2)."},{"id":"concept:widerspruch","type":"concept","label":"Widerspruchsverfahren (§§ 42, 43)","kategorie":"Verfahren","definition":"Innerhalb von drei Monaten nach Veröffentlichung der Eintragung kann der Inhaber eines älteren Rechts (ältere Marke, notorisch bekannte Marke, Benutzungsmarke, geschäftliche Bezeichnung, geschützte Ursprungsbezeichnung) beim DPMA Widerspruch gegen die Eintragung erheben (§ 42). Auf Einrede muss er die Benutzung seiner älteren Marke glaubhaft machen (§ 43 Abs. 1).","erlaeuterung":"Summarisches Registerverfahren ohne Beweisaufnahme (nur Glaubhaftmachung, präsente Beweismittel). Geprüft werden die Kollisionstatbestände des § 9 Abs. 1 Nr. 1-3 nach der Registerlage. Rechtsmittel: Beschwerde zum BPatG (§ 66), Rechtsbeschwerde zum BGH (§ 83). Mit dem MaMoG: Cooling-off-Frist (§ 42 Abs. 4)."},{"id":"concept:lizenz","type":"concept","label":"Lizenz (§ 30)","kategorie":"Verkehr mit Marken","definition":"Das Markenrecht kann für alle oder einen Teil der Waren/Dienstleistungen ausschließlich oder nicht ausschließlich, räumlich oder sachlich beschränkt lizenziert werden (§ 30 Abs. 1). Bei Verstoß des Lizenznehmers gegen die in § 30 Abs. 2 genannten Beschränkungen kann der Inhaber die Marke gegen ihn geltend machen; ein Inverkehrbringen unter Verstoß gegen diese Beschränkungen erfolgt ohne Zustimmung (keine Erschöpfung).","erlaeuterung":"Der Lizenznehmer kann nur mit Zustimmung des Inhabers klagen (§ 30 Abs. 3); der ausschließliche Lizenznehmer auch ohne Zustimmung, wenn der Inhaber nach Aufforderung untätig bleibt. Er kann dem Verletzungsprozess des Inhabers zur Geltendmachung eigenen Schadens beitreten (§ 30 Abs. 4). Sukzessionsschutz: § 30 Abs. 5."},{"id":"concept:aktivlegitimation","type":"concept","label":"Aktivlegitimation / Rechtsinhaberschaft","kategorie":"Rechtsfolgen","definition":"Anspruchsberechtigt ist der Markeninhaber (§ 14 Abs. 1, § 28 Abs. 1: Vermutung der Inhaberschaft für den Eingetragenen) sowie der Lizenznehmer unter den Voraussetzungen des § 30 Abs. 3.","erlaeuterung":"Prüfung im Verletzungsprozess: Bestehen der Marke (Eintragung, § 4 Nr. 1; keine Löschung), Inhaberschaft, ggf. Rechtsübergang (§ 27) und Prozessstandschaft. Bei Unionsmarken: Art. 9 UMV, Zuständigkeit der Unionsmarkengerichte (§ 125e)."},{"id":"concept:unterlassungsanspruch","type":"concept","label":"Unterlassungsanspruch (§ 14 Abs. 5)","kategorie":"Rechtsfolgen","definition":"Wer ein Zeichen entgegen § 14 Abs. 2 bis 4 benutzt, kann vom Markeninhaber bei Wiederholungsgefahr auf Unterlassung in Anspruch genommen werden; der Anspruch besteht auch bei Erstbegehungsgefahr (§ 14 Abs. 5 S. 2). Verschulden ist nicht erforderlich.","erlaeuterung":"Die Wiederholungsgefahr wird durch eine begangene Verletzung vermutet und regelmäßig nur durch eine strafbewehrte Unterlassungserklärung ausgeräumt. Durchsetzung: Abmahnung, einstweilige Verfügung (Dringlichkeit), Hauptsacheklage; Kennzeichenstreitsachen vor den Landgerichten (§ 140). Verhältnismäßigkeitsprüfung bei Vernichtung (§ 18 Abs. 3)."},{"id":"concept:schadensersatz","type":"concept","label":"Schadensersatz (§ 14 Abs. 6) und dreifache Schadensberechnung","kategorie":"Rechtsfolgen","definition":"Wer die Verletzungshandlung vorsätzlich oder fahrlässig begeht, ist zum Ersatz des entstandenen Schadens verpflichtet. Berechnung nach Wahl des Verletzten: (1) konkreter Schaden inkl. entgangenem Gewinn, (2) Herausgabe des Verletzergewinns (§ 14 Abs. 6 S. 2), (3) angemessene Lizenzgebühr (Lizenzanalogie, § 14 Abs. 6 S. 3).","erlaeuterung":"Fahrlässigkeit wird bei Kennzeichenverletzungen im geschäftlichen Verkehr regelmäßig bejaht (Prüfungspflicht). Bei der Lizenzanalogie ist zu fragen, was vernünftige Parteien bei Kenntnis der Sachlage vereinbart hätten (BTK). Daneben: Bereicherungsanspruch (§ 812 BGB), Auskunft zur Bezifferung (§ 19, § 242 BGB), Haftung des Betriebsinhabers für Angestellte (§ 14 Abs. 7)."},{"id":"concept:lizenzanalogie","type":"concept","label":"Lizenzanalogie","kategorie":"Rechtsfolgen","definition":"Methode der Schadensberechnung: Der Verletzer schuldet den Betrag, den er als angemessene Vergütung hätte entrichten müssen, wenn er die Erlaubnis zur Nutzung des Kennzeichens eingeholt hätte (§ 14 Abs. 6 S. 3).","erlaeuterung":"Bemessungsfaktoren: Bekanntheit und Ruf der Marke, Grad der Verwechslungsgefahr, Umfang/Dauer der Benutzung, branchenübliche Lizenzsätze (Umsatzlizenz). Die Lizenzierung von Unternehmenskennzeichen ist verkehrsüblich (BTK)."},{"id":"concept:vernichtung_auskunft","type":"concept","label":"Vernichtung, Rückruf, Auskunft (§§ 18, 19)","kategorie":"Rechtsfolgen","definition":"Der Verletzte kann Vernichtung der widerrechtlich gekennzeichneten Waren und der Herstellungsmittel (§ 18 Abs. 1) sowie Rückruf und Entfernung aus den Vertriebswegen (§ 18 Abs. 2) verlangen, soweit verhältnismäßig (§ 18 Abs. 3). Ferner Auskunft über Herkunft und Vertriebsweg (§ 19), auch gegen Dritte (§ 19 Abs. 2), bei offensichtlicher Verletzung im Eilverfahren (§ 19 Abs. 7).","erlaeuterung":"Ergänzende Ansprüche: Vorlage/Besichtigung (§ 19a), Sicherung von Schadensersatz (§ 19b), Urteilsbekanntmachung (§ 19c). Alle setzen eine Verletzung nach §§ 14, 15, 17 voraus, kein Verschulden."},{"id":"concept:stoererhaftung","type":"concept","label":"Täter-, Teilnehmer- und Störerhaftung","kategorie":"Rechtsfolgen","definition":"Täter ist, wer die Verletzungshandlung selbst (oder mittäterschaftlich) begeht; Teilnehmer (Anstifter/Gehilfe) haftet bei vorsätzlicher Beteiligung an einer vorsätzlichen Haupttat; Störer ist, wer willentlich und adäquat kausal zur Verletzung beiträgt und zumutbare Prüfpflichten verletzt – er haftet nur auf Unterlassung, nicht auf Schadensersatz.","erlaeuterung":"Plattformbetreiber (eBay, Amazon) haften als Störer erst nach Hinweis auf eine klare Rechtsverletzung, wenn sie das Angebot nicht sperren und keine Vorkehrungen gegen gleichartige Verletzungen treffen (Internet-Versteigerung II, Kinderhochstühle). Im Lauterkeitsrecht wurde die Störerhaftung aufgegeben, im Markenrecht beibehalten. Befüllen markierter Behältnisse: Täterschaft nur beim Befüllenden, ggf. Teilnahme des Lieferanten (Tork)."},{"id":"concept:keyword_advertising","type":"concept","label":"Keyword-Advertising","kategorie":"Verletzung","definition":"Die Buchung einer fremden Marke als Schlüsselwort für Suchmaschinenwerbung ist eine Benutzung im geschäftlichen Verkehr für Waren/Dienstleistungen. Sie verletzt die Herkunftsfunktion nur, wenn aus der Anzeige für den normal informierten Internetnutzer nicht oder nur schwer zu erkennen ist, ob die beworbenen Waren vom Markeninhaber, einem verbundenen Unternehmen oder einem Dritten stammen.","erlaeuterung":"BGH-Linie: Regelmäßig keine Verletzung, wenn die Anzeige in einem abgesetzten Werbeblock erscheint, die Marke nicht enthält und die Domain auf ein anderes Unternehmen hinweist (Bananabay II, MOST-Pralinen). Ausnahme bei nahegelegter wirtschaftlicher Verbindung (Fleurop) und bei Anzeigen, die zu gemischten Angebotslisten führen (ORTLIEB II). Bei bekannten Marken zusätzlich § 14 Abs. 2 Nr. 3 (Interflora: Alternative anbieten ist zulässig, Nachahmungen anbieten nicht)."},{"id":"concept:geschaeftliche_bezeichnung","type":"concept","label":"Geschäftliche Bezeichnungen (§ 5)","kategorie":"Geschäftliche Bezeichnungen","definition":"Oberbegriff für Unternehmenskennzeichen (§ 5 Abs. 2) und Werktitel (§ 5 Abs. 3). Sie entstehen ohne Eintragung durch Benutzung und gewähren ein ausschließliches Recht nach § 15.","erlaeuterung":"Der Schutz geschäftlicher Bezeichnungen ist neben dem Markenschutz eigenständig; das Prioritätsprinzip (§ 6) gilt im Verhältnis zu Marken. Ansprüche: § 15 Abs. 4-6 (Unterlassung, Schadensersatz) i.V.m. §§ 18, 19."},{"id":"concept:unternehmenskennzeichen","type":"concept","label":"Unternehmenskennzeichen (§ 5 Abs. 2)","kategorie":"Geschäftliche Bezeichnungen","definition":"Zeichen, die im geschäftlichen Verkehr als Name, Firma oder besondere Bezeichnung eines Geschäftsbetriebs oder Unternehmens benutzt werden (§ 5 Abs. 2 S. 1); Geschäftsabzeichen und sonstige Unterscheidungszeichen stehen ihnen bei Verkehrsgeltung gleich (§ 5 Abs. 2 S. 2).","erlaeuterung":"Entstehung: durch Aufnahme der Benutzung im Inland, sofern das Zeichen originär unterscheidungskräftig (namensmäßig) ist; sonst durch Verkehrsgeltung. Auch Firmenschlagworte und -abkürzungen sind selbständig geschützt, wenn sie unterscheidungskräftig sind. Domainnamen können Unternehmenskennzeichen sein (soco.de). Verletzung nach § 15 Abs. 2: Verwechslungsgefahr unter Berücksichtigung von Branchennähe, Kennzeichnungskraft und Zeichenähnlichkeit (defacto)."},{"id":"concept:firmenschlagwort","type":"concept","label":"Firmenschlagwort / Firmenbestandteil","kategorie":"Geschäftliche Bezeichnungen","definition":"Ein Bestandteil einer Firma genießt selbständigen Kennzeichenschutz, wenn er seiner Natur nach geeignet ist, im Verkehr als schlagwortartiger Hinweis auf das Unternehmen zu wirken (Unterscheidungskraft), ohne dass eine tatsächliche schlagwortartige Verwendung erforderlich ist.","erlaeuterung":"Beispiel: 'defacto' in 'defacto marketing GmbH'; beschreibende Bestandteile und Rechtsformzusätze sind nicht schutzfähig. Schutz entsteht mit dem Schutz der Gesamtbezeichnung."},{"id":"concept:branchennaehe","type":"concept","label":"Branchennähe","kategorie":"Geschäftliche Bezeichnungen","definition":"Bei der Verwechslungsgefahr zwischen Unternehmenskennzeichen (§ 15 Abs. 2) tritt an die Stelle der Waren-/Dienstleistungsähnlichkeit die Branchennähe: Berührungspunkte der Unternehmen auf dem Markt nach Art der Waren/Dienstleistungen, Vertriebswegen, Kundenkreisen.","erlaeuterung":"Wechselwirkung mit Kennzeichnungskraft und Zeichenähnlichkeit. Bei absoluter Branchenverschiedenheit scheidet Verwechslungsgefahr aus; dann ggf. Bekanntheitsschutz nach § 15 Abs. 3."},{"id":"concept:werktitel","type":"concept","label":"Werktitel (§ 5 Abs. 3)","kategorie":"Geschäftliche Bezeichnungen","definition":"Namen oder besondere Bezeichnungen von Druckschriften, Filmwerken, Tonwerken, Bühnenwerken oder sonstigen vergleichbaren Werken (auch Software, Apps, Spiele, Internetangebote). Der Titel kennzeichnet das Werk als solches (Individualisierungsfunktion), nicht seine betriebliche Herkunft.","erlaeuterung":"Entstehung durch Benutzungsaufnahme (Erscheinen) eines unterscheidungskräftigen Titels; Vorverlagerung durch Titelschutzanzeige. Geringere Anforderungen an die Unterscheidungskraft als bei Marken, insbesondere bei Zeitschriften (Verkehrsgewöhnung), nicht aber bei Apps/Domains ohne feststellbare Gewöhnung (wetter.de). Verletzung § 15 Abs. 2: grundsätzlich nur unmittelbare Werkverwechslung; Verwechslungsgefahr im weiteren Sinne nur bei bekannten Titeln mit Herkunftshinweisfunktion (Augsburger Puppenkiste). Inhaber ist, wem das Werk zuzuordnen ist (Das Omen)."},{"id":"concept:domain","type":"concept","label":"Domainname als Kennzeichen","kategorie":"Geschäftliche Bezeichnungen","definition":"Ein Domainname ist selbst kein Kennzeichenrecht, kann aber durch Benutzung im geschäftlichen Verkehr als Unternehmenskennzeichen (§ 5 Abs. 2), Werktitel (§ 5 Abs. 3) oder – bei Verkehrsgeltung – als Benutzungsmarke (§ 4 Nr. 2) Schutz erlangen. Die Registrierung allein begründet kein Kennzeichenrecht.","erlaeuterung":"Die Benutzung eines fremden Kennzeichens als Domain kann §§ 14, 15 verletzen (markenmäßige Benutzung, wenn der Verkehr die Domain als Herkunftshinweis versteht) oder das Namensrecht (§ 12 BGB) verletzen (Domain-Grabbing). Bei Gleichnamigkeit: Priorität der Registrierung, Ausnahme bei überragender Bekanntheit (shell.de)."},{"id":"concept:verhaeltnis_uwg","type":"concept","label":"Verhältnis MarkenG – UWG – § 12 BGB","kategorie":"Grundlagen","definition":"Das MarkenG schließt die Anwendung anderer Vorschriften nicht aus (§ 2). Nach Aufgabe der 'Vorrangthese' (Hard Rock Cafe) können lauterkeitsrechtliche Ansprüche (§§ 4 Nr. 3, 5 Abs. 2 UWG) neben kennzeichenrechtlichen bestehen; Wertungswidersprüche zu den markenrechtlichen Schranken sind aber zu vermeiden.","erlaeuterung":"§ 12 BGB (Namensrecht) ist neben §§ 5, 15 anwendbar, insbesondere außerhalb des geschäftlichen Verkehrs und bei Domain-Registrierungen. Geographische Herkunftsangaben werden über §§ 126 ff. MarkenG und daneben über das UWG geschützt."},{"id":"concept:geographische_herkunftsangabe","type":"concept","label":"Geographische Herkunftsangaben (§§ 126 ff.)","kategorie":"Sonstige Kennzeichen","definition":"Namen von Orten, Gegenden, Gebieten oder Ländern sowie sonstige Angaben oder Zeichen, die im geschäftlichen Verkehr zur Kennzeichnung der geographischen Herkunft von Waren oder Dienstleistungen benutzt werden (§ 126 Abs. 1). Sie dürfen nicht für Waren anderer Herkunft benutzt werden, wenn Irreführungsgefahr besteht (§ 127 Abs. 1); qualifizierte Angaben und bekannte Angaben genießen erweiterten Schutz (§ 127 Abs. 2, 3).","erlaeuterung":"Kein subjektives Ausschließlichkeitsrecht, sondern kollektiver Schutz (Klagebefugnis nach § 128 i.V.m. § 8 Abs. 3 UWG). Daneben unionsrechtlicher Schutz eingetragener g.U./g.g.A. (VO (EU) Nr. 1151/2012, §§ 130 ff.). Als Marke sind geographische Angaben regelmäßig freihaltebedürftig (§ 8 Abs. 2 Nr. 2), können aber als Kollektivmarke eingetragen werden (§ 99)."},{"id":"concept:kollektivmarke","type":"concept","label":"Kollektivmarke und Gewährleistungsmarke (§§ 97 ff., 106a ff.)","kategorie":"Sonstige Kennzeichen","definition":"Kollektivmarke: Marke eines rechtsfähigen Verbands, die Waren/Dienstleistungen der Mitglieder nach Herkunft, Beschaffenheit oder sonstigen Eigenschaften unterscheidet (§ 97); auch geographische Herkunftsangaben sind eintragbar (§ 99). Gewährleistungsmarke: Marke, die Waren/Dienstleistungen hinsichtlich garantierter Eigenschaften (Material, Qualität, Herstellungsweise) von anderen unterscheidet, deren Inhaber die Waren nicht selbst vertreibt (§ 106a).","erlaeuterung":"Beide erfordern eine Markensatzung (§ 102, § 106d). Die Gewährleistungsmarke wurde mit dem MaMoG 2019 eingeführt (z.B. Prüf- und Gütesiegel)."},{"id":"concept:unionsmarke","type":"concept","label":"Unionsmarke (UMV) und Koexistenz","kategorie":"EU- und IR-Marken","definition":"Die Unionsmarke (VO (EU) 2017/1001, UMV) wird beim EUIPO eingetragen und gewährt einheitlichen Schutz im gesamten Gebiet der EU (Einheitlichkeitsgrundsatz, Art. 1 Abs. 2 UMV). Sie besteht neben den nationalen Marken (Koexistenz); beide Systeme sind über § 125b MarkenG und Art. 8 Abs. 2 UMV wechselseitig als ältere Rechte verzahnt.","erlaeuterung":"Materiell entsprechen die Verletzungstatbestände des Art. 9 Abs. 2 lit. a-c UMV den § 14 Abs. 2 Nr. 1-3, die Schranken Art. 14 (= § 23) und Art. 15 (= § 24) UMV. Normkette beim Vorgehen in Deutschland: Art. 9 UMV (Anspruch) → § 125b Nr. 2 (Schadensersatz, Vernichtung, Auskunft aus dem MarkenG) → § 125e (Unionsmarkengerichte) → Art. 123 ff. UMV (Zuständigkeit, Vermutung der Gültigkeit, Widerklage, Sanktionen). Beim Angriff auf deutsche Marken: § 125b Nr. 1 (§ 9 gilt, Bekanntheit in der Union), Nr. 4/5 (Benutzung nach Art. 18 UMV). Beim Angriff auf die Unionsmarke aus einer deutschen Marke: Art. 8 Abs. 1, 5 UMV (Widerspruch, Art. 46), Art. 60 Abs. 1 lit. a (Nichtigkeit), Art. 47 Abs. 2, 3 (Benutzungsnachweis). Seniorität: Art. 39, 40 UMV, § 125c. Umwandlung: Art. 139 ff. UMV, § 125d. Die MarkenRL (RL (EU) 2015/2436) harmonisiert das nationale Recht; das MarkenG ist richtlinienkonform auszulegen."},{"id":"concept:relative_schutzhindernis_bekannt","type":"concept","label":"Bekannte Marke als relatives Schutzhindernis (§ 9 Abs. 1 Nr. 3)","kategorie":"Schutzvoraussetzungen","definition":"Die Eintragung einer jüngeren Marke kann gelöscht werden, wenn sie mit einer angemeldeten oder eingetragenen älteren Marke identisch oder ihr ähnlich ist, die ältere Marke im Inland bekannt ist und die Benutzung der jüngeren Marke die Unterscheidungskraft oder die Wertschätzung der bekannten Marke ohne rechtfertigenden Grund in unlauterer Weise ausnutzen oder beeinträchtigen würde.","erlaeuterung":"Registerrechtliches Spiegelbild des § 14 Abs. 2 Nr. 3; die Auslegung ist identisch. Geltendmachung nur durch den Inhaber der älteren Marke im Widerspruch (§ 42 Abs. 2 Nr. 1) oder Nichtigkeitsverfahren (§ 51 Abs. 1 mit §§ 53, 55). Besonderheiten: (1) Zeitpunkt – die Bekanntheit muss am Anmelde-/Prioritätstag der jüngeren Marke bestehen (§ 51 Abs. 3) und bei der Entscheidung fortbestehen; (2) Prognose – geprüft wird die hypothetische Benutzung der jüngeren Marke für die eingetragenen Waren (Registerlage), nicht der tatsächliche Marktauftritt ('würde'); (3) Waren – seit dem MaMoG 2019 für alle Waren, auch identische/ähnliche; (4) gedankliche Verknüpfung als ungeschriebene Voraussetzung; (5) im Widerspruch nur Glaubhaftmachung mit präsenten Beweismitteln, daher praktisch oft Nichtigkeitsklage nach § 55. Aus einer Unionsmarke tritt die Bekanntheit in der Union an die Stelle der Bekanntheit im Inland (§ 125b Nr. 1)."},{"id":"concept:koexistenz_22","type":"concept","label":"Ausschluss von Ansprüchen bei Bestandskraft der jüngeren Marke (§ 22)","kategorie":"Schranken","definition":"Der Inhaber des älteren Kennzeichens kann die Benutzung einer eingetragenen jüngeren Marke nicht untersagen, wenn ein Nichtigkeitsantrag gegen sie zurückgewiesen wurde oder zurückzuweisen wäre, weil (1) das ältere Zeichen am Prioritätstag der jüngeren Marke noch nicht bekannt war (§ 51 Abs. 3), (2) die ältere Marke damals löschungsreif war (§ 51 Abs. 4) oder (3) damals noch keine Verwechslungsgefahr bestand (§ 22 Abs. 1). Umgekehrt kann auch der Inhaber der jüngeren Marke die ältere nicht untersagen (§ 22 Abs. 2): Koexistenz.","erlaeuterung":"Praktische Bedeutung für § 9 Abs. 1 Nr. 3 / § 14 Abs. 2 Nr. 3: Erlangt eine Marke erst nach dem Prioritätstag der jüngeren Marke Bekanntheit, kann sie weder deren Löschung (§ 51 Abs. 3) noch die Unterlassung ihrer Benutzung für die eingetragenen Waren (§ 22 Abs. 1 Nr. 1) verlangen. Die Bekanntheit muss also zum richtigen Zeitpunkt vorliegen. Für Unionsmarken gilt § 21 Abs. 1 entsprechend (§ 125b Nr. 3); Art. 16 UMV enthält die Parallelregelung."},{"id":"concept:bekanntheit_union","type":"concept","label":"Bekanntheit in der Union (§ 125b Nr. 1, Art. 9 Abs. 2 lit. c UMV)","kategorie":"EU- und IR-Marken","definition":"Wird aus einer Unionsmarke nach § 9 Abs. 1 Nr. 3 gegen eine deutsche Marke vorgegangen, tritt an die Stelle der Bekanntheit im Inland die Bekanntheit in der Union. Sie liegt vor, wenn die Marke einem bedeutenden Teil des Publikums in einem wesentlichen Teil des Unionsgebiets bekannt ist; ein einziger Mitgliedstaat kann genügen (PAGO).","erlaeuterung":"Zweistufige Prüfung nach EuGH Iron & Smith: (1) Bekanntheit in der Union – auch wenn der wesentliche Teil nicht Deutschland ist; (2) für die Ausnutzung/Beeinträchtigung im Inland muss die Unionsmarke aber einem wirtschaftlich nicht unbedeutenden Teil des inländischen Publikums bekannt sein, sonst fehlt die gedankliche Verknüpfung im Kollisionsgebiet. Für Verletzungsansprüche aus Art. 9 Abs. 2 lit. c UMV gilt derselbe Maßstab."},{"id":"concept:benutzung_union","type":"concept","label":"Ernsthafte Benutzung der Unionsmarke (Art. 18 UMV, § 125b Nr. 4, 5)","kategorie":"EU- und IR-Marken","definition":"Bei Widerspruch oder Nichtigkeitsantrag aus einer Unionsmarke tritt an die Stelle der Benutzung nach § 26 die ernsthafte Benutzung in der Union nach Art. 18 UMV. Die Grenzen der Mitgliedstaaten bleiben außer Betracht; Benutzung in einem Mitgliedstaat kann genügen, wenn sie nach Markt, Waren und Umfang geeignet ist, Marktanteile in der Union zu halten oder zu gewinnen (Leno Merken).","erlaeuterung":"Benutzungsschonfrist: fünf Jahre ab Eintragung der Unionsmarke (Art. 18 Abs. 1 UMV). Im Verletzungsprozess vor dem Unionsmarkengericht kann der Verfall wegen Nichtbenutzung als Einwand erhoben werden (Art. 127 Abs. 3 UMV), im Übrigen nur per Widerklage (Art. 128). Vor dem EUIPO: Benutzungsnachweis nach Art. 47 Abs. 2 (Unionsmarke) bzw. Abs. 3 (nationale Marke)."},{"id":"concept:unionsmarkengericht","type":"concept","label":"Unionsmarkengerichte und Verfahren (§ 125e, Art. 123 ff. UMV)","kategorie":"EU- und IR-Marken","definition":"Verletzungsklagen aus Unionsmarken sind ausschließlich vor den Unionsmarkengerichten zu erheben (Art. 124 UMV; in Deutschland die von den Ländern bestimmten Landgerichte, § 125e). International zuständig ist primär das Gericht des Beklagtensitzes (Art. 125 Abs. 1-4) mit unionsweiter Kognition; wahlweise das Gericht des Handlungsorts (Art. 125 Abs. 5), dann beschränkt auf Handlungen in diesem Mitgliedstaat (Art. 126 Abs. 2).","erlaeuterung":"Weitere Regeln: Vermutung der Gültigkeit und Nichtbenutzungseinwand (Art. 127), Widerklage auf Verfall/Nichtigkeit (Art. 128), anwendbares nationales Recht für nicht geregelte Fragen (Art. 129, § 125b Nr. 2), unionsweites Verbot als Regelfall mit Beschränkung auf das Gebiet der tatsächlichen Verletzung (Art. 130; DHL/Chronopost, combit), Aussetzung bei parallelen Verfahren vor dem EUIPO (Art. 132). Für IR-Marken mit Benennung EU gelten dieselben Regeln (Art. 189 ff. UMV)."},{"id":"concept:senioritaet","type":"concept","label":"Seniorität und Umwandlung (Art. 39, 40, 139 ff. UMV; §§ 125c, 125d)","kategorie":"EU- und IR-Marken","definition":"Seniorität: Der Inhaber einer identischen älteren nationalen Marke kann deren Zeitrang für die Unionsmarke in Anspruch nehmen; lässt er die nationale Marke dann fallen, gelten ihre Rechte in dem Mitgliedstaat als fortbestehend (Art. 39, 40 UMV). Umwandlung: Scheitert die Unionsmarke, kann sie unter Wahrung ihres Zeitrangs in nationale Anmeldungen umgewandelt werden (Art. 139 ff. UMV, § 125d).","erlaeuterung":"§ 125c erlaubt die nachträgliche Feststellung, dass die erloschene deutsche Marke, deren Seniorität beansprucht wurde, löschungsreif war – dann entfällt die Seniorität. Parallel bei IR-Marken: Umwandlung nach Art. 9quinquies PMMA, § 125 MarkenG."},{"id":"concept:ir_marke","type":"concept","label":"International registrierte Marke (IR-Marke, Madrider System)","kategorie":"EU- und IR-Marken","definition":"Marke, die über die WIPO auf Grundlage einer Basismarke/-anmeldung nach dem Madrider Markenabkommen (MMA, §§ 107-118) oder – heute praktisch ausschließlich – dem Protokoll zum MMA (PMMA, §§ 119-125) international registriert und auf Deutschland erstreckt wurde. Sie hat dieselbe Wirkung wie eine am Tag der internationalen Registrierung (bzw. der nachträglichen Schutzerstreckung) beim DPMA angemeldete und eingetragene Marke (§ 112, § 124).","erlaeuterung":"Folgen: Die IR-Marke (DE) ist Basis für § 9, § 14, Widerspruch und Nichtigkeitsantrag (§ 116) mit dem Zeitrang der internationalen Registrierung (Art. 3 Abs. 4, Art. 3ter PMMA) zuzüglich PVÜ-Priorität. Die Wirkung gilt als nicht eingetreten, wenn der Schutz nach §§ 113-115 verweigert wird (§ 112 Abs. 2). Eine IR-Marke mit Benennung 'EU' gilt als Unionsmarke (Art. 189 ff. UMV); dann gelten § 125b und die UMV. Abhängigkeit: Fünf Jahre lang teilt die IR-Marke das Schicksal der Basismarke ('central attack', Art. 6 PMMA); danach Umwandlung in nationale Anmeldungen (Art. 9quinquies PMMA, § 125)."},{"id":"concept:ir_schutzverweigerung","type":"concept","label":"Schutzverweigerung und Widerspruch gegen IR-Marken (§§ 113-115)","kategorie":"EU- und IR-Marken","definition":"Das DPMA prüft die auf Deutschland erstreckte IR-Marke auf absolute Schutzhindernisse wie eine Anmeldung (§ 113) und muss eine Schutzverweigerung innerhalb der Frist des Art. 5 Abs. 2 PMMA (12 bzw. 18 Monate) an die WIPO mitteilen. Der Widerspruch (§ 114) richtet sich gegen die Schutzgewährung; die Frist beginnt mit dem ersten Tag des Monats nach dem Ausgabemonat der WIPO-Gazette. An die Stelle der Löschung tritt die Verweigerung bzw. nachträgliche Entziehung des Schutzes (§ 114 Abs. 3, § 115).","erlaeuterung":"§ 115 Abs. 1: Verfall und Nichtigkeit (§§ 49-51) führen zur Schutzentziehung statt zur Löschung. § 115 Abs. 2 bestimmt, welcher Tag für Fristen an die Stelle des Eintragungstags tritt (Ablauf der Schutzverweigerungsfrist bzw. rechtskräftige Schutzgewährung) – darauf verweisen §§ 116, 117."},{"id":"concept:ir_benutzungsschonfrist","type":"concept","label":"Benutzungsschonfrist und Einreden bei IR-Marken (§§ 115 Abs. 2, 116, 117)","kategorie":"EU- und IR-Marken","definition":"Für IR-Marken tritt an die Stelle des Eintragungstags (§ 26 Abs. 5, § 25, § 43 Abs. 1, § 53 Abs. 6) einer der in § 115 Abs. 2 bezeichneten Tage: der Ablauf der Schutzverweigerungsfrist nach Art. 5 Abs. 2 PMMA oder – bei zunächst verweigertem Schutz – der Tag der rechtskräftigen Schutzgewährung. Ab dann läuft die fünfjährige Benutzungsschonfrist.","erlaeuterung":"§ 116 Abs. 1: Nichtbenutzungseinrede im Widerspruch aus einer IR-Marke; § 116 Abs. 2: im Nichtigkeitsverfahren aus einer IR-Marke; § 117: Einrede nach § 25 im Verletzungsprozess aus einer IR-Marke. Rechtserhaltend ist die Benutzung im Inland nach § 26 (bei Benennung EU: Art. 18 UMV)."},{"id":"concept:markenrl","type":"concept","label":"Markenrechtsrichtlinie (EU) 2015/2436 (MarkenRL)","kategorie":"EU- und IR-Marken","definition":"Richtlinie des Europäischen Parlaments und des Rates vom 16. Dezember 2015 zur Angleichung der Rechtsvorschriften der Mitgliedstaaten über die Marken (Neufassung der RL 2008/95/EG). Sie harmonisiert das materielle Markenrecht (Markenformen, Schutzhindernisse, Rechte aus der Marke, Schranken, Benutzungszwang, Verfall) und erstmals wesentliche Verfahrensregeln (Widerspruch, Verfall und Nichtigkeit vor dem Amt, Klassifizierung, Schutzdauer) der nationalen Markensysteme.","erlaeuterung":"Umsetzung in Deutschland durch das Markenrechtsmodernisierungsgesetz (MaMoG) vom 11.12.2018 mit Wirkung zum 14.1.2019; das Verwaltungsverfahren für Verfall und Nichtigkeit (Art. 45 MarkenRL) gilt seit 1.5.2020. Das MarkenG ist richtlinienkonform auszulegen; Auslegungsfragen legt der BGH dem EuGH vor (Art. 267 AEUV). Die MarkenRL ist parallel zur Unionsmarkenverordnung formuliert, sodass EuGH-Rechtsprechung zur UMV regelmäßig auf das MarkenG übertragbar ist. Nicht harmonisiert: Benutzungsmarken, geschäftliche Bezeichnungen, Rechtsfolgen der Verletzung (dazu Durchsetzungsrichtlinie 2004/48/EG)."},{"id":"concept:richtlinienkonforme_auslegung","type":"concept","label":"Richtlinienkonforme Auslegung und Vorlage an den EuGH","kategorie":"EU- und IR-Marken","definition":"Nationale Gerichte und das DPMA müssen das MarkenG so auslegen, dass Wortlaut und Zweck der MarkenRL erreicht werden (Art. 288 AEUV). Ist die Auslegung der Richtlinie zweifelhaft, kann jedes Gericht dem EuGH vorlegen; letztinstanzliche Gerichte (BGH) müssen vorlegen (Art. 267 AEUV).","erlaeuterung":"Praktische Folgen: Begriffe wie Unterscheidungskraft, Verwechslungsgefahr, Bekanntheit, ernsthafte Benutzung oder Erschöpfung sind unionsrechtliche Begriffe mit einheitlicher Bedeutung; Auslegungsspielräume des nationalen Rechts bestehen nur, wo die Richtlinie Optionen einräumt (etwa Art. 4 Abs. 3, Art. 5 Abs. 4 MarkenRL). Beispiel: BGH #darferdas? II nach EuGH C-541/18; BGH OTTO Cap (richtlinienkonforme Auslegung des § 14 Abs. 2 Nr. 3 vor dem MaMoG)."},{"id":"concept:transit","type":"concept","label":"Transitverbot (§ 14a MarkenG, Art. 10 Abs. 4 MarkenRL)","kategorie":"Verletzung","definition":"Der Markeninhaber kann verhindern, dass Dritte Waren aus Drittstaaten, die ohne Zustimmung mit einer identischen oder in wesentlichen Aspekten nicht unterscheidbaren Marke versehen sind, unter zollamtlicher Überwachung nach Deutschland verbringen, auch wenn sie hier nicht in den Verkehr gebracht werden sollen.","erlaeuterung":"Reaktion auf EuGH Philips/Nokia (C-446/09, C-495/09), wonach bloßer Transit keine Verletzung war. Das Recht erlischt, wenn der Anmelder oder Besitzer der Waren im Verletzungsverfahren nachweist, dass der Markeninhaber im Bestimmungsland die Vermarktung nicht verbieten könnte (§ 14a Abs. 2 MarkenG). Durchsetzung über die Grenzbeschlagnahme (§§ 146 ff. MarkenG, VO (EU) Nr. 608/2013)."},{"id":"concept:vorbereitungshandlungen","type":"concept","label":"Verbot von Vorbereitungshandlungen (§ 14 Abs. 4 MarkenG, Art. 11 MarkenRL)","kategorie":"Verletzung","definition":"Der Inhaber kann Dritten verbieten, die Marke auf Aufmachungen, Verpackungen, Etiketten, Anhängern oder Sicherheits- und Echtheitshinweisen anzubringen sowie solche Kennzeichnungsmittel anzubieten, in Verkehr zu bringen, zu besitzen oder ein- und auszuführen, wenn die Gefahr besteht, dass sie für eine verletzende Kennzeichnung von Waren benutzt werden.","erlaeuterung":"Vorverlagerung des Markenschutzes gegen Produktpiraterie: Erfasst wird schon der Handel mit gefälschten Etiketten und Verpackungen, bevor sie mit der Ware verbunden werden. Die Gefahr einer Verletzung ist Tatbestandsmerkmal."},{"id":"concept:agentenmarke","type":"concept","label":"Agentenmarke (§§ 11, 17 MarkenG, Art. 13 MarkenRL)","kategorie":"Schutzvoraussetzungen","definition":"Meldet ein Agent oder Vertreter des Markeninhabers dessen Marke ohne Zustimmung auf eigenen Namen an, ist die Eintragung löschbar (§ 11, relatives Schutzhindernis) und der Inhaber kann die Übertragung der Marke sowie Unterlassung verlangen (§ 17).","erlaeuterung":"U
